<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONA Trade</title><link rel="alternate" hreflang="ru" href="index.html"><link rel="alternate" hreflang="en" href="en/index.html"><link rel="alternate" hreflang="x-default" href="index.html">
</head><body><script>(()=>{
  'use strict';
  const q=new URLSearchParams(location.search);
  if(innerWidth<=900 && q.get('desktop')!=='1'){
    location.replace('mobile/home.html');
    return;
  }
  const explicit=q.get('layout');
  const mode=(explicit==='large'||explicit==='compact')?explicit:(innerWidth>=1600?'large':'compact');
  try{sessionStorage.setItem('ronaDesktopLayout',mode)}catch(_){}
  location.replace('pages/home_'+mode+'.html?layout='+mode);
})()</script></body></html>
