<script id="rona-public-mobile-shell-runtime-v1">
(()=>{
  'use strict';
  if(!matchMedia('(max-width:767px)').matches) return;
  const scene=document.getElementById('scene'),frame=document.getElementById('frame');
  if(!scene||!frame)return;
  try{sessionStorage.setItem('ronaDesktopLayout','compact')}catch(_){}
  scene.style.setProperty('left','0','important');

  frame.style.setProperty('width','100vw','important');
  frame.style.setProperty('height','100dvh','important');
  const wanted='inner/about_compact.html?layout=compact';
  if(!frame.src.endsWith(wanted)) frame.src=wanted;
  const lock=()=>{
    scene.style.setProperty('left','0','important');scene.style.setProperty('top','0','important');
    scene.style.setProperty('width','100vw','important');scene.style.setProperty('height','100dvh','important');scene.style.setProperty('transform','none','important');
    frame.style.setProperty('width','100vw','important');frame.style.setProperty('height','100dvh','important');
  };
  addEventListener('resize',lock,{passive:true});lock();
  window.__RONA_MOBILE_SHELL__={mode:'compact',scaled:false};
})();
