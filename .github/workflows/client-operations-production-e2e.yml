name: Client applications and deals production E2E

on:
  push:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  client-operations-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright using preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Wait for exact production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let i=0;i<150;i++){
              const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-CLIENT-OPS-E2E'}});
              if(r.ok){
                const j=await r.json(),runs=j.check_runs||[];
                const pages=runs.find(x=>x.name==='Cloudflare Pages');
                const worker=runs.find(x=>x.name==='Workers Builds: ronatrade-com');
                if(pages?.status==='completed'&&pages.conclusion!=='success')throw new Error(`Cloudflare Pages ${pages.conclusion}`);
                if(worker?.status==='completed'&&worker.conclusion!=='success')throw new Error(`ronatrade-com ${worker.conclusion}`);
                if(pages?.status==='completed'&&pages.conclusion==='success'&&worker?.status==='completed'&&worker.conclusion==='success'){
                  await sleep(7000);
                  console.log(`PRODUCTION_DEPLOYMENT_CONVERGED sha=${sha}`);
                  return;
                }
              }
              await sleep(3000);
            }
            throw new Error('production deployment convergence timeout');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Client C003 applications and deals authenticated production proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const {chromium}=require('playwright');
          const base='https://ronaoil.com';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN;
          const clientId='RONA-C003',contractId='RONA-C003-CTR-2026-001';
          const expectedApplications=['RONA-C003-IN-2026-001','RONA-C003-IN-2026-002'];
          const expectedDeals=['DEAL-2026-005','DEAL-2026-006'];
          const suffix=`${runId}_${attempt}`,clientLogin=`qa_client_ops_${suffix}`,clientEmail=`qa-client-ops-${suffix}@example.invalid`,password='Aa1!'+crypto.randomBytes(18).toString('base64url')+'!';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const runUrl=`https://github.com/${repo}/actions/runs/${runId}`;
          let adminCookie='',clientUserId='',browser=null;

          async function status(state,description){try{await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'},body:JSON.stringify({state,context:'rona/client-operations-production-e2e',description:String(description).slice(0,140),target_url:runUrl})})}catch{}}
          async function broker(){let last={};for(let i=0;i<12;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json().catch(()=>({}));last={status:r.status,code:j.code};if(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token)return j.session;await sleep(900*(i+1))}throw new Error('controlled Admin session '+JSON.stringify(last))}
          async function refreshAdmin(){const s=await broker();adminCookie=`rona_portal_at=${s.access_token}; rona_portal_rt=${s.refresh_token}`;return s}
          async function admin(path,method='GET',body=null){let last={};for(let i=0;i<8;i++){if(!adminCookie)await refreshAdmin();const init={method,headers:{cookie:adminCookie,accept:'application/json'}};if(method==='POST'){init.headers.origin=base;init.headers.referer=base+'/portal/admin';init.headers['content-type']='application/json';init.body=JSON.stringify(body||{})}const r=await fetch(base+'/portal/admin-authority'+path,init),text=await r.text();let j={};try{j=JSON.parse(text)}catch{};if([401,403].includes(r.status)){adminCookie='';await sleep(400);continue}if(![500,502,503,504].includes(r.status))return{r,j,text};last={status:r.status,text:text.slice(0,240)};await sleep(700*(i+1))}throw new Error('admin '+path+' '+JSON.stringify(last))}
          async function cleanup(){if(!clientUserId)return;try{await admin('/access/users/'+encodeURIComponent(clientUserId)+'/contracts/'+encodeURIComponent(contractId)+'/revoke','POST',{})}catch{}try{await admin('/access/users/'+encodeURIComponent(clientUserId)+'/block','POST',{})}catch{}}
          async function waitPrimary(page){for(let i=0;i<450;i++){const ok=await page.evaluate(()=>window.__RONA_MAIN_UI_ENTRY__===true&&window.__RONA_OWNER_CLIENT_READY__===true&&window.__RONA_OWNER_FIRST_PAINT_READY__===true&&document.documentElement.classList.contains('rona-owner-paint-ready'));if(ok)return;await page.waitForTimeout(100)}throw new Error('CLIENT primary UI timeout')}
          async function clickVisibleExact(page,label){const loc=page.getByText(label,{exact:true});const n=await loc.count();for(let i=0;i<n;i++){const item=loc.nth(i);if(await item.isVisible().catch(()=>false)){await item.click();return}}throw new Error(`visible navigation label not found: ${label}`)}
          async function waitOperationsReady(page,rootId){for(let i=0;i<250;i++){const state=await page.evaluate(id=>({ready:document.documentElement.getAttribute('data-rona-client-operations-ready'),state:document.documentElement.getAttribute('data-rona-client-operations-state'),root:!!document.getElementById(id)&&getComputedStyle(document.getElementById(id)).display!=='none'}),rootId);if(state.ready==='true'&&state.state!=='error'&&state.root)return state;await page.waitForTimeout(120)}throw new Error(`${rootId} authoritative runtime did not become ready`)}

          (async()=>{
            await status('pending','Client applications/deals production E2E running');
            await refreshAdmin();
            const boot=await admin('/bootstrap');assert(boot.r.ok&&boot.j?.ok===true,'admin bootstrap '+boot.r.status+' '+boot.text.slice(0,240));
            const created=await admin('/access/users','POST',{role:'Клиент',name:'QA CLIENT OPERATIONS',login:clientLogin,email:clientEmail,initialPassword:password,contractIds:[contractId],openWithoutContract:false,bindingRole:'Уполномоченный представитель'});
            assert(created.r.status===201&&created.j?.ok===true&&created.j.userId,'client create '+created.r.status+' '+created.text.slice(0,300));clientUserId=String(created.j.userId);

            browser=await chromium.launch({headless:true,channel:'chrome'});
            const ctx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});
            const login=await ctx.request.post(base+'/portal/auth/login',{headers:{origin:base,referer:base+'/portal/login','content-type':'application/json',accept:'application/json'},data:{email:clientEmail,password,next:'/portal/client'}});
            const lt=await login.text();let lj={};try{lj=JSON.parse(lt)}catch{};assert(login.status()===200&&lj?.ok===true&&lj?.redirect==='/portal/client','Client login '+login.status()+' '+lt.slice(0,300));

            const bootstrap=await ctx.request.get(base+'/portal/api/v1/client/bootstrap',{headers:{accept:'application/json'}});const bt=await bootstrap.text();let bj={};try{bj=JSON.parse(bt)}catch{};
            assert(bootstrap.status()===200&&bj?.ok===true,'client bootstrap '+bootstrap.status()+' '+bt.slice(0,300));
            const contexts=Array.isArray(bj?.data?.contexts)?bj.data.contexts:[];
            assert(contexts.some(c=>c?.client_id===clientId&&c?.contract_id===contractId),'C003 context missing from production bootstrap');

            const contextResponse=await ctx.request.get(base+'/portal/api/v1/client/context?clientId='+encodeURIComponent(clientId)+'&contractId='+encodeURIComponent(contractId),{headers:{accept:'application/json'}});const ct=await contextResponse.text();let cj={};try{cj=JSON.parse(ct)}catch{};
            assert(contextResponse.status()===200&&cj?.ok===true,'client context '+contextResponse.status()+' '+ct.slice(0,500));
            assert(cj?.data?.projection_contract==='ADMIN_CLIENT_SERVER_V1','projection_contract not preserved through production proxy');
            const applications=Array.isArray(cj?.data?.applications)?cj.data.applications:[],deals=Array.isArray(cj?.data?.deals)?cj.data.deals:[];
            for(const id of expectedApplications)assert(applications.some(a=>a?.application_id===id),`application missing ${id}`);
            for(const id of expectedDeals){const d=deals.find(x=>x?.deal_id===id);assert(d,`deal missing ${id}`);for(const field of ['current_status','current_status_label','payment_status','payment_label','resource_status','resource_label'])assert(String(d?.[field]||'').trim(),`${id} missing ${field}`);assert(d.current_status==='EXECUTING',`${id} status ${d.current_status}`);assert(d.payment_status==='PARTIALLY_PAID',`${id} payment ${d.payment_status}`);assert(Number(d.payment_percent)===30,`${id} payment_percent ${d.payment_percent}`);assert(d.resource_status==='RESOURCE_PENDING',`${id} resource ${d.resource_status}`)}

            const page=await ctx.newPage();await page.goto(base+'/portal/client',{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname==='/portal/client','client route '+page.url());await waitPrimary(page);

            await clickVisibleExact(page,'Заявки');await waitOperationsReady(page,'page-applications');await page.waitForTimeout(500);
            const appsRoot=page.locator('#page-applications');assert(await appsRoot.isVisible(),'Applications root not visible');const appsText=(await appsRoot.innerText()).replace(/\s+/g,' ');for(const id of expectedApplications)assert(appsText.includes(id),`Applications UI missing ${id}`);assert((await page.locator('html').getAttribute('data-rona-client-operations-state'))!=='error','Applications runtime error state');await page.screenshot({path:'client-applications-production.png',fullPage:true});

            await clickVisibleExact(page,'Сделки');await waitOperationsReady(page,'page-deals');await page.waitForTimeout(650);
            const dealsRoot=page.locator('#page-deals');assert(await dealsRoot.isVisible(),'Deals root not visible');const dealsText=(await dealsRoot.innerText()).replace(/\s+/g,' ');for(const id of expectedDeals)assert(dealsText.includes(id),`Deals UI missing ${id}`);const strips=page.locator('#page-deals [data-rona-deal-state-strip="authoritative-v7"]');assert(await strips.count()>=2,'authoritative deal state strips missing');assert(dealsText.includes('В исполнении'),'Deals UI missing current server status');assert(dealsText.includes('Оплачено 30%'),'Deals UI missing payment progress');assert(dealsText.includes('Ресурс ожидает подтверждения'),'Deals UI missing resource state');assert((await page.locator('html').getAttribute('data-rona-client-operations-state'))!=='error','Deals runtime error state');await page.screenshot({path:'client-deals-production.png',fullPage:true});

            const proof={sha,clientId,contractId,applications:expectedApplications,deals:expectedDeals,projection_contract:cj.data.projection_contract,deal_states:expectedDeals.map(id=>{const d=deals.find(x=>x.deal_id===id);return{deal_id:id,current_status:d.current_status,payment_status:d.payment_status,payment_percent:d.payment_percent,resource_status:d.resource_status}}),runtime_state:await page.locator('html').getAttribute('data-rona-client-operations-state'),runtime_ready:await page.locator('html').getAttribute('data-rona-client-operations-ready'),state_strips:await strips.count(),verified_at:new Date().toISOString()};
            fs.writeFileSync('client-operations-production-proof.json',JSON.stringify(proof,null,2));
            await ctx.close();await browser.close();browser=null;await cleanup();clientUserId='';
            console.log('CLIENT_OPERATIONS_PRODUCTION_E2E=PASS '+JSON.stringify(proof));await status('success','Client applications/deals production E2E PASS');
          })().catch(async e=>{try{if(browser)await browser.close()}catch{}await cleanup();console.error(e.stack||e);await status('failure','Client applications/deals production E2E failed');process.exit(1)});
          NODE

      - name: Upload production proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-operations-production-proof-${{ github.run_id }}
          path: |
            client-applications-production.png
            client-deals-production.png
            client-operations-production-proof.json
          if-no-files-found: warn
          retention-days: 14
