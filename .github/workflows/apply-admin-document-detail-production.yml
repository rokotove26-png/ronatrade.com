name: Apply Admin document detail activation
on:
  push:
    branches: ['release/public-go-live-v1.1']
    paths: ['.github/workflows/apply-admin-document-detail-production.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - name: Add live document detail fallback using existing portal classes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('functions/portal/_middleware.js')
          s=p.read_text()
          old="const ro=label=>async()=>{try{window.toast?.(label+' доступно только через утверждённый авторитетный серверный процесс.')}catch(_e){}return {ok:false,reason:'INTENTIONALLY_READ_ONLY_BY_AUTHORITY'}};"
          new="if(typeof window.openModalRaw!=='function')window.openModalRaw=(title,source,body)=>{const host=document.querySelector('.page.active');if(!host)return;let d=document.getElementById('rona-live-detail');if(!d){d=document.createElement('div');d.id='rona-live-detail';d.className='panel';host.appendChild(d)}d.innerHTML='<div class=\"panel-head\"><strong>'+esc(title)+'</strong><span>'+esc(source)+'</span></div><div class=\"panel-body\">'+body+'</div>';d.scrollIntoView?.({block:'nearest'})};const ro=label=>async()=>{try{window.toast?.(label+' доступно только через утверждённый авторитетный серверный процесс.')}catch(_e){}return {ok:false,reason:'INTENTIONALLY_READ_ONLY_BY_AUTHORITY'}};"
          if s.count(old)!=1: raise SystemExit(f'NEEDLE_COUNT={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name 'RONA Production QA'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/portal/_middleware.js
          git commit -m 'Activate Admin canonical document detail view'
          git push origin HEAD:${GITHUB_REF_NAME}
