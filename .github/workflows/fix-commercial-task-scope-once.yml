name: Fix commercial task scope once
on:
  push:
    branches: [fix/commercial-task-scope-20260903]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commercial-task-scope-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restrict Commercial Director tasks to Commercial assignment
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f='supabase/functions/rona-ai-read-only/index.js';
          let s=fs.readFileSync(f,'utf8');
          const old="  return await sql`select task_id,title,description,status::text,priority::text,authority_domain,assigned_functional_role::text,due_at,source_type,source_object_id,source_version,acknowledged_at,decision,decision_at,created_at,updated_at\n    from portal_private.staff_tasks where qa_only=false and authority_domain=any(${domains}::text[]) and status not in ('COMPLETED','REJECTED','CLOSED')";
          const neu="  const commercialTaskScope=role==='MARKET_ANALYST'||role==='COMMERCIAL_DIRECTOR';\n  return await sql`select task_id,title,description,status::text,priority::text,authority_domain,assigned_functional_role::text,due_at,source_type,source_object_id,source_version,acknowledged_at,decision,decision_at,created_at,updated_at\n    from portal_private.staff_tasks where qa_only=false and authority_domain=any(${domains}::text[]) and (${commercialTaskScope}::boolean=false or assigned_functional_role='COMMERCIAL_DIRECTOR'::portal_private.staff_functional_role_enum) and status not in ('COMPLETED','REJECTED','CLOSED')";
          if(!s.includes(old)) throw new Error('currentTasks target not found');
          s=s.replace(old,neu);
          fs.writeFileSync(f,s);
          NODE
          node --check supabase/functions/rona-ai-read-only/index.js
          grep -F "commercialTaskScope=role==='MARKET_ANALYST'||role==='COMMERCIAL_DIRECTOR'" supabase/functions/rona-ai-read-only/index.js
          grep -F "assigned_functional_role='COMMERCIAL_DIRECTOR'" supabase/functions/rona-ai-read-only/index.js
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/rona-ai-read-only/index.js
          git commit -m 'fix: isolate Commercial Director task projection'
          git push origin HEAD:fix/commercial-task-scope-20260903
