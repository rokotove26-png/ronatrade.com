name: Admin agent legal entity and signed PDF archive QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/clients-agents-current-ui.js'
      - 'functions/portal/agency-contracts.js'
      - 'supabase/functions/rona-agent-agreements/**'
      - 'supabase/migrations/*agent_agency_signed_documents*'
      - 'tests/admin-agent-corporate-agreements-v1.test.mjs'
      - '.github/workflows/admin-agent-corporate-agreements-qa.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  agent-corporate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Strict source and Edge function syntax
        run: |
          set -euo pipefail
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/agency-contracts.js
          node --check tests/admin-agent-corporate-agreements-v1.test.mjs
          deno check --node-modules-dir=auto --config supabase/functions/rona-agent-agreements/deno.json supabase/functions/rona-agent-agreements/index.ts
      - name: Legal company and signed archive access contracts
        run: node --test --test-name-pattern='Agent business|Append-only|Pages agency' tests/admin-agent-corporate-agreements-v1.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real browser agent and company master-detail, signed PDFs, assignments
        run: node --test --test-name-pattern='Rendered corporate|Rendered company' tests/admin-agent-corporate-agreements-v1.test.mjs
