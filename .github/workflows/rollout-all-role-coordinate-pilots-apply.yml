name: Apply All Role Coordinate Pilots

on:
  push:
    branches:
      - rollout/all-role-coordinate-pilots-20260818

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rollout/all-role-coordinate-pilots-20260818
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply pilot rollout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if count is not None and n!=count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {n}: {old[:120]}')
              if n==0:
                  raise SystemExit(f'{path}: target not found: {old[:120]}')
              p.write_text(s.replace(old,new))

          # Public transport: add four business-role pilot segments while all primary connectors remain read-only.
          replace('functions/_mcp_transport.js',
            "const SEGMENTS=new Set(['operations','operations-pilot','finance','legal','market-analyst','rail-logistics','system-admin']);",
            "const SEGMENTS=new Set(['operations','operations-pilot','finance','finance-pilot','legal','legal-pilot','market-analyst','market-analyst-pilot','rail-logistics','rail-logistics-pilot','system-admin']);",1)
          replace('functions/_mcp_transport.js',
            "function scopesFor(segment){return segment==='operations-pilot'?['mcp:read','mcp:coordinate','offline_access']:['mcp:read','offline_access'];}\nfunction challengeScope(segment){return segment==='operations-pilot'?'mcp:read mcp:coordinate':'mcp:read';}",
            "function isCoordinatePilot(segment){return ['operations-pilot','finance-pilot','legal-pilot','market-analyst-pilot','rail-logistics-pilot'].includes(segment);}\nfunction scopesFor(segment){return isCoordinatePilot(segment)?['mcp:read','mcp:coordinate','offline_access']:['mcp:read','offline_access'];}\nfunction challengeScope(segment){return isCoordinatePilot(segment)?'mcp:read mcp:coordinate':'mcp:read';}",1)
          replace('functions/_mcp_transport.js',
            r"/^\/\.well-known\/oauth-protected-resource\/(operations-pilot|operations|finance|legal|market-analyst|rail-logistics|system-admin)\/mcp\/?$/",
            r"/^\/\.well-known\/oauth-protected-resource\/(operations-pilot|operations|finance-pilot|finance|legal-pilot|legal|market-analyst-pilot|market-analyst|rail-logistics-pilot|rail-logistics|system-admin)\/mcp\/?$/",1)
          replace('functions/_mcp_transport.js',
            r"/^\/\.well-known\/oauth-authorization-server\/(operations-pilot|operations|finance|legal|market-analyst|rail-logistics|system-admin)\/?$/",
            r"/^\/\.well-known\/oauth-authorization-server\/(operations-pilot|operations|finance-pilot|finance|legal-pilot|legal|market-analyst-pilot|market-analyst|rail-logistics-pilot|rail-logistics|system-admin)\/?$/",1)

          # Browser bridges.
          for f in ['functions/_mcp_consent_bridge.js','functions/_mcp_oauth_token_bridge.js']:
              replace(f,
                "const SEGMENTS=new Set(['operations','operations-pilot','finance','legal','market-analyst','rail-logistics','system-admin']);",
                "const SEGMENTS=new Set(['operations','operations-pilot','finance','finance-pilot','legal','legal-pilot','market-analyst','market-analyst-pilot','rail-logistics','rail-logistics-pilot','system-admin']);",1)

          # Consent bridge fixed role mapping.
          replace('supabase/functions/rona-mcp-consent-bridge/index.js',
            "  'operations':'OPERATIONS_DIRECTOR',\n  'operations-pilot':'OPERATIONS_DIRECTOR',\n  'finance':'FINANCE',\n  'legal':'LEGAL',\n  'market-analyst':'MARKET_ANALYST',\n  'rail-logistics':'RAIL_LOGISTICS',",
            "  'operations':'OPERATIONS_DIRECTOR',\n  'operations-pilot':'OPERATIONS_DIRECTOR',\n  'finance':'FINANCE',\n  'finance-pilot':'FINANCE',\n  'legal':'LEGAL',\n  'legal-pilot':'LEGAL',\n  'market-analyst':'MARKET_ANALYST',\n  'market-analyst-pilot':'MARKET_ANALYST',\n  'rail-logistics':'RAIL_LOGISTICS',\n  'rail-logistics-pilot':'RAIL_LOGISTICS',",1)

          # OAuth token endpoint fixed segment -> slug mapping and coordinate allowlist.
          replace('supabase/functions/rona-mcp-oauth-token/index.js',
            "  operations:'rona-mcp-operations',\n  'operations-pilot':'rona-mcp-operations-pilot',\n  finance:'rona-mcp-finance',\n  legal:'rona-mcp-legal',\n  'market-analyst':'rona-mcp-market-analyst',\n  'rail-logistics':'rona-mcp-rail-logistics',",
            "  operations:'rona-mcp-operations',\n  'operations-pilot':'rona-mcp-operations-pilot',\n  finance:'rona-mcp-finance',\n  'finance-pilot':'rona-mcp-finance-pilot',\n  legal:'rona-mcp-legal',\n  'legal-pilot':'rona-mcp-legal-pilot',\n  'market-analyst':'rona-mcp-market-analyst',\n  'market-analyst-pilot':'rona-mcp-market-analyst-pilot',\n  'rail-logistics':'rona-mcp-rail-logistics',\n  'rail-logistics-pilot':'rona-mcp-rail-logistics-pilot',",1)
          replace('supabase/functions/rona-mcp-oauth-token/index.js',
            "const PILOT_SLUG='rona-mcp-operations-pilot';\nfunction scopeAllowed(cfg,scope){return !new Set(String(scope||'').split(/\\s+/).filter(Boolean)).has('mcp:coordinate')||cfg?.server_slug===PILOT_SLUG;}",
            "const COORDINATE_PILOT_SLUGS=new Set(['rona-mcp-operations-pilot','rona-mcp-finance-pilot','rona-mcp-legal-pilot','rona-mcp-market-analyst-pilot','rona-mcp-rail-logistics-pilot']);\nfunction scopeAllowed(cfg,scope){return !new Set(String(scope||'').split(/\\s+/).filter(Boolean)).has('mcp:coordinate')||COORDINATE_PILOT_SLUGS.has(cfg?.server_slug);}",1)

          # Gateway segment map and exact fixed pilot role/identity bindings.
          replace('supabase/functions/rona-mcp-gateway/index.js',
            "const PILOT_SLUG='rona-mcp-operations-pilot';\nconst SEGMENT_BY_SLUG=Object.freeze({'rona-mcp-operations':'operations','rona-mcp-operations-pilot':'operations-pilot','rona-mcp-finance':'finance','rona-mcp-legal':'legal','rona-mcp-market-analyst':'market-analyst','rona-mcp-rail-logistics':'rail-logistics','rona-mcp-system-admin':'system-admin'});",
            "const COORDINATE_PILOT_BINDINGS=Object.freeze({\n  'rona-mcp-operations-pilot':['OPERATIONS_DIRECTOR','AI-OPERATIONS-DIRECTOR'],\n  'rona-mcp-finance-pilot':['FINANCE','AI-FINANCE'],\n  'rona-mcp-legal-pilot':['LEGAL','AI-LEGAL'],\n  'rona-mcp-market-analyst-pilot':['MARKET_ANALYST','AI-MARKET-ANALYST'],\n  'rona-mcp-rail-logistics-pilot':['RAIL_LOGISTICS','AI-RAIL-LOGISTICS'],\n});\nconst SEGMENT_BY_SLUG=Object.freeze({'rona-mcp-operations':'operations','rona-mcp-operations-pilot':'operations-pilot','rona-mcp-finance':'finance','rona-mcp-finance-pilot':'finance-pilot','rona-mcp-legal':'legal','rona-mcp-legal-pilot':'legal-pilot','rona-mcp-market-analyst':'market-analyst','rona-mcp-market-analyst-pilot':'market-analyst-pilot','rona-mcp-rail-logistics':'rail-logistics','rona-mcp-rail-logistics-pilot':'rail-logistics-pilot','rona-mcp-system-admin':'system-admin'});",1)
          replace('supabase/functions/rona-mcp-gateway/index.js',
            "function coordinationEnabled(cfg){return cfg?.server_slug===PILOT_SLUG&&cfg?.business_role==='OPERATIONS_DIRECTOR'&&cfg?.identity_id==='AI-OPERATIONS-DIRECTOR';}\nfunction scopeAllowed(cfg,scope){return !scopeHas(scope,'mcp:coordinate')||coordinationEnabled(cfg);}\nfunction gatewayScopes(slug){return slug===PILOT_SLUG?['mcp:read','mcp:coordinate','offline_access']:['mcp:read','offline_access'];}",
            "function coordinationEnabled(cfg){const b=COORDINATE_PILOT_BINDINGS[cfg?.server_slug];return Boolean(b&&cfg?.business_role===b[0]&&cfg?.identity_id===b[1]);}\nfunction scopeAllowed(cfg,scope){return !scopeHas(scope,'mcp:coordinate')||coordinationEnabled(cfg);}\nfunction gatewayScopes(slug){return COORDINATE_PILOT_BINDINGS[slug]?['mcp:read','mcp:coordinate','offline_access']:['mcp:read','offline_access'];}",1)
          replace('supabase/functions/rona-mcp-gateway/index.js',
            "function unauthorized(slug,code='invalid_token'){const scope=slug===PILOT_SLUG?'mcp:read mcp:coordinate':'mcp:read';return json({error:code},401,{'www-authenticate':`Bearer resource_metadata=\"${PUBLIC_ORIGIN}/.well-known/oauth-protected-resource/${segmentFor(slug)}/mcp\", scope=\"${scope}\"`});}",
            "function unauthorized(slug,code='invalid_token'){const scope=COORDINATE_PILOT_BINDINGS[slug]?'mcp:read mcp:coordinate':'mcp:read';return json({error:code},401,{'www-authenticate':`Bearer resource_metadata=\"${PUBLIC_ORIGIN}/.well-known/oauth-protected-resource/${segmentFor(slug)}/mcp\", scope=\"${scope}\"`});}",1)

          # Cloudflare routes.
          p=Path('_routes.json'); s=p.read_text()
          old='    "/operations-pilot/*",\n    "/finance/*",\n    "/legal/*",\n    "/market-analyst/*",\n    "/rail-logistics/*",'
          new='    "/operations-pilot/*",\n    "/finance/*",\n    "/finance-pilot/*",\n    "/legal/*",\n    "/legal-pilot/*",\n    "/market-analyst/*",\n    "/market-analyst-pilot/*",\n    "/rail-logistics/*",\n    "/rail-logistics-pilot/*",'
          if old not in s: raise SystemExit('_routes.json target not found')
          p.write_text(s.replace(old,new,1))

          # Add pilot route entrypoints.
          for seg in ['finance-pilot','legal-pilot','market-analyst-pilot','rail-logistics-pilot']:
              p=Path(f'functions/{seg}/[[path]].js')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text("import {proxyBoundRoleRequest} from '../_mcp_role_entry.js';\nimport {proxyOAuthTokenIfApplicable} from '../_mcp_oauth_token_bridge.js';\nexport async function onRequest(context){const oauth=await proxyOAuthTokenIfApplicable(context,'"+seg+"');return oauth||proxyBoundRoleRequest(context,'"+seg+"');}\n")

          # Migration: allow exactly one fixed coordinate pilot per business AI role; System Admin remains read-only only.
          Path('supabase/migrations/20260818202500_all_business_role_coordinate_pilots.sql').write_text("""-- Controlled coordination pilot connectors for Legal, Finance, Market Analyst and Rail Logistics.\n-- Primary six connectors remain unique/read-only; System Admin has no coordinate pilot.\n\ndrop index if exists portal_private.uq_mcp_gateway_primary_business_role;\ndrop index if exists portal_private.uq_mcp_gateway_primary_identity;\n\ncreate unique index uq_mcp_gateway_primary_business_role\n  on portal_private.mcp_gateway_config (business_role)\n  where server_slug not in ('rona-mcp-operations-pilot','rona-mcp-finance-pilot','rona-mcp-legal-pilot','rona-mcp-market-analyst-pilot','rona-mcp-rail-logistics-pilot');\n\ncreate unique index uq_mcp_gateway_primary_identity\n  on portal_private.mcp_gateway_config (identity_id)\n  where server_slug not in ('rona-mcp-operations-pilot','rona-mcp-finance-pilot','rona-mcp-legal-pilot','rona-mcp-market-analyst-pilot','rona-mcp-rail-logistics-pilot');\n\nalter table portal_private.mcp_gateway_config\n  drop constraint if exists mcp_gateway_config_coordinate_pilot_binding_check;\n\nalter table portal_private.mcp_gateway_config\n  add constraint mcp_gateway_config_coordinate_pilot_binding_check check (\n    server_slug not in ('rona-mcp-operations-pilot','rona-mcp-finance-pilot','rona-mcp-legal-pilot','rona-mcp-market-analyst-pilot','rona-mcp-rail-logistics-pilot')\n    or (server_slug='rona-mcp-operations-pilot' and business_role='OPERATIONS_DIRECTOR'::portal_private.ai_business_role_enum and identity_id='AI-OPERATIONS-DIRECTOR')\n    or (server_slug='rona-mcp-finance-pilot' and business_role='FINANCE'::portal_private.ai_business_role_enum and identity_id='AI-FINANCE')\n    or (server_slug='rona-mcp-legal-pilot' and business_role='LEGAL'::portal_private.ai_business_role_enum and identity_id='AI-LEGAL')\n    or (server_slug='rona-mcp-market-analyst-pilot' and business_role='MARKET_ANALYST'::portal_private.ai_business_role_enum and identity_id='AI-MARKET-ANALYST')\n    or (server_slug='rona-mcp-rail-logistics-pilot' and business_role='RAIL_LOGISTICS'::portal_private.ai_business_role_enum and identity_id='AI-RAIL-LOGISTICS')\n  );\n\ninsert into portal_private.mcp_gateway_config(server_slug,app_name,business_role,identity_id,enabled,max_requests_per_minute) values\n('rona-mcp-finance-pilot','RONA Finance Pilot','FINANCE'::portal_private.ai_business_role_enum,'AI-FINANCE',true,60),\n('rona-mcp-legal-pilot','RONA Legal Pilot','LEGAL'::portal_private.ai_business_role_enum,'AI-LEGAL',true,60),\n('rona-mcp-market-analyst-pilot','RONA Market Analyst Pilot','MARKET_ANALYST'::portal_private.ai_business_role_enum,'AI-MARKET-ANALYST',true,60),\n('rona-mcp-rail-logistics-pilot','RONA Rail Logistics Pilot','RAIL_LOGISTICS'::portal_private.ai_business_role_enum,'AI-RAIL-LOGISTICS',true,60)\non conflict (server_slug) do update set\n  app_name=excluded.app_name, business_role=excluded.business_role, identity_id=excluded.identity_id,\n  enabled=true, max_requests_per_minute=excluded.max_requests_per_minute, updated_at=now();\n""")

          # Persistent static/public QA for release.
          Path('.github/workflows/mcp-all-role-coordinate-pilots-qa.yml').write_text("""name: MCP All Role Coordinate Pilots QA\n\non:\n  push:\n    branches:\n      - release/public-go-live-v1.1\n      - rollout/all-role-coordinate-pilots-20260818\n  pull_request:\n    branches:\n      - release/public-go-live-v1.1\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  checks: read\n\njobs:\n  pilot-matrix:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '24'\n      - name: Static fixed-role pilot invariants\n        shell: bash\n        run: |\n          set -euo pipefail\n          node --check functions/_mcp_transport.js\n          node --check functions/_mcp_role_entry.js\n          node --check functions/_mcp_consent_bridge.js\n          node --check functions/_mcp_oauth_token_bridge.js\n          node --check supabase/functions/rona-mcp-gateway/index.js\n          node --check supabase/functions/rona-mcp-oauth-token/index.js\n          node --check supabase/functions/rona-mcp-consent-bridge/index.js\n          for seg in operations finance legal market-analyst rail-logistics; do node --check \"functions/${seg}-pilot/[[path]].js\"; done\n          grep -q \"'rona-mcp-finance-pilot':\['FINANCE','AI-FINANCE'\]\" supabase/functions/rona-mcp-gateway/index.js\n          grep -q \"'rona-mcp-legal-pilot':\['LEGAL','AI-LEGAL'\]\" supabase/functions/rona-mcp-gateway/index.js\n          grep -q \"'rona-mcp-market-analyst-pilot':\['MARKET_ANALYST','AI-MARKET-ANALYST'\]\" supabase/functions/rona-mcp-gateway/index.js\n          grep -q \"'rona-mcp-rail-logistics-pilot':\['RAIL_LOGISTICS','AI-RAIL-LOGISTICS'\]\" supabase/functions/rona-mcp-gateway/index.js\n          ! grep -q \"rona-mcp-system-admin-pilot\" supabase/functions/rona-mcp-gateway/index.js\n          if grep -Eq \"name:'(deal_status_write|payment_status_write|accounting_close|shipment_fact_create|rail_movement_fact_create|publication_publish|contract_mutate|document_mutate|client_binding_mutate)'\" supabase/functions/rona-mcp-gateway/index.js; then exit 1; fi\n          echo ALL_ROLE_COORDINATE_PILOT_SOURCE=PASS\n      - name: Wait for Cloudflare production\n        if: github.ref == 'refs/heads/release/public-go-live-v1.1'\n        env:\n          GH_TOKEN: ${{ github.token }}\n        shell: bash\n        run: |\n          node <<'NODE'\n          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;\n          const sleep=ms=>new Promise(r=>setTimeout(r,ms));\n          (async()=>{for(let i=0;i<120;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-ALL-ROLE-PILOT-QA'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare deployment '+cf.conclusion);await sleep(5000);console.log('CLOUDFLARE=PASS');return}}await sleep(3000)}throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});\n          NODE\n      - name: Public discovery matrix\n        if: github.ref == 'refs/heads/release/public-go-live-v1.1'\n        shell: bash\n        run: |\n          set -euo pipefail\n          for seg in operations finance legal market-analyst rail-logistics; do\n            p=$(curl -fsS \"https://ronaoil.com/.well-known/oauth-protected-resource/${seg}-pilot/mcp\")\n            echo \"$p\" | grep -q 'mcp:read'\n            echo \"$p\" | grep -q 'mcp:coordinate'\n            code=$(curl -sS -o /tmp/pilot.mcp -D /tmp/pilot.headers -w '%{http_code}' -X POST \"https://ronaoil.com/${seg}-pilot/mcp\" -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-11-25\",\"capabilities\":{},\"clientInfo\":{\"name\":\"RONA QA\",\"version\":\"1\"}}}')\n            test \"$code\" = '401'\n            grep -Fqi \"oauth-protected-resource/${seg}-pilot/mcp\" /tmp/pilot.headers\n            grep -Fqi 'mcp:read mcp:coordinate' /tmp/pilot.headers\n          done\n          for seg in operations finance legal market-analyst rail-logistics system-admin; do\n            p=$(curl -fsS \"https://ronaoil.com/.well-known/oauth-protected-resource/${seg}/mcp\")\n            echo \"$p\" | grep -q 'mcp:read'\n            if echo \"$p\" | grep -q 'mcp:coordinate'; then echo \"PRIMARY_COORDINATE_REGRESSION=$seg\"; exit 1; fi\n          done\n          echo ALL_ROLE_COORDINATE_PILOT_PUBLIC=PASS\n""")

          # Remove this bootstrap workflow so it does not remain in the final PR.
          Path('.github/workflows/rollout-all-role-coordinate-pilots-apply.yml').unlink()
          PY

          node --check functions/_mcp_transport.js
          node --check functions/_mcp_consent_bridge.js
          node --check functions/_mcp_oauth_token_bridge.js
          node --check supabase/functions/rona-mcp-gateway/index.js
          node --check supabase/functions/rona-mcp-oauth-token/index.js
          node --check supabase/functions/rona-mcp-consent-bridge/index.js
          for seg in operations finance legal market-analyst rail-logistics; do node --check "functions/${seg}-pilot/[[path]].js"; done
      - name: Commit rollout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RONA Automation'
          git config user.email 'automation@ronaoil.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add fixed-role coordination pilots for business AI staff'
          git push origin HEAD:rollout/all-role-coordinate-pilots-20260818
