name: Apply Admin timer sink hotfix

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-tick-20260817-v2'
    paths:
      - '.github/workflows/apply-admin-timer-sink-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch middleware without visual delta
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('functions/portal/_middleware.js')
          s=p.read_text()
          old="function setPage(page,title,body,sub){const el=document.getElementById('page-'+page);if(!el)return;el.dataset.ronaLiveAuthority='true';el.innerHTML=head(title,sub)+body;classify()}"
          new="function ensureLegacyTimerSinks(){for(const id of ['clock','calendar']){if(document.getElementById(id))continue;const sink=document.createElement('span');sink.id=id;sink.hidden=true;sink.setAttribute('aria-hidden','true');sink.dataset.ronaLegacyTimerSink='true';document.body.appendChild(sink)}}function setPage(page,title,body,sub){const el=document.getElementById('page-'+page);if(!el)return;el.dataset.ronaLiveAuthority='true';el.innerHTML=head(title,sub)+body;ensureLegacyTimerSinks();classify()}"
          if s.count(old)!=1:
              raise SystemExit(f'PATCH_NEEDLE_COUNT={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- functions/portal/_middleware.js
      - name: Commit hotfix
        run: |
          git config user.name 'RONA Production QA'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/portal/_middleware.js
          git commit -m 'Keep legacy Admin timer sinks after live page replacement'
          git push origin HEAD:${GITHUB_REF_NAME}
