name: G8.2 Admin visual diagnostic

on:
  push:
    branches:
      - staging/public-go-live-v1.1
    paths:
      - '.github/workflows/g82-admin-visual-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-admin-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build reconstructed Admin artifact
        run: npm run build
      - name: Print visual provenance diagnostics
        run: |
          node <<'NODE'
          const fs=require('fs');const crypto=require('crypto');
          const p='dist/portal/admin.html';const s=fs.readFileSync(p,'utf8');
          const sha=crypto.createHash('sha256').update(s).digest('hex');
          const pick=(label,re)=>{const m=s.match(re);console.log('@@'+label+'@@');console.log(m?m[0]:'NOT_FOUND');};
          console.log(JSON.stringify({sha256:sha,bytes:Buffer.byteLength(s),hasServerSession:s.includes('SERVER_SESSION'),hasAdminBootstrap:s.includes('/portal/api/v1/admin/bootstrap'),hasDeferred:s.includes('application/rona-admin-deferred')}));
          pick('BODY_RULE',/body\s*\{[^}]{0,4000}\}/i);
          pick('SHELL_RULE',/\.shell\s*\{[^}]{0,4000}\}/i);
          pick('SHELL_BEFORE_RULE',/\.shell::before\s*\{[^}]{0,8000}\}/i);
          for(const term of ['world','map','route','logistics','background-image','data:image/svg+xml']){
            let i=0,n=0;console.log('@@TERM '+term+'@@');
            while((i=s.toLowerCase().indexOf(term.toLowerCase(),i))>=0&&n<8){console.log(s.slice(Math.max(0,i-500),Math.min(s.length,i+1500)));i+=term.length;n++;}
            if(!n)console.log('NOT_FOUND');
          }
          NODE
