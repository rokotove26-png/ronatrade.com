name: G8.2 Admin visual diagnostic

on:
  push:
    branches:
      - staging/public-go-live-v1.1
    paths:
      - '.github/workflows/g82-admin-visual-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-admin-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build reconstructed Admin artifact
        run: npm run build
      - name: Locate canonical background and print current rule
        run: |
          echo 'CANONICAL_PNG_SHA256=9f0022d1651ddcf14fe2c6c66a4151b9074804f237c7b347793fd6cd20f505cc'
          echo '@@PNG_ASSET_HASHES@@'
          find assets -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum
          echo '@@PNG_DIMENSIONS@@'
          python3 - <<'PY'
          import glob,struct
          for p in sorted(glob.glob('assets/**/*.png',recursive=True)):
              with open(p,'rb') as f: h=f.read(24)
              if h[:8]==b'\x89PNG\r\n\x1a\n':
                  w,hh=struct.unpack('>II',h[16:24]); print(f'{w}x{hh} {p}')
          PY
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const s=fs.readFileSync('dist/portal/admin.html','utf8');
          console.log('@@ADMIN@@',JSON.stringify({sha256:crypto.createHash('sha256').update(s).digest('hex'),bytes:Buffer.byteLength(s)}));
          const m=s.match(/body:before\{[^}]*\}/i);console.log('@@BODY_BEFORE@@');console.log(m?m[0]:'NOT_FOUND');
          NODE
