name: G8.2 Admin visual diagnostic

on:
  push:
    branches:
      - staging/public-go-live-v1.1
    paths:
      - '.github/workflows/g82-admin-visual-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-admin-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build reconstructed Admin artifact
        run: npm run build
      - name: Print visual provenance diagnostics
        run: |
          node <<'NODE'
          const fs=require('fs');const crypto=require('crypto');
          const p='dist/portal/admin.html';const s=fs.readFileSync(p,'utf8');
          const sha=crypto.createHash('sha256').update(s).digest('hex');
          console.log(JSON.stringify({sha256:sha,bytes:Buffer.byteLength(s),hasServerSession:s.includes('SERVER_SESSION'),hasAdminBootstrap:s.includes('/portal/api/v1/admin/bootstrap'),hasDeferred:s.includes('application/rona-admin-deferred')}));
          const styles=[...s.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(m=>m[1]).join('\n');
          console.log('@@ROOT_RULES@@');for(const m of styles.matchAll(/:root\s*\{[^}]*\}/gi))console.log(m[0]);
          console.log('@@BACKGROUND_RULES@@');
          for(const rule of styles.split('}')){if(/background|mask|filter|opacity/i.test(rule)&&rule.trim())console.log(rule.trim()+'}');}
          console.log('@@SVG_CONTEXTS@@');
          let i=0,n=0;while((i=s.toLowerCase().indexOf('<svg',i))>=0&&n<20){console.log(s.slice(Math.max(0,i-500),Math.min(s.length,i+6000)));i+=4;n++;}
          if(!n)console.log('NOT_FOUND');
          console.log('@@CANVAS_CONTEXTS@@');
          i=0;n=0;while((i=s.toLowerCase().indexOf('<canvas',i))>=0&&n<20){console.log(s.slice(Math.max(0,i-500),Math.min(s.length,i+3000)));i+=7;n++;}
          if(!n)console.log('NOT_FOUND');
          console.log('@@VISUAL_CLASS_HINTS@@');
          for(const term of ['hero','backdrop','underlay','background','network','globe','geo','route','map-layer','map-bg','world-map','topology','grid-bg']){
            let j=0,c=0;console.log('@@TERM '+term+'@@');while((j=s.toLowerCase().indexOf(term,j))>=0&&c<6){console.log(s.slice(Math.max(0,j-300),Math.min(s.length,j+1200)));j+=term.length;c++;}if(!c)console.log('NOT_FOUND');
          }
          NODE
