name: Temporary Admin production runtime diagnostic

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-*'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Obtain controlled Admin session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "x-github-repository: ${GITHUB_REPOSITORY}" \
            --header "x-github-sha: ${GITHUB_SHA}" \
            --header "x-github-ref: ${GITHUB_REF}" \
            --header "x-github-run-id: ${GITHUB_RUN_ID}" \
            --output /tmp/session.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          if(!j.ok)throw new Error('session unavailable');
          console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);
          fs.appendFileSync(process.env.GITHUB_ENV,`AT<<EOF\n${j.session.access_token}\nEOF\nRT<<EOF\n${j.session.refresh_token}\nEOF\n`);
          NODE
          rm -f /tmp/session.json
      - name: Diagnose production runtime
        env:
          AT: ${{ env.AT }}
          RT: ${{ env.RT }}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});
            await c.addCookies([{name:'rona_portal_at',value:process.env.AT,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:process.env.RT,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);
            const p=await c.newPage(),events=[];
            p.on('pageerror',e=>events.push({type:'pageerror',message:String(e.message||e),stack:String(e.stack||'').slice(0,800)}));
            p.on('console',m=>{if(m.type()==='error')events.push({type:'console',message:m.text().slice(0,800)})});
            p.on('requestfailed',r=>events.push({type:'requestfailed',url:r.url(),failure:r.failure()?.errorText||''}));
            p.on('response',r=>{if(r.status()>=400)events.push({type:'http',status:r.status(),url:r.url()})});
            await p.goto('https://ronaoil.com/portal/admin?_diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await p.waitForTimeout(6000);
            const result=await p.evaluate(()=>({state:window.__RONA_ADMIN_BOOT_STATE__||null,marker:!!document.getElementById('rona-server-authenticated-admin-bootstrap'),kick:!!document.getElementById('rona-server-authenticated-admin-boot-kick'),readyMarker:window.__RONA_ADMIN_APP_READY_DISPATCHED__||false,renderAccess:typeof window.renderAccess,core:!!window.RONA_ADMIN_V349,pub:!!window.RONA_ADMIN_PUBLICATION_CONTROL_V345,url:location.href}));
            console.log('RONA_ADMIN_PROD_DIAGNOSTIC='+JSON.stringify({result,events:events.slice(0,50)}));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
