name: Admin authenticated interactivity gate

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-*'
      - 'release/public-go-live-v1.1'

permissions:
  contents: read
  checks: read
  actions: read
  statuses: write

jobs:
  authenticated-admin-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify canonical source and activation source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          cmp -s 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' dist/portal/admin.html
          grep -q 'SERVER_AUTHENTICATED_ADMIN_BOOTSTRAP' 'functions/portal/[[path]].js'
          grep -q 'rona-admin-live-authority-adapter' 'functions/portal/_middleware.js'
          grep -q "return clearedResponse(303, '/')" 'functions/portal/logout.js'
          echo 'CANONICAL_ADMIN_SOURCE_HASH=PASS'
          echo 'SERVER_AUTHENTICATED_ADMIN_SOURCE=PASS'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve deployed target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = 'release/public-go-live-v1.1' ]; then
            echo 'TARGET_ORIGIN=https://ronaoil.com' >> "$GITHUB_ENV"
            exit 0
          fi
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<60;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-Trade-Admin-QA'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');const m=String(cf?.output?.summary||'').match(/https:\/\/[a-z0-9-]+\.rona-trade-public\.pages\.dev/i);if(m){fs.appendFileSync(process.env.GITHUB_ENV,`TARGET_ORIGIN=${m[0]}\n`);return}}await sleep(5000)}throw new Error('Cloudflare Pages target unavailable')})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Obtain controlled server-authenticated Admin session
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "x-github-repository: ${GITHUB_REPOSITORY}" \
            --header "x-github-sha: ${GITHUB_SHA}" \
            --header "x-github-ref: ${GITHUB_REF}" \
            --header "x-github-run-id: ${GITHUB_RUN_ID}" \
            --output /tmp/rona-admin-session.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/rona-admin-session.json','utf8'));
          if(!j.ok||!j.session?.access_token||!j.session?.refresh_token)throw new Error('controlled Admin session unavailable');
          console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);
          fs.appendFileSync(process.env.GITHUB_ENV,`RONA_ACCESS_TOKEN<<EOF\n${j.session.access_token}\nEOF\nRONA_REFRESH_TOKEN<<EOF\n${j.session.refresh_token}\nEOF\n`);
          NODE
          rm -f /tmp/rona-admin-session.json
      - name: Authenticated Admin runtime and logout regression
        env:
          TARGET_ORIGIN: ${{ env.TARGET_ORIGIN }}
          RONA_ACCESS_TOKEN: ${{ env.RONA_ACCESS_TOKEN }}
          RONA_REFRESH_TOKEN: ${{ env.RONA_REFRESH_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const origin=process.env.TARGET_ORIGIN,access=process.env.RONA_ACCESS_TOKEN,refresh=process.env.RONA_REFRESH_TOKEN;
          const expected=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'];
          const requiredBackendMethods=['attachSignedContractToExistingContract','replaceSignedContractVersion','downloadSignedContract','createAccessUser','linkContractsToUser','revokeBinding','restoreBinding','blockAccessUser','syncCanonical'];
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{const browser=await chromium.launch({headless:true}),hostname=new URL(origin).hostname,ctx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await ctx.addCookies([{name:'rona_portal_at',value:access,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:refresh,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(m.text()))errors.push(m.text())});await p.goto(origin+'/portal/admin?_qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(p.url()).pathname==='/portal/admin','Admin route failed');for(let i=0;i<160&&!await p.evaluate(()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true);i++)await p.waitForTimeout(100);assert(await p.evaluate(()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true),'Admin boot not ready');for(let i=0;i<160&&!await p.evaluate(()=>window.__RONA_ADMIN_LIVE_READY__===true);i++)await p.waitForTimeout(100);assert(await p.evaluate(()=>window.__RONA_ADMIN_LIVE_READY__===true),'Admin live adapter not ready');const hooks=await p.evaluate(()=>Object.keys(window.__RONA_PORTAL_BACKEND__||{}));for(const name of requiredBackendMethods)assert(hooks.includes(name),'Missing Admin backend hook '+name);const authorityResponse=await ctx.request.get(origin+'/portal/admin-authority/bootstrap'),authorityJson=await authorityResponse.json();assert(authorityResponse.ok()&&authorityJson.ok,'Admin authority proxy failed');assert(Array.isArray(authorityJson.data?.contracts)&&Array.isArray(authorityJson.data?.accessUsers),'Admin authority bootstrap shape failed');const c3=authorityJson.data.contracts.find(x=>x.contractId==='RONA-C003-CTR-2026-001');assert(c3&&c3.currentExternalContractNumber==null,'C003 legacy external number was promoted');const actual=await p.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(actual)===JSON.stringify(expected),'Admin navigation contract mismatch');for(const page of actual){await p.locator(`#nav button[data-page="${page}"]`).click();await p.waitForTimeout(60);assert(await p.locator('#page-'+page).evaluate(el=>el.classList.contains('active')&&getComputedStyle(el).display!=='none'),'Inactive page '+page)}const a=await ctx.request.get(origin+'/portal/api/v1/admin/bootstrap'),j=await a.json();assert(a.ok()&&j.ok,'Admin bootstrap failed');const counts={clients:j.data.clients.length,contracts:j.data.contracts.length,deals:j.data.deals.length,documents:j.data.documents.length,payments:j.data.payments.length,shipments:j.data.shipments.length,rail:j.data.rail.length,publications:j.data.publications.length,controls:j.data.controls.length};assert(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(await p.content()),'JWT leaked');assert(errors.length===0,'Admin JS errors '+JSON.stringify(errors.slice(0,5)));await p.locator('#adminLogoutBtn').click();await p.waitForURL(u=>new URL(u).pathname==='/',{timeout:10000});assert(!(await ctx.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),'Auth cookies remain after logout');await p.goto(origin+'/portal/admin',{waitUntil:'domcontentloaded'});assert(new URL(p.url()).pathname==='/portal/login','Protected route did not fail closed after logout');console.log(JSON.stringify({ok:true,origin,navigation:'23/23',backendHooks:requiredBackendMethods.length,authorityProxy:true,c003CanonicalFallback:true,adminBootstrap:counts,logoutToRoot:true,logoutInvalidatedSession:true,tokenLeak:false,applicationErrors:0}));await ctx.close();await browser.close()})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Clean runtime secrets from runner
        if: always()
        run: |
          unset RONA_ACCESS_TOKEN RONA_REFRESH_TOKEN || true
          rm -f /tmp/rona-admin-session.json || true
