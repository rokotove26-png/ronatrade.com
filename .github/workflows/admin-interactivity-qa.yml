name: Autonomous Client and Agent production E2E

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-autonomous-e2e-20260821-run7'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  production-client-agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtain controlled server-authenticated Admin session
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "x-github-repository: ${GITHUB_REPOSITORY}" \
            --header "x-github-sha: ${GITHUB_SHA}" \
            --header "x-github-ref: ${GITHUB_REF}" \
            --header "x-github-run-id: ${GITHUB_RUN_ID}" \
            --output /tmp/rona-admin-session.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/rona-admin-session.json','utf8'));
          if(!j.ok||!j.session?.access_token||!j.session?.refresh_token)throw new Error('controlled Admin session unavailable');
          console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);
          fs.appendFileSync(process.env.GITHUB_ENV,`RONA_ACCESS_TOKEN<<EOF\n${j.session.access_token}\nEOF\nRONA_REFRESH_TOKEN<<EOF\n${j.session.refresh_token}\nEOF\n`);
          NODE
          rm -f /tmp/rona-admin-session.json

      - name: Execute Client and Agent production E2E
        env:
          GH_TOKEN: ${{ github.token }}
          RONA_ACCESS_TOKEN: ${{ env.RONA_ACCESS_TOKEN }}
          RONA_REFRESH_TOKEN: ${{ env.RONA_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const base='https://ronaoil.com';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN;
          const runUrl=`https://github.com/${repo}/actions/runs/${runId}`;
          const contractId='RONA-C002-CTR-2026-001',clientId='RONA-C002';
          const password='Aa1!'+crypto.randomBytes(18).toString('base64url')+'!';
          const suffix=`${runId}_${attempt}`;
          const clientLogin=`qa_e2e_client_${suffix}`,clientEmail=`qa-e2e-client-${suffix}@example.invalid`;
          const agentLogin=`qa_e2e_agent_${suffix}`,agentEmail=`qa-e2e-agent-${suffix}@example.invalid`;
          const adminCookie=`rona_portal_at=${process.env.RONA_ACCESS_TOKEN}; rona_portal_rt=${process.env.RONA_REFRESH_TOKEN}`;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          let clientUserId='',agentUserId='',clientCookie='',agentCookie='';
          const proof={client:{},agent:{},cleanup:{}};
          async function status(state,description){try{await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'},body:JSON.stringify({state,context:'rona/autonomous-client-agent-e2e',description:String(description).slice(0,140),target_url:runUrl})})}catch(_e){}}
          function jsonHeaders(){return{cookie:adminCookie,origin:base,referer:base+'/portal/admin','content-type':'application/json',accept:'application/json'}}
          async function adminGet(path){const r=await fetch(base+'/portal/admin-authority'+path,{headers:{cookie:adminCookie,accept:'application/json'},redirect:'manual'});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}return{r,j,t}}
          async function adminPost(path,body={}){const r=await fetch(base+'/portal/admin-authority'+path,{method:'POST',headers:jsonHeaders(),body:JSON.stringify(body),redirect:'manual'});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}return{r,j,t}}
          function cookies(r){let a=[];if(typeof r.headers.getSetCookie==='function')a=r.headers.getSetCookie();if(!a.length){const x=r.headers.get('set-cookie')||'';if(x)a=x.split(/,(?=\s*[^;,=]+=[^;,]+)/)}return a.map(x=>x.split(';')[0].trim()).filter(x=>/^rona_portal_(at|rt)=/.test(x)).join('; ')}
          async function login(email,next){const r=await fetch(base+'/portal/auth/login',{method:'POST',redirect:'manual',headers:{origin:base,referer:base+'/portal/login','content-type':'application/json'},body:JSON.stringify({email,password,next})});const t=await r.text();const c=cookies(r),loc=String(r.headers.get('location')||'');assert([302,303].includes(r.status),'login '+email+' '+r.status+' '+t.slice(0,250));assert(c.includes('rona_portal_at=')&&c.includes('rona_portal_rt='),'login cookies '+email);return{c,loc}}
          async function get(path,cookie,accept='text/html,application/json'){const r=await fetch(base+path,{headers:{cookie,accept},redirect:'manual'});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{}return{r,t,j}}
          async function cleanup(){if(clientUserId){try{const x=await adminPost('/access/users/'+encodeURIComponent(clientUserId)+'/contracts/'+encodeURIComponent(contractId)+'/revoke',{});proof.cleanup.clientRevoke=x.r.status}catch{}try{const x=await adminPost('/access/users/'+encodeURIComponent(clientUserId)+'/block',{});proof.cleanup.clientBlock=x.r.status}catch{}}if(agentUserId){try{const x=await adminPost('/access/users/'+encodeURIComponent(agentUserId)+'/block',{});proof.cleanup.agentBlock=x.r.status}catch{}}}
          (async()=>{
            await status('pending','Autonomous Client and Agent production E2E running');
            const boot=await adminGet('/bootstrap');assert(boot.r.ok&&boot.j?.ok===true,'admin bootstrap '+boot.r.status+' '+boot.t.slice(0,300));const c2=(boot.j.data?.contracts||[]).find(x=>x.contractId===contractId);assert(c2&&c2.clientId===clientId,'C002 unavailable');const signed=(boot.j.data?.signedContractGate?.contracts||[]).find(x=>x.contractId===contractId);assert(!signed||signed.bilateralSignedConfirmed!==true,'C002 unexpectedly signed');
            const cr=await adminPost('/access/users',{role:'Клиент',name:'QA E2E CLIENT',login:clientLogin,email:clientEmail,initialPassword:password,contractIds:[contractId],openWithoutContract:true,bindingRole:'Уполномоченный представитель'});assert(cr.r.status===201&&cr.j?.ok===true&&cr.j.userId,'client create '+cr.r.status+' '+cr.t.slice(0,500));clientUserId=String(cr.j.userId);assert(Array.isArray(cr.j.pendingContractIds)&&cr.j.pendingContractIds.includes(contractId),'client pending binding '+JSON.stringify(cr.j));proof.client.created=true;proof.client.pending=true;
            const cli=await login(clientEmail,'/portal/client');clientCookie=cli.c;assert(cli.loc.includes('/portal/client'),'client target '+cli.loc);proof.client.login=true;const clientRoute=await get('/portal/client',clientCookie);assert(clientRoute.r.status===403&&clientRoute.t.includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'client not fail-closed '+clientRoute.r.status+' '+clientRoute.t.slice(0,250));const clientApi=await get('/portal/api/v1/client/bootstrap',clientCookie,'application/json');const contexts=Array.isArray(clientApi.j?.data?.contexts)?clientApi.j.data.contexts:[];assert(!clientApi.r.ok||clientApi.j?.ok!==true||contexts.length===0,'client context exposed '+JSON.stringify(clientApi.j));proof.client.failClosed=true;
            const rv=await adminPost('/access/users/'+encodeURIComponent(clientUserId)+'/contracts/'+encodeURIComponent(contractId)+'/revoke',{});assert(rv.r.ok&&rv.j?.ok===true&&rv.j.status==='REVOKED','client revoke '+rv.r.status+' '+rv.t.slice(0,300));proof.client.revoked=true;const bl=await adminPost('/access/users/'+encodeURIComponent(clientUserId)+'/block',{});assert(bl.r.ok&&bl.j?.ok===true&&bl.j.status==='SUSPENDED','client block '+bl.r.status+' '+bl.t.slice(0,300));proof.client.blocked=true;const clientAfter=await get('/portal/client',clientCookie);assert(clientAfter.r.status!==200,'blocked client retained access');proof.client.deniedAfterBlock=true;
            const ar=await adminPost('/access/users',{role:'Агент',name:'QA E2E AGENT',login:agentLogin,email:agentEmail,initialPassword:password,contractIds:[],agentScope:'AGP-2026-002'});assert(ar.r.status===201&&ar.j?.ok===true&&ar.j.userId&&ar.j.agentPersonId==='AGP-2026-002','agent create '+ar.r.status+' '+ar.t.slice(0,500));agentUserId=String(ar.j.userId);proof.agent.created=true;proof.agent.binding=true;
            const ali=await login(agentEmail,'/portal/agent');agentCookie=ali.c;assert(ali.loc.includes('/portal/agent'),'agent target '+ali.loc);proof.agent.login=true;const agentRoute=await get('/portal/agent',agentCookie);assert(agentRoute.r.status===200,'agent route '+agentRoute.r.status+' '+agentRoute.t.slice(0,250));const agentApi=await get('/portal/api/v1/agent/bootstrap',agentCookie,'application/json');assert(agentApi.r.ok&&agentApi.j?.ok===true&&agentApi.j?.data,'agent bootstrap '+agentApi.r.status+' '+agentApi.t.slice(0,500));assert(JSON.stringify(agentApi.j).includes('AGP-2026-002'),'agent scope absent');proof.agent.authorized=true;
            const abl=await adminPost('/access/users/'+encodeURIComponent(agentUserId)+'/block',{});assert(abl.r.ok&&abl.j?.ok===true&&abl.j.status==='SUSPENDED','agent block '+abl.r.status+' '+abl.t.slice(0,300));proof.agent.blocked=true;const agentAfter=await get('/portal/agent',agentCookie);const agentApiAfter=await get('/portal/api/v1/agent/bootstrap',agentCookie,'application/json');assert(agentAfter.r.status!==200&&!agentApiAfter.r.ok,'blocked agent retained access route='+agentAfter.r.status+' api='+agentApiAfter.r.status);proof.agent.deniedAfterBlock=true;
            await cleanup();console.log('RONA_AUTONOMOUS_E2E='+JSON.stringify({ok:true,client:proof.client,agent:proof.agent,cleanup:proof.cleanup,clientUserId,agentUserId,contractId,agentPersonId:'AGP-2026-002'}));await status('success','Client pending fail-closed and Agent login/block E2E PASS');
          })().catch(async e=>{await cleanup();console.error(e.stack||e);console.error('RONA_AUTONOMOUS_E2E_FAILURE='+JSON.stringify({client:proof.client,agent:proof.agent,cleanup:proof.cleanup,clientUserId,agentUserId}));await status('failure','Autonomous Client and Agent production E2E failed');process.exit(1)});
          NODE

      - name: Clean runtime secrets from runner
        if: always()
        run: |
          unset RONA_ACCESS_TOKEN RONA_REFRESH_TOKEN || true
          rm -f /tmp/rona-admin-session.json || true
