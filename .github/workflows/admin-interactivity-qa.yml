name: Admin authenticated interactivity gate

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches: [release/public-go-live-v1.1]

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  authenticated-admin-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current-only Admin interaction contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/admin-access-ui.js
          node tests/admin-shell-resilience.test.mjs
          node tests/admin-current-only-shell-contract.test.mjs
          node tests/admin-current-access-nav-v2.test.mjs
          grep -q 'data-rona-admin-shell="current-only-v2"' portal-src/current/admin.html
          grep -q "window.__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" portal-src/current/admin.html
          grep -q 'grid-template-columns:238px minmax(0,1fr)' portal-src/current/admin.html
          grep -q 'data-action="create-access">Создать доступ</button>' portal-src/current/admin.html
          grep -q 'id="nav"' portal-src/current/admin.html
          for p in home prices applications deals payments accounting monitoring messages access agent-settlements claims analytics market-news; do grep -q "data-page=\"$p\"" portal-src/current/admin.html; grep -q "id=\"page-$p\"" portal-src/current/admin.html; done
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260826-current-only-v2'" functions/portal/clients-agents-current-ui.js
          grep -q "create.dataset.ronaCreateAccess='primary'" functions/portal/clients-agents-current-ui.js
          grep -q 'RONA_ADMIN_DIALOGS' functions/portal/admin-access-ui.js
          ! grep -Eq 'window\.prompt\s*\(|window\.confirm\s*\(' functions/portal/admin-access-ui.js
          grep -q 'ADMIN_EXCLUSIVE_CLIENT_V2' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'ADMIN_EXCLUSIVE_AGENT_V1' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'PORTAL_USER_PASSWORD_SET_BY_ADMIN' supabase/functions/rona-admin-control-plane/index.ts
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          ! grep -q 'adminLoginGate' dist/portal/admin.html
          ! grep -q 'rona-admin-auth-v3413' dist/portal/admin.html
          echo 'ADMIN_CURRENT_ONLY_INTERACTIVITY_SOURCE=PASS'
      - name: Wait for exact production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify deployed interaction surface and fail-closed authority
        if: github.event_name == 'push'
        run: |
          node scripts/verify-admin-current-only-production.mjs
          node <<'NODE'
          const base='https://ronaoil.com';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const shell=await fetch(base+'/portal/admin?_qa='+Date.now(),{redirect:'manual',cache:'no-store'});
          assert(shell.status===302,'Admin auth boundary '+shell.status);
          const access=await fetch(base+'/portal/clients-agents-current-ui?_qa='+Date.now(),{cache:'no-store'});
          assert(access.ok&&access.headers.get('x-rona-clients-agents-ui')==='current-only-v2','access current-only-v2 contract');
          assert(access.headers.get('x-rona-access-create')==='client-agent-v2','access create contract');
          assert(access.headers.get('x-rona-admin-nav-stability')==='v2','navigation stability contract');
          const src=await access.text();
          for(const marker of ['ronaCreateAccess','admin-authority','rona-ca4'])assert(src.includes(marker),'current access ASCII marker '+marker);
          const claims=await fetch(base+'/portal/claims-r2-ui?_qa='+Date.now(),{cache:'no-store'});
          assert(claims.ok,'claims runtime '+claims.status);
          const claimsSrc=await claims.text();
          assert(claimsSrc.includes('#page-claims')&&claimsSrc.includes('__RONA_CLAIMS_R2_UI__'),'claims runtime contract missing');
          const remaining=await fetch(base+'/portal/remaining-sections-ui?_qa='+Date.now(),{cache:'no-store'});
          assert(remaining.ok,'remaining-sections runtime '+remaining.status);
          const remainingSrc=await remaining.text();
          assert(remainingSrc.includes('renderRewards'),'agent rewards renderer contract missing');
          for(const path of ['/portal/admin-authority/bootstrap','/portal/admin-authority/agent-readiness']){const r=await fetch(base+path,{redirect:'manual',cache:'no-store'});assert([401,403].includes(r.status),path+' '+r.status)}
          console.log('ADMIN_CURRENT_ONLY_INTERACTIVITY_PRODUCTION=PASS');
          NODE
      - name: Publish Admin interactivity status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure; desc='Current-only Admin interactivity QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Current-only Admin interactivity QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$state\",\"context\":\"rona/admin-interactivity\",\"description\":\"$desc\"}" >/dev/null