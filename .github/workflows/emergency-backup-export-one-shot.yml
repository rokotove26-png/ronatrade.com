name: Emergency Backup Export One Shot

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/emergency-backup-export-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT_REF: sxawrwzeobaqwwmlkzws
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD || secrets.DATABASE_PASSWORD || secrets.DB_PASSWORD }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY || secrets.SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight backup credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "DB_BACKUP_CREDENTIAL=ABSENT"
            exit 2
          fi
          echo "DB_BACKUP_CREDENTIAL=PRESENT"
          if [ -n "${SERVICE_KEY:-}" ]; then
            echo "STORAGE_BACKUP_CREDENTIAL=PRESENT"
          else
            echo "STORAGE_BACKUP_CREDENTIAL=ABSENT"
          fi

      - name: Resolve Supabase session pooler
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="postgres.${PROJECT_REF}"
          found=""
          for host in aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com; do
            echo "Testing pooler host ${host}"
            if docker run --rm -e PGPASSWORD="${DB_PASSWORD}" postgres:17-alpine               psql "host=${host} port=5432 dbname=postgres user=${USERNAME} sslmode=require connect_timeout=8"               -Atqc "select 1" >/tmp/pooler.out 2>/tmp/pooler.err; then
              found="${host}"
              break
            fi
          done
          if [ -z "${found}" ]; then
            echo "SESSION_POOLER_NOT_RESOLVED"
            sed -E 's/password=[^ ]+/password=***/g' /tmp/pooler.err || true
            exit 3
          fi
          echo "POOLER_HOST=${found}" >> "${GITHUB_ENV}"
          echo "SESSION_POOLER_RESOLVED=${found}"

      - name: Create repository and database recovery set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/database backup/repository backup/storage/rona-portal-private backup/manifests

          git fetch --all --tags --prune
          git bundle create backup/repository/ronatrade-complete.bundle --all
          git rev-parse release/public-go-live-v1.1 > backup/manifests/release-head.txt
          git show -s --format='%H%n%cI%n%s' release/public-go-live-v1.1 > backup/manifests/release-commit.txt

          CONN="host=${POOLER_HOST} port=5432 dbname=postgres user=postgres.${PROJECT_REF} sslmode=require connect_timeout=15"

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" -v "${PWD}/backup/database:/backup" postgres:17-alpine             pg_dump "${CONN}" -Fc --no-owner --no-privileges -f /backup/rona-trade-full.custom

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" -v "${PWD}/backup/database:/backup" postgres:17-alpine             pg_dump "${CONN}" --schema-only --no-owner --no-privileges             --schema=public --schema=portal_private -f /backup/rona-app-schema.sql

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" -v "${PWD}/backup/database:/backup" postgres:17-alpine             pg_dump "${CONN}" --data-only --no-owner --no-privileges             --schema=public --schema=portal_private -f /backup/rona-app-data.sql

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" -v "${PWD}/backup/database:/backup" postgres:17-alpine             pg_dump "${CONN}" --data-only --no-owner --no-privileges             --schema=auth -f /backup/rona-auth-data.sql

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" -v "${PWD}/backup/database:/backup" postgres:17-alpine             pg_dump "${CONN}" --data-only --no-owner --no-privileges             --schema=storage -f /backup/rona-storage-metadata.sql

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" -v "${PWD}/backup/database:/backup" postgres:17-alpine             pg_dumpall "${CONN}" --roles-only --no-role-passwords -f /backup/rona-roles.sql || true

          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" postgres:17-alpine             psql "${CONN}" -AtF '|' -c "select table_schema,table_name,count_estimate from (select schemaname as table_schema,relname as table_name,n_live_tup::bigint as count_estimate from pg_stat_user_tables) s order by 1,2"             > backup/manifests/table-row-estimates.txt

      - name: Backup portal Storage objects
        if: env.SERVICE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          CONN="host=${POOLER_HOST} port=5432 dbname=postgres user=postgres.${PROJECT_REF} sslmode=require connect_timeout=15"
          docker run --rm -e PGPASSWORD="${DB_PASSWORD}" postgres:17-alpine             psql "${CONN}" -Atqc "select name from storage.objects where bucket_id='rona-portal-private' order by name"             > backup/manifests/rona-portal-private-objects.txt

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const ref=process.env.PROJECT_REF;
          const key=process.env.SERVICE_KEY;
          const names=fs.readFileSync('backup/manifests/rona-portal-private-objects.txt','utf8').split(/\r?\n/).filter(Boolean);
          const headers={apikey:key};
          if(!key.startsWith('sb_secret_')) headers.authorization='Bearer '+key;
          let done=0;
          for(const name of names){
            const encoded=name.split('/').map(encodeURIComponent).join('/');
            const url=`https://${ref}.supabase.co/storage/v1/object/rona-portal-private/${encoded}`;
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(60000)});
            if(!r.ok) throw new Error('STORAGE_DOWNLOAD_FAILED '+r.status+' '+name);
            const buf=Buffer.from(await r.arrayBuffer());
            const dest=path.join('backup/storage/rona-portal-private',name);
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            fs.writeFileSync(dest,buf);
            done++;
          }
          console.log('PORTAL_STORAGE_OBJECTS_BACKED_UP='+done);
          NODE

      - name: Write recovery manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > backup/RECOVERY_README.txt <<'EOF'
          RONA Trade emergency recovery set.
          Production source baseline: release/public-go-live-v1.1
          Supabase project: sxawrwzeobaqwwmlkzws
          Includes:
          - complete Git repository bundle
          - full PostgreSQL custom-format logical dump
          - application schema and data dumps for public + portal_private
          - auth schema data dump
          - storage metadata dump
          - role definitions without role passwords
          - rona-portal-private Storage object files when service credential is available
          - SHA-256 manifest

          Recovery should be performed into a fresh/test project first.
          Existing JWT/API keys, external Auth provider secrets, SMTP credentials and project-level platform settings are not embedded in this archive.
          EOF
          (
            cd backup
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          tar -C backup -czf RONA_Trade_Emergency_Recovery_2026-09-22.tar.gz .
          sha256sum RONA_Trade_Emergency_Recovery_2026-09-22.tar.gz > RONA_Trade_Emergency_Recovery_2026-09-22.tar.gz.sha256
          ls -lh RONA_Trade_Emergency_Recovery_2026-09-22.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: RONA-Trade-Emergency-Recovery-2026-09-22
          path: |
            RONA_Trade_Emergency_Recovery_2026-09-22.tar.gz
            RONA_Trade_Emergency_Recovery_2026-09-22.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
