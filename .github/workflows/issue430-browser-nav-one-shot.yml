name: issue430 browser nav one shot

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'corrective/issue430-owner-uat-resource-metrics-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrective/issue430-owner-uat-resource-metrics-v2
          fetch-depth: 0
      - name: Repair real UI navigation in browser harness only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-issue430-owner-authorized-browser-v2.mjs')
          s=p.read_text()
          anchor="async function activateDeals(page){"
          if anchor not in s: raise SystemExit('ACTIVATE_DEALS_ANCHOR_MISSING')
          fn="""async function activateCompanies(page){const clicked=await page.evaluate(()=>{const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return !e.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const candidates=[...document.querySelectorAll('button,a,[role=\"button\"],[data-page],[data-page-id],[data-page-target],[data-target]')];const el=candidates.find(e=>visible(e)&&/^(?:мои\\s+компании|компании)$/iu.test((e.textContent||'').replace(/\\s+/g,' ').trim()));if(!el)return false;el.click();return true});assert(clicked,'COMPANIES_NAV_CONTROL_NOT_FOUND');await page.waitForFunction(()=>{const grid=document.querySelector('#clientCompanyGrid');if(!grid)return false;const s=getComputedStyle(grid),r=grid.getBoundingClientRect();return !grid.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0},{},{timeout:10000})}\n"""
          if 'async function activateCompanies(page)' not in s:
              s=s.replace(anchor,fn+anchor,1)
          old="await page.goto(ORIGIN+'/portal/client?_qa_head='+HEAD,{waitUntil:'domcontentloaded',timeout:30000});await waitVisible(page,'#clientCompanyGrid article.company-switch-card');"
          new="await page.goto(ORIGIN+'/portal/client?_qa_head='+HEAD,{waitUntil:'domcontentloaded',timeout:30000});await activateCompanies(page);await waitVisible(page,'#clientCompanyGrid article.company-switch-card');"
          if old not in s: raise SystemExit('C005_NAV_PATCH_ANCHOR_MISSING')
          s=s.replace(old,new,1)
          old="delayedBootstrap=true;delayedContext=true;await page.reload({waitUntil:'domcontentloaded',timeout:30000});const hard=await waitCompanyReady(page,C005);"
          new="delayedBootstrap=true;delayedContext=true;await page.reload({waitUntil:'domcontentloaded',timeout:30000});await activateCompanies(page);const hard=await waitCompanyReady(page,C005);"
          if old not in s: raise SystemExit('HARD_REFRESH_NAV_PATCH_ANCHOR_MISSING')
          s=s.replace(old,new,1)
          old="await page.goto(ORIGIN+'/portal/client?_qa_multi='+HEAD,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>document.querySelectorAll('#clientCompanyGrid article.company-switch-card[data-rona-company-directory-hydration=\"ready\"]').length===2"
          new="await page.goto(ORIGIN+'/portal/client?_qa_multi='+HEAD,{waitUntil:'domcontentloaded',timeout:30000});await activateCompanies(page);await page.waitForFunction(()=>document.querySelectorAll('#clientCompanyGrid article.company-switch-card[data-rona-company-directory-hydration=\"ready\"]').length===2"
          if old not in s: raise SystemExit('MULTI_NAV_PATCH_ANCHOR_MISSING')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check scripts/qa-issue430-owner-authorized-browser-v2.mjs
          rm .github/workflows/issue430-browser-nav-one-shot.yml
          git diff --exit-code -- . ':!scripts/qa-issue430-owner-authorized-browser-v2.mjs' ':!.github/workflows/issue430-browser-nav-one-shot.yml'
          git config user.name 'RONA issue430 QA harness'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/qa-issue430-owner-authorized-browser-v2.mjs .github/workflows/issue430-browser-nav-one-shot.yml
          git commit -m 'qa(issue430): navigate real company section before assertions'
          echo "ISSUE430_NAV_LOCAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:corrective/issue430-owner-uat-resource-metrics-v2
