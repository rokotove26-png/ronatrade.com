name: rail-claims-layout-polish-qa
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - portal-src/current/admin.html
      - assets/portal-admin-shell-fast-v1.js
      - assets/portal-runtime/retire-claims-section-v1.js
      - assets/portal-admin-runtime-watchdog-v1.js
      - 'functions/portal/[[path]].js'
      - functions/portal/admin-approved-shell-v455-ui.js
      - functions/portal/rail-current-v81-maplibre-ui.js
      - functions/portal/claims-r2-ui.js
      - functions/portal/client-claims-api.js
      - supabase/functions/rona-owner-acceptance/claims.ts
      - tests/remove-claims-admin-client-v1.test.mjs
      - .github/workflows/rail-claims-layout-polish-qa.yml
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rail current and Claims retired from portal surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/portal-admin-shell-fast-v1.js
          node --check assets/portal-runtime/retire-claims-section-v1.js
          node --check assets/portal-admin-runtime-watchdog-v1.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          node --check functions/portal/claims-r2-ui.js
          node --check 'functions/portal/[[path]].js'

          ! grep -q 'data-page="claims"' portal-src/current/admin.html
          ! grep -q 'id="page-claims"' portal-src/current/admin.html
          ! grep -q 'rona-admin-approved-claims-v455-loader' portal-src/current/admin.html
          ! grep -q 'ИД претензии' portal-src/current/admin.html
          grep -q 'id="page-monitoring"' portal-src/current/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" portal-src/current/admin.html

          grep -q '/portal/rail-current-v81-maplibre-ui' assets/portal-admin-shell-fast-v1.js
          ! grep -q '/portal/claims-r2-ui' assets/portal-admin-shell-fast-v1.js
          ! grep -q "loadModule('claims'" assets/portal-admin-shell-fast-v1.js
          ! grep -q 'MODULES.claims' assets/portal-admin-shell-fast-v1.js

          grep -q 'retire-claims-section-v1.js' 'functions/portal/[[path]].js'
          grep -q 'script\[src\*="claims"\]' 'functions/portal/[[path]].js'
          grep -q '__RONA_CLAIMS_SECTION_RETIRED_V1__' assets/portal-runtime/retire-claims-section-v1.js
          grep -q '\[data-page="claims"\]' assets/portal-runtime/retire-claims-section-v1.js

          # Historical Claims backend remains source-locked and is not destructively deleted.
          test -f functions/portal/client-claims-api.js
          test -f supabase/migrations/20260824235500_owner_claims_legal_workflow.sql
          test -f supabase/migrations/20260825004500_owner_claims_bidirectional.sql
          grep -q 'LEGAL_HANDOFF_INCOMING_ONLY' supabase/functions/rona-owner-acceptance/claims.ts

          node --test tests/remove-claims-admin-client-v1.test.mjs
          echo 'RAIL_CURRENT_CLAIMS_RETIRED=PASS'
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; desc='Rail current / Claims retired QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Rail current / Claims retired QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/rail-claims-layout-polish\",\"description\":\"$desc\"}" >/dev/null
