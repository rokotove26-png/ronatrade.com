name: Admin applications completed hotfix QA

on:
  pull_request:
    paths:
      - 'functions/portal/admin-completed-bootstrap.js'
      - 'functions/portal/main-ui/index.js'
      - 'functions/portal/main-ui/admin-completed-applications.js'
      - 'functions/portal/main-ui/application-passport-runtime.js'
      - 'functions/portal/owner-api.js'
      - 'portal-src/current/admin.html'
      - 'scripts/qa-admin-applications-completed-v1.mjs'
      - 'scripts/qa-admin-applications-completed-runtime-v2.mjs'
      - 'scripts/qa-admin-applications-completed-browser-v2.mjs'
      - '.github/workflows/admin-applications-completed-hotfix-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-applications-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove source mapping and existing passport path
        run: node scripts/qa-admin-applications-completed-v1.mjs
      - name: Prove authenticated workflow route and server merge before render
        run: node scripts/qa-admin-applications-completed-runtime-v2.mjs
      - name: Install Chromium runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prove completed bucket, passport and reload in authenticated browser runtime
        run: node scripts/qa-admin-applications-completed-browser-v2.mjs
