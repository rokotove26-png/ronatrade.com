name: Restore Admin Analytics Canonical Visual

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/admin-analytics-restore-canonical-visual.yml

permissions:
  contents: write

jobs:
  restore-analytics-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore accepted Analytics visual without touching live data owner
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path='functions/portal/analytics-v2-ui.js';
          let src=await readFile(path,'utf8');
          if(!src.includes("const CANONICAL_ANALYTICS_MARKER='live-market-intelligence-v2'")) throw new Error('Unexpected Analytics owner');
          if(src.includes('home-canonical-frames-title-v2')) throw new Error('Canonical visual already restored');

