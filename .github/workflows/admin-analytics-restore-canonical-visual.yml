          const currentReplacement="return r.dataset.ronaLiveRoot==='owner-bootstrap-v2'&&r.dataset.publicationId===id&&!!r.querySelector('.rona-analytics-canonical-title')&&!!r.querySelector('.an2-live-current')&&!!r.querySelector('[data-rona-live-chart=\"v2\"]');";
          if(!src.includes(currentAnchor)) throw new Error('Analytics live DOM anchor missing');
          src=src.replace(currentAnchor,currentReplacement);

