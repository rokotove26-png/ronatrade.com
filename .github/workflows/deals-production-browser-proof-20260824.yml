name: Deals production browser proof 20260824

on:
  push:
    branches:
      - 'hotfix/deals-prepaint-contract-and-browser-proof-20260824'
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  deals-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source contract and install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          grep -q 'src="/portal/main-ui"' functions/portal/admin.js
          grep -q 'deals-current-state-v1.3' functions/portal/admin.js
          grep -q 'current-only-v1.3' functions/portal/main-ui.js
          grep -q 'current-state-v1.3' functions/portal/deals-current-state-ui.js
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Resolve deployed target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<180;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-DEALS-BROWSER-PROOF'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare '+cf.conclusion);await sleep(ref==='refs/heads/release/public-go-live-v1.1'?6000:4000);if(ref==='refs/heads/release/public-go-live-v1.1'){fs.appendFileSync(process.env.GITHUB_OUTPUT,'origin=https://ronaoil.com\n');return}const text=String(cf.output?.summary||'')+' '+String(cf.output?.text||'')+' '+String(cf.details_url||'');const urls=[...text.matchAll(/https:\/\/[a-z0-9.-]+\.pages\.dev/ig)].map(x=>x[0]);const u=urls.find(x=>!/rona-trade-public\.pages\.dev$/i.test(x))||urls[0];if(!u)throw new Error('Preview URL not found');fs.appendFileSync(process.env.GITHUB_OUTPUT,`origin=${u}\n`);return}}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Prove Deals current UI owns visible production page
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const origin=process.env.TARGET_ORIGIN,repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          async function broker(){let last={};for(let i=0;i<12;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json().catch(()=>({}));last={status:r.status,code:j.code};if(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token)return j.session;await sleep(1000*(i+1))}throw new Error('controlled session '+JSON.stringify(last))}
          async function wait(page,fn,label,tries=500){for(let i=0;i<tries;i++){if(await page.evaluate(fn))return;await page.waitForTimeout(100)}throw new Error(label+' timeout '+String(await page.evaluate(()=>window.__RONA_DEALS_CURRENT_STATE_ERROR__||window.__RONA_OWNER_ADMIN_ERROR__||'')))}
          async function inspect(page){return page.evaluate(()=>{
            const root=document.querySelector('#page-deals');
            const host=root?.querySelector(':scope > .rona-owner-page-content[data-owner-page="deals"]');
            const owned=host?.querySelector(':scope > .rona-current-deals-owned');
            const isVisible=n=>{if(!n)return false;const s=getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)!==0&&r.width>0&&r.height>0};
            const leaked=Array.from(root?.children||[]).filter(n=>n!==host&&isVisible(n)).map(n=>({tag:n.tagName,id:n.id,cls:n.className,text:String(n.innerText||'').slice(0,160)}));
            const text=String(owned?.innerText||'');
            const visibleText=String(root?.innerText||'');
            return {owned:!!owned,hostOwner:host?.dataset?.ronaDealsOwner||'',leaked,text,visibleText,build:window.__RONA_UI_BUILD__||'',state:window.__RONA_DEALS_CURRENT_STATE__||null};
          })}
          function assertDeals(v,label){
            assert(v.owned,label+': current owned root missing');
            assert(v.hostOwner==='current-v1.3',label+': wrong Deals owner '+v.hostOwner);
            assert(v.leaked.length===0,label+': visible preserved siblings '+JSON.stringify(v.leaked));
            for(const required of ['Операционная картина сделок','Ожидают оплаты','Общий объём сделок, т','Общая сумма сделок','Базис поставки'])assert(v.text.includes(required),label+': missing '+required);
            for(const forbidden of ['Ожидают оплаты или действий','Контрольный срез источников','CF-001','ОЖИДАЮТ ПОДТВЕРЖДЕНИЕ РЕСУРСА'])assert(!v.visibleText.includes(forbidden),label+': forbidden visible '+forbidden);
          }
          (async()=>{
            const session=await broker(),hostname=new URL(origin).hostname;
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const ctx=await browser.newContext({viewport:{width:2048,height:1152},javaScriptEnabled:true});
            await ctx.addCookies([{name:'rona_portal_at',value:session.access_token,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:session.refresh_token,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);
            const page=await ctx.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            page.on('console',m=>{if(m.type()==='error'&&!/cloudflareinsights/i.test(m.text()))errors.push('console:'+m.text())});
            await page.goto(origin+'/portal/admin?_deals_proof='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            assert(new URL(page.url()).pathname==='/portal/admin','Admin route');
            await wait(page,()=>window.__RONA_MAIN_UI_ENTRY__===true&&window.__RONA_OWNER_ADMIN_READY__===true,'Admin primary runtime');
            const button=page.locator('#nav button[data-page="deals"]');
            assert(await button.isVisible(),'Deals nav visible');
            await button.click();
            await wait(page,()=>!!document.querySelector('#page-deals .rona-current-deals-owned')&&document.documentElement.classList.contains('rona-deals-current-ready'),'Deals current owner');
            let v=await inspect(page);assertDeals(v,'initial');
            await page.waitForTimeout(5000);
            v=await inspect(page);assertDeals(v,'delayed');
            assert(errors.length===0,'Browser errors '+JSON.stringify(errors.slice(0,8)));
            console.log('DEALS_BROWSER_PROOF=PASS origin='+origin+' build='+v.build);
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Publish Deals browser proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Deals exclusive visible UI browser proof failed'
          if [ "$JOB_STATUS" = 'success' ]; then state=success; description='Deals current-state v1.3 exclusive visible UI PASS'; fi
          target="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/deals-browser-proof","description":"%s","target_url":"%s"}' "$state" "$description" "$target")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
