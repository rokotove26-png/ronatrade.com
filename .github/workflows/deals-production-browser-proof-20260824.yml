name: Deals production browser proof

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'
  pull_request:
    branches: [release/public-go-live-v1.1]

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  deals-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current Deals owner and Admin loader
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check functions/portal/main-ui/index.js
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/deals-current-state-ui.js
          grep -q "import { onRequest as serveCurrentAdminUi } from '../admin-main-ui-current.js';" functions/portal/main-ui/index.js
          grep -q "const response=await serveCurrentAdminUi(context);" functions/portal/main-ui/index.js
          grep -q 'data-rona-admin-shell="current-only-v2"' portal-src/current/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" portal-src/current/admin.html
          grep -q "__RONA_ADMIN_SHELL_RESILIENCE__='single-owner-v3'" assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/main-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/deals-current-state-ui' assets/portal-admin-shell-fast-v1.js
          grep -q 'current-only-v1.5' functions/portal/admin-main-ui-current.js
          grep -q 'current-state-v1.6-signed-addendum' functions/portal/deals-current-state-ui.js
          grep -q "replaceAll('waitsAction','waitsPayment')" functions/portal/deals-current-state-ui.js
          grep -q 'ronaDealsLayoutV15' functions/portal/deals-current-state-ui.js
          grep -q 'Скачать подписанное доп. соглашение' functions/portal/deals-current-state-ui.js
          grep -q 'width:310px!important' functions/portal/deals-current-state-ui.js
          grep -q 'width:145px!important' functions/portal/deals-current-state-ui.js
          node --input-type=module <<'NODE'
          import { onRequest } from './functions/portal/main-ui/index.js';
          const response=await onRequest();
          if(response.status!==200)throw new Error('main-ui status '+response.status);
          const text=await response.text();
          if(response.headers.get('x-rona-deals-owner')!=='current-only-v1.6-side-panel')throw new Error('side-panel owner header missing');
          for(const marker of ['.rona-deal-drawer-backdrop','function deal2VSidePanel(d)','selected?deal2VSidePanel(selected):null',"'aria-modal':'true'"]){
            if(!text.includes(marker))throw new Error('missing Deals side-panel marker '+marker);
          }
          if(text.includes('selected?deal2VDetail(selected):null'))throw new Error('legacy below-table deal detail remains');
          console.log('DEALS_SIDE_PANEL_GENERATED_RUNTIME=PASS');
          NODE
          ! grep -q 'adminLoginGate' dist/portal/admin.html
          ! grep -q 'v3.4.13' dist/portal/admin.html
          echo 'DEALS_CURRENT_SOURCE=PASS'
      - name: Wait for exact production deploy convergence
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify deployed Deals runtime markers
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node scripts/verify-admin-current-only-production.mjs
          for i in 1 2 3 4 5 6; do
            if curl -fsS -D /tmp/deals.headers -o /tmp/deals.js "https://ronaoil.com/portal/deals-current-state-ui?proof=$GITHUB_SHA&attempt=$i&ts=$(date +%s%N)" && grep -qi '^x-rona-deals-ui: current-state-v1.6-signed-addendum' /tmp/deals.headers; then break; fi
            sleep 2
          done
          grep -qi '^x-rona-deals-ui: current-state-v1.6-signed-addendum' /tmp/deals.headers
          node --check /tmp/deals.js
          grep -q 'function isolateDealsPage(root,host)' /tmp/deals.js
          grep -q "host.dataset.ronaDealsOwner='current-v1.5'" /tmp/deals.js
          grep -q 'function waitsPayment(d)' /tmp/deals.js
          ! grep -q 'waitsAction' /tmp/deals.js
          grep -q "kpi('Ожидают оплаты'" /tmp/deals.js
          grep -q "'Базис поставки'" /tmp/deals.js
          grep -q 'Скачать подписанное доп. соглашение' /tmp/deals.js
          grep -q "'Общий объём сделок, т'" /tmp/deals.js
          grep -q "'Общая сумма сделок'" /tmp/deals.js
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS -D /tmp/main.headers -o /tmp/main.js "https://ronaoil.com/portal/main-ui?deals_side_panel=$GITHUB_SHA&attempt=$i&ts=$(date +%s%N)" && grep -qi '^x-rona-deals-owner: current-only-v1.6-side-panel' /tmp/main.headers; then break; fi
            sleep 2
          done
          grep -qi '^x-rona-deals-owner: current-only-v1.6-side-panel' /tmp/main.headers
          node --check /tmp/main.js
          grep -q '.rona-deal-drawer-backdrop' /tmp/main.js
          grep -q 'function deal2VSidePanel(d)' /tmp/main.js
          grep -q 'selected?deal2VSidePanel(selected):null' /tmp/main.js
          ! grep -q 'selected?deal2VDetail(selected):null' /tmp/main.js
          echo 'DEALS_CURRENT_PRODUCTION_PROOF=PASS'
      - name: Publish Deals proof status (legacy best effort)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; description='Deals current-only proof failed'
          if [ "$JOB_STATUS" = success ]; then state=success; description='Deals current-only production proof passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$state\",\"context\":\"rona/deals-browser-proof\",\"description\":\"$description\"}" >/dev/null
