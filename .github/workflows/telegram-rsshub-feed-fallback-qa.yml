name: Telegram RSSHub feed fallback QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
    paths:
      - 'scripts/telegram_public_pdf_ingest_v3.py'
      - 'tests/test_telegram_rsshub_feed_discovery.py'
      - '.github/workflows/telegram-rsshub-feed-fallback-qa.yml'

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'beautifulsoup4>=4.12,<5' \
            'lxml>=5,<7' \
            'pypdf>=5,<7' \
            'pdfplumber>=0.11,<0.12' \
            'requests>=2.32,<3'
      - name: Syntax check RSSHub collector
        run: python -m py_compile scripts/telegram_public_pdf_ingest_v3.py
      - name: Verify feed discovery fallback without network
        run: python tests/test_telegram_rsshub_feed_discovery.py
