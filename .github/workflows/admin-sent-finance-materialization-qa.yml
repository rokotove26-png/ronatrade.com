name: Admin SENT finance materialization QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/owner-api.js'
      - 'supabase/migrations/**'
      - 'scripts/qa-admin-sent-finance-materialization-v1.mjs'
      - 'scripts/qa-admin-sent-finance-materialization-v1.sql'
      - '.github/workflows/admin-sent-finance-materialization-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrective-finance-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Source and Owner-final contract checks
        run: |
          set -euo pipefail
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/owner-api.js
          node --check scripts/qa-admin-sent-finance-materialization-v1.mjs
          migration='supabase/migrations/20260910213000_owner_r1_payment_finance_materialization_v1.sql'
          plan_migration='supabase/migrations/20260910213500_owner_r1_payment_plan_percent_reconcile_v1.sql'
          grep -F 'owner_r1_materialize_payment_finance' "$migration"
          grep -F 'owner_r1_send_to_payments' "$migration"
          grep -F 'ACCEPTED_COUNTEROFFER' "$migration"
          grep -F 'BANK_CONFIRMED' "$migration"
          grep -F 'ADMIN_DEAL_ACCEPTED_TERMS_R1' "$migration"
          grep -F 'v_obligation:=round(v_price*v_confirmed_qty,2);' "$migration"
          grep -F 'order by dr.registered_at desc' "$migration"
          grep -F 'owner_r1_reconcile_generated_payment_plan' "$plan_migration"
          grep -F "regexp_matches(coalesce(v_payment_terms,''),'([0-9]+([.,][0-9]+)?)\\s*%'" "$plan_migration"
          if grep -E 'DEAL-2026-009|RONA-C005-IN-2026-001|sxawrwzeobaqwwmlkzws' "$migration" "$plan_migration"; then
            echo 'corrective migrations must stay generic and production-data agnostic'
            exit 1
          fi
          for forbidden in 'handoffPending' 'Передано в оплату — сумма формируется' 'Не сформировано'; do
            if grep -F "$forbidden" functions/portal/admin-main-ui-current.js; then
              echo "Owner-final forbidden Payments pseudo-state remains: $forbidden"
              exit 1
            fi
          done
          grep -F 'LOCAL_EPHEMERAL_POSTGREST' functions/portal/owner-api.js
          RONA_QA_RPC_MODE=LOCAL_EPHEMERAL_POSTGREST RONA_QA_RPC_UPSTREAM=https://example.com/rpc node --input-type=module -e "import('./functions/portal/owner-api.js').then(()=>process.exit(1)).catch(e=>{if(!String(e).includes('QA_RPC_UPSTREAM_DENIED')){console.error(e);process.exit(1)}})"
          echo "CANDIDATE_MIGRATION_SHA256=$(cat "$migration" "$plan_migration" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          npm run build

      - name: Seed released baseline plus exact corrective migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f scripts/qa-admin-sent-finance-materialization-v1.sql
          psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260910213500_owner_r1_payment_plan_percent_reconcile_v1.sql
          definition=$(psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atc "select pg_get_functiondef('public.owner_r1_send_to_payments(text)'::regprocedure)")
          printf '%s\n' "$definition" | grep -F 'owner_r1_materialize_payment_finance'
          printf '%s\n' "$definition" | grep -F 'owner_r1_reconcile_generated_payment_plan'
          if printf '%s\n' "$definition" | grep -F 'PAYMENT_OBLIGATION_NOT_CONFIRMED'; then
            echo 'obsolete pre-existing finance-summary blocker is still loaded'
            exit 1
          fi
          echo 'OWNER_FINAL_CORRECTIVE_RPC_LOADED=PASS'

      - name: Start free disposable PostgREST
        env:
          PGRST_JWT_SECRET: pr453-free-disposable-jwt-secret-minimum-32-bytes
        run: |
          set -euo pipefail
          docker run --rm -d --name pr453-postgrest --network host \
            -e PGRST_DB_URI='postgres://postgres:postgres@127.0.0.1:5432/postgres' \
            -e PGRST_DB_SCHEMAS='public' \
            -e PGRST_DB_ANON_ROLE='postgres' \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs pr453-postgrest
          exit 1

      - name: Resolve immutable Cloudflare preview for UI/source inspection only
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          preview=''
          for i in $(seq 1 24); do
            summaries=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success") | .output.summary' 2>/dev/null || true)
            preview=$(printf '%s\n' "$summaries" | grep -oE 'https://[a-f0-9]+\.rona-trade-public\.pages\.dev' | head -1 || true)
            [ -n "$preview" ] && break
            sleep 5
          done
          echo "IMMUTABLE_PREVIEW_UI_ONLY=$preview" | tee -a "$GITHUB_ENV"
          echo 'NOTICE: Cloudflare preview is production-backed. It is UI/source inspection only and is NOT candidate-backend proof.'

      - name: Real owner-api to real PostgREST Owner-final E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          RONA_QA_RPC_MODE: LOCAL_EPHEMERAL_POSTGREST
          RONA_QA_RPC_UPSTREAM: http://127.0.0.1:3000/rpc
          PGRST_JWT_SECRET: pr453-free-disposable-jwt-secret-minimum-32-bytes
          OWNER_E2E_ARTIFACT: artifacts/pr453-owner-final-payment-handoff-e2e.json
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/qa-admin-sent-finance-materialization-v1.mjs

      - name: Upload Owner-final free E2E proof
        uses: actions/upload-artifact@v4
        with:
          name: pr453-owner-final-atomic-payment-handoff-free-e2e-proof
          path: artifacts/pr453-owner-final-payment-handoff-e2e.json

      - name: Stop disposable PostgREST
        if: always()
        run: docker stop pr453-postgrest >/dev/null 2>&1 || true
