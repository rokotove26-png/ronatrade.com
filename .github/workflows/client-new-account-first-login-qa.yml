name: Client New Account First Login QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'supabase/functions/rona-portal-api/**'
      - 'supabase/functions/rona-admin-control-plane/**'
      - 'assets/portal-runtime/client-context-selection-authority-v1.js'
      - 'assets/portal-runtime/client-home-command-center-v2.js'
      - 'assets/portal-runtime/client-home-current-only-v1.js'
      - 'assets/portal-runtime/client-background-section-preload-v1.js'
      - 'scripts/qa-client-context-selection-authority-v1.mjs'
      - 'scripts/qa-client-backend-context-scope-v1.mjs'
      - '.github/workflows/client-new-account-first-login-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'supabase/functions/rona-portal-api/**'
      - 'supabase/functions/rona-admin-control-plane/**'
      - 'assets/portal-runtime/client-context-selection-authority-v1.js'
      - 'assets/portal-runtime/client-home-command-center-v2.js'
      - 'assets/portal-runtime/client-home-current-only-v1.js'
      - 'assets/portal-runtime/client-background-section-preload-v1.js'
      - 'scripts/qa-client-context-selection-authority-v1.mjs'
      - 'scripts/qa-client-backend-context-scope-v1.mjs'
      - '.github/workflows/client-new-account-first-login-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-client-first-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove first-login backend and CURRENT_CONTEXT contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const api=fs.readFileSync('supabase/functions/rona-portal-api/index.ts','utf8');
          const client=fs.readFileSync('supabase/functions/rona-portal-api/client.ts','utf8');
          const admin=fs.readFileSync('supabase/functions/rona-admin-control-plane/index.ts','utf8');
          const authority=fs.readFileSync('assets/portal-runtime/client-context-selection-authority-v1.js','utf8');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          assert(!api.includes('RAIL_CLIENT_PUBLICATION_DISABLED'),'hard-disabled rail response reintroduced');
          const railStart=api.indexOf('if(route==="/v1/client/rail"&&req.method==="GET")');
          const railEnd=api.indexOf('if(route==="/v1/events"',railStart);
          assert(railStart>=0&&railEnd>railStart,'client rail route missing');
          const rail=api.slice(railStart,railEnd);
          assert(rail.includes('c.roles.includes("CLIENT")'),'client rail CLIENT role gate missing');
          assert(rail.includes('CLIENT_CONTRACT_CONTEXT_REQUIRED'),'client rail context requirement missing');
          assert(rail.includes('portal_private.client_user_has_contract_access'),'client rail server access gate missing');
          assert(rail.includes('send(origin,200'),'client rail safe 200 projection missing');
          for(const token of ['status:"EMPTY"','rail:[]','rail_documents:[]','wagons:[]'])assert(rail.includes(token),`client rail empty-state contract missing ${token}`);

          assert(!/MOVIZOR|client\/rail/i.test(client),'Client bootstrap must not depend on rail provider availability');
          assert(/client_user_has_contract_access/.test(client),'authoritative client contract access gate missing');
          assert(/contexts\.length>1/.test(client),'context selection contract missing');
          assert(/createClientUser/.test(admin),'admin client account creation path missing');
          assert(/'PENDING'::portal_private\.binding_status_enum/.test(admin),'pending fail-closed binding path missing');

          for(const token of ['window.RONA_CLIENT_CONTEXT','getCurrentContext','getAuthorizedContexts','selectionRequired','select','subscribe'])assert(authority.includes(token),`CURRENT_CONTEXT authority API missing ${token}`);
          console.log('CLIENT_NEW_ACCOUNT_FIRST_LOGIN_CONTRACT=PASS context=CURRENT_CONTEXT rail=OPTIONAL_SAFE backend=AUTHORITATIVE');
          NODE
      - name: Build and execute canonical client QA
        run: npm run build
