name: Apply Agent and Client logout control
on:
  push:
    branches: ['release/public-go-live-v1.1']
    paths: ['.github/workflows/apply-agent-client-logout-control-production.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - name: Reuse existing home control as logout without layout change
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('functions/portal/_middleware.js')
          s=p.read_text()
          old="window.__RONA_PORTAL_ROOT_LOGOUT__=true;let running=false;const isLogoutControl="
          new="window.__RONA_PORTAL_ROOT_LOGOUT__=true;let running=false;const prepareLogoutControl=()=>{if(!['/portal/agent','/portal/client'].includes(location.pathname))return;const home=document.querySelector('.rona-go-home');if(!home)return;if(home.id!=='ronaLogout'||String(home.textContent||'').trim()!=='Выйти'){home.id='ronaLogout';home.textContent='Выйти';home.dataset.ronaControlStatus='FUNCTIONAL'}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',prepareLogoutControl,{once:true});else queueMicrotask(prepareLogoutControl);new MutationObserver(prepareLogoutControl).observe(document.documentElement,{subtree:true,childList:true});const isLogoutControl="
          if s.count(old)!=1: raise SystemExit(f'PATCH_NEEDLE_COUNT={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit production logout control
        run: |
          git config user.name 'RONA Production QA'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/portal/_middleware.js
          git commit -m 'Route Agent and Client exit control through server logout'
          git push origin HEAD:${GITHUB_REF_NAME}
