name: Admin Applications Three Independent Actions QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/main-ui/admin-applications-passport-action-v2.js'
      - 'tests/admin-applications-three-independent-actions.test.mjs'
      - '.github/workflows/admin-applications-three-independent-actions-qa.yml'

permissions:
  contents: read

jobs:
  independent-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production handler and visual contracts
        run: |
          node --check functions/portal/main-ui/admin-applications-passport-action-v2.js
          node --test tests/admin-applications-three-independent-actions.test.mjs
          node tests/admin-application-passport-universal-action.test.mjs
