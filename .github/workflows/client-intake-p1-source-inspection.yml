name: Client Intake P1 Source Inspection
on:
  push:
    branches: [fix/client-intake-reliability-p1]
    paths: [.github/workflows/client-intake-p1-source-inspection.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact current release and backend sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/intake-source
          RELEASE=2d47e08a8420331672692507a74db6c6484ef04d
          MAIN=c4e93c8445a84aa987588558823533be2d1f4511
          printf 'RELEASE=%s\nMAIN=%s\n' "$RELEASE" "$MAIN" > /tmp/intake-source/refs.txt
          for pair in "release:$RELEASE" "main:$MAIN"; do
            label=${pair%%:*}; ref=${pair#*:}; paths=()
            for path in .github functions supabase scripts tests docs assets/portal-runtime package.json package-lock.json; do
              if git cat-file -e "$ref:$path" 2>/dev/null; then paths+=("$path"); fi
            done
            printf '%s\n' "${paths[@]}" > "/tmp/intake-source/$label-selected-paths.txt"
            git archive -o "/tmp/intake-source/$label.tar" "$ref" "${paths[@]}"
            git log -30 --format='%H %aI %s' "$ref" > "/tmp/intake-source/$label-history.txt"
            git ls-tree -r "$ref" > "/tmp/intake-source/$label-tree.txt"
          done
          sha256sum /tmp/intake-source/*.tar > /tmp/intake-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: client-applications-systemic-current-source
          path: /tmp/intake-source/
          retention-days: 3
          if-no-files-found: error
