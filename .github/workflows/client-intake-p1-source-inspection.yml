name: Client Intake P1 Source Inspection
on:
  push:
    branches: [fix/client-intake-reliability-p1]
    paths: [.github/workflows/client-intake-p1-source-inspection.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact candidate and source lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/intake-source
          git archive 6411619a55507d912672e02392fbe512a63dc90d -o /tmp/intake-source/candidate.tar
          git diff --stat 6411619a55507d912672e02392fbe512a63dc90d HEAD > /tmp/intake-source/source-diff.txt
          git show 4f0fde1c35fddabe02797f22e165c135fcfa09fb -- supabase/migrations/20260902233000_client_communication_admin_gate_v1.sql > /tmp/intake-source/routing-regression.txt
          sha256sum /tmp/intake-source/candidate.tar > /tmp/intake-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: client-intake-candidate-source
          path: /tmp/intake-source/
          retention-days: 3
          if-no-files-found: error
