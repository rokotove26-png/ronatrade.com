name: client rail isolated backend after incident
on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/api/**'
      - 'supabase/functions/rona-portal-api-candidate-20260817/**'
      - 'tests/client-rail-isolated-backend-after-incident.test.mjs'
      - '.github/workflows/client-rail-isolated-backend-after-incident.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node tests/client-rail-isolated-backend-after-incident.test.mjs
      - run: deno check --node-modules-dir=auto supabase/functions/rona-portal-api-candidate-20260817/client-rail-isolated-runtime-v1.ts
