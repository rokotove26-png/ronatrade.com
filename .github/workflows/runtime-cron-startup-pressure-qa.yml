name: Runtime cron startup pressure QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
    paths:
      - 'supabase/migrations/20260920040000_serialize_core_runtime_minute_jobs_v1.sql'
      - 'supabase/migrations/20260920040800_core_runtime_minute_execute_hardening_v1.sql'
      - 'tests/runtime-cron-startup-pressure-v1.test.mjs'
      - '.github/workflows/runtime-cron-startup-pressure-qa.yml'

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lock serialized cron source contract
        run: node tests/runtime-cron-startup-pressure-v1.test.mjs
