name: claims-current-first-production-smoke-20260824
on:
  push:
    branches: [qa/claims-current-first-production-smoke-20260824]
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - .github/workflows/claims-current-first-production-smoke-20260824.yml
permissions:
  contents: read
  statuses: write
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Claims current-first gate
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS -D /tmp/admin.h "https://ronaoil.com/portal/admin?smoke=$stamp" -o /tmp/admin.html
          echo '--- relevant production headers ---'
          grep -Ei '^(x-rona-|cache-control|cf-cache-status|age):' /tmp/admin.h || true
          echo '--- production markers ---'
          grep -o 'owner-main-v2-20260824-[0-9]*' /tmp/admin.html | head -n 3 || true
          grep -o 'x-rona-claims-first-paint[^<]*' /tmp/admin.html | head -n 2 || true
          grep -o '#page-claims>[^<]*display:none!important}' /tmp/admin.html | head -n 3 || true
          test "$(grep -Eic '^x-rona-claims-first-paint: current-only-v1' /tmp/admin.h)" -ge 1
          grep -Fq '#page-claims>*:not(.rona-claims-r2-root):not(.rona-claims-section-title){display:none!important}' /tmp/admin.html
          grep -q 'rona-claims-r2-loader' /tmp/admin.html
          grep -q 'rona-claims-title-loader' /tmp/admin.html
      - name: Publish production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: e6cb584f71597445c7217eb57af43ea4fdd31b9a
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          state=failure; desc='Claims current-first production smoke failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Claims current-first production smoke passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/claims-current-first-production\",\"description\":\"$desc\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}" >/dev/null
