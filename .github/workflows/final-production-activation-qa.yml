name: Final full production activation gate

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-live-*'
      - 'release/public-go-live-v1.1'

permissions:
  contents: read
  checks: read
  actions: read
  statuses: write

jobs:
  full-production-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen-source and runtime activation gate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          cmp -s portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html dist/portal/admin.html
          cmp -s portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html dist/portal/agent.html
          cmp -s portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html dist/portal/client.html
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          grep -q 'rona-admin-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'rona-client-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'rona-admin-legacy-anchor-compat-v2' functions/portal/admin/_middleware.js
          grep -q 'rona-agent-live-action-runtime-v1' functions/_middleware.js
          grep -q 'rona-client-live-action-runtime-v1' functions/_middleware.js
          grep -q 'rona-portal-session-menu-v1' functions/_middleware.js
          echo FROZEN_SOURCE_AND_RUNTIME_GATE=PASS
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve deployed target and controlled session
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN,prod=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<90;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-FINAL-ACTIVATION'}});if(r.ok){const j=await r.json(),cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');if(cf){if(prod){fs.appendFileSync(process.env.GITHUB_ENV,'TARGET_ORIGIN=https://ronaoil.com\n');return}const m=String(cf.output?.summary||'').match(/https:\/\/[a-z0-9-]+\.rona-trade-public\.pages\.dev/i);if(m){fs.appendFileSync(process.env.GITHUB_ENV,`TARGET_ORIGIN=${m[0]}\n`);return}}}await sleep(5000)}throw new Error('Cloudflare deployment unavailable')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl --fail --silent --show-error --request POST \
            'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "x-github-repository: ${GITHUB_REPOSITORY}" \
            --header "x-github-sha: ${GITHUB_SHA}" \
            --header "x-github-ref: ${GITHUB_REF}" \
            --header "x-github-run-id: ${GITHUB_RUN_ID}" \
            --output /tmp/rona-final-session.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/rona-final-session.json','utf8'));if(!j.ok||!j.session?.access_token||!j.session?.refresh_token)throw new Error('controlled session unavailable');console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);fs.appendFileSync(process.env.GITHUB_ENV,`RONA_ACCESS_TOKEN<<EOF\n${j.session.access_token}\nEOF\nRONA_REFRESH_TOKEN<<EOF\n${j.session.refresh_token}\nEOF\n`);
          NODE
          rm -f /tmp/rona-final-session.json
      - name: Full integrated functional and security QA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ env.TARGET_ORIGIN }}
          RONA_ACCESS_TOKEN: ${{ env.RONA_ACCESS_TOKEN }}
          RONA_REFRESH_TOKEN: ${{ env.RONA_REFRESH_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const base=process.env.TARGET_ORIGIN,prod=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1',repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const adminPages=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'];
          const agentPages=['home','clients','prices','deals','economics','settlements','documents','messages'];
          const staffViews=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function wait(p,fn,label,n=650){for(let i=0;i<n;i++){if(await p.evaluate(fn))return;await p.waitForTimeout(100)}throw new Error(label+' timeout')}
          async function session(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();if(!r.ok||!j.ok)throw new Error('session broker '+r.status);return j.session}
          async function ctxFor(browser,s){const c=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true}),h=new URL(base).hostname;await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:h,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:h,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          function inventory(){const o={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const el of document.querySelectorAll('button,a,input,select,textarea,form')){const cs=getComputedStyle(el),r=el.getBoundingClientRect();if(cs.display==='none'||cs.visibility==='hidden'||r.width===0||r.height===0)continue;o.total++;const s=el.dataset.ronaControlStatus;if(s==='FUNCTIONAL'||s==='INTENTIONALLY_READ_ONLY_BY_AUTHORITY')o[s]++;else o.UNWIRED++}return o}
          (async()=>{
            const browser=await chromium.launch({headless:true}),ctx=await ctxFor(browser,{access_token:process.env.RONA_ACCESS_TOKEN,refresh_token:process.env.RONA_REFRESH_TOKEN});
            const ap=await ctx.newPage(),adminErrors=[];ap.on('pageerror',e=>adminErrors.push(String(e.message||e)));ap.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(m.text()))adminErrors.push(m.text())});await ap.goto(base+'/portal/admin?_final='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(ap.url()).pathname==='/portal/admin','Admin route');await wait(ap,()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true,'Admin boot');await wait(ap,()=>window.__RONA_ADMIN_LIVE_READY__===true,'Admin live');
            const live=await ap.evaluate(()=>window.__RONA_ADMIN_LIVE__),counts={clients:live.admin.clients.length,contracts:live.admin.contracts.length,deals:live.admin.deals.length,documents:live.admin.documents.length,payments:live.admin.payments.length,shipments:live.admin.shipments.length,rail:live.admin.rail.length,publications:live.admin.publications.length,controls:live.admin.controls.length};assert(JSON.stringify(counts)===JSON.stringify({clients:3,contracts:2,deals:4,documents:14,payments:1,shipments:0,rail:1,publications:17,controls:12}),'counts '+JSON.stringify(counts));const d4=live.admin.deals.find(x=>x.deal_id==='DEAL-2026-004');assert(d4?.business_status==='EXECUTING'&&d4?.finance_status==='PAID'&&d4?.accounting_closure_status==='OPEN','DEAL004');const ct=new Set(live.admin.controls.map(x=>x.control_type));assert(ct.has('PAYMENT_ACCOUNTING_OPEN')&&ct.has('RAIL_SHIPMENT_AUTHORITY_MISSING'),'DEAL004 controls');assert(live.admin.shipments.length===0,'fake shipment');assert(live.admin.rail.some(x=>String(x.gu12_number)==='1308903120'),'GU12');
            const nav=await ap.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(nav)===JSON.stringify(adminPages),'Admin pages');const adminSnapshots=[];for(const p of nav){await ap.locator(`#nav button[data-page="${p}"]`).click();await ap.waitForTimeout(120);const st=await ap.locator('#page-'+p).evaluate(el=>({active:el.classList.contains('active'),visible:getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0,live:el.dataset.ronaLiveAuthority==='true'}));assert(st.active&&st.visible,p+' invisible');if(p!=='access')assert(st.live,p+' not live');adminSnapshots.push(await ap.evaluate(inventory))}await ap.waitForTimeout(1300);assert(adminErrors.length===0,'Admin JS '+JSON.stringify(adminErrors.slice(0,5)));
            await ap.locator('#nav button[data-page="documents"]').click();await ap.waitForTimeout(100);const dr=ap.locator('[data-rona-live-document]').first();assert(await dr.count()===1,'doc row');await dr.click();await ap.locator('#modalMask.open').waitFor({state:'attached',timeout:5000});assert(/Document ID/.test(await ap.locator('#modalBody').innerText()),'doc detail');const adminInv=adminSnapshots.reduce((o,x)=>{o.FUNCTIONAL+=x.FUNCTIONAL;o.INTENTIONALLY_READ_ONLY_BY_AUTHORITY+=x.INTENTIONALLY_READ_ONLY_BY_AUTHORITY;o.UNWIRED+=x.UNWIRED;o.total+=x.total;return o},{FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0});assert(adminInv.UNWIRED===0&&adminInv.total>0,'Admin inventory '+JSON.stringify(adminInv));
            const agentR=await ctx.request.get(base+'/portal/api/v1/agent/bootstrap'),agentJ=await agentR.json();assert(agentR.ok()&&agentJ.data?.agentPersonId==='AGP-2026-001','Agent bootstrap');const agentDeals=(agentJ.data.deals||[]).map(x=>x.dealId).sort();assert(agentDeals.includes('DEAL-2026-004')&&!agentDeals.includes('DEAL-2026-003'),'Agent scope');assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'Agent IDOR');assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-004')).ok(),'Agent own deal');const ag=await ctx.newPage(),agentErrors=[];ag.on('pageerror',e=>agentErrors.push(String(e.message||e)));await ag.goto(base+'/portal/agent',{waitUntil:'domcontentloaded'});await wait(ag,()=>document.querySelectorAll('.nav button[data-page]:not([disabled])').length===8,'Agent boot UI');const an=await ag.locator('.nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(an)===JSON.stringify(agentPages),'Agent pages');let agentInv={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const p of an){await ag.locator(`.nav button[data-page="${p}"]`).click();await ag.waitForTimeout(100);assert(await ag.locator('#page-'+p).evaluate(el=>el.classList.contains('active')),p+' agent inactive');const x=await ag.evaluate(inventory);for(const k of Object.keys(agentInv))agentInv[k]+=x[k]}assert(agentErrors.length===0,'Agent JS');assert(agentInv.UNWIRED===0&&agentInv.total>0,'Agent inventory');
            const cb=await ctx.request.get(base+'/portal/api/v1/client/bootstrap'),cj=await cb.json();assert(cb.ok()&&Array.isArray(cj.data?.contexts)&&cj.data.contexts.length===0,'Client zero binding bootstrap');const cr=await ctx.request.get(base+'/portal/client',{maxRedirects:0}),ctext=await cr.text();assert(cr.status()===403&&ctext.includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'Client fail closed');
            const sp=await ctx.newPage(),staffErrors=[];sp.on('pageerror',e=>staffErrors.push(String(e.message||e)));await sp.goto(base+'/portal/staff',{waitUntil:'domcontentloaded'});await wait(sp,()=>document.querySelector('#identity')&&!/Проверка сессии/.test(document.querySelector('#identity').textContent||''),'Staff boot');assert(await sp.locator('#ronaLogout').count()===1,'Staff logout');const sn=await sp.locator('#nav button[data-view]').evaluateAll(xs=>xs.map(x=>x.dataset.view));assert(JSON.stringify(sn)===JSON.stringify(staffViews),'Staff views');let staffFunctional=0,staffReadOnly=0;for(const v of sn){await sp.locator(`#nav button[data-view="${v}"]`).click();await sp.waitForTimeout(80);assert(!/Загрузка…/.test(await sp.locator('#content').innerText()),v+' loading');const x=await sp.evaluate(()=>{const els=[...document.querySelectorAll('button,a,input,select,textarea,form')].filter(el=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0});return{f:els.filter(x=>!x.disabled).length,r:els.filter(x=>x.disabled).length}});staffFunctional+=x.f;staffReadOnly+=x.r}assert(staffErrors.length===0,'Staff JS');await sp.locator('#nav button[data-view="tasks"]').click();const ft=sp.locator('tr[data-task]').first();if(await ft.count()){await ft.click();assert(await sp.locator('#saveTask').count()===1&&await sp.locator('#sendTaskMessage').count()===1,'Staff actions')}
            const put=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PUT'}),patch=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PATCH'}),del=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'DELETE'});assert([put.status(),patch.status(),del.status()].every(x=>x===405),'method gate');assert(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(await ap.content()),'JWT HTML');
            let writePropagation='SKIPPED_ON_PREVIEW';if(prod){await sp.locator('#nav button[data-view="tasks"]').click();const qa=sp.locator('tr[data-task="QA-FINAL-ACTIVATION-20260817-001"]');assert(await qa.count()===1,'QA staff task absent');await qa.click();await sp.locator('#taskStatus').selectOption('IN_PROGRESS');await sp.locator('#taskNote').fill('Final production activation QA');await sp.locator('#saveTask').click();await sp.waitForFunction(()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),null,{timeout:15000});const sb=await ctx.request.get(base+'/portal/api/v1/staff/bootstrap'),sj=await sb.json();assert(sj.data.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001')?.status==='IN_PROGRESS','Staff write');await ap.reload({waitUntil:'domcontentloaded'});await wait(ap,()=>window.__RONA_ADMIN_LIVE_READY__===true,'Admin reload');const pr=await ap.evaluate(()=>({task:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001'),audit:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id==='QA-FINAL-ACTIVATION-20260817-001')}));assert(pr.task?.status==='IN_PROGRESS'&&pr.audit,'write/audit propagation');writePropagation='PASS'}
            async function logout(kind,path,openSel,button){const s=await session(),c=await ctxFor(browser,s),p=await c.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded'});if(openSel){await p.locator(openSel).waitFor({state:'visible',timeout:15000});await p.locator(openSel).click()}await p.locator(button).waitFor({state:'visible',timeout:15000});await p.locator(button).click();await p.waitForURL(u=>new URL(u).pathname==='/',{timeout:15000});assert(!(await c.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),kind+' cookies');const d=await c.request.get(base+'/portal/admin',{maxRedirects:0});assert([302,303,401,403].includes(d.status()),kind+' direct route');await c.close()}
            await logout('Admin','/portal/admin',null,'#adminLogoutBtn');await logout('Staff','/portal/staff',null,'#ronaLogout');await logout('Agent','/portal/agent','#agentAuthState','#ronaPortalLogoutMenuButton');await logout('Selector','/portal/select',null,'form[action="/portal/auth/logout"] button');const cs=await session(),cc=await ctxFor(browser,cs),lr=await cc.request.post(base+'/portal/auth/logout',{headers:{origin:base,referer:base+'/portal/client'},maxRedirects:0});assert(lr.status()===303&&(lr.headers()['location']==='/'||lr.headers()['location']===base+'/'),'Client logout');assert(!(await cc.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),'Client cookies');await cc.close();
            const interactive={admin:adminInv,staff:{FUNCTIONAL:staffFunctional,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:staffReadOnly,UNWIRED:0,total:staffFunctional+staffReadOnly},agent:agentInv,client:{FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0,securityState:'FAIL_CLOSED_ZERO_BINDING'}};console.log('RONA_FINAL_ACTIVATION_QA='+JSON.stringify({ok:true,origin:base,production:prod,adminSections:'23/23',interactive,counts,staff:'PASS',agent:{agentPersonId:agentJ.data.agentPersonId,deals:agentDeals},client:'FAIL_CLOSED_ZERO_BINDING',writePropagation,documentWorkflow:'LIVE_METADATA_DETAIL; BINARY_SOURCE_GAP_READ_ONLY',security:{idor:'PASS',methodGate:'GET_POST_ONLY',tokenLeak:false},logoutRoot:'PASS',deal004:'PASS'}));await ctx.close();await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Clean runtime secrets
        if: always()
        run: |
          unset RONA_ACCESS_TOKEN RONA_REFRESH_TOKEN || true
          rm -f /tmp/rona-final-session.json || true
