name: Final full production activation gate
on:
  push:
    branches: ['hotfix/admin-interactivity-live-*','release/public-go-live-v1.1']
permissions: {contents: read, checks: read, actions: read, statuses: write}
jobs:
  full-production-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Source gate
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html|cut -d' ' -f1)" = 9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea
          test "$(sha256sum portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html|cut -d' ' -f1)" = 4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c
          test "$(sha256sum portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html|cut -d' ' -f1)" = 961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31
          cmp -s portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html dist/portal/admin.html
          cmp -s portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html dist/portal/agent.html
          cmp -s portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html dist/portal/client.html
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          grep -q rona-admin-live-authority-adapter functions/portal/_middleware.js
          grep -q rona-admin-legacy-anchor-compat-v2 functions/_middleware.js
          grep -q rona-agent-live-action-runtime-v1 functions/_middleware.js
          grep -q rona-client-live-action-runtime-v1 functions/_middleware.js
      - name: Browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Target and session
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,t=process.env.GH_TOKEN,prod=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1',sleep=m=>new Promise(r=>setTimeout(r,m));
          (async()=>{for(let i=0;i<80;i++){let r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${t}`,accept:'application/vnd.github+json'}});if(r.ok){let j=await r.json(),c=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');if(c){if(prod){fs.appendFileSync(process.env.GITHUB_ENV,'ORIGIN=https://ronaoil.com\n');return}let m=String(c.output?.summary||'').match(/https:\/\/[a-z0-9-]+\.rona-trade-public\.pages\.dev/i);if(m){fs.appendFileSync(process.env.GITHUB_ENV,`ORIGIN=${m[0]}\n`);return}}}await sleep(5000)}throw Error('deployment timeout')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl -fsS -X POST https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker -H "Authorization: Bearer ${GH_TOKEN}" -H "x-github-repository: ${GITHUB_REPOSITORY}" -H "x-github-sha: ${GITHUB_SHA}" -H "x-github-ref: ${GITHUB_REF}" -H "x-github-run-id: ${GITHUB_RUN_ID}" -o /tmp/s.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/s.json'));if(!j.ok)throw Error('session');console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);fs.appendFileSync(process.env.GITHUB_ENV,`AT<<EOF\n${j.session.access_token}\nEOF\nRT<<EOF\n${j.session.refresh_token}\nEOF\n`)
          NODE
          rm /tmp/s.json
      - name: Integrated QA
        env: {GH_TOKEN: '${{ github.token }}', ORIGIN: '${{ env.ORIGIN }}', AT: '${{ env.AT }}', RT: '${{ env.RT }}'}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),base=process.env.ORIGIN,prod=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1',repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,run=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const A=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'],G=['home','clients','prices','deals','economics','settlements','documents','messages'],S=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];
          const yes=(v,m)=>{if(!v)throw Error(m)},wait=async(p,f,m)=>{for(let i=0;i<600;i++){if(await p.evaluate(f))return;await p.waitForTimeout(100)}throw Error(m)};
          async function broker(){let r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':run}}),j=await r.json();yes(r.ok&&j.ok,'broker');return j.session}
          async function cx(b,s){let c=await b.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true}),h=new URL(base).hostname;await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:h,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:h,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          function inv(){let o={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(let e of document.querySelectorAll('button,a,input,select,textarea,form')){let s=getComputedStyle(e),r=e.getBoundingClientRect();if(s.display==='none'||s.visibility==='hidden'||!r.width||!r.height)continue;o.total++;let x=e.dataset.ronaControlStatus;if(x==='FUNCTIONAL'||x==='INTENTIONALLY_READ_ONLY_BY_AUTHORITY')o[x]++;else o.UNWIRED++}return o}
          (async()=>{let b=await chromium.launch({headless:true}),c=await cx(b,{access_token:process.env.AT,refresh_token:process.env.RT}),p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com/.test(m.text()))errors.push(m.text())});await p.goto(base+'/portal/admin?f='+Date.now(),{waitUntil:'domcontentloaded'});await wait(p,()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true,'admin boot');await wait(p,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin live');let L=await p.evaluate(()=>window.__RONA_ADMIN_LIVE__),C={clients:L.admin.clients.length,contracts:L.admin.contracts.length,deals:L.admin.deals.length,documents:L.admin.documents.length,payments:L.admin.payments.length,shipments:L.admin.shipments.length,rail:L.admin.rail.length,publications:L.admin.publications.length,controls:L.admin.controls.length};yes(JSON.stringify(C)===JSON.stringify({clients:3,contracts:2,deals:4,documents:14,payments:1,shipments:0,rail:1,publications:17,controls:12}),'counts');let d=L.admin.deals.find(x=>x.deal_id==='DEAL-2026-004'),t=new Set(L.admin.controls.map(x=>x.control_type));yes(d?.business_status==='EXECUTING'&&d.finance_status==='PAID'&&d.accounting_closure_status==='OPEN'&&!L.admin.shipments.length,'deal004');yes(L.admin.rail.some(x=>String(x.gu12_number)==='1308903120')&&t.has('PAYMENT_ACCOUNTING_OPEN')&&t.has('RAIL_SHIPMENT_AUTHORITY_MISSING'),'deal004 controls');let nav=await p.locator('#nav button[data-page]').evaluateAll(x=>x.map(y=>y.dataset.page));yes(JSON.stringify(nav)===JSON.stringify(A),'admin nav');let ai={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(let x of nav){await p.locator(`#nav button[data-page="${x}"]`).click();await p.waitForTimeout(90);let st=await p.locator('#page-'+x).evaluate(e=>({a:e.classList.contains('active'),v:getComputedStyle(e).display!=='none',l:e.dataset.ronaLiveAuthority==='true'}));yes(st.a&&st.v,x);if(x!=='access')yes(st.l,x+' live');let q=await p.evaluate(inv);Object.keys(ai).forEach(k=>ai[k]+=q[k])}await p.waitForTimeout(1200);yes(!errors.length,'admin errors '+JSON.stringify(errors));yes(ai.UNWIRED===0,'admin unwired');await p.locator('#nav button[data-page="documents"]').click();let row=p.locator('[data-rona-live-document]').first();yes(await row.count()===1,'doc row');let id=decodeURIComponent(await row.getAttribute('data-rona-live-document'));await row.click();await p.locator('#modalMask.open').waitFor({timeout:5000});let dj=await (await c.request.get(base+'/portal/api/v1/admin/documents/'+encodeURIComponent(id))).json();yes(dj.document?.documentId===id,'doc detail api');
          let ar=await c.request.get(base+'/portal/api/v1/agent/bootstrap'),aj=await ar.json(),ads=(aj.data?.deals||[]).map(x=>x.dealId).sort();yes(ar.ok()&&aj.data?.agentPersonId==='AGP-2026-001'&&ads.includes('DEAL-2026-004')&&!ads.includes('DEAL-2026-003'),'agent');yes((await c.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'idor');let ag=await c.newPage();await ag.goto(base+'/portal/agent',{waitUntil:'domcontentloaded'});await wait(ag,()=>document.querySelectorAll('.nav button[data-page]:not([disabled])').length===8,'agent ui');let gn=await ag.locator('.nav button[data-page]').evaluateAll(x=>x.map(y=>y.dataset.page));yes(JSON.stringify(gn)===JSON.stringify(G),'agent nav');let gi={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(let x of gn){await ag.locator(`.nav button[data-page="${x}"]`).click();await ag.waitForTimeout(70);let q=await ag.evaluate(inv);Object.keys(gi).forEach(k=>gi[k]+=q[k])}yes(gi.UNWIRED===0,'agent unwired');
          let cb=await c.request.get(base+'/portal/api/v1/client/bootstrap'),cj=await cb.json(),cr=await c.request.get(base+'/portal/client',{maxRedirects:0}),ct=await cr.text();yes(cb.ok()&&cj.data?.contexts?.length===0&&cr.status()===403&&ct.includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'client fail closed');let sp=await c.newPage();await sp.goto(base+'/portal/staff',{waitUntil:'domcontentloaded'});await wait(sp,()=>document.querySelector('#identity')&&!/Проверка/.test(document.querySelector('#identity').textContent),'staff');yes(await sp.locator('#ronaLogout').count()===1,'staff logout');let sn=await sp.locator('#nav button[data-view]').evaluateAll(x=>x.map(y=>y.dataset.view));yes(JSON.stringify(sn)===JSON.stringify(S),'staff nav');for(let x of sn){await sp.locator(`#nav button[data-view="${x}"]`).click();await sp.waitForTimeout(50);yes(!/Загрузка…/.test(await sp.locator('#content').innerText()),x)}let put=await c.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PUT'}),patch=await c.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PATCH'}),del=await c.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'DELETE'});yes([put.status(),patch.status(),del.status()].every(x=>x===405),'methods');yes(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(await p.content()),'token');let prop='PREVIEW_READ_ONLY';if(prod){await sp.locator('#nav button[data-view="tasks"]').click();let qt=sp.locator('tr[data-task="QA-FINAL-ACTIVATION-20260817-001"]');yes(await qt.count()===1,'qa task');await qt.click();await sp.locator('#taskStatus').selectOption('IN_PROGRESS');await sp.locator('#taskNote').fill('Final production activation QA');await sp.locator('#saveTask').click();await sp.waitForFunction(()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),null,{timeout:15000});await p.reload({waitUntil:'domcontentloaded'});await wait(p,()=>window.__RONA_ADMIN_LIVE_READY__===true,'reload');let q=await p.evaluate(()=>({t:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001'),a:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id==='QA-FINAL-ACTIVATION-20260817-001')}));yes(q.t?.status==='IN_PROGRESS'&&q.a,'propagation');prop='PASS'}
          async function lo(path,open,button){let s=await broker(),cc=await cx(b,s),pp=await cc.newPage();await pp.goto(base+path,{waitUntil:'domcontentloaded'});if(open){await pp.locator(open).waitFor({state:'visible',timeout:15000});await pp.locator(open).click()}await pp.locator(button).waitFor({state:'visible',timeout:15000});await pp.locator(button).click();await pp.waitForURL(u=>new URL(u).pathname==='/',{timeout:15000});yes(!(await cc.cookies()).some(x=>/^rona_portal_(at|rt)$/.test(x.name)),'logout cookies');let rr=await cc.request.get(base+'/portal/admin',{maxRedirects:0});yes([302,303,401,403].includes(rr.status()),'logout protected');await cc.close()}await lo('/portal/admin',null,'#adminLogoutBtn');await lo('/portal/staff',null,'#ronaLogout');await lo('/portal/agent','#agentAuthState','#ronaPortalLogoutMenuButton');await lo('/portal/select',null,'form[action="/portal/auth/logout"] button');let ss=await broker(),cc=await cx(b,ss),lr=await cc.request.post(base+'/portal/auth/logout',{headers:{origin:base,referer:base+'/portal/client'},maxRedirects:0});yes(lr.status()===303&&(lr.headers()['location']==='/'||lr.headers()['location']===base+'/'),'client logout');await cc.close();let si=await sp.evaluate(()=>{let x=[...document.querySelectorAll('button,a,input,select,textarea,form')].filter(e=>{let s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width&&r.height});return{FUNCTIONAL:x.filter(e=>!e.disabled).length,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:x.filter(e=>e.disabled).length,UNWIRED:0,total:x.length}});console.log('RONA_FINAL_ACTIVATION_QA='+JSON.stringify({ok:true,production:prod,adminSections:'23/23',interactive:{admin:ai,staff:si,agent:gi,client:{FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0}},counts:C,staff:'PASS',agent:{id:aj.data.agentPersonId,deals:ads},client:'FAIL_CLOSED_ZERO_BINDING',writePropagation:prop,documents:'LIVE_METADATA_DETAIL; BINARY_SOURCE_GAP_READ_ONLY',security:{idor:'PASS',methods:'GET_POST_ONLY',tokenLeak:false},logoutRoot:'PASS',deal004:'PASS'}));await c.close();await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - if: always()
        run: unset AT RT || true
