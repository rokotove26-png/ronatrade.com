name: Final full production activation gate

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-live-*'
      - 'release/public-go-live-v1.1'

permissions:
  contents: read
  checks: read
  actions: read
  statuses: write

jobs:
  full-production-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen sources and activation adapters
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          cmp -s 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' dist/portal/admin.html
          cmp -s 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' dist/portal/agent.html
          cmp -s 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' dist/portal/client.html
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          grep -q 'rona-admin-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'rona-client-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'rona-admin-runtime-compat-v1' functions/_middleware.js
          grep -q 'rona-agent-live-action-runtime-v1' functions/_middleware.js
          grep -q 'rona-client-live-action-runtime-v1' functions/_middleware.js
          grep -q 'rona-portal-session-menu-v1' functions/_middleware.js
          echo 'FROZEN_SOURCE_AND_ADAPTER_GATE=PASS'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve deployed target and obtain controlled session
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN,isProd=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<90;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-FINAL-ACTIVATION'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');if(cf){if(isProd){fs.appendFileSync(process.env.GITHUB_ENV,'TARGET_ORIGIN=https://ronaoil.com\n');return}const m=String(cf.output?.summary||'').match(/https:\/\/[a-z0-9-]+\.rona-trade-public\.pages\.dev/i);if(m){fs.appendFileSync(process.env.GITHUB_ENV,`TARGET_ORIGIN=${m[0]}\n`);return}}}await sleep(5000)}throw new Error('Cloudflare deployment unavailable')})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          curl --fail --silent --show-error --request POST \
            'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "x-github-repository: ${GITHUB_REPOSITORY}" \
            --header "x-github-sha: ${GITHUB_SHA}" \
            --header "x-github-ref: ${GITHUB_REF}" \
            --header "x-github-run-id: ${GITHUB_RUN_ID}" \
            --output /tmp/rona-final-session.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/rona-final-session.json','utf8'));
          if(!j.ok||!j.session?.access_token||!j.session?.refresh_token)throw new Error('controlled session unavailable');
          console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);
          fs.appendFileSync(process.env.GITHUB_ENV,`RONA_ACCESS_TOKEN<<EOF\n${j.session.access_token}\nEOF\nRONA_REFRESH_TOKEN<<EOF\n${j.session.refresh_token}\nEOF\n`);
          NODE
          rm -f /tmp/rona-final-session.json
      - name: Integrated functional, authority, security and logout QA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ env.TARGET_ORIGIN }}
          RONA_ACCESS_TOKEN: ${{ env.RONA_ACCESS_TOKEN }}
          RONA_REFRESH_TOKEN: ${{ env.RONA_REFRESH_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const base=process.env.TARGET_ORIGIN,repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN,isProd=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1';
          const expectedAdmin=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'];
          const expectedAgent=['home','clients','prices','deals','economics','settlements','documents','messages'];
          const expectedStaff=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function wait(page,fn,label,n=650){for(let i=0;i<n;i++){if(await page.evaluate(fn))return;await page.waitForTimeout(100)}throw new Error(label+' timeout')}
          async function newSession(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();if(!r.ok||!j.ok)throw new Error('session broker '+r.status);return j.session}
          async function authContext(browser,s){const host=new URL(base).hostname,c=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:host,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:host,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          function visibleInventoryScript(){const out={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const el of document.querySelectorAll('button,a,input,select,textarea,form')){const cs=getComputedStyle(el),r=el.getBoundingClientRect();if(cs.display==='none'||cs.visibility==='hidden'||r.width===0||r.height===0)continue;out.total++;const s=el.dataset.ronaControlStatus;if(s==='FUNCTIONAL'||s==='INTENTIONALLY_READ_ONLY_BY_AUTHORITY')out[s]++;else out.UNWIRED++}return out}
          (async()=>{
            const browser=await chromium.launch({headless:true}),ctx=await authContext(browser,{access_token:process.env.RONA_ACCESS_TOKEN,refresh_token:process.env.RONA_REFRESH_TOKEN});
            const adminPage=await ctx.newPage(),adminErrors=[];adminPage.on('pageerror',e=>adminErrors.push(String(e.message||e)));adminPage.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(m.text()))adminErrors.push(m.text())});
            await adminPage.goto(base+'/portal/admin?_final='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(adminPage.url()).pathname==='/portal/admin','Admin route failed');await wait(adminPage,()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true,'Admin boot');await wait(adminPage,()=>window.__RONA_ADMIN_LIVE_READY__===true,'Admin live');
            const admin=await adminPage.evaluate(()=>window.__RONA_ADMIN_LIVE__),counts={clients:admin.admin.clients.length,contracts:admin.admin.contracts.length,deals:admin.admin.deals.length,documents:admin.admin.documents.length,payments:admin.admin.payments.length,shipments:admin.admin.shipments.length,rail:admin.admin.rail.length,publications:admin.admin.publications.length,controls:admin.admin.controls.length};assert(JSON.stringify(counts)===JSON.stringify({clients:3,contracts:2,deals:4,documents:14,payments:1,shipments:0,rail:1,publications:17,controls:12}),'Counts mismatch '+JSON.stringify(counts));
            const d4=admin.admin.deals.find(x=>x.deal_id==='DEAL-2026-004');assert(d4&&d4.business_status==='EXECUTING'&&d4.finance_status==='PAID'&&d4.accounting_closure_status==='OPEN','DEAL004 state mismatch');const types=new Set(admin.admin.controls.map(x=>x.control_type));assert(types.has('PAYMENT_ACCOUNTING_OPEN')&&types.has('RAIL_SHIPMENT_AUTHORITY_MISSING'),'DEAL004 controls missing');assert(admin.admin.shipments.length===0,'Fictional shipment exists');assert(admin.admin.rail.some(x=>String(x.gu12_number)==='1308903120'),'GU-12 missing');
            const adminNav=await adminPage.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(adminNav)===JSON.stringify(expectedAdmin),'Admin 23 contract mismatch');for(const p of adminNav){await adminPage.locator(`#nav button[data-page="${p}"]`).click();await adminPage.waitForTimeout(100);const st=await adminPage.locator('#page-'+p).evaluate(el=>({a:el.classList.contains('active'),v:getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0,l:el.dataset.ronaLiveAuthority==='true'}));assert(st.a&&st.v,p+' unavailable');if(p!=='access')assert(st.l,p+' not live-backed')}
            assert(await adminPage.locator('#clock').count()===1&&await adminPage.locator('#calendar').count()===1,'Clock compatibility absent');await adminPage.waitForTimeout(1400);assert(adminErrors.length===0,'Admin JS errors '+JSON.stringify(adminErrors.slice(0,5)));
            await adminPage.locator('#nav button[data-page="documents"]').click();await adminPage.waitForTimeout(120);const doc=adminPage.locator('[data-rona-live-document]').first();assert(await doc.count()===1,'Document detail row absent');await doc.click();await adminPage.waitForTimeout(250);assert(/Document ID/.test(await adminPage.locator('body').innerText()),'Document detail not opened');
            const adminAll=await adminPage.evaluate(()=>{const o={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const el of document.querySelectorAll('[data-rona-control-status]')){o.total++;const s=el.dataset.ronaControlStatus;if(s in o)o[s]++;else o.UNWIRED++}return o});assert(adminAll.UNWIRED===0&&adminAll.total>0,'Admin unwired '+JSON.stringify(adminAll));

            const agentApi=await ctx.request.get(base+'/portal/api/v1/agent/bootstrap'),agentJ=await agentApi.json();assert(agentApi.ok()&&agentJ.data?.agentPersonId==='AGP-2026-001','Agent bootstrap failed');const agentDeals=(agentJ.data.deals||[]).map(x=>x.dealId).sort();assert(agentDeals.includes('DEAL-2026-004')&&!agentDeals.includes('DEAL-2026-003'),'Agent scope '+JSON.stringify(agentDeals));assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'Agent IDOR leaked');assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-004')).ok(),'Agent allowed deal denied');
            const agentPage=await ctx.newPage(),agentErrors=[];agentPage.on('pageerror',e=>agentErrors.push(String(e.message||e)));await agentPage.goto(base+'/portal/agent',{waitUntil:'domcontentloaded'});await wait(agentPage,()=>document.querySelectorAll('.nav button[data-page]:not([disabled])').length===8,'Agent boot');const an=await agentPage.locator('.nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(an)===JSON.stringify(expectedAgent),'Agent nav mismatch');for(const p of an){await agentPage.locator(`.nav button[data-page="${p}"]`).click();await agentPage.waitForTimeout(80);assert(await agentPage.locator('#page-'+p).evaluate(el=>el.classList.contains('active')),p+' Agent inactive')}assert(agentErrors.length===0,'Agent JS errors '+JSON.stringify(agentErrors));const agentAll=await agentPage.evaluate(()=>{const o={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const el of document.querySelectorAll('[data-rona-control-status]')){o.total++;const s=el.dataset.ronaControlStatus;if(s in o)o[s]++;else o.UNWIRED++}return o});assert(agentAll.UNWIRED===0&&agentAll.total>0,'Agent unwired '+JSON.stringify(agentAll));

            const clientApi=await ctx.request.get(base+'/portal/api/v1/client/bootstrap'),clientJ=await clientApi.json();assert(clientApi.ok()&&Array.isArray(clientJ.data?.contexts)&&clientJ.data.contexts.length===0,'Client zero-binding bootstrap mismatch');const clientRoute=await ctx.request.get(base+'/portal/client',{maxRedirects:0});assert(clientRoute.status()===403&&(await clientRoute.text()).includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'Client route did not fail closed');

            const staffPage=await ctx.newPage(),staffErrors=[];staffPage.on('pageerror',e=>staffErrors.push(String(e.message||e)));await staffPage.goto(base+'/portal/staff',{waitUntil:'domcontentloaded'});await wait(staffPage,()=>document.querySelector('#identity')&&!/Проверка сессии/.test(document.querySelector('#identity').textContent||''),'Staff boot');assert(await staffPage.locator('#ronaLogout').count()===1,'Staff logout missing');const sn=await staffPage.locator('#nav button[data-view]').evaluateAll(xs=>xs.map(x=>x.dataset.view));assert(JSON.stringify(sn)===JSON.stringify(expectedStaff),'Staff nav mismatch');for(const v of sn){await staffPage.locator(`#nav button[data-view="${v}"]`).click();await staffPage.waitForTimeout(70);assert(!/Загрузка…/.test(await staffPage.locator('#content').innerText()),v+' Staff loading stuck')}assert(staffErrors.length===0,'Staff JS errors '+JSON.stringify(staffErrors));
            await staffPage.locator('#nav button[data-view="tasks"]').click();const firstTask=staffPage.locator('tr[data-task]').first();if(await firstTask.count()){await firstTask.click();await staffPage.waitForTimeout(80);assert(await staffPage.locator('#saveTask').count()===1&&await staffPage.locator('#sendTaskMessage').count()===1,'Staff task actions missing')}
            const staffInventory=await staffPage.evaluate(()=>{const els=[...document.querySelectorAll('button,a,input,select,textarea,form')].filter(el=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0});return{total:els.length,FUNCTIONAL:els.filter(x=>!x.disabled).length,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:els.filter(x=>x.disabled).length,UNWIRED:0}});assert(staffInventory.total>0,'Staff inventory empty');

            const put=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PUT'}),patch=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PATCH'}),del=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'DELETE'});assert([put.status(),patch.status(),del.status()].every(x=>x===405),'Unexpected proxy method enabled');assert(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(await adminPage.content()),'JWT leaked into HTML');

            let writePropagation='SKIPPED_ON_PREVIEW',agentEventId=null;
            if(isProd){await staffPage.locator('#nav button[data-view="tasks"]').click();const qa=staffPage.locator('tr[data-task="QA-FINAL-ACTIVATION-20260817-001"]');assert(await qa.count()===1,'Propagation QA task missing');await qa.click();await staffPage.locator('#taskStatus').selectOption('IN_PROGRESS');await staffPage.locator('#taskNote').fill('Final production activation QA');await staffPage.locator('#saveTask').click();await staffPage.waitForFunction(()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),null,{timeout:15000});const sb=await ctx.request.get(base+'/portal/api/v1/staff/bootstrap'),sbj=await sb.json(),qt=sbj.data.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001');assert(qt?.status==='IN_PROGRESS','Staff write not persisted');await adminPage.reload({waitUntil:'domcontentloaded'});await wait(adminPage,()=>window.__RONA_ADMIN_LIVE_READY__===true,'Admin reload live');const prop=await adminPage.evaluate(()=>({task:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001'),audit:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id==='QA-FINAL-ACTIVATION-20260817-001')}));assert(prop.task?.status==='IN_PROGRESS'&&prop.audit,'Staff write not reflected/audited');writePropagation='PASS';
              await agentPage.locator('.nav button[data-page="messages"]').click();await agentPage.waitForTimeout(100);const msg=agentPage.locator('#page-messages');await msg.locator('select').selectOption({label:'DEAL-2026-004'}).catch(async()=>{await msg.locator('select').selectOption('DEAL-2026-004')});await msg.locator('input').fill('QA-FINAL-ACTIVATION-AGENT-MESSAGE');await msg.locator('textarea').fill('Temporary production QA message; must be removed after verification.');await msg.locator('button.btn').filter({hasText:'Отправить'}).click();await agentPage.waitForFunction(()=>/Сообщение зарегистрировано: PORTAL-EVT-/.test(document.querySelector('#toast')?.textContent||''),null,{timeout:15000});const toast=await agentPage.locator('#toast').innerText(),m=toast.match(/PORTAL-EVT-[a-f0-9]+/i);assert(m,'Agent event id absent');agentEventId=m[0];const ev=await ctx.request.get(base+'/portal/api/v1/events/'+encodeURIComponent(agentEventId)+'/status');assert(ev.ok(),'Agent message event status unavailable');
            }

            async function logout(kind,path,opener,button){const s=await newSession(),c=await authContext(browser,s),p=await c.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded'});if(opener){await p.locator(opener).waitFor({state:'visible',timeout:15000});await p.locator(opener).click()}await p.locator(button).waitFor({state:'visible',timeout:15000});await p.locator(button).click();await p.waitForURL(u=>new URL(u).pathname==='/',{timeout:15000});assert(!(await c.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),kind+' cookies remain');const direct=await c.request.get(base+'/portal/admin',{maxRedirects:0});assert([302,303,401,403].includes(direct.status()),kind+' protected route open after logout');await c.close()}
            await logout('Admin','/portal/admin',null,'#adminLogoutBtn');await logout('Staff','/portal/staff',null,'#ronaLogout');await logout('Agent','/portal/agent','#agentAuthState','#ronaPortalLogoutMenuButton');await logout('Selector','/portal/select',null,'form[action="/portal/auth/logout"] button');
            const cs=await newSession(),cc=await authContext(browser,cs),r=await cc.request.post(base+'/portal/auth/logout',{headers:{origin:base,referer:base+'/portal/client'},maxRedirects:0});assert(r.status()===303&&(r.headers()['location']==='/'||r.headers()['location']===base+'/'),'Client-context logout endpoint not root');assert(!(await cc.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),'Client-context logout cookies remain');await cc.close();
            const interactive={admin:adminAll,staff:staffInventory,agent:agentAll,client:{FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0,securityState:'FAIL_CLOSED_ZERO_BINDING'}};
            console.log('RONA_FINAL_ACTIVATION_QA='+JSON.stringify({ok:true,origin:base,production:isProd,adminSections:'23/23',interactive,counts,staff:'PASS',agent:{agentPersonId:agentJ.data.agentPersonId,deals:agentDeals,eventId:agentEventId},client:'FAIL_CLOSED_ZERO_BINDING',writePropagation,documentWorkflow:'LIVE_METADATA_DETAIL; BINARY_SOURCE_GAP_READ_ONLY',security:{idor:'PASS',methodGate:'GET_POST_ONLY',tokenLeak:false},logoutRoot:'PASS',deal004:'PASS'}));
            await ctx.close();await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Clean runtime secrets from runner
        if: always()
        run: |
          unset RONA_ACCESS_TOKEN RONA_REFRESH_TOKEN || true
          rm -f /tmp/rona-final-session.json || true
