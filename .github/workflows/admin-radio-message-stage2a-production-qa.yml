name: Admin Radio MESSAGE Stage 2A production QA

on:
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/remaining-sections-ui.js'
      - 'functions/portal/remaining-sections-r2-base.js'
      - 'functions/portal/api/**'
      - 'scripts/materialize-admin-current-modules.mjs'
      - 'supabase/functions/rona-portal-api/admin.ts'
      - 'supabase/functions/rona-portal-api/agent.ts'
      - 'supabase/functions/rona-portal-api/client-communications.ts'
      - 'supabase/functions/rona-portal-api/index.ts'
      - 'supabase/functions/rona-portal-api/shared.ts'
      - 'supabase/functions/rona-portal-api/auth-db-connect-recovery.mjs'
      - 'supabase/functions/rona-portal-api/payments-v8-production-hardening.ts'
      - 'supabase/functions/_shared/client-application-business-v2/handler.mjs'
      - 'supabase/functions/rona-g82-github-oidc-browser-qa-20260816/**'
      - 'supabase/migrations/20260923124000_admin_radio_stage2a_corrective_client_semantics_v1.sql'
      - 'supabase/migrations/20260923173735_admin_radio_stage2a_operational_recipient_agent_message_v1.sql'
      - 'supabase/migrations/20260924010000_admin_radio_stage2a_qa_identity_provisioning_v1.sql'
      - 'scripts/qa-admin-radio-message-stage2a-production.mjs'
      - 'scripts/qa-admin-radio-stage2a-deployment-equivalence.mjs'
      - 'scripts/qa-admin-radio-stage2a-production-quiet-gate.mjs'
      - 'scripts/qa-admin-radio-stage2a-operational-helpers.mjs'
      - 'scripts/qa-admin-radio-stage2a-operational-scenarios.mjs'
      - 'scripts/qa-admin-radio-stage2a-operational-main.mjs'
      - '.github/workflows/admin-radio-message-stage2a-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  checks: read

concurrency:
  group: admin-radio-stage2a-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-round-trip:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TARGET_ORIGIN: https://ronaoil.com
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact release head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "RADIO_STAGE2A_RELEASE_HEAD=$EXPECTED_HEAD"
      - name: Prove exact or QA-only runtime-equivalent Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa-admin-radio-stage2a-deployment-equivalence.mjs
      - name: Wait for release production quiet window
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa-admin-radio-stage2a-production-quiet-gate.mjs
      - name: Check production proof syntax
        run: node --check scripts/qa-admin-radio-message-stage2a-production.mjs
      - name: Authentication DB connection boundary
        run: node --test tests/auth-db-connect-recovery.test.mjs tests/authenticate-source-boundary.test.mjs
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Real production Admin ↔ Client MESSAGE round-trip
        run: node scripts/qa-admin-radio-message-stage2a-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-radio-message-stage2a-production-${{ github.run_id }}
          path: admin-radio-message-stage2a-production-proof.json
          if-no-files-found: warn
          retention-days: 14