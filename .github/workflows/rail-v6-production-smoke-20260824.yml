name: rail-v6-production-smoke-20260824
on:
  push:
    branches: [qa/rail-v6-production-smoke-20260824]
permissions:
  contents: read
  statuses: write
jobs:
  rail-v6-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Rail v6 runtime
        shell: bash
        run: |
          set -euo pipefail
          url="https://ronaoil.com/portal/rail-current-v6-ui?smoke=$(date +%s)"
          ok=0
          for i in $(seq 1 40); do
            rm -f /tmp/rail.js /tmp/rail.h
            if curl -fsS -D /tmp/rail.h "$url-$i" -o /tmp/rail.js; then
              if grep -qi '^x-rona-rail-ui: current-v6-visual' /tmp/rail.h \
                && grep -q "__RONA_RAIL_CURRENT_V6__='20260824-0308-v6'" /tmp/rail.js \
                && grep -q 'rona-rail-v6-select' /tmp/rail.js \
                && grep -q 'Номера вагонов' /tmp/rail.js \
                && grep -q 'data-wagon-layer="true"' /tmp/rail.js \
                && grep -q 'РОССИЙСКАЯ ФЕДЕРАЦИЯ' /tmp/rail.js \
                && grep -q 'Владивосток' /tmp/rail.js \
                && grep -q 'stopImmediatePropagation' /tmp/rail.js \
                && grep -q 'dedupeOnlineRail(host)' /tmp/rail.js \
                && ! grep -q "filters.append(filterBtn('Все ГУ-12'" /tmp/rail.js \
                && ! grep -q 'MutationObserver' /tmp/rail.js; then
                node --check /tmp/rail.js
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" = 1
      - name: Publish Rail v6 production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: 702764bcb53081683aef94a94a821dea2489ee07
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          state=failure; desc='Rail v6 production smoke failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Rail v6 production smoke passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/rail-v6-production-smoke\",\"description\":\"$desc\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}" >/dev/null
