name: Owner acceptance package gate

on:
  push:
    branches:
      - 'feature/admin-portal-owner-acceptance-*'
      - 'feature/portal-visual-redesign-*'
      - 'hotfix/admin-interactivity-*'
      - 'release/public-go-live-v1.1'
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  contents: read

jobs:
  owner-acceptance-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify canonical integrity and primary portal UI sources
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          test "$(git hash-object functions/portal/_middleware.js)" = '4d859ba9901afdc5bfc0ce68d3f02c34cc9f3087'
          test "$(git hash-object 'functions/portal/[[path]].js')" = '94f8c6ba847162a5f58a0c7ce6d0a8c2a0cdf1c3'
          node --check functions/portal/admin.js
          node --check functions/portal/client.js
          node --check functions/portal/agent.js
          node --check functions/portal/main-ui.js
          node --check functions/portal/owner-api.js
          node --check 'functions/portal/owner-acceptance-api/[[path]].js'
          node --check functions/portal/owner-acceptance-ui.js
          for f in functions/portal/owner-ui-chunks/*.js; do node --check "$f"; done
          cp supabase/functions/rona-owner-acceptance/index.ts /tmp/rona-owner-acceptance.js
          node --check /tmp/rona-owner-acceptance.js
          for f in functions/portal/admin.js functions/portal/client.js functions/portal/agent.js; do
            grep -q 'rona-main-ui-loader' "$f"
            grep -q 'src="/portal/main-ui"' "$f"
            grep -q 'rona-ui-primary' "$f"
            ! grep -q 'rona-owner-acceptance-ui-loader' "$f"
          done
          grep -q "export { onRequest } from './main-ui.js'" functions/portal/owner-acceptance-ui.js
          grep -q '__RONA_MAIN_UI_ENTRY__' functions/portal/main-ui.js
          grep -q '__RONA_MAIN_UI_RUNTIME_LOADED__' functions/portal/main-ui.js
          node --input-type=module <<'NODE'
          import c0 from './functions/portal/owner-ui-chunks/chunk0.js';
          import c1 from './functions/portal/owner-ui-chunks/chunk1.js';
          import c2 from './functions/portal/owner-ui-chunks/chunk2.js';
          import c3 from './functions/portal/owner-ui-chunks/chunk3.js';
          import c4 from './functions/portal/owner-ui-chunks/chunk4.js';
          import c5 from './functions/portal/owner-ui-chunks/chunk5.js';
          import c6 from './functions/portal/owner-ui-chunks/chunk6.js';
          import c7 from './functions/portal/owner-ui-chunks/chunk7.js';
          import c8 from './functions/portal/owner-ui-chunks/chunk8.js';
          import c9 from './functions/portal/owner-ui-chunks/chunk9.js';
          import c10 from './functions/portal/owner-ui-chunks/chunk10.js';
          import c11 from './functions/portal/owner-ui-chunks/chunk11.js';
          import c12 from './functions/portal/owner-ui-chunks/chunk12.js';
          import c13 from './functions/portal/owner-ui-chunks/chunk13.js';
          import c14 from './functions/portal/owner-ui-chunks/chunk14.js';
          import c15 from './functions/portal/owner-ui-chunks/chunk15.js';
          import {writeFileSync} from 'node:fs';
          writeFileSync('/tmp/main-ui-runtime.js',[c0,c1,c2,c3,c4,c5,c6,c7,c8,c9,c10,c11,c12,c13,c14,c15].join(''));
          NODE
          node --check /tmp/main-ui-runtime.js
          grep -q "const API='/portal/owner-api'" /tmp/main-ui-runtime.js
          grep -q 'Системный контроль обменов' /tmp/main-ui-runtime.js
          grep -q 'Управлять публикацией' /tmp/main-ui-runtime.js
          grep -q 'Поставщик одобрил' /tmp/main-ui-runtime.js
          grep -q 'Прикрепить допсоглашение' /tmp/main-ui-runtime.js
          grep -q 'Отправить в платежи' /tmp/main-ui-runtime.js
          grep -q 'Платежи и взаиморасчёты' /tmp/main-ui-runtime.js
          grep -q "card('Касса')" /tmp/main-ui-runtime.js
          grep -q "card('Онлайн ЖД'" /tmp/main-ui-runtime.js
          grep -q "card('Радиорубка')" /tmp/main-ui-runtime.js
          grep -q "card('Аналитика')" /tmp/main-ui-runtime.js
          grep -q 'Новости топливного рынка СНГ' /tmp/main-ui-runtime.js
          grep -q 'Закрепленный агент' /tmp/main-ui-runtime.js
          grep -q 'Скачать контракт' /tmp/main-ui-runtime.js
          grep -q 'Скачать PDF прайс-лист' /tmp/main-ui-runtime.js
          grep -q 'rona-visual-v2' /tmp/main-ui-runtime.js
          grep -q 'Клиенты и агенты' /tmp/main-ui-runtime.js
          grep -q 'RONA TRADE · OPERATIONS' /tmp/main-ui-runtime.js
          grep -q 'Назначение агента' /tmp/main-ui-runtime.js
          grep -q 'rv-tech-hidden' /tmp/main-ui-runtime.js
          grep -q 'официальные источники' /tmp/main-ui-runtime.js
          grep -q 'rona-owner-attention-badge' /tmp/main-ui-runtime.js
          grep -q 'data-page=\\"documents\\"' /tmp/main-ui-runtime.js
          grep -q '__RONA_OWNER_FIRST_PAINT_READY__' /tmp/main-ui-runtime.js
          grep -q 'owner_price_snapshots' supabase/functions/rona-owner-acceptance/index.ts
          grep -q 'owner_application_workflow' supabase/functions/rona-owner-acceptance/index.ts
          grep -q 'owner_deal_documents' supabase/functions/rona-owner-acceptance/index.ts
          grep -q 'owner_cash_snapshots' supabase/functions/rona-owner-acceptance/index.ts
          grep -q 'owner_radio_items' supabase/functions/rona-owner-acceptance/index.ts
          grep -q 'price-list.pdf' supabase/functions/rona-owner-acceptance/index.ts
          grep -q 'createSignedUrl' supabase/functions/rona-owner-acceptance/index.ts
          test -f supabase/migrations/20260821210358_owner_acceptance_business_workflow.sql
          test -f supabase/migrations/20260821210410_owner_acceptance_business_views.sql
          test -f supabase/migrations/20260821222948_owner_acceptance_price_publication_flags.sql
          test ! -e supabase/migrations/20260821232000_owner_acceptance_business_workflow.sql
          test ! -e supabase/migrations/20260821234500_owner_acceptance_business_views.sql
          test ! -e supabase/migrations/20260822013000_owner_acceptance_price_publication_flags.sql
          echo 'PRIMARY_PORTAL_UI_SOURCE_GATE=PASS'
      - name: Verify deployed owner acceptance edge rejects unauthenticated access
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/owner-edge.json -w '%{http_code}' 'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-owner-acceptance/admin/bootstrap')"
          test "$code" = '401'
          grep -Eqi 'Invalid JWT|PORTAL_ACCESS_DENIED|Missing authorization|authorization header' /tmp/owner-edge.json
          echo 'OWNER_ACCEPTANCE_SOURCE_GATE=PASS'
