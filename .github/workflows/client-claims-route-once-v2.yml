name: Client claims current-context route once v2

on:
  push:
    branches:
      - fix/client-context-universal-modules-v1

permissions:
  contents: write

jobs:
  materialize-claims-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add selected-context claims route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/rona-portal-api/index.ts')
          s=p.read_text()
          imp='import { clientClaims } from "./client-claims.ts";\n'
          if imp not in s:
              anchor='import { clientBootstrap, clientShipments } from "./client.ts";\n'
              if anchor not in s:
                  raise SystemExit('client import anchor missing')
              s=s.replace(anchor,anchor+imp,1)
          if 'route==="/v1/client/claims"' not in s:
              anchor='if(route==="/v1/client/context"&&req.method==="GET")'
              if anchor not in s:
                  raise SystemExit('client context route anchor missing')
              route='if(route==="/v1/client/claims"&&req.method==="GET"){if(!c.roles.includes("CLIENT"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const clientId=url.searchParams.get("clientId"),contractId=url.searchParams.get("contractId");if(!clientId||!contractId)return send(origin,400,{ok:false,code:"CLIENT_CONTRACT_CONTEXT_REQUIRED"});const claims=await clientClaims(c,clientId,contractId);return claims===null?send(origin,404,{ok:false,code:"CONTEXT_NOT_FOUND"}):send(origin,200,{ok:true,claims})}'
              s=s.replace(anchor,route+anchor,1)
          p.write_text(s)
          PY
      - name: Verify context and claims guards
        run: |
          node tests/client-context-universal-modules-v1.test.mjs
          node scripts/qa-client-current-context-consumers-v1.mjs
          node scripts/qa-client-backend-context-scope-v1.mjs
          node scripts/qa-client-claims-context-scope-v1.mjs
          node scripts/qa-client-claims-route-v1.mjs
      - name: Commit claims route
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add supabase/functions/rona-portal-api/index.ts
            git commit -m 'feat(client): add selected-context claims route'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase origin ${GITHUB_REF_NAME}
          git rm .github/workflows/client-claims-route-once-v2.yml
          git commit -m 'ci(client): remove claims one-shot workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
