name: Prices Owner Update Gate QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/prices-current-ui.js'
      - 'functions/portal/price-updates-api.js'
      - 'functions/portal/admin-canonical-tweaks-ui.js'
      - 'supabase/migrations/*owner_price_update_gate*.sql'
      - '.github/workflows/prices-owner-update-gate-qa.yml'
  workflow_dispatch:

jobs:
  prices-owner-update-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check functions/portal/prices-current-ui.js
          node --check functions/portal/price-updates-api.js
          node --check functions/portal/admin-canonical-tweaks-ui.js
      - name: Contract gate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ui=fs.readFileSync('functions/portal/prices-current-ui.js','utf8');
          const api=fs.readFileSync('functions/portal/price-updates-api.js','utf8');
          const migV1=fs.readFileSync('supabase/migrations/20260825183000_owner_price_update_gate_v1.sql','utf8');
          const migV2=fs.readFileSync('supabase/migrations/20260825190000_owner_price_update_gate_v2.sql','utf8');
          const mig=migV1+'\n'+migV2;
          const need=(src,token,label)=>{if(!src.includes(token))throw new Error(label+': '+token)};
          need(ui,'20260914-pending-canonical-matrix-v1','missing pending canonical matrix revision');
          need(ui,'prices-2a-canonical-v4','missing restored canonical Prices structure');
          need(ui,'function isFullPriceProposal(p)','missing full-list proposal classifier');
          need(ui,'function proposalMatrix(p)','missing full-list proposal matrix');
          need(ui,'Прайс-лист на согласование','missing pending full-list title');
          need(ui,"table(['Продукт',...bases.map(b=>b.label)]",'pending list is not product-row/station-column matrix');
          need(ui,'gs.map(g=>[g.product,...bases.map(b=>priceValue(g.bases[b.key]))])','pending list rows are not grouped by product');
          need(ui,'if(isFullPriceProposal(p))details.append(proposalMatrix(p));else','full-list proposal is not routed to matrix renderer');
          need(ui,"'Отклонить'",'missing Admin reject action');
          need(ui,"'Обновить'",'missing Admin apply action');
          need(api,'owner_price_updates_bootstrap','missing bootstrap rpc');
          need(api,'owner_apply_price_change_proposal','missing apply rpc');
          need(api,'owner_reject_price_change_proposal','missing reject rpc');
          need(api,'owner_set_price_publication_audience','missing audience rpc');
          need(api,'owner_decide_received_price_list','missing received-list Admin decision rpc');
          need(mig,"AI-OPERATIONS-DIRECTOR",'missing fixed Operations identity');
          need(mig,"PROPOSE_PRICE_LIST_UPDATE",'missing proposal contract');
          need(mig,"proposal_status='APPLIED'",'missing apply state');
          need(mig,"proposal_status='REJECTED'",'missing reject state');
          need(mig,"business_status='SUPERSEDED'",'missing version supersede');
          need(mig,"STALE_PRICE_SOURCE",'missing stale Agent CP guard');
          need(mig,"OWNER_PRICE_UPDATE_APPLIED",'missing audit event');
          need(mig,"OWNER_PRICE_UPDATE_REJECTED",'missing reject audit event');
          need(mig,"publish_client",'missing Client propagation');
          need(mig,"publish_agent",'missing Agent propagation');
          if(/fetch\([^)]*OPERATIONS/i.test(ui))throw new Error('Admin UI must not send pricing intelligence to Operations');
          if(/HANDOFF_REQUEST[\s\S]{0,500}OPERATIONS_DIRECTOR/.test(ui+api+migV2))throw new Error('Admin Prices must not create Operations handoff');
          console.log('PRICES_OWNER_UPDATE_GATE_RECOVERY=PASS');
          NODE
