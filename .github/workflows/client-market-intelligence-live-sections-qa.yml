name: Client Market Intelligence live sections QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'assets/portal-runtime/client-market-intelligence-v1.js'
      - 'assets/portal-runtime/client-market-news-admin-parity-v1.js'
      - 'assets/portal-runtime/client-background-section-preload-v1.js'
      - 'scripts/qa-client-market-intelligence-v1.mjs'
      - 'functions/portal/api/v1/client/market-intelligence.js'
      - 'supabase/migrations/20260902173000_client_market_intelligence_safe_feed_v1.sql'
      - '.github/workflows/client-market-intelligence-live-sections-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'assets/portal-runtime/client-market-intelligence-v1.js'
      - 'assets/portal-runtime/client-market-news-admin-parity-v1.js'
      - 'assets/portal-runtime/client-background-section-preload-v1.js'
      - 'scripts/qa-client-market-intelligence-v1.mjs'
      - 'functions/portal/api/v1/client/market-intelligence.js'
      - 'supabase/migrations/20260902173000_client_market_intelligence_safe_feed_v1.sql'
      - '.github/workflows/client-market-intelligence-live-sections-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-intelligence-live-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical Client artifact
        run: npm run build
      - name: Prove current-context isolated open plus hourly Market Intelligence ownership
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-client-market-intelligence-v1.mjs
          node <<'NODE'
          const fs=require('fs');
          const analytics=fs.readFileSync('assets/portal-runtime/client-market-intelligence-v1.js','utf8');
          const news=fs.readFileSync('assets/portal-runtime/client-market-news-admin-parity-v1.js','utf8');
          const preload=fs.readFileSync('assets/portal-runtime/client-background-section-preload-v1.js','utf8');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          for(const token of ['RONA_CLIENT_CONTEXT',"load('open')",'REFRESH_MS=3600000','/v1/client/market-intelligence'])assert(analytics.includes(token),`analytics current contract missing ${token}`);
          for(const token of ['AUTO_REFRESH_MS=3600000','setInterval(refreshHourly,AUTO_REFRESH_MS)','/v1/client/market-intelligence'])assert(news.includes(token),`news current contract missing ${token}`);
          assert(!/addEventListener\(["']focus["']/.test(analytics+news),'focus refetch must not own Market Intelligence');
          assert(!preload.includes('/v1/client/market-intelligence'),'30s background preload must not own Market Intelligence');
          assert(!preload.includes('getAuthorizedContexts'),'background preload must not fan out across authorized contexts');
          console.log('CLIENT_MARKET_INTELLIGENCE_LIVE_CONTRACT=PASS context=CURRENT_CONTEXT refresh=OPEN_THEN_HOURLY focus_refetch=DISABLED');
          NODE
