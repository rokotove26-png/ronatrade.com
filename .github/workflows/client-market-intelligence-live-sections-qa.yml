name: Client Market Intelligence live sections QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sections:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact Client artifact
        run: npm run build
      - name: Install Chrome harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi
      - name: Prove Analytics and Market News render in real Client section roots
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const http=require('http');
          const fs=require('fs');
          const path=require('path');
          const cp=require('child_process');
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const dist=path.resolve('dist');
          const port=4193;
          const origin=`http://127.0.0.1:${port}`;
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.ico':'image/x-icon'};
          const server=http.createServer((req,res)=>{
            const u=new URL(req.url,origin);
            let pathname=u.pathname;
            if(pathname==='/portal/client'||pathname==='/portal/client/')pathname='/portal/client.html';
            const file=path.resolve(dist,'.'+pathname);
            if(!file.startsWith(dist+path.sep)){res.writeHead(403);res.end('forbidden');return}
            fs.readFile(file,(error,data)=>{
              if(error){res.writeHead(404,{'content-type':'text/plain; charset=utf-8'});res.end('not found');return}
              res.writeHead(200,{'content-type':mime[path.extname(file).toLowerCase()]||'application/octet-stream','cache-control':'no-store'});
              res.end(data);
            });
          });
          const listen=()=>new Promise((resolve,reject)=>{server.once('error',reject);server.listen(port,'127.0.0.1',resolve)});
          const close=()=>new Promise(resolve=>server.close(()=>resolve()));
          const client={client_id:'QA-C001',legal_name:'QA CLIENT UNIVERSAL',registration_country:'RU',registered_address:'QA',contact_phone:null,contract_id:'QA-CTR-001',current_external_contract_number:'QA-CTR-001',contract_status:'ACTIVE',effective_from:'2026-09-01',effective_to:null,signed_contract_confirmed_at:'2026-09-01T00:00:00Z'};
          (async()=>{
            await listen();
            const executablePath=cp.execSync('command -v google-chrome || command -v google-chrome-stable',{encoding:'utf8'}).trim();
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:1440,height:900}});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e?.stack||e?.message||e)));
              await page.addInitScript(({client})=>{
                localStorage.clear();sessionStorage.clear();
                window.__MI_QA_VERSION='A';
                const originalFetch=window.fetch.bind(window);
                const json=(body,status=200)=>new Response(JSON.stringify(body),{status,headers:{'content-type':'application/json','cache-control':'no-store'}});
                const marketIntelligence=()=>{
                  const v=String(window.__MI_QA_VERSION||'A');
                  const minute=v==='A'?'00':'01';
                  return {ok:true,data:{
                    version:'RONA_CLIENT_MARKET_INTELLIGENCE_V1',generated_at:`2026-09-02T14:${minute}:00Z`,server_date:'2026-09-02',timezone:'Europe/Moscow',
                    analytics:[{publication_id:'QA-ANALYTICS',publication_item_id:'11111111-1111-4111-8111-111111111111',published_at:`2026-09-02T14:${minute}:00Z`,product:'АИ-92',headline:`QA AI-92 ${v}`,content_text:'QA derived analytics',analytics_as_of:'2026-09-02T00:00:00Z',analytics_unit:'USD/т',public_chart:{type:'FORECAST_RANGE',unit:'USD/т',labels:['ФАКТ','FORWARD'],values:[1000,v==='A'?1010:1020]}}],
                    news:[{publication_id:'QA-NEWS',publication_item_id:'22222222-2222-4222-8222-222222222222',published_at:`2026-09-02T14:${minute}:00Z`,news_id:`QA-NEWS-${v}`,duplicate_group:'QA-EVENT-001',headline:`QA NEWS ${v}`,content_text:'QA verified market news',product:'бензин',region:'СНГ',category:'QA',source_name:'QA SOURCE',source_url:'https://example.com/qa',source_published_at:`2026-09-02T13:${minute}:00Z`}],
                    analytics_gate:'QA',news_gate:'QA'
                  }};
                };
                const payload=pathname=>{
                  if(pathname.endsWith('/v1/client/bootstrap'))return{ok:true,data:{generated_at:new Date().toISOString(),data_contract:'1.4',requires_context_selection:false,contexts:[client],price_authority:[],selected_context:null,applications:[],deals:[],documents:[],payments:[],shipments:[],rail_documents:[],market:[],notifications:[]}};
                  if(pathname.endsWith('/v1/client/context'))return{ok:true,data:{contract:client,applications:[],deals:[],documents:[],payments:[],prices:[]}};
                  if(pathname.endsWith('/v1/client/prices'))return{ok:true,data:[]};
                  if(pathname.endsWith('/v1/client/market'))return{ok:true,data:[]};
                  if(pathname.endsWith('/v1/client/market-intelligence'))return marketIntelligence();
                  if(pathname.endsWith('/v1/client/shipments'))return{ok:true,data:{shipments:[],rail_documents:[],wagons:[]}};
                  if(pathname.endsWith('/v1/client/rail'))return{ok:false,code:'RAIL_CLIENT_PUBLICATION_DISABLED'};
                  return{ok:true,data:{items:[],applications:[],deals:[],documents:[],payments:[],prices:[],shipments:[],rail:[],rail_documents:[],wagons:[],market:[],notifications:[]}};
                };
                window.fetch=async(input,init)=>{
                  const href=typeof input==='string'?input:input?.url||String(input);
                  const url=new URL(href,location.href);
                  if(!url.pathname.startsWith('/portal/api/'))return originalFetch(input,init);
                  if(url.pathname.endsWith('/v1/client/rail'))return json(payload(url.pathname),503);
                  return json(payload(url.pathname),200);
                };
              },{client});
              await page.goto(origin+'/portal/client',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>{
                const a=document.querySelector('[data-rona-client-market-intelligence-owner="analytics"]');
                const n=document.querySelector('[data-rona-client-market-intelligence-owner="news"]');
                return a?.textContent?.includes('QA AI-92 A')&&n?.textContent?.includes('QA NEWS A');
              },{timeout:12000});
              const first=await page.evaluate(()=>{
                const a=document.querySelector('[data-rona-client-market-intelligence-owner="analytics"]');
                const n=document.querySelector('[data-rona-client-market-intelligence-owner="news"]');
                const root=e=>e?.parentElement;
                return{
                  runtime:window.__RONA_CLIENT_MARKET_INTELLIGENCE__||null,
                  state:document.documentElement.dataset.ronaClientMarketIntelligence||null,
                  analyticsRoot:root(a)?.id||root(a)?.getAttribute('data-page-panel')||root(a)?.getAttribute('data-page-id')||null,
                  newsRoot:root(n)?.id||root(n)?.getAttribute('data-page-panel')||root(n)?.getAttribute('data-page-id')||null,
                  analyticsText:a?.textContent||'',newsText:n?.textContent||''
                };
              });
              first.pageErrors=pageErrors.slice();
              assert(first.runtime==='20260902-client-market-intelligence-v1','market intelligence runtime missing '+JSON.stringify(first));
              assert(first.state==='ready','market intelligence not ready '+JSON.stringify(first));
              assert(first.analyticsRoot,'real Analytics section root not resolved '+JSON.stringify(first));
              assert(first.newsRoot,'real Market News section root not resolved '+JSON.stringify(first));
              assert(first.analyticsText.includes('QA AI-92 A'),'Analytics payload not rendered');
              assert(first.newsText.includes('QA NEWS A'),'Market News payload not rendered');

              await page.evaluate(()=>{window.__MI_QA_VERSION='B';window.dispatchEvent(new Event('focus'))});
              await page.waitForFunction(()=>document.querySelector('[data-rona-client-market-intelligence-owner="analytics"]')?.textContent?.includes('QA AI-92 B')&&document.querySelector('[data-rona-client-market-intelligence-owner="news"]')?.textContent?.includes('QA NEWS B'),{timeout:7000});
              const refreshed=await page.evaluate(()=>({analytics:document.querySelector('[data-rona-client-market-intelligence-owner="analytics"]')?.textContent||'',news:document.querySelector('[data-rona-client-market-intelligence-owner="news"]')?.textContent||'',background:window.__RONA_CLIENT_BACKGROUND_STATE__?.sections||null}));
              assert(refreshed.analytics.includes('QA AI-92 B')&&refreshed.news.includes('QA NEWS B'),'focus refresh did not update both sections '+JSON.stringify(refreshed));
              console.log('CLIENT_MARKET_INTELLIGENCE_LIVE_SECTIONS=PASS '+JSON.stringify({analyticsRoot:first.analyticsRoot,newsRoot:first.newsRoot,runtime:first.runtime,refresh:'A_TO_B',pageErrors:first.pageErrors.length}));
              await context.close();
            }finally{
              await browser.close();
              await close();
            }
          })().catch(error=>{console.error(error?.stack||error);process.exit(1)});
          NODE
