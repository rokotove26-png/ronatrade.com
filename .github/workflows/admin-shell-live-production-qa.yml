name: Admin Shell Live Production QA

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'
      - 'hotfix/admin-shell-live-*'

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  live-admin-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GITHUB_REPOSITORY;
          const sha=process.env.GITHUB_SHA;
          const token=process.env.GH_TOKEN;
          const isRelease=process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let i=0;i<90;i++){
              const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{
                headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-Trade-Admin-Shell-Live-QA'}
              });
              if(r.ok){
                const j=await r.json();
                const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');
                if(cf?.status==='completed'&&cf?.conclusion==='success'){
                  let origin='https://ronaoil.com';
                  if(!isRelease){
                    const m=String(cf?.output?.summary||'').match(/https:\/\/[a-z0-9-]+\.rona-trade-public\.pages\.dev/i);
                    if(!m)throw new Error('Cloudflare preview URL missing');
                    origin=m[0];
                  }
                  fs.appendFileSync(process.env.GITHUB_ENV,`TARGET_ORIGIN=${origin}\n`);
                  console.log(`CLOUDFLARE_DEPLOYMENT_READY ${origin}`);
                  return;
                }
                if(cf?.status==='completed'&&cf?.conclusion&&cf.conclusion!=='success')throw new Error(`Cloudflare Pages ${cf.conclusion}`);
              }
              await sleep(5000);
            }
            throw new Error('Cloudflare Pages deployment timeout');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Prove deployed Admin shell opens repeatedly without Owner credentials
        env:
          TARGET_ORIGIN: ${{ env.TARGET_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const origin=process.env.TARGET_ORIGIN;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function poll(page,reader,label,timeout){
            const started=Date.now();
            let last;
            while(Date.now()-started<timeout){
              last=await page.evaluate(reader).catch(()=>undefined);
              if(last)return last;
              await sleep(200);
            }
            throw new Error(label+' timeout; last='+String(last));
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const hostname=new URL(origin).hostname;

            const guest=await browser.newContext({viewport:{width:1600,height:1000},javaScriptEnabled:true});
            const guestPage=await guest.newPage();
            await guestPage.goto(origin+'/portal/admin?_guest_gate_qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            assert(new URL(guestPage.url()).pathname==='/portal/login','Unauthenticated Admin entry did not redirect to login: '+guestPage.url());
            await guest.close();

            const ctx=await browser.newContext({viewport:{width:1600,height:1000},javaScriptEnabled:true});
            await ctx.addCookies([
              {name:'rona_portal_at',value:'qa-shell-probe-not-a-token',domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},
              {name:'rona_portal_rt',value:'qa-shell-probe-not-a-token',domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}
            ]);

            await ctx.route('**/portal/api/session/me',async route=>{
              await route.fulfill({
                status:200,
                contentType:'application/json; charset=utf-8',
                body:JSON.stringify({ok:true,user:{id:'qa-shell-probe',displayName:'QA Shell Probe',roles:['ADMIN']}})
              });
            });

            const results=[];
            for(let attempt=1;attempt<=3;attempt++){
              const p=await ctx.newPage();
              const pageErrors=[];
              p.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
              const response=await p.goto(origin+'/portal/admin?_live_shell_qa='+Date.now()+'_'+attempt,{waitUntil:'domcontentloaded',timeout:45000});
              assert(response,'Admin response missing');
              assert(response.status()===200,'Admin HTTP '+response.status());
              assert(new URL(p.url()).pathname==='/portal/admin','Admin redirected to '+p.url());
              assert(response.headers()['x-rona-admin-shell']==='fast-static-v1','Admin resilience header missing');
              const text=(await p.locator('body').innerText().catch(()=>''));
              assert(!/error\s*1102/i.test(text),'Cloudflare 1102 rendered');
              await poll(p,()=>window.__RONA_ADMIN_SHELL_RESILIENCE__==='fast-static-v1','Admin resilience marker',10000);
              await poll(p,()=>window.__RONA_ADMIN_SESSION_STATE__==='VERIFIED','Admin QA session state',10000);
              await poll(p,()=>window.__RONA_ADMIN_FAST_CORE_LOADED__===true,'Admin core UI',30000);
              const visible=await p.evaluate(()=>{
                const app=document.querySelector('.app');
                if(!app)return false;
                const s=getComputedStyle(app),r=app.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0&&r.width>0&&r.height>0;
              });
              assert(visible,'Admin app is not visible');
              const navCount=await p.locator('#nav button[data-page]').count();
              assert(navCount>=20,'Admin navigation incomplete: '+navCount);
              const bodyText=await p.locator('body').innerText().catch(()=>"");
              assert(!/error\s*1102/i.test(bodyText),'Cloudflare 1102 rendered after hydration');
              results.push({attempt,status:response.status(),shell:response.headers()['x-rona-admin-shell'],session:'QA_PROBE_VERIFIED',navCount,pageErrors:pageErrors.slice(0,3)});
              await p.close();
            }

            const realProbe=await ctx.request.get(origin+'/portal/api/session/me',{timeout:30000});
            assert([401,403].includes(realProbe.status()),'Dummy probe unexpectedly authorized: '+realProbe.status());

            await ctx.close();
            await browser.close();
            console.log(JSON.stringify({ok:true,origin,guestGate:'LOGIN_REDIRECT',businessApiWithDummyCookie:'DENIED',attempts:results},null,2));
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
