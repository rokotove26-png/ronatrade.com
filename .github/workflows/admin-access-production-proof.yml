name: Admin access production proof

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches: [release/public-go-live-v1.1]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  admin-access-production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify single-owner access source and static artifact contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/admin-approved-polish-ui.js
          node --check functions/portal/admin-approved-analytics-v455-ui.js
          node --check functions/portal/admin.js
          node --check scripts/materialize-admin-current-modules.mjs
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260828-single-owner-v5'" functions/portal/clients-agents-current-ui.js
          grep -q "window.__RONA_ACCESS_CURRENT_OWNER__='clients-agents-current-v5'" functions/portal/clients-agents-current-ui.js
          grep -q "window.__RONA_ACCESS_FUNCTIONAL_BUILD__='single-owner-create-user-v6-20260828'" functions/portal/clients-agents-current-ui.js
          grep -q "AUTH='/portal/admin-authority'" functions/portal/clients-agents-current-ui.js
          grep -q "dataset.ronaCreateAccess='primary'" functions/portal/clients-agents-current-ui.js
          grep -q "b.onclick=openAccessModal" functions/portal/clients-agents-current-ui.js
          grep -q "create.onclick=openAccessModal" functions/portal/clients-agents-current-ui.js
          grep -q "makeField('Единый логин',login)" functions/portal/clients-agents-current-ui.js
          grep -q "makeField('Электронная почта',email)" functions/portal/clients-agents-current-ui.js
          grep -q "makeField('Пароль',password)" functions/portal/clients-agents-current-ui.js
          grep -q "initialPassword:pw1" functions/portal/clients-agents-current-ui.js
          grep -q "await mutate('/access/users',payload)" functions/portal/clients-agents-current-ui.js
          grep -q "'/signed-document/attach'" functions/portal/clients-agents-current-ui.js
          grep -q 'История и права' functions/portal/clients-agents-current-ui.js
          grep -q 'Сменить пароль' functions/portal/clients-agents-current-ui.js
          grep -q "x-rona-access-create-owner':'clients-agents-current-v5" functions/portal/clients-agents-current-ui.js
          grep -q "x-rona-access-create-owner':'none" functions/portal/admin-approved-polish-ui.js
          grep -q "x-rona-access-loader':'none" functions/portal/admin-approved-analytics-v455-ui.js
          ! grep -q 'installCanonicalAccessCreate' functions/portal/admin-approved-polish-ui.js
          ! grep -q 'openCanonicalAccessModal' functions/portal/admin-approved-polish-ui.js
          ! grep -q 'loadCanonicalAccess' functions/portal/admin-approved-analytics-v455-ui.js
          test ! -e functions/portal/admin-canonical-create-access-v441-ui.js
          test ! -e functions/portal/admin-canonical-create-access-v441-password-hotfix-ui.js
          test ! -e functions/portal/admin-access-ui.js
          test ! -e functions/portal/clients-agents-v4-ui.js
          test ! -e functions/portal/clients-agents-canonical-guard-ui.js
          grep -q 'ADMIN_EXCLUSIVE_CLIENT_V2' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'ADMIN_EXCLUSIVE_AGENT_V1' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'PORTAL_USER_PASSWORD_SET_BY_ADMIN' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'data-rona-admin-shell="current-only-v2"' portal-src/current/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" portal-src/current/admin.html
          test -f dist/portal/clients-agents-current-ui
          test -f dist/portal/claims-r2-ui
          test -f dist/portal/remaining-sections-ui
          test -f dist/_headers
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260828-single-owner-v5'" dist/portal/clients-agents-current-ui
          grep -q 'Единый логин' dist/portal/clients-agents-current-ui
          grep -q 'Электронная почта' dist/portal/clients-agents-current-ui
          grep -q 'Повторите пароль' dist/portal/clients-agents-current-ui
          grep -q 'Разрешённые компании / контракты' dist/portal/clients-agents-current-ui
          grep -q 'Закрепить PDF' dist/portal/clients-agents-current-ui
          grep -q 'История и права' dist/portal/clients-agents-current-ui
          grep -q 'Сменить пароль' dist/portal/clients-agents-current-ui
          grep -q 'Создать пользователя' dist/portal/clients-agents-current-ui
          ! grep -q 'approved-canonical-v3.4.13' functions/portal/admin-approved-polish-ui.js
          ! grep -q 'admin-canonical-create-access-v441-ui' functions/portal/admin-approved-analytics-v455-ui.js
          grep -q '/portal/clients-agents-current-ui' dist/_headers
          grep -q '/portal/clients-agents-current-ui' dist/_routes.json
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"
          echo 'ADMIN_ACCESS_SINGLE_OWNER_SOURCE=PASS'
      - name: Wait for Cloudflare deployment signals
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Prove live single-owner current module and fail-closed authority
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node scripts/verify-admin-current-only-production.mjs
          node <<'NODE'
          const base='https://ronaoil.com';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for(const path of ['/portal/admin-authority/bootstrap','/portal/admin-authority/agent-readiness']){
            const r=await fetch(base+path,{redirect:'manual',cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            assert([401,403].includes(r.status),path+' must fail closed; got '+r.status+' '+JSON.stringify(j));
          }
          let r=null,src='',last='';
          for(let i=0;i<30;i++){
            r=await fetch(base+'/portal/clients-agents-current-ui?_qa='+Date.now()+'&attempt='+i,{cache:'no-store'});
            src=r.ok?await r.text():'';
            const headers=r.ok&&r.headers.get('x-rona-delivery')==='static-build-v1'&&r.headers.get('x-rona-clients-agents-ui')==='single-owner-v5'&&r.headers.get('x-rona-access-create')==='single-owner-create-user-v6'&&r.headers.get('x-rona-access-create-owner')==='clients-agents-current-v5'&&r.headers.get('x-rona-shell-mutation')==='none'&&r.headers.get('x-rona-legacy-dependency')==='none';
            const body=src.includes("window.__RONA_ACCESS_CURRENT_OWNER__='clients-agents-current-v5'")&&src.includes("makeField('Единый логин',login)")&&src.includes("makeField('Электронная почта',email)")&&src.includes("await mutate('/access/users',payload)")&&!src.includes('openCanonicalAccessModal')&&!src.includes('installCanonicalAccessCreate');
            if(headers&&body)break;
            last='status='+r.status+' delivery='+r.headers.get('x-rona-delivery')+' ui='+r.headers.get('x-rona-clients-agents-ui')+' create='+r.headers.get('x-rona-access-create')+' owner='+r.headers.get('x-rona-access-create-owner');
            if(i<29)await sleep(3000);
          }
          assert(r?.ok,'static access module unavailable: '+last);
          assert(r.headers.get('x-rona-clients-agents-ui')==='single-owner-v5','single-owner access module unavailable: '+last);
          assert(r.headers.get('x-rona-access-create-owner')==='clients-agents-current-v5','access owner mismatch: '+last);
          assert(src.includes("makeField('Единый логин',login)"),'single login field missing');
          assert(src.includes("makeField('Электронная почта',email)"),'single email field missing');
          assert(!src.includes('openCanonicalAccessModal')&&!src.includes('installCanonicalAccessCreate'),'competing access owner deployed');
          for(const obsolete of ['/portal/admin-canonical-create-access-v441-ui','/portal/admin-canonical-create-access-v441-password-hotfix-ui']){
            const x=await fetch(base+obsolete+'?_qa='+Date.now(),{redirect:'manual',cache:'no-store'});
            assert(x.status===404,obsolete+' must be deleted; got '+x.status);
          }
          console.log('ADMIN_ACCESS_SINGLE_OWNER_CUSTOM_DOMAIN=PASS');
          NODE
