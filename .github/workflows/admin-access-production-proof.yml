name: Admin access current proof

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches: [release/public-go-live-v1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-access-current-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current single-owner access source
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/admin-approved-polish-ui.js
          node --check functions/portal/admin-approved-analytics-v455-ui.js
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260828-single-owner-v5'" functions/portal/clients-agents-current-ui.js
          grep -q "window.__RONA_ACCESS_CURRENT_OWNER__='clients-agents-current-v5'" functions/portal/clients-agents-current-ui.js
          grep -q "window.__RONA_ACCESS_FUNCTIONAL_BUILD__='single-owner-impersonation-json-v8-20260920'" functions/portal/clients-agents-current-ui.js
          grep -q "dataset.ronaCreateAccess='primary'" functions/portal/clients-agents-current-ui.js
          grep -q "await mutate('/access/users',payload)" functions/portal/clients-agents-current-ui.js
          ! grep -q 'Профиль агента' functions/portal/clients-agents-current-ui.js
          ! grep -q 'agentScope' functions/portal/clients-agents-current-ui.js
          grep -q 'Компании назначаются агентам отдельно' functions/portal/clients-agents-current-ui.js
          grep -q 'AGENT_PERSON_IDENTITY_V2' supabase/functions/rona-admin-control-plane/index.ts
          ! grep -q 'resolveAgentProfile' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'company_assignment_created: false' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'agent_legal_entity_key drop not null' supabase/migrations/20260919211000_agent_person_identity_decouple_v2.sql
          grep -q 'История и права' functions/portal/clients-agents-current-ui.js
          grep -q 'Сменить пароль' functions/portal/clients-agents-current-ui.js
          grep -q "x-rona-access-create-owner':'clients-agents-current-v5" functions/portal/clients-agents-current-ui.js
          grep -q "await auth('/impersonation/start'" functions/portal/clients-agents-current-ui.js
          grep -q "'x-rona-admin-handoff':'clients-agents-v8'" functions/portal/clients-agents-current-ui.js
          ! grep -q "form.action=AUTH+'/impersonation/enter'" functions/portal/clients-agents-current-ui.js
          node tests/admin-impersonation-json-handoff.test.mjs
          node tests/admin-client-impersonation-early-bridge.test.mjs
          grep -q "x-rona-access-create-owner':'none" functions/portal/admin-approved-polish-ui.js
          grep -q "x-rona-access-loader':'none" functions/portal/admin-approved-analytics-v455-ui.js
          test ! -e functions/portal/admin-canonical-create-access-v441-ui.js
          test ! -e functions/portal/admin-access-ui.js
          test ! -e functions/portal/clients-agents-v4-ui.js
      - name: Build and materialize authoritative current access owner
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          echo 'ADMIN_ACCESS_CURRENT_PROOF=PASS'
