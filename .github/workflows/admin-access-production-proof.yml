name: Admin access production proof

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches: [release/public-go-live-v1.1]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  admin-access-production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current access source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/admin.js
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260826-single-owner-v3'" functions/portal/clients-agents-current-ui.js
          grep -q "AUTH='/portal/admin-authority'" functions/portal/clients-agents-current-ui.js
          grep -q "dataset.ronaCreateAccess='primary'" functions/portal/clients-agents-current-ui.js
          grep -q "new Option('Клиент','Клиент'),new Option('Агент','Агент')" functions/portal/clients-agents-current-ui.js
          grep -q '/access/users' functions/portal/clients-agents-current-ui.js
          grep -q '/admin/clients/' functions/portal/clients-agents-current-ui.js
          grep -q "'x-rona-shell-mutation':'none'" functions/portal/clients-agents-current-ui.js
          ! grep -q 'harvestLegacy' functions/portal/clients-agents-current-ui.js
          ! grep -q 'window.openModal' functions/portal/clients-agents-current-ui.js
          ! grep -q 'installNavigationStability' functions/portal/clients-agents-current-ui.js
          ! grep -q 'installShellParity' functions/portal/clients-agents-current-ui.js
          grep -q 'ADMIN_EXCLUSIVE_CLIENT_V2' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'ADMIN_EXCLUSIVE_AGENT_V1' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'PORTAL_USER_PASSWORD_SET_BY_ADMIN' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'data-rona-admin-shell="current-only-v2"' portal-src/current/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" portal-src/current/admin.html
          grep -q 'data-action="create-access">Создать доступ</button>' portal-src/current/admin.html
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"
          echo 'ADMIN_ACCESS_SINGLE_OWNER_V3_SOURCE=PASS'
      - name: Wait for Cloudflare deployment signals
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Prove live fail-closed access boundary without mutation
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node scripts/verify-admin-current-only-production.mjs
          node <<'NODE'
          const base='https://ronaoil.com';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for(const path of ['/portal/admin-authority/bootstrap','/portal/admin-authority/agent-readiness']){
            const r=await fetch(base+path,{redirect:'manual',cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            assert([401,403].includes(r.status),path+' must fail closed; got '+r.status+' '+JSON.stringify(j));
          }
          let r=null,src='',last='';
          for(let i=0;i<20;i++){
            r=await fetch(base+'/portal/clients-agents-current-ui?_qa='+Date.now()+'&attempt='+i,{cache:'no-store'});
            src=r.ok?await r.text():'';
            const currentHeaders=r.ok&&
              r.headers.get('x-rona-clients-agents-ui')==='single-owner-v3'&&
              r.headers.get('x-rona-access-create')==='client-agent-v3'&&
              r.headers.get('x-rona-admin-nav-owner')==='external-current-router-v2'&&
              r.headers.get('x-rona-shell-mutation')==='none'&&
              r.headers.get('x-rona-legacy-dependency')==='none';
            const currentBody=src.includes('admin-authority')&&
              src.includes('ronaCreateAccess')&&
              src.includes("new Option('Клиент','Клиент')")&&
              src.includes("new Option('Агент','Агент')")&&
              !src.includes('harvestLegacy')&&
              !src.includes('installNavigationStability')&&
              !src.includes('installShellParity');
            if(currentHeaders&&currentBody)break;
            last='status='+r.status+' ui='+r.headers.get('x-rona-clients-agents-ui')+' create='+r.headers.get('x-rona-access-create')+' bodyClient='+src.includes("new Option('Клиент','Клиент')")+' bodyAgent='+src.includes("new Option('Агент','Агент')");
            if(i<19)await sleep(3000);
          }
          assert(r?.ok&&r.headers.get('x-rona-clients-agents-ui')==='single-owner-v3','single-owner access module unavailable: '+last);
          assert(r.headers.get('x-rona-access-create')==='client-agent-v3','access creation contract unavailable: '+last);
          assert(r.headers.get('x-rona-admin-nav-owner')==='external-current-router-v2','single navigation-owner contract unavailable: '+last);
          assert(r.headers.get('x-rona-shell-mutation')==='none','access module may not mutate global shell: '+last);
          assert(r.headers.get('x-rona-legacy-dependency')==='none','legacy dependency returned: '+last);
          assert(src.includes('admin-authority'),'authority route missing live: '+last);
          assert(src.includes('ronaCreateAccess'),'primary create-access action missing live: '+last);
          assert(src.includes("new Option('Клиент','Клиент')"),'Client create mode missing live: '+last);
          assert(src.includes("new Option('Агент','Агент')"),'Agent create mode missing live: '+last);
          assert(!src.includes('harvestLegacy'),'legacy DOM harvest deployed');
          assert(!src.includes('installNavigationStability')&&!src.includes('installShellParity'),'competing navigation/shell owner deployed');
          console.log('ADMIN_ACCESS_SINGLE_OWNER_V3_CUSTOM_DOMAIN_SEMANTIC=PASS');
          NODE