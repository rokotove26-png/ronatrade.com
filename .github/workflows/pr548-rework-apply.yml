name: PR548 reviewed rework transport

on:
  push:
    branches: [feat/client-applications-systemic-lifecycle-p1]
    paths:
      - '.github/pr548-rework/**'
      - '.github/workflows/pr548-rework-apply.yml'

permissions:
  contents: write

concurrency:
  group: pr548-reviewed-rework-transport
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-applications-systemic-lifecycle-p1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed rework exactly once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a5c23084bc5fde60c91cb5c26e792088f12fd6ad"
          test "$(git rev-list --count 83b4157edb18500467bf6b26a6d3dd5eabba3d98..HEAD)" = "4"
          cat .github/pr548-rework/part-* > /tmp/pr548.patch
          sha256sum /tmp/pr548.patch
          git show 83b4157edb18500467bf6b26a6d3dd5eabba3d98:.github/workflows/client-application-business-v2-qa.yml > .github/workflows/client-application-business-v2-qa.yml
          git apply --check /tmp/pr548.patch
          git apply /tmp/pr548.patch
          rm -rf .github/pr548-rework .github/workflows/pr548-rework-apply.yml
          git diff --check
          printf '%s\n' \
            '.github/workflows/admin-applications-kpi-refresh-v4-qa.yml' \
            '.github/workflows/client-application-business-v2-qa.yml' \
            'functions/portal/owner-api.js' \
            'governance/client-application-business-v2-owner-scope.json' \
            'scripts/application-business-v2/prepare-live-consumers.mjs' \
            'scripts/qa-admin-applications-kpi-refresh-v4.mjs' \
            'scripts/qa-client-portal-visual-freeze.mjs' \
            'supabase/functions/rona-owner-acceptance/index.ts' \
            'supabase/migrations/20260916110900_client_application_owner_business_authority_v2.sql' \
            'tests/client-application-business-v2/pg17/authority-regressions.sql' \
            'tests/client-application-business-v2/pg17/integration.sql' \
            'tests/client-application-business-v2/pg17/owner-authority-regressions.sql' \
            'tests/client-application-business-v2/pg17/review-dependencies.sql' \
            'tests/client-application-business-v2/pg17/review-regressions.sql' \
            'tests/client-application-business-v2/pg17/review-seed.sql' | sort -u > /tmp/expected-files.txt
          git diff --name-only 83b4157edb18500467bf6b26a6d3dd5eabba3d98 | grep -v '^.github/pr548-rework/' | grep -v '^.github/workflows/pr548-rework-apply.yml$' | sort -u > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git config user.name 'rokotove26-png'
          git config user.email 'rokotove26@gmail.com'
          git add -A
          git commit -m 'fix(applications): enforce Owner business authority boundary'
          git push origin HEAD:feat/client-applications-systemic-lifecycle-p1
