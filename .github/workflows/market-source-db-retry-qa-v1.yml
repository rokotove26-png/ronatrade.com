name: Market source DB saturation and source priority QA v1

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - scripts/telegram_public_market_ingest.py
      - scripts/telegram_public_pdf_ingest_v2.py
      - scripts/telegram_public_market_ingest_resilient.py
      - tests/test_telegram_ingest_db_retry_v1.py
      - .github/workflows/market-source-db-retry-qa-v1.yml
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - scripts/telegram_public_market_ingest.py
      - scripts/telegram_public_pdf_ingest_v2.py
      - scripts/telegram_public_market_ingest_resilient.py
      - tests/test_telegram_ingest_db_retry_v1.py
      - .github/workflows/market-source-db-retry-qa-v1.yml

permissions:
  contents: read

jobs:
  source-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source parser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'beautifulsoup4>=4.12,<5' 'lxml>=5,<7' 'pypdf>=5,<7' \
            'pdfplumber>=0.11,<0.12' 'requests>=2.32,<3'
      - name: Python syntax, idempotent retry and primary-source priority
        run: |
          python -m py_compile scripts/telegram_public_market_ingest.py scripts/telegram_public_pdf_ingest_v2.py scripts/telegram_public_market_ingest_resilient.py scripts/telegram_public_pdf_ingest_v3.py
          python tests/test_telegram_ingest_db_retry_v1.py
          echo 'RONA_TELEGRAM_MARKET_SOURCE_DB_RETRY=PASS'
