name: clients-home-layout-qa

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin.js'
      - 'functions/portal/clients-home-layout-ui.js'
      - '.github/workflows/clients-home-layout-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin.js'
      - 'functions/portal/clients-home-layout-ui.js'
      - '.github/workflows/clients-home-layout-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  clients-home-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static contract
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/clients-home-layout-ui.js
          grep -q 'rona-clients-home-layout-loader' functions/portal/admin.js
          grep -q 'x-rona-clients-layout' functions/portal/admin.js
          grep -q 'x-rona-logo-shimmer' functions/portal/admin.js
          grep -q 'телеметрия' functions/portal/clients-home-layout-ui.js
          grep -q 'многоорганизационный контур' functions/portal/clients-home-layout-ui.js
          grep -q 'ronaLogoShimmer' functions/portal/clients-home-layout-ui.js
      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          google-chrome --version
      - name: Prove compact Clients workspace and preserved handlers
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { onRequest } from './functions/portal/clients-home-layout-ui.js';
          const script=await (await onRequest()).text();
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          const ctx=await browser.newContext({viewport:{width:1600,height:1000}});
          const page=await ctx.newPage();
          await page.setContent(`<!doctype html><html><head></head><body>
            <aside class="brand"><img id="logo" alt="RONA Trade" src="/assets/rona-logo.svg"></aside>
            <nav id="nav"><button class="active" data-page="access">Клиенты и агенты</button></nav>
            <section id="page-access">
              <div class="rona-rs-root" data-kind="clients"><div class="rona-rs-v3-title">Клиенты и агенты</div></div>
              <section class="rona-functional-preserved-host" data-kind="clients">
                <section class="rona-rs-preserved"><h2>Дополнительные настройки доступа</h2>
                  <div class="rona-owner-page-content">
                    <div class="rona-visual-hero"><div class="rona-visual-title">Клиенты и агенты</div></div>
                    <section class="rona-owner-card" id="intro"><div>Единая учетная запись · только важное</div><button id="createUser">Создать пользователя</button></section>
                    <section class="rona-owner-card" id="telemetry"><h2>Телеметрия сессий</h2><div>Служебные данные</div></section>
                    <section class="rona-owner-card" id="multi"><h2>Многоорганизационный контур</h2><div>Служебные данные</div></section>
                    <section class="rona-owner-card" id="users"><h2>Пользователи в сети по всем компаниям</h2><button id="usersAction">Открыть пользователя</button></section>
                    <section class="rona-owner-card" id="counterparties"><h2>Контрагенты</h2><button id="cpAction">Открыть контрагента</button></section>
                    <section class="rona-owner-card" id="agentAccess"><h2>Доступ к кабинету агента</h2><button id="accessAction">Изменить доступ</button></section>
                    <section class="rona-owner-card" id="assignment"><h2>Назначение агента</h2><select><option>Егор Кузнецов</option></select><button id="assignAction">Сохранить</button></section>
                  </div>
                </section>
              </section>
            </section>
          </body></html>`);
          await page.evaluate(()=>{
            window.__hits={create:0,users:0,cp:0,access:0,assign:0};
            for(const [id,key] of [['createUser','create'],['usersAction','users'],['cpAction','cp'],['accessAction','access'],['assignAction','assign']])document.getElementById(id).addEventListener('click',()=>window.__hits[key]++);
            window.__RONA_OWNER_ADMIN_READY__=true;
            window.__RONA_REMAINING_FUNCTIONAL_PRESERVE_READY__=true;
          });
          await page.addScriptTag({content:script});
          await page.waitForFunction(()=>window.__RONA_CLIENTS_HOME_LAYOUT_READY__===true);
          const rootDisplay=await page.locator('#page-access>.rona-rs-root').evaluate(el=>getComputedStyle(el).display);
          if(rootDisplay!=='none')throw new Error('duplicate renderer root still visible');
          for(const id of ['telemetry','multi']){const d=await page.locator('#'+id).evaluate(el=>getComputedStyle(el).display);if(d!=='none')throw new Error(id+' still visible')}
          const dup=await page.locator('.rona-visual-hero').evaluate(el=>getComputedStyle(el).display);if(dup!=='none')throw new Error('duplicate title still visible');
          const width=await page.locator('.rona-functional-preserved-host[data-kind="clients"]').evaluate(el=>getComputedStyle(el).maxWidth);if(width!=='1440px')throw new Error('workspace width '+width);
          const createParent=await page.locator('#createUser').evaluate(el=>el.parentElement.className);if(!createParent.includes('rona-clients-actionbar'))throw new Error('create user action not promoted');
          for(const id of ['createUser','usersAction','cpAction','accessAction','assignAction'])await page.locator('#'+id).click();
          const hits=await page.evaluate(()=>window.__hits);if(Object.values(hits).some(x=>x!==1))throw new Error('handlers lost '+JSON.stringify(hits));
          const marked=await page.locator('#users').evaluate(el=>el.classList.contains('rona-clients-home-card'));if(!marked)throw new Error('home card style missing');
          const logo=await page.locator('#logo').evaluate(el=>el.classList.contains('rona-logo-shimmer'));if(!logo)throw new Error('logo shimmer missing');
          console.log('CLIENTS_HOME_LAYOUT=PASS '+JSON.stringify(hits));
          await ctx.close();await browser.close();
          NODE
      - name: Production endpoint proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            headers=$(mktemp); body=$(mktemp)
            if curl -fsS -D "$headers" -o "$body" "https://ronaoil.com/portal/clients-home-layout-ui?v=${GITHUB_SHA}"; then
              if grep -qi '^x-rona-clients-layout: home-v2' "$headers" && grep -q '__RONA_CLIENTS_HOME_LAYOUT__' "$body"; then ok=1; rm -f "$headers" "$body"; break; fi
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          test "$ok" = 1
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; description='Clients home layout QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; description='Clients compact layout + preserved functions + logo shimmer PASS'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -d "{\"state\":\"${state}\",\"context\":\"rona/clients-home-layout\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
