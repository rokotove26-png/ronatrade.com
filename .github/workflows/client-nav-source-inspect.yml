name: client-nav-source-inspect

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/client-nav-source-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-client-nav-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and inspect obsolete nav source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { brotliDecompressSync } from 'node:zlib';
          const dir='portal-src/current/client';
          const chunks=Array.from({length:10},(_,i)=>`payload.${String(i).padStart(2,'0')}`);
          const encoded=(await Promise.all(chunks.map(n=>readFile(`${dir}/${n}`,'utf8')))).join('');
          const text=brotliDecompressSync(Buffer.from(encoded,'base64')).toString('utf8');
          const patterns=[/ДС\s*(?:и|\/|&)\s*инвойс(?:ы)?/giu,/DS\s*(?:and|\/|&)\s*Invoices?/giu,/инвойс(?:ы)?/giu];
          const seen=new Set();
          let found=0;
          for(const re of patterns){
            for(const m of text.matchAll(re)){
              const key=m.index;
              if(seen.has(key)) continue;
              seen.add(key); found++;
              const a=Math.max(0,m.index-1000), b=Math.min(text.length,m.index+m[0].length+1000);
              console.log(`\n--- MATCH ${found} @${m.index} :: ${m[0]} ---\n${text.slice(a,b).replaceAll('\u0000','')}\n--- END MATCH ${found} ---`);
            }
          }
          console.log(`CLIENT_NAV_MATCHES=${found}`);
          if(!found) process.exitCode=2;
          NODE
