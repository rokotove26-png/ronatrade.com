name: Admin topbar lifecycle mirror v4 QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/owner-ui-chunks/chunk15.js'
      - 'functions/portal/owner-ui-chunks/chunk15-base.js'
      - 'functions/portal/main-ui/admin-topbar-ticker-safe-v2.js'
      - 'tests/admin-topbar-build-ticker-v1.test.mjs'
      - '.github/workflows/admin-topbar-build-ticker-v1-qa.yml'

jobs:
  admin-topbar-lifecycle-mirror-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce runtime recovery scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/public-go-live-v1.1 --depth=1
          changed="$(git diff --name-only origin/release/public-go-live-v1.1...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(functions/portal/owner-ui-chunks/chunk15\.js|functions/portal/owner-ui-chunks/chunk15-base\.js|functions/portal/main-ui/admin-topbar-ticker-safe-v2\.js|tests/admin-topbar-build-ticker-v1\.test\.mjs|\.github/workflows/admin-topbar-build-ticker-v1-qa\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected files in Admin topbar lifecycle-mirror PR:'
            printf '%s\n' "$bad"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^supabase/|owner-api|price-updates-api|admin-payments|migrations|schema|\.sql$|portal-src/current/admin\.html|application-passport-runtime\.js)' >/dev/null; then
            echo 'Protected backend/API/DB/canonical Admin or accepted Applications runtime surface changed unexpectedly'
            exit 1
          fi
      - name: Verify immutable safe prepaint base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:functions/portal/owner-ui-chunks/chunk15-base.js)" = "dc5606859fd0193b3dc428d17957439273bd571b"
          grep -F "import adminTopbarTickerSafeRuntime from '../main-ui/admin-topbar-ticker-safe-v2.js';" functions/portal/owner-ui-chunks/chunk15.js
          grep -F "export default basePrepaintRuntime + adminTopbarTickerSafeRuntime + paymentsCanonicalFirstPaintGuardRuntime;" functions/portal/owner-ui-chunks/chunk15.js
          ! grep -q 'appendChild(indicator)' functions/portal/main-ui/admin-topbar-ticker-safe-v2.js
          ! grep -q 'insertBefore(indicator' functions/portal/main-ui/admin-topbar-ticker-safe-v2.js
      - name: Verify accepted premium compositions remain untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:functions/portal/owner-ui-chunks/chunk18.js)" = "b07433cb9fe8e0520f532779c555c9b167fdbfb0"
          test "$(git rev-parse HEAD:functions/portal/main-ui/application-passport-runtime.js)" = "a24456b11eb642bb987c2ee4cddda8df5d45e601"
      - name: Install browser QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove cold-start hard-reload and production-policy ticker fallback
        run: node tests/admin-topbar-build-ticker-v1.test.mjs
