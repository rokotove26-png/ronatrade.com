name: Diagnose Payments V8 Hotfix Preview

on:
  push:
    branches:
      - diag/payments-v8-cloudflare-routing
    paths:
      - '.github/workflows/diag-payments-v8-hotfix-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact hotfix preview runtime
        shell: bash
        run: |
          set -euo pipefail
          u='https://dbd0b39c.rona-trade-public.pages.dev/portal/admin-main-ui-current'
          curl -fsS -D /tmp/h -o /tmp/b "$u"
          echo '=== HEADERS ==='
          cat /tmp/h
          echo '=== FINGERPRINT ==='
          sha256sum /tmp/b
          wc -c /tmp/b
          echo '=== RESPONSE HEADER GATES ==='
          grep -Eiq '^x-rona-payments-ui: admin-payments-v7-native-v2\r?$' /tmp/h
          echo 'payments_ui_header=true'
          grep -Eiq '^x-rona-payments-handoff: payments-v7-projection\r?$' /tmp/h
          echo 'payments_handoff_header=true'
          echo '=== BODY MARKERS ==='
          grep -F 'admin-payments-v7-native-v2' /tmp/b >/dev/null
          echo 'renderer_marker=true'
          grep -F 'paymentsV7Money(deal?.due_now)' /tmp/b >/dev/null
          echo 'due_now_marker=true'
          grep -F "paymentsV7Kpi('Conditional'" /tmp/b >/dev/null
          echo 'conditional_marker=true'
          grep -F "paymentsV7Aggregate(deals,'future_conditional')" /tmp/b >/dev/null
          echo 'future_conditional_marker=true'
          if grep -F "text:'Ожидается'}),e('strong',{text:paymentsV7Money(deal?.remaining_to_receive)})" /tmp/b >/dev/null; then
            echo 'stale_per_deal_expected_marker=true'
            exit 9
          else
            echo 'stale_per_deal_expected_marker=false'
          fi
          if grep -F 'spendMoney(d.remaining.amount,d.currency)' /tmp/b >/dev/null; then
            echo 'legacy_spend_remaining_marker=true'
            exit 10
          else
            echo 'legacy_spend_remaining_marker=false'
          fi
          echo 'HOTFIX_PREVIEW_PAYMENTS_V8=PASS'
