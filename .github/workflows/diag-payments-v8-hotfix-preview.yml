name: Diagnose Payments V8 Hotfix Preview

on:
  push:
    branches:
      - diag/payments-v8-cloudflare-routing
    paths:
      - '.github/workflows/diag-payments-v8-hotfix-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact hotfix preview runtime
        shell: bash
        run: |
          set -euo pipefail
          u='https://dbd0b39c.rona-trade-public.pages.dev/portal/admin-main-ui-current'
          curl -fsS -D /tmp/h -o /tmp/b "$u"
          tr -d '\r' < /tmp/h > /tmp/hn
          echo '=== HEADERS ==='
          cat /tmp/hn
          echo '=== FINGERPRINT ==='
          sha256sum /tmp/b
          wc -c /tmp/b
          echo '=== RESPONSE HEADER GATES ==='
          grep -Fxi 'x-rona-payments-ui: admin-payments-v7-native-v2' /tmp/hn >/dev/null
          echo 'payments_ui_header=true'
          grep -Fxi 'x-rona-payments-handoff: payments-v7-projection' /tmp/hn >/dev/null
          echo 'payments_handoff_header=true'
          echo '=== ACTIVE PAYMENTS RENDERER GATES ==='
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s = readFileSync('/tmp/b','utf8');
          const from = s.indexOf('function paymentsV7Projection(){');
          const to = s.indexOf('function renderCash(){', from);
          if (from < 0 || to < 0 || to <= from) throw new Error('ACTIVE_PAYMENTS_V8_SECTION_NOT_FOUND');
          const p = s.slice(from,to);
          const required = [
            'admin-payments-v7-native-v2',
            'paymentsV7Money(deal?.due_now)',
            "paymentsV7Kpi('Conditional'",
            "paymentsV7Aggregate(deals,'future_conditional')",
          ];
          for (const marker of required) {
            if (!p.includes(marker)) throw new Error(`REQUIRED_MARKER_MISSING:${marker}`);
            console.log(`required_marker=true ${marker}`);
          }
          const forbidden = [
            "text:'Ожидается'}),e('strong',{text:paymentsV7Money(deal?.remaining_to_receive)})",
            'spendMoney(d.remaining.amount,d.currency)',
            'DEAL-2026-',
          ];
          for (const marker of forbidden) {
            if (p.includes(marker)) throw new Error(`ACTIVE_RENDERER_FORBIDDEN_MARKER:${marker}`);
            console.log(`active_forbidden_marker=false ${marker}`);
          }
          const renderPaymentsCount = (s.match(/function renderPayments\(/g) || []).length;
          const legacySpendCount = (s.match(/spendMoney\(d\.remaining\.amount,d\.currency\)/g) || []).length;
          console.log(`renderPayments_definition_count=${renderPaymentsCount}`);
          console.log(`whole_script_legacy_spend_marker_count=${legacySpendCount}`);
          if (renderPaymentsCount !== 1) throw new Error(`RENDER_PAYMENTS_DEFINITION_COUNT:${renderPaymentsCount}`);
          console.log('HOTFIX_PREVIEW_PAYMENTS_V8=PASS');
          NODE
