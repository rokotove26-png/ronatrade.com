name: Logout all portals production QA

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  logout-all-portals-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright runtime using preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            echo 'PREINSTALLED_CHROME_NOT_FOUND'
            exit 1
          fi

      - name: Wait for Cloudflare production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<140;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-LOGOUT-QA'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare deployment '+cf.conclusion);await sleep(6000);return}}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Client and Agent logout production E2E
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const {chromium}=require('playwright');
          const base='https://ronaoil.com';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN;
          const runUrl=`https://github.com/${repo}/actions/runs/${runId}`;
          const contractId='RONA-C002-CTR-2026-001';
          const password='Aa1!'+crypto.randomBytes(18).toString('base64url')+'!';
          const suffix=`${runId}_${attempt}`;
          const clientLogin=`qa_logout_client_${suffix}`,clientEmail=`qa-logout-client-${suffix}@example.invalid`;
          const staleQaUserIds=['b3132347-9e4d-4fc1-9d64-9978da984a8b','f2a5cf9e-8b56-45aa-82c2-41e17720705e','167f0f39-727c-4260-ae9d-75b9ffd2deb3','2da7f2dd-f454-4c3b-96b2-1eca4c743c5a'];
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let clientUserId='',adminCookie='';
          const proof={client:{},agent:{},cleanup:{staleQa:{}}};
          async function status(state,description){try{await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'},body:JSON.stringify({state,context:'rona/logout-all-portals-e2e',description:String(description).slice(0,140),target_url:runUrl})})}catch(_e){}}
          async function broker(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();assert(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token,'controlled Admin session unavailable '+JSON.stringify({status:r.status,code:j.code,proof:j.proof||null}));return j.session}
          async function refreshAdminCookie(){const admin=await broker();adminCookie=`rona_portal_at=${admin.access_token}; rona_portal_rt=${admin.refresh_token}`;}
          function jsonHeaders(){return{cookie:adminCookie,origin:base,referer:base+'/portal/admin','content-type':'application/json',accept:'application/json'}}
          async function adminGet(path){const r=await fetch(base+'/portal/admin-authority'+path,{headers:{cookie:adminCookie,accept:'application/json'},redirect:'manual'});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}return{r,j,t}}
          async function adminPost(path,body={}){const r=await fetch(base+'/portal/admin-authority'+path,{method:'POST',headers:jsonHeaders(),body:JSON.stringify(body),redirect:'manual'});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}return{r,j,t}}
          async function adminPostStable(path,body={}){let last;for(let i=0;i<7;i++){last=await adminPost(path,body);if(![500,502,503,504].includes(last.r.status))return last;await sleep(900)}return last}
          async function cleanupStaleQa(){try{await refreshAdminCookie()}catch{return}for(const id of staleQaUserIds){try{const x=await adminPostStable('/access/users/'+encodeURIComponent(id)+'/block',{});proof.cleanup.staleQa[id]=x.r.status}catch{}}}
          async function cleanup(){try{await refreshAdminCookie()}catch{}if(clientUserId){try{const x=await adminPostStable('/access/users/'+encodeURIComponent(clientUserId)+'/contracts/'+encodeURIComponent(contractId)+'/revoke',{});proof.cleanup.clientRevoke=x.r.status}catch{}try{const x=await adminPostStable('/access/users/'+encodeURIComponent(clientUserId)+'/block',{});proof.cleanup.clientBlock=x.r.status}catch{}}}
          async function verifyLogout(context,portalPath,label){const page=await context.newPage();await page.goto(base+portalPath,{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname===portalPath,label+' portal navigation '+page.url());for(let i=0;i<200;i++){if(await page.evaluate(()=>window.__RONA_PORTAL_LOGOUT_RUNTIME__===true))break;if(i===199)throw new Error(label+' logout runtime timeout');await page.waitForTimeout(100)}const control=page.locator('[data-rona-logout-bound="true"]').first();assert(await control.count()&&await control.isVisible(),label+' logout control missing');assert((await control.innerText()).trim()==='Выход',label+' logout label mismatch: '+await control.innerText());await control.click();await page.waitForURL(u=>new URL(u).origin===base&&new URL(u).pathname==='/',{timeout:12000});assert(!(await context.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),label+' auth cookies remain');const api=await context.request.get(base+'/portal/api/session/me');assert([401,403].includes(api.status()),label+' protected API survived logout '+api.status());await page.goBack({waitUntil:'domcontentloaded',timeout:10000}).catch(()=>null);await page.waitForTimeout(900);assert(new URL(page.url()).pathname!==portalPath,label+' Back restored authenticated portal');return{visible:true,label:'Выход',redirect:base,apiDenied:api.status(),backDenied:true}}
          async function clientLogout(browser){const context=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});const login=await context.request.post(base+'/portal/auth/login',{headers:{origin:base,referer:base+'/portal/login','content-type':'application/json',accept:'application/json'},data:{email:clientEmail,password,next:'/portal/client'}});const text=await login.text();let body={};try{body=JSON.parse(text)}catch{}assert(login.status()===200&&body?.ok===true&&body?.redirect==='/portal/client','Client login '+login.status()+' '+text.slice(0,500));assert((await context.cookies()).some(x=>x.name==='rona_portal_at'),'Client access cookie missing after login');const result=await verifyLogout(context,'/portal/client','Client');await context.close();return result}
          async function agentLogout(browser){const session=await broker();const context=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await context.addCookies([{name:'rona_portal_at',value:session.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:session.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);const result=await verifyLogout(context,'/portal/agent','Agent');await context.close();return result}
          (async()=>{
            await status('pending','Logout all portals production E2E running');
            await cleanupStaleQa();
            await refreshAdminCookie();
            const boot=await adminGet('/bootstrap');assert(boot.r.ok&&boot.j?.ok===true,'admin bootstrap '+boot.r.status+' '+boot.t.slice(0,300));const c2=(boot.j.data?.contracts||[]).find(x=>x.contractId===contractId);assert(c2&&c2.contractStatus==='ACTIVE','eligible Client contract unavailable '+JSON.stringify(c2||null));
            const cr=await adminPostStable('/access/users',{role:'Клиент',name:'QA LOGOUT CLIENT',login:clientLogin,email:clientEmail,initialPassword:password,contractIds:[contractId],openWithoutContract:false,bindingRole:'Уполномоченный представитель'});assert(cr.r.status===201&&cr.j?.ok===true&&cr.j.userId,'client create '+cr.r.status+' '+cr.t.slice(0,500));clientUserId=String(cr.j.userId);assert(Array.isArray(cr.j.linkedContractIds)&&cr.j.linkedContractIds.includes(contractId),'client active binding '+JSON.stringify(cr.j));proof.client.created=true;
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            proof.client.logout=await clientLogout(browser);
            proof.agent.logout=await agentLogout(browser);
            await browser.close();
            await cleanup();
            assert(proof.cleanup.clientRevoke>=200&&proof.cleanup.clientRevoke<300,'client cleanup revoke');assert(proof.cleanup.clientBlock>=200&&proof.cleanup.clientBlock<300,'client cleanup block');
            console.log('RONA_LOGOUT_E2E='+JSON.stringify({ok:true,client:proof.client,agent:proof.agent,cleanup:proof.cleanup,redirectTarget:base,backSessionRestore:'DENIED'}));
            await status('success','Client and Agent logout redirect/Back/API E2E PASS');
          })().catch(async e=>{await cleanup();console.error(e.stack||e);console.error('RONA_LOGOUT_E2E_FAILURE='+JSON.stringify({client:proof.client,agent:proof.agent,cleanup:proof.cleanup,clientUserId}));await status('failure','Logout all portals production E2E failed');process.exit(1)});
          NODE
