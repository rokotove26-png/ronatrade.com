name: Logout current contract QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/logout.js'
      - '.github/workflows/logout-all-portals-production-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/logout.js'
      - '.github/workflows/logout-all-portals-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logout-current-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fail-closed logout source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/logout.js
          grep -q "clearCookie('rona_portal_at')" functions/portal/logout.js
          grep -q "clearCookie('rona_portal_rt')" functions/portal/logout.js
          grep -q "if (!sameOrigin(context.request)) return clearedResponse(403)" functions/portal/logout.js
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          grep -q "scope=local" functions/portal/logout.js
          grep -q "Browser session cookies are still invalidated fail-closed" functions/portal/logout.js
          echo 'LOGOUT_CURRENT_CONTRACT=PASS'
