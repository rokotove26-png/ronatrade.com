name: Logout all portals production QA

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  logout-all-portals-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright runtime using preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Wait for Cloudflare production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<140;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-LOGOUT-QA'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare '+cf.conclusion);await sleep(6000);return}}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Client and Agent logout production E2E
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const {chromium}=require('playwright');
          const base='https://ronaoil.com',repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN;
          const contractId='RONA-C002-CTR-2026-001';
          const suffix=`${runId}_${attempt}`,clientLogin=`qa_logout_client_${suffix}`,clientEmail=`qa-logout-client-${suffix}@example.invalid`,password='Aa1!'+crypto.randomBytes(18).toString('base64url')+'!';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          let adminCookie='',clientUserId='';
          const runUrl=`https://github.com/${repo}/actions/runs/${runId}`;
          async function status(state,description){try{await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'},body:JSON.stringify({state,context:'rona/logout-all-portals-e2e',description:String(description).slice(0,140),target_url:runUrl})})}catch{}}
          async function broker(){let last={};for(let i=0;i<10;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json().catch(()=>({}));last={status:r.status,code:j.code};if(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token)return j.session;await sleep(900*(i+1))}throw new Error('controlled Admin session '+JSON.stringify(last))}
          async function refreshAdmin(){const s=await broker();adminCookie=`rona_portal_at=${s.access_token}; rona_portal_rt=${s.refresh_token}`;return s}
          async function admin(path,method='GET',body=null){let last={};for(let i=0;i<8;i++){if(!adminCookie)await refreshAdmin();const init={method,headers:{cookie:adminCookie,accept:'application/json'}};if(method==='POST'){init.headers.origin=base;init.headers.referer=base+'/portal/admin';init.headers['content-type']='application/json';init.body=JSON.stringify(body||{})}const r=await fetch(base+'/portal/admin-authority'+path,init),text=await r.text();let j={};try{j=JSON.parse(text)}catch{};if([401,403].includes(r.status)){adminCookie='';await sleep(400);continue}if(![500,502,503,504].includes(r.status))return{r,j,text};last={status:r.status,text:text.slice(0,240)};await sleep(700*(i+1))}throw new Error('admin '+path+' '+JSON.stringify(last))}
          async function waitPrimary(page,role){const flag='__RONA_OWNER_'+role+'_READY__';for(let i=0;i<450;i++){const ok=await page.evaluate(([f])=>window.__RONA_MAIN_UI_ENTRY__===true&&window[f]===true&&window.__RONA_OWNER_FIRST_PAINT_READY__===true&&document.documentElement.classList.contains('rona-owner-paint-ready'),[flag]);if(ok)return;await page.waitForTimeout(100)}throw new Error(role+' primary UI timeout')}
          async function verifyLogout(context,path,role,label){const page=await context.newPage();await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname===path,label+' route '+page.url());await waitPrimary(page,role);for(let i=0;i<200;i++){const visible=await page.locator('[data-rona-logout-bound="true"]').first().isVisible().catch(()=>false);if(visible)break;if(i===199)throw new Error(label+' logout control missing after primary UI ready');await page.waitForTimeout(100)}const control=page.locator('[data-rona-logout-bound="true"]').first();assert((await control.innerText()).trim()==='Выход',label+' logout label');await control.click();await page.waitForURL(u=>new URL(u).origin===base&&new URL(u).pathname==='/',{timeout:12000});assert(!(await context.cookies()).some(x=>x.name==='rona_portal_at'||x.name==='rona_portal_rt'),label+' auth cookies remain');const api=await context.request.get(base+'/portal/api/session/me');assert([401,403].includes(api.status()),label+' protected API survived logout '+api.status());await page.goBack({waitUntil:'domcontentloaded',timeout:10000}).catch(()=>null);await page.waitForTimeout(800);assert(new URL(page.url()).pathname!==path,label+' Back restored portal');return{label:'Выход',redirect:base,apiDenied:api.status(),backDenied:true}}
          async function cleanup(){if(!clientUserId)return;try{await admin('/access/users/'+encodeURIComponent(clientUserId)+'/contracts/'+encodeURIComponent(contractId)+'/revoke','POST',{})}catch{}try{await admin('/access/users/'+encodeURIComponent(clientUserId)+'/block','POST',{})}catch{}}
          (async()=>{
            await status('pending','Logout all portals production E2E running');
            await refreshAdmin();const boot=await admin('/bootstrap');assert(boot.r.ok&&boot.j?.ok===true,'admin bootstrap '+boot.r.status+' '+boot.text.slice(0,240));
            const created=await admin('/access/users','POST',{role:'Клиент',name:'QA LOGOUT CLIENT',login:clientLogin,email:clientEmail,initialPassword:password,contractIds:[contractId],openWithoutContract:false,bindingRole:'Уполномоченный представитель'});assert(created.r.status===201&&created.j?.ok===true&&created.j.userId,'client create '+created.r.status+' '+created.text.slice(0,300));clientUserId=String(created.j.userId);
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const clientCtx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});const login=await clientCtx.request.post(base+'/portal/auth/login',{headers:{origin:base,referer:base+'/portal/login','content-type':'application/json',accept:'application/json'},data:{email:clientEmail,password,next:'/portal/client'}});const lt=await login.text();let lj={};try{lj=JSON.parse(lt)}catch{};assert(login.status()===200&&lj?.ok===true&&lj?.redirect==='/portal/client','Client login '+login.status()+' '+lt.slice(0,300));const client=await verifyLogout(clientCtx,'/portal/client','CLIENT','Client');await clientCtx.close();
            const session=await broker();const agentCtx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await agentCtx.addCookies([{name:'rona_portal_at',value:session.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:session.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);const agent=await verifyLogout(agentCtx,'/portal/agent','AGENT','Agent');await agentCtx.close();await browser.close();
            await cleanup();clientUserId='';console.log('RONA_LOGOUT_E2E=PASS '+JSON.stringify({client,agent,primaryUi:true}));await status('success','Client and Agent logout primary UI E2E PASS');
          })().catch(async e=>{await cleanup();console.error(e.stack||e);await status('failure','Logout all portals production E2E failed');process.exit(1)});
          NODE
