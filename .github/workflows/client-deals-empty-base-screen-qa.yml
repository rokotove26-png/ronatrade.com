name: Client Deals empty base screen QA

on:
  push:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deals-empty-base-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current Client
        run: npm run build
      - name: Install browser harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi
      - name: Prove zero Deals and active first-paint recovery
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const path=require('path');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          const built=fs.readFileSync('dist/portal/client.html','utf8');
          const match=built.match(/<style id="rona-client-section-first-paint-v1-style">[\s\S]*?<\/style>/i);
          assert(match,'first-paint style missing');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const page=await browser.newPage({viewport:{width:1400,height:900}});
            const clientId='TEST-C001',contractId='TEST-CTR-001';
            const contextPath=`/v1/client/context?clientId=${clientId}&contractId=${contractId}`;
            const body=`<!doctype html><html data-rona-client-id="${clientId}" data-rona-contract-id="${contractId}" data-rona-client-context-authority="qa" data-rona-client-context-selection="selected"><head>${match[0]}</head><body><section id="page-deals" style="display:block;position:relative;width:1200px;height:650px;background:linear-gradient(180deg,#0b2337,#071522)"><header id="baseShell" style="height:120px"><h1>Сделки</h1><div>Выбрана компания TEST</div></header><div id="terminalRow" data-rona-operations-deal-status="COMPLETED">DEAL-2099-900 CLOSED</div></section></body></html>`;
            await page.route('https://rona.test/portal/client',route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body}));
            await page.goto('https://rona.test/portal/client',{waitUntil:'domcontentloaded'});
            await page.evaluate(({contextPath})=>{window.__RONA_CLIENT_BACKGROUND_CACHE__={[contextPath]:{ok:true,status:200,body:{ok:true,data:{deals:[]}}}}},{contextPath});
            await page.addScriptTag({path:path.resolve('assets/portal-runtime/client-section-first-paint-v1.js')});
            await page.waitForFunction(()=>document.documentElement.dataset.ronaClientDealsPaintState==='empty'&&document.documentElement.getAttribute('data-rona-client-deals-paint-ready')==='true',null,{timeout:5000});
            const empty=await page.evaluate(()=>{
              const root=document.querySelector('#page-deals');
              const base=document.querySelector('#baseShell');
              const stale=document.querySelector('#terminalRow');
              const pseudo=getComputedStyle(root,'::after');
              const rect=root.getBoundingClientRect();
              return{
                state:document.documentElement.dataset.ronaClientDealsPaintState,
                owner:root.getAttribute('data-rona-client-deals-empty'),
                baseDisplay:getComputedStyle(base).display,
                staleDisplay:getComputedStyle(stale).display,
                message:pseudo.content,
                width:parseFloat(pseudo.width),
                height:parseFloat(pseudo.height),
                rootWidth:rect.width,
                rootHeight:rect.height,
                background:pseudo.backgroundColor,
                pointerEvents:pseudo.pointerEvents
              };
            });
            assert(empty.state==='empty'&&empty.owner==='server-authoritative-empty-v1','authoritative empty state missing');
            assert(empty.baseDisplay!=='none','base Deals screen was hidden');
            assert(empty.staleDisplay==='none','terminal/stale deal row remained visible in empty state');
            assert(empty.message.includes('Открытых сделок нет'),'empty notice missing');
            assert(empty.width<empty.rootWidth*.75&&empty.height<empty.rootHeight*.40,'empty notice still behaves like a full-screen shield');
            assert(/rgba\([^)]*,\s*0\.(?:8|82)\)/.test(empty.background),'empty notice is not translucent panel styling');
            assert(empty.pointerEvents==='none','empty notice blocks the base screen');

            // Exact regression: the authoritative context switches to an active Deal before
            // auxiliary operations/root-authority readiness markers are available.
            await page.evaluate(({contextPath})=>{
              window.__RONA_CLIENT_BACKGROUND_CACHE__[contextPath]={ok:true,status:200,body:{ok:true,data:{deals:[{deal_id:'DEAL-2099-901',current_status:'ACTIVE'}]}}};
              const root=document.querySelector('#page-deals');
              root.querySelector('#terminalRow')?.remove();
              window.dispatchEvent(new CustomEvent('rona:client:background-sections'));
            },{contextPath});
            await page.waitForFunction(()=>document.documentElement.dataset.ronaClientDealsPaintState==='loading',null,{timeout:5000});

            // Once the authoritative active Deal is actually represented in the Deals DOM,
            // first paint must become ready even while those auxiliary markers are still absent.
            await page.evaluate(()=>{
              const root=document.querySelector('#page-deals');
              root.insertAdjacentHTML('beforeend','<article id="activeDeal" class="rona-deal-card-v5" data-rona-canonical-deal-id="DEAL-2099-901"><div>DEAL-2099-901 CURRENT DEAL</div></article>');
              window.dispatchEvent(new CustomEvent('rona:client:background-sections'));
            });
            await page.waitForTimeout(500);
            const readinessProbe=await page.evaluate(({contextPath})=>{
              const root=document.querySelector('#page-deals');
              return{
                state:document.documentElement.dataset.ronaClientDealsPaintState,
                paintReady:document.documentElement.getAttribute('data-rona-client-deals-paint-ready'),
                operationsReady:document.documentElement.getAttribute('data-rona-client-operations-ready'),
                dealAuthority:root.getAttribute('data-rona-deal-authority'),
                rootText:root.textContent,
                rootDisplay:getComputedStyle(root).display,
                rootVisibility:getComputedStyle(root).visibility,
                parentDisplay:getComputedStyle(root.parentElement).display,
                parentVisibility:getComputedStyle(root.parentElement).visibility,
                contextPath,
                cacheKeys:Object.keys(window.__RONA_CLIENT_BACKGROUND_CACHE__||{}),
                marker:window.__RONA_CLIENT_SECTION_FIRST_PAINT__
              };
            },{contextPath});
            assert(readinessProbe.state==='ready'&&readinessProbe.paintReady==='true','active authoritative Deal remained stuck in loading: '+JSON.stringify(readinessProbe));
            const recovered=await page.evaluate(()=>({
              notice:getComputedStyle(document.querySelector('#page-deals'),'::after').content,
              activeDisplay:getComputedStyle(document.querySelector('#activeDeal')).display,
              emptyOwner:document.querySelector('#page-deals').getAttribute('data-rona-client-deals-empty'),
              operationsReady:document.documentElement.getAttribute('data-rona-client-operations-ready'),
              dealAuthority:document.querySelector('#page-deals').getAttribute('data-rona-deal-authority'),
              state:document.documentElement.dataset.ronaClientDealsPaintState
            }));
            assert(recovered.state==='ready','active authoritative Deal remained stuck in loading');
            assert(recovered.operationsReady!=='true','regression fixture accidentally supplied operations-ready marker');
            assert(recovered.dealAuthority!=='admin-client-server-v8','regression fixture accidentally supplied deal-authority marker');
            assert(recovered.notice==='none'||recovered.notice==='normal','empty notice survived active Deals');
            assert(recovered.activeDisplay!=='none','active Deal remained hidden after recovery');
            assert(!recovered.emptyOwner,'empty owner survived active Deals');
            console.log('CLIENT_DEALS_FIRST_PAINT_ACTIVE_WITHOUT_AUX_MARKERS=PASS');
            console.log('CLIENT_DEALS_EMPTY_BASE_SCREEN=PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
