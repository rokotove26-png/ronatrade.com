name: Operations write-pilot one-shot PR runner

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  contents: write

jobs:
  apply-pilot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute embedded deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f 'functions/operations-pilot/[[path]].js' ]; then
            node <<'NODE'
          const fs=require('fs');
          const y=fs.readFileSync('.github/workflows/operations-write-pilot-build.yml','utf8');
          const start=y.indexOf("          node <<'NODE'\n");
          const end=y.indexOf("\n          NODE\n",start+1);
          if(start<0||end<0)throw new Error('embedded patch block not found');
          let js=y.slice(start+"          node <<'NODE'\n".length,end).replace(/^          /gm,'');
          fs.writeFileSync('/tmp/operations-pilot-patch.js',js);
          NODE
            node /tmp/operations-pilot-patch.js
            git checkout HEAD -- .github/workflows/operations-write-pilot-build.yml
            rm -f .github/workflows/mcp-operations-write-pilot-qa.yml
          fi
          node --check functions/_mcp_transport.js
          node --check functions/_mcp_consent_bridge.js
          node --check functions/_mcp_oauth_token_bridge.js
          node --check 'functions/operations-pilot/[[path]].js'
          node --check supabase/functions/rona-mcp-gateway/index.js
          node --check supabase/functions/rona-mcp-oauth-token/index.js
          node --check supabase/functions/rona-mcp-consent-bridge/index.js
          git diff --check
      - name: Commit generated pilot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'PILOT_ALREADY_GENERATED=PASS'
            exit 0
          fi
          git config user.name 'RONA System Admin Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build isolated Operations write pilot [pilot-generated]'
          git push origin HEAD:'pilot/operations-write-20260818'
