name: PR462 final source repair
# one-shot repair trigger

on:
  push:
    branches: [feat/admin-payments-final-owner-screen-passport-v1]
    paths:
      - '.github/workflows/pr462-final-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-payments-final-owner-screen-passport-v1
          fetch-depth: 0
      - name: Repair query and QA source split
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/rona-owner-ai-sync/payment-schedule-authority.ts')
          s=p.read_text()
          old="""             and (c.source_refs @> array['BUSINESS_CHANGE_PROPOSAL:'||p.record_id::text]::text[]
                  or c.payload->'source_refs' @> to_jsonb(array['BUSINESS_CHANGE_PROPOSAL:'||p.record_id::text]::text[]))"""
          new="""             and (c.source_refs @> to_jsonb(array['BUSINESS_CHANGE_PROPOSAL:'||p.record_id::text]::text[])
                  or c.payload->'source_refs' @> to_jsonb(array['BUSINESS_CHANGE_PROPOSAL:'||p.record_id::text]::text[]))"""
          if old not in s: raise SystemExit('COORDINATION_SOURCE_REFS_QUERY_NOT_FOUND')
          p.write_text(s.replace(old,new,1))

          q=Path('scripts/qa-admin-payments-final-owner-screen-source-v1.mjs')
          t=q.read_text()
          old2="""const [ai,ownerSource,passportSource,ui,runtime]=await Promise.all([
  readFile('supabase/functions/rona-owner-ai-sync/index.ts','utf8'),readFile('supabase/functions/rona-owner-ai-sync/payment-owner-screen.ts','utf8'),readFile('functions/portal/payment-passport-current.js','utf8'),readFile('functions/portal/main-ui/index.js','utf8'),readFile('functions/portal/main-ui/payment-passport-runtime-v1.js','utf8')
]);
const production=[ai,ownerSource,passportSource,ui,runtime].join('\\n');"""
          new2="""const [aiEntrypoint,aiRuntime,ownerSource,passportSource,ui,runtime]=await Promise.all([
  readFile('supabase/functions/rona-owner-ai-sync/index.ts','utf8'),readFile('supabase/functions/rona-owner-ai-sync/runtime.ts','utf8'),readFile('supabase/functions/rona-owner-ai-sync/payment-owner-screen.ts','utf8'),readFile('functions/portal/payment-passport-current.js','utf8'),readFile('functions/portal/main-ui/index.js','utf8'),readFile('functions/portal/main-ui/payment-passport-runtime-v1.js','utf8')
]);
const ai=aiEntrypoint+'\\n'+aiRuntime;
const production=[ai,ownerSource,passportSource,ui,runtime].join('\\n');"""
          if old2 not in t: raise SystemExit('SOURCE_QA_SPLIT_BLOCK_NOT_FOUND')
          q.write_text(t.replace(old2,new2,1))
          PY
          grep -Fq "c.source_refs @> to_jsonb" supabase/functions/rona-owner-ai-sync/payment-schedule-authority.ts
          grep -Fq "const ai=aiEntrypoint+'\\n'+aiRuntime" scripts/qa-admin-payments-final-owner-screen-source-v1.mjs
      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/rona-owner-ai-sync/payment-schedule-authority.ts scripts/qa-admin-payments-final-owner-screen-source-v1.mjs
          git commit -m 'fix: repair preview authority query and source QA'
          git push origin HEAD:feat/admin-payments-final-owner-screen-passport-v1
