name: Payments V8 OIDC Authenticated Production E2E

on:
  push:
    branches:
      - feat/admin-payments-final-owner-screen-passport-v1
    paths:
      - scripts/qa-payments-v8-passport-routing-production-e2e.mjs
      - .github/workflows/issue557-oidc-production-e2e.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  production-read-only-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASELINE_RELEASE_SHA: 10fdd07ba79d5d0a1da8c9510b6d659acc115713
      EXPECTED_RELEASE_SHA: 1fe8166ccb244e7ad9a8b6113fc8344a9abdaaf2
      QA_CHECKPOINT_SHA: 5741b811160e0ca76a348579bc898c730493a9ca
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production lineage and disposable QA checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/public-go-live-v1.1 qa/issue557-oidc-production-e2e-v2 --force
          live_release="$(git rev-parse origin/release/public-go-live-v1.1)"
          test "$(git rev-parse origin/qa/issue557-oidc-production-e2e-v2)" = "$QA_CHECKPOINT_SHA"
          git merge-base --is-ancestor "$BASELINE_RELEASE_SHA" "$live_release"
          test "$live_release" = "$EXPECTED_RELEASE_SHA"
          echo "LIVE_RELEASE_SHA=$live_release" >> "$GITHUB_ENV"
          echo "baseline_release=$BASELINE_RELEASE_SHA"
          echo "live_release=$live_release"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Authenticated production Payment Passport E2E — READ ONLY
        env:
          QA_HARNESS_SHA: ${{ env.QA_CHECKPOINT_SHA }}
        run: node scripts/qa-payments-v8-passport-routing-production-e2e.mjs
      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payments-v8-passport-routing-production-e2e-${{ github.run_id }}
          path: artifacts/payments-v8-passport-routing-e2e/
          if-no-files-found: warn
          retention-days: 14
