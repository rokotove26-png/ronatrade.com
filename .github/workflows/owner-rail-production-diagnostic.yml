name: Owner rail production diagnostic
on:
  push:
    branches:
      - 'hotfix/admin-interactivity-owner-rail-diagnostic-*'
permissions:
  actions: read
  contents: read
  statuses: write
jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.54.2
      - name: Inspect production rail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN,origin='https://ronaoil.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function status(state,desc){await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'},body:JSON.stringify({state,context:'rona/owner-rail-diagnostic',description:String(desc).slice(0,140),target_url:`https://github.com/${repo}/actions/runs/${runId}`})})}
          async function broker(){for(let i=0;i<8;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};console.log('BROKER',i,r.status,t.slice(0,500));if(r.ok&&j.ok&&j.session?.access_token)return j.session;await sleep(1500)}throw new Error('broker failed')}
          (async()=>{await status('pending','owner rail diagnostic running');const s=await broker(),b=await chromium.launch({headless:true,channel:'chrome'}),ctx=await b.newContext({viewport:{width:1920,height:1080}});await ctx.addCookies([{name:'rona_portal_at',value:s.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);for(const ep of ['/portal/owner-acceptance-api/admin/bootstrap','/portal/owner-api?path=%2Fadmin%2Fbootstrap']){const r=await ctx.request.get(origin+ep);const t=await r.text();console.log('ENDPOINT',ep,'STATUS',r.status(),'BODY',t.slice(0,10000))}const p=await ctx.newPage();p.on('console',m=>console.log('BROWSER',m.type(),m.text()));p.on('pageerror',e=>console.log('PAGEERROR',String(e.message||e)));await p.goto(origin+'/portal/admin?_rail_diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});for(let i=0;i<400;i++){if(await p.evaluate(()=>window.__RONA_OWNER_ADMIN_READY__===true))break;await p.waitForTimeout(100)}console.log('FLAGS',JSON.stringify(await p.evaluate(()=>({owner:window.__RONA_OWNER_ADMIN_READY__,err:window.__RONA_OWNER_ADMIN_ERROR__||null,rail:window.__RONA_OWNER_ADMIN_SNAPSHOT__?.rail||null}))));await p.locator('#nav button[data-page="monitoring"]').click();await p.waitForTimeout(500);const values=await p.locator('#page-monitoring select option').allTextContents();console.log('OPTIONS',JSON.stringify(values));console.log('HTML',(await p.locator('#page-monitoring').innerHTML()).slice(0,15000));await ctx.close();await b.close();await status('success','owner rail diagnostic captured options='+values.join('|').slice(0,80))})().catch(async e=>{console.error(e.stack||e);await status('failure',String(e.message||e));process.exit(1)});
          NODE
