name: PR462 owner correction v2 persist

on:
  push:
    branches: [feat/admin-payments-final-owner-screen-passport-v1]
    paths: ['.github/workflows/pr462-owner-correction-v2-persist.yml']

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-payments-final-owner-screen-passport-v1
          fetch-depth: 0
      - name: Reapply correction without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          git show 14a6cd4bfffaa0c432f07f9e87913fc8132b305f:.github/workflows/pr462-owner-correction-v2-apply.yml > /tmp/apply.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/apply.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=='- name: Apply owner correction v2')
          run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
          end=next(i for i in range(run+1,len(lines)) if lines[i].startswith('      - name:'))
          block=[]
          for x in lines[run+1:end]:
              block.append(x[10:] if x.startswith('          ') else x)
          script='\n'.join(block)+'\n'
          marker="python - <<'PY'\nfrom pathlib import Path\np=Path('.github/workflows/admin-payments-final-owner-screen-passport-v1.yml')"
          cut=script.rfind(marker)
          if cut < 0:
              raise SystemExit('FOCUSED_WORKFLOW_PATCH_MARKER_NOT_FOUND')
          Path('/tmp/pr462-owner-correction-v2-product.sh').write_text(script[:cut])
          PY
          bash /tmp/pr462-owner-correction-v2-product.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/portal/main-ui/index.js functions/portal/main-ui/payment-passport-runtime-v1.js functions/portal/main-ui/payment-schedule-runtime-v1.js functions/portal/payment-passport-current.js functions/portal/payment-schedule-current.js scripts/qa-admin-payments-final-owner-screen-browser-v2.mjs scripts/qa-admin-payments-final-owner-screen-source-v1.mjs scripts/qa-pr462-live-preview-finance.mjs supabase/functions/rona-owner-ai-sync/payment-owner-screen.ts supabase/functions/rona-owner-ai-sync/runtime.ts
          git commit -m 'fix: owner payment passport v2 and reconciled allocations'
          git push origin HEAD:feat/admin-payments-final-owner-screen-passport-v1
