name: Admin deferred ticker diagnostic

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-*'

permissions:
  contents: read

jobs:
  diagnose-deferred-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect frozen Admin source ticker
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html';
          const src=fs.readFileSync(file,'utf8');
          const lines=src.split('\n');
          const matches=[];
          for(let i=0;i<lines.length;i++) if(/\b(?:function\s+tick|const\s+tick|let\s+tick|var\s+tick)\b/.test(lines[i])) matches.push(i);
          console.log('RONA_TICK_MATCH_LINES='+JSON.stringify(matches.map(i=>i+1)));
          for(const idx of matches){
            const lo=Math.max(0,idx-15),hi=Math.min(lines.length,idx+30);
            console.log('RONA_TICK_EXCERPT_START');
            for(let i=lo;i<hi;i++) console.log(`${i+1}: ${lines[i]}`);
            console.log('RONA_TICK_EXCERPT_END');
          }
          if(!matches.length){
            for(let i=0;i<lines.length;i++) if(/setInterval|textContent/.test(lines[i])&&/clock|time|date|tick/i.test(lines.slice(Math.max(0,i-3),Math.min(lines.length,i+4)).join(' '))) console.log(`RONA_TIMER_CANDIDATE ${i+1}: ${lines[i]}`);
          }
          NODE
