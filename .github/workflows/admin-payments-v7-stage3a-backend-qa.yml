name: Admin Payments V7 Stage 3 Backend QA
on:
  pull_request:
  workflow_dispatch:

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact branch HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "tested_sha=$actual"
          echo "tested_sha=$actual" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A-AF backend regression, real runtime and snapshot suite
        run: npm run test:payments-v7
      - name: NO-HARDCODE changed production runtime scan
        env:
          NO_HARDCODE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run scan:payments-v7
