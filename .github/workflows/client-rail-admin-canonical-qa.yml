name: client-rail-admin-canonical-qa
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - functions/portal/client-rail-current-ui.js
      - functions/portal/rail-current-v4-ui.js
      - functions/portal/rail-current-v5-ui.js
      - functions/portal/rail-current-v6-ui.js
      - functions/portal/rail-current-v6-single-title-ui.js
      - functions/portal/rail-current-v7-real-map-ui.js
      - functions/portal/rail-current-v81-maplibre-ui.js
      - supabase/functions/rona-portal-api/client.ts
      - supabase/functions/rona-portal-api/index.ts
      - scripts/attach-client-rail-production-v1.mjs
      - scripts/qa-client-online-rail-parity-668-browser.mjs
      - assets/portal-runtime/client-content-responsive-v1.css
      - package.json
      - .github/workflows/client-rail-admin-canonical-qa.yml
  push:
    branches: [release/public-go-live-v1.1]
permissions:
  contents: read
jobs:
  client-rail-admin-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Client Rail parity source and authorization contract
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/client-rail-current-ui.js
          node --check scripts/attach-client-rail-production-v1.mjs
          node --check scripts/qa-client-online-rail-parity-668-browser.mjs
          test ! -e assets/portal-runtime/client-rail-production-v1.js
          test ! -e assets/portal-runtime/client-rail-movizor-gate-v1.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { onRequest } from './functions/portal/client-rail-current-ui.js';

          const response=await onRequest({});
          const source=await response.text();
          if(response.status!==200)throw new Error(`adapter status ${response.status}: ${source}`);
          if(response.headers.get('x-rona-client-rail-visual-canon')!=='/portal/rail-current-v81-maplibre-ui')throw new Error('Admin visual source drifted');
          if(response.headers.get('x-rona-client-rail-data')!=='authorized-read-model-v1')throw new Error('Client Rail data contract header missing');
          for(const marker of [
            "window.__RONA_CLIENT_RAIL_PRODUCTION__='20260919-admin-parity-v2'",
            'rona-rail-v4-root','rona-rail-v4-work','rona-rail-v6-selector','rona-rail-v6-wagon-box','rona-rail-v7-real',
            'ЖД-контур','Операционная картина ЖД','Позиции вагонов','/portal/map-assets/osm/',
            '/portal/api/v1/client/rail','AUTHORIZED_CLIENT_RAIL_READ_MODEL',
            'CLIENT_RAIL_ADMIN_PARITY_V1','CLIENT_RAIL_READ_MODEL_UNAVAILABLE',
            'ADMIN_CURRENT_V81_CANONICAL','PRESERVE_LAST_GOOD_ON_DEGRADED_READ_MODEL'
          ])if(!source.includes(marker))throw new Error('missing Client/Admin parity marker: '+marker);
          for(const forbidden of ['/portal/owner-api','/admin/bootstrap',"location.pathname==='/portal/admin'",'rona-rail-ws','rona-movizor-blocker','Онлайн ЖД не введён в эксплуатацию','Железнодорожные отправки',".rona-rail-v4-hero{display:none!important}"])if(source.includes(forbidden))throw new Error('retired/admin-authority marker leaked: '+forbidden);

          const clientTs=fs.readFileSync('supabase/functions/rona-portal-api/client.ts','utf8');
          const indexTs=fs.readFileSync('supabase/functions/rona-portal-api/index.ts','utf8');
          for(const marker of [
            'export async function clientRailReadModel',
            'client_user_has_contract_access',
            'client_user_has_deal_access',
            "d.lifecycle_state='ACTIVE'",
            'rail_xlsx_dislocation_current_position_v1',
            'rail_deal_route_assignments_v1',
            'rail_deal_route_progress_v1',
            'RONA_CLIENT_RAIL_DEAL_MAP_READ_MODEL_V1',
            'AUTHORIZED_CLIENT_DEALS_PLUS_TRUSTED_RAIL_EVIDENCE_V1'
          ])if(!clientTs.includes(marker))throw new Error('server Client Rail contract missing: '+marker);
          if(!indexTs.includes('clientRailReadModel')||!indexTs.includes('route==="/v1/client/rail"'))throw new Error('Client Rail route not wired');
          if(indexTs.includes('route==="/v1/client/rail"')&&indexTs.includes('production_enabled:false,rail:[],rail_documents:[],wagons:[]'))throw new Error('legacy hardcoded empty Client Rail route still present');

          const attach=fs.readFileSync('scripts/attach-client-rail-production-v1.mjs','utf8');
          for(const marker of [
            '20260919-admin-parity-v2',
            "visual_canon:'ADMIN_CURRENT_V81_CANONICAL'",
            "visual_contract:'ADMIN_CURRENT_ONLINE_RAIL_FULL_VISUAL_PARITY_CLIENT_SCOPE_V1'",
            "visual_source_mode:'ADMIN_OPERATIONAL_BODY_ADAPTER_ONLY'",
            "static_title_owner:'ADMIN_CURRENT_RAIL_ADAPTER'",
            "client_data_source:'/portal/api/v1/client/rail'",
            'TRUSTED_RAIL_EVIDENCE_READ_MODEL',
            'CLIENT_RAIL_CURRENT_ONLY_STYLE_REGRESSION_AFTER_EMIT'
          ])if(!attach.includes(marker))throw new Error('Client Rail build contract missing: '+marker);
          if(attach.includes('client-rail-canonical-hero-v1.js'))throw new Error('custom Client Rail hero still owns the visual surface');
          console.log('CLIENT_RAIL_ADMIN_PARITY_SOURCE=PASS');
          NODE

      - name: Build current Client and verify exact Admin visual ownership
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          grep -q 'id="rona-client-rail-admin-canonical-v1"' dist/portal/client.html
          grep -q '/portal/client-rail-current-ui?v=20260919-admin-parity-v2' dist/portal/client.html
          grep -q 'data-rona-client-rail-current-only="current-only-v2"' dist/portal/client.html
          grep -q 'id="rona-client-rail-current-only-v2-style"' dist/portal/client.html
          grep -q 'aria-label="Онлайн ЖД"' dist/portal/client.html
          test "$(grep -o 'client-rail-current-ui' dist/portal/client.html | wc -l | tr -d ' ')" = '1'
          ! grep -q 'client-rail-canonical-hero-v1.js' dist/portal/client.html
          ! grep -q 'client-rail-production-v1.js' dist/portal/client.html
          ! grep -q 'client-rail-movizor-gate-v1.js' dist/portal/client.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('dist/portal/client.html','utf8');
          const integrity=JSON.parse(fs.readFileSync('dist/canonical-visual-integrity.json','utf8'));
          const rail=integrity?.client_runtime?.rail_client_admin_canonical;
          if(!rail)throw new Error('Client Rail integrity missing');
          if(!['page-rail','page-monitoring'].includes(rail.static_host))throw new Error('unknown Client Rail host '+rail.static_host);
          if(rail.visual_canon!=='ADMIN_CURRENT_V81_CANONICAL')throw new Error('Client Rail is not owned by Admin visual canon');
          if(rail.visual_contract!=='ADMIN_CURRENT_ONLINE_RAIL_FULL_VISUAL_PARITY_CLIENT_SCOPE_V1')throw new Error('visual parity contract mismatch');
          if(rail.visual_source_mode!=='ADMIN_OPERATIONAL_BODY_ADAPTER_ONLY'||rail.static_title_owner!=='ADMIN_CURRENT_RAIL_ADAPTER')throw new Error('visual owner drift');
          if(rail.operational_body_canon!=='/portal/rail-current-v81-maplibre-ui')throw new Error('wrong Admin Rail operational body');
          if(rail.client_data_source!=='/portal/api/v1/client/rail'||rail.provider_state_source!==null)throw new Error('wrong Client Rail data authority');
          if(rail.static_legacy_dom_removed!==true||rail.runtime_replaces_legacy_page_dom!==false)throw new Error('legacy/current-only ownership drift');
          if(/client-rail-canonical-hero-v1\.js/.test(html))throw new Error('custom Client Rail hero emitted');
          console.log('CLIENT_RAIL_ADMIN_PARITY_BUILD=PASS host='+rail.static_host);
          NODE

      - name: Install Chrome browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Prove Client Rail functional parity, isolation and auto-discovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-client-online-rail-parity-668-browser.mjs
