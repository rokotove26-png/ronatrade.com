name: Deals production smoke 20260824

on:
  push:
    branches:
      - 'hotfix/deals-production-smoke-20260824'

permissions:
  contents: read
  statuses: write

jobs:
  deals-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify production Deals current-only runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            rm -f /tmp/deals-h.txt /tmp/deals.js /tmp/main-h.txt /tmp/main.js
            if curl --fail --silent --show-error --dump-header /tmp/deals-h.txt --output /tmp/deals.js "https://ronaoil.com/portal/deals-current-state-ui?smoke=20260824-$i" \
              && curl --fail --silent --show-error --dump-header /tmp/main-h.txt --output /tmp/main.js "https://ronaoil.com/portal/main-ui?smoke=20260824-$i" \
              && grep -qi '^x-rona-deals-ui: current-state-v1.2' /tmp/deals-h.txt \
              && grep -qi '^x-rona-deals-owner: current-only' /tmp/main-h.txt; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = '1'
          node --check /tmp/deals.js
          node --check /tmp/main.js
          grep -q 'Ожидают оплаты' /tmp/deals.js
          ! grep -q 'Ожидают оплаты или действий' /tmp/deals.js
          grep -q 'function waitsPayment' /tmp/deals.js
          ! grep -q 'function waitsAction' /tmp/deals.js
          grep -q "document.addEventListener('DOMContentLoaded',start,{once:true})" /tmp/deals.js
          grep -q 'new MutationObserver(mount)' /tmp/deals.js
          grep -q 'function renderDealsCurrentShell()' /tmp/main.js
          grep -q 'deals:renderDealsCurrentShell,' /tmp/main.js
          ! grep -q 'deals:renderDeals,' /tmp/main.js
          grep -q 'renderApplications();renderDealsCurrentShell();renderDocuments();' /tmp/main.js
          echo 'DEALS_PRODUCTION_CURRENT_ONLY_V12=PASS'
      - name: Publish production smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Deals production current-only v1.2 failed'
          if [ "$JOB_STATUS" = 'success' ]; then state=success; description='Deals production current-only v1.2 verified'; fi
          target="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/deals-production-smoke","description":"%s","target_url":"%s"}' "$state" "$description" "$target")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
