name: Deals production smoke 20260824

on:
  push:
    branches:
      - 'hotfix/deals-production-smoke-20260824'

permissions:
  contents: read
  statuses: write

jobs:
  deals-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production Deals runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header /tmp/headers.txt --output /tmp/deals.js 'https://ronaoil.com/portal/deals-current-state-ui?smoke=20260824'
          grep -qi '^x-rona-deals-ui: current-state-v1.1' /tmp/headers.txt
          grep -q 'Ожидают оплаты' /tmp/deals.js
          if grep -q 'Ожидают оплаты или действий' /tmp/deals.js; then
            echo 'legacy payment KPI label is still deployed' >&2
            exit 1
          fi
          grep -q 'function waitsPayment' /tmp/deals.js
          if grep -q 'function waitsAction' /tmp/deals.js; then
            echo 'legacy waitsAction runtime is still deployed' >&2
            exit 1
          fi
          echo 'DEALS_PRODUCTION_RUNTIME=PASS'
      - name: Publish production smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Deals production runtime smoke failed'
          if [ "$JOB_STATUS" = 'success' ]; then state=success; description='Deals production runtime current-state v1.1 verified'; fi
          target="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/deals-production-smoke","description":"%s","target_url":"%s"}' "$state" "$description" "$target")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
