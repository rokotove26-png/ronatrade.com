name: Client Home live runtime QA

on:
  push:
    branches: [release/public-go-live-v1.1]
  pull_request:
    branches: [release/public-go-live-v1.1]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  client-home-live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current public artifact
        run: npm run build
      - name: Verify emitted current-only contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {createHash}=require('crypto');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const html=fs.readFileSync('dist/portal/client.html','utf8');
          const runtime=fs.readFileSync('dist/assets/portal-runtime/client-home-current-only-v1.js','utf8');
          const src=html.match(/<script\b[^>]*id=["']rona-client-home-current-only-v1["'][^>]*src=["']([^"']+)["'][^>]*>/i)?.[1];
          const marker=runtime.match(/\bconst\s+MARK\s*=\s*(['"])([^'"]+)\1\s*;/)?.[2];
          assert(src,'emitted current-only runtime src missing');
          assert(marker,'current-only runtime marker missing');
          assert(/^\d{8}-client-home-current-only-v1-[a-z0-9-]+$/i.test(marker),'current-only marker format invalid: '+marker);
          const expected='/assets/portal-runtime/client-home-current-only-v1.js?v='+createHash('sha256').update(runtime).digest('hex').slice(0,16);
          assert(src===expected,'emitted current-only src is not content-addressed: '+src+' expected '+expected);
          assert(runtime.includes('ensureDegradedOwner'),'degraded owner contract missing');
          assert(runtime.includes("first_paint_guard:'RETAINED_REUSABLE'"),'reusable first-paint guard contract missing');
          assert(runtime.includes('PREPAINT_MAX_MS=5000'),'bounded guard timeout missing');
          assert(!runtime.includes('removeFirstPaintGuard'),'runtime must not remove reusable guard');
          assert(!runtime.includes('guard.remove()'),'runtime must retain reusable first-paint guard');
          console.log('CLIENT_HOME_EMITTED_RUNTIME=PASS');
          console.log(JSON.stringify({src,marker,contentAddressed:true,reusableGuardPresent:true}));
          NODE
      - name: Wait for exact production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify live Client Home runtime and fail-closed route
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const base='https://ronaoil.com';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const built=fs.readFileSync('dist/portal/client.html','utf8');
          const source=fs.readFileSync('dist/assets/portal-runtime/client-home-current-only-v1.js','utf8');
          const src=built.match(/<script\b[^>]*id=["']rona-client-home-current-only-v1["'][^>]*src=["']([^"']+)["'][^>]*>/i)?.[1];
          const marker=source.match(/\bconst\s+MARK\s*=\s*(['"])([^'"]+)\1\s*;/)?.[2];
          assert(src,'built current-only runtime src missing');
          assert(marker,'built current-only runtime marker missing');
          const assetPath=src+(src.includes('?')?'&':'?')+'_qa='+Date.now();
          const asset=await fetch(base+assetPath,{headers:{'cache-control':'no-cache'},redirect:'manual'});
          assert(asset.status===200,'live current-only runtime unavailable: '+asset.status);
          const text=await asset.text();
          assert(text.includes(marker),'live current-only marker missing: '+marker);
          assert(text.includes('ensureDegradedOwner'),'live degraded owner contract missing');
          assert(text.includes('data-rona-client-home-degraded'),'live degraded state marker missing');
          assert(text.includes("first_paint_guard:'RETAINED_REUSABLE'"),'live reusable first-paint guard contract missing');
          assert(text.includes('PREPAINT_MAX_MS=5000'),'live bounded guard timeout missing');
          assert(!text.includes('removeFirstPaintGuard'),'live runtime must not remove reusable guard');
          assert(!text.includes('guard.remove()'),'live runtime must retain reusable first-paint guard');
          const client=await fetch(base+'/portal/client?_qa='+Date.now(),{headers:{'cache-control':'no-cache'},redirect:'manual'});
          assert([302,303].includes(client.status),'unauthenticated Client route must redirect; got '+client.status);
          const location=client.headers.get('location')||'';
          assert(location.includes('/portal/login'),'Client route did not fail closed to login: '+location);
          console.log('CLIENT_HOME_LIVE_RUNTIME=PASS');
          console.log(JSON.stringify({assetStatus:asset.status,assetBytes:text.length,src,marker,degradedOwnerPresent:true,reusableGuardPresent:true,clientStatus:client.status,clientFailClosed:true}));
          NODE
