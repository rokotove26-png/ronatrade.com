name: Client Home live runtime QA

on:
  push:
    branches: [release/public-go-live-v1.1]
  pull_request:
    branches: [release/public-go-live-v1.1]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  client-home-live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current public artifact
        run: npm run build
      - name: Verify emitted current-only contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/assets/portal-runtime/client-home-current-only-v1.js?v=20260901-error-resilience-v2' dist/portal/client.html
          grep -Fq '20260901-client-home-current-only-v1-error-resilience-v2' dist/assets/portal-runtime/client-home-current-only-v1.js
          grep -Fq 'ensureDegradedOwner' dist/assets/portal-runtime/client-home-current-only-v1.js
          echo 'CLIENT_HOME_EMITTED_RUNTIME=PASS'
      - name: Wait for exact production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify live Client Home runtime and fail-closed route
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node <<'NODE'
          const base='https://ronaoil.com';
          const marker='20260901-client-home-current-only-v1-error-resilience-v2';
          const assetPath='/assets/portal-runtime/client-home-current-only-v1.js?v=20260901-error-resilience-v2&_qa='+Date.now();
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const asset=await fetch(base+assetPath,{headers:{'cache-control':'no-cache'},redirect:'manual'});
          assert(asset.status===200,'live current-only runtime unavailable: '+asset.status);
          const text=await asset.text();
          assert(text.includes(marker),'live current-only marker missing');
          assert(text.includes('ensureDegradedOwner'),'live degraded owner contract missing');
          assert(text.includes('data-rona-client-home-degraded'),'live degraded state marker missing');
          const client=await fetch(base+'/portal/client?_qa='+Date.now(),{headers:{'cache-control':'no-cache'},redirect:'manual'});
          assert(client.status===302,'unauthenticated Client route must redirect; got '+client.status);
          const location=client.headers.get('location')||'';
          assert(location.includes('/portal/login'),'Client route did not fail closed to login: '+location);
          console.log('CLIENT_HOME_LIVE_RUNTIME=PASS');
          console.log(JSON.stringify({assetStatus:asset.status,assetBytes:text.length,markerPresent:true,degradedOwnerPresent:true,clientStatus:client.status,clientFailClosed:true}));
          NODE
