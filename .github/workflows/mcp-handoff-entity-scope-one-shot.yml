name: One-shot MCP Handoff Entity Scope Hardening

on:
  push:
    branches:
      - fix/od-handoff-entity-schema-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/od-handoff-entity-schema-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Harden canonical handoff entity validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/rona-mcp-gateway/index.js')
          s=p.read_text()

          ai="const AI_ROLES=Object.freeze(['OPERATIONS_DIRECTOR','FINANCE','LEGAL','MARKET_ANALYST','COMMERCIAL_DIRECTOR','RAIL_LOGISTICS','SYSTEM_ADMIN']);"
          canonical="const CANONICAL_HANDOFF_ENTITY_TYPES=Object.freeze(['CLIENT','CONTRACT','APPLICATION','DEAL','DOCUMENT','PAYMENT','SHIPMENT','RAIL_DOCUMENT','PUBLICATION','TASK','SYSTEM']);"
          if canonical not in s:
              if s.count(ai) != 1:
                  raise SystemExit(f'AI_ROLES invariant expected once, got {s.count(ai)}')
              s=s.replace(ai, ai+'\n'+canonical, 1)

          old_schema="common.push({name:'handoff_request_submit',title:'Запрос межролевой проверки',description:'Создать audited handoff request другой фиксированной AI-роли. Не является распоряжением.',inputSchema:{type:'object',properties:{target_role:{type:'string',enum:AI_ROLES},entity_type:{type:'string'},entity_id:"
          new_schema="common.push({name:'handoff_request_submit',title:'Запрос межролевой проверки',description:'Создать audited handoff request другой фиксированной AI-роли. Не является распоряжением.',inputSchema:{type:'object',properties:{target_role:{type:'string',enum:AI_ROLES},entity_type:{type:'string',enum:CANONICAL_HANDOFF_ENTITY_TYPES},entity_id:"
          if new_schema not in s:
              if s.count(old_schema) != 1:
                  raise SystemExit(f'handoff schema invariant expected once, got {s.count(old_schema)}')
              s=s.replace(old_schema,new_schema,1)

          old_scope="if(!roleCanUseEntity(cfg.business_role,type)&&!roleCanUseEntity(targetRole,type))"
          new_scope="if(!roleCanUseEntity(cfg.business_role,type)||!roleCanUseEntity(targetRole,type))"
          if new_scope not in s:
              if s.count(old_scope) != 1:
                  raise SystemExit(f'handoff scope invariant expected once, got {s.count(old_scope)}')
              s=s.replace(old_scope,new_scope,1)

          if "SPECIFICATION" in canonical:
              raise SystemExit('SPECIFICATION must not be a canonical handoff entity')
          if 'SYSTEM_ADMIN_BUSINESS_HANDOFF_BLOCKED' not in s:
              raise SystemExit('system admin business handoff guard missing')
          if new_schema not in s or new_scope not in s or canonical not in s:
              raise SystemExit('post-patch invariant missing')
          if old_scope in s:
              raise SystemExit('permissive source-or-target scope rule still present')

          p.write_text(s)
          PY
          node --check supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "const CANONICAL_HANDOFF_ENTITY_TYPES=Object.freeze(['CLIENT','CONTRACT','APPLICATION','DEAL','DOCUMENT','PAYMENT','SHIPMENT','RAIL_DOCUMENT','PUBLICATION','TASK','SYSTEM']);" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "entity_type:{type:'string',enum:CANONICAL_HANDOFF_ENTITY_TYPES}" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "if(!roleCanUseEntity(cfg.business_role,type)||!roleCanUseEntity(targetRole,type))" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "SYSTEM_ADMIN_BUSINESS_HANDOFF_BLOCKED" supabase/functions/rona-mcp-gateway/index.js
      - name: Commit source patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/rona-mcp-gateway/index.js; then
            echo 'No source patch needed.'
            exit 0
          fi
          git config user.name 'RONA System Admin Automation'
          git config user.email 'system-admin@ronaoil.com'
          git add supabase/functions/rona-mcp-gateway/index.js
          git commit -m 'fix(mcp): harden handoff entity scope validation'
          git push origin HEAD:fix/od-handoff-entity-schema-20260902
