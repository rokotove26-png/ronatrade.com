name: MCP Operations Write Pilot QA

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  canonical-coordinate-source-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/ai-canonical-coordinate-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-only promotion on PR branch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p=Path('functions/_mcp_transport.js'); t=p.read_text()
          old="const COORDINATE_PILOTS=new Set(['operations-pilot','finance-pilot','legal-pilot','market-analyst-pilot','rail-logistics-pilot']);"
          new="const COORDINATE_SEGMENTS=new Set(['operations','operations-pilot','finance','finance-pilot','legal','legal-pilot','market-analyst','market-analyst-pilot','rail-logistics','rail-logistics-pilot']);"
          if old not in t: raise SystemExit('transport coordinate set pattern missing')
          p.write_text(t.replace(old,new).replace('COORDINATE_PILOTS','COORDINATE_SEGMENTS'))

          p=Path('supabase/functions/rona-mcp-gateway/index.js'); t=p.read_text()
          old="""const COORDINATE_PILOT_BINDINGS=Object.freeze({
  'rona-mcp-operations-pilot':['OPERATIONS_DIRECTOR','AI-OPERATIONS-DIRECTOR'],
  'rona-mcp-finance-pilot':['FINANCE','AI-FINANCE'],
  'rona-mcp-legal-pilot':['LEGAL','AI-LEGAL'],
  'rona-mcp-market-analyst-pilot':['MARKET_ANALYST','AI-MARKET-ANALYST'],
  'rona-mcp-rail-logistics-pilot':['RAIL_LOGISTICS','AI-RAIL-LOGISTICS'],
});"""
          new="""const COORDINATE_BINDINGS=Object.freeze({
  'rona-mcp-operations':['OPERATIONS_DIRECTOR','AI-OPERATIONS-DIRECTOR'],
  'rona-mcp-operations-pilot':['OPERATIONS_DIRECTOR','AI-OPERATIONS-DIRECTOR'],
  'rona-mcp-finance':['FINANCE','AI-FINANCE'],
  'rona-mcp-finance-pilot':['FINANCE','AI-FINANCE'],
  'rona-mcp-legal':['LEGAL','AI-LEGAL'],
  'rona-mcp-legal-pilot':['LEGAL','AI-LEGAL'],
  'rona-mcp-market-analyst':['MARKET_ANALYST','AI-MARKET-ANALYST'],
  'rona-mcp-market-analyst-pilot':['MARKET_ANALYST','AI-MARKET-ANALYST'],
  'rona-mcp-rail-logistics':['RAIL_LOGISTICS','AI-RAIL-LOGISTICS'],
  'rona-mcp-rail-logistics-pilot':['RAIL_LOGISTICS','AI-RAIL-LOGISTICS'],
});"""
          if old not in t: raise SystemExit('gateway coordinate binding block missing')
          p.write_text(t.replace(old,new).replace('COORDINATE_PILOT_BINDINGS','COORDINATE_BINDINGS').replace('coordinate scope is enabled only on fixed business-role pilot connectors','coordinate scope is enabled only on fixed business-role connectors'))

          p=Path('supabase/functions/rona-mcp-oauth-token/index.js'); t=p.read_text()
          old="const COORDINATE_PILOT_SLUGS=new Set(['rona-mcp-operations-pilot','rona-mcp-finance-pilot','rona-mcp-legal-pilot','rona-mcp-market-analyst-pilot','rona-mcp-rail-logistics-pilot']);"
          new="const COORDINATE_ALLOWED_SLUGS=new Set(['rona-mcp-operations','rona-mcp-operations-pilot','rona-mcp-finance','rona-mcp-finance-pilot','rona-mcp-legal','rona-mcp-legal-pilot','rona-mcp-market-analyst','rona-mcp-market-analyst-pilot','rona-mcp-rail-logistics','rona-mcp-rail-logistics-pilot']);"
          if old not in t: raise SystemExit('token coordinate set pattern missing')
          p.write_text(t.replace(old,new).replace('COORDINATE_PILOT_SLUGS','COORDINATE_ALLOWED_SLUGS').replace('coordinate scope is enabled only on fixed business-role pilot connectors','coordinate scope is enabled only on fixed business-role connectors'))

          gateway=Path('supabase/functions/rona-mcp-gateway/index.js').read_text()
          token=Path('supabase/functions/rona-mcp-oauth-token/index.js').read_text()
          transport=Path('functions/_mcp_transport.js').read_text()
          if "'rona-mcp-system-admin':['SYSTEM_ADMIN','AI-SYSTEM-ADMIN']" in gateway: raise SystemExit('SYSTEM_ADMIN coordinate binding detected')
          if "'system-admin'" in transport.split('COORDINATE_SEGMENTS=',1)[1].split(';',1)[0]: raise SystemExit('SYSTEM_ADMIN public coordinate discovery detected')
          if "'rona-mcp-system-admin'" in token.split('COORDINATE_ALLOWED_SLUGS=',1)[1].split(';',1)[0]: raise SystemExit('SYSTEM_ADMIN token coordinate allowance detected')
          print('CANONICAL_COORDINATE_SOURCE_PATCH=PASS')
          PY
          git diff --check
          if ! git diff --quiet -- portal-src portal-src/canonical functions/portal; then echo PORTAL_UI_DRIFT_DETECTED; exit 1; fi
          node --check functions/_mcp_transport.js
          node --check supabase/functions/rona-mcp-gateway/index.js
          node --check supabase/functions/rona-mcp-oauth-token/index.js
      - name: Commit source-only patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RONA System Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/_mcp_transport.js supabase/functions/rona-mcp-gateway/index.js supabase/functions/rona-mcp-oauth-token/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'MCP: promote canonical business roles to controlled coordinate scope'
          git push origin HEAD:production/ai-canonical-coordinate-20260819
