name: MCP Operations Write Pilot QA

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  pilot-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static pilot isolation invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_mcp_transport.js
          node --check functions/_mcp_role_entry.js
          node --check functions/_mcp_consent_bridge.js
          node --check functions/_mcp_oauth_token_bridge.js
          node --check 'functions/operations-pilot/[[path]].js'
          node --check 'functions/.well-known/[[path]].js'
          node --check supabase/functions/rona-mcp-gateway/index.js
          node --check supabase/functions/rona-mcp-oauth-token/index.js
          node --check supabase/functions/rona-mcp-consent-bridge/index.js
          grep -q "handleWellKnown" 'functions/.well-known/[[path]].js'
          grep -Fq "'rona-mcp-operations-pilot':['OPERATIONS_DIRECTOR','AI-OPERATIONS-DIRECTOR']" supabase/functions/rona-mcp-gateway/index.js
          grep -q "coordinationEnabled(cfg)" supabase/functions/rona-mcp-gateway/index.js
          grep -q "COORDINATION_SERVER_NOT_ENABLED" supabase/functions/rona-mcp-gateway/index.js
          grep -q "operations-pilot" functions/_mcp_transport.js
          grep -q '"/operations-pilot/\*"' _routes.json
          grep -Fq "COORDINATE_PILOT_BINDINGS[slug]?['mcp:read','mcp:coordinate','offline_access']:['mcp:read','offline_access']" supabase/functions/rona-mcp-gateway/index.js
          grep -q "mcp_gateway_config_coordinate_pilot_binding_check" supabase/migrations/20260818202500_all_business_role_coordinate_pilots.sql
          test "$(grep -o "name:'functional_conclusion_submit'\|name:'task_acknowledge'\|name:'task_progress_submit'\|name:'handoff_request_submit'\|name:'business_change_proposal_submit'\|name:'operations_internal_decision'" supabase/functions/rona-mcp-gateway/index.js | sort -u | wc -l)" = '6'
          if grep -Eq "name:'(deal_status_write|payment_status_write|accounting_close|shipment_fact_create|rail_movement_fact_create|publication_publish|contract_mutate|document_mutate|client_binding_mutate)'" supabase/functions/rona-mcp-gateway/index.js; then exit 1; fi
          echo PILOT_SOURCE_ISOLATION=PASS
      - name: Wait for this commit in Cloudflare production
        if: github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<120;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-OPERATIONS-PILOT-QA'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare deployment '+cf.conclusion);await sleep(5000);console.log('PILOT_CLOUDFLARE_DEPLOYMENT=PASS');return}}await sleep(3000)}throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Public pilot discovery and primary read-only regression
        if: github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          set -euo pipefail
          p=$(curl -fsS https://ronaoil.com/.well-known/oauth-protected-resource/operations-pilot/mcp)
          a=$(curl -fsS https://ronaoil.com/.well-known/oauth-authorization-server/operations-pilot)
          echo "$p" | grep -q 'https://ronaoil.com/operations-pilot/mcp'
          echo "$p" | grep -q 'mcp:coordinate'
          echo "$a" | grep -q 'refresh_token'
          echo "$a" | grep -q 'S256'
          for seg in operations finance legal market-analyst rail-logistics system-admin; do
            m=$(curl -fsS "https://ronaoil.com/.well-known/oauth-protected-resource/$seg/mcp")
            echo "$m" | grep -q 'mcp:read'
            if echo "$m" | grep -q 'mcp:coordinate'; then echo "$seg coordinate scope regression"; exit 1; fi
          done
          code=$(curl -sS -o /tmp/pilot.mcp -D /tmp/pilot.headers -w '%{http_code}' -X POST https://ronaoil.com/operations-pilot/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"RONA QA","version":"1"}}}')
          test "$code" = '401'
          grep -Fqi 'oauth-protected-resource/operations-pilot/mcp' /tmp/pilot.headers
          grep -Fqi 'mcp:read mcp:coordinate' /tmp/pilot.headers
          echo PILOT_PUBLIC_DISCOVERY=PASS
