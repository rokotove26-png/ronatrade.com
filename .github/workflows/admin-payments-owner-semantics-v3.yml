name: Admin Payments Owner Semantics V3 QA

on:
  push:
    branches: [feat/admin-payments-owner-semantics-v3]
    paths:
      - 'functions/portal/main-ui/**'
      - 'functions/portal/owner-payments-semantics-v3-source.js'
      - 'supabase/functions/rona-owner-ai-sync/**'
      - 'scripts/qa-owner-payments-semantics-v3-source.mjs'
      - 'scripts/qa-admin-payments-owner-semantics-v3.mjs'
      - '.github/workflows/admin-payments-owner-semantics-v3.yml'
  pull_request:
    branches: [feat/admin-payments-final-owner-screen-passport-v1]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write

jobs:
  owner-payments-semantics-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      RONA_ADMIN_SESSION_SECRET: ${{ secrets.RONA_ADMIN_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current Admin
        run: npm run build
      - name: Owner Payments V3 source contract
        run: node scripts/qa-owner-payments-semantics-v3-source.mjs | tee owner-payments-v3-source.log
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve immutable exact-head Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const token=process.env.GH_TOKEN,head=process.env.EXPECTED_HEAD,repo=process.env.GITHUB_REPOSITORY;
          const headers={accept:'application/vnd.github+json',authorization:`Bearer ${token}`,'x-github-api-version':'2022-11-28'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));let check=null;
          for(let i=0;i<120;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${head}/check-runs?per_page=100`,{headers});
            if(!r.ok)throw new Error(`CHECK_RUNS_HTTP_${r.status}`);
            const body=await r.json(),runs=Array.isArray(body?.check_runs)?body.check_runs:[];
            check=runs.find(x=>x?.name==='Cloudflare Pages'&&x?.head_sha===head&&x?.status==='completed'&&x?.conclusion==='success'&&x?.app?.slug==='cloudflare-workers-and-pages')||null;
            if(check)break;
            const failed=runs.find(x=>x?.name==='Cloudflare Pages'&&x?.head_sha===head&&x?.status==='completed'&&x?.conclusion&&x.conclusion!=='success');
            if(failed)throw new Error(`CLOUDFLARE_PREVIEW_${failed.conclusion}`);
            await sleep(5000);
          }
          if(!check)throw new Error('CLOUDFLARE_PREVIEW_TIMEOUT');
          const urls=[...new Set([...String(check?.output?.summary||'').matchAll(/https:\/\/[0-9a-f]{8}\.rona-trade-public\.pages\.dev/ig)].map(m=>m[0].toLowerCase()))];
          let origin=urls.length===1?urls[0]:'';const external=String(check?.external_id||'').trim().toLowerCase();
          if(!origin&&/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(external))origin=`https://${external.slice(0,8)}.rona-trade-public.pages.dev`;
          if(!/^https:\/\/[0-9a-f]{8}\.rona-trade-public\.pages\.dev$/i.test(origin))throw new Error(`IMMUTABLE_ORIGIN_INVALID_${origin}`);
          await appendFile(process.env.GITHUB_ENV,`TARGET_ORIGIN=${origin}\nCLOUDFLARE_CHECK_RUN_ID=${check.id}\n`);
          console.log(`OWNER_PAYMENTS_V3_IMMUTABLE_PREVIEW=${origin}`);console.log(`OWNER_PAYMENTS_V3_CLOUDFLARE_CHECK_RUN_ID=${check.id}`);
          NODE
      - name: Exact-head authenticated Owner Payments V3 browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/admin-payments-owner-semantics-v3
          node scripts/qa-admin-payments-owner-semantics-v3.mjs 2>&1 | tee artifacts/admin-payments-owner-semantics-v3/browser-qa.log
          cat owner-payments-v3-source.log >> artifacts/admin-payments-owner-semantics-v3/browser-qa.log
          for marker in \
            EXPECTED_RECEIPTS_DYNAMIC \
            GAZONE_EXPECTED_RECEIPT_FROM_FINANCE \
            RECEIVED_NOT_EQUAL_SPENT \
            CLIENT_PAYMENT_ALLOCATION_LABEL_CORRECT \
            DEAL_ACTUAL_SPEND_SEPARATE \
            DEAL_SPEND_SOURCE_LOCKED \
            DEAL_SPEND_BY_NATIVE_CURRENCY \
            NO_SYNTHETIC_FX \
            NO_DOUBLE_COUNT_FX_CONVERSION \
            NO_FALSE_SOURCE_USE_TRACE \
            MARGIN_NOT_FORCED_TO_ZERO \
            PAYMENT_PASSPORT_REMAINS_PAYMENT_CENTRIC \
            NO_HARDCODED_GAZONE \
            NO_DUPLICATES \
            NO_RUNTIME_ERRORS; do
            grep -Fq "${marker}=PASS" artifacts/admin-payments-owner-semantics-v3/browser-qa.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-payments-owner-semantics-v3-proof-${{ github.run_id }}
          path: artifacts/admin-payments-owner-semantics-v3/
          if-no-files-found: warn
          retention-days: 30
