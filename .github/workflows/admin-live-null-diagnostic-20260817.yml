name: Temporary Admin live null diagnostic

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-live-compat-20260817'

permissions:
  contents: read
  checks: read
  actions: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve preview and session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<80;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-ADMIN-NULL-DIAG'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');const m=String(cf?.output?.summary||'').match(/https:\/\/[a-z0-9-]+\.rona-trade-public\.pages\.dev/i);if(m){fs.appendFileSync(process.env.GITHUB_ENV,`TARGET_ORIGIN=${m[0]}\n`);return}}await sleep(5000)}throw new Error('preview unavailable')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl --fail --silent --show-error --request POST \
            'https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "x-github-repository: ${GITHUB_REPOSITORY}" \
            --header "x-github-sha: ${GITHUB_SHA}" \
            --header "x-github-ref: ${GITHUB_REF}" \
            --header "x-github-run-id: ${GITHUB_RUN_ID}" \
            --output /tmp/session.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));if(!j.ok)throw new Error(JSON.stringify(j));console.log('::add-mask::'+j.session.access_token);console.log('::add-mask::'+j.session.refresh_token);fs.appendFileSync(process.env.GITHUB_ENV,`AT<<EOF\n${j.session.access_token}\nEOF\nRT<<EOF\n${j.session.refresh_token}\nEOF\n`);
          NODE
          rm -f /tmp/session.json
      - name: Trace Admin page errors by navigation
        env:
          AT: ${{ env.AT }}
          RT: ${{ env.RT }}
          TARGET_ORIGIN: ${{ env.TARGET_ORIGIN }}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),h=new URL(process.env.TARGET_ORIGIN).hostname,c=await b.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await c.addCookies([{name:'rona_portal_at',value:process.env.AT,domain:h,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:process.env.RT,domain:h,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);const p=await c.newPage();let current='boot';const events=[];p.on('pageerror',e=>events.push({at:current,type:'pageerror',message:String(e.message||e),stack:String(e.stack||'')}));p.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com/.test(m.text()))events.push({at:current,type:'console',message:m.text()})});await p.goto(process.env.TARGET_ORIGIN+'/portal/admin?_diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});for(let i=0;i<400&&!await p.evaluate(()=>window.__RONA_ADMIN_LIVE_READY__===true);i++)await p.waitForTimeout(100);console.log('RUNTIME='+JSON.stringify(await p.evaluate(()=>({live:window.__RONA_ADMIN_LIVE_READY__,legacyDisabled:window.__RONA_ADMIN_LEGACY_SNAPSHOT_RENDER_DISABLED__,renderPage:String(window.renderPage).slice(0,200),clock:!!document.querySelector('#clock'),calendar:!!document.querySelector('#calendar')}))));const nav=await p.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));for(const x of nav){current=x;await p.locator(`#nav button[data-page="${x}"]`).click();await p.waitForTimeout(180);console.log('NAV='+x+' STATE='+JSON.stringify(await p.evaluate(x=>({active:document.getElementById('page-'+x)?.classList.contains('active'),live:document.getElementById('page-'+x)?.dataset.ronaLiveAuthority||null}),x)))}await p.waitForTimeout(1800);console.log('ADMIN_NULL_EVENTS='+JSON.stringify(events));if(events.length)process.exitCode=2;await c.close();await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Clean secrets
        if: always()
        run: |
          unset AT RT || true
          rm -f /tmp/session.json || true
