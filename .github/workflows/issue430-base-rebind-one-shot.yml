name: issue430 base rebind one-shot

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    types: [synchronize]

permissions:
  contents: write

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'corrective/issue430-owner-uat-resource-metrics-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrective/issue430-owner-uat-resource-metrics-v2
          fetch-depth: 0
      - name: Replace only stale issue430 corrective production base binding
        shell: bash
        run: |
          set -euo pipefail
          old='0f85c0455e2df319fed49b1a84016929a905e025'
          new='77588541119bb1a96375beed3e853e067ab1422f'
          file='.github/workflows/issue430-resource-company-corrective-qa.yml'
          grep -F "$old" "$file"
          sed -i "s/$old/$new/g" "$file"
          grep -F "$new" "$file"
          if grep -F "$old" "$file"; then exit 1; fi
          rm .github/workflows/issue430-base-rebind-one-shot.yml
          git diff --exit-code -- . ':!.github/workflows/issue430-resource-company-corrective-qa.yml' ':!.github/workflows/issue430-base-rebind-one-shot.yml'
          git config user.name 'RONA issue430 QA rebind'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/issue430-resource-company-corrective-qa.yml .github/workflows/issue430-base-rebind-one-shot.yml
          git commit -m 'ci(issue430): rebind corrective gate to current production base'
          echo "ISSUE430_REBIND_LOCAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:corrective/issue430-owner-uat-resource-metrics-v2
