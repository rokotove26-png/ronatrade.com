name: Remaining Sections single-owner source contract v6
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'portal-src/current/admin.html'
      - 'assets/portal-admin-shell-fast-v1.js'
      - 'assets/portal-admin-runtime-watchdog-v1.js'
      - 'functions/portal/clients-agents-current-ui.js'
      - 'functions/portal/remaining-sections-ui.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/analytics-v2-ui.js'
      - '.github/workflows/remaining-sections-owner-v3-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'portal-src/current/admin.html'
      - 'assets/portal-admin-shell-fast-v1.js'
      - 'assets/portal-admin-runtime-watchdog-v1.js'
      - 'functions/portal/clients-agents-current-ui.js'
      - 'functions/portal/remaining-sections-ui.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/analytics-v2-ui.js'
      - '.github/workflows/remaining-sections-owner-v3-qa.yml'
permissions:
  contents: read
jobs:
  remaining-sections-functional-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verified current-only Admin shell and source-level retired writers
        run: |
          set -euo pipefail
          node --check assets/portal-admin-shell-fast-v1.js
          node --check assets/portal-admin-runtime-watchdog-v1.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check functions/portal/admin-main-ui-current.js
          node tests/admin-current-only-shell-contract.test.mjs
          node scripts/qa-admin-single-owner.mjs
          node --test tests/analytics-v6-single-owner-retirement.test.mjs
          grep -q 'data-page="analytics"' portal-src/current/admin.html
          grep -q 'data-page="market-news"' portal-src/current/admin.html
          grep -q 'Радиорубка' portal-src/current/admin.html
          ! grep -q 'data-page="claims"' portal-src/current/admin.html
          grep -q '/portal/remaining-sections-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js
          ! grep -q 'rona-admin-approved-analytics-v455-loader' portal-src/current/admin.html
          test ! -e functions/portal/admin-approved-analytics-v455-ui.js
      - name: Verify served Radio and News do not revive old Analytics owner
        run: |
          node --input-type=module <<'NODE'
          import {onRequest as remainingRequest} from './functions/portal/remaining-sections-ui.js';
          import {onRequest as mainRequest} from './functions/portal/admin-main-ui-current.js';
          const remaining=await remainingRequest({});
          if(remaining.status!==200)throw new Error('REMAINING_ENDPOINT_INVALID');
          const source=await remaining.text();
          new Function(source);
          for(const token of ['renderRadio','Радиорубка','__RONA_MARKET_NEWS_OWNER_GUARD_V6__'])
            if(!source.includes(token))throw new Error('REMAINING_CURRENT_REQUIRED_'+token);
          for(const token of ['function renderAnalytics(){',"replacePage('analytics'",'function renderNews(){','function renderRewards(){'])
            if(source.includes(token))throw new Error('REMAINING_OLD_WRITER_RESURRECTED_'+token);
          const main=await mainRequest({});
          if(main.status!==200)throw new Error('MAIN_ENDPOINT_INVALID');
          const rendered=await main.text();
          new Function(rendered);
          if(!rendered.includes('__RONA_ADMIN_ANALYTICS_LEGACY_OWNER_RETIRED__'))
            throw new Error('V6_ADMIN_OWNER_RETIREMENT_MISSING');
          if(rendered.includes('analytics:renderAnalytics')||rendered.includes("replacePage('analytics'"))
            throw new Error('ADMIN_MAIN_OLD_ANALYTICS_OWNER_ACTIVE');
          console.log('REMAINING_SECTIONS_CURRENT_SINGLE_OWNER_V6=PASS');
          NODE
