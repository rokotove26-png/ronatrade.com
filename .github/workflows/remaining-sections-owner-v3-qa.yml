name: Remaining Sections Owner v3 QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
    paths:
      - 'portal-src/current/admin.html'
      - 'assets/portal-admin-shell-fast-v1.js'
      - 'functions/portal/clients-agents-current-ui.js'
      - 'functions/portal/remaining-sections-ui.js'
      - 'functions/portal/remaining-sections-final-polish-ui.js'
      - 'functions/portal/remaining-sections-functional-preserve-v2-ui.js'
      - 'functions/portal/analytics-v2-ui.js'
      - '.github/workflows/remaining-sections-owner-v3-qa.yml'

jobs:
  remaining-sections-functional-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current-only remaining-section owners
        run: |
          set -euo pipefail
          node --check assets/portal-admin-shell-fast-v1.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check functions/portal/remaining-sections-final-polish-ui.js
          node --check functions/portal/remaining-sections-functional-preserve-v2-ui.js
          node --check functions/portal/analytics-v2-ui.js

          grep -q 'data-rona-admin-shell="current-only-v1"' portal-src/current/admin.html
          grep -q 'clients-agents-current-ui' portal-src/current/admin.html
          grep -q "__RONA_CLIENTS_AGENTS_V4__='retired-by-current-only-v1'" portal-src/current/admin.html

          grep -q '/portal/remaining-sections-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/remaining-sections-final-polish-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/remaining-sections-functional-preserve-v2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js

          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260826-current-only-v1'" functions/portal/clients-agents-current-ui.js
          grep -q "AUTH='/portal/admin-authority'" functions/portal/clients-agents-current-ui.js
          ! grep -q 'harvestLegacy' functions/portal/clients-agents-current-ui.js
          ! grep -q 'window.openModal' functions/portal/clients-agents-current-ui.js
          grep -q 'Клиенты и агенты' functions/portal/clients-agents-current-ui.js
          grep -q 'Пользователи и доступы' functions/portal/clients-agents-current-ui.js
          grep -q 'Вознаграждения агентов' portal-src/current/admin.html
          grep -q 'Радиорубка' portal-src/current/admin.html
          grep -q 'Новости топливного рынка СНГ' portal-src/current/admin.html
          grep -q 'Аналитика' portal-src/current/admin.html

          node --input-type=module <<'NODE'
          import { onRequest as accessRequest } from './functions/portal/clients-agents-current-ui.js';
          import { onRequest as analyticsRequest } from './functions/portal/analytics-v2-ui.js';
          const access=await accessRequest({});
          if(access.status!==200)throw new Error('access endpoint '+access.status);
          const accessSrc=await access.text();
          for(const marker of [
            "__RONA_CLIENTS_AGENTS_CURRENT__='20260826-current-only-v1'",
            "AUTH='/portal/admin-authority'",
            'Клиенты и агенты',
            'Пользователи и доступы',
            "window.__RONA_CLIENTS_AGENTS_V4_READY__=true"
          ])if(!accessSrc.includes(marker))throw new Error('access missing '+marker);
          for(const legacy of ['harvestLegacy','window.openModal'])if(accessSrc.includes(legacy))throw new Error('legacy access dependency '+legacy);
          if(access.headers.get('x-rona-clients-agents-ui')!=='current-only-v1')throw new Error('wrong access owner header');

          const analytics=await analyticsRequest({});
          if(analytics.status!==200)throw new Error('analytics endpoint '+analytics.status);
          const analyticsSrc=await analytics.text();
          for(const marker of ['Аналитика','Argus European Products','BNK Diesel Composite'])if(!analyticsSrc.includes(marker))throw new Error('analytics missing '+marker);
          console.log('REMAINING_SECTIONS_CURRENT_ONLY=PASS');
          NODE
