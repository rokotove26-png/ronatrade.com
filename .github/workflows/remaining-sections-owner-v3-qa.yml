name: remaining-sections-owner-v3-qa

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin.js'
      - 'functions/portal/remaining-sections-owner-v3-ui.js'
      - '.github/workflows/remaining-sections-owner-v3-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin.js'
      - 'functions/portal/remaining-sections-owner-v3-ui.js'
      - '.github/workflows/remaining-sections-owner-v3-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  remaining-sections-current-owned:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static syntax and loader contract
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/remaining-sections-owner-v3-ui.js
          grep -q 'rona-remaining-owner-v3-loader' functions/portal/admin.js
          grep -q 'current-owned-v3' functions/portal/admin.js
          grep -q '__RONA_RENDER_REMAINING_PAGE__' functions/portal/remaining-sections-owner-v3-ui.js
          grep -q 'AI-MARKET-ANALYST' functions/portal/remaining-sections-owner-v3-ui.js
          grep -q 'Клиенты и агенты' functions/portal/remaining-sections-owner-v3-ui.js
          grep -q 'Новости топливного рынка СНГ' functions/portal/remaining-sections-owner-v3-ui.js
      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          google-chrome --version
      - name: Prove current renderer with synthetic Owner DOM
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { onRequest } from './functions/portal/remaining-sections-owner-v3-ui.js';
          const script=await (await onRequest()).text();
          if(!script.includes('__RONA_RENDER_REMAINING_PAGE__'))throw new Error('renderer hook missing');
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          const ctx=await browser.newContext({viewport:{width:1600,height:1000}});
          const page=await ctx.newPage();
          await page.setContent(`<!doctype html><html><head></head><body>
            <nav id="nav">
              <button data-page="clients-x">Клиенты и агенты</button>
              <button data-page="radio-x">Радиорубка</button>
              <button class="active" data-page="analytics-x">Аналитика</button>
              <button data-page="news-x">Новости топливного рынка СНГ</button>
            </nav>
            <main>
              <section id="page-clients-x"><div id="legacy-clients">LEGACY CLIENTS</div></section>
              <section id="page-radio-x"><div id="radio-original">RADIO KEEP</div></section>
              <section id="page-analytics-x"><div id="legacy-analytics">LEGACY ANALYTICS EMPTY</div></section>
              <section id="page-news-x"><div id="legacy-news">LEGACY NEWS EMPTY</div></section>
            </main>
          </body></html>`);
          await page.evaluate(()=>{
            window.__RONA_OWNER_ADMIN_READY__=true;
            window.__RONA_OWNER_ADMIN_SNAPSHOT__={
              clients:[{legal_name:'Client One',client_id:'C001',contract_id:'RONA-C001-CTR-2026-001',current_external_contract_number:'EXT-1',agent_person_id:'A1',agent_name:'Agent One'}],
              agents:[{agent_person_id:'A1',agent_name:'Agent One'}]
            };
            const market={
              generatedAt:'2026-08-24T12:00:00Z',
              currentOnly:true,
              identity:{identity_id:'AI-MARKET-ANALYST',display_name:'Коммерческий директор',status:'ACTIVE'},
              analytics:[{record_id:'AN-1',status:'APPROVED_WITH_CONDITIONS',summary:'MARKET_FACT: Platts current gasoline market signal. MARKET_FORECAST: September remains tight.',created_at:'2026-08-24T11:00:00Z',source_refs:['PLATTS_EUROPEAN_MARKETSCAN_2026-08-21']}],
              news:[{record_id:'NW-1',subject:'Telegram delta 24.08 — Hairatan gasoline spike + Khafi source conflict',priority:'HIGH',requested_check:'MARKET_FACT current field signal from Hairatan and Khafi.',created_at:'2026-08-24T11:08:50Z',source_refs:['https://t.me/s/hairatanbazar','https://t.me/s/khafipetroleum/42455']}],
              currentPublications:[{publication_id:'RONA-PRICE-LIST-2026-09-R2',title:'ПРАЙС-ЛИСТ RONA TRADE НА СЕНТЯБРЬ 2026 — РЕДАКЦИЯ 2',published_at:'2026-08-24T10:40:54Z',items:[{product:'АИ-92 К5',basis:'CPT Сарыагаш',price:1332.1,currency:'USD'}]}]
            };
            window.fetch=async url=>{
              const u=String(url);
              if(u.includes('%2Fadmin%2Fai-sync')||u.includes('/admin/ai-sync'))return new Response(JSON.stringify({ok:true,data:{marketAnalystFragment:market}}),{status:200,headers:{'content-type':'application/json'}});
              if(u.includes('%2Fadmin%2Fbootstrap')||u.includes('/admin/bootstrap'))return new Response(JSON.stringify({ok:true,data:window.__RONA_OWNER_ADMIN_SNAPSHOT__}),{status:200,headers:{'content-type':'application/json'}});
              throw new Error('unexpected fetch '+u);
            };
          });
          const radioBefore=await page.locator('#page-radio-x').innerHTML();
          await page.addScriptTag({content:script});
          await page.waitForFunction(()=>window.__RONA_REMAINING_OWNER_V3_READY__);
          await page.waitForFunction(()=>document.querySelector('#page-analytics-x')?.textContent?.includes('MARKET_FACT'));
          const analytics=await page.locator('#page-analytics-x').innerText();
          if(!analytics.includes('Коммерческий директор')||!analytics.includes('Platts'))throw new Error('analytics current data missing');
          await page.locator('#nav button[data-page="news-x"]').click();
          await page.waitForFunction(()=>document.querySelector('#page-news-x')?.textContent?.includes('Hairatan gasoline spike'));
          const news=await page.locator('#page-news-x').innerText();
          if(!news.includes('AI-MARKET-ANALYST')||!news.includes('Khafi'))throw new Error('news current data missing');
          await page.locator('#nav button[data-page="clients-x"]').click();
          await page.waitForFunction(()=>document.querySelector('#page-clients-x')?.textContent?.includes('Client One'));
          const clientDisplay=await page.locator('#legacy-clients').evaluate(el=>getComputedStyle(el).display);
          if(clientDisplay!=='none')throw new Error('legacy clients still visible');
          const radioAfter=await page.locator('#page-radio-x').innerHTML();
          if(radioAfter!==radioBefore)throw new Error('radio section was modified');
          const rootWidth=await page.locator('#page-clients-x .rona-rs-root').evaluate(el=>getComputedStyle(el).maxWidth);
          if(rootWidth!=='1360px')throw new Error('clients width contract failed '+rootWidth);
          console.log('REMAINING_SECTIONS_OWNER_V3=PASS');
          await ctx.close();await browser.close();
          NODE
      - name: Production endpoint proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            headers=$(mktemp); body=$(mktemp)
            if curl -fsS -D "$headers" -o "$body" "https://ronaoil.com/portal/remaining-sections-owner-v3-ui?v=${GITHUB_SHA}"; then
              if grep -qi '^x-rona-remaining-owner: current-owned-v3' "$headers" && grep -q '__RONA_RENDER_REMAINING_PAGE__' "$body"; then ok=1; rm -f "$headers" "$body"; break; fi
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          test "$ok" = 1
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; description='Remaining sections current renderer failed'
          if [ "$JOB_STATUS" = success ]; then state=success; description='Clients and Market sections current-owned renderer PASS'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"rona/remaining-sections-current-owned\",\"description\":\"${description}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
