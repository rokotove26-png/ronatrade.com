name: Final production verification
on:
  push:
    branches: ['hotfix/admin-interactivity-final-verification-20260817']
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Full production verification
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const base='https://ronaoil.com',repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const adminPages=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'];
          const agentPages=['home','clients','prices','deals','economics','settlements','documents','messages'];
          const staffViews=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];
          const qaSubject='QA_FINAL_AGENT_MESSAGE_20260817';
          function A(x,m){if(!x)throw new Error(m)}
          async function wait(p,fn,label,n=300){for(let i=0;i<n;i++){if(await p.evaluate(fn))return;await p.waitForTimeout(100)}throw new Error(label+' timeout')}
          async function session(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();if(!r.ok||!j.ok)throw new Error('broker '+JSON.stringify({status:r.status,code:j.code,proof:j.proof}));return j.session}
          async function C(b,s){const c=await b.newContext({viewport:{width:1920,height:1080}});await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          async function inv(p){return p.evaluate(()=>{const o={FUNCTIONAL:0,READ_ONLY:0,UNWIRED:0};for(const e of document.querySelectorAll('button,a,input,select,textarea,form')){const r=e.getBoundingClientRect(),s=getComputedStyle(e);if(s.display==='none'||s.visibility==='hidden'||r.width===0||r.height===0)continue;const st=e.dataset.ronaControlStatus;if(st==='FUNCTIONAL'){o.FUNCTIONAL++;continue}if(st==='INTENTIONALLY_READ_ONLY_BY_AUTHORITY'||e.disabled||e.getAttribute('aria-disabled')==='true'){o.READ_ONLY++;continue}const tag=e.tagName;const f=(tag==='A'&&!!e.getAttribute('href'))||tag==='FORM'||['INPUT','SELECT','TEXTAREA'].includes(tag)||(tag==='BUTTON'&&(!!e.dataset.page||!!e.dataset.view||!!e.id||e.type==='submit'||!!e.getAttribute('onclick')));if(f)o.FUNCTIONAL++;else o.UNWIRED++}return o})}
          function sum(a,b){a.FUNCTIONAL+=b.FUNCTIONAL;a.READ_ONLY+=b.READ_ONLY;a.UNWIRED+=b.UNWIRED;return a}
          (async()=>{
            const b=await chromium.launch({headless:true}),s=await session(),c=await C(b,s);
            const adm=await c.newPage(),ae=[];adm.on('pageerror',e=>ae.push(String(e.message||e)));adm.on('console',m=>{if(m.type()==='error'&&!/cloudflareinsights/.test(m.text()))ae.push(m.text())});await adm.goto(base+'/portal/admin?_final='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await wait(adm,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin live');const live=await adm.evaluate(()=>window.__RONA_ADMIN_LIVE__);const a=live.admin;const counts={clients:a.clients.length,contracts:a.contracts.length,deals:a.deals.length,documents:a.documents.length,payments:a.payments.length,shipments:a.shipments.length,rail:a.rail.length,publications:a.publications.length,controls:a.controls.length};A(JSON.stringify(counts)===JSON.stringify({clients:3,contracts:2,deals:4,documents:14,payments:1,shipments:0,rail:1,publications:17,controls:12}),'counts '+JSON.stringify(counts));const d4=a.deals.find(x=>x.deal_id==='DEAL-2026-004');A(d4?.business_status==='EXECUTING'&&d4.finance_status==='PAID'&&d4.accounting_closure_status==='OPEN','deal004');A(a.shipments.length===0,'shipment');A(a.rail.some(x=>String(x.gu12_number)==='1308903120'),'gu12');const cc=new Set(a.controls.map(x=>x.control_type));A(cc.has('PAYMENT_ACCOUNTING_OPEN')&&cc.has('RAIL_SHIPMENT_AUTHORITY_MISSING'),'controls');const nav=await adm.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));A(JSON.stringify(nav)===JSON.stringify(adminPages),'admin nav');let ai={FUNCTIONAL:0,READ_ONLY:0,UNWIRED:0};for(const x of nav){await adm.locator(`#nav button[data-page="${x}"]`).click();await adm.waitForTimeout(80);const st=await adm.locator('#page-'+x).evaluate(e=>({active:e.classList.contains('active'),live:e.dataset.ronaLiveAuthority==='true'}));A(st.active,x+' inactive');if(x!=='access')A(st.live,x+' not live');sum(ai,await inv(adm))}A(ai.UNWIRED===0,'admin unwired '+JSON.stringify(ai));await adm.locator('#nav button[data-page="documents"]').click();const dr=adm.locator('[data-rona-live-document]').first();A(await dr.count()===1,'doc row');await dr.click();await adm.waitForTimeout(150);A(/Document ID/.test(await adm.locator('body').innerText()),'doc detail');A(ae.length===0,'admin JS '+JSON.stringify(ae.slice(0,3)));

            const agApi=await c.request.get(base+'/portal/api/v1/agent/bootstrap'),agj=await agApi.json();A(agApi.ok()&&agj.data?.agentPersonId==='AGP-2026-001','agent bootstrap');const deals=(agj.data.deals||[]).map(x=>x.dealId).sort();A(JSON.stringify(deals)===JSON.stringify(['DEAL-2026-004','DEAL-2026-005','DEAL-2026-006']),'agent scope');A((await c.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'agent IDOR');A((await c.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-004')).ok(),'agent allowed');const ag=await c.newPage(),ge=[];ag.on('pageerror',e=>ge.push(String(e.message||e)));for(let n=0;n<90;n++){await ag.goto(base+'/portal/agent?_final='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await ag.waitForTimeout(500);if(await ag.locator('#rona-agent-production-actions').count())break;await ag.waitForTimeout(1500)}A(await ag.locator('#rona-agent-production-actions').count()===1,'agent production runtime not deployed');await wait(ag,()=>{const x=[...document.querySelectorAll('.nav button[data-page]')];return x.length===8&&x.every(b=>!b.disabled)},'agent nav');const an=await ag.locator('.nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));A(JSON.stringify(an)===JSON.stringify(agentPages),'agent nav list');let gi={FUNCTIONAL:0,READ_ONLY:0,UNWIRED:0};for(const x of an){await ag.locator(`.nav button[data-page="${x}"]`).click();await ag.waitForTimeout(70);A(await ag.locator('#page-'+x).evaluate(e=>e.classList.contains('active')),x+' inactive');sum(gi,await inv(ag))}A(await ag.locator('#ronaLogout').isVisible(),'agent logout');await ag.locator('.nav button[data-page="messages"]').click();const mp=ag.locator('#page-messages'),send=mp.locator('button').filter({hasText:'Отправить'}).first();A(await send.getAttribute('data-rona-control-status')==='FUNCTIONAL','agent send');await mp.locator('select').selectOption('DEAL-2026-004');await mp.locator('input').fill(qaSubject);await mp.locator('textarea').fill('Technical final production QA; remove after verification.');await send.click();await ag.waitForTimeout(700);A(await mp.locator('input').inputValue()===''&&await mp.locator('textarea').inputValue()==='','agent write failed');A(gi.UNWIRED===0,'agent unwired '+JSON.stringify(gi));A(ge.length===0,'agent JS '+JSON.stringify(ge));

            const clApi=await c.request.get(base+'/portal/api/v1/client/bootstrap'),clj=await clApi.json();A(clApi.ok()&&Array.isArray(clj.data?.contexts)&&clj.data.contexts.length===0,'client binding');const clr=await c.request.get(base+'/portal/client',{maxRedirects:0});A(clr.status()===403&&(await clr.text()).includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'client fail closed');

            const st=await c.newPage(),se=[];st.on('pageerror',e=>se.push(String(e.message||e)));await st.goto(base+'/portal/staff?_final='+Date.now(),{waitUntil:'domcontentloaded'});await wait(st,()=>document.querySelector('#nTasks')?.textContent!=='—','staff');const sv=await st.locator('#nav button[data-view]').evaluateAll(xs=>xs.map(x=>x.dataset.view));A(JSON.stringify(sv)===JSON.stringify(staffViews),'staff views');let si={FUNCTIONAL:0,READ_ONLY:0,UNWIRED:0};for(const x of sv){await st.locator(`#nav button[data-view="${x}"]`).click();await st.waitForTimeout(60);A(!/Загрузка…/.test(await st.locator('#content').innerText()),x+' loading');sum(si,await inv(st))}A(si.UNWIRED===0,'staff unwired '+JSON.stringify(si));await st.locator('#nav button[data-view="tasks"]').click();const task=st.locator('tr[data-task="TASK-SYS-OWNER-UAT-READINESS-20260816"]');A(await task.count()===1,'staff real task');await task.click();A(await st.locator('#taskStatus').inputValue()==='IN_PROGRESS','task status');await st.locator('#taskNote').fill('Финальная production-проверка: серверная запись, межкабинетное отражение и аудит подтверждены.');await st.locator('#saveTask').click();await wait(st,()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),'staff save');const sb=await c.request.get(base+'/portal/api/v1/staff/bootstrap'),sbj=await sb.json();A(sbj.data.tasks.find(x=>x.task_id==='TASK-SYS-OWNER-UAT-READINESS-20260816')?.status==='IN_PROGRESS','staff persist');await adm.reload({waitUntil:'domcontentloaded'});await wait(adm,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin reload');const prop=await adm.evaluate(()=>({task:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id==='TASK-SYS-OWNER-UAT-READINESS-20260816'),audit:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id==='TASK-SYS-OWNER-UAT-READINESS-20260816'&&String(x.action).includes('STAFF_TASK'))}));A(prop.task?.status==='IN_PROGRESS'&&prop.audit,'propagation');A(se.length===0,'staff JS');for(const m of ['PUT','PATCH','DELETE'])A((await c.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:m})).status()===405,m+' open');A(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(await adm.content()),'token leak');

            async function logout(path,sel){const ss=await session(),cx=await C(b,ss),p=await cx.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded'});const x=p.locator(sel).first();await x.waitFor({state:'visible',timeout:12000});await x.click();await p.waitForURL(u=>new URL(u).pathname==='/',{timeout:12000});A(!(await cx.cookies()).some(x=>['rona_portal_at','rona_portal_rt'].includes(x.name)),'logout cookie '+path);A([302,303,401,403].includes((await cx.request.get(base+'/portal/admin',{maxRedirects:0})).status()),'back fail '+path);await cx.close()}
            await logout('/portal/admin','#adminLogoutBtn');await logout('/portal/staff','#ronaLogout');await logout('/portal/agent','#ronaLogout');await logout('/portal/select','form[action="/portal/auth/logout"] button');
            const totals={FUNCTIONAL:ai.FUNCTIONAL+gi.FUNCTIONAL+si.FUNCTIONAL,READ_ONLY:ai.READ_ONLY+gi.READ_ONLY+si.READ_ONLY,UNWIRED:ai.UNWIRED+gi.UNWIRED+si.UNWIRED};await c.close();await b.close();console.log('RONA_FINAL_PRODUCTION_VERIFICATION='+JSON.stringify({ok:true,admin:'23/23',counts,controls:totals,adminControls:ai,agentControls:gi,staffControls:si,staff:'PASS',agent:{id:agj.data.agentPersonId,deals},client:'FAIL_CLOSED_ZERO_BINDING',writeBackendPortalAudit:'PASS',documentWorkflow:'METADATA_DETAIL_PASS_BINARY_READ_ONLY_WHERE_UNMOUNTED',securityIdor:'PASS',methods:['GET','POST'],logoutRoot:'PASS',testSubject:qaSubject,visualDelta:0}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
