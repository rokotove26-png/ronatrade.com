name: Client Full Shell Visibility QA

on:
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'assets/portal-runtime/client-home-*.js'
      - 'scripts/attach-client-*.mjs'
      - 'portal-src/current/client/**'
      - '.github/workflows/client-full-shell-visibility-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-shell-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact Client artifact
        run: npm run build
      - name: Install Chrome harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi
      - name: Prove complete built shell cannot stay black
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const http=require('http');
          const fs=require('fs');
          const path=require('path');
          const cp=require('child_process');
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const dist=path.resolve('dist');
          const port=4187;
          const origin=`http://127.0.0.1:${port}`;
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.ico':'image/x-icon'};
          const server=http.createServer((req,res)=>{
            const u=new URL(req.url,origin);
            let pathname=u.pathname;
            if(pathname==='/portal/client'||pathname==='/portal/client/')pathname='/portal/client.html';
            const file=path.resolve(dist,'.'+pathname);
            if(!file.startsWith(dist+path.sep)){res.writeHead(403);res.end('forbidden');return}
            fs.readFile(file,(error,data)=>{
              if(error){res.writeHead(404,{'content-type':'text/plain; charset=utf-8'});res.end('not found');return}
              res.writeHead(200,{'content-type':mime[path.extname(file).toLowerCase()]||'application/octet-stream','cache-control':'no-store'});
              res.end(data);
            });
          });
          const listen=()=>new Promise((resolve,reject)=>{server.once('error',reject);server.listen(port,'127.0.0.1',resolve)});
          const close=()=>new Promise(resolve=>server.close(()=>resolve()));
          const client={client_id:'RONA-C004',legal_name:'CLIENT FULL SHELL QA',registration_country:'RU',registered_address:'TEST',contact_phone:null,contract_id:'RONA-C004-CTR-2026-001',current_external_contract_number:'RONA-C004-CTR-2026-001',contract_status:'ACTIVE',effective_from:'2026-08-31',effective_to:null,signed_contract_confirmed_at:'2026-08-31T00:00:00Z'};
          const detail={contract:client,applications:[],deals:[],documents:[],payments:[],prices:[]};
          const goodPayload=pathname=>{
            if(pathname.endsWith('/v1/client/bootstrap'))return{ok:true,data:{generated_at:new Date().toISOString(),data_contract:'1.4',requires_context_selection:false,contexts:[client],price_authority:[],selected_context:null,applications:[],deals:[],documents:[],payments:[],shipments:[],rail_documents:[],market:[],notifications:[]}};
            if(pathname.endsWith('/v1/client/context'))return{ok:true,data:detail};
            if(pathname.endsWith('/v1/client/prices'))return{ok:true,data:[]};
            if(pathname.endsWith('/v1/client/market'))return{ok:true,data:[]};
            if(pathname.endsWith('/v1/client/shipments'))return{ok:true,data:{shipments:[],rail_documents:[],wagons:[]}};
            if(pathname.endsWith('/v1/client/rail'))return{ok:true,data:{status:'EMPTY',rail:[],rail_documents:[],wagons:[]}};
            return{ok:true,data:{items:[],applications:[],deals:[],documents:[],payments:[],prices:[],shipments:[],rail:[],rail_documents:[],wagons:[],market:[],notifications:[]}};
          };
          const compact=v=>String(v??'').replace(/\s+/g,' ').trim();
          async function scenario(browser,name,apiMode){
            const context=await browser.newContext({viewport:{width:1920,height:1080}});
            const page=await context.newPage();
            const pageErrors=[];
            const consoleErrors=[];
            const requestFailed=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e?.message||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>requestFailed.push({url:r.url(),error:r.failure()?.errorText||''}));
            await page.addInitScript(({client,detail,apiMode})=>{
              localStorage.clear();sessionStorage.clear();
              const originalFetch=window.fetch.bind(window);
              const goodPayload=pathname=>{
                if(pathname.endsWith('/v1/client/bootstrap'))return{ok:true,data:{generated_at:new Date().toISOString(),data_contract:'1.4',requires_context_selection:false,contexts:[client],price_authority:[],selected_context:null,applications:[],deals:[],documents:[],payments:[],shipments:[],rail_documents:[],market:[],notifications:[]}};
                if(pathname.endsWith('/v1/client/context'))return{ok:true,data:detail};
                if(pathname.endsWith('/v1/client/prices'))return{ok:true,data:[]};
                if(pathname.endsWith('/v1/client/market'))return{ok:true,data:[]};
                if(pathname.endsWith('/v1/client/shipments'))return{ok:true,data:{shipments:[],rail_documents:[],wagons:[]}};
                if(pathname.endsWith('/v1/client/rail'))return{ok:true,data:{status:'EMPTY',rail:[],rail_documents:[],wagons:[]}};
                return{ok:true,data:{items:[],applications:[],deals:[],documents:[],payments:[],prices:[],shipments:[],rail:[],rail_documents:[],wagons:[],market:[],notifications:[]}};
              };
              window.fetch=async(input,init)=>{
                const href=typeof input==='string'?input:input?.url||String(input);
                const url=new URL(href,location.href);
                if(!url.pathname.startsWith('/portal/api/'))return originalFetch(input,init);
                await new Promise(resolve=>setTimeout(resolve,250));
                if(apiMode==='fail')return new Response(JSON.stringify({ok:false,error:{code:'QA_FORCED_API_FAILURE',message:'forced'}}),{status:503,headers:{'content-type':'application/json','cache-control':'no-store'}});
                return new Response(JSON.stringify(goodPayload(url.pathname)),{status:200,headers:{'content-type':'application/json','cache-control':'no-store'}});
              };
            },{client,detail,apiMode});
            await page.goto(origin+'/portal/client',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(7200);
            const snapshot=await page.evaluate(()=>{
              const compact=v=>String(v??'').replace(/\s+/g,' ').trim();
              const html=document.documentElement;
              const body=document.body;
              const home=document.querySelector('#page-home');
              const owner=home?.querySelector('[data-rona-client-home-owner="command-center-v2"]')||null;
              const styleOf=el=>{
                if(!el)return null;
                const s=getComputedStyle(el),r=el.getBoundingClientRect();
                return {tag:el.tagName,id:el.id||null,cls:compact(el.className).slice(0,160),display:s.display,visibility:s.visibility,opacity:s.opacity,pointerEvents:s.pointerEvents,position:s.position,zIndex:s.zIndex,width:Math.round(r.width),height:Math.round(r.height),x:Math.round(r.x),y:Math.round(r.y),bg:s.backgroundColor};
              };
              const ancestors=[];
              let node=owner||home;
              while(node){ancestors.push(styleOf(node));node=node.parentElement}
              let effectiveOpacity=1;
              for(const item of ancestors){const n=Number(item?.opacity);if(Number.isFinite(n))effectiveOpacity*=n}
              const coverings=[...document.querySelectorAll('body *')].map(el=>({el,s:getComputedStyle(el),r:el.getBoundingClientRect()})).filter(x=>{
                if(!['fixed','absolute','sticky'].includes(x.s.position))return false;
                if(x.s.display==='none'||x.s.visibility==='hidden'||Number(x.s.opacity)===0)return false;
                return x.r.width>=innerWidth*.8&&x.r.height>=innerHeight*.8;
              }).slice(-20).map(x=>({...styleOf(x.el),text:compact(x.el.innerText).slice(0,120)}));
              const center=document.elementFromPoint(innerWidth/2,innerHeight/2);
              const guard=document.getElementById('rona-client-home-first-paint-guard');
              return {
                url:location.href,
                htmlData:Object.fromEntries([...html.attributes].filter(a=>a.name.startsWith('data-rona')).map(a=>[a.name,a.value])),
                body:styleOf(body),html:styleOf(html),home:styleOf(home),owner:styleOf(owner),
                homeActive:Boolean(home?.classList.contains('active')),
                ownerText:compact(owner?.innerText).slice(0,900),
                bodyText:compact(body?.innerText).slice(0,1200),
                effectiveOpacity,
                ancestors,
                activePages:[...document.querySelectorAll('.page.active,[data-page].active,[data-page-panel].active')].map(el=>({id:el.id||null,dataPage:el.getAttribute('data-page')||el.getAttribute('data-page-panel')||null,style:styleOf(el)})),
                coverings,
                center:styleOf(center),
                centerText:compact(center?.innerText||center?.textContent).slice(0,160),
                guard:guard?{media:guard.media,disabled:guard.disabled,text:compact(guard.textContent).slice(0,500)}:null,
                scripts:[...document.scripts].map(s=>s.src||'[inline]').filter(src=>/client|portal-runtime/.test(src)).slice(-40),
                currentOnly:window.__RONA_CLIENT_HOME_CURRENT_ONLY__||null,
                currentOnlyState:window.__RONA_CLIENT_HOME_CURRENT_ONLY_STATE__||null,
                runtimeState:window.__RONA_CLIENT_HOME_STATE__||null,
                resources:performance.getEntriesByType('resource').map(e=>e.name).filter(n=>/client-home-current-only|client-home-command-center/.test(n))
              };
            });
            console.log('CLIENT_FULL_SHELL_SNAPSHOT '+name+' '+JSON.stringify(snapshot));
            console.log('CLIENT_FULL_SHELL_PAGE_ERRORS '+name+' '+JSON.stringify(pageErrors));
            console.log('CLIENT_FULL_SHELL_CONSOLE_ERRORS '+name+' '+JSON.stringify(consoleErrors));
            console.log('CLIENT_FULL_SHELL_REQUEST_FAILED '+name+' '+JSON.stringify(requestFailed));
            assert(snapshot.home,`${name}: #page-home missing`);
            assert(snapshot.homeActive,`${name}: Home is not active: ${JSON.stringify(snapshot.activePages)}`);
            assert(snapshot.home.display!=='none'&&snapshot.home.visibility!=='hidden'&&Number(snapshot.home.opacity)>0,`${name}: Home is CSS-hidden: ${JSON.stringify(snapshot.home)}`);
            assert(snapshot.home.width>200&&snapshot.home.height>100,`${name}: Home has no visible geometry: ${JSON.stringify(snapshot.home)}`);
            assert(snapshot.effectiveOpacity>0.2,`${name}: Home ancestor chain is transparent: ${JSON.stringify(snapshot.ancestors)}`);
            assert(snapshot.htmlData['data-rona-client-home-prepaint']==='released',`${name}: prepaint remained armed: ${JSON.stringify(snapshot.htmlData)}`);
            assert(snapshot.currentOnly,`${name}: current-only runtime did not execute`);
            assert(snapshot.resources.some(x=>x.includes('client-home-current-only-v1.js')),`${name}: current-only resource missing`);
            if(apiMode==='good'){
              assert(snapshot.owner&&snapshot.owner.width>200&&snapshot.owner.height>40,`${name}: command center owner has no geometry: ${JSON.stringify(snapshot.owner)}`);
              assert(snapshot.ownerText.length>40,`${name}: command center owner is blank`);
              assert(snapshot.htmlData['data-rona-client-home-ready']==='true',`${name}: Home never reached ready`);
            }else{
              assert(snapshot.owner&&snapshot.owner.width>200&&snapshot.owner.height>20,`${name}: fail-open owner has no geometry: ${JSON.stringify(snapshot.owner)}`);
              assert(snapshot.ownerText.includes('Данные временно недоступны'),`${name}: bounded fail-open text missing: ${snapshot.ownerText}`);
            }
            await context.close();
          }
          (async()=>{
            await listen();
            const executablePath=cp.execSync('command -v google-chrome || command -v google-chrome-stable',{encoding:'utf8'}).trim();
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            try{
              await scenario(browser,'authoritative-success','good');
              await scenario(browser,'api-failure-fail-open','fail');
              console.log('CLIENT_FULL_SHELL_VISIBILITY_QA=PASS');
            }finally{
              await browser.close();
              await close();
            }
          })().catch(error=>{console.error(error?.stack||error);process.exit(1)});
          NODE
