name: Admin Deals premium visual v1 QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/main-ui/admin-deals-premium-v1.js'
      - 'functions/portal/main-ui/admin-deals-semantic-buttons-v1.js'
      - 'functions/portal/main-ui/admin-deals-semantic-corrections-v1.js'
      - 'functions/portal/owner-ui-chunks/chunk18.js'
      - 'functions/portal/owner-ui-chunks/chunk18-base.js'
      - 'scripts/qa-admin-deals-premium-v1.mjs'
      - '.github/workflows/admin-deals-premium-v1-qa.yml'

jobs:
  admin-deals-premium-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce visual-only Deals scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/public-go-live-v1.1 --depth=1
          changed="$(git diff --name-only origin/release/public-go-live-v1.1...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(functions/portal/main-ui/admin-deals-premium-v1\.js|functions/portal/main-ui/admin-deals-semantic-buttons-v1\.js|functions/portal/main-ui/admin-deals-semantic-corrections-v1\.js|functions/portal/owner-ui-chunks/chunk18\.js|functions/portal/owner-ui-chunks/chunk18-base\.js|scripts/qa-admin-deals-premium-v1\.mjs|\.github/workflows/admin-deals-premium-v1-qa\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files in visual-only PR:"
            printf '%s\n' "$bad"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^supabase/|owner-api|price-updates-api|admin-payments|migrations|schema|sql$)' >/dev/null; then
            echo 'Backend/API/DB surface changed unexpectedly'
            exit 1
          fi
      - name: Prove premium presentation and locked title size
        run: node scripts/qa-admin-deals-premium-v1.mjs
