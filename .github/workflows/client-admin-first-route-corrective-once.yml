name: Client Admin-first intake route corrective once

on:
  workflow_dispatch:
  push:
    branches: [fix/client-context-universal-modules-v1]
    paths: [.github/workflows/client-admin-first-route-corrective-once.yml]

permissions:
  contents: write

jobs:
  corrective:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-context-universal-modules-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add Admin-first routing endpoint and contract QA
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const indexPath='supabase/functions/rona-portal-api/index.ts';
          let index=fs.readFileSync(indexPath,'utf8');
          const marker='server_admin_route_client_intake';
          if(!index.includes(marker)){
            const anchor='if(route==="/v1/admin/bootstrap"&&req.method==="GET")return c.roles.includes("ADMIN")?send(origin,200,{ok:true,data:await adminBootstrap()}):send(origin,403,{ok:false,code:"ROLE_MISMATCH"});';
            if(!index.includes(anchor)) throw new Error('ADMIN_BOOTSTRAP_ANCHOR_NOT_FOUND');
            const route=`const adminClientIntakeRouteMatch=route.match(/^\\/v1\\/admin\\/client-intake\\/([^/]+)\\/route$/);if(adminClientIntakeRouteMatch&&req.method==="POST"){if(!c.roles.includes("ADMIN"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const eventId=safePathValue(adminClientIntakeRouteMatch[1]);if(!eventId)return send(origin,404,{ok:false,code:"CLIENT_INTAKE_NOT_FOUND"});const body=await req.json().catch(()=>({})),targetRole=String(body?.assigned_functional_role||body?.functional_role||body?.role||"").trim().toUpperCase(),allowedRoles=new Set(["EXECUTIVE_DIRECTOR","OPERATIONS_DIRECTOR","LEGAL","FINANCE","ACCOUNTING","MARKET_ANALYST","COMMERCIAL_DIRECTOR","RAIL_LOGISTICS","SYSTEM_ADMIN"]);if(!allowedRoles.has(targetRole))return send(origin,400,{ok:false,code:"INVALID_FUNCTIONAL_ROLE"});const bodyRequestId=String(body?.request_id||"").trim(),headerRequestId=String(req.headers.get("x-request-id")||"").trim(),bodyCorrelationId=String(body?.correlation_id||"").trim(),headerCorrelationId=String(req.headers.get("x-correlation-id")||"").trim(),requestId=uuid.test(bodyRequestId)?bodyRequestId:uuid.test(headerRequestId)?headerRequestId:crypto.randomUUID(),correlationId=uuid.test(bodyCorrelationId)?bodyCorrelationId:uuid.test(headerCorrelationId)?headerCorrelationId:null,rows=await sql\`select * from portal_private.server_admin_route_client_intake(\${c.user}::uuid,\${eventId},\${targetRole}::portal_private.staff_functional_role_enum,\${requestId}::uuid,\${correlationId}::uuid)\`;return rows.length===1?send(origin,200,{ok:true,route_contract:"ADMIN_FIRST_CLIENT_COMMUNICATION_V1",routing:rows[0]}):send(origin,409,{ok:false,code:"CLIENT_INTAKE_ROUTE_CONFLICT"})}`;
            index=index.replace(anchor,anchor+route);
            fs.writeFileSync(indexPath,index);
          }

          const testPath='tests/client-admin-first-communication-v1.test.mjs';
          const test=`import fs from 'node:fs';\nconst assert=(v,m)=>{if(!v)throw new Error(m)};\nconst api=fs.readFileSync('supabase/functions/rona-portal-api/index.ts','utf8');\nconst migration=fs.readFileSync('supabase/migrations/20260902233000_client_communication_admin_gate_v1.sql','utf8');\nassert(api.includes('/v1/admin\\/client-intake\\/([^/]+)\\/route'),'Admin client-intake route missing');\nassert(api.includes('c.roles.includes(\"ADMIN\")'),'ADMIN role gate missing');\nassert(api.includes('portal_private.server_admin_route_client_intake'),'Admin routing authority call missing');\nassert(api.includes('ADMIN_FIRST_CLIENT_COMMUNICATION_V1'),'Admin-first route contract missing');\nassert(!api.includes('/v1/client/client-intake'),'Client direct routing endpoint must not exist');\nassert(migration.includes("new.actor_role = 'CLIENT'::portal_private.portal_role_enum"),'client-origin guard missing');\nassert(migration.includes("new.event_type like 'CLIENT_%'"),'client event guard missing');\nassert(migration.includes('create or replace function portal_private.server_admin_route_client_intake'),'Admin routing function missing');\nconst guard=migration.indexOf("new.actor_role = 'CLIENT'::portal_private.portal_role_enum");\nconst staff=migration.indexOf('role := portal_private.staff_role_for_reverse_event');\nassert(guard>=0&&staff>guard,'Client Admin intake guard must precede functional task assignment');\nconsole.log('CLIENT_ADMIN_FIRST_COMMUNICATION_QA=PASS');\n`;
          fs.writeFileSync(testPath,test);
          NODE
          node tests/client-admin-first-communication-v1.test.mjs
          npm run build
          git diff --check
      - name: Commit validated Admin-first delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RONA LK Architect"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/rona-portal-api/index.ts tests/client-admin-first-communication-v1.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: expose Admin-first client intake routing"
          git push origin HEAD:fix/client-context-universal-modules-v1
