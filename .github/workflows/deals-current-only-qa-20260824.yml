name: Deals current-only QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  contents: read
  statuses: write

jobs:
  deals-current-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse current Deals and Admin runtimes
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/admin.js
          printf '%s\n' '{"type":"module"}' > functions/portal/package.json
          node --input-type=module <<'NODE'
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const deals=await import('./functions/portal/deals-current-state-ui.js?qa='+Date.now());
          const dr=await deals.onRequest();
          const ds=await dr.text();
          new Function(ds);
          assert(dr.headers.get('x-rona-deals-ui')==='current-state-v1.6-signed-addendum','Deals runtime header');
          assert(ds.includes('function waitsPayment(d)'),'payment-only predicate missing');
          assert(!ds.includes('function waitsAction(d)'),'legacy waitsAction remains');
          assert(ds.includes('function isolateDealsPage(root,host)'),'Deals underlay isolation missing');
          assert(ds.includes("host.dataset.ronaDealsOwner='current-v1.5'"),'exclusive owner marker missing');
          assert(ds.includes("n.style.setProperty('display','none','important')"),'preserved underlay is not forcibly hidden');
          assert(ds.includes("var owned=el('div','rona-current-deals-owned')"),'owned Deals root missing');
          assert(ds.includes('function guardDealsOwner()'),'exclusive Deals guard missing');
          assert(ds.includes("kpi('Ожидают оплаты'"),'payment KPI title missing');
          assert(!ds.includes("kpi('Ожидают оплаты или действий'"),'legacy payment KPI title remains');
          assert(ds.includes("'Базис поставки'"),'delivery basis column missing');
          assert(ds.includes('Incoterms\\s*2020'),'basis display cleanup missing');
          assert(ds.includes('ronaDealsLayoutV15'),'Deals layout style missing');
          assert(ds.includes('Скачать подписанное доп. соглашение'),'signed addendum action missing');
          assert(ds.includes('width:310px!important'),'company column expansion missing');
          assert(ds.includes('width:145px!important'),'basis column compaction missing');
          assert(ds.includes('text-overflow:clip!important'),'company truncation override missing');
          assert(ds.includes("'Общий объём сделок, т'"),'total volume KPI missing');
          assert(ds.includes("'Общая сумма сделок'"),'total amount KPI missing');

          const clean=(raw)=>raw.replace(/\s*[,(]?\s*Incoterms\s*2020\s*\)?/ig,'').replace(/\s{2,}/g,' ').replace(/\s*,\s*$/,'').trim();
          assert(clean('DAP ст. Уртааул, Incoterms 2020')==='DAP ст. Уртааул','basis cleanup result');

          const main=await import('./functions/portal/admin-main-ui-current.js?qa='+Date.now());
          const mr=await main.onRequest();
          const ms=await mr.text();
          new Function(ms);
          assert(mr.headers.get('x-rona-deals-owner')==='current-only-v1.5','main current-only marker');
          assert(ms.includes('function isolateDealsShell(p)'),'main Deals underlay isolation missing');
          assert(ms.includes('function renderDealsCurrentShell()'),'current Deals loading shell missing');
          assert(ms.includes('deals:renderDealsCurrentShell,'),'navigation still owns legacy Deals renderer');
          assert(!ms.includes('deals:renderDeals,'),'legacy navigation Deals renderer remains active');
          assert(ms.includes('renderApplications();renderDealsCurrentShell();renderDocuments();'),'initial Admin render does not use current-only shell');
          console.log('DEALS_CURRENT_ONLY_GENERATED_RUNTIME=PASS');
          NODE
      - name: Publish QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Deals current-only generated runtime failed'
          if [ "$JOB_STATUS" = 'success' ]; then state=success; description='Deals current-only runtime PASS'; fi
          target="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/deals-current-only","description":"%s","target_url":"%s"}' "$state" "$description" "$target")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
