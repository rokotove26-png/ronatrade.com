name: AI Read-Only Contour QA

on:
  push:
    branches:
      - feature/ai-read-only-contour-2b1-20260818
  pull_request:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  checks: read

jobs:
  ai-read-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pending QA status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA;
          const headers={authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'};
          const body={state:'pending',context:'rona/ai-read-only-contour',description:'Step 2B-1 AI read-only QA running',target_url:`https://github.com/${repo}/actions`};
          const r=await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers,body:JSON.stringify(body)});
          if(!r.ok) throw new Error(`status pending ${r.status}`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify branch parent baseline
        run: |
          BASE=ad893b67cd9459820d6a16a67a568308ae91f0f3
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD

      - name: AI read-only unit and route tests
        run: node scripts/test-ai-read-only-contour.mjs

      - name: AI market and document read tests
        run: node scripts/test-ai-read-extras.mjs

      - name: Syntax checks
        run: |
          node --check supabase/functions/rona-ai-read-only/core.js
          node --check supabase/functions/rona-ai-read-only/index.js
          node --check supabase/functions/rona-ai-read-extras/index.js
          node --check 'functions/portal/api/v1/ai/[[path]].js'
          node --check functions/portal/api/v1/ai/market-data.js
          node --check 'functions/portal/api/v1/ai/documents/[[path]].js'
          node --check 'functions/portal/[[path]].js'
          node --check functions/portal/clients-agents-current-ui.js

      - name: Current Admin and approved production router non-regression
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git diff --exit-code "origin/$BASE_REF"...HEAD -- \
              functions/portal/_middleware.js \
              'functions/portal/[[path]].js' \
              functions/portal/agent/_middleware.js \
              portal-src/agent.html \
              portal-src/client.html \
              portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html \
              portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html
          fi
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          grep -q "if(url.pathname==='/portal/admin')return context.next();" functions/portal/_middleware.js
          grep -q 'ADMIN_CONTROL_PLANE_API' 'functions/portal/[[path]].js'
          grep -q 'proxyAdminAuthority' 'functions/portal/[[path]].js'
          grep -q "path.startsWith('/portal/admin-authority')" 'functions/portal/[[path]].js'
          grep -q 'data-rona-admin-shell="current-only-v1"' portal-src/current/admin.html
          grep -q 'clients-agents-current-ui' portal-src/current/admin.html
          grep -q "AUTH='/portal/admin-authority'" functions/portal/clients-agents-current-ui.js
          grep -q '/access/users' functions/portal/clients-agents-current-ui.js
          ! grep -q 'harvestLegacy' functions/portal/clients-agents-current-ui.js
          ! grep -q 'window.openModal' functions/portal/clients-agents-current-ui.js
          echo 'CURRENT_ADMIN_ROUTER_BASELINE=PASS'
          echo 'ADMIN_AUTHORITY_ROUTER=PASS'
          echo 'ADMIN_ACCESS_CURRENT_ONLY=PASS'

      - name: Production build regression
        run: npm run build

      - name: Verify current canonical build integrity
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git diff --exit-code "origin/$BASE_REF"...HEAD -- \
              portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html \
              portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html \
              portal-src/canonical/canonical_background.png \
              portal-src/canonical/canonical_logo.svg
          fi
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          test "$(sha256sum 'portal-src/canonical/canonical_background.png' | awk '{print $1}')" = '9f0022d1651ddcf14fe2c6c66a4151b9074804f237c7b347793fd6cd20f505cc'
          test "$(sha256sum 'portal-src/canonical/canonical_logo.svg' | awk '{print $1}')" = '755f13d3ba5c7b08a2538b72d3bcb8e0a6d5bb9b24ffde57cda7eca27762ac65'
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.architecture!=='CURRENT_ONLY_ADMIN_SHELL_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"

      - name: Credential leak scan
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const roots=['supabase','functions','scripts','db'];
          const skip=new Set(['node_modules','.git']);
          const files=[];
          function walk(p){if(!fs.existsSync(p))return;const s=fs.statSync(p);if(s.isDirectory()){if(skip.has(path.basename(p)))return;for(const n of fs.readdirSync(p))walk(path.join(p,n));}else files.push(p)}
          roots.forEach(walk);
          const literal=/(RONA_AI_TOKEN_SIGNING_KEY|RONA_AI_BOOTSTRAP_PEPPER)\s*=\s*["'][^"']+["']/;
          const logged=/x-rona-ai-bootstrap-key[^\n]{0,100}(console\.|log\(|print\(|echo)/i;
          const bad=[];
          for(const f of files){const t=fs.readFileSync(f,'utf8');if(literal.test(t)||logged.test(t))bad.push(f)}
          if(bad.length)throw new Error('credential leak pattern: '+bad.join(','));
          console.log('AI_CREDENTIAL_LEAK_SCAN=PASS');
          NODE

      - name: Verify production baseline gate remains successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY;
          const sha='ad893b67cd9459820d6a16a67a568308ae91f0f3';
          const headers={authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers});
          if(!r.ok) throw new Error(`check-runs ${r.status}`);
          const j=await r.json();
          const c=(j.check_runs||[]).find(x=>x.name==='final-production-activation-v2');
          if(!c||c.status!=='completed'||c.conclusion!=='success') throw new Error(`production gate not success: ${JSON.stringify(c||null)}`);
          console.log(`PRODUCTION_BASELINE_GATE=PASS check_run_id=${c.id}`);
          NODE

      - name: Publish final QA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA;
          const ok=process.env.JOB_STATUS==='success';
          const headers={authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'};
          const body={state:ok?'success':'failure',context:'rona/ai-read-only-contour',description:ok?'Step 2B-1 AI read-only QA PASS':'Step 2B-1 AI read-only QA FAILED',target_url:`https://github.com/${repo}/actions`};
          const r=await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers,body:JSON.stringify(body)});
          if(!r.ok) throw new Error(`status final ${r.status}`);
          NODE
