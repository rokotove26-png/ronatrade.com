          p=Path('supabase/functions/rona-portal-api/index.ts')
          lines=p.read_text().splitlines()
          out=[]
          payment_done=deals_done=context_done=False
          for line in lines:
              if line.startswith('function currentPaymentStatus('):
                  out.append("function currentPaymentStatus(row:any,finance:any,safePayment:any,commercial:any){const financeObligation=finiteNumber(finance?.obligation_amount),commercialObligation=finiteNumber(commercial?.obligation_amount),obligation=financeObligation!==null&&financeObligation>0?financeObligation:commercialObligation!==null&&commercialObligation>0?commercialObligation:null,received=finiteNumber(finance?.received_amount),currency=String(finance?.currency||commercial?.currency||safePayment?.currency||\"\").trim().toUpperCase()||null,obligationSource=financeObligation!==null&&financeObligation>0?'OWNER_DEAL_FINANCE_SUMMARY':commercialObligation!==null&&commercialObligation>0?'FINALIZED_APPLICATION_COMMERCIAL_TERMS':null,summary=String(finance?.finance_status||\"\").trim().toUpperCase();if(obligationSource==='OWNER_DEAL_FINANCE_SUMMARY'&&received!==null){const percent=Math.max(0,Math.min(100,Math.round(received/obligation!*100)));if(received>=obligation!)return{payment_status:'PAID',payment_label:'Оплачено 100%',payment_received_amount:received,payment_obligation_amount:obligation,payment_currency:currency,payment_percent:100,payment_source:'OWNER_DEAL_FINANCE_SUMMARY',payment_obligation_source:obligationSource};if(received>0)return{payment_status:'PARTIALLY_PAID',payment_label:`Оплачено ${percent}%`,payment_received_amount:received,payment_obligation_amount:obligation,payment_currency:currency,payment_percent:percent,payment_source:'OWNER_DEAL_FINANCE_SUMMARY',payment_obligation_source:obligationSource};if(summary==='OVERDUE')return{payment_status:'OVERDUE',payment_label:'Оплата просрочена',payment_received_amount:received,payment_obligation_amount:obligation,payment_currency:currency,payment_percent:0,payment_source:'OWNER_DEAL_FINANCE_SUMMARY',payment_obligation_source:obligationSource};return{payment_status:'AWAITING_PAYMENT',payment_label:'Ожидается оплата',payment_received_amount:received,payment_obligation_amount:obligation,payment_currency:currency,payment_percent:0,payment_source:'OWNER_DEAL_FINANCE_SUMMARY',payment_obligation_source:obligationSource}}if(safePayment)return{payment_status:'PAYMENT_CONFIRMED',payment_label:'Оплата получена',payment_received_amount:finiteNumber(safePayment.allocated_amount??safePayment.amount),payment_obligation_amount:obligation,payment_currency:currency,payment_percent:null,payment_source:'BANK_CONFIRMED_VERIFIED_ALLOCATION',payment_obligation_source:obligationSource};const dealFinance=String(row?.finance_status||\"\").trim().toUpperCase(),base={payment_received_amount:null,payment_obligation_amount:obligation,payment_currency:currency,payment_percent:null,payment_obligation_source:obligationSource};if(dealFinance==='PAID')return{payment_status:'PAID',payment_label:'Оплачено',...base,payment_source:'DEAL_FINANCE_STATUS'};if(['DUE','PAYMENT_DUE','AWAITING_PAYMENT','OVERDUE'].includes(dealFinance))return{payment_status:dealFinance,payment_label:dealFinance==='OVERDUE'?'Оплата просрочена':'Ожидается оплата',...base,payment_source:'DEAL_FINANCE_STATUS'};if(dealFinance==='NOT_DUE')return{payment_status:'NOT_DUE',payment_label:'Оплата не наступила',...base,payment_source:'DEAL_FINANCE_STATUS'};return{payment_status:'TO_VERIFY',payment_label:'Статус оплаты уточняется',...base,payment_source:'DEAL_FINANCE_STATUS'}}")
                  payment_done=True
              elif line.startswith('async function projectClientDeals('):
                  out.append("async function projectClientDeals(rows:any[],safePayments:any[]){const ids=[...new Set((rows||[]).map((r:any)=>String(r.deal_id||\"\")).filter(Boolean))];if(!ids.length)return[];const financeRows=await sql`select distinct on (deal_id) deal_id,obligation_amount,received_amount,currency,client_remaining_amount,finance_status,authority_state,lifecycle_state,updated_at from portal_private.owner_deal_finance_summary where deal_id in (select value from jsonb_array_elements_text(${sql.json(ids)}::jsonb)) and authority_state in ('CONFIRMED','VERIFIED') and lifecycle_state='ACTIVE' order by deal_id,updated_at desc`,commercialRows=await sql`select d.deal_id,a.application_id,(a.quantity_tonnes::numeric*a.proposed_price::numeric) as obligation_amount,a.proposed_currency::text as currency,w.finalized_at from portal_private.deals d join portal_private.client_applications a on a.linked_deal_key=d.id join portal_private.owner_application_workflow w on w.application_key=a.id where d.deal_id in (select value from jsonb_array_elements_text(${sql.json(ids)}::jsonb)) and a.status='DEAL_REGISTERED' and w.business_status='DEAL' and coalesce(w.counter_offer_used,false)=false and w.finalized_at is not null`,resourceRows=await sql`select d.deal_id,rd.resource_decision_id,rd.decision_state,rd.decided_at from portal_private.deals d join portal_private.resource_decisions rd on rd.deal_key=d.id where d.deal_id in (select value from jsonb_array_elements_text(${sql.json(ids)}::jsonb)) order by rd.decided_at desc`;const financeByDeal=new Map(financeRows.map((r:any)=>[String(r.deal_id),r])),commercialByDeal=new Map(commercialRows.map((r:any)=>[String(r.deal_id),r])),resourceByDeal=new Map(resourceRows.map((r:any)=>[String(r.deal_id),r])),paymentByDeal=new Map<string,any>();for(const p of safePayments||[]){const id=String(p.deal_id||\"\");if(id&&!paymentByDeal.has(id))paymentByDeal.set(id,p)}return(rows||[]).map((row:any)=>{const id=String(row.deal_id);return{deal_id:id,business_status:String(row.business_status),...currentDealStatus(row),...currentPaymentStatus(row,financeByDeal.get(id),paymentByDeal.get(id),commercialByDeal.get(id)),...currentResourceStatus(row,resourceByDeal.get(id)),opened_at:row.opened_at,closed_at:row.closed_at,updated_at:row.updated_at}})}")
