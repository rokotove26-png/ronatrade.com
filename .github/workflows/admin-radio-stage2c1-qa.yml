name: Admin Radio Stage 2C.1 real activation QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/remaining-sections-ui.js'
      - 'functions/portal/remaining-sections-r2-base.js'
      - 'functions/portal/[[path]].js'
      - 'assets/portal-runtime/portal-radio-broadcast-v1.js'
      - 'supabase/functions/rona-owner-acceptance/index.ts'
      - 'supabase/functions/rona-portal-api/admin.ts'
      - 'supabase/functions/rona-portal-api/client-communications.ts'
      - 'supabase/functions/rona-portal-api/index.ts'
      - 'tests/admin-radio-stage2c1-real-activation.test.mjs'
      - 'tests/admin-radio-stage2b-notification-announcement.test.mjs'
      - 'tests/admin-radio-message-canonical-bridge-stage2a.test.mjs'
      - 'scripts/qa-admin-radio-stage2c1-production.mjs'
      - '.github/workflows/admin-radio-stage2c1-qa.yml'
      - '.github/workflows/admin-radio-stage2c1-production-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/remaining-sections-ui.js'
      - 'functions/portal/remaining-sections-r2-base.js'
      - 'functions/portal/[[path]].js'
      - 'assets/portal-runtime/portal-radio-broadcast-v1.js'
      - 'supabase/functions/rona-owner-acceptance/index.ts'
      - 'tests/admin-radio-stage2c1-real-activation.test.mjs'
      - 'scripts/qa-admin-radio-stage2c1-production.mjs'
      - '.github/workflows/admin-radio-stage2c1-qa.yml'
      - '.github/workflows/admin-radio-stage2c1-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2c1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage 2C.1 contract
        run: node --test tests/admin-radio-stage2c1-real-activation.test.mjs
      - name: Stage 2B publication non-regression
        run: node --test tests/admin-radio-stage2b-notification-announcement.test.mjs
      - name: Stage 2A MESSAGE non-regression
        run: node --test tests/admin-radio-message-canonical-bridge-stage2a.test.mjs
      - name: Production proof syntax
        run: node --check scripts/qa-admin-radio-stage2c1-production.mjs
      - name: Materialized Admin owner gate
        run: node scripts/materialize-admin-current-modules.mjs
      - name: Client visual freeze non-regression
        run: node scripts/qa-client-portal-visual-freeze.mjs
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha || github.event.before }} HEAD > /tmp/changed.txt || true
          cat /tmp/changed.txt
          if grep -E '^(functions/portal/deals-current-state-ui\.js|functions/portal/admin-payments|supabase/functions/.*/rail|supabase/migrations/.*(finance|payment|rail|deal))' /tmp/changed.txt; then
            echo 'STAGE2C1_SCOPE_GUARD=FAIL' >&2
            exit 1
          fi
          echo 'STAGE2C1_SCOPE_GUARD=PASS'
