name: client-multiclient-parity-430-qa

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    # Exact PR429/Issue430 lineage gate; unrelated Admin/audit changes must not fail this source lock.
    paths:
      - 'functions/portal/api/v1/client/**'
      - 'functions/portal/api/_browser-impersonation.js'
      - 'assets/portal-runtime/client-contract-download-v3.js'
      - 'assets/portal-runtime/portal-client-company-directory-authority-v1.js'
      - 'supabase/functions/rona-portal-api/**'
      - 'supabase/functions/rona-portal-api-candidate-20260817/**'
      - 'supabase/migrations/*client*'
      - 'scripts/build-pages-direct-canonical.mjs'
      - 'scripts/qa-client-multiclient-parity-430.mjs'
      - 'scripts/qa-client-owner-authenticated-*.mjs'
      - 'scripts/qa-client-portal-visual-freeze.mjs'
      - 'tests/*430*'
      - '_routes.json'
      - '.github/workflows/client-multiclient-parity-430-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-430:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE430_CURRENT_PRODUCTION_SHA: f8f0233a33b321e8fc54a7e404cd85e3eff21718
    steps:
      - name: Checkout exact history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Maintain strict verified release ancestry. The original PR429 historical
      # baseline is still checked separately by the unchanged QA script.
      - name: Bind issue 430 gate to exact current production
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$ISSUE430_CURRENT_PRODUCTION_SHA^{commit}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            merge_base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
            test "$merge_base" = "$ISSUE430_CURRENT_PRODUCTION_SHA"
          fi
          echo "ISSUE430_CURRENT_PRODUCTION_BASE=$ISSUE430_CURRENT_PRODUCTION_SHA"

      - name: Syntax and issue 430 regression contract
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/portal-runtime/client-contract-download-v3.js
          node --check functions/portal/api/v1/client/context.js
          # qa-client-multiclient-parity-430.mjs retains the historical PR429 base
          # solely for immutable governance comparison. Current PR base authority is
          # asserted in the preceding step against ISSUE430_CURRENT_PRODUCTION_SHA.
          GITHUB_EVENT_NAME=issue430_current_production_rebind node scripts/qa-client-multiclient-parity-430.mjs
          RONA_QA_ISOLATION_PREFLIGHT=1 node scripts/qa-client-owner-authenticated-candidate-430.mjs
          RONA_QA_ISOLATION_PREFLIGHT=1 node scripts/qa-client-owner-authenticated-lifecycle-430.mjs

      - name: Visual Freeze exact authorization remains active
        run: node scripts/qa-client-portal-visual-freeze.mjs

      - name: Canonical build remains visually frozen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          grep -Fq '/assets/portal-runtime/client-contract-download-v3.js?v=20260911-company-directory-canonical-claim-v12' dist/portal/client.html
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const integrity=JSON.parse(await readFile('dist/canonical-visual-integrity.json','utf8'));
          if(integrity.client_runtime?.source_sha256!=='d07d7cbee5fd3466c8729861a6e6a6acb4ba463ad6d89dd7f748209cacab6183') throw new Error('CLIENT_VISUAL_SOURCE_SHA_CHANGED');
          if(integrity.client_runtime?.source_bytes!==484970) throw new Error('CLIENT_VISUAL_SOURCE_BYTES_CHANGED');
          if(integrity.client_runtime?.visual_transform!=='NONE') throw new Error('CLIENT_VISUAL_TRANSFORM_CHANGED');
          console.log('ISSUE430_VISUAL_BASELINE=PASS');
          NODE
