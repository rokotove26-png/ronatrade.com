name: issue430 owner authorized browser QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  client-rail-route-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Diagnose live Client Rail route render for DEAL-2026-004
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee client-rail-route-diagnostic.log
          import {chromium} from 'playwright';
          import {writeFile} from 'node:fs/promises';

          const ORIGIN='https://ronaoil.com';
          const ISSUER='https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-g82-github-oidc-browser-qa-20260816';
          const AUD='rona-issue430-owner-uat-browser-v2';
          const SOURCE_USER='65d78d10-3722-4dba-9d77-8252e7c62527';
          const TARGET={client_id:'RONA-C002',contract_id:'RONA-C002-CTR-2026-001',deal_id:'DEAL-2026-004'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function pollEval(page,fn,arg,label,timeout=30000){
            const started=Date.now();
            while(Date.now()-started<timeout){
              try{if(await page.evaluate(fn,arg))return true}catch{}
              await sleep(100);
            }
            throw new Error(label+'_TIMEOUT');
          }

          async function oidc(){
            const base=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,token=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if(!base||!token)throw new Error('GITHUB_OIDC_ENV_MISSING');
            const url=base+(base.includes('?')?'&':'?')+'audience='+encodeURIComponent(AUD);
            const r=await fetch(url,{headers:{authorization:'Bearer '+token}});
            const j=await r.json().catch(()=>null);
            if(!r.ok||!j?.value)throw new Error('GITHUB_OIDC_'+r.status);
            return j.value;
          }
          async function issuer(path,body){
            const jwt=await oidc();
            const r=await fetch(ISSUER+path,{method:'POST',headers:{authorization:'Bearer '+jwt,'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body),signal:AbortSignal.timeout(60000)});
            const j=await r.json().catch(()=>null);
            if(!r.ok||!j?.ok)throw new Error('ISSUER_'+path+'_'+r.status+'_'+String(j?.code||'UNKNOWN'));
            return j;
          }

          let issued=null,browser=null,context=null;
          try{
            issued=await issuer('/issue',{portalUserId:SOURCE_USER});
            console.log('TEMP_CLIENT_SESSION=PASS');
            browser=await chromium.launch({headless:true});
            context=await browser.newContext({viewport:{width:1920,height:1080}});
            await context.addCookies([
              {name:'rona_portal_at',value:issued.access_token,url:ORIGIN+'/portal',httpOnly:true,secure:true,sameSite:'Lax'},
              {name:'rona_portal_rt',value:issued.refresh_token,url:ORIGIN+'/portal',httpOnly:true,secure:true,sameSite:'Lax'}
            ]);
            const page=await context.newPage();
            const runtimeErrors=[];
            page.on('pageerror',e=>runtimeErrors.push({kind:'pageerror',text:String(e?.message||e)}));
            page.on('console',m=>{if(m.type()==='error')runtimeErrors.push({kind:'console',text:m.text()})});

            await page.goto(ORIGIN+'/portal/client?_qa_rail_route='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await pollEval(page,()=>Boolean(window.RONA_CLIENT_CONTEXT?.getCurrentContext),'CLIENT_CONTEXT_API');

            const cards=page.locator('#clientCompanyGrid article.company-switch-card');
            await cards.first().waitFor({state:'attached',timeout:30000});
            await pollEval(page,t=>[...document.querySelectorAll('#clientCompanyGrid article.company-switch-card')].some(c=>c.dataset.ronaClientId===t.client_id&&c.dataset.ronaClientContractId===t.contract_id),TARGET,'TARGET_COMPANY_CARD');

            await page.evaluate(t=>{
              const card=[...document.querySelectorAll('#clientCompanyGrid article.company-switch-card')].find(c=>c.dataset.ronaClientId===t.client_id&&c.dataset.ronaClientContractId===t.contract_id);
              const b=card?.querySelector('[data-rona-company-factory-slot="action"]');
              if(!b)throw new Error('TARGET_COMPANY_ACTION_MISSING');
              if(card?.dataset.ronaCompanyCurrent!=='true')b.click();
            },TARGET);
            await pollEval(page,t=>{const c=window.RONA_CLIENT_CONTEXT?.getCurrentContext?.();return c?.client_id===t.client_id&&c?.contract_id===t.contract_id},TARGET,'TARGET_CONTEXT');
            console.log('TARGET_CONTEXT=PASS');

            const railNav=page.locator('#nav button[data-page="rail"],#nav button[data-page="monitoring"]').first();
            await railNav.waitFor({state:'visible',timeout:30000});
            await railNav.click();
            await page.locator('.rona-rail-v7-map-viewport').first().waitFor({state:'visible',timeout:45000});

            const select=page.locator('.rona-rail-v6-select').first();
            if(await select.count()){
              const options=await select.locator('option').evaluateAll(opts=>opts.map(o=>({value:o.value,text:o.textContent||''})));
              const target=options.find(o=>String(o.text).includes('DEAL-2026-004')||String(o.value).includes('DEAL-2026-004'));
              console.log('DEAL_OPTIONS='+JSON.stringify(options));
              if(target){
                await select.selectOption(target.value);
                await sleep(1200);
              }
            }

            const canonical=await page.evaluate(async t=>{
              const url='/portal/api/v1/client/rail-canonical?clientId='+encodeURIComponent(t.client_id)+'&contractId='+encodeURIComponent(t.contract_id)+'&_qa='+Date.now();
              const r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{accept:'application/json'}});
              const j=await r.json().catch(()=>null);
              const d=j?.data||{};
              const pick=(obj,id,key)=>obj?.[id]||obj?.[key]||null;
              const deal=(d.deals||[]).find(x=>x.deal_id===t.deal_id)||null;
              const planned=pick(d.plannedRouteByDeal,t.deal_id,deal?.deal_key);
              const actual=pick(d.actualRouteByDeal,t.deal_id,deal?.deal_key);
              const remaining=pick(d.remainingRouteByDeal,t.deal_id,deal?.deal_key);
              const cohorts=pick(d.routeCohortsByDeal,t.deal_id,deal?.deal_key);
              return {
                status:r.status,ok:j?.ok===true,contract:j?.projection_contract||null,
                deal,
                plannedPoints:Array.isArray(planned?.points)?planned.points.length:null,
                actualPoints:Array.isArray(actual?.points)?actual.points.length:null,
                remainingPoints:Array.isArray(remaining?.points)?remaining.points.length:null,
                cohortCount:Array.isArray(cohorts)?cohorts.length:null,
                topKeys:Object.keys(d).sort()
              };
            },TARGET);
            console.log('CANONICAL='+JSON.stringify(canonical));

            await page.waitForTimeout(1500);
            const dom=await page.evaluate(t=>{
              const canvas=document.querySelector('#page-monitoring .rona-rail-v4-map-canvas,#page-rail .rona-rail-v4-map-canvas');
              const state=canvas?.__ronaRailMapState||null;
              const routePane=canvas?.querySelector('.rona-rail-v7-route-layer');
              const tilePane=canvas?.querySelector('.rona-rail-v7-tiles');
              const svg=routePane?.querySelector('.rona-rail-v7-route-svg');
              const polylines=[...(svg?.querySelectorAll('polyline')||[])].map(p=>({
                className:p.getAttribute('class'),
                pointsCount:String(p.getAttribute('points')||'').trim().split(/\s+/).filter(Boolean).length,
                stroke:getComputedStyle(p).stroke,
                strokeWidth:getComputedStyle(p).strokeWidth,
                opacity:getComputedStyle(p).opacity,
                display:getComputedStyle(p).display,
                visibility:getComputedStyle(p).visibility
              }));
              const md=window.__RONA_RAIL_MAP_DATA__||{};
              const css=e=>e?{zIndex:getComputedStyle(e).zIndex,display:getComputedStyle(e).display,visibility:getComputedStyle(e).visibility,opacity:getComputedStyle(e).opacity,position:getComputedStyle(e).position}:null;
              return {
                target:t,
                currentContext:window.RONA_CLIENT_CONTEXT?.getCurrentContext?.()||null,
                selectedDeal:window.__RONA_RAIL_SELECTED_DEAL_KEY__||null,
                mapData:{
                  dealKey:md.dealKey||null,dealId:md.dealId||null,
                  plannedPoints:Array.isArray(md.plannedRoute?.points)?md.plannedRoute.points.length:null,
                  actualPoints:Array.isArray(md.actualRoute?.points)?md.actualRoute.points.length:null,
                  remainingPoints:Array.isArray(md.remainingRoute?.points)?md.remainingRoute.points.length:null,
                  cohortCount:Array.isArray(md.routeCohorts)?md.routeCohorts.length:null,
                  wagonPositions:Array.isArray(md.wagonPositions)?md.wagonPositions.length:null
                },
                state:{
                  exists:!!state,
                  dealKey:state?.context?.dealKey||null,
                  dealId:state?.context?.dealId||null,
                  stateMapDataDealId:state?.context?.mapData?.dealId||null,
                  statePlannedPoints:Array.isArray(state?.context?.mapData?.plannedRoute?.points)?state.context.mapData.plannedRoute.points.length:null,
                  stateActualPoints:Array.isArray(state?.context?.mapData?.actualRoute?.points)?state.context.mapData.actualRoute.points.length:null,
                  wagons:Array.isArray(state?.wagons)?state.wagons.length:null
                },
                routePane:{children:routePane?.children.length||0,style:css(routePane)},
                tilePane:{children:tilePane?.children.length||0,style:css(tilePane)},
                svg:{exists:!!svg,style:css(svg),polylineCount:polylines.length},
                polylines,
                markerCount:canvas?.querySelectorAll('.rona-rail-v7-marker').length||0,
                routeRender:window.__RONA_RAIL_ROUTE_COHORT_RENDER__||null,
                clientRenderer:window.__RONA_CLIENT_RAIL_CANONICAL_ROUTE_RENDERER__||null,
                clientProduction:window.__RONA_CLIENT_RAIL_PRODUCTION__||null,
                errors:window.__RONA_CLIENT_RAIL_LAST_ERROR__||null
              };
            },TARGET);
            console.log('DOM='+JSON.stringify(dom));
            console.log('RUNTIME_ERRORS='+JSON.stringify(runtimeErrors));
            await page.screenshot({path:'client-rail-route-diagnostic.png',fullPage:true});
            await writeFile('client-rail-route-diagnostic.json',JSON.stringify({canonical,dom,runtimeErrors},null,2));
          } finally {
            if(context)await context.close().catch(()=>{});
            if(browser)await browser.close().catch(()=>{});
            if(issued?.auth_user_id){
              const rev=await issuer('/revoke',{accessToken:issued.access_token,sessionId:issued.session_id,authUserId:issued.auth_user_id});
              console.log('TEMP_CLIENT_CLEANUP='+(rev?.revoked&&rev?.session_absent?'PASS':'FAIL'));
            }
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-rail-route-diagnostic-${{ github.run_id }}
          path: |
            client-rail-route-diagnostic.log
            client-rail-route-diagnostic.json
            client-rail-route-diagnostic.png
          if-no-files-found: warn
          retention-days: 7
