name: issue430 owner authorized browser QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  valid-auth-password-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove valid temporary account password grant and cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const ISSUER='https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-g82-github-oidc-browser-qa-20260816';
          const AUDIENCE='rona-issue430-owner-uat-browser-v2';
          const SOURCE_PORTAL_USER='724ff368-5ba3-449a-bd19-665ee487ee6f';
          async function oidc(){
            const base=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,token=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if(!base||!token)throw new Error('GITHUB_OIDC_ENV_MISSING');
            const url=base+(base.includes('?')?'&':'?')+'audience='+encodeURIComponent(AUDIENCE);
            const r=await fetch(url,{headers:{authorization:'Bearer '+token}});
            const j=await r.json().catch(()=>null);
            if(!r.ok||!j?.value)throw new Error('GITHUB_OIDC_'+r.status);
            return j.value;
          }
          async function call(path,body){
            const jwt=await oidc(),started=Date.now();
            const r=await fetch(ISSUER+path,{method:'POST',headers:{authorization:'Bearer '+jwt,'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify(body),signal:AbortSignal.timeout(60000)});
            const j=await r.json().catch(()=>null);
            console.log(path+' '+JSON.stringify({status:r.status,ms:Date.now()-started,code:j?.code||null,ok:j?.ok===true,mode:j?.mode||null}));
            return {r,j};
          }
          let issued=null;
          try{
            const out=await call('/issue',{portalUserId:SOURCE_PORTAL_USER});
            if(!out.r.ok||!out.j?.ok)throw new Error('ISSUE_FAILED_'+out.r.status+'_'+String(out.j?.code||'UNKNOWN'));
            issued=out.j;
            if(!issued.auth_user_id||!issued.access_token)throw new Error('ISSUE_SESSION_MISSING');
            console.log('VALID_TEMP_PASSWORD_GRANT=PASS');
          } finally {
            if(issued?.auth_user_id){
              const rev=await call('/revoke',{accessToken:issued.access_token,sessionId:issued.session_id,authUserId:issued.auth_user_id});
              if(!rev.r.ok||!rev.j?.revoked||!rev.j?.session_absent)throw new Error('REVOKE_NOT_PROVEN');
              console.log('VALID_TEMP_SESSION_CLEANUP=PASS');
            }
          }
          NODE
