name: trade-form-mailer-smoke-20260826

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: write

jobs:
  delivery-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1

      - name: Probe production delivery backends
        shell: bash
        run: |
          set -u
          mkdir -p .probe ops
          code=$(curl -sS -o .probe/diagnostic.json -w '%{http_code}' \
            'https://ronaoil.com/api/forms/delivery-diagnostic?token=a5c7e2f1-948d-4e56-8c2a-79f6b4426f3d' \
            2>.probe/diagnostic.stderr || true)
          body=$(cat .probe/diagnostic.json 2>/dev/null || true)
          err=$(tr '\n' ' ' < .probe/diagnostic.stderr 2>/dev/null || true)
          {
            echo "timestamp=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
            echo "diagnostic_http=${code}"
            echo "diagnostic_response=${body}"
            echo "diagnostic_curl_error=${err}"
          } > ops/trade-form-delivery-diagnostic-20260826.txt
          cat ops/trade-form-delivery-diagnostic-20260826.txt

      - name: Commit delivery diagnostic proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rona-trade-form-e2e'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/trade-form-delivery-diagnostic-20260826.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record production trade delivery diagnostic'
          git push origin HEAD:release/public-go-live-v1.1
