name: trade-form-mailer-smoke-20260826

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: write

jobs:
  inspect-live-trade-form:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1

      - name: Capture embedded form source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .probe
          curl -fLsS --retry 3 --max-time 60 'https://ronaoil.com/pages/home_large.html?layout=large' -o .probe/home_large.html
          curl -fLsS --retry 3 --max-time 60 'https://ronaoil.com/pages/home_compact.html?layout=compact' -o .probe/home_compact.html
          python3 - <<'PY'
          import pathlib,re
          def compact(x,n=4200): return re.sub(r'\s+',' ',x).strip()[:n]
          needles=['formsubmit.co','office_kg@ronaoil.com','/api/forms/trade','uiSceneFrame','compactFrame','.srcdoc','srcdoc =','srcdoc=','fetch(','Отправить заявку','submitBtn','submit']
          out=[]
          for name in ('home_large','home_compact'):
              s=(pathlib.Path('.probe')/(name+'.html')).read_text('utf-8',errors='replace')
              out.append(f'===== {name} bytes={len(s)} =====')
              low=s.lower()
              for needle in needles:
                  nlow=needle.lower(); positions=[]; pos=0
                  while True:
                      j=low.find(nlow,pos)
                      if j<0: break
                      positions.append(j); pos=j+len(nlow)
                  out.append(f'NEEDLE {needle!r} count={len(positions)} positions={positions[:30]}')
                  for j in positions[:8]:
                      out.append(f'  AT {j}: '+compact(s[max(0,j-1600):min(len(s),j+3200)]))
          pathlib.Path('ops/trade-form-live-dom-20260826.txt').write_text('\n'.join(out),'utf-8')
          PY
          sed -n '1,320p' ops/trade-form-live-dom-20260826.txt

      - name: Commit live source probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rona-trade-form-probe'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/trade-form-live-dom-20260826.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record embedded trade form source probe'
          git push origin HEAD:release/public-go-live-v1.1
