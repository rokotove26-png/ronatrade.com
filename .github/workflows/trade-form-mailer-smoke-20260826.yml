name: trade-form-mailer-smoke-20260826

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml
      - functions/api/forms/delivery-diagnostic.js

jobs:
  delivery-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Pages deployment and isolate Brevo vs MAILER
        shell: bash
        run: |
          set -euo pipefail
          url='https://rona-trade-public.pages.dev/api/forms/delivery-diagnostic?token=a5c7e2f1-948d-4e56-8c2a-79f6b4426f3d'
          body=''
          code=''
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o diagnostic.json -w '%{http_code}' "$url" || true)
            body=$(cat diagnostic.json 2>/dev/null || true)
            echo "attempt=${attempt} http=${code} body=${body}"
            if [ "$code" = '200' ] && printf '%s' "$body" | grep -q '"success":true'; then
              break
            fi
            sleep 5
          done
          echo "FINAL HTTP ${code}"
          printf '%s\n' "$body"
          test "$code" = '200'
          printf '%s' "$body" | grep -q '"success":true'
