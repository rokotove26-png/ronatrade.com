name: trade-form-production-e2e-diagnostic

on:
  push:
    branches:
      - diag/trade-form-e2e-20260826
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production trade form end to end
        shell: bash
        run: |
          set -u
          mkdir -p .probe
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          cat > .probe/payload.json <<JSON
          {
            "Контактное лицо": "RONA SYSTEM TEST",
            "Компания": "RONA Trade production E2E ${stamp}",
            "Страна регистрации компании": "Kyrgyzstan",
            "Нефтепродукт": "СПБТ / СУГ",
            "Страна назначения груза": "Kazakhstan",
            "Ориентировочный объем, тонн": "1",
            "Телефон": "+996000000000",
            "E-mail": "office_kg@ronaoil.com",
            "Комментарий": "Synthetic production E2E test ${stamp}. Ignore.",
            "Источник": "github-actions-production-e2e",
            "Дата отправки": "${stamp}",
            "Language": "RU",
            "URL страницы / источник": "https://ronaoil.com/"
          }
          JSON

          form_http=$(curl -sS -o .probe/form-response.json -w '%{http_code}' \
            --max-time 25 \
            -X POST 'https://ronaoil.com/api/forms/trade' \
            -H 'Origin: https://ronaoil.com' \
            -H 'Referer: https://ronaoil.com/' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data-binary @.probe/payload.json 2>.probe/form-stderr || true)
          form_body=$(cat .probe/form-response.json 2>/dev/null || true)
          form_err=$(tr '\n' ' ' < .probe/form-stderr 2>/dev/null || true)
          echo "FORM_HTTP=${form_http}"
          echo "FORM_RESPONSE=${form_body}"
          echo "FORM_CURL_ERROR=${form_err}"

          if [ "${form_http}" != "202" ]; then
            diag_http=$(curl -sS -o .probe/diag-response.json -w '%{http_code}' \
              --max-time 25 \
              'https://ronaoil.com/api/forms/delivery-diagnostic?token=a5c7e2f1-948d-4e56-8c2a-79f6b4426f3d' \
              2>.probe/diag-stderr || true)
            diag_body=$(cat .probe/diag-response.json 2>/dev/null || true)
            diag_err=$(tr '\n' ' ' < .probe/diag-stderr 2>/dev/null || true)
            echo "DIAG_HTTP=${diag_http}"
            echo "DIAG_RESPONSE=${diag_body}"
            echo "DIAG_CURL_ERROR=${diag_err}"
          fi
