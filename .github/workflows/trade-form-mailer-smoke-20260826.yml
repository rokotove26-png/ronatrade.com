name: trade-form-mailer-smoke-20260826

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: write

jobs:
  formsubmit-fallback-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1

      - name: Probe legacy FormSubmit delivery endpoint
        shell: bash
        run: |
          set -u
          mkdir -p .probe ops
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          cat > .probe/payload.json <<JSON
          {
            "Контактное лицо": "RONA SYSTEM TEST",
            "Компания": "RONA Trade FormSubmit probe ${stamp}",
            "Страна регистрации компании": "Kyrgyzstan",
            "Нефтепродукт": "СПБТ / СУГ",
            "Страна назначения груза": "Kazakhstan",
            "Ориентировочный объем, тонн": "1",
            "Телефон": "+996000000000",
            "E-mail": "office_kg@ronaoil.com",
            "Комментарий": "Synthetic delivery probe ${stamp}. Ignore.",
            "_subject": "RONA Trade — form delivery probe ${stamp}",
            "_template": "table",
            "_captcha": "false"
          }
          JSON
          code=$(curl -sS -L -o .probe/response.json -w '%{http_code}' \
            -X POST 'https://formsubmit.co/ajax/office_kg@ronaoil.com' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data-binary @.probe/payload.json 2>.probe/stderr || true)
          body=$(cat .probe/response.json 2>/dev/null || true)
          err=$(tr '\n' ' ' < .probe/stderr 2>/dev/null || true)
          {
            echo "timestamp=${stamp}"
            echo "formsubmit_http=${code}"
            echo "formsubmit_response=${body}"
            echo "formsubmit_curl_error=${err}"
          } > ops/trade-form-formsubmit-probe-20260826.txt
          cat ops/trade-form-formsubmit-probe-20260826.txt

      - name: Commit FormSubmit probe proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rona-trade-form-e2e'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/trade-form-formsubmit-probe-20260826.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record FormSubmit delivery probe'
          git push origin HEAD:release/public-go-live-v1.1
