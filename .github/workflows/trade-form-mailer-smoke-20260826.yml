name: trade-form-mailer-smoke-20260826

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: write

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1

      - name: Verify public form transport and delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .probe ops

          curl -fsS -D .probe/home.headers -o .probe/home.html \
            'https://ronaoil.com/pages/home_large.html?layout=large'
          grep -qi '^x-rona-form-transport: controlled-v1.1' .probe/home.headers
          grep -q 'rona-controlled-form-transport-v1-1' .probe/home.html
          grep -q "'https://formsubmit.co/ajax/office_kg@ronaoil.com':'/api/forms/trade'" .probe/home.html

          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          cat > .probe/payload.json <<JSON
          {
            "Контактное лицо": "RONA SYSTEM TEST",
            "Компания": "RONA Trade E2E ${stamp}",
            "Страна регистрации компании": "Kyrgyzstan",
            "Нефтепродукт": "СПБТ / СУГ",
            "Страна назначения груза": "Kazakhstan",
            "Ориентировочный объем, тонн": "1",
            "Телефон": "+996000000000",
            "E-mail": "office_kg@ronaoil.com",
            "Комментарий": "Synthetic production form E2E test ${stamp}. Ignore.",
            "Источник": "Production E2E smoke",
            "Дата отправки": "${stamp}",
            "Language": "RU",
            "URL страницы / источник": "https://ronaoil.com/pages/home_large.html?layout=large"
          }
          JSON

          code=$(curl -sS -o .probe/response.json -w '%{http_code}' \
            -X POST 'https://ronaoil.com/api/forms/trade' \
            -H 'Origin: https://ronaoil.com' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data-binary @.probe/payload.json)

          body=$(cat .probe/response.json)
          echo "HTTP ${code} ${body}"
          test "$code" = '202'
          python3 - <<'PY'
          import json
          d=json.load(open('.probe/response.json',encoding='utf-8'))
          assert d.get('success') is True, d
          assert d.get('status') == 'accepted', d
          assert d.get('submission_id'), d
          PY

          {
            echo "timestamp=${stamp}"
            echo "transport_header=controlled-v1.1"
            echo "legacy_formsubmit_bridge=present"
            echo "api_http=${code}"
            echo "api_response=${body}"
          } > ops/trade-form-production-e2e-20260826.txt

      - name: Commit production E2E proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rona-trade-form-e2e'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/trade-form-production-e2e-20260826.txt
          git commit -m 'Record production trade form E2E proof'
          git push origin HEAD:release/public-go-live-v1.1
