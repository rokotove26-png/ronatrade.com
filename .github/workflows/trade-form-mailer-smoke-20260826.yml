name: trade-form-production-e2e-restored

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for production deployment
        shell: bash
        run: sleep 45

      - name: Probe production trade form end to end
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .probe
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          cat > .probe/payload.json <<JSON
          {
            "Контактное лицо": "RONA SYSTEM TEST",
            "Компания": "RONA Trade production E2E ${stamp}",
            "Страна регистрации компании": "Kyrgyzstan",
            "Нефтепродукт": "СПБТ / СУГ",
            "Страна назначения груза": "Kazakhstan",
            "Ориентировочный объем, тонн": "1",
            "Телефон": "+996000000000",
            "E-mail": "office_kg@ronaoil.com",
            "Комментарий": "Synthetic production E2E test ${stamp}. Ignore.",
            "Источник": "github-actions-production-e2e",
            "Дата отправки": "${stamp}",
            "Language": "RU",
            "URL страницы / источник": "https://ronaoil.com/"
          }
          JSON

          form_http=$(curl -sS -o .probe/form-response.json -w '%{http_code}' --max-time 40 \
            -X POST 'https://ronaoil.com/api/forms/trade' \
            -H 'Origin: https://ronaoil.com' \
            -H 'Referer: https://ronaoil.com/' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data-binary @.probe/payload.json)
          form_body=$(cat .probe/form-response.json)
          echo "FORM_HTTP=${form_http}"
          echo "FORM_RESPONSE=${form_body}"
          test "${form_http}" = "202"
          printf '%s' "${form_body}" | grep -q '"success":true'
          printf '%s' "${form_body}" | grep -q '"submission_id"'
