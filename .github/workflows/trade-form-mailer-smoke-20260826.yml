name: trade-form-mailer-smoke-20260826

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Isolate custom-domain vs Pages production POST
        shell: bash
        run: |
          set -u
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body=$(cat <<JSON
          {
            "Контактное лицо":"RONA SYSTEM TEST",
            "Компания":"RONA Trade synthetic isolate ${ts}",
            "Страна регистрации компании":"Kyrgyzstan",
            "Нефтепродукт":"TEST ONLY",
            "Страна назначения груза":"Kyrgyzstan",
            "Ориентировочный объем, тонн":"1",
            "E-mail":"office_kg@ronaoil.com",
            "Комментарий":"Synthetic diagnostic. Ignore.",
            "Источник":"GitHub Actions isolated production probe",
            "Дата отправки":"${ts}",
            "Language":"RU",
            "URL страницы / источник":"https://ronaoil.com/"
          }
          JSON
          )

          probe() {
            label="$1"; url="$2"; origin="$3"
            echo "===== ${label} ====="
            curl -sS -D "${label}.headers" -o "${label}.body" \
              -X POST "$url/api/forms/trade" \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              --data "$body" || true
            head -n 30 "${label}.headers" || true
            echo "--- BODY ---"
            cat "${label}.body" || true
            echo
          }

          probe custom https://ronaoil.com https://ronaoil.com
          probe pages https://rona-trade-public.pages.dev https://rona-trade-public.pages.dev
          probe olddeploy https://3bef8b32.rona-trade-public.pages.dev https://3bef8b32.rona-trade-public.pages.dev

# Merge-trigger probe 2026-08-26
