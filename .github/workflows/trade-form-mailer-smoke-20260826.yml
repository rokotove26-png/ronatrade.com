name: trade-form-alt-sender-dns-diagnostic

on:
  push:
    branches:
      - diag/trade-form-e2e-20260826
    paths:
      - .github/workflows/trade-form-mailer-smoke-20260826.yml

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect candidate sender domains without changes
        shell: bash
        run: |
          set -u
          for domain in ronaoil.com ronatrade.com; do
            echo "===== ${domain} ====="
            echo 'NS:'
            dig +short NS "$domain" || true
            echo 'MX root:'
            dig +short MX "$domain" || true
            echo 'TXT root:'
            dig +short TXT "$domain" || true
            echo 'DMARC:'
            dig +short TXT "_dmarc.${domain}" || true
            echo 'cf-bounce MX:'
            dig +short MX "cf-bounce.${domain}" || true
            echo 'cf-bounce TXT:'
            dig +short TXT "cf-bounce.${domain}" || true
            echo 'DKIM candidates:'
            for sel in cf2024 cf2025 cf2026 cfdkim1 cfdkim2; do
              out=$(dig +short TXT "${sel}._domainkey.${domain}" || true)
              if [ -n "$out" ]; then echo "${sel}: ${out}"; fi
            done
            echo
          done
