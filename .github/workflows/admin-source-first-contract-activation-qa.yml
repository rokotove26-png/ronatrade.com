name: Admin source-first contract activation QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches: [release/public-go-live-v1.1]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  admin-source-first-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current-only source-first authority
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cmp -s portal-src/current/admin.html dist/portal/admin.html
          grep -q 'data-rona-admin-shell="current-only-v2"' dist/portal/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" dist/portal/admin.html
          grep -q 'data-page="agent-settlements"' dist/portal/admin.html
          grep -q 'data-page="claims"' dist/portal/admin.html
          ! grep -q 'v3.4.13' dist/portal/admin.html
          node --check functions/portal/clients-agents-current-ui.js
          node --check 'functions/portal/admin-authority/[[path]].js'
          grep -q "AUTH='/portal/admin-authority'" functions/portal/clients-agents-current-ui.js
          grep -q "dataset.ronaCreateAccess='primary'" functions/portal/clients-agents-current-ui.js
          grep -q '/access/users' functions/portal/clients-agents-current-ui.js
          ! grep -q 'harvestLegacy' functions/portal/clients-agents-current-ui.js
          grep -q 'ADMIN_CLIENT_AUTHORITY_API' 'functions/portal/admin-authority/[[path]].js'
          grep -q 'ADMIN_EXCLUSIVE_CLIENT_V2' supabase/functions/rona-admin-client-authority/index.ts
          grep -q 'ADMIN_CONTRACT_AUTHORITY_ACTIVATED' supabase/functions/rona-admin-client-authority/index.ts
          grep -q 'client_user_pending_company_bindings' supabase/functions/rona-admin-client-authority/index.ts
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.architecture!=='CURRENT_ONLY_ADMIN_AND_CLIENT_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.legacy_runtime_in_deployment!==false||x.client_runtime?.legacy_runtime_in_deployment!==false)process.exit(1)"
          echo 'SOURCE_FIRST_CURRENT_ONLY_ADMIN=PASS'
      - name: Wait for exact production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify production source-first boundary without mutation
        if: github.event_name == 'push'
        run: |
          node scripts/verify-admin-current-only-production.mjs
          node <<'NODE'
          for(const p of ['/portal/admin-authority/bootstrap','/portal/admin-authority/agent-readiness']){const r=await fetch('https://ronaoil.com'+p,{redirect:'manual',cache:'no-store'});if(![401,403].includes(r.status))throw new Error(p+' fail-closed status '+r.status)}
          console.log('SOURCE_FIRST_CURRENT_ONLY_PRODUCTION=PASS');
          NODE
