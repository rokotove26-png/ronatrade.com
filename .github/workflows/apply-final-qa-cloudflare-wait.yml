name: Apply final QA deployment synchronization
on:
  push:
    branches: ['release/public-go-live-v1.1']
    paths: ['.github/workflows/apply-final-qa-cloudflare-wait.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - name: Synchronize final QA with Cloudflare deployment
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/final-production-activation-qa.yml')
          s=p.read_text()
          old="async function origin(){if(process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1')return 'https://ronaoil.com';for(let i=0;i<60;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-FINAL-QA'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');const m=String(cf?.output?.summary||'').match(/https:\\/\\/[a-z0-9-]+\\.rona-trade-public\\.pages\\.dev/i);if(m)return m[0]}await sleep(5000)}throw new Error('Cloudflare deployment URL unavailable')}"
          new="async function origin(){for(let i=0;i<90;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-FINAL-QA'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.status==='completed'&&x.conclusion==='success');if(cf){if(process.env.GITHUB_REF_NAME==='release/public-go-live-v1.1'){await sleep(4000);return 'https://ronaoil.com'}const m=String(cf?.output?.summary||'').match(/https:\\/\\/[a-z0-9-]+\\.rona-trade-public\\.pages\\.dev/i);if(m)return m[0]}}await sleep(5000)}throw new Error('Cloudflare deployment unavailable for current commit')}"
          if s.count(old)!=1: raise SystemExit(f'ORIGIN_NEEDLE_COUNT={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit synchronization fix
        run: |
          git config user.name 'RONA Production QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/final-production-activation-qa.yml
          git commit -m 'Wait for current Cloudflare deployment before final production QA'
          git push origin HEAD:${GITHUB_REF_NAME}
