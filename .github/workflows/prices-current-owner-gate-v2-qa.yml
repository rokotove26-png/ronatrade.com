name: RONA Prices owner approval v2

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/prices-current-ui.js'
      - 'functions/portal/price-updates-api.js'
      - 'supabase/migrations/*prices*owner*gate*.sql'
      - '.github/workflows/prices-current-owner-gate-v2-qa.yml'
  workflow_dispatch:

jobs:
  prices-owner-gate-v2:
    name: Verify Prices owner approval v2 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check functions/portal/prices-current-ui.js
          node --check functions/portal/price-updates-api.js
      - name: Verify canonical Admin Prices owner gate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ui=fs.readFileSync('functions/portal/prices-current-ui.js','utf8');
          const api=fs.readFileSync('functions/portal/price-updates-api.js','utf8');
          const mig=fs.readFileSync('supabase/migrations/20260914002125_recover_admin_prices_owner_gate_20260914.sql','utf8');
          const need=(text,patterns,label)=>{for(const p of patterns){if(!text.includes(p))throw new Error(label+': missing '+p)}};

          need(ui,[
            '20260914-pending-canonical-matrix-v1',
            'prices-2a-canonical-v4',
            'function isFullPriceProposal(p)',
            'function proposalMatrix(p)',
            'Прайс-лист на согласование',
            "table(['Продукт',...bases.map(b=>b.label)]",
            'gs.map(g=>[g.product,...bases.map(b=>priceValue(g.bases[b.key]))])',
            'if(isFullPriceProposal(p))details.append(proposalMatrix(p));else',
            "table(['Позиция','Поле','Было','Предлагается','Куда попадёт'],rows)",
            'Ожидает решения',
            'Отклонить',
            'Обновить',
            'currentPublicationId'
          ],'Prices UI');

          need(api,[
            "op==='workspace'",
            "op==='list-decision'",
            'owner_prices_admin_workspace',
            'owner_decide_received_price_list',
            "op==='apply'",
            "op==='reject'",
            "op==='audience'",
            'owner_apply_price_change_proposal',
            'owner_reject_price_change_proposal',
            'owner_set_price_publication_audience',
            "request.method==='POST'&&!sameOrigin(request)"
          ],'Prices API');

          need(mig,[
            'create or replace function public.owner_price_updates_bootstrap()',
            "p.status::text='PUBLISHED'",
            "c.internal_state='CURRENT'",
            'materialize_owner_price_list_control_v1',
            "when portal_private.owner_price_list_controls.internal_state='CURRENT' then 'CURRENT'",
            'owner_decide_received_price_list',
            "p_decision text",
            "v_decision not in ('ACCEPT','REJECT')",
            'OWNER_RECEIVED_PRICE_LIST_ACCEPTED',
            'OWNER_RECEIVED_PRICE_LIST_REJECTED',
            'RECOVERY_R9_PRECONDITION_FAILED',
            'RECOVERY_R10_PRECONDITION_FAILED',
            'RECOVERY_OCT_R1_PRECONDITION_FAILED',
            'owner_prices_publication_action',
            "p.status::text='PUBLISHED'",
            "c.internal_state='CURRENT'",
            "revoke all on function public.owner_decide_received_price_list(text,text,text) from anon",
            "grant execute on function public.owner_decide_received_price_list(text,text,text) to authenticated,service_role"
          ],'recovery migration');

          if(/CREATE_SUPERSEDING_PRICE_PUBLICATION_AND_PUBLISH_TO_LK/.test(ui+api)) throw new Error('Operations auto-publication path leaked into Admin runtime');
          console.log('PRICES_CANONICAL_ADMIN_OWNER_GATE=PASS');
          NODE
