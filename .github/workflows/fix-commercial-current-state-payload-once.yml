name: Fix commercial current-state payload once

on:
  push:
    branches:
      - fix/commercial-current-state-payload-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commercial-current-state-payload-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded Commercial Director current-state projection
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='supabase/functions/rona-ai-read-only/index.js';
          let s=fs.readFileSync(file,'utf8');
          if(!s.includes('async function currentPublicationIndex(){')){
            const marker='async function currentResource(){';
            if(!s.includes(marker)) throw new Error('currentResource marker missing');
            const fn=`async function currentPublicationIndex(){\n  return await sql.unsafe(\`select p.publication_id,p.publication_type::text,p.status::text,p.prepared_at,p.published_at,p.updated_at,\n      (select count(*)::int from portal_private.publication_items pi where pi.publication_key=p.id and pi.lifecycle_state='ACTIVE' and pi.authority_state not in ('SUPERSEDED','REJECTED') and (\${sourceClause('pi')})) as item_count\n    from portal_private.publications p where p.lifecycle_state='ACTIVE' and p.authority_state not in ('SUPERSEDED','REJECTED') and p.status::text not in ('SUPERSEDED','ARCHIVED') and (\${sourceClause('p')}) order by p.prepared_at desc\`);\n}\n`;
            s=s.replace(marker,fn+marker);
          }
          const old=`  if(role==='MARKET_ANALYST'||role==='COMMERCIAL_DIRECTOR') {\n    const applications=await currentApplications();\n    return {...base,\n      clients:await currentClients(),contracts:await currentContracts(),applications,deals:await currentDeals(),commercialRecords:applications,\n      market:await currentPublications(),publications:await currentPublications(),tasks:await currentTasks(role),events:await currentPortalEvents(role),\n    };\n  }`;
          const replacement=`  if(role==='MARKET_ANALYST'||role==='COMMERCIAL_DIRECTOR') {\n    const applications=await currentApplications();\n    const publications=await currentPublicationIndex();\n    const market={\n      projection:'COMMERCIAL_CURRENT_STATE_COMPACT_V1',\n      publication_count:publications.length,\n      active_item_count:publications.reduce((n,x)=>n+Number(x.item_count||0),0),\n      latest_updated_at:publications[0]?.updated_at??null,\n      publication_items_in_current_state:false,\n      full_market_source_tool:'market_data',\n    };\n    return {...base,\n      clients:await currentClients(),contracts:await currentContracts(),applications,deals:await currentDeals(),commercialRecords:applications,\n      market,publications,tasks:await currentTasks(role),events:await currentPortalEvents(role),\n    };\n  }`;
          if(s.includes(old)) s=s.replace(old,replacement);
          else if(!s.includes("projection:'COMMERCIAL_CURRENT_STATE_COMPACT_V1'")) throw new Error('commercial current-state block not found');
          fs.writeFileSync(file,s);
          NODE
          node --check supabase/functions/rona-ai-read-only/index.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('supabase/functions/rona-ai-read-only/index.js','utf8');
          const must=['async function currentPublicationIndex(){',"projection:'COMMERCIAL_CURRENT_STATE_COMPACT_V1'",'publication_items_in_current_state:false',"full_market_source_tool:'market_data'",'market,publications,tasks:await currentTasks(role)'];
          for(const m of must) if(!s.includes(m)) throw new Error('missing marker: '+m);
          if(s.includes('market:await currentPublications(),publications:await currentPublications()')) throw new Error('duplicated full publication payload remains');
          console.log('COMMERCIAL_CURRENT_STATE_PAYLOAD_QA=PASS');
          NODE
      - name: Commit source patch
        run: |
          if git diff --quiet -- supabase/functions/rona-ai-read-only/index.js; then
            echo 'No source delta'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/rona-ai-read-only/index.js
          git commit -m 'fix: bound commercial current-state publication payload'
          git push origin HEAD:fix/commercial-current-state-payload-20260903
