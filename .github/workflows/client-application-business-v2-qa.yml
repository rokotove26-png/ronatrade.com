name: Client Application Business V2 QA

on:
  push:
    branches: [feat/client-applications-systemic-lifecycle-p1]

permissions:
  contents: write

concurrency:
  group: pr548-reviewed-rework-transport-registered
  cancel-in-progress: false

jobs:
  postgres17-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-applications-systemic-lifecycle-p1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply System Admin reviewed rework without workflow-file push
        shell: bash
        run: |
          set -euo pipefail
          TRANSPORT_HEAD="$(git rev-parse HEAD)"
          BASE=83b4157edb18500467bf6b26a6d3dd5eabba3d98
          git merge-base --is-ancestor "$BASE" HEAD
          cat .github/pr548-rework/part-* > /tmp/pr548.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pr548.patch')
          s=p.read_text()
          repairs={
            "if(path==='/client/analytics-feed'&&method==='GET')retur['owner_analytics_client_feed',{}]":"if(path==='/client/analytics-feed'&&method==='GET')return['owner_analytics_client_feed',{}]",
            "fetch(`${RPC_UPSTREAM=/${encodeURIComponent(name)}`":"fetch(`${RPC_UPSTREAM}/${encodeURIComponent(name)}`",
          }
          for old,new in repairs.items():
              if old not in s:
                  raise SystemExit(f'EXPECTED_TRANSPORT_REPAIR_SOURCE_MISSING: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          sha256sum /tmp/pr548.patch
          git show "$BASE":.github/workflows/client-application-business-v2-qa.yml > .github/workflows/client-application-business-v2-qa.yml
          git apply --check /tmp/pr548.patch
          git apply /tmp/pr548.patch

          # Preserve the two final reviewed workflow payloads outside workflows so the connected
          # Owner GitHub session can install them after this App-limited transport commit.
          mkdir -p .github/pr548-final
          cp .github/workflows/admin-applications-kpi-refresh-v4-qa.yml .github/pr548-final/admin-applications-kpi-refresh-v4-qa.yml
          cp .github/workflows/client-application-business-v2-qa.yml .github/pr548-final/client-application-business-v2-qa.yml

          # GitHub Actions token has contents:write but no workflows permission. Do not weaken
          # GitHub's workflow-file protection: restore every workflow path to the triggering HEAD.
          git show "$TRANSPORT_HEAD":.github/workflows/admin-applications-kpi-refresh-v4-qa.yml > .github/workflows/admin-applications-kpi-refresh-v4-qa.yml
          git show "$TRANSPORT_HEAD":.github/workflows/client-application-business-v2-qa.yml > .github/workflows/client-application-business-v2-qa.yml
          git show "$TRANSPORT_HEAD":.github/workflows/pr548-rework-apply.yml > .github/workflows/pr548-rework-apply.yml
          rm -rf .github/pr548-rework
          git diff --check
          git add -A

          if git diff --cached --name-only "$TRANSPORT_HEAD" | grep -q '^.github/workflows/'; then
            echo 'WORKFLOW_PATH_STAGED_BY_APP_TRANSPORT' >&2
            exit 1
          fi
          for required in \
            functions/portal/owner-api.js \
            governance/client-application-business-v2-owner-scope.json \
            scripts/application-business-v2/prepare-live-consumers.mjs \
            scripts/qa-admin-applications-kpi-refresh-v4.mjs \
            scripts/qa-client-portal-visual-freeze.mjs \
            supabase/functions/rona-owner-acceptance/index.ts \
            supabase/migrations/20260916110900_client_application_owner_business_authority_v2.sql \
            tests/client-application-business-v2/pg17/authority-regressions.sql \
            tests/client-application-business-v2/pg17/owner-authority-regressions.sql \
            tests/client-application-business-v2/pg17/review-dependencies.sql \
            tests/client-application-business-v2/pg17/review-regressions.sql \
            tests/client-application-business-v2/pg17/review-seed.sql; do
            git diff --cached --name-only "$TRANSPORT_HEAD" | grep -Fx "$required" >/dev/null || { echo "REQUIRED_SEMANTIC_PATH_NOT_STAGED: $required" >&2; exit 1; }
          done
          git diff --cached --name-only "$TRANSPORT_HEAD"
          git config user.name 'rokotove26-png'
          git config user.email 'rokotove26@gmail.com'
          git commit -m 'fix(applications): enforce Owner business authority boundary'
          git push origin HEAD:feat/client-applications-systemic-lifecycle-p1
