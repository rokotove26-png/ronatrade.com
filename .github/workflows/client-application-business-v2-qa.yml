name: Client Application Business V2 QA
on:
  push:
    branches: [feat/client-applications-systemic-lifecycle-p1]
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'supabase/migrations/2026091611*_client_application*.sql'
      - 'supabase/functions/_shared/client-application-business-v2/**'
      - 'supabase/functions/rona-portal-api/application-business*'
      - 'scripts/application-business-v2/**'
      - 'tests/client-application-business-v2/**'
      - '.github/workflows/client-application-business-v2-qa.yml'
permissions:
  contents: read
concurrency:
  group: client-business-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres17-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BASELINE_SHA: c4e93c8445a84aa987588558823533be2d1f4511
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      APPLICATION_TEST_PORT: '8768'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Exact source and disposable baseline
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/application-business-evidence"
          mkdir -p "$E" "$RUNNER_TEMP/intake-baseline"
          echo "APPLICATION_EVIDENCE_DIR=$E" >> "$GITHUB_ENV"
          echo "ISOLATED_CONTROL_FILE=$RUNNER_TEMP/isolated-application-control" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$E/HEAD.txt"
          git diff --name-status 2d47e08a8420331672692507a74db6c6484ef04d HEAD > "$E/changed-files.txt"
          git archive "$BASELINE_SHA" tests/client-intake-v1 supabase/migrations | tar -x -C "$RUNNER_TEMP/intake-baseline"
          git archive HEAD scripts functions supabase tests assets/portal-runtime .github package.json portal-src governance | gzip > "$E/source.tar.gz"
          tar -czf "$E/baseline.tar.gz" -C "$RUNNER_TEMP/intake-baseline" .
      - name: Install baseline and candidate foundation
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/intake-baseline"
          psql -v ON_ERROR_STOP=1 -f "$B/tests/client-intake-v1/pg17/baseline.sql"
          psql -v ON_ERROR_STOP=1 -f "$B/tests/client-intake-v1/pg17/client-projection-dependencies.sql"
          for f in "$B"/supabase/migrations/20260915123*_client_intake*.sql "$B"/supabase/migrations/20260916010000_client_intake_p1_completion_v1.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f tests/client-application-business-v2/pg17/production-shape-extension.sql
          psql -v ON_ERROR_STOP=1 -f tests/client-application-business-v2/pg17/review-dependencies.sql
          for f in supabase/migrations/20260916110[0-5]00_client_application*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Historical recovery rehearsal and real commit-boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          # Historical source fixture predates the review policy; the test applies the
          # real review migrations over it inside its rollback transaction.
          psql -v ON_ERROR_STOP=1 -f tests/client-application-business-v2/pg17/integration.sql 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/historical-recovery.log"
          for f in supabase/migrations/20260916110[6-7]00_client_application*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f tests/client-application-business-v2/pg17/review-seed.sql
          psql -v ON_ERROR_STOP=1 -f tests/client-application-business-v2/pg17/review-regressions.sql 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/review-lifecycle.log"
      - name: Build actual release consumers and enforce unrelated scope freeze
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/build.log"
          node tests/client-application-business-v2/runtime/build-proof.mjs 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/build-scope.log"
          node --check "$APPLICATION_EVIDENCE_DIR/emitted-admin.js"
          node --check "$APPLICATION_EVIDENCE_DIR/emitted-client.js"
      - name: Actual application handler, policy, authentication scope and concurrent PostgreSQL sessions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/client-application-business-v2/runtime/handler.test.mjs 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/handler-concurrency.log"
      - name: Start isolated authenticated preview
        shell: bash
        run: |
          set -euo pipefail
          node tests/client-application-business-v2/runtime/server.mjs > "$APPLICATION_EVIDENCE_DIR/isolated-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/application-server.pid"
          for i in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:8768/health > "$APPLICATION_EVIDENCE_DIR/isolation-boundary.json"; then exit 0; fi; sleep 1; done
          exit 1
      - name: Actual Deno production authentication source and import graph
        env:
          SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_URL: http://127.0.0.1:8768
          SUPABASE_ANON_KEY: isolated-test-publishable-key
        shell: bash
        run: |
          set -euo pipefail
          deno info --json --config supabase/functions/rona-portal-api/deno.json supabase/functions/rona-portal-api/application-business-bootstrap-v2.ts > "$APPLICATION_EVIDENCE_DIR/deno-import-graph.json"
          deno run --allow-env --allow-net --allow-read --config supabase/functions/rona-portal-api/deno.json tests/client-application-business-v2/runtime/deno-auth.ts 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/deno-auth-driver.log"
      - name: Actual compiled Client and Admin browser regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tests/client-application-business-v2/runtime/browser.py 2>&1 | tee "$APPLICATION_EVIDENCE_DIR/browser.log"
      - name: Stop disposable HTTP process
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/application-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/application-server.pid")" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-business-v2-exact-head-evidence
          path: ${{ runner.temp }}/application-business-evidence/
          retention-days: 7
          if-no-files-found: error
