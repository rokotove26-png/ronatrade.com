name: Portal visual redesign final2 QA

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-visual-redesign-final2-*'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  final2-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source locks and runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          test "$(sha256sum 'portal-src/canonical/canonical_logo.svg' | awk '{print $1}')" = '755f13d3ba5c7b08a2538b72d3bcb8e0a6d5bb9b24ffde57cda7eca27762ac65'
          node --check functions/portal/owner-acceptance-ui.js
          for f in functions/portal/owner-ui-chunks/*.js; do node --check "$f"; done
          node --input-type=module <<'NODE'
          import c0 from './functions/portal/owner-ui-chunks/chunk0.js';import c1 from './functions/portal/owner-ui-chunks/chunk1.js';import c2 from './functions/portal/owner-ui-chunks/chunk2.js';import c3 from './functions/portal/owner-ui-chunks/chunk3.js';import c4 from './functions/portal/owner-ui-chunks/chunk4.js';import c5 from './functions/portal/owner-ui-chunks/chunk5.js';import c6 from './functions/portal/owner-ui-chunks/chunk6.js';import c7 from './functions/portal/owner-ui-chunks/chunk7.js';import c8 from './functions/portal/owner-ui-chunks/chunk8.js';import c9 from './functions/portal/owner-ui-chunks/chunk9.js';import {writeFileSync} from 'node:fs';writeFileSync('/tmp/owner-ui-runtime.js',[c0,c1,c2,c3,c4,c5,c6,c7,c8,c9].join(''));
          NODE
          node --check /tmp/owner-ui-runtime.js
          grep -q 'rona-admin-visual' /tmp/owner-ui-runtime.js
          grep -q 'labelTextNodes' /tmp/owner-ui-runtime.js
          echo FINAL2_SOURCE_PASS

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          google-chrome --version

      - name: Resolve Cloudflare preview
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<180;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-VISUAL-FINAL2'}});if(r.ok){const j=await r.json(),cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare '+cf.conclusion);await sleep(4000);const text=[cf.output?.summary,cf.output?.text,cf.details_url].filter(Boolean).join(' '),urls=[...text.matchAll(/https:\/\/[a-z0-9.-]+\.pages\.dev/ig)].map(x=>x[0]),origin=urls.find(x=>!/rona-trade-public\.pages\.dev$/i.test(x))||urls[0];if(!origin)throw new Error('preview URL missing');fs.appendFileSync(process.env.GITHUB_OUTPUT,`origin=${origin}\n`);return}}await sleep(3000)}throw new Error('preview timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Browser acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');
          const origin=process.env.TARGET_ORIGIN,repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN,sleep=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,m)=>{if(!v)throw new Error(m)};fs.mkdirSync('/tmp/final2',{recursive:true});
          async function broker(){let last={};for(let i=0;i<10;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}}),j=await r.json().catch(()=>({}));last={status:r.status,code:j.code};if(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token)return j.session;await sleep(1200*(i+1))}throw new Error('broker '+JSON.stringify(last))}
          async function waitFlag(p,n,t=500){for(let i=0;i<t;i++){if(await p.evaluate(x=>window[x]===true,n))return;await p.waitForTimeout(100)}throw new Error(n+' timeout '+String(await p.evaluate(()=>window.__RONA_OWNER_ADMIN_ERROR__||window.__RONA_OWNER_CLIENT_ERROR__||window.__RONA_OWNER_AGENT_ERROR__||'')))}
          async function ctxFor(browser,s,v){const host=new URL(origin).hostname,c=await browser.newContext({viewport:v,javaScriptEnabled:true});await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:host,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:host,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          async function post(c,path,data){let last='';for(let i=0;i<6;i++){const r=await c.request.post(origin+path,{headers:{origin,referer:origin+'/portal/admin','content-type':'application/json'},data}),text=await r.text();last=text;let j={};try{j=JSON.parse(text)}catch{}if(r.ok()&&j?.ok===true)return j;if(r.status()<500)break;await sleep(500*(i+1))}throw new Error(path+' '+last.slice(0,240))}
          async function visual(p,kind,selector='.rona-visual-hero'){await waitFlag(p,'__RONA_OWNER_ACCEPTANCE_UI_READY__');await waitFlag(p,'__RONA_VISUAL_V2__');await p.waitForSelector(selector,{state:'attached',timeout:7000});assert(await p.evaluate(()=>document.documentElement.classList.contains('rona-visual-v2')),kind+' class')}
          (async()=>{const session=await broker(),browser=await chromium.launch({headless:true,channel:'chrome'}),ctx=await ctxFor(browser,session,{width:1920,height:1080}),page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));page.on('console',m=>{if(m.type()==='error'&&!/cloudflareinsights/i.test(m.text()))errors.push('console:'+m.text())});let uid=null,clientCtx=null;try{
            await page.goto(origin+'/portal/admin?_qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitFlag(page,'__RONA_OWNER_ADMIN_READY__');await visual(page,'Admin');await waitFlag(page,'__RONA_VISUAL_V2_POLISH__');await page.locator('#nav button[data-page="home"]').click();await page.waitForTimeout(250);assert(await page.getByText('Операционный центр',{exact:true}).count()===1,'home hero');const body=await page.locator('body').innerText();assert(!/текущий контролируемый кандидат/i.test(body),'candidate clutter');assert(!/официальные источники/i.test(body),'official-source clutter');await page.screenshot({path:'/tmp/final2/admin-home.png',fullPage:true});
            for(const id of ['prices','applications','deals','documents','payments','accounting','monitoring','messages','analytics','market-news']){await page.locator(`#nav button[data-page="${id}"]`).click();await page.waitForTimeout(100);assert(await page.locator(`#page-${id} .rona-visual-hero`).count()>=1,'hero '+id)}
            await page.locator('#nav button[data-page="access"]').click();await page.waitForTimeout(180);const access=(await page.locator('#nav button[data-page="access"]').innerText()).replace(/\s+/g,' ').trim();assert(access==='Клиенты и агенты'||access.endsWith('Клиенты и агенты'),'clean access label '+access);assert(await page.locator('#page-access>.rona-visual-hero').count()===1,'access hero');await page.locator('#nav button[data-page="claims"]').click();await page.waitForTimeout(180);assert(await page.locator('#page-claims>.rona-visual-hero').count()===1,'claims hero');await page.screenshot({path:'/tmp/final2/admin-claims.png',fullPage:true});
            const mctx=await ctxFor(browser,session,{width:390,height:844}),mp=await mctx.newPage();await mp.goto(origin+'/portal/admin?_mobile='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitFlag(mp,'__RONA_OWNER_ADMIN_READY__');await visual(mp,'Admin mobile');assert((await mp.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth))<=4,'mobile overflow');await mp.screenshot({path:'/tmp/final2/admin-mobile.png',fullPage:true});await mctx.close();
            const email=`qa-visual-final2-${runId}-${attempt}@example.invalid`,pwd=`Qa!${runId}${attempt}V2#`,created=await post(ctx,'/portal/admin-authority/access/users',{role:'Клиент',name:'QA VISUAL FINAL2',login:email,email,initialPassword:pwd,bindingRole:'Уполномоченный представитель',contractIds:['RONA-C002-CTR-2026-001'],openWithoutContract:false});uid=created.userId||created.data?.userId;assert(uid,'client id');clientCtx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});const cp=await clientCtx.newPage();await cp.goto(origin+'/portal/login?next=%2Fportal%2Fclient',{waitUntil:'domcontentloaded',timeout:30000});await cp.locator('input[name="email"]').fill(email);await cp.locator('input[name="password"]').fill(pwd);await cp.locator('button[type="submit"]').click();await cp.waitForURL(u=>new URL(u).origin===origin&&new URL(u).pathname==='/portal/client',{timeout:15000});await waitFlag(cp,'__RONA_OWNER_CLIENT_READY__');await visual(cp,'Client','#ronaOwnerClientSummary .rona-visual-hero');assert(await cp.getByText('Рабочее пространство клиента',{exact:true}).count()===1,'client title');await cp.screenshot({path:'/tmp/final2/client.png',fullPage:true});await clientCtx.close();clientCtx=null;
            await page.goto(origin+'/portal/agent?_qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitFlag(page,'__RONA_OWNER_AGENT_READY__');await visual(page,'Agent','#ronaOwnerAgentSummary .rona-visual-hero');assert(await page.getByText('Рабочее пространство агента',{exact:true}).count()===1,'agent title');assert(await page.getByText('Скачать PDF прайс-лист',{exact:true}).count()>=1,'agent pdf');await page.screenshot({path:'/tmp/final2/agent.png',fullPage:true});assert(errors.length===0,'browser errors '+JSON.stringify(errors.slice(0,8)));console.log(JSON.stringify({ok:true,origin,admin:true,client:true,agent:true,mobile:true}));
          }finally{if(clientCtx)await clientCtx.close().catch(()=>{});if(uid)await post(ctx,`/portal/admin-authority/access/users/${uid}/block`,{}).catch(()=>{});await ctx.close().catch(()=>{});await browser.close().catch(()=>{})}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-visual-final2-${{ github.run_id }}
          path: /tmp/final2
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN,state=process.env.JOB_STATUS==='success'?'success':'failure',target=state==='success'?process.env.TARGET_ORIGIN+'/portal/admin':`https://github.com/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28','user-agent':'RONA-VISUAL-FINAL2'},body:JSON.stringify({state,context:'portal-visual-final2-qa',description:state==='success'?'Final visual QA PASS':'Final visual QA FAIL',target_url:target})}).then(async r=>{if(!r.ok)throw new Error(await r.text())}).catch(e=>{console.error(e);process.exit(1)});
          NODE
