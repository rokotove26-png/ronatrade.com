# Focused same-HEAD authority + backend-integration + real-browser QA for Admin Payments schedules.
# Browser QA serves the real Admin shell runtime from dist; the shell loader is not asset-stubbed.
name: Admin Payments schedule materialization QA

on:
  push:
    branches: [feat/admin-payments-payment-schedule-materialization-v1]
    paths:
      - 'functions/portal/payment-schedule-current.js'
      - 'functions/portal/main-ui/payment-schedule-runtime-v1.js'
      - 'functions/portal/main-ui/index.js'
      - 'supabase/functions/rona-owner-ai-sync/index.ts'
      - 'supabase/functions/rona-owner-ai-sync/payment-schedule-authority.ts'
      - 'supabase/migrations/20260912183500_finance_payment_schedule_authoritative_store_v1.sql'
      - 'scripts/qa-admin-payments-schedule-materialization-source-v1.mjs'
      - 'scripts/qa-admin-payments-schedule-backend-integration-v1.mjs'
      - 'scripts/qa-admin-payments-schedule-materialization-browser-v2.mjs'
      - '.github/workflows/admin-payments-schedule-materialization-qa.yml'
  pull_request:
    branches: [fix/admin-payments-finance-allocation-projection-v1]
    paths:
      - 'functions/portal/payment-schedule-current.js'
      - 'functions/portal/main-ui/payment-schedule-runtime-v1.js'
      - 'functions/portal/main-ui/index.js'
      - 'supabase/functions/rona-owner-ai-sync/index.ts'
      - 'supabase/functions/rona-owner-ai-sync/payment-schedule-authority.ts'
      - 'supabase/migrations/20260912183500_finance_payment_schedule_authoritative_store_v1.sql'
      - 'scripts/qa-admin-payments-schedule-materialization-source-v1.mjs'
      - 'scripts/qa-admin-payments-schedule-backend-integration-v1.mjs'
      - 'scripts/qa-admin-payments-schedule-materialization-browser-v2.mjs'
      - '.github/workflows/admin-payments-schedule-materialization-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-schedule-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current Admin
        run: npm run build
      - name: Materialized Finance business-store source authority QA
        run: node scripts/qa-admin-payments-schedule-materialization-source-v1.mjs
      - name: Backend integration — business store to ai-sync to projection
        run: |
          set -o pipefail
          mkdir -p artifacts/admin-payments
          node scripts/qa-admin-payments-schedule-backend-integration-v1.mjs 2>&1 | tee artifacts/admin-payments/payment-schedule-backend-integration-qa.log
      - name: Inherited PAYMENT / PAYMENT_ALLOCATION boundary QA
        run: node scripts/qa-admin-payments-finance-allocation-source-v1.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Dynamic Finance schedule real browser runtime QA
        run: |
          set -o pipefail
          node --import ./scripts/qa-admin-pages-runtime-shim-v1.mjs scripts/qa-admin-payments-schedule-materialization-browser-v2.mjs 2>&1 | tee artifacts/admin-payments/payment-schedule-browser-qa.log
      - name: Upload final authority materialization proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-payments-final-authority-materialization-proof
          path: artifacts/admin-payments/
          if-no-files-found: warn
