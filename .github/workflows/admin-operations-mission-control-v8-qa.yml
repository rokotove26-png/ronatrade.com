name: Admin Operations Current V2 Single Owner QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/admin-operations-command-center-v10-clean.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/owner-api.js'
      - 'functions/portal/deals-current-state-ui.js'
      - 'supabase/migrations/20260920194500_admin_operations_current_v2_single_owner.sql'
      - 'tests/admin-operations-current-v1/**'
      - 'tests/admin-operations-current-v2/**'
      - 'tests/admin-operations-mission-control-v8/**'
      - 'scripts/qa-admin-single-owner.mjs'
      - '.github/workflows/admin-operations-mission-control-v8-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check functions/portal/admin-operations-command-center-v10-clean.js
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/owner-api.js
          node --check 'functions/portal/[[path]].js'
          node --check functions/portal/deals-current-state-ui.js
          node --check scripts/qa-admin-single-owner.mjs
      - name: V2 single-owner contracts
        run: |
          node --test tests/admin-operations-current-v2/single-owner-static.test.mjs
          node --test tests/admin-operations-current-v1/event-driven-static.test.mjs
          node --test tests/admin-operations-mission-control-v8/mission-current.test.mjs
      - name: Single-owner Admin QA
        run: node scripts/qa-admin-single-owner.mjs
      - name: Generated Admin runtime compiles and owns Operations
        shell: bash
        run: |
          printf '%s\n' '{"type":"module"}' > functions/portal/package.json
          node --input-type=module <<'NODE'
          const m=await import('./functions/portal/admin-main-ui-current.js?qa='+Date.now());
          const r=await m.onRequest();
          const s=await r.text();
          new Function(s);
          if(r.headers.get('x-rona-operations-center')!=='v10-operations-current-v2-single-owner') throw new Error('OPERATIONS_V10_HEADER_MISSING');
          if(!s.includes("window.__RONA_ADMIN_OPERATIONS_COMMAND_CENTER__='v10-operations-current-v2-single-owner'")) throw new Error('OPERATIONS_V10_RUNTIME_MARKER_MISSING');
          if(!s.includes("window.__RONA_ADMIN_OPERATIONS_LEGACY_RUNTIME__='DISABLED_BY_V10'")) throw new Error('OPERATIONS_V10_LEGACY_DISABLE_MISSING');
          if(!s.includes("call('/admin/operations-current-v2'")) throw new Error('OPERATIONS_V10_V2_SOURCE_MISSING');
          if(!s.includes("OPERATIONS_CURRENT_V2")) throw new Error('OPERATIONS_V10_CONTRACT_MISSING');
          if(!s.includes("'Клиенты в сети'")) throw new Error('OPERATIONS_V10_CLIENTS_ONLINE_MISSING');
          if(!s.includes("'Агенты в сети'")) throw new Error('OPERATIONS_V10_AGENTS_ONLINE_MISSING');
          if(!s.includes("Нулевые показатели не подставляются")) throw new Error('OPERATIONS_V10_FAIL_CLOSED_ZERO_MISSING');
          if(!s.includes("Operations Current V2 подтверждает отсутствие действий")) throw new Error('OPERATIONS_V10_NORMAL_STATE_GATE_MISSING');
          if(s.includes("ensureAdminOperationsCurrentV7();")) throw new Error('OPERATIONS_LEGACY_EVENT_RUNTIME_STILL_ACTIVE');
          if(!s.includes("new AbortController()")) throw new Error('OPERATIONS_V10_ABORTABLE_FETCH_MISSING');
          console.log('ADMIN_OPERATIONS_CURRENT_V2_SINGLE_OWNER=PASS');
          NODE
