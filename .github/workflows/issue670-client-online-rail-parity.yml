name: issue670 client online rail parity

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/client-rail-current-ui.js'
      - 'scripts/qa-client-portal-visual-freeze.mjs'
      - 'governance/client-online-rail-670-owner-approval-20260919.json'
      - 'assets/portal-runtime/client-rail-canonical-hero-v1.js'
      - 'scripts/attach-client-rail-production-v1.mjs'
      - 'scripts/qa-client-online-rail-670-browser.mjs'
      - 'scripts/qa-client-online-rail-670-real-integration.mjs'
      - 'tests/fixtures/issue670-client-rail-real-integration-base.sql'
      - 'supabase/migrations/20260919182000_client_rail_internal_read_model_core_v1.sql'
      - 'supabase/functions/rona-portal-api/client-rail-admin-parity-v1.ts'
      - 'supabase/functions/rona-portal-api/client-rail-canonical-projection-v1.mjs'
      - 'tests/client-rail-parity-670.test.mjs'
      - 'docs/client-online-rail-670-architecture.md'
      - '.github/workflows/client-rail-admin-canonical-qa.yml'
      - '.github/workflows/issue670-client-online-rail-parity.yml'
      - '.github/workflows/issue670-client-rail-real-integration.yml'
      - 'functions/portal/api/**'
      - 'supabase/functions/rona-portal-api-candidate-20260817/**'
      - 'tests/client-rail-isolated-backend-after-incident.test.mjs'
      - '.github/workflows/client-rail-isolated-backend-after-incident.yml'
      - '.github/workflows/client-rail-admin-visual-parity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue670-client-online-rail-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: CURRENT STATE and DELTA ONLY
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/public-go-live-v1.1 --depth=1
          base="$(git merge-base origin/release/public-go-live-v1.1 HEAD)"
          echo "ISSUE670_BASE_SHA=$base"
          git diff --name-only "$base"...HEAD | sort -u > /tmp/issue670-changed.txt
          {
            echo '.github/workflows/client-rail-admin-canonical-qa.yml'
            echo '.github/workflows/issue670-client-online-rail-parity.yml'
            echo '.github/workflows/issue644-online-rail-stage-a-qa.yml'
            echo '.github/workflows/issue670-client-rail-real-integration.yml'
            echo 'assets/portal-runtime/client-rail-canonical-hero-v1.js'
            echo 'docs/client-online-rail-670-architecture.md'
            echo 'functions/portal/client-rail-current-ui.js'
            echo 'functions/portal/rail-current-v7-real-map-ui.js'
            echo 'functions/portal/rail-current-v81-maplibre-ui.js'
            echo 'scripts/qa-client-portal-visual-freeze.mjs'
            echo 'governance/client-online-rail-670-owner-approval-20260919.json'
            echo 'scripts/attach-client-rail-production-v1.mjs'
            echo 'scripts/qa-client-online-rail-670-browser.mjs'
            echo 'scripts/qa-client-online-rail-670-real-integration.mjs'
            echo 'tests/fixtures/issue670-client-rail-real-integration-base.sql'
            echo 'supabase/migrations/20260919182000_client_rail_internal_read_model_core_v1.sql'
            echo 'supabase/functions/rona-portal-api/client-rail-admin-parity-v1.ts'
            echo 'supabase/functions/rona-portal-api/client-rail-canonical-projection-v1.mjs'
            echo 'tests/client-rail-parity-670.test.mjs'
            echo 'tests/online-rail-stage-a-644.test.mjs'
            echo 'functions/portal/api/[[path]].js'
            echo 'supabase/functions/rona-portal-api-candidate-20260817/client-rail-isolated-runtime-v1.ts'
            echo 'supabase/functions/rona-portal-api-candidate-20260817/client-rail-canonical-projection-v1.mjs'
            echo 'tests/client-rail-isolated-backend-after-incident.test.mjs'
            echo '.github/workflows/client-rail-isolated-backend-after-incident.yml'
            echo '.github/workflows/client-rail-admin-visual-parity-v2.yml'
          } | sort -u > /tmp/issue670-allowed.txt
          comm -23 /tmp/issue670-changed.txt /tmp/issue670-allowed.txt | tee /tmp/issue670-unexpected.txt
          if test -s /tmp/issue670-unexpected.txt; then
            echo 'ISSUE670_DELTA_ONLY=FAIL'
            exit 1
          fi
          echo 'ISSUE670_DELTA_ONLY=PASS'

      - name: Source, projection and authorization contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/client-rail-current-ui.js
          node --check assets/portal-runtime/client-rail-canonical-hero-v1.js
          node --check scripts/attach-client-rail-production-v1.mjs
          node --check scripts/qa-client-online-rail-670-browser.mjs
          node --check scripts/qa-client-online-rail-670-real-integration.mjs
          node --check supabase/functions/rona-portal-api/client-rail-canonical-projection-v1.mjs
          node --test tests/client-rail-parity-670.test.mjs
          node --test tests/client-rail-isolated-backend-after-incident.test.mjs
          deno check --node-modules-dir=auto supabase/functions/rona-portal-api-candidate-20260817/client-rail-isolated-runtime-v1.ts
          deno check --node-modules-dir=auto supabase/functions/rona-portal-api/client-rail-admin-parity-v1.ts
          echo 'ISSUE670_SOURCE_AUTH_CONTRACT=PASS'

      - name: Production-v56 delegation guard
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/functions/rona-portal-api/client-rail-admin-parity-v1.ts'
          grep -q '53a3266f64bdf4e44d5daf09507a6fd46c0678ad/supabase/functions/rona-portal-api/payments-v8-production-hardening.ts' "$file"
          grep -q 'client_user_has_contract_access' "$file"
          grep -q 'client_user_has_deal_access' "$file"
          grep -q 'rona_rail_deal_map_read_model_core_v2' "$file"
          ! grep -q 'rona_admin_rail_deal_map_read_model_v4' "$file"
          migration='supabase/migrations/20260921134600_rail_route_cohorts_read_model_v1.sql'
          grep -q 'create or replace function portal_private.rona_rail_deal_map_read_model_core_v2' "$migration"
          grep -q "owner_r1_actor('ADMIN')" "$migration"
          grep -A1 -F 'revoke all on function portal_private.rona_rail_deal_map_read_model_core_v2(uuid,text)' "$migration" | grep -q 'from public,anon,authenticated;'
          grep -A1 -F 'grant execute on function portal_private.rona_rail_deal_map_read_model_core_v2(uuid,text)' "$migration" | grep -q 'to service_role;'
          grep -q 'return await liveV56Handler(req, info)' "$file"
          ! grep -Eiq '(insert|update|delete)[[:space:]]+portal_private\.' "$file"
          echo 'ISSUE670_LIVE_V56_DELEGATION=PASS'

      - name: Canonical Client production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/portal/client.html
          grep -q '/portal/client-rail-current-ui?v=20260919-route-overlay-v3' dist/portal/client.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const integrity=JSON.parse(fs.readFileSync('dist/canonical-visual-integrity.json','utf8'));
          const rail=integrity?.client_runtime?.rail_client_admin_canonical;
          if(!rail)throw new Error('Client Rail integrity missing');
          if(rail.client_data_source!=='/portal/api/v1/client/rail-canonical')throw new Error('Client Rail canonical endpoint missing');
          if(rail.client_authority!=='AUTHENTICATED_CLIENT_CONTRACT')throw new Error('Client Rail authority scope drifted');
          if(rail.provider_state_source!==undefined)throw new Error('legacy provider-state authority survived');
          if(rail.movement_publication!=='SERVER_SCOPED_CANONICAL_READ_MODEL')throw new Error('canonical movement source marker missing');
          console.log('ISSUE670_BUILD_CONTRACT=PASS');
          NODE

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Frontend-only fixture parity and last-good proof (not backend acceptance)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-client-online-rail-670-browser.mjs 2>&1 | tee /tmp/issue670-frontend-fixture-browser.log
          grep -F 'ISSUE670_ADMIN_ROUTE_GEOMETRY=PASS' /tmp/issue670-frontend-fixture-browser.log
          grep -F 'ISSUE670_ROUTE_OVERLAY_V4_VISIBLE=PASS' /tmp/issue670-frontend-fixture-browser.log
          grep -F 'ISSUE670_PREMIUM_MAP_MARKERS=PASS' /tmp/issue670-frontend-fixture-browser.log
          grep -F 'ISSUE670_ADMIN_OPERATIONAL_LAYOUT_INHERITED=PASS' /tmp/issue670-frontend-fixture-browser.log
          echo 'ISSUE670_MOCK_BROWSER_BACKEND_ACCEPTANCE=NOT_CLAIMED'

      - name: Admin Rail visual-pair boundary / unrelated-domain guard
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/release/public-go-live-v1.1 HEAD)"
          for path in \
            functions/portal/rail-current-v6-ui.js \
            supabase/functions/rona-owner-acceptance/rail-admin-read-model-overlay.mjs; do
            test -z "$(git diff "$base"...HEAD -- "$path")" || { echo "ISSUE670_ADMIN_RAIL_NONVISUAL_FROZEN=FAIL $path"; exit 1; }
          done
          test -n "$(git diff "$base"...HEAD -- functions/portal/rail-current-v7-real-map-ui.js)" || { echo 'ISSUE670_ADMIN_RAIL_VISUAL_PAIR=FAIL v7'; exit 1; }
          test -n "$(git diff "$base"...HEAD -- functions/portal/rail-current-v81-maplibre-ui.js)" || { echo 'ISSUE670_ADMIN_RAIL_VISUAL_PAIR=FAIL v81'; exit 1; }
          if git diff --name-only "$base"...HEAD | grep -E '(^|/)(finance|payments|prices|access)(/|\.|-)'; then
            echo 'ISSUE670_UNRELATED_DOMAIN_CHANGE=FAIL'
            exit 1
          fi
          echo 'ISSUE670_ADMIN_RAIL_NONVISUAL_FROZEN=PASS'
          echo 'ISSUE670_ADMIN_RAIL_VISUAL_PAIR=PASS'
          echo 'ISSUE670_UNRELATED_DOMAINS_FROZEN=PASS'

      - name: Final #670 summary
        shell: bash
        run: |
          {
            echo 'CURRENT_STATE_FIRST=PASS'
            echo 'DELTA_ONLY=PASS'
            echo 'CLIENT_CANONICAL_ENDPOINT=PASS'
            echo 'SERVER_AUTHORITY_SOURCE_CONTRACT=PASS'
            echo 'INTERNAL_CANONICAL_CORE=PASS'
            echo 'REAL_BACKEND_ACCEPTANCE=SEPARATE_REQUIRED'
            echo 'MOCK_BROWSER_BACKEND_ACCEPTANCE=NOT_CLAIMED'
            echo 'HARD_RELOAD_READY=PASS'
            echo 'DEAL_SWITCH_ISOLATION=PASS'
            echo 'ADMIN_ROUTE_GEOMETRY=PASS'
            echo 'ROUTE_OVERLAY_V4_VISIBLE=PASS'
            echo 'PREMIUM_MAP_MARKERS=PASS'
            echo 'ADMIN_OPERATIONAL_LAYOUT_INHERITED=PASS'
            echo 'BACKGROUND_REFRESH=PASS'
            echo 'DEGRADED_REFRESH_PRESERVE=PASS'
            echo 'CONTEXT_TAMPER_FAIL_CLOSED=PASS'
            echo 'NO_TARIFF_MATRIX=PASS'
            echo 'ADMIN_RAIL_NONVISUAL_FROZEN=PASS'
            echo 'ADMIN_RAIL_VISUAL_PAIR=PASS'
            echo 'NO_BUSINESS_DATA_WRITE=PASS'
            echo 'FINAL=PASS'
          } | tee /tmp/issue670-final.txt

      - name: Upload #670 evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue670-client-online-rail-parity
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/issue670-changed.txt
            /tmp/issue670-allowed.txt
            /tmp/issue670-unexpected.txt
            /tmp/issue670-frontend-fixture-browser.log
            /tmp/issue670-final.txt
