name: Admin Analytics Canonical Only QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  push:
    branches:
      - 'release/public-go-live-v1.1'
      - 'fix/analytics-canonical-only-20260826'

jobs:
  analytics-canonical-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical-only function runtime
        run: |
          node --check functions/portal/analytics-v2-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check functions/portal/analytics-v2-approved-base.js
          node --check functions/portal/remaining-sections-r2-base.js
          node --check assets/portal-market-news-current-v1.js
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const analytics = await import('./functions/portal/analytics-v2-ui.js?qa='+Date.now());
          const response = await analytics.onRequest({});
          const analyticsSource = await response.text();
          new Function(analyticsSource);
          for (const token of ['20260824-analytics-v3-market-rona-bases-lpg','АИ-92','АИ-95','ДТ','LPG / СУГ','Platts','Argus','LOW','BASE','HIGH','Forward','Аналитический вывод','FACT / CALCULATION / FORECAST']) {
            if (!analyticsSource.includes(token)) throw new Error('canonical analytics token missing: '+token);
          }
          for (const token of ['Выводов','Рыночных сигналов','Аналитическая лента','Текущий опубликованный ориентир RONA Trade','Комментарий Коммерческого директора']) {
            if (analyticsSource.includes(token)) throw new Error('legacy analytics token leaked into canonical runtime: '+token);
          }
          if (response.headers.get('x-rona-analytics-visual') !== 'home-canonical-frames-title-v1') throw new Error('canonical home visual marker missing');
          if (response.headers.get('x-rona-analytics-typography') !== 'semantic-palette-v1') throw new Error('semantic typography marker missing');
          for (const token of ['ronaAnalyticsCanonicalHomeVisualV1','border-radius:14px','background:transparent','--an2-cyan:#65d9ff','--an2-amber:#efc978']) {
            if (!analyticsSource.includes(token)) throw new Error('analytics visual contract missing: '+token);
          }
          const remaining = await import('./functions/portal/remaining-sections-ui.js?qa='+Date.now());
          const remainingSource = await (await remaining.onRequest({})).text();
          new Function(remainingSource);
          for (const token of ["'аналитика':'analytics'",'function renderAnalytics(){','function publicationCard(){',"kind==='analytics'",'data-kind=\\"analytics\\"','Выводов','Аналитическая лента']) {
            if (remainingSource.includes(token)) throw new Error('legacy analytics leaked from remaining runtime: '+token);
          }
          for (const token of ['Радиорубка','Вознаграждения агентов','portal-market-news-current-v1.js','__RONA_MARKET_NEWS_OWNER_GUARD_V6__']) {
            if (!remainingSource.includes(token)) throw new Error('approved remaining section/guard missing: '+token);
          }
          const newsSource = await readFile('./assets/portal-market-news-current-v1.js','utf8');
          new Function(newsSource);
          for (const token of ['__RONA_MARKET_NEWS_CURRENT_V1__','Новости топливного рынка СНГ','RONA TRADE · MARKET INTELLIGENCE']) {
            if (!newsSource.includes(token)) throw new Error('dedicated Market News runtime missing: '+token);
          }
          NODE
      - name: Build current-only artifact
        run: npm run build
      - name: Verify materialized production runtime
        run: |
          grep -q '20260824-analytics-v3-market-rona-bases-lpg' dist/portal/analytics-v2-ui
          grep -q 'Аналитический вывод' dist/portal/analytics-v2-ui
          grep -q 'home-canonical-frames-title-v1' dist/portal/analytics-v2-ui
          grep -q 'semantic-palette-v1' dist/portal/analytics-v2-ui
          grep -q 'FACT / CALCULATION / FORECAST' dist/portal/analytics-v2-ui
          grep -q 'Радиорубка' dist/portal/remaining-sections-ui
          grep -q 'Вознаграждения агентов' dist/portal/remaining-sections-ui
          grep -q 'portal-market-news-current-v1.js' dist/portal/remaining-sections-ui
          grep -q '__RONA_MARKET_NEWS_CURRENT_LOADER__' dist/portal/remaining-sections-ui
          grep -q '__RONA_MARKET_NEWS_CURRENT_V1__' dist/assets/portal-market-news-current-v1.js
          grep -q 'Новости топливного рынка СНГ' dist/assets/portal-market-news-current-v1.js
          if grep -q 'Комментарий Коммерческого директора' dist/portal/analytics-v2-ui; then exit 1; fi
          if grep -q 'Аналитическая лента' dist/portal/remaining-sections-ui; then exit 1; fi
          if grep -q "'аналитика':'analytics'" dist/portal/remaining-sections-ui; then exit 1; fi
          if grep -q 'function renderAnalytics(){' dist/portal/remaining-sections-ui; then exit 1; fi
          if grep -q 'Выводов' dist/portal/analytics-v2-ui; then exit 1; fi
      - name: Verify Admin shell ownership split
        run: |
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "if(p==='analytics')loadAnalytics()" assets/portal-admin-shell-fast-v1.js
          grep -q "\['agent-settlements','messages','market-news'\]" assets/portal-admin-shell-fast-v1.js
