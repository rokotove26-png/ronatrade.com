name: Admin Analytics Approved Single Owner QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  push:
    branches:
      - 'release/public-go-live-v1.1'
      - 'fix/analytics-approved-single-owner-20260827'

jobs:
  analytics-approved-single-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved Analytics runtime only
        run: |
          node --check functions/portal/analytics-v2-ui.js
          node --check functions/portal/analytics-v2-approved-base.js
          node --check functions/portal/admin-approved-analytics-v455-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check functions/portal/remaining-sections-r2-base.js
          node --input-type=module <<'NODE'
          const analytics = await import('./functions/portal/analytics-v2-ui.js?qa='+Date.now());
          const response = await analytics.onRequest({});
          const source = await response.text();
          new Function(source);
          for (const token of ['approved-v4.3.1-single-owner','RONA TRADE · ANALYTICS','Аналитика','АИ-92','АИ-95','ДТ','LPG / СУГ','Platts LPG / СУГ','Petromarket · DAP benchmark','1075.25','1226.75','Возможные цены RONA Trade','Аналитический вывод','DATA-DRIVEN','FACT / CALCULATION / FORECAST']) {
            if (!source.includes(token)) throw new Error('approved Analytics token missing: '+token);
          }
          for (const token of ['rona-analytics-canonical-title','ronaAnalyticsCanonicalHomeVisualV1','home-canonical-frames-title-v1','LPG Hairatan','Hairatan / Petromarket / Platts propane ref','Комментарий Коммерческого директора','Аналитическая лента','Текущий опубликованный ориентир RONA Trade']) {
            if (source.includes(token)) throw new Error('stale Analytics marker leaked: '+token);
          }
          if (response.headers.get('x-rona-analytics-owner') !== 'approved-v431-exclusive') throw new Error('approved owner header missing');
          if (response.headers.get('x-rona-analytics-visual') !== 'approved-hero-v431') throw new Error('approved visual header missing');
          if (response.headers.get('x-rona-analytics-chart') !== 'designer-v3-shared-gasoline-axis') throw new Error('approved chart header missing');
          const shim = await import('./functions/portal/admin-approved-analytics-v455-ui.js?qa='+Date.now());
          const shimSource = await (await shim.onRequest({})).text();
          if (!shimSource.includes('retired-compat-guard-v1')) throw new Error('old v455 overlay is not retired');
          if (shimSource.includes('makeSvg(') || shimSource.includes('A92.map(x=>x+40)')) throw new Error('old v455 renderer still active');
          NODE
      - name: Build current-only artifact
        run: npm run build
      - name: Verify materialized production Analytics
        run: |
          grep -q 'approved-v4.3.1-single-owner' dist/portal/analytics-v2-ui
          grep -q 'RONA TRADE · ANALYTICS' dist/portal/analytics-v2-ui
          grep -q 'Platts LPG / СУГ' dist/portal/analytics-v2-ui
          grep -q '1075.25' dist/portal/analytics-v2-ui
          grep -q '1226.75' dist/portal/analytics-v2-ui
          grep -q 'Аналитический вывод' dist/portal/analytics-v2-ui
          grep -q 'DATA-DRIVEN' dist/portal/analytics-v2-ui
          if grep -q 'rona-analytics-canonical-title' dist/portal/analytics-v2-ui; then exit 1; fi
          if grep -q 'home-canonical-frames-title-v1' dist/portal/analytics-v2-ui; then exit 1; fi
          if grep -q 'LPG Hairatan' dist/portal/analytics-v2-ui; then exit 1; fi
          if grep -q 'Комментарий Коммерческого директора' dist/portal/analytics-v2-ui; then exit 1; fi
      - name: Verify ownership split
        run: |
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "if(p==='analytics')loadAnalytics()" assets/portal-admin-shell-fast-v1.js
          grep -q "\['agent-settlements','messages','market-news'\]" assets/portal-admin-shell-fast-v1.js
          if grep -q "'аналитика':'analytics'" dist/portal/remaining-sections-ui; then exit 1; fi
          if grep -q 'function renderAnalytics(){' dist/portal/remaining-sections-ui; then exit 1; fi
