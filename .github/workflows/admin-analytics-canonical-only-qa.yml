name: Admin Analytics Current Single Owner QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  push:
    branches:
      - 'release/public-go-live-v1.1'

jobs:
  analytics-current-single-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current Analytics owner source
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/analytics-v2-ui.js
          node --check functions/portal/analytics-v2-approved-base.js
          node --check functions/portal/admin-approved-analytics-v455-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check functions/portal/remaining-sections-r2-base.js
          node --input-type=module <<'NODE'
          const analytics = await import('./functions/portal/analytics-v2-ui.js?qa='+Date.now());
          const response = await analytics.onRequest({});
          const source = await response.text();
          new Function(source);
          for (const token of ['approved-v4.3.2-pricing-bridge-single-owner','RONA_Admin_LK_LOCAL_v4_3_2_Analytics_PricingBridge_Ready_Local.html','RONA TRADE · ANALYTICS','Аналитика','АИ-92','АИ-95','ДТ','LPG / СУГ','Platts LPG / СУГ','Petromarket · DAP benchmark','1075.25','1226.75','Возможные цены RONA Trade','Аналитический вывод','DATA-DRIVEN','FACT / CALCULATION / FORECAST']) {
            if (!source.includes(token)) throw new Error('current Analytics token missing: '+token);
          }
          for (const token of ['rona-analytics-canonical-title','ronaAnalyticsCanonicalHomeVisualV1','home-canonical-frames-title-v1','LPG Hairatan','Hairatan / Petromarket / Platts propane ref','Комментарий Коммерческого директора','Аналитическая лента','Текущий опубликованный ориентир RONA Trade']) {
            if (source.includes(token)) throw new Error('stale Analytics marker leaked: '+token);
          }
          if (response.headers.get('x-rona-analytics-ui') !== 'approved-v4.3.2-pricing-bridge-single-owner') throw new Error('current ui header missing');
          if (response.headers.get('x-rona-analytics-owner') !== 'approved-v432-exclusive') throw new Error('current owner header missing');
          if (response.headers.get('x-rona-analytics-source-file') !== 'RONA_Admin_LK_LOCAL_v4_3_2_Analytics_PricingBridge_Ready_Local.html') throw new Error('current source-file header missing');
          if (response.headers.get('x-rona-analytics-visual') !== 'approved-hero-v432-pricing-bridge') throw new Error('current visual header missing');
          if (response.headers.get('x-rona-analytics-chart') !== 'designer-v3-shared-gasoline-axis') throw new Error('current chart header missing');
          const shim = await import('./functions/portal/admin-approved-analytics-v455-ui.js?qa='+Date.now());
          const shimSource = await (await shim.onRequest({})).text();
          new Function(shimSource);
          if (!shimSource.includes('retired-compat-guard-v5')) throw new Error('old v455 overlay is not retired');
          if (shimSource.includes('makeSvg(') || shimSource.includes('A92.map(x=>x+40)')) throw new Error('old v455 renderer still active');
          NODE
      - name: Build authoritative current artifact
        run: npm run build
      - name: Verify materialization and exclusive ownership
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/portal/analytics-v2-ui
          test -s dist/_headers
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "if(p==='analytics')loadAnalytics()" assets/portal-admin-shell-fast-v1.js
          if grep -q "'аналитика':'analytics'" dist/portal/remaining-sections-ui; then exit 1; fi
          if grep -q 'function renderAnalytics(){' dist/portal/remaining-sections-ui; then exit 1; fi
          echo 'ADMIN_ANALYTICS_CURRENT_SINGLE_OWNER=PASS'
