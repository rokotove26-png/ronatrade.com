name: Admin Analytics Live Market Intelligence QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  contents: read

jobs:
  analytics-live-market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Analytics runtime and approved visual
        run: |
          set -euo pipefail
          node --check functions/portal/analytics-v2-ui.js
          node --check functions/portal/analytics-v2-approved-base.js
          node --check functions/portal/api/v1/admin/analytics.js
          node --input-type=module <<'NODE'
          const analytics = await import('./functions/portal/analytics-v2-ui.js?qa='+Date.now());
          const response = await analytics.onRequest({});
          const source = await response.text();
          new Function(source);
          for (const token of [
            'live-market-intelligence-v2',
            'owner-bootstrap-v2',
            '/portal/api/v1/admin/analytics',
            'rona:admin-pagechange',
            'LIVE DATA',
            'РАЗРЫВ ДАННЫХ',
            'ФАКТ / MTD / FORWARD',
            'Старый snapshot не используется',
            'Устаревший локальный snapshot намеренно скрыт',
            'ronaAnalyticsBalancedLayoutV2',
            'ronaAnalyticsCanonicalHomeVisualV1',
            'ronaAnalyticsDesignerChartV2',
            'rona-analytics-canonical-title'
          ]) if (!source.includes(token)) throw new Error('Analytics canonical token missing: '+token);
          if (response.headers.get('x-rona-analytics-ui') !== 'live-market-intelligence-v2') throw new Error('live ui marker missing');
          if (response.headers.get('x-rona-analytics-data-source') !== 'owner_analytics_admin_bootstrap') throw new Error('live data source marker missing');
          if (response.headers.get('x-rona-analytics-refresh') !== '30s-pagechange-focus-root-rebind') throw new Error('live refresh marker missing');
          if (response.headers.get('x-rona-analytics-layout') !== 'balanced-fluid-1520-v2') throw new Error('approved layout marker missing');
          if (response.headers.get('x-rona-analytics-visual') !== 'home-canonical-frames-title-v1') throw new Error('approved visual marker missing');
          if (response.headers.get('x-rona-analytics-typography') !== 'semantic-palette-v1') throw new Error('approved typography marker missing');
          if (response.headers.get('x-rona-analytics-chart') !== 'designer-depth-v2') throw new Error('approved chart marker missing');
          NODE
      - name: Build current-only artifact
        run: npm run build
      - name: Verify materialized Analytics contract
        run: |
          set -euo pipefail
          grep -q 'live-market-intelligence-v2' dist/portal/analytics-v2-ui
          grep -q 'owner-bootstrap-v2' dist/portal/analytics-v2-ui
          grep -q '/portal/api/v1/admin/analytics' dist/portal/analytics-v2-ui
          grep -q 'rona:admin-pagechange' dist/portal/analytics-v2-ui
          grep -q 'РАЗРЫВ ДАННЫХ' dist/portal/analytics-v2-ui
          grep -q 'Устаревший локальный snapshot намеренно скрыт' dist/portal/analytics-v2-ui
          grep -q 'ronaAnalyticsBalancedLayoutV2' dist/portal/analytics-v2-ui
          grep -q 'ronaAnalyticsCanonicalHomeVisualV1' dist/portal/analytics-v2-ui
          grep -q 'ronaAnalyticsDesignerChartV2' dist/portal/analytics-v2-ui
          grep -q 'rona-analytics-canonical-title' dist/portal/analytics-v2-ui
          grep -q 'X-Rona-Analytics-Refresh: 30s-pagechange-focus-root-rebind' dist/_headers
          grep -q 'X-Rona-Analytics-Layout: balanced-fluid-1520-v2' dist/_headers
          grep -q 'X-Rona-Analytics-Visual: home-canonical-frames-title-v1' dist/_headers
          grep -q 'X-Rona-Analytics-Typography: semantic-palette-v1' dist/_headers
          grep -q 'X-Rona-Analytics-Chart: designer-depth-v2' dist/_headers
      - name: Verify Admin shell ownership
        run: |
          set -euo pipefail
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "if(p==='analytics')loadAnalytics()" assets/portal-admin-shell-fast-v1.js
