name: issue644 online rail stage A QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/rail-current-v6-ui.js'
      - 'functions/portal/rail-current-v7-real-map-ui.js'
      - 'functions/portal/rail-current-v81-maplibre-ui.js'
      - 'assets/portal-admin-shell-fast-v1.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/main-ui/_middleware.js'
      - 'supabase/functions/rona-owner-acceptance/application-owner-boundary-bootstrap-v3.ts'
      - 'supabase/functions/rona-owner-acceptance/rail-admin-read-model-overlay.mjs'
      - 'supabase/migrations/20260919063500_rail_deal_route_engine_v1.sql'
      - 'supabase/migrations/20260919064200_rail_deal_route_destination_fix_v1.sql'
      - 'supabase/migrations/20260919064800_rail_station_alias_kirgili_fix_v1.sql'
      - 'supabase/migrations/20260919065200_rail_route_engine_security_hardening_v1.sql'
      - 'supabase/migrations/20260919065500_rail_sem_inarskaya_geo_v1.sql'
      - 'tests/online-rail-stage-a-644.test.mjs'
      - 'tests/admin-payments-live-middleware-v2.test.mjs'
      - 'scripts/qa-admin-cash-single-owner.mjs'
      - 'scripts/qa-online-rail-stage-a-644-browser.mjs'
      - 'scripts/qa-online-rail-stage-a1-single-owner-644-browser.mjs'
      - '.github/workflows/issue644-online-rail-stage-a-qa.yml'
      - '.github/workflows/rail-v5-owner-qa.yml'
      - '.github/workflows/client-rail-admin-canonical-qa.yml'
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/rail-current-v6-ui.js'
      - 'functions/portal/rail-current-v7-real-map-ui.js'
      - 'functions/portal/rail-current-v81-maplibre-ui.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/main-ui/_middleware.js'
      - 'supabase/functions/rona-owner-acceptance/application-owner-boundary-bootstrap-v3.ts'
      - 'supabase/functions/rona-owner-acceptance/rail-admin-read-model-overlay.mjs'
      - 'supabase/migrations/20260919063500_rail_deal_route_engine_v1.sql'
      - 'supabase/migrations/20260919064200_rail_deal_route_destination_fix_v1.sql'
      - 'supabase/migrations/20260919064800_rail_station_alias_kirgili_fix_v1.sql'
      - 'supabase/migrations/20260919065200_rail_route_engine_security_hardening_v1.sql'
      - 'supabase/migrations/20260919065500_rail_sem_inarskaya_geo_v1.sql'
      - 'tests/online-rail-stage-a-644.test.mjs'
      - 'tests/admin-payments-live-middleware-v2.test.mjs'
      - 'scripts/qa-admin-cash-single-owner.mjs'
      - 'scripts/qa-online-rail-stage-a-644-browser.mjs'
      - 'scripts/qa-online-rail-stage-a1-single-owner-644-browser.mjs'
      - '.github/workflows/issue644-online-rail-stage-a-qa.yml'
      - '.github/workflows/rail-v5-owner-qa.yml'
      - '.github/workflows/client-rail-admin-canonical-qa.yml'

permissions:
  contents: read
  checks: read

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: DELTA ONLY scope guard
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin release/public-go-live-v1.1 --depth=1
          git diff --name-only origin/release/public-go-live-v1.1...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          allowed='^(\.github/workflows/client-rail-admin-canonical-qa\.yml|\.github/workflows/client-rail-admin-visual-parity-v2\.yml|\.github/workflows/issue644-online-rail-stage-a-qa\.yml|\.github/workflows/issue644-online-rail-stage-c12-resolution-bridge\.yml|\.github/workflows/issue670-client-online-rail-parity\.yml|\.github/workflows/rail-v5-owner-qa\.yml|functions/portal/client-rail-current-ui\.js|functions/portal/admin-main-ui-current\.js|functions/portal/main-ui/_middleware\.js|functions/portal/rail-current-v6-ui\.js|functions/portal/rail-current-v7-real-map-ui\.js|functions/portal/rail-current-v81-maplibre-ui\.js|assets/portal-admin-shell-fast-v1\.js|supabase/functions/rona-owner-acceptance/application-owner-boundary-bootstrap-v3\.ts|supabase/functions/rona-owner-acceptance/rail-admin-read-model-overlay\.mjs|supabase/migrations/20260919051500_rail_planned_route_clusters_v1\.sql|supabase/migrations/20260919063500_rail_deal_route_engine_v1\.sql|supabase/migrations/20260919064200_rail_deal_route_destination_fix_v1\.sql|supabase/migrations/20260919064800_rail_station_alias_kirgili_fix_v1\.sql|supabase/migrations/20260919065200_rail_route_engine_security_hardening_v1\.sql|supabase/migrations/20260919065500_rail_sem_inarskaya_geo_v1\.sql|supabase/migrations/20260923082500_rail_xlsx_unresolved_observability_v1\.sql|scripts/qa-client-online-rail-670-browser\.mjs|scripts/qa-client-online-rail-670-real-integration\.mjs|scripts/attach-client-rail-production-v1\.mjs|scripts/qa-admin-cash-single-owner\.mjs|scripts/qa-online-rail-stage-a-644-browser\.mjs|scripts/qa-online-rail-stage-a1-single-owner-644-browser\.mjs|governance/client-online-rail-670-owner-approval-20260919\.json|tests/client-rail-parity-670\.test\.mjs|tests/admin-payments-live-middleware-v2\.test\.mjs|tests/online-rail-stage-a-644\.test\.mjs|tests/online-rail-c12/.*)$'
          if grep -Ev "$allowed" /tmp/changed.txt; then
            echo "ISSUE644_DELTA_ONLY=FAIL"
            exit 1
          fi
          echo "ISSUE644_DELTA_ONLY=PASS"

      - name: Static Stage A and A.1 contract
        run: |
          set -euo pipefail
          node --check functions/portal/rail-current-v6-ui.js
          node --check functions/portal/rail-current-v7-real-map-ui.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/main-ui/_middleware.js
          node --check tests/online-rail-stage-a-644.test.mjs
          node --check tests/admin-payments-live-middleware-v2.test.mjs
          node --check scripts/qa-admin-cash-single-owner.mjs
          node --check scripts/qa-online-rail-stage-a-644-browser.mjs
          node --check scripts/qa-online-rail-stage-a1-single-owner-644-browser.mjs
          node --test tests/online-rail-stage-a-644.test.mjs
          node tests/admin-payments-live-middleware-v2.test.mjs
          node scripts/qa-admin-cash-single-owner.mjs

      - name: Admin shell regression
        run: node --test tests/admin-shell-resilience.test.mjs

      - name: Canonical production build
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Deal-owned map persistence browser proof
        run: node scripts/qa-online-rail-stage-a-644-browser.mjs

      - name: Stage A.1 single-owner 90-second browser proof
        run: node scripts/qa-online-rail-stage-a1-single-owner-644-browser.mjs

      - name: Wait for exact production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs

      - name: Public production convergence proof
        if: github.event_name == 'push'
        env:
          TARGET_ORIGIN: https://ronaoil.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=process.env.TARGET_ORIGIN;
          const sha=process.env.GITHUB_SHA;
          const text=async path=>{
            const r=await fetch(base+path+(path.includes('?')?'&':'?')+'_issue644='+Date.now(),{cache:'no-store'});
            if(!r.ok)throw new Error(path+' HTTP '+r.status);
            return r.text();
          };
          const rail=await text('/portal/rail-current-v81-maplibre-ui');
          const main=await text('/portal/main-ui');
          const requiredRail=[
            "20260918-deal-owned-map-state-v1",
            "20260918-deal-map-persistence-v1",
            "RAIL_MAP_VIEWPORT_STATE_V1",
            "RAIL_MAP_DATA_CONTRACT_V3_COHORTS",
            "EXPEDITOR_XLSX_VIA_RAIL_AI",
            "selectionKey:'deal_key'",
            "sourcePolicy:'EXPEDITOR_XLSX_VIA_RAIL_AI'",
            "productionPolling:false",
            "mode:'DATA_CHANGE_ONLY'",
            "20260921-dominant-cohort-v1",
            "20260921-dominant-rejoin-v2",
            "20260921-final-destination-v3",
            "rona-rail-v6-select-label','Сделка'",
            "function railMapActualRoutePoints(context)",
            "function railMapRemainingRoutePoints(context)",
            "rona-rail-v7-route-actual",
            "rona-rail-v7-route-remaining"
          ];
          for(const marker of requiredRail)if(!rail.includes(marker))throw new Error('RAIL_STAGE_A_MARKER_MISSING:'+marker);
          if(/MOVIZOR/i.test(rail))throw new Error('FORBIDDEN_DIRECT_PROVIDER_MARKER_PRESENT');
          if(rail.includes("filters.append(filterBtn('Все ГУ-12'"))throw new Error('GU12_TOP_LEVEL_SELECTOR_PRESENT');
          if(!main.includes('monitoring:renderRailCurrentShell,'))throw new Error('CURRENT_RAIL_OWNER_MISSING');
          if(!main.includes("__RONA_RAIL_SINGLE_OWNER__='stage-a1-current-only-v1'"))throw new Error('RAIL_STAGE_A1_SINGLE_OWNER_MARKER_MISSING');
          if(!main.includes("__RONA_RAIL_MAIN_UI_FALLBACK_SELF_HEAL__='20260921-dynamic-v1'"))throw new Error('RAIL_DYNAMIC_SELF_HEAL_MARKER_MISSING');
          if(!main.includes('current-v81-main-ui-self-healed'))throw new Error('RAIL_DYNAMIC_SELF_HEAL_OWNER_MISSING');
          if(main.includes('function renderRail(){'))throw new Error('LEGACY_RAIL_FUNCTION_PRESENT');
          if(main.includes("replacePage('monitoring',"))throw new Error('LEGACY_RAIL_REPLACE_PRESENT');
          if(main.includes('renderRail();'))throw new Error('LEGACY_RAIL_DIRECT_CALL_PRESENT');
          if(!main.includes('renderPayments();ensureCashR2Host();renderRailCurrentShell();renderRadio();renderAnalytics();'))throw new Error('RENDER_ADMIN_CURRENT_RAIL_CALL_MISSING');
          console.log('ISSUE644_PUBLIC_PRODUCTION_SOURCE=PASS sha='+sha);
          NODE

          if grep -Ev "$allowed" /tmp/changed.txt; then
            echo "ISSUE644_DELTA_ONLY=FAIL"
            exit 1
          fi
          echo "ISSUE644_DELTA_ONLY=PASS"

      - name: Static Stage A and A.1 contract
        run: |
          set -euo pipefail
          node --check functions/portal/rail-current-v6-ui.js
          node --check functions/portal/rail-current-v7-real-map-ui.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/main-ui/_middleware.js
          node --check tests/online-rail-stage-a-644.test.mjs
          node --check tests/admin-payments-live-middleware-v2.test.mjs
          node --check scripts/qa-admin-cash-single-owner.mjs
          node --check scripts/qa-online-rail-stage-a-644-browser.mjs
          node --check scripts/qa-online-rail-stage-a1-single-owner-644-browser.mjs
          node --test tests/online-rail-stage-a-644.test.mjs
          node tests/admin-payments-live-middleware-v2.test.mjs
          node scripts/qa-admin-cash-single-owner.mjs

      - name: Admin shell regression
        run: node --test tests/admin-shell-resilience.test.mjs

      - name: Canonical production build
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Deal-owned map persistence browser proof
        run: node scripts/qa-online-rail-stage-a-644-browser.mjs

      - name: Stage A.1 single-owner 90-second browser proof
        run: node scripts/qa-online-rail-stage-a1-single-owner-644-browser.mjs

      - name: Wait for exact production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs

      - name: Public production convergence proof
        if: github.event_name == 'push'
        env:
          TARGET_ORIGIN: https://ronaoil.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=process.env.TARGET_ORIGIN;
          const sha=process.env.GITHUB_SHA;
          const text=async path=>{
            const r=await fetch(base+path+(path.includes('?')?'&':'?')+'_issue644='+Date.now(),{cache:'no-store'});
            if(!r.ok)throw new Error(path+' HTTP '+r.status);
            return r.text();
          };
          const rail=await text('/portal/rail-current-v81-maplibre-ui');
          const main=await text('/portal/main-ui');
          const requiredRail=[
            "20260918-deal-owned-map-state-v1",
            "20260918-deal-map-persistence-v1",
            "RAIL_MAP_VIEWPORT_STATE_V1",
            "RAIL_MAP_DATA_CONTRACT_V3_COHORTS",
            "EXPEDITOR_XLSX_VIA_RAIL_AI",
            "selectionKey:'deal_key'",
            "sourcePolicy:'EXPEDITOR_XLSX_VIA_RAIL_AI'",
            "productionPolling:false",
            "mode:'DATA_CHANGE_ONLY'",
            "20260921-dominant-cohort-v1",
            "20260921-dominant-rejoin-v2",
            "20260921-final-destination-v3",
            "rona-rail-v6-select-label','Сделка'",
            "function railMapActualRoutePoints(context)",
            "function railMapRemainingRoutePoints(context)",
            "rona-rail-v7-route-actual",
            "rona-rail-v7-route-remaining"
          ];
          for(const marker of requiredRail)if(!rail.includes(marker))throw new Error('RAIL_STAGE_A_MARKER_MISSING:'+marker);
          if(/MOVIZOR/i.test(rail))throw new Error('FORBIDDEN_DIRECT_PROVIDER_MARKER_PRESENT');
          if(rail.includes("filters.append(filterBtn('Все ГУ-12'"))throw new Error('GU12_TOP_LEVEL_SELECTOR_PRESENT');
          if(!main.includes('monitoring:renderRailCurrentShell,'))throw new Error('CURRENT_RAIL_OWNER_MISSING');
          if(!main.includes("__RONA_RAIL_SINGLE_OWNER__='stage-a1-current-only-v1'"))throw new Error('RAIL_STAGE_A1_SINGLE_OWNER_MARKER_MISSING');
          if(!main.includes("__RONA_RAIL_MAIN_UI_FALLBACK_SELF_HEAL__='20260921-dynamic-v1'"))throw new Error('RAIL_DYNAMIC_SELF_HEAL_MARKER_MISSING');
          if(!main.includes('current-v81-main-ui-self-healed'))throw new Error('RAIL_DYNAMIC_SELF_HEAL_OWNER_MISSING');
          if(main.includes('function renderRail(){'))throw new Error('LEGACY_RAIL_FUNCTION_PRESENT');
          if(main.includes("replacePage('monitoring',"))throw new Error('LEGACY_RAIL_REPLACE_PRESENT');
          if(main.includes('renderRail();'))throw new Error('LEGACY_RAIL_DIRECT_CALL_PRESENT');
          if(!main.includes('renderPayments();ensureCashR2Host();renderRailCurrentShell();renderRadio();renderAnalytics();'))throw new Error('RENDER_ADMIN_CURRENT_RAIL_CALL_MISSING');
          console.log('ISSUE644_PUBLIC_PRODUCTION_SOURCE=PASS sha='+sha);
          NODE
