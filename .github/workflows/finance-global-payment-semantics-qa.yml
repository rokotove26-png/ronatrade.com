name: Finance Global Payment Semantics QA

on:
  pull_request:
    paths:
      - 'supabase/migrations/*finance_global_payment_semantics*.sql'
      - 'supabase/migrations/*finance_global_policy*.sql'
      - 'supabase/migrations/*funding_side*.sql'
      - 'supabase/functions/_shared/admin-payments-v7/funding-side-read-model.mjs'
      - 'supabase/functions/_shared/admin-payments-v7/projection.mjs'
      - 'supabase/functions/_shared/admin-payments-v7/truth.mjs'
      - 'supabase/functions/rona-owner-ai-sync/admin-payments-v7-source-reader*.mjs'
      - 'tests/finance-global-payment-semantics/**'
      - 'tests/admin-payments-v7/funding-side-read-model.test.mjs'
      - 'package.json'
      - '.github/workflows/finance-global-payment-semantics-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:finance-global-payment-semantics
      - run: node --test tests/admin-payments-v7/funding-side-read-model.test.mjs
