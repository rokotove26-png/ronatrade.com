name: Client blank shell diagnostic

on:
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - '.github/workflows/client-blank-shell-diagnostic.yml'
      - 'portal-src/current/client/**'
      - 'assets/portal-runtime/**'
      - 'scripts/attach-client-*.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-current-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decode canonical Client and print shell CSS cascade
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { brotliDecompressSync } from 'node:zlib';
          const manifest=JSON.parse(await readFile('portal-src/current/client/manifest.json','utf8'));
          const encoded=(await Promise.all(manifest.chunks.map(n=>readFile(`portal-src/current/client/${n}`,'utf8')))).join('');
          const html=brotliDecompressSync(Buffer.from(encoded,'base64')).toString('utf8');
          const lines=html.replace(/></g,'>\n<').split('\n');
          const hit=/(?:\.app\b|\.sidebar\b|\.topbar\b|main\.main|\.page\b|#page-home|rona-owner-paint|opacity\s*:\s*0|visibility\s*:\s*hidden|display\s*:\s*none)/i;
          console.log('CLIENT_SHELL_CSS_CONTEXT_BEGIN');
          const seen=new Set();
          for(let i=0;i<lines.length;i++){
            if(!hit.test(lines[i]))continue;
            const a=Math.max(0,i-4),b=Math.min(lines.length,i+5),key=`${a}:${b}`;
            if(seen.has(key))continue;
            seen.add(key);
            console.log(`--- ${a+1}-${b} ---`);
            for(let j=a;j<b;j++)console.log(`${j+1}: ${lines[j].slice(0,2200)}`);
          }
          console.log('CLIENT_SHELL_CSS_CONTEXT_END');
          console.log('CLIENT_HOME_TAGS_BEGIN');
          for(let i=0;i<lines.length;i++){
            if(/<(?:html|body|main|aside|header|section)\b/i.test(lines[i])&&/(?:class=|id=)/i.test(lines[i])&&/(?:app|sidebar|topbar|main|page-home|current-client-main|rona-owner)/i.test(lines[i]))console.log(`${i+1}: ${lines[i].slice(0,2200)}`);
          }
          console.log('CLIENT_HOME_TAGS_END');
          NODE

      - name: Build and print final emitted shell selectors
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const html=await readFile('dist/portal/client.html','utf8');
          const styles=[...html.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style>/gi)].map(m=>m[1]);
          const rules=[];
          for(const css of styles){
            for(const raw of css.split('}')){
              const rule=raw+'}';
              if(/(?:\.app\b|\.sidebar\b|\.topbar\b|main\.main|\.page\b|#page-home|rona-owner-paint|data-rona-client-home)/i.test(rule)&&/(?:display|visibility|opacity|position|z-index|height|min-height|grid-template)/i.test(rule))rules.push(rule.trim());
            }
          }
          console.log('EMITTED_SHELL_RULES_BEGIN');
          rules.forEach((r,i)=>console.log(`${i+1}: ${r.slice(0,3500)}`));
          console.log('EMITTED_SHELL_RULES_END');
          const tags=[...html.matchAll(/<(?:html|body|main|aside|header|section)\b[^>]*>/gi)].map(m=>m[0]).filter(x=>/(?:app|sidebar|topbar|main|page-home|current-client-main|rona-owner)/i.test(x));
          console.log('EMITTED_SHELL_TAGS_BEGIN');
          tags.forEach((t,i)=>console.log(`${i+1}: ${t.slice(0,2200)}`));
          console.log('EMITTED_SHELL_TAGS_END');
          NODE
