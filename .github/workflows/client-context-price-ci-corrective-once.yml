name: Client context price CI corrective once

on:
  push:
    branches:
      - fix/client-context-universal-modules-v1
    paths:
      - .github/workflows/client-context-price-ci-corrective-once.yml

permissions:
  contents: write

jobs:
  corrective:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-context-universal-modules-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply corrective delta
        run: |
          node scripts/apply-client-context-price-ci-corrective-once.mjs
          node - <<'NODE'
          const fs=require('fs');
          const path='scripts/qa-client-price-authority-v1.mjs';
          let text=fs.readFileSync(path,'utf8');
          const old="assert(runtime.includes('item.producer'),'runtime must render producer from server projection');";
          const next="assert(runtime.includes(\"String(x.producer||'')\"),'runtime must render producer from server projection');";
          if(!text.includes(old))throw new Error('price runtime assertion patch target missing');
          fs.writeFileSync(path,text.replace(old,next));
          NODE
      - name: Validate corrective delta
        run: |
          set -euo pipefail
          npm run build
          node scripts/qa-client-contract-authoritative-projection.mjs
          node scripts/qa-client-price-authority-v1.mjs
          npm run ci:client:universal-context
          npm run ci:client:admin-communication-gate
          npm run ci:client:claims-context-scope
          git diff --check
      - name: Commit validated source delta
        run: |
          set -euo pipefail
          git config user.name "RONA LK Architect"
          git config user.email "actions@users.noreply.github.com"
          git add package.json scripts/qa-client-contract-authoritative-projection.mjs scripts/qa-client-price-authority-v1.mjs supabase/functions/rona-portal-api/phase5d.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source delta to commit"
            exit 0
          fi
          git commit -m "fix: align current-context CI and server price authority"
          git push origin HEAD:fix/client-context-universal-modules-v1
