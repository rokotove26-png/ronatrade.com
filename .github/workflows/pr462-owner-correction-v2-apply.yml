          function E(tag,a={},kids=[]){const n=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k==='onclick')n.onclick=v;else n.setAttribute(k,String(v))}A(kids).forEach(x=>x&&n.append(x));return n}
