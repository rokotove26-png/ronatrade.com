name: PR462 owner correction v2 apply

on:
  push:
    branches: [feat/admin-payments-final-owner-screen-passport-v1]
    paths: ['.github/workflows/pr462-owner-correction-v2-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-payments-final-owner-screen-passport-v1
          fetch-depth: 0
      - name: Apply owner correction v2
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/functions/rona-owner-ai-sync/payment-owner-screen.ts <<'EOF'
          // @ts-nocheck

          const ACTIVE_AUTHORITY=new Set(['CONFIRMED','VERIFIED']);
          const n=value=>{const x=Number(value);return Number.isFinite(x)?x:null};
          const s=value=>String(value??'').trim();
          const upper=value=>s(value).toUpperCase();
          const round=value=>Math.round((Number(value)+Number.EPSILON)*1000000)/1000000;
          const asArray=value=>Array.isArray(value)?value:[];
          const sameMoney=(a,b)=>{const x=n(a),y=n(b);return x!==null&&y!==null&&Math.abs(x-y)<0.000001};

          function addCurrency(map,currency,amount){
            const key=upper(currency),value=n(amount);if(!key||value===null)return;
            const row=map.get(key)||{currency:key,amount:0};row.amount=round(row.amount+value);map.set(key,row);
          }
          function sortedTotals(map){return[...map.values()].sort((a,b)=>a.currency.localeCompare(b.currency))}
          function isClientPayment(row){
            return upper(row?.payment_direction)==='INCOMING'
              && upper(row?.payment_kind)==='CLIENT_PAYMENT'
              && upper(row?.bank_fact_status)==='BANK_CONFIRMED'
              && upper(row?.finance_verification_status)==='VERIFIED'
              && ACTIVE_AUTHORITY.has(upper(row?.authority_state))
              && (!row?.lifecycle_state||upper(row.lifecycle_state)==='ACTIVE');
          }
          function isVerifiedAllocation(row){
            return upper(row?.allocation_status)==='VERIFIED'
              && ACTIVE_AUTHORITY.has(upper(row?.authority_state))
              && (!row?.lifecycle_state||upper(row.lifecycle_state)==='ACTIVE');
          }
          export function isReconciledPaymentAllocation(row){
            return isVerifiedAllocation(row)
              && upper(row?.source_system).includes('RECONCIL')
              && !!s(row?.source_version)
              && !!row?.source_timestamp;
          }
          function isConfirmedDealOutgoing(row){
            return upper(row?.deal_allocation_status)==='CONFIRMED'
              && upper(row?.bank_fact_status)==='BANK_CONFIRMED'
              && upper(row?.authority_state)==='CONFIRMED'
              && (!row?.lifecycle_state||upper(row.lifecycle_state)==='ACTIVE')
              && ['COUNTERPARTY_PAYMENT','BANK_FEE'].includes(upper(row?.flow_kind));
          }
          function allocationKey(paymentId,currency){return s(paymentId)+'\u0000'+upper(currency)}

          export function buildPaymentOwnerScreenState({payments=[],paymentAllocations=[],outgoingPayments=[],dealFinanceSummaries=[],paymentScheduleAuthority={}}={}){
            const allPayments=asArray(payments),allAllocations=asArray(paymentAllocations),outgoings=asArray(outgoingPayments);
            const clientPaymentById=new Map(),conflictedClientPaymentIds=new Set();
            for(const row of allPayments){
              if(!isClientPayment(row))continue;const id=s(row?.payment_id);if(!id)continue;
              const previous=clientPaymentById.get(id);
              if(!previous){clientPaymentById.set(id,row);continue}
              if(upper(previous?.currency)!==upper(row?.currency)||n(previous?.amount)!==n(row?.amount))conflictedClientPaymentIds.add(id);
            }
            const clientPayments=[...clientPaymentById.entries()].filter(([id])=>!conflictedClientPaymentIds.has(id)).map(([,row])=>row);
            const clientByKey=new Map(clientPayments.map(row=>[allocationKey(row.payment_id,row.currency),row]));
            const incomingPaymentAllocations=[],dealTotals=new Map(),receiptTotals=new Map(),allocationRowsByPayment=new Map(),rawRowsByPayment=new Map(),paidTotals=new Map();

            // Receipt KPI is full PAYMENT truth. Allocation is a separate authority.
            for(const payment of clientPayments)addCurrency(receiptTotals,payment?.currency,payment?.amount);

            // Only reconciled Finance PAYMENT_ALLOCATION may be projected as confirmed distribution.
            for(const row of allAllocations){
              const key=allocationKey(row?.payment_id,row?.currency),payment=clientByKey.get(key);if(!payment)continue;
              if(!rawRowsByPayment.has(key))rawRowsByPayment.set(key,[]);rawRowsByPayment.get(key).push(row);
              if(!isReconciledPaymentAllocation(row))continue;
              const amount=n(row?.allocated_amount);if(amount===null||amount<0||!s(row?.deal_id))continue;
              const normalized={...row,payment_id:s(row.payment_id),deal_id:s(row.deal_id),currency:upper(row.currency),allocated_amount:amount,
                source_system:s(row?.source_system),source_version:s(row?.source_version),source_timestamp:row?.source_timestamp??null};
              incomingPaymentAllocations.push(normalized);
              if(!allocationRowsByPayment.has(key))allocationRowsByPayment.set(key,[]);allocationRowsByPayment.get(key).push(normalized);
              const dkey=s(row.deal_id)+'\u0000'+upper(row.currency),d=dealTotals.get(dkey)||{deal_id:s(row.deal_id),currency:upper(row.currency),allocated_amount:0};d.allocated_amount=round(d.allocated_amount+amount);dealTotals.set(dkey,d);
            }
            for(const row of outgoings)if(isConfirmedDealOutgoing(row))addCurrency(paidTotals,row?.currency,row?.amount);

            const paymentAllocationSummaries=clientPayments.map(payment=>{
              const key=allocationKey(payment.payment_id,payment.currency),rows=allocationRowsByPayment.get(key)||[],rawRows=rawRowsByPayment.get(key)||[],allocated=round(rows.reduce((sum,row)=>sum+Number(row.allocated_amount||0),0)),amount=n(payment.amount),hasUnreconciled=rawRows.some(row=>!isReconciledPaymentAllocation(row));
              let status='TO_VERIFY',residue=null;
              if(amount!==null&&amount>=0){
                residue=round(amount-allocated);
                if(hasUnreconciled||allocated>amount+0.000001)status='TO_VERIFY';
                else if(allocated===0)status='UNALLOCATED';
                else if(residue>0.000001)status='PARTIALLY_ALLOCATED';
                else status='ALLOCATED';
              }
              return{payment_id:s(payment.payment_id),currency:upper(payment.currency),payment_amount:amount,allocated_total:allocated,unallocated_amount:residue,allocation_projection_status:status,
                allocation_authority:'FINANCE_RECONCILED_PAYMENT_ALLOCATION_V1',unreconciled_allocation_rows:rawRows.filter(row=>!isReconciledPaymentAllocation(row)).length};
            });

            const schedules=asArray(paymentScheduleAuthority?.paymentSchedules),holds=asArray(paymentScheduleAuthority?.paymentScheduleHolds),scheduleByDeal=new Map(schedules.map(row=>[s(row.dealId),row])),holdByDeal=new Map(holds.map(row=>[s(row.dealId),row]));
            const currentMap=new Map(),deferredMap=new Map();
            const allDealTotals=[...dealTotals.values()];
            const dealFinanceCurrentState=asArray(dealFinanceSummaries).map(summary=>{
              const dealId=s(summary?.deal_id),schedule=scheduleByDeal.get(dealId)||null,hold=holdByDeal.get(dealId)||null,dealAllocations=allDealTotals.filter(x=>x.deal_id===dealId);
              const scheduleCurrency=upper(schedule?.currency),dealAllocation=schedule?dealAllocations.find(x=>upper(x.currency)===scheduleCurrency)||null:(dealAllocations.length===1?dealAllocations[0]:null),verifiedReceived=dealAllocation?dealAllocation.allocated_amount:0;
              const scheduleAuthoritative=!!schedule&&n(schedule?.verifiedReceivedAmount)!==null&&sameMoney(schedule?.verifiedReceivedAmount,verifiedReceived);
              if(scheduleAuthoritative){addCurrency(currentMap,schedule?.currency,schedule?.currentDueAmount);addCurrency(deferredMap,schedule?.currency,schedule?.deferredNotDueAmount)}
              const projectedCurrency=scheduleAuthoritative?scheduleCurrency:(dealAllocation?.currency||null);
              const validationErrors=schedule&&!scheduleAuthoritative?['FINANCE_RECONCILED_ALLOCATION_MISMATCH']:(hold?.validationErrors??(hold?.reason?[hold.reason]:[]));
              return{...summary,
                currency:projectedCurrency,
                obligation_amount:scheduleAuthoritative?n(schedule?.obligationAmount):null,
                client_remaining_amount:scheduleAuthoritative?n(schedule?.remainingAmount):null,
                verified_received_amount:verifiedReceived,
                finance_status:scheduleAuthoritative?s(schedule?.financeStatus||summary?.finance_status):'TO_VERIFY',
                payment_schedule_projection_status:scheduleAuthoritative?'AUTHORITATIVE':'TO_VERIFY',
                payment_schedule_state:scheduleAuthoritative?(schedule?.scheduleState??'TO_VERIFY'):'TO_VERIFY',
                current_due_amount:scheduleAuthoritative?n(schedule?.currentDueAmount):null,
                deferred_not_due_amount:scheduleAuthoritative?n(schedule?.deferredNotDueAmount):null,
                payment_schedule_validation_errors:validationErrors
              };
            });

            return{
              ownerPaymentScreenContract:'ADMIN_PAYMENTS_OWNER_CURRENT_STATE_V1',
              clientReceiptContract:'FINANCE_CLIENT_RECEIPTS_PAYMENT_AMOUNT_V2',
              allocationReconciliationContract:'FINANCE_RECONCILED_PAYMENT_ALLOCATION_V1',
              clientPayments,
              incomingPayments:clientPayments,
              incomingPaymentAllocations:incomingPaymentAllocations.sort((a,b)=>a.payment_id.localeCompare(b.payment_id)||a.deal_id.localeCompare(b.deal_id)),
              paymentAllocationSummaries,
              dealAllocationTotals:allDealTotals.sort((a,b)=>a.deal_id.localeCompare(b.deal_id)||a.currency.localeCompare(b.currency)),
              clientReceiptTotalsByCurrency:sortedTotals(receiptTotals),
              paymentTotalsByCurrency:sortedTotals(receiptTotals),
              currentDueTotalsByCurrency:sortedTotals(currentMap),
              deferredNotDueTotalsByCurrency:sortedTotals(deferredMap),
              paidDealTotalsByCurrency:sortedTotals(paidTotals),
              dealFinanceCurrentState,
              outgoingPayments:outgoings
            };
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/rona-owner-ai-sync/runtime.ts')
          s=p.read_text()
          old="pa.authority_state::text authority_state,pa.lifecycle_state::text lifecycle_state"
          new="pa.authority_state::text authority_state,pa.lifecycle_state::text lifecycle_state,\n           pa.source_system,pa.source_version,pa.source_timestamp"
          if s.count(old)!=2:
              raise SystemExit(f'RUNTIME_ALLOCATION_SELECT_COUNT_{s.count(old)}')
          p.write_text(s.replace(old,new))
          PY

          cat > functions/portal/payment-passport-current.js <<'EOF'
          const PASSPORT_CONTRACT='ADMIN_PAYMENT_PASSPORT_AUTHORITY_V2';
          const SCREEN_CONTRACT='ADMIN_PAYMENTS_OWNER_CURRENT_STATE_V1';
          const CLIENT_RECEIPT_CONTRACT='FINANCE_CLIENT_RECEIPTS_PAYMENT_AMOUNT_V2';
          const ALLOCATION_CONTRACT='FINANCE_RECONCILED_PAYMENT_ALLOCATION_V1';
          const asArray=value=>Array.isArray(value)?value:[];
          const s=value=>String(value??'').trim();
          const upper=value=>s(value).toUpperCase();
          const n=value=>{const x=Number(value);return Number.isFinite(x)?x:null};
          const round=value=>Math.round((Number(value)+Number.EPSILON)*1000000)/1000000;
          const activeAuthority=value=>['CONFIRMED','VERIFIED'].includes(upper(value));
          const samePayment=(row,id)=>s(row?.payment_id)===id;
          function allocationReconciled(row){return upper(row?.allocation_status)==='VERIFIED'&&activeAuthority(row?.authority_state)&&(!row?.lifecycle_state||upper(row.lifecycle_state)==='ACTIVE')&&upper(row?.source_system).includes('RECONCIL')&&!!s(row?.source_version)&&!!row?.source_timestamp}
          function canonicalPayment(row){return{
            paymentId:s(row?.payment_id),date:row?.payment_at??null,direction:upper(row?.payment_direction)||null,paymentKind:upper(row?.payment_kind)||null,
            payer:s(row?.payer_name)||null,beneficiary:s(row?.beneficiary_name)||null,counterparty:s(row?.counterparty_name)||null,purpose:s(row?.original_payment_purpose)||null,
            amount:n(row?.amount),currency:upper(row?.currency),bankReference:s(row?.bank_transaction_reference)||null,bankFactStatus:upper(row?.bank_fact_status)||null,
            financeStatus:upper(row?.finance_status)||null,financeVerificationStatus:upper(row?.finance_verification_status)||null,accountingStatus:upper(row?.accounting_closure_status)||null,
            dealAllocationApplicability:upper(row?.deal_allocation_applicability)||null,allocationReviewStatus:upper(row?.allocation_review_status)||null,
            sourceSystem:s(row?.source_system)||null,sourceVersion:s(row?.source_version)||null,sourceTimestamp:row?.source_timestamp??null
          }}
          function explicitLinkedPayments(finance,paymentId,kind){
            return asArray(finance?.payments).filter(row=>upper(row?.payment_kind)===kind&&activeAuthority(row?.authority_state)&&(!row?.lifecycle_state||upper(row.lifecycle_state)==='ACTIVE')&&[row?.source_payment_id,row?.linked_payment_id,row?.parent_payment_id].some(v=>s(v)===paymentId)).map(canonicalPayment);
          }
          export function buildPaymentPassportProjection(finance,paymentId,generatedAt=new Date().toISOString()){
            const id=s(paymentId),errors=[];
            if(!/^[A-Z0-9][A-Z0-9-]{3,100}$/.test(id))errors.push('PAYMENT_ID_INVALID');
            if(String(finance?.ownerPaymentScreenContract||'')!==SCREEN_CONTRACT)errors.push('OWNER_PAYMENT_SCREEN_CONTRACT_MISMATCH');
            if(String(finance?.clientReceiptContract||'')!==CLIENT_RECEIPT_CONTRACT)errors.push('CLIENT_RECEIPT_CONTRACT_MISMATCH');
            if(String(finance?.allocationReconciliationContract||'')!==ALLOCATION_CONTRACT)errors.push('ALLOCATION_RECONCILIATION_CONTRACT_MISMATCH');
            const sourceRows=asArray(finance?.payments).filter(row=>samePayment(row,id));
            if(sourceRows.length!==1)errors.push(sourceRows.length?'PAYMENT_ID_NOT_UNIQUE':'PAYMENT_NOT_FOUND');
            const paymentRow=sourceRows[0]||null,payment=paymentRow?canonicalPayment(paymentRow):null;
            if(paymentRow&&(!activeAuthority(paymentRow?.authority_state)||upper(paymentRow?.bank_fact_status)!=='BANK_CONFIRMED'||(paymentRow?.lifecycle_state&&upper(paymentRow.lifecycle_state)!=='ACTIVE')))errors.push('PAYMENT_NOT_AUTHORITATIVE');
            if(errors.length)return{generatedAt,passportContract:PASSPORT_CONTRACT,paymentId:id,projectionStatus:'TO_VERIFY',validationErrors:errors,payment,allocations:[],totals:{paymentAmount:payment?.amount??null,currency:payment?.currency??null,allocatedTotal:null,unallocatedResidue:null,allocationProjectionStatus:'TO_VERIFY'},linkedBankFees:[],linkedFxConversions:[],fundsTrace:{status:'NOT_ESTABLISHED',directSourceUseLinks:[],note:'Прямая трассировка использования данного платежа не установлена'}};
            const currency=upper(paymentRow?.currency),rawAllocations=asArray(finance?.paymentAllocations).filter(row=>samePayment(row,id)&&upper(row?.currency)===currency&&(!row?.lifecycle_state||upper(row.lifecycle_state)==='ACTIVE'));
            const allocations=rawAllocations.filter(allocationReconciled).map(row=>({paymentId:id,dealId:s(row?.deal_id)||null,allocatedAmount:n(row?.allocated_amount),currency,allocationStatus:upper(row?.allocation_status)||null,financeStatus:upper(row?.finance_status)||null,accountingStatus:upper(row?.accounting_closure_status)||null,allocationReference:s(row?.allocation_reference)||null,allocatedAt:row?.allocated_at??null,sourceSystem:s(row?.source_system)||null,sourceVersion:s(row?.source_version)||null,sourceTimestamp:row?.source_timestamp??null})).filter(row=>row.dealId&&row.allocatedAmount!==null&&row.allocatedAmount>=0);
            const amount=n(paymentRow?.amount),allocatedTotal=round(allocations.reduce((sum,row)=>sum+Number(row.allocatedAmount||0),0)),hasUnreconciled=rawAllocations.some(row=>!allocationReconciled(row));
            let unallocatedResidue=amount===null?null:round(amount-allocatedTotal),allocationProjectionStatus='TO_VERIFY';
            const notApplicable=upper(paymentRow?.deal_allocation_applicability)==='NOT_APPLICABLE';
            if(notApplicable&&rawAllocations.length===0){allocationProjectionStatus='NOT_APPLICABLE';unallocatedResidue=null}
            else if(amount!==null&&amount>=0&&!hasUnreconciled&&allocatedTotal<=amount+0.000001){allocationProjectionStatus=allocatedTotal===0?'UNALLOCATED':unallocatedResidue>0.000001?'PARTIALLY_ALLOCATED':'ALLOCATED'}
            const linkedBankFees=explicitLinkedPayments(finance,id,'BANK_FEE'),linkedFxConversions=explicitLinkedPayments(finance,id,'FX_CONVERSION');
            return{generatedAt,passportContract:PASSPORT_CONTRACT,paymentId:id,projectionStatus:'AUTHORITATIVE',validationErrors:[],payment,allocations,
              totals:{paymentAmount:amount,currency,allocatedTotal,unallocatedResidue,allocationProjectionStatus,allocationAuthority:ALLOCATION_CONTRACT,unreconciledAllocationRows:rawAllocations.filter(row=>!allocationReconciled(row)).length},
              linkedBankFees,linkedFxConversions,
              fundsTrace:{status:'NOT_ESTABLISHED',directSourceUseLinks:[],note:'Прямая трассировка использования данного платежа не установлена'}
            };
          }
          function responseHeaders(base){const headers=new Headers(base||{});headers.set('content-type','application/json; charset=utf-8');headers.set('cache-control','no-store, no-cache, must-revalidate');headers.set('pragma','no-cache');headers.set('x-rona-payment-passport',PASSPORT_CONTRACT);return headers}
          async function fetchTrusted(request,path){const target=new URL('/portal/owner-api',request.url);target.searchParams.set('path',path);const headers=new Headers({accept:'application/json'}),cookie=request.headers.get('cookie');if(cookie)headers.set('cookie',cookie);const requestId=request.headers.get('x-request-id');if(requestId)headers.set('x-request-id',requestId);return fetch(target,{method:'GET',headers,cache:'no-store'})}
          export async function onRequest(context){
            const request=context.request;if(request.method!=='GET')return new Response(JSON.stringify({ok:false,code:'METHOD_NOT_ALLOWED'}),{status:405,headers:responseHeaders()});
            const paymentId=s(new URL(request.url).searchParams.get('paymentId'));if(!/^[A-Z0-9][A-Z0-9-]{3,100}$/.test(paymentId))return new Response(JSON.stringify({ok:false,code:'PAYMENT_PASSPORT_PAYMENT_ID_INVALID'}),{status:400,headers:responseHeaders()});
            const syncResponse=await fetchTrusted(request,'/admin/ai-sync');if(!syncResponse.ok){const status=[401,403].includes(syncResponse.status)?syncResponse.status:502;return new Response(JSON.stringify({ok:false,code:status===403?'PAYMENT_PASSPORT_ACCESS_DENIED':'PAYMENT_PASSPORT_SOURCE_UNAVAILABLE'}),{status,headers:responseHeaders()})}
            const syncPayload=await syncResponse.json().catch(()=>null),finance=syncPayload?.data?.financeFragment;if(!finance||typeof finance!=='object')return new Response(JSON.stringify({ok:false,code:'FINANCE_PROJECTION_MISSING'}),{status:502,headers:responseHeaders()});
            const data=buildPaymentPassportProjection(finance,paymentId,syncPayload?.data?.generatedAt||new Date().toISOString());if(data.validationErrors?.includes('PAYMENT_NOT_FOUND'))return new Response(JSON.stringify({ok:false,code:'PAYMENT_PASSPORT_PAYMENT_NOT_FOUND'}),{status:404,headers:responseHeaders()});
            return new Response(JSON.stringify({ok:true,data}),{status:200,headers:responseHeaders()});
          }
          EOF

