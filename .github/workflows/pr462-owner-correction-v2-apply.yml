          function Q(h,rows,buttons=false){if(!rows.length)return E('div',{class:'rona-app-passport-empty',text:'Подтверждённых данных для этого раздела нет.'});const t=E('table',{class:'rona-owner-table'}),hr=E('tr');h.forEach(x=>hr.append(E('th',{text:x})));t.append(E('thead',{},[hr]));const b=E('tbody');rows.forEach(r=>{const tr=E('tr');r.forEach((x,i)=>{const td=E('td');if(buttons&&i===r.length-1&&x instanceof HTMLElement)td.append(x);else td.textContent=T(x);tr.append(td)});b.append(tr)});t.append(b);return E('div',{class:'rona-owner-table-wrap'},[t])}
          function close(){modal?.remove();modal=null}
          function render(p){close();const back=E('div',{class:'rona-app-passport-backdrop'}),panel=E('section',{class:'rona-app-passport-modal',role:'dialog','aria-modal':'true'}),head=E('div',{class:'rona-app-passport-head'}),x=E('button',{type:'button',text:'Закрыть'}),body=E('div',{class:'rona-app-passport-body'});x.onclick=close;head.append(E('h2',{text:'Паспорт платежа '+T(p?.paymentId)}),x);
          const payment=p?.payment||{},a=S('Основные данные'),g=E('div',{class:'rona-app-passport-grid'});F(g,'Payment ID',payment.paymentId);F(g,'Дата',D(payment.date));F(g,'Направление',direction(payment.direction));F(g,'Тип платежа',kind(payment.paymentKind));F(g,'Плательщик',payment.payer);F(g,'Получатель',payment.beneficiary||payment.counterparty);F(g,'Назначение',payment.purpose);F(g,'Сумма',M(payment.amount,payment.currency));F(g,'Bank reference',payment.bankReference);F(g,'Банковский факт',payment.bankFactStatus);F(g,'Finance status',[payment.financeStatus,payment.financeVerificationStatus].filter(Boolean).join(' / '));F(g,'Accounting status',payment.accountingStatus);a.append(g);body.append(a);
