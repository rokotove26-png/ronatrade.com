name: Final functional hotfix production QA
on:
  push:
    branches: ['hotfix/admin-interactivity-final-functional-20260817']
permissions:
  actions: read
  contents: read
jobs:
  production-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Production functional QA
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const base='https://ronaoil.com',repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          function assert(x,m){if(!x)throw new Error(m)}
          async function waitBool(p,fn,l){for(let i=0;i<300;i++){if(await p.evaluate(fn))return;await p.waitForTimeout(100)}throw new Error(l+' timeout')}
          async function session(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();if(!r.ok||!j.ok)throw new Error(JSON.stringify({status:r.status,code:j.code,proof:j.proof}));return j.session}
          async function ctxFor(b,s){const c=await b.newContext({viewport:{width:1920,height:1080}});await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          (async()=>{const b=await chromium.launch({headless:true}),s=await session(),c=await ctxFor(b,s);
            const aa=await c.request.get(base+'/portal/api/v1/agent/bootstrap'),aj=await aa.json();assert(aa.ok()&&aj.data?.agentPersonId==='AGP-2026-001','agent bootstrap');const ds=(aj.data.deals||[]).map(x=>x.dealId).sort();assert(JSON.stringify(ds)===JSON.stringify(['DEAL-2026-004','DEAL-2026-005','DEAL-2026-006']),'agent scope '+JSON.stringify(ds));assert((await c.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'IDOR foreign deal');assert((await c.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-004')).ok(),'allowed deal');
            const ap=await c.newPage(),ae=[];ap.on('pageerror',e=>ae.push(String(e.message||e)));await ap.goto(base+'/portal/agent?_hot='+Date.now(),{waitUntil:'domcontentloaded'});await waitBool(ap,()=>{const x=[...document.querySelectorAll('.nav button[data-page]')];return x.length===8&&x.every(b=>!b.disabled)},'agent nav ready');for(const p of ['home','clients','prices','deals','economics','settlements','documents','messages']){await ap.locator(`.nav button[data-page="${p}"]`).click();await ap.waitForTimeout(100);assert(await ap.locator('#page-'+p).evaluate(el=>el.classList.contains('active')),p+' inactive')}assert(ae.length===0,'agent JS '+JSON.stringify(ae));
            const ca=await c.request.get(base+'/portal/api/v1/client/bootstrap'),cj=await ca.json();assert(ca.ok()&&Array.isArray(cj.data?.contexts)&&cj.data.contexts.length===0,'client contexts');const cr=await c.request.get(base+'/portal/client',{maxRedirects:0});assert(cr.status()===403,'client route '+cr.status());assert((await cr.text()).includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'client fail code');
            const sp=await c.newPage(),se=[];sp.on('pageerror',e=>se.push(String(e.message||e)));await sp.goto(base+'/portal/staff?_hot='+Date.now(),{waitUntil:'domcontentloaded'});await waitBool(sp,()=>document.querySelector('#identity')&&!/Проверка сессии/.test(document.querySelector('#identity')?.textContent||''),'staff ready');const views=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];const got=await sp.locator('#nav button[data-view]').evaluateAll(xs=>xs.map(x=>x.dataset.view));assert(JSON.stringify(got)===JSON.stringify(views),'staff nav '+JSON.stringify(got));for(const v of views){await sp.locator(`#nav button[data-view="${v}"]`).click();await sp.waitForTimeout(80);assert(!/Загрузка…/.test(await sp.locator('#content').innerText()),'staff loading '+v)}assert(se.length===0,'staff JS '+JSON.stringify(se));await sp.locator('#nav button[data-view="tasks"]').click();const qa=sp.locator('tr[data-task="QA-FINAL-ACTIVATION-20260817-001"]');assert(await qa.count()===1,'QA task absent');await qa.click();await sp.locator('#taskStatus').selectOption('IN_PROGRESS');await sp.locator('#taskNote').fill('Final production activation QA');await sp.locator('#saveTask').click();await waitBool(sp,()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),'staff save');const sb=await c.request.get(base+'/portal/api/v1/staff/bootstrap'),sj=await sb.json();assert(sj.data.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001')?.status==='IN_PROGRESS','write persist');
            const ad=await c.newPage();await ad.goto(base+'/portal/admin?_prop='+Date.now(),{waitUntil:'domcontentloaded'});await waitBool(ad,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin prop ready');const prop=await ad.evaluate(()=>({task:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001'),audit:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id==='QA-FINAL-ACTIVATION-20260817-001')}));assert(prop.task?.status==='IN_PROGRESS','Admin propagation');assert(prop.audit&&String(prop.audit.action).includes('STAFF_TASK'),'audit propagation');for(const m of ['PUT','PATCH','DELETE'])assert((await c.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:m})).status()===405,m+' method');
            async function logout(path,kind){const ss=await session(),cc=await ctxFor(b,ss),p=await cc.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded'});let x=kind==='admin'?p.locator('#adminLogoutBtn'):kind==='staff'?p.locator('#ronaLogout'):kind==='select'?p.locator('form[action="/portal/auth/logout"] button'):p.locator('button,a,[role="button"]').filter({hasText:'Выйти'}).first();await x.waitFor({state:'visible',timeout:15000});await x.click();await p.waitForURL(u=>new URL(u).pathname==='/',{timeout:15000});assert(!(await cc.cookies()).some(x=>['rona_portal_at','rona_portal_rt'].includes(x.name)),'cookies '+kind);const pr=await cc.request.get(base+'/portal/admin',{maxRedirects:0});assert([302,303,401,403].includes(pr.status()),'protected '+kind);await cc.close()}
            await logout('/portal/admin','admin');await logout('/portal/staff','staff');await logout('/portal/agent','agent');await logout('/portal/select','select');await c.close();await b.close();console.log('RONA_FUNCTIONAL_HOTFIX_QA='+JSON.stringify({ok:true,agent:{id:aj.data.agentPersonId,deals:ds},client:'FAIL_CLOSED_ZERO_BINDING',staff:'PASS',writeBackendAdminAudit:'PASS',methods:['GET','POST'],logoutRoot:'PASS'}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
