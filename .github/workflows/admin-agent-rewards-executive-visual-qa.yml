name: Agent Rewards Executive Financial UI QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/agent-rewards-v1-ui.js'
      - 'functions/portal/owner-api.js'
      - 'supabase/migrations/*agent_rewards_current_finance_reconciled*.sql'
      - 'supabase/migrations/*agent_rewards_reconciled_owner_correction*.sql'
      - 'supabase/migrations/*agent_rewards_current_finance_effective_chains*.sql'
      - 'supabase/migrations/*agent_rewards_effective_chain_owner_correction*.sql'
      - 'tests/admin-agent-rewards-finance-workspace-v1.test.mjs'
      - 'supabase/migrations/*agent_rewards_source_current_jsonb_scalar_guard*.sql'
      - 'tests/fixtures/agent-rewards-jsonb-scalar-guard-v20-integration.sql'
      - 'tests/admin-agent-rewards-executive-visual.test.mjs'
      - '.github/workflows/admin-agent-rewards-executive-visual-qa.yml'

permissions:
  contents: read

jobs:
  financial-presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify scoped Agent Rewards financial UI changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > /tmp/agent-rewards-ui-files.txt
          cat /tmp/agent-rewards-ui-files.txt
          if grep -Ev '^(functions/portal/(agent-rewards-v1-ui|owner-api)\.js|tests/admin-agent-rewards-(finance-workspace-v1|executive-visual)\.test\.mjs|tests/fixtures/(agent-rewards-finance-v(16-integration|18-effective-chains-integration)|agent-rewards-jsonb-scalar-guard-v20-integration)\.sql|supabase/migrations/20261014(113000_agent_rewards_current_finance_reconciled_v16|114500_agent_rewards_reconciled_owner_correction_v17|120000_agent_rewards_current_finance_effective_chains_v18|121500_agent_rewards_effective_chain_owner_correction_v19|145000_agent_rewards_source_current_jsonb_scalar_guard_v20)\.sql|\.github/workflows/admin-agent-rewards-(executive-visual-qa|functional-finance-qa)\.yml)$' /tmp/agent-rewards-ui-files.txt; then
            echo "FINANCE_UI_SCOPE_VIOLATION" >&2
            exit 1
          fi
          test -s /tmp/agent-rewards-ui-files.txt
          if grep -Fxq 'functions/portal/agent-rewards-v1-ui.js' /tmp/agent-rewards-ui-files.txt; then
            grep -Fxq 'tests/admin-agent-rewards-executive-visual.test.mjs' /tmp/agent-rewards-ui-files.txt
            echo 'FINANCE_UI_SCOPE=PASS'
          else
            # Incident recovery: allow a DB-only v20 JSONB safety fix, but require
            # the migration, Postgres scalar fixture, and finance source-contract test.
            grep -Fxq 'supabase/migrations/20261014145000_agent_rewards_source_current_jsonb_scalar_guard_v20.sql' /tmp/agent-rewards-ui-files.txt
            grep -Fxq 'tests/fixtures/agent-rewards-jsonb-scalar-guard-v20-integration.sql' /tmp/agent-rewards-ui-files.txt
            grep -Fxq 'tests/admin-agent-rewards-finance-workspace-v1.test.mjs' /tmp/agent-rewards-ui-files.txt
            echo 'FINANCE_DB_SCALAR_HOTFIX_SCOPE=PASS'
          fi
      - name: Verify finance P&L contract and unchanged authority
        run: |
          node --check functions/portal/agent-rewards-v1-ui.js
          node --test tests/admin-agent-rewards-finance-workspace-v1.test.mjs
      - name: Install Chromium for rendered Admin finance view
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render dashboard and verify expense grouping
        run: node --test tests/admin-agent-rewards-executive-visual.test.mjs
