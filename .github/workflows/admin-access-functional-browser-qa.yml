name: admin-access-functional-browser

on:
  push:
    branches:
      - release/public-go-live-v1.1
  pull_request:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-functional-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Admin control-plane source
        run: deno check --node-modules-dir=auto --config supabase/functions/rona-admin-control-plane/deno.json supabase/functions/rona-admin-control-plane/index.ts
      - name: Verify Client impersonation static shell source contract
        run: node tests/admin-client-impersonation-static-shell.test.mjs
      - name: Verify browser API impersonation gateway contract
        run: node --test tests/browser-api-impersonation-gateway.test.mjs
      - name: Build current Admin artifact
        run: npm run build
      - name: Install Chromium runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prove Client impersonation boots with native tab binding
        run: node scripts/qa-client-impersonation-tab-binding-browser-v1.mjs
      - name: Prove access creation and permanent user deletion
        run: node scripts/qa-admin-access-functional-browser.mjs
