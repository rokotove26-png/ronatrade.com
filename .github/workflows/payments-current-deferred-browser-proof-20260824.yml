name: Payments V7 funding-first production assembly proof

on:
  push:
    branches:
      - 'hotfix/payments-deals-layout-finance-20260824'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  payments-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify funding-first source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node tests/payments-v7-funding-first-owner-ui.test.mjs
          node scripts/check-payments-v7-funding-first-ui-no-hardcode.mjs
          node --check functions/portal/admin.js
          node --check functions/portal/main-ui/index.js
          node --check functions/portal/admin-main-ui-current.js
          node --input-type=module <<'NODE'
          import {onRequest} from './functions/portal/main-ui/index.js';
          const response=await onRequest();
          if(response.status!==200)throw new Error('main-ui status '+response.status);
          const text=await response.text();
          for(const marker of [
            'ADMIN_PAYMENTS_V7_FUNDING_PAYMENT_PASSPORT_V2',
            'paymentsV7OwnerPassportBody',
            'paymentsV7OwnerEvent',
            'shared_native_residual_refs',
            'DIRECT_FUNDING_SIDE_DEBIT_MISSING',
            'SETTLEMENT_LINKAGE_MISSING'
          ])if(!text.includes(marker))throw new Error('missing funding-first runtime marker '+marker);
          for(const forbidden of ['deal_equivalent_amount','paymentPassportLines']){
            if(text.includes(forbidden))throw new Error('legacy Payments contract marker remains '+forbidden);
          }
          console.log('PAYMENTS_V7_FUNDING_FIRST_ASSEMBLY=PASS');
          NODE

      - name: Resolve deployed target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<180;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-PAYMENTS-V7-DEPLOY-PROOF'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){
              if(cf.conclusion!=='success')throw new Error('Cloudflare '+cf.conclusion);
              const production=ref==='refs/heads/release/public-go-live-v1.1';
              await sleep(production?6000:4000);
              if(production){fs.appendFileSync(process.env.GITHUB_OUTPUT,'origin=https://ronaoil.com\n');return}
              const text=String(cf.output?.summary||'')+' '+String(cf.output?.text||'')+' '+String(cf.details_url||'');
              const urls=[...text.matchAll(/https:\/\/[a-z0-9.-]+\.pages\.dev/ig)].map(x=>x[0]);
              const u=urls.find(x=>!/rona-trade-public\.pages\.dev$/i.test(x))||urls[0];
              if(!u)throw new Error('Preview URL not found');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,`origin=${u}\n`);return;
            }}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Verify deployed funding-first runtime
        env:
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/main.headers -o /tmp/main.js "$TARGET_ORIGIN/portal/main-ui?payments_v7_proof=$GITHUB_SHA"
          node --check /tmp/main.js
          grep -q 'ADMIN_PAYMENTS_V7_FUNDING_PAYMENT_PASSPORT_V2' /tmp/main.js
          grep -q 'paymentsV7OwnerPassportBody' /tmp/main.js
          grep -q 'shared_native_residual_refs' /tmp/main.js
          grep -q 'DIRECT_FUNDING_SIDE_DEBIT_MISSING' /tmp/main.js
          grep -q 'SETTLEMENT_LINKAGE_MISSING' /tmp/main.js
          if grep -q 'deal_equivalent_amount' /tmp/main.js; then exit 1; fi
          if grep -q 'paymentPassportLines' /tmp/main.js; then exit 1; fi
          echo 'PAYMENTS_V7_DEPLOYED_RUNTIME=PASS'

      - name: Publish Payments browser proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Payments V7 funding-first assembly/deploy proof failed'
          if [ "$JOB_STATUS" = 'success' ]; then state=success; description='Payments V7 funding-first assembly/deploy proof PASS'; fi
          target="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/payments-browser-proof","description":"%s","target_url":"%s"}' "$state" "$description" "$target")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
