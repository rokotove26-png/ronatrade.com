name: Client tenant isolation QA

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/**'
      - 'supabase/functions/rona-portal-api/client.ts'
      - 'supabase/functions/rona-portal-api/phase5d.ts'
      - '.github/workflows/client-tenant-isolation-qa.yml'
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/**'
      - 'supabase/functions/rona-portal-api/client.ts'
      - 'supabase/functions/rona-portal-api/phase5d.ts'
      - '.github/workflows/client-tenant-isolation-qa.yml'

permissions:
  contents: read

jobs:
  client-tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check tenant middleware
        run: node --check functions/portal/_middleware.js
      - name: Preserve frozen Client visual baseline
        run: node scripts/qa-client-portal-visual-freeze.mjs
      - name: Verify server-authoritative tenant guard
        run: |
          set -euo pipefail
          grep -Fq 'rona-client-server-tenant-guard-v1' functions/portal/_middleware.js
          grep -Fq 'SERVER_SESSION_AUTHORITY' functions/portal/_middleware.js
          grep -Fq '/portal/api/v1/client/bootstrap' functions/portal/_middleware.js
          grep -Fq "x-rona-client-tenant-context','server-session-authority-v2" functions/portal/_middleware.js
          grep -Fq 'CLIENT_CONTEXTS.splice(0,CLIENT_CONTEXTS.length,next)' functions/portal/_middleware.js
          grep -Fq 'client_user_has_contract_access' supabase/functions/rona-portal-api/phase5d.ts
          grep -Fq 'client_user_has_contract_access' 'functions/portal/[[path]].js'
          echo 'CLIENT_TENANT_ISOLATION_CONTRACT=PASS'
      - name: Verify fail-closed context routing
        run: |
          set -euo pipefail
          grep -Fq 'CONTEXT_NOT_FOUND' supabase/functions/rona-portal-api/phase5d.ts
          grep -Fq 'requireRealClientContext' 'functions/portal/[[path]].js'
          grep -Fq 'CLIENT_CONTEXT_NOT_AUTHORIZED' 'functions/portal/[[path]].js'
          echo 'CLIENT_TENANT_FAIL_CLOSED=PASS'
