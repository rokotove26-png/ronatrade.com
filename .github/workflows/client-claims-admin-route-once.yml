name: Client claims Admin route once

on:
  push:
    branches:
      - fix/client-context-universal-modules-v1

permissions:
  contents: write

jobs:
  claims-admin-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire Admin-mediated client claims read projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('supabase/functions/rona-portal-api/index.ts')
          source=path.read_text()

          market_import='import { clientMarketSafeScoped } from "./client-market-scope.ts";'
          claims_import='import { clientClaims } from "./client-claims.ts";'
          if claims_import not in source:
              if source.count(market_import)!=1:
                  raise SystemExit(f'expected one market import, got {source.count(market_import)}')
              source=source.replace(market_import,market_import+'\n'+claims_import,1)

          marker='if(route==="/v1/client/prices"&&req.method==="GET")'
          route='if(route==="/v1/client/claims"&&req.method==="GET"){if(!c.roles.includes("CLIENT"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const clientId=url.searchParams.get("clientId"),contractId=url.searchParams.get("contractId");if(!clientId||!contractId)return send(origin,400,{ok:false,code:"CLIENT_CONTRACT_CONTEXT_REQUIRED"});const claims=await clientClaims(c,clientId,contractId);return claims===null?send(origin,404,{ok:false,code:"CONTEXT_NOT_FOUND"}):send(origin,200,{ok:true,projection_contract:"ADMIN_CLIENT_SERVER_V1",claims})}'
          if route not in source:
              if source.count(marker)!=1:
                  raise SystemExit(f'expected one prices route marker, got {source.count(marker)}')
              source=source.replace(marker,route+marker,1)

          path.write_text(source)
          PY
      - name: Run claims and context regression checks
        run: |
          node scripts/qa-client-claims-context-scope-v1.mjs
          node scripts/qa-client-backend-context-scope-v1.mjs
          node tests/client-background-section-preload-v1.test.mjs
          node tests/client-context-universal-modules-v1.test.mjs
          node scripts/qa-client-current-context-consumers-v1.mjs
      - name: Commit claims route and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/client-claims-admin-route-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/rona-portal-api/index.ts .github/workflows/client-claims-admin-route-once.yml
          git commit -m 'feat(client): add Admin-mediated claims read projection'
          git push origin HEAD:${GITHUB_REF_NAME}
