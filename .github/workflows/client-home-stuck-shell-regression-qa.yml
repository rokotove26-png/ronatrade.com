# Owner-approved functional recovery; no visual design change.
name: Client Home stuck-shell regression QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches: [release/public-go-live-v1.1]

permissions:
  contents: read

jobs:
  client-home-stuck-shell-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current Client artifact
        run: npm run build
      - name: Install Chrome browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi
      - name: Prove a stuck first-paint stylesheet cannot keep Client Home blank
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const path=require('path');
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const page=await browser.newPage({viewport:{width:1400,height:900}});
            const html='<!doctype html><html><head><style id="rona-client-home-first-paint-guard">#page-home{display:none!important}</style><style>#page-home{position:relative;width:900px;min-height:500px}.frame{width:850px;border:1px solid #345;padding:10px}</style></head><body><nav><button id="navHome">Главная</button></nav><main><section id="page-home"><section class="frame"><h1>Главная</h1></section><section class="frame"><span>Выбрана компания</span></section><section data-rona-client-home-owner="command-center-v2"></section></section></main></body></html>';
            await page.route('https://rona.test/portal/client',route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}));
            await page.goto('https://rona.test/portal/client',{waitUntil:'domcontentloaded'});
            await page.addScriptTag({path:path.resolve('assets/portal-runtime/client-home-current-only-v1.js')});
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-rona-client-home-prepaint')==='blocked-until-command-center-v2');
            let snapshot=await page.evaluate(()=>({
              guardMedia:document.getElementById('rona-client-home-first-paint-guard')?.media||'',
              display:getComputedStyle(document.getElementById('page-home')).display,
              state:document.documentElement.getAttribute('data-rona-client-home-state')
            }));
            assert(snapshot.guardMedia==='all','first-paint guard was not armed '+JSON.stringify(snapshot));
            assert(snapshot.display==='none','synthetic stuck shell was not reproduced '+JSON.stringify(snapshot));

            await page.evaluate(()=>document.documentElement.setAttribute('data-rona-client-home-state','error'));
            await page.waitForFunction(()=>document.getElementById('rona-client-home-first-paint-guard')?.media==='not all');
            snapshot=await page.evaluate(()=>({
              guardMedia:document.getElementById('rona-client-home-first-paint-guard')?.media||'',
              display:getComputedStyle(document.getElementById('page-home')).display,
              prepaint:document.documentElement.getAttribute('data-rona-client-home-prepaint'),
              release:document.documentElement.getAttribute('data-rona-client-home-prepaint-release'),
              degraded:document.documentElement.getAttribute('data-rona-client-home-degraded'),
              text:document.querySelector('[data-rona-client-home-owner="command-center-v2"]')?.textContent||''
            }));
            assert(snapshot.guardMedia==='not all','stuck guard was not hard-released '+JSON.stringify(snapshot));
            assert(snapshot.display!=='none','Client Home remained hidden after hard release '+JSON.stringify(snapshot));
            assert(snapshot.prepaint==='released'&&snapshot.release==='command-center-error','prepaint did not release on error '+JSON.stringify(snapshot));
            assert(snapshot.text.includes('Данные временно недоступны'),'controlled degraded owner was not visible '+JSON.stringify(snapshot));

            await page.dispatchEvent('#navHome','pointerdown');
            await page.waitForFunction(()=>document.getElementById('rona-client-home-first-paint-guard')?.media==='all');
            snapshot=await page.evaluate(()=>({
              guardMedia:document.getElementById('rona-client-home-first-paint-guard')?.media||'',
              display:getComputedStyle(document.getElementById('page-home')).display,
              prepaint:document.documentElement.getAttribute('data-rona-client-home-prepaint')
            }));
            assert(snapshot.guardMedia==='all'&&snapshot.display==='none'&&snapshot.prepaint==='blocked-until-command-center-v2','guard did not re-arm on Home navigation '+JSON.stringify(snapshot));

            await page.evaluate(()=>{
              const owner=document.querySelector('[data-rona-client-home-owner="command-center-v2"]');
              owner.innerHTML='<div>READY CURRENT HOME</div>';
              document.documentElement.setAttribute('data-rona-client-home-ready','true');
              document.documentElement.setAttribute('data-rona-client-home-state','ready');
            });
            await page.waitForFunction(()=>document.getElementById('rona-client-home-first-paint-guard')?.media==='not all');
            snapshot=await page.evaluate(()=>({
              guardMedia:document.getElementById('rona-client-home-first-paint-guard')?.media||'',
              display:getComputedStyle(document.getElementById('page-home')).display,
              prepaint:document.documentElement.getAttribute('data-rona-client-home-prepaint'),
              ready:document.documentElement.getAttribute('data-rona-client-home-ready')
            }));
            assert(snapshot.guardMedia==='not all'&&snapshot.display!=='none'&&snapshot.prepaint==='released'&&snapshot.ready==='true','ready Home did not hard-release reusable guard '+JSON.stringify(snapshot));
            console.log('CLIENT_HOME_STUCK_SHELL_HARD_FAIL_OPEN=PASS');
            console.log(JSON.stringify(snapshot));
            await browser.close();
          })().catch(error=>{console.error(error.stack||error);process.exit(1)});
          NODE
