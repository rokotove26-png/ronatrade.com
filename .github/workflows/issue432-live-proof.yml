name: Issue432 live root cause diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue432-live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe3f3fa3db5146abacbbd56e59ebd0472ba9fb18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact production revision
        run: npm run build
      - name: Run non-mutating artifact and auth inventory diagnostic
        env:
          RONA_PROD_SHA: fe3f3fa3db5146abacbbd56e59ebd0472ba9fb18
          RONA_PROD_ORIGIN: https://ronatrade.com
        run: node scripts/qa/issue432-live-proof.mjs
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue432-live-proof
          path: |
            issue432-live-proof.json
            issue432-auth-inventory.json
          if-no-files-found: error
