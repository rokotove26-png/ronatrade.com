name: Client Analytics canonical published-current browser QA v7
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'assets/portal-runtime/client-market-intelligence-v1.js'
      - 'scripts/attach-client-market-intelligence-v1.mjs'
      - 'scripts/qa-client-market-intelligence-v1.mjs'
      - 'scripts/qa-client-analytics-source-safe-browser-v3.mjs'
      - 'scripts/qa-client-analytics-canonical-real-page-v4.mjs'
      - '.github/workflows/client-analytics-current-source-browser-v3.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'assets/portal-runtime/client-market-intelligence-v1.js'
      - 'scripts/attach-client-market-intelligence-v1.mjs'
      - 'scripts/qa-client-market-intelligence-v1.mjs'
      - 'scripts/qa-client-analytics-source-safe-browser-v3.mjs'
      - 'scripts/qa-client-analytics-canonical-real-page-v4.mjs'
      - '.github/workflows/client-analytics-current-source-browser-v3.yml'
permissions:
  contents: read
  checks: read
jobs:
  client-current-publications:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and client publication source scope preflight
        run: |
          node --check assets/portal-runtime/client-market-intelligence-v1.js
          node --check scripts/attach-client-market-intelligence-v1.mjs
          node --check scripts/qa-client-analytics-source-safe-browser-v3.mjs
          grep -q "CLIENT_AUTHORIZED_PUBLISHED_CURRENT_ONLY" assets/portal-runtime/client-market-intelligence-v1.js
          grep -q "source_freshness_state!=='CURRENT'" assets/portal-runtime/client-market-intelligence-v1.js
          grep -q "PUBLISHED" supabase/functions/rona-portal-api/client-market-intelligence-effective-client-v1.ts
          echo 'CLIENT_ANALYTICS_SOURCE_SCOPE_SYNTAX=PASS'
      - name: Build canonical Client LK and verify existing visual freeze
        run: npm run build
      - name: Client published-content isolation and market freshness contract
        run: |
          node scripts/qa-client-market-intelligence-v1.mjs
          node --test tests/analytics-client-freshness-gate-v2.test.mjs
          node --check dist/assets/portal-runtime/client-market-intelligence-v1.js
          node --check scripts/qa-client-analytics-source-safe-browser-v3.mjs
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Browser-prove Client published source & context isolation
        run: node scripts/qa-client-analytics-source-safe-browser-v3.mjs
      - name: Browser-prove real canonical Client LK page with impersonation query
        run: node scripts/qa-client-analytics-canonical-real-page-v4.mjs
      - name: Wait exact production release Cloudflare SHA
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify updated Client runtime is actually deployed
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 "https://ronaoil.com/assets/portal-runtime/client-market-intelligence-v1.js?qa=${GITHUB_SHA}" -o /tmp/rona-client-analytics.js
          grep -q '20261010-client-approved-admin-exact-v14' /tmp/rona-client-analytics.js
          grep -q 'CLIENT_LPG_HISTORICAL_SEGMENTS_V13' /tmp/rona-client-analytics.js
          grep -q 'CLIENT_LPG_HISTORICAL_SEGMENTS_V13' /tmp/rona-client-analytics.js
          grep -q 'paintAuthorizedPrices' /tmp/rona-client-analytics.js
          grep -q 'CANONICAL_AN2_PUBLISHED_CONTRACT_PRICE_VISIBLE_V9' /tmp/rona-client-analytics.js
          grep -q 'SERVER_AUTHORITATIVE_PRICE_PROJECTION' /tmp/rona-client-analytics.js
          grep -q 'CANONICAL_VISUAL_OWNER' /tmp/rona-client-analytics.js
          grep -q "root.querySelector(':scope > #rona-analytics-v2')" /tmp/rona-client-analytics.js
          grep -q 'view.setPayload(payload)' /tmp/rona-client-analytics.js
          grep -q 'CLIENT_AUTHORIZED_PUBLISHED_CURRENT_ONLY' /tmp/rona-client-analytics.js
          grep -q 'ERROR_NO_ARCHIVE' /tmp/rona-client-analytics.js
          if grep -Eq '(mi-grid|mi-card|owner\.replaceChildren\(|root\.prepend\(owner\))' /tmp/rona-client-analytics.js; then
            echo 'Canonical Analytics substitution regression' >&2
            exit 1
          fi
          if grep -q 'setInterval(' /tmp/rona-client-analytics.js; then
            echo 'Client Analytics periodic polling violation' >&2
            exit 1
          fi
          echo 'RONA_CLIENT_ANALYTICS_EXACT_ADMIN_V14_PRODUCTION=PASS'
