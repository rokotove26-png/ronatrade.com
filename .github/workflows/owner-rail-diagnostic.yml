name: Owner rail live diagnostic
on:
  push:
    branches:
      - 'hotfix/admin-interactivity-owner-rail-diagnostic-*'
permissions:
  actions: read
  checks: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: npm install --no-save --ignore-scripts playwright@1.54.2
      - name: Wait preview and inspect rail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function preview(){for(let i=0;i<180;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-RAIL-DIAG'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('cloudflare '+cf.conclusion);const text=String(cf.output?.summary||'')+' '+String(cf.output?.text||'')+' '+String(cf.details_url||'');const urls=[...text.matchAll(/https:\/\/[a-z0-9.-]+\.pages\.dev/ig)].map(x=>x[0]);const u=urls.find(x=>!/rona-trade-public\.pages\.dev$/i.test(x))||urls[0];if(!u)throw new Error('preview missing');await sleep(4000);return u}}await sleep(2000)}throw new Error('preview timeout')}
          async function broker(){for(let i=0;i<5;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const text=await r.text();let j={};try{j=JSON.parse(text)}catch{};if(r.ok&&j.ok&&j.session?.access_token)return j.session;console.log('BROKER_ATTEMPT',i,r.status,text.slice(0,300));await sleep(2000)}throw new Error('broker failed')}
          (async()=>{const origin=await preview(),s=await broker(),host=new URL(origin).hostname,b=await chromium.launch({headless:true,channel:'chrome'}),ctx=await b.newContext({viewport:{width:1920,height:1080}});await ctx.addCookies([{name:'rona_portal_at',value:s.access_token,domain:host,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:host,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);for(const endpoint of ['/portal/owner-acceptance-api/admin/bootstrap','/portal/owner-api?path=%2Fadmin%2Fbootstrap']){const r=await ctx.request.get(origin+endpoint);const t=await r.text();console.log('ENDPOINT',endpoint,r.status(),t.slice(0,5000))}const p=await ctx.newPage();await p.goto(origin+'/portal/admin?_diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});for(let i=0;i<300;i++){if(await p.evaluate(()=>window.__RONA_OWNER_ADMIN_READY__===true))break;await p.waitForTimeout(100)}console.log('READY',await p.evaluate(()=>({owner:window.__RONA_OWNER_ADMIN_READY__,err:window.__RONA_OWNER_ADMIN_ERROR__||null})));await p.locator('#nav button[data-page="monitoring"]').click();await p.waitForTimeout(300);console.log('OPTIONS',JSON.stringify(await p.locator('#page-monitoring select option').allTextContents()));console.log('MONITOR_HTML',(await p.locator('#page-monitoring').innerHTML()).slice(0,8000));await ctx.close();await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
