name: MCP All Role Coordinate Pilots QA

on:
  push:
    branches:
      - release/public-go-live-v1.1
      - rollout/all-role-coordinate-pilots-20260818
  pull_request:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  pilot-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static fixed-role pilot invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_mcp_transport.js
          node --check functions/_mcp_role_entry.js
          node --check functions/_mcp_consent_bridge.js
          node --check functions/_mcp_oauth_token_bridge.js
          node --check 'functions/operations-pilot/[[path]].js'
          node --check 'functions/finance-pilot/[[path]].js'
          node --check 'functions/legal-pilot/[[path]].js'
          node --check 'functions/market-analyst-pilot/[[path]].js'
          node --check 'functions/rail-logistics-pilot/[[path]].js'
          node --check 'functions/.well-known/[[path]].js'
          node --check supabase/functions/rona-mcp-gateway/index.js
          node --check supabase/functions/rona-mcp-oauth-token/index.js
          node --check supabase/functions/rona-mcp-consent-bridge/index.js

          grep -Fq "'rona-mcp-operations-pilot':['OPERATIONS_DIRECTOR','AI-OPERATIONS-DIRECTOR']" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "'rona-mcp-finance-pilot':['FINANCE','AI-FINANCE']" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "'rona-mcp-legal-pilot':['LEGAL','AI-LEGAL']" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "'rona-mcp-market-analyst-pilot':['COMMERCIAL_DIRECTOR','AI-COMMERCIAL-DIRECTOR']" supabase/functions/rona-mcp-gateway/index.js
          grep -Fq "'rona-mcp-rail-logistics-pilot':['RAIL_LOGISTICS','AI-RAIL-LOGISTICS']" supabase/functions/rona-mcp-gateway/index.js

          grep -Fq "COORDINATE_PILOT_SLUGS" supabase/functions/rona-mcp-oauth-token/index.js
          grep -Fq "mcp_gateway_config_coordinate_pilot_binding_check" supabase/migrations/20260818202500_all_business_role_coordinate_pilots.sql
          grep -Fq "rona-mcp-finance-pilot" supabase/migrations/20260818202500_all_business_role_coordinate_pilots.sql
          grep -Fq "rona-mcp-legal-pilot" supabase/migrations/20260818202500_all_business_role_coordinate_pilots.sql
          grep -Fq "rona-mcp-rail-logistics-pilot" supabase/migrations/20260818202500_all_business_role_coordinate_pilots.sql

          grep -Fq "mcp_gateway_config_coordinate_pilot_binding_check" supabase/migrations/20260826233503_commercial_director_runtime_cutover_v2.sql
          grep -Fq "server_slug='rona-mcp-market-analyst-pilot' and business_role='COMMERCIAL_DIRECTOR'" supabase/migrations/20260826233503_commercial_director_runtime_cutover_v2.sql
          grep -Fq "identity_id='AI-COMMERCIAL-DIRECTOR'" supabase/migrations/20260826233503_commercial_director_runtime_cutover_v2.sql
          grep -Fq "where identity_id='AI-MARKET-ANALYST';" supabase/migrations/20260826233503_commercial_director_runtime_cutover_v2.sql

          if grep -R -Eq "rona-mcp-system-admin-pilot|/system-admin-pilot" functions supabase/functions supabase/migrations _routes.json; then
            echo SYSTEM_ADMIN_COORDINATE_PILOT_FORBIDDEN
            exit 1
          fi

          if grep -Eq "name:'(deal_status_write|payment_status_write|accounting_close|shipment_fact_create|rail_movement_fact_create|publication_publish|contract_mutate|document_mutate|client_binding_mutate)'" supabase/functions/rona-mcp-gateway/index.js; then
            echo AUTHORITATIVE_BUSINESS_MUTATION_TOOL_FORBIDDEN
            exit 1
          fi

          for route in finance-pilot legal-pilot market-analyst-pilot rail-logistics-pilot; do
            grep -Fq "\"/${route}/*\"" _routes.json
          done

          echo ALL_ROLE_COORDINATE_PILOT_SOURCE=PASS

      - name: Wait for Cloudflare production
        if: github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let i=0;i<120;i++){
              const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-ALL-ROLE-PILOT-QA'}});
              if(r.ok){
                const j=await r.json();
                const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');
                if(cf?.status==='completed'){
                  if(cf.conclusion!=='success')throw new Error('Cloudflare deployment '+cf.conclusion);
                  await sleep(5000);
                  console.log('CLOUDFLARE=PASS');
                  return;
                }
              }
              await sleep(3000);
            }
            throw new Error('Cloudflare deployment timeout');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Public discovery matrix
        if: github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          set -euo pipefail
          for seg in operations finance legal market-analyst rail-logistics; do
            p=$(curl -fsS "https://ronaoil.com/.well-known/oauth-protected-resource/${seg}-pilot/mcp")
            a=$(curl -fsS "https://ronaoil.com/.well-known/oauth-authorization-server/${seg}-pilot")
            echo "$p" | grep -q 'mcp:read'
            echo "$p" | grep -q 'mcp:coordinate'
            echo "$a" | grep -q 'refresh_token'
            echo "$a" | grep -q 'S256'

            code=$(curl -sS -o /tmp/pilot.mcp -D /tmp/pilot.headers -w '%{http_code}' \
              -X POST "https://ronaoil.com/${seg}-pilot/mcp" \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"RONA QA","version":"1"}}}')
            test "$code" = '401'
            grep -Fqi "oauth-protected-resource/${seg}-pilot/mcp" /tmp/pilot.headers
            grep -Fqi 'mcp:read mcp:coordinate' /tmp/pilot.headers
          done

          for seg in operations finance legal market-analyst rail-logistics system-admin; do
            p=$(curl -fsS "https://ronaoil.com/.well-known/oauth-protected-resource/${seg}/mcp")
            echo "$p" | grep -q 'mcp:read'
            if echo "$p" | grep -q 'mcp:coordinate'; then
              echo "PRIMARY_COORDINATE_REGRESSION=$seg"
              exit 1
            fi
          done

          echo ALL_ROLE_COORDINATE_PILOT_PUBLIC=PASS
