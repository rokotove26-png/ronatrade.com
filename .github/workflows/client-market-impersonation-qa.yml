name: Client market impersonation QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'functions/portal/api/v1/client/market-intelligence.js'
      - 'supabase/functions/rona-portal-api/index.ts'
      - 'supabase/functions/rona-portal-api/client-market-intelligence-effective-client-v1.ts'
      - 'tests/specific-client-route-impersonation.test.mjs'
      - 'tests/client-market-impersonation-authority.test.mjs'
      - '.github/workflows/client-market-impersonation-qa.yml'
  workflow_dispatch:

jobs:
  market-impersonation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Specific Client route impersonation
        run: node --test tests/specific-client-route-impersonation.test.mjs
      - name: Market authority source contract
        run: node --test tests/client-market-impersonation-authority.test.mjs
      - name: Effective Client projection TypeScript check
        run: deno check --config supabase/functions/rona-portal-api/deno.json --node-modules-dir=auto supabase/functions/rona-portal-api/client-market-intelligence-effective-client-v1.ts
