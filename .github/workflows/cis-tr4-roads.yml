name: CIS TR4 Roads

on:
  push:
    branches:
      - tmp/cis-tr4-20260827

permissions:
  contents: read

jobs:
  inspect-roads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet xlrd==2.0.1
      - name: Download and list railway administrations
        run: |
          python - <<'PY'
          import urllib.request, xlrd, collections
          url='https://sovetgt.org/tr4/2026/08/27/Kniga_2_2026-08-27.xls'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=60).read()
          open('/tmp/book2.xls','wb').write(data)
          book=xlrd.open_workbook('/tmp/book2.xls')
          s=book.sheet_by_name('РП')
          cnt=collections.Counter()
          samples={}
          for r in range(6,s.nrows):
              name=str(s.cell_value(r,1)).strip()
              road=str(s.cell_value(r,3)).strip()
              code=str(s.cell_value(r,5)).strip()
              if name and road and code:
                  if code.endswith('.0'): code=code[:-2]
                  cnt[road]+=1
                  samples.setdefault(road,(name,code))
          for road,n in sorted(cnt.items()):
              print('ROAD',repr(road),'COUNT',n,'SAMPLE',repr(samples[road]))
          print('UNIQUE_ROADS',len(cnt),'TOTAL_ROWS',sum(cnt.values()))
          PY
