name: Admin Operations Current V1 Event Driven QA

on:
  pull_request:
    paths:
      - 'functions/portal/admin-operations-command-center-v7.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/owner-api.js'
      - 'supabase/migrations/20260920154500_admin_operations_current_v1_event_driven.sql'
      - 'supabase/migrations/20260920161129_admin_operations_automation_health_v1.sql'
      - 'tests/admin-operations-current-v1/**'
      - '.github/workflows/admin-operations-current-v1-event-driven-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check functions/portal/admin-operations-command-center-v7.js
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/owner-api.js
      - name: Event-driven contract tests
        run: node --test tests/admin-operations-current-v1/event-driven-static.test.mjs
