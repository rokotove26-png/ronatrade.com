name: Apply Admin session resilience pages v3

on:
  push:
    branches: [fix/admin-session-resilience-db-pressure-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[session-resilience-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-session-resilience-db-pressure-20260826
          fetch-depth: 0
      - name: Patch transient-auth handling and Admin request pressure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(t,o,n,label):
              c=t.count(o)
              if c!=1: raise SystemExit(f'{label}: expected 1, got {c}')
              return t.replace(o,n,1)

          p=Path('functions/portal/[[path]].js');s=p.read_text()
          s=one(s,"  return { ok: r.ok, data };\n}\nasync function authRefresh(refreshToken) {","  return { ok: r.ok, status: r.status, data };\n}\nasync function authRefresh(refreshToken) {",'password status')
          s=one(s,"  return { ok: r.ok, data };\n}\nasync function authLogout(accessToken) {","  return { ok: r.ok, status: r.status, data };\n}\nasync function authLogout(accessToken) {",'refresh status')
          replacement='''const SESSION_RETRY_DELAYS_MS=Object.freeze([0,250,500,1000,2000,2500]);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function sessionProbe(accessToken){
            if(!accessToken)return{state:'INVALID',me:null,status:401};let lastStatus=503;
            for(const delay of SESSION_RETRY_DELAYS_MS){if(delay)await sleep(delay);try{const r=await upstream(accessToken,'/session/me');lastStatus=r.status;if(r.ok){const j=await r.json().catch(()=>null);if(j?.ok&&j?.user)return{state:'VALID',me:j,status:r.status};continue}if(r.status===401||r.status===403)return{state:'INVALID',me:null,status:r.status};if(r.status===429||r.status>=500)continue;return{state:'INVALID',me:null,status:r.status}}catch(_){lastStatus=503}}
            return{state:'UNAVAILABLE',me:null,status:lastStatus};
          }
          async function ensureSession(request){
            const cookies=parseCookies(request.headers.get('cookie')),access=cookies[ACCESS_COOKIE]||'',refresh=cookies[REFRESH_COOKIE]||'';
            if(access){const probe=await sessionProbe(access);if(probe.state==='VALID')return{access,refresh,me:probe.me,setCookies:[]};if(probe.state==='UNAVAILABLE')return{unavailable:true,access,refresh,me:null,setCookies:[]}}
            if(!refresh)return null;let next;try{next=await authRefresh(refresh)}catch(_){return{unavailable:true,access,refresh,me:null,setCookies:[]}}
            if(!next.ok||!next.data?.access_token||!next.data?.refresh_token){if(next.status===429||Number(next.status||0)>=500)return{unavailable:true,access,refresh,me:null,setCookies:[]};return null}
            const probe=await sessionProbe(next.data.access_token);if(probe.state==='UNAVAILABLE')return{unavailable:true,access:next.data.access_token,refresh:next.data.refresh_token,me:null,setCookies:tokenCookies(next.data)};if(probe.state!=='VALID')return null;
            return{access:next.data.access_token,refresh:next.data.refresh_token,me:probe.me,setCookies:tokenCookies(next.data)};
          }
          function rolesOf(me)'''
          s,n=re.subn(r'async function sessionMe\(accessToken\) \{.*?\nfunction rolesOf\(me\)',replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'session block: {n}')
          unavailable='''function unavailablePage(nextPath='/portal/'){
            const target=String(nextPath||'/portal/').startsWith('/portal/')?String(nextPath||'/portal/'):'/portal/',safeTarget=escapeHtml(target);
            return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="2;url=${safeTarget}"><title>RONA Trade — Восстановление соединения</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05090d;color:#eef4f7;font:16px Inter,Arial,sans-serif}.box{width:min(520px,calc(100vw - 32px));padding:28px;border:1px solid #29404e;border-radius:16px;background:#0b151d}.muted{color:#93a8b3}.btn{display:inline-block;margin-top:12px;padding:11px 14px;border:1px solid #365464;border-radius:10px;color:#eef4f7;text-decoration:none;background:#101f29}</style></head><body><main class="box"><h1>Восстанавливаю соединение</h1><p class="muted">Сессия сохранена. Сервер авторизации временно недоступен; повторная проверка выполняется автоматически.</p><a class="btn" href="${safeTarget}">Повторить сейчас</a></main></body></html>`;
          }
          '''
          s=one(s,"function deniedPage(code = 'ROLE_MISMATCH') {",unavailable+"function deniedPage(code = 'ROLE_MISMATCH') {",'unavailable page')
          s=one(s,"    const me = await sessionMe(login.data.access_token);\n    if (!me) { await authLogout(login.data.access_token); return html(loginPage('Доступ к порталу не активирован.'), 403, clearCookies()); }\n    const roles = rolesOf(me);","    const loginProbe=await sessionProbe(login.data.access_token);\n    if(loginProbe.state==='UNAVAILABLE')return html(unavailablePage(parseLocalNext(next)||'/portal/'),503,tokenCookies(login.data));\n    if(loginProbe.state!=='VALID'){await authLogout(login.data.access_token);return html(loginPage('Доступ к порталу не активирован.'),403,clearCookies());}\n    const me=loginProbe.me;\n    const roles=rolesOf(me);",'login probe')
          s=one(s,"    const next = await authRefresh(refresh);\n    if (!next.ok || !next.data?.access_token || !next.data?.refresh_token) return json({ ok:false, code:'PORTAL_ACCESS_DENIED' }, 401, clearCookies());","    let next;try{next=await authRefresh(refresh)}catch(_){return json({ok:false,code:'PORTAL_AUTH_BACKEND_UNAVAILABLE',retryable:true},503)}\n    if(!next.ok||!next.data?.access_token||!next.data?.refresh_token){if(next.status===429||Number(next.status||0)>=500)return json({ok:false,code:'PORTAL_AUTH_BACKEND_UNAVAILABLE',retryable:true},503);return json({ok:false,code:'PORTAL_ACCESS_DENIED'},401,clearCookies())}",'api refresh')
          s=one(s,"  const session = await ensureSession(request);\n  if (!session) return json({ ok:false, code:'PORTAL_ACCESS_DENIED' }, 401, clearCookies());\n  const roles = rolesOf(session.me);","  const session=await ensureSession(request);\n  if(session?.unavailable)return json({ok:false,code:'PORTAL_AUTH_BACKEND_UNAVAILABLE',retryable:true},503,session.setCookies);\n  if(!session)return json({ok:false,code:'PORTAL_ACCESS_DENIED'},401,clearCookies());\n  const roles=rolesOf(session.me);",'authority session')
          s=one(s,"    const session = await ensureSession(request);\n    if (session) {\n      const target = defaultTarget(rolesOf(session.me));","    const session=await ensureSession(request);\n    if(session?.unavailable)return html(unavailablePage('/portal/login'),503,session.setCookies);\n    if(session){\n      const target=defaultTarget(rolesOf(session.me));",'login route')
          s=one(s,"  const session = await ensureSession(request);\n  if (!session) return redirect(`/portal/login?next=${encodeURIComponent(canonicalProtectedPath(path))}`, 303, clearCookies());\n  const roles = rolesOf(session.me);","  const session=await ensureSession(request);\n  if(session?.unavailable)return html(unavailablePage(canonicalProtectedPath(path)),503,session.setCookies);\n  if(!session)return redirect(`/portal/login?next=${encodeURIComponent(canonicalProtectedPath(path))}`,303,clearCookies());\n  const roles=rolesOf(session.me);",'protected route')
          p.write_text(s)

          p=Path('functions/portal/admin.js');a=p.read_text()
          gate='''const FETCHGATE=`<script id="rona-admin-backend-fetch-gate" data-rona-ui="backend-fetch-gate-v1">(()=>{'use strict';if(window.__RONA_BACKEND_FETCH_GATE__)return;window.__RONA_BACKEND_FETCH_GATE__='v1';const raw=window.fetch.bind(window),MAX=4,q=[];let active=0;function gated(input){try{const rawUrl=typeof input==='string'?input:(input instanceof URL?input.href:(input&&input.url)||''),u=new URL(rawUrl,location.href);if(u.origin!==location.origin)return false;const p=u.pathname;return p.startsWith('/portal/api/')||p.startsWith('/portal/admin-authority')||p.includes('price-updates-api')||p.includes('owner-acceptance-api')||p.includes('control-plane')}catch{return false}}function pump(){while(active<MAX&&q.length){active++;const job=q.shift();job().finally(()=>{active--;pump()})}}window.fetch=(input,init)=>{if(!gated(input))return raw(input,init);return new Promise((resolve,reject)=>{q.push(()=>Promise.resolve(raw(input,init)).then(resolve,reject));pump()})}})();</script>`;
          '''
          a=one(a,'const LOADER=\'<script id="rona-main-ui-loader"',gate+'const LOADER=\'<script id="rona-main-ui-loader"','fetch gate')
          a=one(a,'const BODY_LOADERS=LOADER+BOOTRESCUE+','const BODY_LOADERS=FETCHGATE+LOADER+BOOTRESCUE+','loader gate')
          p.write_text(a)

          for p in [Path('supabase/functions/rona-portal-api/shared.ts'),Path('supabase/functions/rona-owner-acceptance/index.ts'),Path('supabase/functions/rona-admin-control-plane/index.ts'),Path('supabase/functions/rona-admin-authority/index.ts')]:
              if p.exists():
                  x=p.read_text();x=x.replace('postgres(DB,{prepare:false,max:1})','postgres(DB,{prepare:false,max:1,idle_timeout:1,connect_timeout:3,max_lifetime:15})').replace('postgres(DB, { prepare: false, max: 1 })','postgres(DB, { prepare: false, max: 1, idle_timeout: 1, connect_timeout: 3, max_lifetime: 15 })');p.write_text(x)

          for wf in ['.github/workflows/apply-admin-session-resilience-hotfix.yml','.github/workflows/apply-admin-session-resilience-pages-v3.yml']:
              q=Path(wf)
              if q.exists(): q.unlink()
          PY
          node --check 'functions/portal/[[path]].js'
          node --check functions/portal/admin.js
          grep -q PORTAL_AUTH_BACKEND_UNAVAILABLE 'functions/portal/[[path]].js'
          grep -q backend-fetch-gate-v1 functions/portal/admin.js
          grep -q idle_timeout supabase/functions/rona-portal-api/shared.ts
      - name: Commit generated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RONA Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Admin session against transient DB pressure [session-resilience-applied]'
          git push origin HEAD:fix/admin-session-resilience-db-pressure-20260826
