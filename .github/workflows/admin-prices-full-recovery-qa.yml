name: admin-prices-full-recovery-qa
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - functions/portal/prices-current-ui.js
      - functions/portal/price-updates-api.js
      - tests/admin-prices-full-recovery.test.mjs
      - assets/portal-admin-shell-fast-v1.js
      - .github/workflows/admin-prices-full-recovery-qa.yml
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Prices recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/price-updates-api.js
          node --check functions/portal/prices-current-ui.js
          node --test tests/admin-prices-full-recovery.test.mjs
          grep -q "prices:{src:'/portal/prices-current-ui" assets/portal-admin-shell-fast-v1.js
          grep -q "__RONA_PRICES_RECOVERY_V2__" functions/portal/prices-current-ui.js
          grep -q "api('workspace')" functions/portal/prices-current-ui.js
          grep -q "api('bootstrap')" functions/portal/prices-current-ui.js
          grep -q "Promise.allSettled" functions/portal/prices-current-ui.js
          grep -q "owner_prices_admin_workspace" functions/portal/price-updates-api.js
          ! grep -q "MutationObserver" functions/portal/prices-current-ui.js
          ! grep -q "owner('/admin/bootstrap')" functions/portal/prices-current-ui.js
          ! grep -Eq 'RONA-PRICE-LIST-2026-[0-9]' functions/portal/prices-current-ui.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ui=fs.readFileSync('functions/portal/prices-current-ui.js','utf8');
          const api=fs.readFileSync('functions/portal/price-updates-api.js','utf8');
          for(const marker of ["api('apply'","api('reject'","api('audience'",'Действующий прайс-лист','Публикация прайса']){
            if(!ui.includes(marker))throw new Error('missing Prices function: '+marker);
          }
          for(const marker of ['owner_apply_price_change_proposal','owner_reject_price_change_proposal','owner_set_price_publication_audience','owner_price_updates_bootstrap','owner_prices_admin_workspace']){
            if(!api.includes(marker))throw new Error('missing server Prices RPC mapping: '+marker);
          }
          if(ui.includes('MutationObserver'))throw new Error('renderer competition regression');
          if(ui.includes("owner('/admin/bootstrap')"))throw new Error('generic Admin bootstrap became a Prices dependency');
          if(/RONA-PRICE-LIST-2026-[0-9]/.test(ui))throw new Error('current publication id hardcoded into UI');
          console.log('ADMIN_PRICES_FULL_RECOVERY_QA=PASS');
          NODE
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; desc='Admin Prices recovery QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Admin Prices recovery QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/admin-prices-full-recovery\",\"description\":\"$desc\"}" >/dev/null
