name: Agent Rewards Functional Finance Reconciliation QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'supabase/migrations/*agent_rewards_current_finance_reconciled*.sql'
      - 'supabase/migrations/*agent_rewards_reconciled_owner_correction*.sql'
      - 'supabase/migrations/*agent_rewards_current_finance_effective_chains*.sql'
      - 'supabase/migrations/*agent_rewards_effective_chain_owner_correction*.sql'
      - 'supabase/migrations/*agent_rewards_source_current_jsonb_scalar_guard*.sql'
      - 'supabase/migrations/*agent_rewards_source_locked_payment_identity*.sql'
      - 'tests/fixtures/agent-rewards-bnk-identity-v21-integration.sql'
      - 'tests/fixtures/agent-rewards-jsonb-scalar-guard-v20-integration.sql'
      - 'tests/admin-agent-rewards-finance-workspace-v1.test.mjs'
      - 'tests/fixtures/agent-rewards-finance-v18-effective-chains-integration.sql'
      - 'tests/fixtures/agent-rewards-finance-v16-integration.sql'
      - 'functions/portal/agent-rewards-v1-ui.js'
      - 'functions/portal/owner-api.js'
      - '.github/workflows/admin-agent-rewards-functional-finance-qa.yml'

permissions:
  contents: read

jobs:
  finance-reconciliation-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: agent_rewards_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_rewards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: agent_rewards_test
      PGUSER: postgres
      PGPASSWORD: test_only_password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Test v16 baseline and corrected v18+v19 chain selection with 009, 010 and 011 fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/agent-rewards-finance-v18-effective-chains-integration.sql
      - name: Reproduce JSON null/scalar incident and validate correct OWNER payload preservation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/agent-rewards-jsonb-scalar-guard-v20-integration.sql
      - name: Verify BNK source-locked identity and ambiguity fail-closed cases
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/agent-rewards-bnk-identity-v21-integration.sql
      - name: Install Chromium for Agent Rewards grouped counterparty interface
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify actual grouped finance browser dashboard
        run: node --test tests/admin-agent-rewards-executive-visual.test.mjs
      - name: Verify affected Owner API and finance JS syntax
        run: |
          node --check functions/portal/owner-api.js
          node --check functions/portal/agent-rewards-v1-ui.js
          node --test tests/admin-agent-rewards-finance-workspace-v1.test.mjs
