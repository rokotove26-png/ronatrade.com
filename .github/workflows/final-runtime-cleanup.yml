name: Final runtime cleanup
on:
  push:
    branches: ['release/public-go-live-v1.1']
    paths: ['.github/workflows/final-runtime-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - name: Remove temporary finalization workflows and deploy trigger
        run: |
          set -euo pipefail
          git config user.name 'RONA Production QA'
          git config user.email 'actions@users.noreply.github.com'
          rm -f \
            .github/workflows/admin-production-runtime-diagnostic.yml \
            .github/workflows/agent-production-runtime-diagnostic.yml \
            .github/workflows/apply-agent-client-logout-control-production.yml \
            .github/workflows/apply-final-qa-cloudflare-wait.yml \
            .github/workflows/final-production-activation-qa.yml \
            .github/workflows/final-production-activation-synchronized-v2.yml \
            .github/workflows/final-production-activation-synchronized.yml \
            .github/workflows/final-runtime-cleanup.yml \
            ops/PRODUCTION_ACTIVATION_DEPLOY_TRIGGER_20260817.txt
          git add -A
          git commit -m 'Finalize production runtime and remove temporary QA workflows'
          git push origin HEAD:${GITHUB_REF_NAME}
