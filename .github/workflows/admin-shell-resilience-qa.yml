name: Admin Shell Resilience QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  workflow_dispatch:

jobs:
  admin-shell-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check Admin current-only code
        run: |
          node --check assets/portal-admin-shell-fast-v1.js
          node --check assets/portal-admin-runtime-watchdog-v1.js
          node --check functions/portal/admin.js
          node --check functions/portal/_middleware.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/analytics-v2-ui.js
          node --check functions/portal/rail-safe-fallback-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check functions/portal/deals-r1-r11-ui.js
          node --check functions/portal/claims-r2-ui.js
          node --check functions/portal/prices-current-ui.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          node --check scripts/build-pages-direct-canonical.mjs
      - name: Verify isolated owner JWT gateway is live and fail-closed
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module - <<'NODE'
          const url='https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-admin-control-plane/owner-auth-fallback';
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),5000);
          try{
            const r=await fetch(url,{headers:{apikey:'sb_publishable_W2MxTx00ILiugSyZKp8uyQ_zBzcyorL',authorization:'Bearer definitely-not-a-valid-jwt',accept:'application/json'},signal:controller.signal});
            if(r.status!==401)throw new Error('OWNER_GATEWAY_EXPECTED_401_GOT_'+r.status);
            console.log('ADMIN_OWNER_JWT_GATEWAY_LIVE_FAIL_CLOSED=PASS');
          }finally{clearTimeout(timer)}
          NODE
      - name: Live public Admin route must deny missing or fabricated session
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://ronaoil.com/portal/admin'
          for mode in no-cookie forged-cookie; do
            header_file="admin-negative-$mode.headers"
            body_file="admin-negative-$mode.body"
            if [ "$mode" = 'forged-cookie' ]; then
              status=$(curl --silent --show-error --max-time 25 --output "$body_file" \
                --dump-header "$header_file" --write-out '%{http_code}' \
                --cookie 'rona_portal_at=synthetic-invalid-owner-claims' "$endpoint")
            else
              status=$(curl --silent --show-error --max-time 25 --output "$body_file" \
                --dump-header "$header_file" --write-out '%{http_code}' "$endpoint")
            fi
            test "$status" = 302
            node --input-type=module - "$header_file" "$body_file" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const headers=readFileSync(process.argv[2],'utf8').toLowerCase();
          const body=readFileSync(process.argv[3],'utf8');
          assert.match(headers,/location:\s*https?:\/\/[^\r\n]*\/portal\/login(?:[?\r\n]|$)/i);
          assert.match(headers,/cache-control:\s*no-store/i);
          assert.doesNotMatch(body,/rona-server-authenticated-admin-bootstrap|__RONA_ADMIN_AUTH_CONTEXT__|admin-shell-fast/i);
          console.log('RONA_LIVE_ADMIN_NO_SESSION_DENIED=PASS');
          NODE
          done
      - name: Run Admin current-only regression guards
        run: |
          node tests/admin-shell-resilience.test.mjs
          node tests/admin-auth-session-convergence-639.test.mjs
          node --test --test-reporter=tap tests/security/admin-session-backed-fallback-v1.test.mjs
          node tests/admin-owner-jwt-fallback-source.test.mjs
          node tests/admin-current-only-shell-contract.test.mjs
          node tests/admin-runtime-watchdog.test.mjs
          node tests/admin-visible-runtime-polling-v1.test.mjs
          node tests/admin-current-access-nav-v2.test.mjs
          node scripts/qa-admin-single-owner.mjs
      - name: Build Cloudflare Pages artifact
        run: npm run build
      - name: Verify current-only Admin artifact
        run: |
          test -s dist/portal/admin.html
          test -s dist/assets/portal-admin-shell-fast-v1.js
          test -s dist/assets/portal-admin-runtime-watchdog-v1.js
          test -s dist/assets/portal-canonical/background.png
          test -s dist/assets/portal-canonical/logo.svg
          grep -q 'rona-admin-shell" content="current-only-v2' dist/portal/admin.html
          grep -q 'data-rona-admin-shell="current-only-v2' dist/portal/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" dist/portal/admin.html
          grep -q 'grid-template-columns:272px minmax(0,1fr)' dist/portal/admin.html
          grep -q 'min-height:48px' dist/portal/admin.html
          grep -q 'font-size:14.5px' dist/portal/admin.html
          grep -q 'data-action="create-access">Создать доступ</button>' dist/portal/admin.html
          grep -q 'data-page="agent-settlements"' dist/portal/admin.html
          ! grep -q 'data-page="claims"' dist/portal/admin.html
          grep -q 'data-page="market-news"' dist/portal/admin.html
          grep -q 'portal-admin-shell-fast-v1.js' dist/portal/admin.html
          grep -q 'portal-admin-runtime-watchdog-v1.js' dist/portal/admin.html
          grep -q '/portal/clients-agents-current-ui' dist/assets/portal-admin-shell-fast-v1.js
          grep -q "__RONA_ADMIN_SHELL_RESILIENCE__='single-owner-v3'" dist/assets/portal-admin-shell-fast-v1.js
          grep -q "__RONA_ADMIN_RUNTIME_WATCHDOG__='page-aware-v23-agent-rewards-correction-gate-v3'" dist/assets/portal-admin-runtime-watchdog-v1.js
          grep -q '/portal/analytics-v2-ui' dist/assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/rail-safe-fallback-ui' dist/assets/portal-admin-shell-fast-v1.js
          ! grep -q 'location.reload(' dist/assets/portal-admin-runtime-watchdog-v1.js
          ! grep -q 'location.replace(' dist/assets/portal-admin-runtime-watchdog-v1.js
          ! grep -q 'adminLoginGate' dist/portal/admin.html
          ! grep -q 'rona-admin-auth-v3413' dist/portal/admin.html
          ! grep -q 'Временный автономный вход' dist/portal/admin.html
          ! grep -q 'admin_externalized' dist/portal/admin.html
          test "$(wc -c < dist/portal/admin.html)" -lt 60000
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.architecture!=='CURRENT_ONLY_ADMIN_AND_CLIENT_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"
          echo 'ADMIN_SHELL_RESILIENCE_CURRENT=PASS'
