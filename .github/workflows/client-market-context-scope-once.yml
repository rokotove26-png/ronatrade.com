name: Client market context scope once

on:
  push:
    branches:
      - fix/client-context-universal-modules-v1

permissions:
  contents: write

jobs:
  market-scope:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope client market to CURRENT_CONTEXT
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          router_path=Path('supabase/functions/rona-portal-api/index.ts')
          router=router_path.read_text()
          old_import='import { PortalHttpError, staffBootstrap, updateStaffTask, addStaffTaskMessage, acknowledgeReverseEvent, createCanonicalDelta, transitionCanonicalDelta, clientMarketSafe, clientPrices, clientContext, submitClientApplication, executiveDecideApplication, executiveRegisterDeal, executiveCreateSupplierRequest, executiveRecordSupplierResponse, executiveResourceDecision, eventStatus, adminConfirmSignedContract } from "./phase5d.ts";'
          new_import='import { PortalHttpError, staffBootstrap, updateStaffTask, addStaffTaskMessage, acknowledgeReverseEvent, createCanonicalDelta, transitionCanonicalDelta, clientPrices, clientContext, submitClientApplication, executiveDecideApplication, executiveRegisterDeal, executiveCreateSupplierRequest, executiveRecordSupplierResponse, executiveResourceDecision, eventStatus, adminConfirmSignedContract } from "./phase5d.ts";\nimport { clientMarketSafeScoped } from "./client-market-scope.ts";'
          if router.count(old_import)!=1:
              raise SystemExit(f'expected one phase5d market import, got {router.count(old_import)}')
          router=router.replace(old_import,new_import,1)
          if router.count('market:data.market||[]')!=1:
              raise SystemExit('bootstrap market projection marker mismatch')
          router=router.replace('market:data.market||[]','market:[]',1)
          old_routes='if(route==="/v1/client/bootstrap"&&req.method==="GET"){if(!c.roles.includes("CLIENT"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const data=await clientBootstrap(c);data.market=await filterAuthoritativePublishedRows(await clientMarketSafe(c));return send(origin,200,{ok:true,data:clientBootstrapProjection(data)})}if(route==="/v1/client/market"&&req.method==="GET")return c.roles.includes("CLIENT")?send(origin,200,{ok:true,market:await filterAuthoritativePublishedRows(await clientMarketSafe(c))}):send(origin,403,{ok:false,code:"ROLE_MISMATCH"});'
          new_routes='if(route==="/v1/client/bootstrap"&&req.method==="GET"){if(!c.roles.includes("CLIENT"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const data=await clientBootstrap(c);return send(origin,200,{ok:true,data:clientBootstrapProjection(data)})}if(route==="/v1/client/market"&&req.method==="GET"){if(!c.roles.includes("CLIENT"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const clientId=url.searchParams.get("clientId"),contractId=url.searchParams.get("contractId");if(!clientId||!contractId)return send(origin,400,{ok:false,code:"CLIENT_CONTRACT_CONTEXT_REQUIRED"});return send(origin,200,{ok:true,market:await filterAuthoritativePublishedRows(await clientMarketSafeScoped(c,clientId,contractId))})}'
          if router.count(old_routes)!=1:
              raise SystemExit(f'expected one unscoped market route block, got {router.count(old_routes)}')
          router=router.replace(old_routes,new_routes,1)
          router_path.write_text(router)

          authority_path=Path('assets/portal-runtime/client-context-selection-authority-v1.js')
          authority=authority_path.read_text()
          market="  '/portal/api/v1/client/market',\n"
          if market not in authority:
              anchor="  '/portal/api/v1/client/prices',\n"
              if authority.count(anchor)!=1:
                  raise SystemExit('authority prices route marker mismatch')
              authority=authority.replace(anchor,anchor+market,1)
          authority_path.write_text(authority)
          PY
      - name: Run client context regression checks
        run: |
          node scripts/qa-client-backend-context-scope-v1.mjs
          node tests/client-background-section-preload-v1.test.mjs
          node tests/client-context-universal-modules-v1.test.mjs
          node scripts/qa-client-current-context-consumers-v1.mjs
      - name: Commit scoped market and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/client-market-context-scope-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/rona-portal-api/index.ts assets/portal-runtime/client-context-selection-authority-v1.js .github/workflows/client-market-context-scope-once.yml
          git commit -m 'fix(client): enforce selected-context market projection'
          git push origin HEAD:${GITHUB_REF_NAME}
