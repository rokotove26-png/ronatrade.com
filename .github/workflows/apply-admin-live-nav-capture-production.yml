name: Apply production Admin live navigation capture hotfix

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'
    paths:
      - '.github/workflows/apply-admin-live-nav-capture-production.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch live navigation capture without visual delta
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('functions/portal/_middleware.js')
          s=p.read_text()
          old="const start=()=>{if(window.__RONA_ADMIN_BOOT_STATE__?.ready)load();else window.addEventListener('rona:admin-app-ready',load,{once:true})};document.addEventListener('click',e=>{const b=e.target.closest?.('#nav button[data-page]');if(b)setTimeout(()=>render(b.dataset.page),0);const tr=e.target.closest?.('[data-rona-live-document]');"
          new="function activateLivePage(page){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+page));document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const w=document.getElementById('workspace');if(w)w.scrollTop=0;render(page)}const start=()=>{if(window.__RONA_ADMIN_BOOT_STATE__?.ready)load();else window.addEventListener('rona:admin-app-ready',load,{once:true})};document.addEventListener('click',e=>{const b=e.target.closest?.('#nav button[data-page]');if(b&&stateLive.loaded){e.preventDefault();e.stopImmediatePropagation();activateLivePage(b.dataset.page);return}const tr=e.target.closest?.('[data-rona-live-document]');"
          if s.count(old)!=1:
              raise SystemExit(f'PATCH_NEEDLE_COUNT={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit production hotfix
        run: |
          git config user.name 'RONA Production QA'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/portal/_middleware.js
          git commit -m 'Capture Admin navigation in live authority adapter'
          git push origin HEAD:${GITHUB_REF_NAME}
