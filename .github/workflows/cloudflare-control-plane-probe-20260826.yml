name: Temporary Cloudflare control plane probe 20260826

on:
  push:
    branches:
      - 'test/cloudflare-control-plane-probe-20260826'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=SET"
            else
              echo "${name}=UNSET"
            fi
          done
