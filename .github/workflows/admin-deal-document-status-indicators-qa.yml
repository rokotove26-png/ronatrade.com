name: Admin deal document status indicators QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/deals-current-state-ui.js'
      - 'scripts/qa-admin-deal-indicators-browser-v1.mjs'
      - '.github/workflows/admin-deal-document-status-indicators-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  admin-deal-indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove scoped source and build contract
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/deals-current-state-ui.js
          npm run build
          grep -q "return !(add||signed)||!inv" functions/portal/deals-current-state-ui.js
          grep -q "return hasClientSignedAddendum(d)?'GO':'HOLD'" functions/portal/deals-current-state-ui.js
          grep -q "x-rona-deal-indicators':'documents-addendum-invoice-status-client-signed-v1'" functions/portal/deals-current-state-ui.js
          ! grep -Eqi 'NIK|SOLARIS|FARG|GAZON|DEAL-2026-00[3-9]' functions/portal/deals-current-state-ui.js
          echo 'ADMIN_DEAL_INDICATORS_SOURCE=PASS'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve exact immutable Cloudflare preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          preview=''
          for i in $(seq 1 60); do
            summary=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success") | .output.summary' 2>/dev/null | head -1 || true)
            preview=$(printf '%s' "$summary" | grep -oE 'https://[a-f0-9]+\.rona-trade-public\.pages\.dev' | head -1 || true)
            if [ -n "$preview" ]; then break; fi
            sleep 5
          done
          test -n "$preview"
          echo "PREVIEW_ORIGIN=$preview" >> "$GITHUB_ENV"
          echo "IMMUTABLE_PREVIEW=$preview"
      - name: Browser proof on existing deal snapshot and reload
        run: node scripts/qa-admin-deal-indicators-browser-v1.mjs
