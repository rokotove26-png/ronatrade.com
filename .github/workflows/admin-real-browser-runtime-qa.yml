name: admin-real-browser-runtime

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'portal-src/current/admin.html'
      - 'assets/portal-admin-shell-fast-v1.js'
      - 'assets/portal-admin-runtime-watchdog-v1.js'
      - 'functions/portal/main-ui/index.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/owner-ui-chunks/**'
      - 'functions/portal/clients-agents-current-ui.js'
      - 'functions/portal/admin-authority/**'
      - 'functions/portal/owner-api.js'
      - 'functions/portal/admin-canonical-create-access-v441-ui.js'
      - 'functions/portal/admin-approved-analytics-v455-ui.js'
      - 'functions/portal/claims-r2-ui.js'
      - 'functions/portal/remaining-sections-ui.js'
      - 'supabase/functions/rona-admin-control-plane/**'
      - 'scripts/materialize-admin-current-modules.mjs'
      - 'scripts/qa-admin-browser-runtime.mjs'
      - 'scripts/qa-admin-access-functional-browser.mjs'
      - '.github/workflows/admin-real-browser-runtime-qa.yml'
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'portal-src/current/admin.html'
      - 'assets/portal-admin-shell-fast-v1.js'
      - 'assets/portal-admin-runtime-watchdog-v1.js'
      - 'functions/portal/main-ui/index.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/owner-ui-chunks/**'
      - 'functions/portal/clients-agents-current-ui.js'
      - 'functions/portal/admin-authority/**'
      - 'functions/portal/owner-api.js'
      - 'functions/portal/admin-canonical-create-access-v441-ui.js'
      - 'functions/portal/admin-approved-analytics-v455-ui.js'
      - 'functions/portal/claims-r2-ui.js'
      - 'functions/portal/remaining-sections-ui.js'
      - 'supabase/functions/rona-admin-control-plane/**'
      - 'scripts/materialize-admin-current-modules.mjs'
      - 'scripts/qa-admin-browser-runtime.mjs'
      - 'scripts/qa-admin-access-functional-browser.mjs'
      - '.github/workflows/admin-real-browser-runtime-qa.yml'

permissions:
  contents: read

jobs:
  admin-real-browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current Admin artifact
        run: npm run build
      - name: Install Chromium runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Exercise Admin navigation and functional sections in Chromium
        run: node scripts/qa-admin-browser-runtime.mjs
      - name: Exercise create-user, password, client PDF gate and agent access in Chromium
        run: node scripts/qa-admin-access-functional-browser.mjs
