name: client-current-canonical-build-qa

on:
  push:
    branches:
      - release/public-go-live-v1.1
  pull_request:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Pages Function syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/_middleware.js
          node --check 'functions/portal/[[path]].js'

      - name: Compile Pages Functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages-build
          npx --yes wrangler@latest pages functions build functions --outfile=.pages-build/worker.js
          test -s .pages-build/worker.js

      - name: Verify exact frozen current client source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const manifest=JSON.parse(await readFile('portal-src/current/client/manifest.json','utf8'));
          const encoded=(await Promise.all(manifest.chunks.map(name=>readFile(`portal-src/current/client/${name}`,'utf8')))).join('');
          const source=brotliDecompressSync(Buffer.from(encoded,'base64'));
          const sha=createHash('sha256').update(source).digest('hex');
          if(source.length!==484970) throw new Error(`CLIENT_SOURCE_BYTES_MISMATCH ${source.length}`);
          if(sha!=='d07d7cbee5fd3466c8729861a6e6a6acb4ba463ad6d89dd7f748209cacab6183') throw new Error(`CLIENT_SOURCE_SHA_MISMATCH ${sha}`);
          if(manifest.decoded_bytes!==source.length||manifest.sha256!==sha) throw new Error('CLIENT_MANIFEST_SOURCE_IDENTITY_MISMATCH');
          console.log(`CLIENT_FROZEN_SOURCE=PASS sha256=${sha} bytes=${source.length}`);
          NODE

      - name: Build canonical deployment
        run: npm run build

      - name: Verify emitted client artifact and authoritative bridge
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/portal/client.html
          test -f dist/canonical-visual-integrity.json
          grep -Fq 'data-page="deals"' dist/portal/client.html
          grep -Fq 'id="page-deals"' dist/portal/client.html
          grep -Fq 'id="page-payments"' dist/portal/client.html
          ! grep -Fq 'id="navDocuments"' dist/portal/client.html
          ! grep -Fq 'id="page-documents"' dist/portal/client.html
          grep -Fq 'id="rona-client-contract-authoritative-projection-v5"' dist/portal/client.html
          grep -Fq '/assets/portal-runtime/client-contract-download-v3.js?v=20260829-authoritative-projection-v5' dist/portal/client.html
          test "$(grep -o 'client-contract-download-v3\.js' dist/portal/client.html | wc -l | tr -d ' ')" = "1"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const integrity=JSON.parse(await readFile('dist/canonical-visual-integrity.json','utf8'));
          const emitted=await readFile('dist/portal/client.html');
          const emittedSha=createHash('sha256').update(emitted).digest('hex');
          const client=integrity.client_runtime;
          if(client.source_sha256!=='d07d7cbee5fd3466c8729861a6e6a6acb4ba463ad6d89dd7f748209cacab6183') throw new Error('INTEGRITY_SOURCE_SHA_MISMATCH');
          if(client.source_bytes!==484970) throw new Error('INTEGRITY_SOURCE_BYTES_MISMATCH');
          if(client.emitted_sha256!==emittedSha) throw new Error(`INTEGRITY_EMITTED_SHA_MISMATCH ${client.emitted_sha256} !== ${emittedSha}`);
          if(client.emitted_bytes!==emitted.length) throw new Error(`INTEGRITY_EMITTED_BYTES_MISMATCH ${client.emitted_bytes} !== ${emitted.length}`);
          if(client.visual_transform!=='NONE') throw new Error(`CLIENT_VISUAL_TRANSFORM_CHANGED ${client.visual_transform}`);
          if(client.functional_bridge?.id!=='rona-client-contract-authoritative-projection-v5') throw new Error('CLIENT_FUNCTIONAL_BRIDGE_ID_MISSING');
          if(client.functional_bridge?.marker!=='20260829-client-contract-v3-authoritative-projection-v5') throw new Error('CLIENT_FUNCTIONAL_BRIDGE_MARKER_MISSING');
          if(!String(client.functional_bridge?.src||'').includes('client-contract-download-v3.js?v=20260829-authoritative-projection-v5')) throw new Error('CLIENT_FUNCTIONAL_BRIDGE_SRC_MISSING');
          console.log(`CLIENT_CURRENT_CANONICAL_EMITTED=PASS sha256=${emittedSha} bytes=${emitted.length}`);
          NODE

      - name: Verify authoritative contract projection guard
        run: node scripts/qa-client-contract-authoritative-projection.mjs

      - name: Verify server-authoritative deal state projection
        run: node scripts/qa-client-deal-server-projection.mjs

      - name: Verify legacy client owners are absent
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html"
            "portal-src/canonical-transfer-v1_1/client_externalized.html"
            "portal-src/client.html"
            "functions/portal/client.js"
            "functions/portal/client-claims-ui.js"
            "functions/portal/main-ui.js"
            "functions/portal/deals-r1-ui.js"
            "functions/portal/owner-acceptance-ui.js"
          )
          for path in "${forbidden[@]}"; do
            if test -e "$path"; then
              echo "LEGACY_CLIENT_OWNER_PRESENT: $path" >&2
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('portal-src/current/client/manifest.json','utf8'));
          const required={state:'CURRENT_ONLY',route:'/portal/client',sha256:'d07d7cbee5fd3466c8729861a6e6a6acb4ba463ad6d89dd7f748209cacab6183',decoded_bytes:484970,visual_transform:'NONE',legacy_runtime:false,standalone_documents_section:false,deal_documents_workpoint:'deals'};
          for(const [key,value] of Object.entries(required)){
            if(manifest[key]!==value) throw new Error(`CLIENT_MANIFEST_MISMATCH ${key}: ${manifest[key]} !== ${value}`);
          }
          console.log('CLIENT_CURRENT_CANONICAL_BUILD=PASS');
          NODE
