name: client-current-canonical-build-qa

on:
  push:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Pages Function syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/_middleware.js
          node --check 'functions/portal/[[path]].js'

      - name: Compile Pages Functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages-build
          npx --yes wrangler@latest pages functions build functions --outfile=.pages-build/worker.js
          test -s .pages-build/worker.js

      - name: Build canonical deployment
        run: npm run build

      - name: Verify exact current client artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/portal/client.html
          test "$(wc -c < dist/portal/client.html | tr -d ' ')" = "493060"
          printf '%s  %s\n' "0d9158b3487e1f5bd6b034b541fe7446ff6262b33671c12e6a4d45f73c89677e" "dist/portal/client.html" | sha256sum -c -

      - name: Verify deal open lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const html=await readFile('dist/portal/client.html','utf8');
          const click="const d=e.target.closest('[data-open-deal]');if(d&&typeof window.openDeal==='function'){e.preventDefault();window.openDeal(d.dataset.openDeal)};";
          if(!html.includes(click)) throw new Error('CLIENT_DEAL_OPEN_DELEGATION_MISSING');
          const start=html.indexOf('function dealLifecycleMarkup(c,d){');
          const end=html.indexOf('\nwindow.openDeal=',start);
          if(start<0||end<0) throw new Error('CLIENT_DEAL_LIFECYCLE_FUNCTION_MISSING');
          const source=html.slice(start,end);
          if(source.includes('resourceLabeledText(d)')) throw new Error('CLIENT_DEAL_LIFECYCLE_OUT_OF_SCOPE_HELPER');
          const window={ronaResourceDisplayText:v=>String(v||'').replace(/^Ресурс\s+/i,'')};
          const ce=x=>String(x??'');
          let dealLifecycleMarkup;
          eval(source.replace('function dealLifecycleMarkup','dealLifecycleMarkup = function'));
          const c={applications:[{deal:'DEAL-1',id:'APP-1',status:'Принята'}],payments:[{deal:'DEAL-1',bankStatus:'Оплачено',credited:'100 USD',creditedAt:'28.08.2026'}],closingStatus:'Закрытие не завершено',closingRequirements:[{mandatory:true}]};
          const d={id:'DEAL-1',status:'В исполнении',stage:'Исполнение договора',resource:'Ресурс подтверждён',resourceDate:'28.08.2026',basis:'DAP',station:'X',next:'Поставка'};
          const rendered=dealLifecycleMarkup(c,d);
          if(!rendered.includes('Жизненный цикл сделки')||!rendered.includes('Текущий этап')) throw new Error('CLIENT_DEAL_LIFECYCLE_RENDER_FAILED');
          console.log('CLIENT_DEAL_OPEN_LIFECYCLE=PASS');
          NODE

      - name: Verify legacy client owners are absent
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html"
            "portal-src/canonical-transfer-v1_1/client_externalized.html"
            "portal-src/client.html"
            "functions/portal/client.js"
            "functions/portal/client-claims-ui.js"
            "functions/portal/main-ui.js"
            "functions/portal/deals-r1-ui.js"
            "functions/portal/owner-acceptance-ui.js"
          )
          for path in "${forbidden[@]}"; do
            if test -e "$path"; then
              echo "LEGACY_CLIENT_OWNER_PRESENT: $path" >&2
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('portal-src/current/client/manifest.json','utf8'));
          const required={state:'CURRENT_ONLY',route:'/portal/client',sha256:'0d9158b3487e1f5bd6b034b541fe7446ff6262b33671c12e6a4d45f73c89677e',decoded_bytes:493060,visual_transform:'NONE',legacy_runtime:false};
          for(const [key,value] of Object.entries(required)){
            if(manifest[key]!==value) throw new Error(`CLIENT_MANIFEST_MISMATCH ${key}: ${manifest[key]} !== ${value}`);
          }
          console.log('CLIENT_CURRENT_CANONICAL_BUILD=PASS');
          NODE
