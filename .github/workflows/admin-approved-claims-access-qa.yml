name: Admin Approved Claims Access QA

on:
  pull_request:
    branches:
      - 'release/public-go-live-v1.1'
  push:
    branches:
      - 'release/public-go-live-v1.1'
      - 'fix/claims-access-approved-ui-20260826'

jobs:
  approved-claims-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime syntax and functional access create owner
        run: |
          node --check functions/portal/admin-approved-polish-ui.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/admin-canonical-create-access-v441-ui.js
          node --check functions/portal/admin-approved-analytics-v455-ui.js
          node --input-type=module <<'NODE'
          const polish = await import('./functions/portal/admin-approved-polish-ui.js');
          const source = await (await polish.onRequest()).text();
          new Function(source);
          if (!source.includes("20260828-canonical-access-v3413-v4")) throw new Error('canonical polish marker missing');
          if (!source.includes("clients-agents-current-v4")) throw new Error('current access workspace owner missing');
          if (!source.includes('window.RONA_ADMIN_DIALOGS=Object.freeze({message,notify:message,confirm,password})')) throw new Error('in-app dialog service missing');
          if (!source.includes('grid-template-columns:minmax(0,1fr)!important')) throw new Error('claims equal-width layout missing');
          for (const stale of ['openApprovedAccess','installApprovedAccess']) if (source.includes(stale)) throw new Error('retired access owner still present: '+stale);

          const canonicalMod = await import('./functions/portal/admin-canonical-create-access-v441-ui.js');
          const canonicalResponse = await canonicalMod.onRequest();
          const canonical = await canonicalResponse.text();
          new Function(canonical);
          if (canonicalResponse.headers.get('x-rona-access-functional-build') !== 'create-user-contract-pdf-v5-20260828') throw new Error('functional access build header missing');
          if (canonicalResponse.headers.get('x-rona-access-pdf-control') !== 'attach-and-gate-v1') throw new Error('PDF control header missing');
          const exact = [
            'RONA_Admin_LK_LOCAL_v4_4_1_Clients_Agents_Canonical_CreateAccess_Local.html',
            "window.__RONA_ACCESS_CREATE_OWNER__='approved-canonical-v4.4.1'",
            "window.__RONA_ACCESS_FUNCTIONAL_BUILD__='create-user-contract-pdf-v5-20260828'",
            'Создать пользователя','Тип доступа','Роль пользователя','Ф.И.О. пользователя','Единый логин','Электронная почта','Телефон',
            "makeField('Пароль',password)","makeField('Повторите пароль',repeat)",'Профиль агента','Разрешённые компании / контракты',
            'PDF подтверждён','PDF загружен · ожидает подтверждения','PDF не закреплён','Закрепить PDF',
            'Открыть учётную запись до подтверждения PDF','Создать единую учётную запись',
            'initialPassword:pw1','attachSignedContractToExistingContract','/signed-document/attach','BILATERAL_SIGNED_CONTRACT_ATTESTATION',
            'data-rona-create-access','ev.stopImmediatePropagation()','backendCreate(payload)'
          ];
          for (const marker of exact) if (!canonical.includes(marker)) throw new Error('functional access marker missing: '+marker);
          for (const stale of ['Электронная почта / логин','Договоры клиента</span>']) if (canonical.includes(stale)) throw new Error('retired create-user marker present: '+stale);
          if (!canonical.includes("removeCompeting(){qa('.ca-modal-backdrop,.rona-canonical-access-mask,.rona-approved-access-mask')")) throw new Error('competing create-user cleanup missing');

          const compat = await import('./functions/portal/admin-approved-analytics-v455-ui.js');
          const compatSource = await (await compat.onRequest()).text();
          new Function(compatSource);
          if (!compatSource.includes('/portal/admin-canonical-create-access-v441-ui?v=20260828-canonical-v441')) throw new Error('functional access loader missing');

          const fs = await import('node:fs');
          const access = fs.readFileSync('functions/portal/clients-agents-current-ui.js','utf8');
          if (!access.includes("__RONA_CLIENTS_AGENTS_CURRENT__='20260826-single-owner-v4'")) throw new Error('clients-agents current workspace owner marker missing');
          if (!access.includes("dataset.ronaCreateAccess='primary'")) throw new Error('primary create-access action missing');
          if (!access.includes("setAccessUserPassword")) throw new Error('administrator password control missing');
          NODE
      - name: Build current-only artifact
        run: npm run build
      - name: Verify functional access owner is deployed by Admin shell
        run: |
          test -s dist/portal/admin.html
          grep -q 'rona-admin-approved-polish-loader' dist/portal/admin.html
          grep -q '/portal/admin-approved-polish-ui' dist/portal/admin.html
          grep -q '/portal/admin-approved-analytics-v455-ui' dist/portal/admin.html
          grep -q 'portal-admin-shell-fast-v1.js' dist/portal/admin.html
          grep -q 'clients-agents-current-ui' dist/portal/admin.html
          grep -q 'portal-admin-runtime-watchdog-v1.js' dist/portal/admin.html
          ! grep -q 'admin_externalized' dist/portal/admin.html
          grep -q '/portal/admin-canonical-create-access-v441-ui?v=20260828-canonical-v441' functions/portal/admin-approved-analytics-v455-ui.js
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const html=fs.readFileSync('dist/portal/admin.html','utf8');
          const current=html.indexOf('/portal/clients-agents-current-ui');
          const polish=html.indexOf('/portal/admin-approved-polish-ui');
          const compat=html.indexOf('/portal/admin-approved-analytics-v455-ui');
          if(current<0||polish<0||polish<=current)throw new Error('compat access owner must load after current access workspace');
          if(compat<0||compat<=polish)throw new Error('functional access loader host must load after polish');
          NODE
