name: Build preflate transfer tool

on:
  push:
    branches:
      - staging/canonical-all-portals-visual-20260816
    paths:
      - .github/workflows/build-preflate-tool.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build bit-exact preflate transfer CLI from microsoft/preflate-rs v0.7.6
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          git clone --depth 1 --branch v0.7.6 https://github.com/microsoft/preflate-rs.git /tmp/preflate-rs
          mkdir -p /tmp/preflate-rs/transfer-tool/src
          cat > /tmp/preflate-rs/transfer-tool/Cargo.toml <<'TOML'
          [package]
          name = "preflate_transfer"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.89"
          [dependencies]
          preflate-container = { path = "../container" }
          [workspace]
          TOML
          cat > /tmp/preflate-rs/transfer-tool/src/main.rs <<'RS'
          use std::{env,fs,io::Cursor,process};
          use preflate_container::{PreflateContainerConfig,PreflateContainerProcessor,ProcessBuffer,RecreateContainerProcessor};
          fn main(){
            let a:Vec<String>=env::args().collect();
            if a.len()!=4 || (a[1]!="compress" && a[1]!="decompress") { eprintln!("usage: preflate_transfer <compress|decompress> <input> <output>"); process::exit(2); }
            let input=fs::read(&a[2]).expect("read input");
            let config=PreflateContainerConfig{validate_compression:false,max_chain_length:4096,..PreflateContainerConfig::default()};
            let mut out=Vec::new();
            if a[1]=="compress" {
              let mut p=PreflateContainerProcessor::new(&config,14,false);
              p.copy_to_end_size(&mut Cursor::new(&input),&mut out,usize::MAX).expect("preflate compress");
            } else {
              let mut p=RecreateContainerProcessor::new(config.chunk_plain_text_limit);
              p.copy_to_end_size(&mut Cursor::new(&input),&mut out,usize::MAX).expect("preflate decompress");
            }
            fs::write(&a[3],&out).expect("write output");
            eprintln!("mode={} input_bytes={} output_bytes={}",a[1],input.len(),out.len());
          }
          RS
          cargo build --release --manifest-path /tmp/preflate-rs/transfer-tool/Cargo.toml
          install -m 0755 /tmp/preflate-rs/transfer-tool/target/release/preflate_transfer "$GITHUB_WORKSPACE/preflate_transfer"
          sha256sum "$GITHUB_WORKSPACE/preflate_transfer"
          "$GITHUB_WORKSPACE/preflate_transfer" 2>&1 || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: preflate-transfer-linux-x64-v0.7.6
          path: preflate_transfer
          if-no-files-found: error
          retention-days: 1
