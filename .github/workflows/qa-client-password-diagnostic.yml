name: QA client password diagnostic
on:
  push:
    branches:
      - 'hotfix/admin-interactivity-owner-rail-diagnostic-*'
permissions:
  contents: read
  statuses: write
jobs:
  diagnose-password:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test QA auth password without exposing tokens
        shell: bash
        run: |
          set -euo pipefail
          body='{"email":"qa-owner-client-32571968750@example.invalid","password":"Qa!32571968750Aa9#"}'
          code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X POST 'https://sxawrwzeobaqwwmlkzws.supabase.co/auth/v1/token?grant_type=password' -H 'apikey: sb_publishable_W2MxTx00ILiugSyZKp8uyQ_zBzcyorL' -H 'content-type: application/json' --data "$body")"
          echo "AUTH_STATUS=$code"
          jq -c '{error,error_code,msg,message,user_email:(.user.email // null),has_access_token:(.access_token!=null),has_refresh_token:(.refresh_token!=null)}' /tmp/auth.json
          test "$code" = '200'
