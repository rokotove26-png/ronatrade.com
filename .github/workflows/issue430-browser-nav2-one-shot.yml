name: issue430 browser nav2 one shot

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'corrective/issue430-owner-uat-resource-metrics-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrective/issue430-owner-uat-resource-metrics-v2
          fetch-depth: 0
      - name: Broaden actual UI company navigation detection only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-issue430-owner-authorized-browser-v2.mjs')
          s=p.read_text()
          old="const el=candidates.find(e=>visible(e)&&/^(?:мои\\s+компании|компании)$/iu.test((e.textContent||'').replace(/\\s+/g,' ').trim()));if(!el)return false;el.click();return true"
          new="const el=candidates.find(e=>{if(!visible(e))return false;const text=(e.textContent||'').replace(/\\s+/g,' ').trim(),attrs=[e.getAttribute?.('data-page'),e.getAttribute?.('data-page-id'),e.getAttribute?.('data-page-target'),e.getAttribute?.('data-target'),e.getAttribute?.('href')].filter(Boolean).join(' ');return /компан/iu.test(text)||/(?:company|companies|page-companies)/iu.test(attrs)});if(!el)return false;el.click();return true"
          if old not in s: raise SystemExit('COMPANY_NAV_EXACT_PATTERN_MISSING')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check scripts/qa-issue430-owner-authorized-browser-v2.mjs
          rm .github/workflows/issue430-browser-nav2-one-shot.yml
          git diff --exit-code -- . ':!scripts/qa-issue430-owner-authorized-browser-v2.mjs' ':!.github/workflows/issue430-browser-nav2-one-shot.yml'
          git config user.name 'RONA issue430 QA harness'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/qa-issue430-owner-authorized-browser-v2.mjs .github/workflows/issue430-browser-nav2-one-shot.yml
          git commit -m 'qa(issue430): locate actual company navigation control'
          echo "ISSUE430_NAV2_LOCAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:corrective/issue430-owner-uat-resource-metrics-v2
