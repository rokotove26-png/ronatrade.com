name: G8.2 real browser QA

on:
  push:
    branches:
      - staging/public-go-live-v1.1
      - release/public-go-live-v1.1

permissions:
  contents: read

jobs:
  rendered-public-login-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Real rendered browser verification
        env:
          TARGET_ORIGIN: ${{ github.ref_name == 'release/public-go-live-v1.1' && 'https://ronaoil.com' || 'https://staging-public-go-live-v1-1.rona-trade-public.pages.dev' }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const origin = process.env.TARGET_ORIGIN;
          const placeholder = 'Серверная авторизация будет подключена после утверждения дизайна.';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function visiblePortalControl(page) {
            for (const frame of page.frames()) {
              const selectors = [
                'button:has-text("Личный кабинет")','a:has-text("Личный кабинет")','[role="button"]:has-text("Личный кабинет")',
                '.portal-top','[data-open-portal]','[data-portal-open]','#portalButton','#portalBtn'
              ];
              for (const selector of selectors) {
                const loc = frame.locator(selector).first();
                if (await loc.count() && await loc.isVisible().catch(() => false)) return loc;
              }
            }
            return null;
          }
          async function pageContainsPlaceholder(page) {
            for (const frame of page.frames()) {
              const text = await frame.locator('body').innerText().catch(() => '');
              if (text.includes(placeholder)) return true;
            }
            return false;
          }
          (async()=>{
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
            let ready = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              const r = await page.goto(origin, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => null);
              await page.waitForTimeout(1200);
              if (r && (await visiblePortalControl(page))) { ready = true; break; }
              await sleep(10000);
            }
            if (!ready) throw new Error(`visible Личный кабинет control not found at ${origin}`);
            if (await pageContainsPlaceholder(page)) throw new Error('legacy auth placeholder is visible before click');
            const control = await visiblePortalControl(page);
            await Promise.all([
              page.waitForURL(u => u.origin === origin && u.pathname === '/portal/login', { timeout: 15000 }),
              control.click()
            ]);
            if (page.url() !== origin + '/portal/login') throw new Error(`wrong click destination: ${page.url()}`);
            if (await pageContainsPlaceholder(page)) throw new Error('legacy auth placeholder survived canonical navigation');
            await page.locator('input[name="email"][type="email"]').waitFor({ state:'visible', timeout:10000 });
            await page.locator('input[name="password"][type="password"]').waitFor({ state:'visible', timeout:10000 });
            for (const p of ['/portal/admin','/portal/staff','/portal/agent','/portal/client']) {
              await page.context().clearCookies();
              await page.goto(origin + p, { waitUntil:'domcontentloaded' });
              if (new URL(page.url()).pathname !== '/portal/login') throw new Error(`unauth route did not fail closed: ${p} -> ${page.url()}`);
            }
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await mobile.goto(origin, { waitUntil:'domcontentloaded' });
            await mobile.waitForTimeout(1500);
            const menu = mobile.locator('#rona-mobile-menu-button');
            if (await menu.count()) await menu.click();
            const mcontrol = await visiblePortalControl(mobile);
            if (!mcontrol) throw new Error('mobile visible Личный кабинет control not found');
            await Promise.all([
              mobile.waitForURL(u => u.origin === origin && u.pathname === '/portal/login', { timeout:15000 }),
              mcontrol.click()
            ]);
            if (mobile.url() !== origin + '/portal/login') throw new Error(`mobile wrong click destination: ${mobile.url()}`);
            console.log(JSON.stringify({ok:true,origin,desktopClick:'/portal/login',mobileClick:'/portal/login',unauthProtectedRoutes:4,legacyPlaceholderVisible:false}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
