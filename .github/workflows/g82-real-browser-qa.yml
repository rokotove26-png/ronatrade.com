name: G8.2 real browser QA

on:
  push:
    branches:
      - staging/public-go-live-v1.1
      - release/public-go-live-v1.1

concurrency:
  group: rona-production-live-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rendered-public-login-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Real rendered browser verification
        env:
          TARGET_ORIGIN: ${{ github.ref_name == 'release/public-go-live-v1.1' && 'https://ronaoil.com' || 'https://staging-public-go-live-v1-1.rona-trade-public.pages.dev' }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const origin = process.env.TARGET_ORIGIN;
          const placeholder = 'Серверная авторизация будет подключена после утверждения дизайна.';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function waitForPatchedDeployment(request) {
            for (let attempt = 0; attempt < 48; attempt++) {
              try {
                const asset = await request.get(origin + '/assets/g82/portal-real-auth-entry-v1.js?_g82=' + Date.now(), { headers: { 'cache-control':'no-cache' } });
                const assetText = await asset.text();
                const home = await request.get(origin + '/pages/home_large?layout=large&_g82=' + Date.now(), { headers: { 'cache-control':'no-cache' } });
                const header = home.headers()['x-rona-real-auth-entry'] || '';
                if (asset.ok() && assetText.includes('purgeOldPortalShim') && header === 'g8.2-production-login-fix-v1') {
                  console.log(JSON.stringify({deploymentReady:true,attempt:attempt+1,header,assetBytes:assetText.length}));
                  return;
                }
              } catch (_) {}
              await sleep(5000);
            }
            throw new Error('patched Cloudflare deployment did not become observable');
          }

          async function visiblePortalControl(page) {
            for (const frame of page.frames()) {
              const selectors = [
                'button:has-text("Личный кабинет")','a:has-text("Личный кабинет")','[role="button"]:has-text("Личный кабинет")',
                '.portal-top','[data-open-portal]','[data-portal-open]','#portalButton','#portalBtn'
              ];
              for (const selector of selectors) {
                const loc = frame.locator(selector).first();
                if (await loc.count() && await loc.isVisible().catch(() => false)) return { loc, frame, selector };
              }
            }
            return null;
          }
          async function pageContainsPlaceholder(page) {
            for (const frame of page.frames()) {
              const text = await frame.locator('body').innerText().catch(() => '');
              if (text.includes(placeholder)) return true;
            }
            return false;
          }
          async function clickPortalAndAssert(page, label) {
            const found = await visiblePortalControl(page);
            if (!found) throw new Error(`${label}: visible Личный кабинет control not found`);
            const { loc, frame, selector } = found;
            const outer = await loc.evaluate(el => el.outerHTML.slice(0,1200)).catch(e => `EVAL_ERROR:${e.message}`);
            const topMarker = await page.evaluate(() => !!window.__RONA_G82_REAL_AUTH_ENTRY_V1__).catch(() => false);
            const frameMarker = await frame.evaluate(() => !!window.__RONA_G82_REAL_AUTH_ENTRY_V1__).catch(() => false);
            const oldShimCount = await page.locator('#ronaPortalFallbackG82,[data-rona-portal-overlay="g82"]').count().catch(()=>-1);
            console.log(JSON.stringify({label,beforeUrl:page.url(),controlFrameUrl:frame.url(),selector,topMarker,frameMarker,oldShimCount,outer}));
            if (oldShimCount !== 0) throw new Error(`${label}: legacy portal shim still present`);
            page.on('framenavigated', f => console.log(JSON.stringify({label,event:'framenavigated',url:f.url(),isMain:f===page.mainFrame()})));
            await loc.click();
            await page.waitForTimeout(2500);
            console.log(JSON.stringify({label,afterClickUrl:page.url(),frames:page.frames().map(f=>f.url())}));
            if (new URL(page.url()).origin !== origin || new URL(page.url()).pathname !== '/portal/login') {
              const ph = await pageContainsPlaceholder(page);
              throw new Error(`${label}: click did not navigate to /portal/login; url=${page.url()} placeholder=${ph}`);
            }
          }

          (async()=>{
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1920, height: 1080 } });
            await waitForPatchedDeployment(context.request);
            const page = await context.newPage();
            page.on('console', m => console.log(JSON.stringify({event:'console',type:m.type(),text:m.text().slice(0,1000)})));
            page.on('pageerror', e => console.log(JSON.stringify({event:'pageerror',text:String(e.message||e).slice(0,1500)})));
            await page.goto(origin + '/?_g82=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(2200);
            if (await pageContainsPlaceholder(page)) throw new Error('legacy auth placeholder is visible before click');
            await clickPortalAndAssert(page, 'desktop');
            await page.locator('input[name="email"][type="email"]').waitFor({ state:'visible', timeout:10000 });
            await page.locator('input[name="password"][type="password"]').waitFor({ state:'visible', timeout:10000 });
            for (const p of ['/portal/admin','/portal/staff','/portal/agent','/portal/client']) {
              await context.clearCookies();
              await page.goto(origin + p, { waitUntil:'domcontentloaded' });
              if (new URL(page.url()).pathname !== '/portal/login') throw new Error(`unauth route did not fail closed: ${p} -> ${page.url()}`);
            }

            const mobileContext = await browser.newContext({ viewport: { width:390, height:844 } });
            const mobile = await mobileContext.newPage();
            mobile.on('console', m => console.log(JSON.stringify({event:'mobile-console',type:m.type(),text:m.text().slice(0,1000)})));
            mobile.on('pageerror', e => console.log(JSON.stringify({event:'mobile-pageerror',text:String(e.message||e).slice(0,1500)})));
            await mobile.goto(origin + '/?_g82=' + Date.now(), { waitUntil:'domcontentloaded' });
            await mobile.waitForTimeout(2200);
            const menu = mobile.locator('#rona-mobile-menu-button');
            if (await menu.count() && await menu.isVisible().catch(()=>false)) await menu.click();
            await mobile.waitForTimeout(400);
            if (await pageContainsPlaceholder(mobile)) throw new Error('mobile legacy auth placeholder is visible before click');
            await clickPortalAndAssert(mobile, 'mobile');
            console.log(JSON.stringify({ok:true,origin,desktopClick:'/portal/login',mobileClick:'/portal/login',unauthProtectedRoutes:4,legacyPlaceholderVisible:false,legacyPortalShimPresent:false}));
            await mobileContext.close();
            await context.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
