name: Temporary trade form production smoke 20260826

on:
  push:
    branches:
      - 'test/trade-form-prod-smoke-20260826'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for preview deployment
        run: sleep 45

      - name: Read Pages build auth presence probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://test-trade-form-prod-smoke-2.rona-trade-public.pages.dev/__cf_env_probe.json'
          tmp=$(mktemp)
          status=$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' "$url")
          echo "HTTP_STATUS=$status"
          echo -n 'PROBE='; cat "$tmp"; echo
          test "$status" = '200'
