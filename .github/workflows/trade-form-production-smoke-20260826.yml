name: Temporary trade form production smoke 20260826

on:
  push:
    branches:
      - 'test/trade-form-prod-smoke-20260826'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production diagnostic deployment
        run: sleep 75

      - name: Run controlled production delivery probes
        shell: bash
        run: |
          set -u
          endpoint='https://ronaoil.com/api/forms/trade'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          request_probe() {
            label="$1"
            mode="$2"
            company_suffix="$3"
            body=$(cat <<JSON
          {
            "Contact Person":"RONA SYSTEM TEST",
            "Company":"RONA Trade Internal Diagnostics ${now} ${company_suffix}",
            "Company Registration Country":"Kyrgyzstan",
            "Petroleum Product":"LPG/SPBT",
            "Cargo Destination Country":"Kazakhstan",
            "Estimated Volume, tonnes":"1",
            "Phone":"+996000000000",
            "Email":"office_kg@ronaoil.com",
            "Comments":"Automated internal production delivery isolation probe",
            "Source":"RONA SYSTEM ADMIN",
            "Submitted At":"${now}",
            "Language":"EN",
            "Page URL / Source":"https://ronaoil.com/pages/home_large.html"
          }
          JSON
            )
            tmp=$(mktemp)
            if [ -n "$mode" ]; then
              status=$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' \
                --request POST "$endpoint" \
                --header 'Origin: https://ronaoil.com' \
                --header 'Content-Type: application/json' \
                --header "x-rona-diagnostic: ${mode}" \
                --data "$body" || true)
            else
              status=$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' \
                --request POST "$endpoint" \
                --header 'Origin: https://ronaoil.com' \
                --header 'Content-Type: application/json' \
                --data "$body" || true)
            fi
            printf '%s_STATUS=%s\n' "$label" "$status"
            printf '%s_BODY=' "$label"
            cat "$tmp"
            echo
          }

          request_probe PRE_DELIVERY pre-delivery pre
          request_probe SIMULATED_FAILURE simulate-delivery-failure sim
          request_probe BREVO_ACCOUNT brevo-account account
          request_probe BREVO_MINIMAL_SEND brevo-minimal-send minimal
          request_probe NORMAL '' normal
