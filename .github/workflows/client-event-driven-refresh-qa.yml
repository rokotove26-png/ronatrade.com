name: Client event-driven refresh QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
    paths:
      - 'assets/portal-runtime/client-shell-guard-v3.js'
      - 'assets/portal-runtime/client-price-sync-v1.js'
      - 'assets/portal-runtime/client-price-conditions-v1.js'
      - 'functions/portal/client-rail-current-ui.js'
      - 'scripts/attach-client-rail-production-v1.mjs'
      - 'tests/client-event-driven-refresh-v1.test.mjs'
      - '.github/workflows/client-event-driven-refresh-qa.yml'
  workflow_dispatch:

jobs:
  event-driven-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Client refresh ownership
        run: node tests/client-event-driven-refresh-v1.test.mjs
