name: Client Payments authoritative runtime QA
on:
  pull_request:
    branches: ['release/public-go-live-v1.1']
  push:
    branches: ['fix/client-context-universal-modules-v1','release/public-go-live-v1.1']
permissions:
  contents: read
jobs:
  client-payments-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Payments uses single current-context authority
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/portal-runtime/client-payments-authoritative-v1.js
          node tests/client-payments-finance-v7-read-model.test.mjs
          node tests/client-payments-receipt-detail-reconciliation.test.mjs
          node -e "const fs=require('fs'),r=fs.readFileSync('assets/portal-runtime/client-payments-authoritative-v1.js','utf8');for(const m of ['20260922-client-payments-authoritative-v3-event-driven','RONA_CLIENT_CONTEXT','function currentContext()','payment_received_amount','payment_obligation_amount','resource_status',\"mode:'EVENT_DRIVEN'\",'polling:false','function paymentsOpen()','ISSUE432_PAYMENTS_CENTRAL_PROJECTION_V1','invalidateCurrentProjection',\"whenCurrentProjection('client-payments-authoritative-v1:\"])if(!r.includes(m))throw Error('missing '+m);for(const m of ['/v1/client/bootstrap','/v1/client/context?clientId=','CLIENT_CONTEXTS','setClientContext','RONA-C001','DEAL-2026-004','REFRESH_MS=30000','setInterval(()=>load(true)','new MutationObserver(()=>schedule(false)'])if(r.includes(m))throw Error('retired '+m)"
          npm run build
          grep -q 'id="rona-client-payments-authoritative-v1"' dist/portal/client.html
          grep -q 'id="rona-client-payments-first-paint-guard"' dist/portal/client.html
