name: Admin GO payment no-finance handoff QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/owner-api.js'
      - 'supabase/migrations/**'
      - 'scripts/qa-admin-go-payment-no-finance-handoff-v1.mjs'
      - '.github/workflows/admin-go-payment-no-finance-handoff-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-go-payment-no-finance-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source and candidate contract checks
        run: |
          set -euo pipefail
          node --check functions/portal/admin-main-ui-current.js
          node --check functions/portal/owner-api.js
          node --check scripts/qa-admin-go-payment-no-finance-handoff-v1.mjs
          grep -R "owner_r1_send_to_payments" -n supabase/migrations scripts/qa-admin-go-payment-no-finance-handoff-v1.mjs functions/portal/owner-api.js
          grep -R "PAYMENT_OBLIGATION_NOT_CONFIRMED" -n supabase/migrations/20260910171000_owner_r1_payment_handoff_no_finance_preblock_v1.sql && exit 1 || true
          npm run build
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve immutable preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          preview=''
          for i in $(seq 1 60); do
            summaries=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name=="Cloudflare Pages" and .status=="completed" and .conclusion=="success") | .output.summary' 2>/dev/null || true)
            preview=$(printf '%s\n' "$summaries" | grep -oE 'https://[a-f0-9]+\.rona-trade-public\.pages\.dev' | head -1 || true)
            [ -n "$preview" ] && break
            sleep 5
          done
          test -n "$preview"
          echo "PREVIEW_ORIGIN=$preview" >> "$GITHUB_ENV"
      - name: Candidate backend guard
        run: |
          set -euo pipefail
          test -n "${OWNER_E2E_CANDIDATE_PROJECT:-}" || (echo 'OWNER_E2E_CANDIDATE_PROJECT secret required'; exit 1)
          test -n "${OWNER_E2E_IDENTIFIER:-}" || (echo 'OWNER_E2E_IDENTIFIER secret required'; exit 1)
          test -n "${OWNER_E2E_PASSWORD:-}" || (echo 'OWNER_E2E_PASSWORD secret required'; exit 1)
      - name: Real owner E2E through candidate backend
        env:
          OWNER_E2E_CANDIDATE_PROJECT: ${{ secrets.OWNER_E2E_CANDIDATE_PROJECT }}
          OWNER_E2E_IDENTIFIER: ${{ secrets.OWNER_E2E_IDENTIFIER }}
          OWNER_E2E_PASSWORD: ${{ secrets.OWNER_E2E_PASSWORD }}
          OWNER_E2E_GO_DEAL_ID: ${{ secrets.OWNER_E2E_GO_DEAL_ID }}
          OWNER_E2E_HOLD_DEAL_ID: ${{ secrets.OWNER_E2E_HOLD_DEAL_ID }}
          OWNER_E2E_MISSING_DOC_DEAL_ID: ${{ secrets.OWNER_E2E_MISSING_DOC_DEAL_ID }}
          OWNER_E2E_ARTIFACT: artifacts/pr452-owner-candidate-e2e.json
        run: node scripts/qa-admin-go-payment-no-finance-handoff-v1.mjs
      - name: Upload E2E proof
        uses: actions/upload-artifact@v4
        with:
          name: pr452-owner-candidate-e2e-proof
          path: artifacts/pr452-owner-candidate-e2e.json
