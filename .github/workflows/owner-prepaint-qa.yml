name: Primary portal UI prepaint gate QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches:
      - 'hotfix/admin-interactivity-*'
      - 'feature/portal-visual-redesign-*'
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  prepaint-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify current-only first-paint source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/client.js
          node --check functions/portal/agent.js
          node --check functions/portal/main-ui.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check assets/portal-admin-runtime-watchdog-v1.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check scripts/wait-cloudflare-commit.mjs
          node --check scripts/verify-admin-current-only-production.mjs
          node tests/admin-shell-resilience.test.mjs
          node tests/admin-current-only-shell-contract.test.mjs
          node tests/admin-runtime-watchdog.test.mjs
          node tests/admin-current-access-nav-v2.test.mjs
          node scripts/qa-admin-single-owner.mjs
          grep -q 'rona-admin-shell" content="current-only-v2' portal-src/current/admin.html
          grep -q 'data-rona-admin-shell="current-only-v2' portal-src/current/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" portal-src/current/admin.html
          grep -q 'grid-template-columns:272px minmax(0,1fr)' portal-src/current/admin.html
          grep -q 'min-height:48px' portal-src/current/admin.html
          grep -q 'font-size:14.5px' portal-src/current/admin.html
          grep -q 'data-action="create-access">Создать доступ</button>' portal-src/current/admin.html
          grep -q 'data-page="agent-settlements"' portal-src/current/admin.html
          grep -q 'data-page="claims"' portal-src/current/admin.html
          grep -q 'portal-admin-shell-fast-v1.js' portal-src/current/admin.html
          grep -q '/portal/main-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "__RONA_ADMIN_SHELL_RESILIENCE__='single-owner-v3'" assets/portal-admin-shell-fast-v1.js
          grep -q "__RONA_ADMIN_RUNTIME_WATCHDOG__='page-aware-v2'" assets/portal-admin-runtime-watchdog-v1.js
          ! grep -q 'location.reload(' assets/portal-admin-runtime-watchdog-v1.js
          ! grep -q 'location.replace(' assets/portal-admin-runtime-watchdog-v1.js
          grep -q "'x-rona-admin-shell','current-only-v2'" functions/portal/admin.js
          grep -q "'x-rona-admin-auth','server-verified-v1'" functions/portal/admin.js
          grep -q "'x-rona-admin-current-only','main-v2-shell-v2'" functions/portal/admin.js
          ! grep -q 'HTMLRewriter' functions/portal/admin.js
          ! grep -q 'adminLoginGate' portal-src/current/admin.html
          ! grep -q 'rona-admin-auth-v3413' portal-src/current/admin.html
          ! grep -q 'Временный автономный вход' portal-src/current/admin.html
          ! grep -q 'v3.4.13' dist/portal/admin.html
          cmp -s portal-src/current/admin.html dist/portal/admin.html
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.architecture!=='CURRENT_ONLY_ADMIN_SHELL_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.state!=='CURRENT_ONLY'||x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"
          for f in functions/portal/client.js functions/portal/agent.js; do
            grep -q 'rona-owner-prepaint-gate' "$f"
            grep -q 'rona-main-ui-loader' "$f"
            grep -q 'src="/portal/main-ui"' "$f"
          done
          echo 'ADMIN_CURRENT_ONLY_FIRST_PAINT_SOURCE=PASS'

      - name: Wait for Pages and Worker convergence for this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs

      - name: Prove converged production Admin first paint
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          TARGET_ORIGIN: https://ronaoil.com
        run: node scripts/verify-admin-current-only-production.mjs

      - name: Publish primary UI prepaint commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state='failure'; description='Current-only Admin first-paint QA failed'
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Admin first paint current-only after Pages+Worker convergence'; fi
          target_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/primary-ui-prepaint","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null