name: Primary portal UI prepaint gate QA

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches:
      - 'hotfix/admin-interactivity-*'
      - 'feature/portal-visual-redesign-*'
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  prepaint-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify current-only first-paint source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/client.js
          node --check functions/portal/agent.js
          node --check functions/portal/main-ui.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check functions/portal/clients-agents-current-ui.js
          node tests/admin-shell-resilience.test.mjs
          node tests/admin-current-only-shell-contract.test.mjs
          grep -q 'rona-admin-shell" content="current-only-v1' portal-src/current/admin.html
          grep -q 'data-rona-admin-shell="current-only-v1' portal-src/current/admin.html
          grep -q 'portal-admin-shell-fast-v1.js' portal-src/current/admin.html
          grep -q '/portal/main-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "'x-rona-admin-shell','current-only-v1'" functions/portal/admin.js
          grep -q "'x-rona-admin-auth','server-verified-v1'" functions/portal/admin.js
          ! grep -q 'HTMLRewriter' functions/portal/admin.js
          ! grep -q 'adminLoginGate' portal-src/current/admin.html
          ! grep -q 'rona-admin-auth-v3413' portal-src/current/admin.html
          ! grep -q 'Временный автономный вход' portal-src/current/admin.html
          ! grep -q 'v3.4.13' dist/portal/admin.html
          cmp -s portal-src/current/admin.html dist/portal/admin.html
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.architecture!=='CURRENT_ONLY_ADMIN_SHELL_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.state!=='CURRENT_ONLY'||x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"
          for f in functions/portal/client.js functions/portal/agent.js; do
            grep -q 'rona-owner-prepaint-gate' "$f"
            grep -q 'rona-main-ui-loader' "$f"
            grep -q 'src="/portal/main-ui"' "$f"
          done
          echo 'ADMIN_CURRENT_ONLY_FIRST_PAINT_SOURCE=PASS'

      - name: Wait for this commit in Cloudflare production
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<150;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-CURRENT-ONLY-PREPAINT'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare '+cf.conclusion);await sleep(5000);return}}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Prove production exposes no legacy Admin first paint
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node <<'NODE'
          const base='https://ronaoil.com',sha=process.env.GITHUB_SHA;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const integrityResponse=await fetch(base+'/canonical-visual-integrity.json?_qa='+sha,{cache:'no-store'});
            assert(integrityResponse.ok,'integrity '+integrityResponse.status);
            const integrity=await integrityResponse.json();
            assert(integrity.architecture==='CURRENT_ONLY_ADMIN_SHELL_WITH_FROZEN_CANONICAL_ASSETS','architecture '+integrity.architecture);
            assert(integrity.admin_runtime?.state==='CURRENT_ONLY','Admin lifecycle');
            assert(integrity.admin_runtime?.legacy_runtime_in_deployment===false,'legacy Admin runtime is deployed');
            const admin=await fetch(base+'/portal/admin?_qa='+Date.now(),{redirect:'manual',cache:'no-store'});
            assert(admin.status===302,'unauth Admin status '+admin.status);
            const loc=new URL(admin.headers.get('location'),base);
            assert(loc.pathname==='/portal/login'&&loc.searchParams.get('next')==='/portal/admin','Admin redirect '+loc.href);
            assert(admin.headers.get('x-rona-admin-shell')==='current-only-v1','Admin shell header '+admin.headers.get('x-rona-admin-shell'));
            assert(admin.headers.get('x-rona-admin-auth')==='server-verified-v1','Admin auth header');
            assert(admin.headers.get('x-rona-admin-current-only')==='main-v2-shell-v1','Admin lifecycle header');
            const [main,access]=await Promise.all([fetch(base+'/portal/main-ui?_qa='+sha,{cache:'no-store'}),fetch(base+'/portal/clients-agents-current-ui?_qa='+sha,{cache:'no-store'})]);
            assert(main.ok&&main.headers.get('x-rona-ui')==='main-v2','main-v2 live');
            assert(access.ok&&access.headers.get('x-rona-clients-agents-ui')==='current-only-v1','current access live');
            const accessSrc=await access.text();
            assert(accessSrc.includes("__RONA_CLIENTS_AGENTS_CURRENT__='20260826-current-only-v1'"),'current access marker');
            assert(!accessSrc.includes('harvestLegacy'),'legacy access dependency live');
            console.log('ADMIN_CURRENT_ONLY_PRODUCTION_FIRST_PAINT=PASS');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Publish primary UI prepaint commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state='failure'; description='Current-only Admin first-paint QA failed'
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Admin first paint is current-only; legacy runtime absent'; fi
          target_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/primary-ui-prepaint","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
