name: AI Executor Fail-Closed QA
on:
  pull_request:
    paths:
      - 'supabase/functions/rona-ai-model-executor/**'
      - 'tests/ai-runtime/ai-model-executor-failclosed.test.mjs'
      - '.github/workflows/ai-model-executor-failclosed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failclosed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed executor role contract and credential sanitization
        run: node --test tests/ai-runtime/ai-model-executor-failclosed.test.mjs
