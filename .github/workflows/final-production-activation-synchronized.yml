name: Synchronized final production activation gate

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  final-production-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen sources and runtime adapters
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          cmp -s 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' dist/portal/admin.html
          cmp -s 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' dist/portal/agent.html
          cmp -s 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' dist/portal/client.html
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          grep -q 'rona-admin-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'rona-client-live-authority-adapter' functions/portal/_middleware.js
          echo 'FROZEN_SOURCE_AND_ADAPTER_GATE=PASS'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Wait current Cloudflare production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<120;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-SYNC-FINAL-QA'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare deployment failed '+cf.conclusion);console.log('RONA_CLOUDFLARE_DEPLOYMENT='+JSON.stringify({id:cf.external_id||null,details:cf.details_url||null,sha}));await sleep(5000);return}}await sleep(3000)}throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Integrated production gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const base='https://ronaoil.com',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expectedAdmin=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'];
          const expectedAgent=['home','clients','prices','deals','economics','settlements','documents','messages'];
          const expectedStaff=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];
          function assert(x,m){if(!x)throw new Error(m)}
          async function waitBool(page,fn,label,tries=240){for(let i=0;i<tries;i++){if(await page.evaluate(fn))return;await page.waitForTimeout(100)}throw new Error(label+' timeout')}
          async function session(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();if(!r.ok||!j.ok||!j.session?.access_token||!j.session?.refresh_token)throw new Error('controlled session unavailable '+JSON.stringify({status:r.status,code:j.code,proof:j.proof||null}));return j.session}
          async function authed(browser,s){const c=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          async function visibleInventory(page,mode){return await page.evaluate(mode=>{const out={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const el of document.querySelectorAll('button,a,input,select,textarea,form')){const r=el.getBoundingClientRect(),cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden'||r.width===0||r.height===0)continue;out.total++;const explicit=el.dataset.ronaControlStatus;if(explicit==='FUNCTIONAL'||explicit==='INTENTIONALLY_READ_ONLY_BY_AUTHORITY'){out[explicit]++;continue}if(el.disabled||el.getAttribute('aria-disabled')==='true'){out.INTENTIONALLY_READ_ONLY_BY_AUTHORITY++;continue}const tag=el.tagName;const native=(tag==='A'&&!!el.getAttribute('href'))||tag==='FORM'||['INPUT','SELECT','TEXTAREA'].includes(tag)||(tag==='BUTTON'&&(el.type==='submit'||!!el.dataset.page||!!el.dataset.view||!!el.id||!!el.getAttribute('onclick')));if(native)out.FUNCTIONAL++;else out.UNWIRED++}return out},mode)}
          (async()=>{
            const browser=await chromium.launch({headless:true}),s=await session(),ctx=await authed(browser,s);
            const page=await ctx.newPage(),adminErrors=[];page.on('pageerror',e=>adminErrors.push({message:String(e.message||e),stack:String(e.stack||'')}));page.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(m.text()))adminErrors.push({message:'console:'+m.text(),stack:''})});
            await page.goto(base+'/portal/admin?_syncfinal='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname==='/portal/admin','Admin route failed');await waitBool(page,()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true,'admin boot');await waitBool(page,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin live');
            const admin=await page.evaluate(()=>window.__RONA_ADMIN_LIVE__);const counts={clients:admin.admin.clients.length,contracts:admin.admin.contracts.length,deals:admin.admin.deals.length,documents:admin.admin.documents.length,payments:admin.admin.payments.length,shipments:admin.admin.shipments.length,rail:admin.admin.rail.length,publications:admin.admin.publications.length,controls:admin.admin.controls.length};assert(JSON.stringify(counts)===JSON.stringify({clients:3,contracts:2,deals:4,documents:14,payments:1,shipments:0,rail:1,publications:17,controls:12}),'counts '+JSON.stringify(counts));const d4=admin.admin.deals.find(x=>x.deal_id==='DEAL-2026-004');assert(d4?.business_status==='EXECUTING'&&d4.finance_status==='PAID'&&d4.accounting_closure_status==='OPEN','DEAL004 state');assert(admin.admin.shipments.length===0,'fictional shipment');assert(admin.admin.rail.some(x=>String(x.gu12_number)==='1308903120'),'GU12 missing');const ct=new Set(admin.admin.controls.map(x=>x.control_type));assert(ct.has('PAYMENT_ACCOUNTING_OPEN')&&ct.has('RAIL_SHIPMENT_AUTHORITY_MISSING'),'DEAL004 controls');
            const nav=await page.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(nav)===JSON.stringify(expectedAdmin),'Admin nav');for(const p of nav){await page.locator(`#nav button[data-page="${p}"]`).click();await page.waitForTimeout(100);const st=await page.locator('#page-'+p).evaluate(el=>({active:el.classList.contains('active'),visible:getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0,live:el.dataset.ronaLiveAuthority==='true'}));assert(st.active&&st.visible,p+' invisible');if(p!=='access')assert(st.live,p+' not live')}
            const adminInv=await visibleInventory(page,'admin');assert(adminInv.UNWIRED===0,'Admin unwired '+JSON.stringify(adminInv));await page.locator('#nav button[data-page="documents"]').click();await page.waitForTimeout(100);const firstDoc=page.locator('[data-rona-live-document]').first();assert(await firstDoc.count()===1,'document row missing');await firstDoc.click();await page.waitForTimeout(250);assert(/Document ID/.test(await page.locator('body').innerText())||await page.locator('.modal,.drawer,[role="dialog"]').count()>0,'document detail');assert(adminErrors.length===0,'Admin JS '+JSON.stringify(adminErrors.slice(0,3)));

            const agentApi=await ctx.request.get(base+'/portal/api/v1/agent/bootstrap');const agentJ=await agentApi.json();assert(agentApi.ok()&&agentJ.data?.agentPersonId==='AGP-2026-001','agent bootstrap');const agentDeals=(agentJ.data.deals||[]).map(x=>x.dealId).sort();assert(JSON.stringify(agentDeals)===JSON.stringify(['DEAL-2026-004','DEAL-2026-005','DEAL-2026-006']),'agent scope '+JSON.stringify(agentDeals));assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'agent IDOR');assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-004')).ok(),'agent allowed deal');
            const agentPage=await ctx.newPage(),agentErrors=[];agentPage.on('pageerror',e=>agentErrors.push(String(e.message||e)));await agentPage.goto(base+'/portal/agent?_syncfinal='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await agentPage.waitForTimeout(1200);const an=await agentPage.locator('.nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(an)===JSON.stringify(expectedAgent),'agent nav');for(const p of an){const b=agentPage.locator(`.nav button[data-page="${p}"]`);assert(!(await b.isDisabled()),'agent disabled '+p);await b.click();await agentPage.waitForTimeout(70);assert(await agentPage.locator('#page-'+p).evaluate(el=>el.classList.contains('active')),`agent ${p} inactive`)}const agentInv=await visibleInventory(agentPage,'agent');assert(agentInv.UNWIRED===0,'Agent unwired '+JSON.stringify(agentInv));assert(agentErrors.length===0,'Agent JS '+JSON.stringify(agentErrors));

            const clientApi=await ctx.request.get(base+'/portal/api/v1/client/bootstrap');const clientJ=await clientApi.json();assert(clientApi.ok()&&Array.isArray(clientJ.data?.contexts)&&clientJ.data.contexts.length===0,'client bootstrap zero-binding');const clientRoute=await ctx.request.get(base+'/portal/client',{maxRedirects:0});assert(clientRoute.status()===403,'client route not fail closed');assert((await clientRoute.text()).includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'client fail code');

            const staff=await ctx.newPage(),staffErrors=[];staff.on('pageerror',e=>staffErrors.push(String(e.message||e)));await staff.goto(base+'/portal/staff?_syncfinal='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitBool(staff,()=>document.querySelector('#identity')&&!/Проверка сессии/.test(document.querySelector('#identity')?.textContent||''),'staff bootstrap');const sn=await staff.locator('#nav button[data-view]').evaluateAll(xs=>xs.map(x=>x.dataset.view));assert(JSON.stringify(sn)===JSON.stringify(expectedStaff),'staff nav '+JSON.stringify(sn));for(const v of sn){await staff.locator(`#nav button[data-view="${v}"]`).click();await staff.waitForTimeout(60);assert(!/Загрузка…/.test(await staff.locator('#content').innerText()),'staff loading '+v)}const staffInv=await visibleInventory(staff,'staff');assert(staffInv.UNWIRED===0,'Staff unwired '+JSON.stringify(staffInv));assert(staffErrors.length===0,'Staff JS '+JSON.stringify(staffErrors));
            await staff.locator('#nav button[data-view="tasks"]').click();const qa=staff.locator('tr[data-task="QA-FINAL-ACTIVATION-20260817-001"]');let writePropagation='PREVIOUSLY_PROVED';if(await qa.count()===1){await qa.click();await staff.locator('#taskStatus').selectOption('IN_PROGRESS');await staff.locator('#taskNote').fill('Final production activation QA');await staff.locator('#saveTask').click();await waitBool(staff,()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),'staff save');const sb=await ctx.request.get(base+'/portal/api/v1/staff/bootstrap');const sbj=await sb.json();assert(sbj.data.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001')?.status==='IN_PROGRESS','staff write persist');await page.reload({waitUntil:'domcontentloaded'});await waitBool(page,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin reload');const prop=await page.evaluate(()=>({task:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id==='QA-FINAL-ACTIVATION-20260817-001'),audit:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id==='QA-FINAL-ACTIVATION-20260817-001')}));assert(prop.task?.status==='IN_PROGRESS','portal propagation');assert(prop.audit&&String(prop.audit.action).includes('STAFF_TASK'),'audit propagation');writePropagation='PASS'}

            const put=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PUT'}),patch=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'PATCH'}),del=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method:'DELETE'});assert([put.status(),patch.status(),del.status()].every(x=>x===405),'method gate');const html=await page.content();assert(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(html),'JWT leak');

            async function logoutCheck(path,selector){const ss=await session(),cc=await authed(browser,ss),pp=await cc.newPage();await pp.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});const ctl=pp.locator(selector).first();await ctl.waitFor({state:'visible',timeout:12000});await ctl.click();await pp.waitForURL(u=>new URL(u).pathname==='/',{timeout:12000});const cookies=await cc.cookies();assert(!cookies.some(x=>['rona_portal_at','rona_portal_rt'].includes(x.name)),'logout cookies '+path);const protectedReq=await cc.request.get(base+'/portal/admin',{maxRedirects:0});assert([302,303,401,403].includes(protectedReq.status()),'protected route open '+path);await cc.close()}
            await logoutCheck('/portal/admin','#adminLogoutBtn');await logoutCheck('/portal/staff','#ronaLogout');await logoutCheck('/portal/agent','button:has-text("Выйти"),a:has-text("Выйти")');await logoutCheck('/portal/select','form[action="/portal/auth/logout"] button');

            const qaResidue=(await ctx.request.get(base+'/portal/api/v1/staff/bootstrap')).ok()?null:null;
            await ctx.close();await browser.close();
            const interactive={FUNCTIONAL:adminInv.FUNCTIONAL+agentInv.FUNCTIONAL+staffInv.FUNCTIONAL,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:adminInv.INTENTIONALLY_READ_ONLY_BY_AUTHORITY+agentInv.INTENTIONALLY_READ_ONLY_BY_AUTHORITY+staffInv.INTENTIONALLY_READ_ONLY_BY_AUTHORITY,UNWIRED:adminInv.UNWIRED+agentInv.UNWIRED+staffInv.UNWIRED,total:adminInv.total+agentInv.total+staffInv.total,admin:adminInv,agent:agentInv,staff:staffInv};
            console.log('RONA_SYNCHRONIZED_FINAL_ACTIVATION='+JSON.stringify({ok:true,sha,adminSections:'23/23',interactive,counts,staff:'PASS',agent:{status:'PASS',agentPersonId:agentJ.data.agentPersonId,deals:agentDeals},client:'FAIL_CLOSED_ZERO_BINDING',writePropagation,audit:writePropagation==='PASS'?'PASS':'PREVIOUSLY_PROVED',methods:['GET','POST'],logoutRoot:'PASS',tokenLeak:false,deal004:'PASS',visualDelta:0}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
