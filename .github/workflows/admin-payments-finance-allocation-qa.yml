name: Admin Payments finance authoritative allocation QA

on:
  push:
    branches: [fix/admin-payments-finance-allocation-projection-v1]
    paths:
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/admin-payments-finance-projection-v1.js'
      - 'supabase/functions/rona-owner-ai-sync/index.ts'
      - 'scripts/qa-admin-payments-finance-allocation-source-v1.mjs'
      - 'scripts/qa-admin-payments-finance-allocation-browser-v1.mjs'
      - '.github/workflows/admin-payments-finance-allocation-qa.yml'
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/admin-main-ui-current.js'
      - 'functions/portal/admin-payments-finance-projection-v1.js'
      - 'supabase/functions/rona-owner-ai-sync/index.ts'
      - 'scripts/qa-admin-payments-finance-allocation-source-v1.mjs'
      - 'scripts/qa-admin-payments-finance-allocation-browser-v1.mjs'
      - '.github/workflows/admin-payments-finance-allocation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payments-finance-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current Admin
        run: npm run build
      - name: Finance projection source boundary QA
        run: node scripts/qa-admin-payments-finance-allocation-source-v1.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Split allocation real browser runtime QA
        run: node scripts/qa-admin-payments-finance-allocation-browser-v1.mjs
      - name: Broad Admin runtime regression
        run: node scripts/qa-admin-browser-runtime.mjs
      - name: Admin access functional regression
        run: node scripts/qa-admin-access-functional-browser.mjs
      - name: Upload Payments runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-payments-finance-allocation-browser-proof
          path: artifacts/admin-payments/ADMIN_PAYMENTS_FINANCE_ALLOCATION_SPLIT.png
          if-no-files-found: warn
