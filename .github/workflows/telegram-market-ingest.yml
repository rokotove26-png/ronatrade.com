name: RONA Telegram Market Ingest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - ".github/workflows/telegram-market-ingest.yml"
      - "scripts/telegram_public_market_ingest.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: rona-telegram-market-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_CHANNELS: Samantahlil,platts_digits
      TELEGRAM_MAX_MESSAGES: "80"
      RONA_TELEGRAM_INGEST_URL: https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ai-read-extras/telegram-ingest
      RONA_TELEGRAM_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'beautifulsoup4>=4.12,<5' \
            'lxml>=5,<7' \
            'pypdf>=5,<7' \
            'pdfplumber>=0.11,<0.12' \
            'requests>=2.32,<3'

      - name: Acquire GitHub OIDC token for RONA ingest
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rona-telegram-ingest")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_JSON}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "${OIDC_TOKEN}" || { echo "GITHUB_OIDC_TOKEN_MISSING"; exit 2; }
          echo "::add-mask::${OIDC_TOKEN}"
          printf 'RONA_INGEST_OIDC_TOKEN=%s\n' "${OIDC_TOKEN}" >> "${GITHUB_ENV}"

      - name: Ingest public Telegram market documents
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_public_market_ingest.py
