name: RONA Telegram Market Ingest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rona-telegram-market-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_CHANNELS: platts_digits,Samantahlil
      TELEGRAM_MAX_MESSAGES: "80"
      RONA_TELEGRAM_INGEST_URL: https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ai-read-extras/telegram-ingest
      RONA_TELEGRAM_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Acquire GitHub OIDC token for RONA ingest
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rona-telegram-ingest")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_JSON}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "${OIDC_TOKEN}" || { echo "GITHUB_OIDC_TOKEN_MISSING"; exit 2; }
          echo "::add-mask::${OIDC_TOKEN}"
          printf 'RONA_INGEST_OIDC_TOKEN=%s\n' "${OIDC_TOKEN}" >> "${GITHUB_ENV}"

      - name: Validate and audit Telegram credential gate
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          test -n "${TELEGRAM_API_ID}" || missing+=(TELEGRAM_API_ID)
          test -n "${TELEGRAM_API_HASH}" || missing+=(TELEGRAM_API_HASH)
          test -n "${TELEGRAM_SESSION}" || missing+=(TELEGRAM_SESSION)
          if (( ${#missing[@]} > 0 )); then
            PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "run_key": os.environ["RONA_TELEGRAM_RUN_KEY"],
              "status": "BLOCKED",
              "channels": ["platts_digits", "Samantahlil"],
              "scanned_messages": 0,
              "accepted_files": 0,
              "duplicate_files": 0,
              "failed_files": 0,
              "error_code": "TELEGRAM_CREDENTIALS_MISSING",
          }, separators=(",", ":")))
          PY
            )"
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${RONA_INGEST_OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "${PAYLOAD}" \
              "${RONA_TELEGRAM_INGEST_URL}/run-status" >/dev/null
            echo "::error::TELEGRAM_CREDENTIALS_MISSING (${missing[*]})"
            exit 2
          fi

      - name: Checkout production release source
        uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'telethon>=1.36,<2' \
            'pypdf>=5,<7' \
            'pdfplumber>=0.11,<0.12' \
            'requests>=2.32,<3'

      - name: Ingest Telegram market documents
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_market_ingest.py
