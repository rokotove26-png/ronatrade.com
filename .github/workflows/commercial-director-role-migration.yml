name: RONA Commercial Director Canonical Staff Role Fix

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/commercial-director-role-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-staff-role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1
          fetch-depth: 0

      - name: Patch canonical Commercial Director staff mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/rona-mcp-gateway/index.js')
          t = p.read_text()
          old = "COMMERCIAL_DIRECTOR:'MARKET_ANALYST'"
          new = "COMMERCIAL_DIRECTOR:'COMMERCIAL_DIRECTOR'"
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('COMMERCIAL_DIRECTOR_STAFF_ROLE_PATCHED')
          elif new in t:
              print('COMMERCIAL_DIRECTOR_STAFF_ROLE_ALREADY_CANONICAL')
          else:
              raise SystemExit('Commercial Director staff-role mapping not found')
          PY

      - name: Commit patched release source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/rona-mcp-gateway/index.js
          git commit -m "fix: canonical Commercial Director staff role mapping"
          git push origin HEAD:release/public-go-live-v1.1
