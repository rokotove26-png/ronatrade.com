name: Owner acceptance live production gate

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches:
      - 'release/public-go-live-v1.1'
      - 'hotfix/admin-interactivity-*'
      - 'feature/portal-visual-redesign-*'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  owner-acceptance-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify owner acceptance current source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/client.js
          node --check functions/portal/agent.js
          node --check functions/portal/main-ui.js
          node --check functions/portal/owner-api.js
          node --check functions/portal/clients-agents-current-ui.js
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          cmp -s portal-src/current/admin.html dist/portal/admin.html
          cmp -s 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' dist/portal/agent.html
          cmp -s 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' dist/portal/client.html
          grep -q 'data-rona-admin-shell="current-only-v1"' dist/portal/admin.html
          ! grep -q 'adminLoginGate' dist/portal/admin.html
          ! grep -q 'rona-admin-auth-v3413' dist/portal/admin.html
          ! grep -q 'Временный автономный вход' dist/portal/admin.html
          grep -q 'src="/portal/main-ui"' functions/portal/client.js
          grep -q 'src="/portal/main-ui"' functions/portal/agent.js
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.admin_runtime?.legacy_runtime_in_deployment!==false)process.exit(1)"
          echo 'OWNER_ACCEPTANCE_CURRENT_ONLY_SOURCE=PASS'
      - name: Wait for exact production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Verify live protected portals without business mutation
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        shell: bash
        run: |
          node scripts/verify-admin-current-only-production.mjs
          node <<'NODE'
          const base='https://ronaoil.com';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const admin=await fetch(base+'/portal/admin?_qa='+Date.now(),{redirect:'manual',cache:'no-store'});
          assert(admin.status===302,'Admin protected '+admin.status);
          for(const path of ['/portal/admin-authority/bootstrap','/portal/owner-acceptance-api/admin/bootstrap']){
            const r=await fetch(base+path,{redirect:'manual',cache:'no-store'});
            assert([401,403].includes(r.status),path+' must reject unauthenticated access; got '+r.status);
          }
          for(const path of ['/portal/main-ui','/portal/clients-agents-current-ui']){const r=await fetch(base+path+'?_qa='+Date.now(),{cache:'no-store'});assert(r.ok,path+' unavailable')}
          const edge=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-owner-acceptance/admin/bootstrap',{redirect:'manual'});
          assert(edge.status===401,'owner acceptance edge must reject unauthenticated access; got '+edge.status);
          console.log('OWNER_ACCEPTANCE_NON_MUTATING_PRODUCTION=PASS');
          NODE
      - name: Publish owner acceptance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure; desc='Owner acceptance current-only gate failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Owner acceptance current-only gate passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$state\",\"context\":\"rona/owner-acceptance-live\",\"description\":\"$desc\"}" >/dev/null
