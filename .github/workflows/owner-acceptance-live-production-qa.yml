name: Owner acceptance live production gate

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'
      - 'hotfix/admin-interactivity-*'
      - 'feature/portal-visual-redesign-*'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  owner-acceptance-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source and install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          node --check functions/portal/admin.js
          node --check functions/portal/client.js
          node --check functions/portal/agent.js
          node --check functions/portal/main-ui.js
          node --check functions/portal/owner-api.js
          grep -q 'rona-main-ui-loader' functions/portal/admin.js
          grep -q 'rona-main-ui-loader' functions/portal/client.js
          grep -q 'rona-main-ui-loader' functions/portal/agent.js
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Resolve deployed target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<180;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-OWNER-ACCEPTANCE'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare '+cf.conclusion);await sleep(ref==='refs/heads/release/public-go-live-v1.1'?6000:4000);if(ref==='refs/heads/release/public-go-live-v1.1'){fs.appendFileSync(process.env.GITHUB_OUTPUT,'origin=https://ronaoil.com\n');return}const text=String(cf.output?.summary||'')+' '+String(cf.output?.text||'')+' '+String(cf.details_url||'');const urls=[...text.matchAll(/https:\/\/[a-z0-9.-]+\.pages\.dev/ig)].map(x=>x[0]);const u=urls.find(x=>!/rona-trade-public\.pages\.dev$/i.test(x))||urls[0];if(!u)throw new Error('Preview URL not found');fs.appendFileSync(process.env.GITHUB_OUTPUT,`origin=${u}\n`);return}}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Full Admin Client Agent primary UI acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const origin=process.env.TARGET_ORIGIN,repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          async function broker(){let last={};for(let i=0;i<10;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json().catch(()=>({}));last={status:r.status,code:j.code};if(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token)return j.session;await sleep(1000*(i+1))}throw new Error('controlled session '+JSON.stringify(last))}
          async function wait(page,fn,label,tries=450){for(let i=0;i<tries;i++){if(await page.evaluate(fn))return;await page.waitForTimeout(100)}throw new Error(label+' timeout '+String(await page.evaluate(()=>window.__RONA_OWNER_ADMIN_ERROR__||window.__RONA_OWNER_CLIENT_ERROR__||window.__RONA_OWNER_AGENT_ERROR__||'')))}
          async function api(ctx,path){let last={};for(let i=0;i<8;i++){const r=await ctx.request.get(origin+path),text=await r.text();let j={};try{j=JSON.parse(text)}catch{};if(r.ok()&&j?.ok===true)return j.data;last={status:r.status(),text:text.slice(0,240)};if(![500,502,503,504].includes(r.status()))break;await sleep(600*(i+1))}throw new Error(path+' '+JSON.stringify(last))}
          async function adminPost(ctx,path,data){let last={};for(let i=0;i<8;i++){const r=await ctx.request.post(origin+path,{headers:{origin,referer:origin+'/portal/admin','content-type':'application/json'},data}),text=await r.text();let j={};try{j=JSON.parse(text)}catch{};if(r.ok()&&j?.ok===true)return j;last={status:r.status(),text:text.slice(0,300)};if(![500,502,503,504].includes(r.status()))break;await sleep(600*(i+1))}throw new Error(path+' '+JSON.stringify(last))}
          async function download(ctx,url,label){let last={};for(let i=0;i<6;i++){const r=await ctx.request.get(url);if(r.ok())return r;last={status:r.status()};if(![500,502,503,504].includes(r.status()))break;await sleep(500*(i+1))}throw new Error(label+' '+JSON.stringify(last))}
          (async()=>{
            const session=await broker(),hostname=new URL(origin).hostname;
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const ctx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});
            await ctx.addCookies([{name:'rona_portal_at',value:session.access_token,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:session.refresh_token,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);
            const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));page.on('console',m=>{if(m.type()==='error'&&!/cloudflareinsights/i.test(m.text()))errors.push('console:'+m.text())});
            let qaUserId=null,clientCtx=null;
            try{
              await page.goto(origin+'/portal/admin?_owner='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              assert(new URL(page.url()).pathname==='/portal/admin','Admin route');
              await wait(page,()=>window.__RONA_MAIN_UI_ENTRY__===true&&window.__RONA_MAIN_UI_RUNTIME_LOADED__===true,'Admin primary runtime');
              await wait(page,()=>window.__RONA_OWNER_ADMIN_READY__===true&&window.__RONA_OWNER_FIRST_PAINT_READY__===true,'Admin primary render');
              const admin=await api(ctx,'/portal/owner-acceptance-api/admin/bootstrap');
              assert(Array.isArray(admin.clients)&&admin.clients.length===3,'Admin clients');assert(Array.isArray(admin.deals)&&admin.deals.length===4,'Admin deals');assert(Array.isArray(admin.applications)&&admin.applications.length===4,'Admin applications');
              const hidden=['documents','publication','portal-contour','exchange','datahub','archive','roles','notifications','announcements'];for(const id of hidden){const b=page.locator(`#nav button[data-page="${id}"]`);assert(await b.count()===1,'canonical hidden node '+id);const v=await b.evaluate(el=>({aria:el.getAttribute('aria-hidden'),tab:el.tabIndex,opacity:getComputedStyle(el).opacity}));assert(v.aria==='true'&&v.tab===-1&&v.opacity==='0','hidden node exposed '+id+' '+JSON.stringify(v))}
              const business=[['prices','Цены'],['applications','Заявки'],['deals','Сделки'],['payments','Платежи и взаиморасчёты'],['accounting','Касса'],['monitoring','Онлайн ЖД'],['messages','Радиорубка'],['analytics','Аналитика'],['market-news','Новости топливного рынка СНГ']];for(const [id,title] of business){const b=page.locator(`#nav button[data-page="${id}"]`);assert(await b.isVisible(),'visible nav '+id);await b.click();await page.waitForTimeout(80);assert(await page.getByText(title,{exact:true}).count(),`business page ${id} ${title}`)}
              const order=await page.evaluate(()=>window.__RONA_OWNER_VISIBLE_NAV_ORDER__||[]),pi=order.indexOf('payments'),ci=order.indexOf('accounting'),mi=order.indexOf('monitoring');assert(pi>=0&&ci===pi+1&&mi===ci+1,'Payments/Cash/Rail order '+JSON.stringify(order));
              await page.locator('#nav button[data-page="claims"]').click();await page.waitForTimeout(80);assert(await page.locator('#page-claims .rona-visual-hero .rona-visual-title').filter({hasText:'Претензии'}).count()===1,'Claims primary hero');
              await page.locator('#nav button[data-page="access"]').click();await page.waitForTimeout(80);assert(await page.locator('#page-access .rona-visual-hero .rona-visual-title').filter({hasText:'Клиенты и агенты'}).count()===1,'Access primary hero');assert(await page.getByText('Назначение агента',{exact:true}).count(),'Agent assignment UI');
              const badges=await page.locator('#nav .rona-owner-attention-badge').evaluateAll(xs=>xs.map(x=>Number(x.textContent||0)));assert(badges.every(x=>Number.isFinite(x)&&x>0),'attention badges must be positive '+JSON.stringify(badges));
              const qaEmail=`qa-owner-client-${runId}-${attempt}@example.invalid`,qaPassword=`Qa!${runId}${attempt}Aa9#`;
              const created=await adminPost(ctx,'/portal/admin-authority/access/users',{role:'Клиент',name:'QA OWNER ACCEPTANCE CLIENT',login:qaEmail,email:qaEmail,initialPassword:qaPassword,bindingRole:'Уполномоченный представитель',contractIds:['RONA-C002-CTR-2026-001'],openWithoutContract:false});qaUserId=created.userId||created.data?.userId;assert(qaUserId,'QA user id');
              clientCtx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});const cp=await clientCtx.newPage();
              await cp.goto(origin+'/portal/login?next=%2Fportal%2Fclient',{waitUntil:'domcontentloaded',timeout:30000});await cp.locator('input[name="email"]').fill(qaEmail);await cp.locator('input[name="password"]').fill(qaPassword);await cp.locator('button[type="submit"]').click();await cp.waitForURL(u=>new URL(u).origin===origin&&new URL(u).pathname==='/portal/client',{timeout:15000});
              await wait(cp,()=>window.__RONA_MAIN_UI_ENTRY__===true&&window.__RONA_OWNER_CLIENT_READY__===true&&window.__RONA_OWNER_FIRST_PAINT_READY__===true,'Client primary UI');
              const client=await api(clientCtx,'/portal/owner-acceptance-api/client/bootstrap');assert(client.companies.some(x=>x.contract_id==='RONA-C002-CTR-2026-001'),'Client binding');assert(await cp.getByText('Договоры',{exact:true}).count(),'Client contracts');assert(await cp.getByText('Цены',{exact:true}).count(),'Client prices');assert(await cp.getByText('Заявки',{exact:true}).count(),'Client applications');
              const downloadable=client.companies.find(x=>x.contract_document_id);assert(downloadable,'Client downloadable contract');const dl=await api(clientCtx,'/portal/owner-acceptance-api/client/contracts/'+encodeURIComponent(downloadable.contract_id)+'/download');const pdf=await download(clientCtx,dl.url,'client contract');assert(String(pdf.headers()['content-type']||'').toLowerCase().includes('pdf'),'Client PDF');await clientCtx.close();clientCtx=null;
              await page.goto(origin+'/portal/agent?_agent='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname==='/portal/agent','Agent route');await wait(page,()=>window.__RONA_MAIN_UI_ENTRY__===true&&window.__RONA_OWNER_AGENT_READY__===true&&window.__RONA_OWNER_FIRST_PAINT_READY__===true,'Agent primary UI');const agent=await api(ctx,'/portal/owner-acceptance-api/agent/bootstrap');assert(Array.isArray(agent.prices),'Agent prices');assert(await page.getByText('Внешний прайс-лист RONA Trade',{exact:true}).count(),'Agent price list');const apdf=await download(ctx,origin+'/portal/owner-acceptance-api/agent/price-list.pdf','Agent PDF');assert(String(apdf.headers()['content-type']||'').toLowerCase().includes('application/pdf'),'Agent PDF type');
              await adminPost(ctx,`/portal/admin-authority/access/users/${qaUserId}/block`,{});qaUserId=null;
              assert(errors.length===0,'Browser errors '+JSON.stringify(errors.slice(0,5)));
              console.log('OWNER_ACCEPTANCE_LIVE=PASS '+JSON.stringify({origin,primaryUi:true,documentsHidden:true,adminClients:admin.clients.length,applications:admin.applications.length,deals:admin.deals.length,clientContractDownload:true,agentPdf:true,attentionBadgesPositiveOnly:true}));
            } finally {
              if(clientCtx)await clientCtx.close().catch(()=>{});
              if(qaUserId)await ctx.request.post(origin+`/portal/admin-authority/access/users/${qaUserId}/block`,{headers:{origin,referer:origin+'/portal/admin','content-type':'application/json'},data:{}}).catch(()=>{});
              await ctx.close().catch(()=>{});await browser.close().catch(()=>{});
            }
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Publish owner acceptance commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state='failure'; description='Owner acceptance live QA failed'
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Owner acceptance live QA passed'; fi
          target_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/owner-acceptance-live","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
