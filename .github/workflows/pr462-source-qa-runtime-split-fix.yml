name: PR462 source QA runtime split fix

on:
  push:
    branches:
      - feat/admin-payments-final-owner-screen-passport-v1
    paths:
      - .github/workflows/pr462-source-qa-runtime-split-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-payments-final-owner-screen-passport-v1
          fetch-depth: 0
      - name: Update source QA to inspect entrypoint and runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          q=Path('scripts/qa-admin-payments-final-owner-screen-source-v1.mjs')
          t=q.read_text()
          old="const [ai,ownerSource,passportSource,ui,runtime]=await Promise.all([\n  readFile('supabase/functions/rona-owner-ai-sync/index.ts','utf8'),readFile('supabase/functions/rona-owner-ai-sync/payment-owner-screen.ts','utf8'),readFile('functions/portal/payment-passport-current.js','utf8'),readFile('functions/portal/main-ui/index.js','utf8'),readFile('functions/portal/main-ui/payment-passport-runtime-v1.js','utf8')\n]);\nconst production=[ai,ownerSource,passportSource,ui,runtime].join('\\n');"
          new="const [aiEntry,aiRuntime,ownerSource,passportSource,ui,runtime]=await Promise.all([\n  readFile('supabase/functions/rona-owner-ai-sync/index.ts','utf8'),readFile('supabase/functions/rona-owner-ai-sync/runtime.ts','utf8'),readFile('supabase/functions/rona-owner-ai-sync/payment-owner-screen.ts','utf8'),readFile('functions/portal/payment-passport-current.js','utf8'),readFile('functions/portal/main-ui/index.js','utf8'),readFile('functions/portal/main-ui/payment-passport-runtime-v1.js','utf8')\n]);\nconst ai=aiEntry+'\\n'+aiRuntime;\nconst production=[ai,ownerSource,passportSource,ui,runtime].join('\\n');"
          if old not in t:
              raise SystemExit('SOURCE_QA_READ_BLOCK_NOT_FOUND')
          q.write_text(t.replace(old,new,1))
          PY
          node scripts/qa-admin-payments-final-owner-screen-source-v1.mjs
      - name: Commit source QA fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qa-admin-payments-final-owner-screen-source-v1.mjs
          git commit -m 'qa: inspect owner ai-sync runtime after slug wrapper split'
          git push origin HEAD:feat/admin-payments-final-owner-screen-passport-v1
