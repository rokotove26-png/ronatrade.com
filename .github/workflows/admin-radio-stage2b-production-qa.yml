name: Admin Radio Notification Announcement Stage 2B production QA

on:
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/remaining-sections-r2-base.js'
      - 'scripts/materialize-admin-current-modules.mjs'
      - 'supabase/functions/rona-portal-api/admin.ts'
      - 'supabase/functions/rona-owner-acceptance/index.ts'
      - 'supabase/migrations/20260923164500_admin_radio_stage2b_notification_announcement_v1.sql'
      - 'scripts/qa-admin-radio-stage2b-production.mjs'
      - '.github/workflows/admin-radio-stage2b-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  checks: read

jobs:
  production-round-trip:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_ORIGIN: https://ronaoil.com
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact release head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "RADIO_STAGE2B_RELEASE_HEAD=$EXPECTED_HEAD"
      - name: Wait for exact Cloudflare production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs
      - name: Check production proof syntax
        run: node --check scripts/qa-admin-radio-stage2b-production.mjs
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Real production Notification and Announcement round-trip
        run: node scripts/qa-admin-radio-stage2b-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-radio-stage2b-production-${{ github.run_id }}
          path: admin-radio-stage2b-production-proof.json
          if-no-files-found: warn
          retention-days: 14
