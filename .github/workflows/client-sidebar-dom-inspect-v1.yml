name: Client sidebar DOM inspect v1

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect canonical client sidebar DOM
        run: node scripts/qa-client-sidebar-dom-inspect-v1.mjs
