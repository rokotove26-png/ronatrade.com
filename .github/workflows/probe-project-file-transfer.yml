name: Probe project file transfer channel

on:
  push:
    branches:
      - staging/canonical-all-portals-visual-20260816
    paths:
      - .github/workflows/probe-project-file-transfer.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe supplied package and canonical asset URLs
        shell: bash
        run: |
          set -u
          ids=(
            'file_0000000090748208bfb5473d7a779afd'
            'file_00000000c2708208b6f26f1d63bf34f2'
            'file_0000000042348208a6c55d2d2e67c66b'
          )
          patterns=(
            'https://files.oaiusercontent.com/%s'
            'https://chatgpt.com/backend-api/files/%s/download'
            'https://chatgpt.com/backend-api/files/%s/content'
            'https://chat.openai.com/backend-api/files/%s/download'
            'https://chat.openai.com/backend-api/files/%s/content'
          )
          i=0
          for id in "${ids[@]}"; do
            for p in "${patterns[@]}"; do
              i=$((i+1)); u=$(printf "$p" "$id"); out="/tmp/probe-$i"
              code=$(curl -L --max-time 20 -sS -o "$out" -w '%{http_code}' "$u" || true)
              bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
              sha=$(sha256sum "$out" 2>/dev/null | awk '{print $1}')
              echo "PROBE id=$id pattern=$p code=$code bytes=$bytes sha256=$sha"
            done
          done
