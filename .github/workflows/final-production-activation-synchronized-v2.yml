name: Synchronized final production activation gate v2

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  final-production-activation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify current-only Admin and Client production source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check assets/portal-admin-runtime-watchdog-v1.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check functions/portal/admin-approved-polish-ui.js
          node --check functions/portal/admin-approved-analytics-v455-ui.js
          node --check functions/portal/remaining-sections-ui.js
          node --check scripts/build-pages-direct-canonical.mjs
          node tests/admin-current-only-shell-contract.test.mjs
          node tests/admin-current-access-nav-v2.test.mjs
          node tests/admin-runtime-watchdog.test.mjs
          node scripts/qa-admin-single-owner.mjs
          node scripts/qa-client-contract-authoritative-projection.mjs

          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/canonical_background.png' | awk '{print $1}')" = '9f0022d1651ddcf14fe2c6c66a4151b9074804f237c7b347793fd6cd20f505cc'
          test "$(sha256sum 'portal-src/canonical/canonical_logo.svg' | awk '{print $1}')" = '755f13d3ba5c7b08a2538b72d3bcb8e0a6d5bb9b24ffde57cda7eca27762ac65'

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const manifest=JSON.parse(await readFile('portal-src/current/client/manifest.json','utf8'));
          const encoded=(await Promise.all(manifest.chunks.map(name=>readFile(`portal-src/current/client/${name}`,'utf8')))).join('');
          const source=brotliDecompressSync(Buffer.from(encoded,'base64'));
          const sha=createHash('sha256').update(source).digest('hex');
          if(source.length!==484970) throw new Error(`CLIENT_SOURCE_BYTES_MISMATCH ${source.length}`);
          if(sha!=='d07d7cbee5fd3466c8729861a6e6a6acb4ba463ad6d89dd7f748209cacab6183') throw new Error(`CLIENT_SOURCE_SHA_MISMATCH ${sha}`);
          if(manifest.decoded_bytes!==source.length||manifest.sha256!==sha) throw new Error('CLIENT_MANIFEST_SOURCE_IDENTITY_MISMATCH');
          NODE

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const bridge='<script id="rona-portal-currency-iso-v1" src="/assets/portal-runtime/portal-currency-iso-v1.js?v=20260830-iso-currency-v1" defer></script>';
          const pairs=[
            ['ADMIN','portal-src/current/admin.html','dist/portal/admin.html'],
            ['AGENT','portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html','dist/portal/agent.html'],
          ];
          for(const [label,sourcePath,emittedPath] of pairs){
            const source=await readFile(sourcePath,'utf8'),emitted=await readFile(emittedPath,'utf8');
            const count=emitted.split(bridge).length-1;
            if(count!==1) throw new Error(`${label}_ISO_CURRENCY_BRIDGE_COUNT_${count}`);
            if(emitted.replace(bridge,'')!==source) throw new Error(`${label}_EMITTED_DIFF_EXCEEDS_ISO_CURRENCY_BRIDGE`);
          }
          console.log('ADMIN_AGENT_SOURCE_PLUS_ISO_CURRENCY_BRIDGE=PASS');
          NODE
          test "$(stat -c%s dist/portal/admin.html)" -lt 60000
          ! grep -q 'adminLoginGate' dist/portal/admin.html
          ! grep -q 'rona-admin-auth-v3413' dist/portal/admin.html
          ! grep -q 'Временный автономный вход' dist/portal/admin.html
          ! grep -q 'admin_externalized' dist/portal/admin.html
          ! grep -q 'v3.4.13' dist/portal/admin.html
          grep -q 'data-rona-admin-shell="current-only-v2"' dist/portal/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" dist/portal/admin.html
          grep -q 'grid-template-columns:272px minmax(0,1fr)' dist/portal/admin.html
          grep -q 'min-height:48px' dist/portal/admin.html
          grep -q 'font-size:14.5px' dist/portal/admin.html
          grep -q 'data-action="create-access">Создать доступ</button>' dist/portal/admin.html
          grep -q 'data-page="agent-settlements"' dist/portal/admin.html
          grep -q 'data-page="claims"' dist/portal/admin.html
          grep -q 'data-page="market-news"' dist/portal/admin.html
          grep -q 'portal-admin-shell-fast-v1.js' dist/portal/admin.html
          grep -q 'portal-admin-runtime-watchdog-v1.js' dist/portal/admin.html
          grep -q 'clients-agents-current-ui' dist/portal/admin.html
          grep -q 'id="rona-client-contract-authoritative-projection-v5"' dist/portal/client.html
          grep -q '/assets/portal-runtime/client-contract-download-v3.js?v=20260829-authoritative-projection-v5' dist/portal/client.html
          test "$(grep -o 'client-contract-download-v3\.js' dist/portal/client.html | wc -l | tr -d ' ')" = "1"
          grep -q 'id="rona-portal-currency-iso-v1"' dist/portal/client.html
          grep -q '/assets/portal-runtime/portal-currency-iso-v1.js?v=20260830-iso-currency-v1' dist/portal/client.html
          test "$(grep -o 'portal-currency-iso-v1\.js' dist/portal/client.html | wc -l | tr -d ' ')" = "1"
          grep -q '/portal/main-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/claims-r2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/remaining-sections-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/analytics-v2-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "window.__RONA_ADMIN_SHELL_RESILIENCE__='single-owner-v3'" assets/portal-admin-shell-fast-v1.js
          grep -q "window.__RONA_ADMIN_RUNTIME_WATCHDOG__='page-aware-v7-analytics-rendered-ready'" assets/portal-admin-runtime-watchdog-v1.js
          grep -q "if(p==='market-news')return'market-news-current'" assets/portal-admin-runtime-watchdog-v1.js
          grep -q "root.querySelector(':scope > .mn-masthead')" assets/portal-admin-runtime-watchdog-v1.js
          ! grep -q 'location.reload(' assets/portal-admin-runtime-watchdog-v1.js
          ! grep -q 'location.replace(' assets/portal-admin-runtime-watchdog-v1.js
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260828-single-owner-v5'" functions/portal/clients-agents-current-ui.js
          grep -q "window.__RONA_ACCESS_CURRENT_OWNER__='clients-agents-current-v5'" functions/portal/clients-agents-current-ui.js
          grep -q "makeField('Единый логин',login)" functions/portal/clients-agents-current-ui.js
          grep -q "makeField('Электронная почта',email)" functions/portal/clients-agents-current-ui.js
          grep -q "await mutate('/access/users',payload)" functions/portal/clients-agents-current-ui.js
          grep -q 'История и права' functions/portal/clients-agents-current-ui.js
          grep -q "'x-rona-shell-mutation':'none'" functions/portal/clients-agents-current-ui.js
          grep -q "x-rona-access-create-owner':'none" functions/portal/admin-approved-polish-ui.js
          grep -q "x-rona-access-loader':'none" functions/portal/admin-approved-analytics-v455-ui.js
          ! grep -q 'installCanonicalAccessCreate' functions/portal/admin-approved-polish-ui.js
          ! grep -q 'loadCanonicalAccess' functions/portal/admin-approved-analytics-v455-ui.js
          test ! -e functions/portal/admin-canonical-create-access-v441-ui.js
          test ! -e functions/portal/admin-canonical-create-access-v441-password-hotfix-ui.js
          test ! -e functions/portal/admin-access-ui.js
          test ! -e functions/portal/clients-agents-v4-ui.js
          test ! -e functions/portal/clients-agents-canonical-guard-ui.js
          test ! -e functions/portal/main-ui.js
          test ! -e 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html'
          ! grep -q 'harvestLegacy' functions/portal/clients-agents-current-ui.js
          ! grep -q 'installNavigationStability' functions/portal/clients-agents-current-ui.js
          ! grep -q 'installShellParity' functions/portal/clients-agents-current-ui.js
          grep -q "__RONA_MARKET_NEWS_OWNER_GUARD_V6__='20260827-content-health-v6'" functions/portal/remaining-sections-ui.js
          grep -q "if(!healthy(root))emitRepair('market-news-owner-guard-v6-content-repair')" functions/portal/remaining-sections-ui.js
          grep -q 'ADMIN_EXCLUSIVE_CLIENT_V2' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'SIGNED_CONTRACT_ACTIVATION_V2' supabase/functions/rona-admin-contract-activation/index.ts
          node -e "const x=require('./dist/canonical-visual-integrity.json'); const c=x.client_runtime; if(x.architecture!=='CURRENT_ONLY_ADMIN_AND_CLIENT_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.state!=='CURRENT_ONLY'||x.admin_runtime?.legacy_runtime_in_deployment!==false||c?.state!=='CURRENT_ONLY'||c?.legacy_runtime_in_deployment!==false||c?.functional_bridge?.id!=='rona-client-contract-authoritative-projection-v5'||c?.functional_bridge?.marker!=='20260829-client-contract-v3-authoritative-projection-v5'||x.portal_currency_display?.standard!=='ISO_4217') process.exit(1)"
          echo 'CURRENT_ONLY_ADMIN_CLIENT_PRODUCTION_SOURCE_GATE=PASS'

      - name: Wait for this commit in Cloudflare production
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs

      - name: Verify Client v5 contract projection in production
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          TARGET_ORIGIN: https://ronaoil.com
        run: node scripts/verify-client-contract-v5-production.mjs

      - name: Publish target production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state='failure'; description='Current-only production gate failed'
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Current-only Admin and Client production gate passed'; fi
          target_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/target-production-gate","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
