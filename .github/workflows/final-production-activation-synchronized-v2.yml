name: Synchronized final production activation gate v2

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  final-production-activation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify current-only Admin production source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check functions/portal/admin.js
          node --check functions/portal/main-ui.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check functions/portal/clients-agents-current-ui.js
          node --check scripts/build-pages-direct-canonical.mjs
          node tests/admin-shell-resilience.test.mjs
          node tests/admin-current-only-shell-contract.test.mjs
          node tests/admin-current-access-nav-v2.test.mjs
          node tests/admin-runtime-watchdog.test.mjs

          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          test "$(sha256sum 'portal-src/canonical/canonical_background.png' | awk '{print $1}')" = '9f0022d1651ddcf14fe2c6c66a4151b9074804f237c7b347793fd6cd20f505cc'
          test "$(sha256sum 'portal-src/canonical/canonical_logo.svg' | awk '{print $1}')" = '755f13d3ba5c7b08a2538b72d3bcb8e0a6d5bb9b24ffde57cda7eca27762ac65'

          cmp -s portal-src/current/admin.html dist/portal/admin.html
          cmp -s 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' dist/portal/agent.html
          cmp -s 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' dist/portal/client.html
          test "$(stat -c%s dist/portal/admin.html)" -lt 60000
          ! grep -q 'adminLoginGate' dist/portal/admin.html
          ! grep -q 'rona-admin-auth-v3413' dist/portal/admin.html
          ! grep -q 'Временный автономный вход' dist/portal/admin.html
          ! grep -q 'admin_externalized' dist/portal/admin.html
          ! grep -q 'v3.4.13' dist/portal/admin.html
          grep -q 'data-rona-admin-shell="current-only-v2"' dist/portal/admin.html
          grep -q "__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2'" dist/portal/admin.html
          grep -q 'grid-template-columns:238px minmax(0,1fr)' dist/portal/admin.html
          grep -q 'data-action="create-access">Создать доступ</button>' dist/portal/admin.html
          grep -q 'data-page="agent-settlements"' dist/portal/admin.html
          grep -q 'data-page="claims"' dist/portal/admin.html
          grep -q 'portal-admin-shell-fast-v1.js' dist/portal/admin.html
          grep -q 'clients-agents-current-ui' dist/portal/admin.html
          grep -q '/portal/main-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "window.__RONA_CLIENTS_AGENTS_CURRENT__='20260826-current-only-v2'" functions/portal/clients-agents-current-ui.js
          grep -q "create.dataset.ronaCreateAccess='primary'" functions/portal/clients-agents-current-ui.js
          ! grep -q 'harvestLegacy' functions/portal/clients-agents-current-ui.js
          ! grep -q 'window.openModal' functions/portal/clients-agents-current-ui.js
          grep -q 'ADMIN_EXCLUSIVE_CLIENT_V2' supabase/functions/rona-admin-control-plane/index.ts
          grep -q 'SIGNED_CONTRACT_ACTIVATION_V2' supabase/functions/rona-admin-contract-activation/index.ts
          node -e "const x=require('./dist/canonical-visual-integrity.json'); if(x.architecture!=='CURRENT_ONLY_ADMIN_SHELL_WITH_FROZEN_CANONICAL_ASSETS'||x.admin_runtime?.state!=='CURRENT_ONLY'||x.admin_runtime?.legacy_runtime_in_deployment!==false) process.exit(1)"
          echo 'CURRENT_ONLY_ADMIN_PRODUCTION_SOURCE_GATE=PASS'

      - name: Wait for this commit in Cloudflare production
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-cloudflare-commit.mjs

      - name: Verify current-only Admin in production
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/public-go-live-v1.1'
        env:
          TARGET_ORIGIN: https://ronaoil.com
        run: node scripts/verify-admin-current-only-production.mjs

      - name: Publish target production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state='failure'; description='Current-only production gate failed'
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Current-only Admin production gate passed'; fi
          target_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/target-production-gate","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null