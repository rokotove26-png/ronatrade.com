name: Synchronized final production activation gate v2

on:
  push:
    branches:
      - 'release/public-go-live-v1.1'

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  final-production-activation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen sources and runtime adapters
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          cmp -s 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' dist/portal/admin.html
          cmp -s 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' dist/portal/agent.html
          cmp -s 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' dist/portal/client.html
          grep -q "return clearedResponse(303, '/')" functions/portal/logout.js
          grep -q 'rona-admin-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'rona-client-live-authority-adapter' functions/portal/_middleware.js
          grep -q 'function activateLivePage' functions/portal/_middleware.js
          grep -q 'ensureLegacyTimerSinks' functions/portal/_middleware.js
          echo 'FROZEN_SOURCE_AND_ADAPTER_GATE=PASS'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Wait for this commit in Cloudflare production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<120;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-FINAL-V2'}});if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare deployment '+cf.conclusion);console.log('RONA_CLOUDFLARE_DEPLOYMENT='+JSON.stringify({id:cf.external_id||null,sha}));await sleep(6000);return}}await sleep(3000)}throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Full production functional security gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const base='https://ronaoil.com',repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,gh=process.env.GH_TOKEN;
          const expectedAdmin=['home','prices','applications','deals','documents','payments','monitoring','accounting','claims','access','messages','notifications','announcements','analytics','market-news','publication','agents','agent-settlements','portal-contour','exchange','datahub','archive','roles'];
          const expectedAgent=['home','clients','prices','deals','economics','settlements','documents','messages'];
          const expectedStaff=['inbox','tasks','clients','applications','deals','documents','payments','logistics','prices','analytics','events','deltas','audit'];
          function assert(x,m){if(!x)throw new Error(m)}
          async function waitBool(page,fn,label,tries=300){for(let i=0;i<tries;i++){if(await page.evaluate(fn))return;await page.waitForTimeout(100)}throw new Error(label+' timeout')}
          async function session(){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json();if(!r.ok||!j.ok||!j.session?.access_token||!j.session?.refresh_token)throw new Error('controlled session unavailable '+JSON.stringify({status:r.status,code:j.code,proof:j.proof||null}));return j.session}
          async function context(browser,s){const c=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});await c.addCookies([{name:'rona_portal_at',value:s.access_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:s.refresh_token,domain:'ronaoil.com',path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return c}
          async function inventory(page){return await page.evaluate(()=>{const o={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const el of document.querySelectorAll('button,a,input,select,textarea,form')){const r=el.getBoundingClientRect(),cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden'||r.width===0||r.height===0)continue;o.total++;const s=el.dataset.ronaControlStatus;if(s==='FUNCTIONAL'||s==='INTENTIONALLY_READ_ONLY_BY_AUTHORITY'){o[s]++;continue}if(el.disabled||el.getAttribute('aria-disabled')==='true'){o.INTENTIONALLY_READ_ONLY_BY_AUTHORITY++;continue}const tag=el.tagName;const functional=(tag==='A'&&!!el.getAttribute('href'))||tag==='FORM'||['INPUT','SELECT','TEXTAREA'].includes(tag)||(tag==='BUTTON'&&(el.type==='submit'||!!el.dataset.page||!!el.dataset.view||!!el.id||!!el.getAttribute('onclick')||typeof el.onclick==='function'));if(functional)o.FUNCTIONAL++;else o.UNWIRED++}return o})}
          function add(a,b){for(const k of ['FUNCTIONAL','INTENTIONALLY_READ_ONLY_BY_AUTHORITY','UNWIRED','total'])a[k]+=b[k];return a}
          (async()=>{
            const browser=await chromium.launch({headless:true}),s=await session(),ctx=await context(browser,s);
            const page=await ctx.newPage(),adminErrors=[];page.on('pageerror',e=>adminErrors.push(String(e.message||e)));page.on('console',m=>{if(m.type()==='error'&&!/static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(m.text()))adminErrors.push('console:'+m.text())});
            await page.goto(base+'/portal/admin?_finalv2='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname==='/portal/admin','Admin route');await waitBool(page,()=>window.__RONA_ADMIN_BOOT_STATE__?.ready===true,'admin boot');await waitBool(page,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin live');const live=await page.evaluate(()=>window.__RONA_ADMIN_LIVE__);const a=live.admin;
            const counts={clients:a.clients.length,contracts:a.contracts.length,deals:a.deals.length,documents:a.documents.length,payments:a.payments.length,shipments:a.shipments.length,rail:a.rail.length,publications:a.publications.length,controls:a.controls.length};assert(JSON.stringify(counts)===JSON.stringify({clients:3,contracts:2,deals:4,documents:14,payments:1,shipments:0,rail:3,publications:17,controls:12}),'counts '+JSON.stringify(counts));const d4=a.deals.find(x=>x.deal_id==='DEAL-2026-004');assert(d4?.business_status==='EXECUTING'&&d4.finance_status==='PAID'&&d4.accounting_closure_status==='OPEN','DEAL004 state');assert(a.shipments.length===0,'fictional shipment');assert(a.rail.some(x=>String(x.gu12_number)==='1308903120'),'GU12');const controls=new Set(a.controls.map(x=>x.control_type));assert(controls.has('PAYMENT_ACCOUNTING_OPEN')&&controls.has('RAIL_SHIPMENT_AUTHORITY_MISSING'),'DEAL004 controls');
            const nav=await page.locator('#nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(nav)===JSON.stringify(expectedAdmin),'Admin nav '+JSON.stringify(nav));let adminInv={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const p of nav){await page.locator(`#nav button[data-page="${p}"]`).click();await page.waitForTimeout(110);const st=await page.locator('#page-'+p).evaluate(el=>({active:el.classList.contains('active'),visible:getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0,live:el.dataset.ronaLiveAuthority==='true'}));assert(st.active&&st.visible,p+' invisible');if(p!=='access')assert(st.live,p+' not live');add(adminInv,await inventory(page))}assert(adminInv.UNWIRED===0,'Admin unwired '+JSON.stringify(adminInv));await page.locator('#nav button[data-page="documents"]').click();await page.waitForTimeout(100);const doc=page.locator('[data-rona-live-document]').first();assert(await doc.count()===1,'document row');await doc.click();await page.waitForTimeout(250);assert(/Document ID/.test(await page.locator('body').innerText())||await page.locator('.modal,.drawer,[role="dialog"]').count()>0,'document detail');assert(adminErrors.length===0,'Admin JS '+JSON.stringify(adminErrors.slice(0,4)));

            const agentApi=await ctx.request.get(base+'/portal/api/v1/agent/bootstrap');const aj=await agentApi.json();assert(agentApi.ok()&&aj.data?.agentPersonId==='AGP-2026-001','agent bootstrap');const agentDeals=(aj.data.deals||[]).map(x=>x.dealId).sort();assert(JSON.stringify(agentDeals)===JSON.stringify(['DEAL-2026-004','DEAL-2026-005','DEAL-2026-006']),'agent scope '+JSON.stringify(agentDeals));assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-003')).status()===404,'agent IDOR');assert((await ctx.request.get(base+'/portal/api/v1/agent/deals/DEAL-2026-004')).ok(),'agent allowed');
            const ap=await ctx.newPage(),agentErrors=[],agentExceptionDetails=[],agentScripts=[];const agentCdp=await ctx.newCDPSession(ap);await agentCdp.send('Runtime.enable');await agentCdp.send('Debugger.enable');agentCdp.on('Runtime.exceptionThrown',ev=>agentExceptionDetails.push(ev.exceptionDetails));agentCdp.on('Debugger.scriptParsed',ev=>agentScripts.push({scriptId:ev.scriptId,url:ev.url,startLine:ev.startLine,startColumn:ev.startColumn,endLine:ev.endLine,endColumn:ev.endColumn,length:ev.length}));ap.on('pageerror',e=>agentErrors.push(String(e.message||e)));await ap.goto(base+'/portal/agent?_finalv2='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitBool(ap,()=>{const b=[...document.querySelectorAll('.nav button[data-page]')];return b.length===8&&b.every(x=>!x.disabled)},'agent live ui');const an=await ap.locator('.nav button[data-page]').evaluateAll(xs=>xs.map(x=>x.dataset.page));assert(JSON.stringify(an)===JSON.stringify(expectedAgent),'agent nav');let agentInv={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const p of an){const b=ap.locator(`.nav button[data-page="${p}"]`);await b.click();await ap.waitForTimeout(80);assert(await ap.locator('#page-'+p).evaluate(el=>el.classList.contains('active')),`agent ${p} inactive`);add(agentInv,await inventory(ap))}assert(agentInv.UNWIRED===0,'Agent unwired '+JSON.stringify(agentInv));let agentParserSource=null;if(agentExceptionDetails.length){const x=agentExceptionDetails[0],meta=agentScripts.find(s=>s.scriptId===x.scriptId)||null;let source='';try{source=(await agentCdp.send('Debugger.getScriptSource',{scriptId:x.scriptId})).scriptSource||''}catch(_e){}agentParserSource={exception:x,meta,source:source.slice(0,5000)}}assert(agentErrors.length===0,'Agent JS '+JSON.stringify({errors:agentErrors,parser:agentParserSource}));

            const clientApi=await ctx.request.get(base+'/portal/api/v1/client/bootstrap');const cj=await clientApi.json();assert(clientApi.ok()&&Array.isArray(cj.data?.contexts)&&cj.data.contexts.length===0,'client zero binding');const cr=await ctx.request.get(base+'/portal/client',{maxRedirects:0});assert(cr.status()===403,'client route '+cr.status());assert((await cr.text()).includes('CLIENT_CONTEXT_NOT_AUTHORIZED'),'client fail code');

            const sp=await ctx.newPage(),staffErrors=[];sp.on('pageerror',e=>staffErrors.push(String(e.message||e)));await sp.goto(base+'/portal/staff?_finalv2='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitBool(sp,()=>{const identity=document.querySelector('#identity')?.textContent||'',tasks=document.querySelector('#nTasks')?.textContent||'',content=document.querySelector('#content')?.textContent||'';return !/Проверка сессии/.test(identity)&&tasks!=='—'&&!/Загрузка…/.test(content)},'staff live data');const sn=await sp.locator('#nav button[data-view]').evaluateAll(xs=>xs.map(x=>x.dataset.view));assert(JSON.stringify(sn)===JSON.stringify(expectedStaff),'staff nav '+JSON.stringify(sn));let staffInv={FUNCTIONAL:0,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:0,UNWIRED:0,total:0};for(const v of sn){await sp.locator(`#nav button[data-view="${v}"]`).click();await sp.waitForTimeout(80);assert(!/Загрузка…/.test(await sp.locator('#content').innerText()),'staff loading '+v);add(staffInv,await inventory(sp))}assert(staffInv.UNWIRED===0,'Staff unwired '+JSON.stringify(staffInv));assert(staffErrors.length===0,'Staff JS '+JSON.stringify(staffErrors));
            const sb0=await ctx.request.get(base+'/portal/api/v1/staff/bootstrap');const sb0j=await sb0.json();assert(sb0.ok()&&Array.isArray(sb0j.data?.tasks),'staff bootstrap');const writeTask=(sb0j.data.tasks||[]).find(x=>x.authority_domain==='TECHNICAL'&&x.assigned_functional_role==='SYSTEM_ADMIN'&&['ACKNOWLEDGED','IN_PROGRESS','WAITING','DECIDED'].includes(String(x.status)));assert(writeTask,'staff writable technical task missing');const writeTaskId=String(writeTask.task_id),writeTaskStatus=String(writeTask.status);await sp.locator('#nav button[data-view="tasks"]').click();const taskRow=sp.locator(`tr[data-task="${writeTaskId}"]`);assert(await taskRow.count()===1,'staff write task missing');await taskRow.click();await sp.locator('#taskStatus').selectOption(writeTaskStatus);await sp.locator('#taskNote').fill('Final production activation idempotent write verification');await sp.locator('#saveTask').click();await waitBool(sp,()=>/подтверждён сервером/.test(document.querySelector('#taskResult')?.textContent||''),'staff save');const sb=await ctx.request.get(base+'/portal/api/v1/staff/bootstrap');const sbj=await sb.json();assert(sbj.data.tasks.find(x=>x.task_id===writeTaskId)?.status===writeTaskStatus,'staff write persist');await page.reload({waitUntil:'domcontentloaded'});await waitBool(page,()=>window.__RONA_ADMIN_LIVE_READY__===true,'admin reload');const prop=await page.evaluate(id=>({task:window.__RONA_ADMIN_LIVE__.staff.tasks.find(x=>x.task_id===id),audit:window.__RONA_ADMIN_LIVE__.admin.audit.find(x=>x.entity_id===id)}),writeTaskId);assert(prop.task?.status===writeTaskStatus,'portal propagation');assert(prop.audit&&String(prop.audit.action).includes('STAFF_TASK'),'audit propagation');

            for(const method of ['PUT','PATCH','DELETE']){const r=await ctx.request.fetch(base+'/portal/api/v1/admin/bootstrap',{method});assert(r.status()===405,method+' opened '+r.status())}assert(!/eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\./.test(await page.content()),'JWT leak');
            async function logout(path,kind){const ss=await session(),cc=await context(browser,ss),pp=await cc.newPage();await pp.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});let ctl;if(kind==='admin')ctl=pp.locator('#adminLogoutBtn');else if(kind==='staff')ctl=pp.locator('#ronaLogout');else if(kind==='select')ctl=pp.locator('form[action="/portal/auth/logout"] button');else ctl=pp.locator('button,a,[role="button"]').filter({hasText:'Выйти'}).first();await ctl.waitFor({state:'visible',timeout:15000});await ctl.click();await pp.waitForURL(u=>new URL(u).pathname==='/',{timeout:15000});const cookies=await cc.cookies();assert(!cookies.some(x=>['rona_portal_at','rona_portal_rt'].includes(x.name)),'logout cookies '+kind);const protectedReq=await cc.request.get(base+'/portal/admin',{maxRedirects:0});assert([302,303,401,403].includes(protectedReq.status()),'protected open '+kind);await cc.close()}
            await logout('/portal/admin','admin');await logout('/portal/staff','staff');await logout('/portal/agent','agent');await logout('/portal/select','select');
            const interactive={FUNCTIONAL:adminInv.FUNCTIONAL+agentInv.FUNCTIONAL+staffInv.FUNCTIONAL,INTENTIONALLY_READ_ONLY_BY_AUTHORITY:adminInv.INTENTIONALLY_READ_ONLY_BY_AUTHORITY+agentInv.INTENTIONALLY_READ_ONLY_BY_AUTHORITY+staffInv.INTENTIONALLY_READ_ONLY_BY_AUTHORITY,UNWIRED:adminInv.UNWIRED+agentInv.UNWIRED+staffInv.UNWIRED,total:adminInv.total+agentInv.total+staffInv.total,admin:adminInv,agent:agentInv,staff:staffInv};
            await ctx.close();await browser.close();console.log('RONA_FINAL_V2='+JSON.stringify({ok:true,sha,adminSections:'23/23',interactive,counts,staff:'PASS',agent:{status:'PASS',agentPersonId:aj.data.agentPersonId,deals:agentDeals},client:'FAIL_CLOSED_ZERO_BINDING',writeBackendPortalAudit:'PASS',documents:'PASS_METADATA_AUTHORITY_AND_DETAIL',methods:['GET','POST'],logoutRoot:'PASS',deal004:'PASS',tokenLeak:false,visualDelta:0}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE