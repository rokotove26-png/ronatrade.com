name: Admin Payments V7 Frame Production Acceptance

on:
  push:
    branches:
      - feat/admin-payments-final-owner-screen-passport-v1
    paths:
      - 'scripts/admin-payments-v7-frame-production-acceptance.mjs'
      - 'scripts/admin-payments-v7-native-spend-diagnostic.mjs'
      - '.github/workflows/admin-payments-v7-frame-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: admin-payments-v7-frame-production-acceptance
  cancel-in-progress: true

jobs:
  authenticated-live-frame-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run native spend production diagnostic
        env:
          TARGET_ORIGIN: https://ronaoil.com
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: node scripts/admin-payments-v7-native-spend-diagnostic.mjs
