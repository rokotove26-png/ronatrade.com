name: Client Home current-only QA

on:
  pull_request:
    branches:
      - release/public-go-live-v1.1
  push:
    branches:
      - release/public-go-live-v1.1

permissions:
  contents: read

jobs:
  home-current-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify retired Home runtime is absent and current-only bridge is canonical
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assets/portal-runtime/client-home-authoritative-v1.js
          node --check assets/portal-runtime/client-home-current-only-v1.js
          node --check scripts/attach-client-home-current-only-v1.mjs
          npm run build
          test ! -e dist/assets/portal-runtime/client-home-authoritative-v1.js
          ! grep -q 'client-home-authoritative-v1.js' dist/portal/client.html
          ! grep -q 'data-rona-client-home-owner="authoritative-v1"' dist/portal/client.html
          test "$(grep -o 'client-home-current-only-v1.js' dist/portal/client.html | wc -l)" -eq 1
          grep -q 'id="rona-client-home-current-only-v1"' dist/portal/client.html
          node <<'NODE'
          const fs=require('fs');
          const i=JSON.parse(fs.readFileSync('dist/canonical-visual-integrity.json','utf8'));
          const h=i.client_runtime?.home_current_only;
          if(h?.owner!=='command-center-v2'||h?.mode!=='PHYSICAL_CURRENT_ONLY_DOM_V1'||h?.legacy_dom!=='PHYSICALLY_REMOVED'||h?.legacy_runtime_asset!=='ABSENT'||h?.navigation_prepaint_reset!==true||h?.degraded_error_owner!==true||h?.error_fallback!=='CONTROLLED_DEGRADED_STATE'||h?.reinsertion_policy!=='REMOVE_BEFORE_NEXT_PAINT'||h?.business_logic_changed!==false||h?.business_data_changed!==false)throw new Error('Home current-only integrity contract missing');
          console.log('CLIENT_HOME_CURRENT_ONLY_BUILD=PASS');
          NODE

      - name: Install Chrome browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Prove old Home cannot repaint during navigation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const path=require('path');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          const built=fs.readFileSync('dist/portal/client.html','utf8');
          const guard=built.match(/<style id="rona-client-home-first-paint-guard">[\s\S]*?<\/style>/i)?.[0];
          assert(guard,'Home first-paint guard missing');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const page=await browser.newPage({viewport:{width:1400,height:900}});
            const html=`<!doctype html><html data-rona-client-home-ready="true"><head>${guard}<style>#page-home{position:relative;width:900px;min-height:500px}.frame{width:850px;border:1px solid #345;padding:10px}.legacy{width:850px;height:180px;background:#812;color:white}</style></head><body><nav><button id="navHome">Главная</button></nav><main><section id="page-home"><section id="title" class="frame"><h1>Главная</h1></section><section id="context" class="frame"><span>Выбрана компания</span></section><section data-rona-client-home-owner="command-center-v2"><div>CURRENT HOME OWNER</div></section><section id="legacyInitial" class="legacy"><div>АКТИВНЫЕ СДЕЛКИ</div><div>ТЕКУЩИЙ СТАТУС</div></section></section></main></body></html>`;
            await page.route('https://rona.test/portal/client',route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}));
            await page.goto('https://rona.test/portal/client',{waitUntil:'domcontentloaded'});
            await page.addScriptTag({path:path.resolve('assets/portal-runtime/client-home-current-only-v1.js')});
            await page.waitForFunction(()=>document.querySelector('#page-home')?.getAttribute('data-rona-client-home-current-only')==='command-center-v2');
            assert(!(await page.$('#legacyInitial')),'initial legacy Home node was hidden instead of deleted');

            await page.evaluate(()=>{
              const button=document.querySelector('#navHome');
              button.addEventListener('pointerdown',()=>{
                const root=document.querySelector('#page-home');
                const old=document.createElement('section');
                old.id='legacyReinserted';old.className='legacy';old.innerHTML='<div>АКТИВНЫЕ СДЕЛКИ</div><div>ТЕКУЩИЙ СТАТУС</div>';
                root.appendChild(old);
              });
              document.documentElement.setAttribute('data-rona-client-home-ready','true');
              document.documentElement.setAttribute('data-rona-client-home-state','ready');
            });
            await page.dispatchEvent('#navHome','pointerdown');
            await page.waitForTimeout(0);
            const state=await page.evaluate(()=>({
              ready:document.documentElement.hasAttribute('data-rona-client-home-ready'),
              status:document.documentElement.getAttribute('data-rona-client-home-state'),
              legacy:!!document.querySelector('#legacyReinserted'),
              owner:document.querySelectorAll('[data-rona-client-home-owner="command-center-v2"]').length,
              overlay:getComputedStyle(document.querySelector('#page-home'),'::after').content,
              overlayBg:getComputedStyle(document.querySelector('#page-home'),'::after').backgroundColor,
              dom:document.documentElement.getAttribute('data-rona-client-home-dom')
            }));
            assert(state.ready===false&&state.status==='loading','Home ready state was not reset before legacy renderer');
            assert(state.legacy===false,'reinserted legacy Home DOM survived to next task');
            assert(state.owner===1,'current Home owner was removed or duplicated');
            assert(state.overlay.includes('Загрузка центра управления'),'Home opaque prepaint guard not active');
            assert(state.overlayBg!=='transparent'&&state.overlayBg!=='rgba(0, 0, 0, 0)','Home guard is transparent');
            assert(state.dom==='CURRENT_ONLY_PHYSICAL_V1','current-only DOM marker missing');
            console.log('CLIENT_HOME_LEGACY_REPAINT=BLOCKED');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Prove command-center error becomes controlled degraded state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const path=require('path');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const page=await browser.newPage({viewport:{width:1400,height:900}});
            const html='<!doctype html><html><head><style>#page-home{position:relative;width:900px;min-height:500px}.frame{width:850px;border:1px solid #345;padding:10px}.legacy{width:850px;height:180px}</style></head><body><main><section id="page-home"><section class="frame"><h1>Главная</h1></section><section class="frame"><span>Выбрана компания</span></section><section data-rona-client-home-owner="command-center-v2"></section><section id="legacyError" class="legacy"><div>АКТИВНЫЕ СДЕЛКИ</div><div>ТЕКУЩИЙ СТАТУС</div></section></section></main></body></html>';
            await page.route('https://rona.test/portal/client',route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}));
            await page.goto('https://rona.test/portal/client',{waitUntil:'domcontentloaded'});
            await page.addScriptTag({path:path.resolve('assets/portal-runtime/client-home-current-only-v1.js')});
            await page.evaluate(()=>document.documentElement.setAttribute('data-rona-client-home-state','error'));
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-rona-client-home-degraded')==='error-fallback');
            const fallback=await page.evaluate(()=>({
              owners:document.querySelectorAll('[data-rona-client-home-owner="command-center-v2"]').length,
              text:document.querySelector('[data-rona-client-home-owner="command-center-v2"]')?.textContent||'',
              prepaint:document.documentElement.getAttribute('data-rona-client-home-prepaint'),
              release:document.documentElement.getAttribute('data-rona-client-home-prepaint-release'),
              title:document.body.textContent.includes('Главная'),
              context:document.body.textContent.includes('Выбрана компания'),
              legacy:!!document.querySelector('#legacyError')
            }));
            assert(fallback.owners===1,'error fallback duplicated or lost current owner');
            assert(fallback.text.includes('Данные временно недоступны'),'controlled degraded message missing');
            assert(fallback.prepaint==='released'&&fallback.release==='command-center-error','error state did not release prepaint safely');
            assert(fallback.title&&fallback.context,'canonical title/context frames were removed');
            assert(fallback.legacy===false,'legacy Home survived error fallback');

            await page.evaluate(()=>{
              const owner=document.querySelector('[data-rona-client-home-owner="command-center-v2"]');
              owner.innerHTML='<div id="lastGood">LAST KNOWN GOOD</div>';
              owner.removeAttribute('data-rona-client-home-degraded');
              document.documentElement.removeAttribute('data-rona-client-home-degraded');
              document.documentElement.setAttribute('data-rona-client-home-state','loading');
              document.documentElement.setAttribute('data-rona-client-home-state','error');
            });
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-rona-client-home-degraded')==='stale-preserved');
            const preserved=await page.evaluate(()=>({
              owners:document.querySelectorAll('[data-rona-client-home-owner="command-center-v2"]').length,
              lastGood:!!document.querySelector('#lastGood'),
              degraded:document.documentElement.getAttribute('data-rona-client-home-degraded'),
              prepaint:document.documentElement.getAttribute('data-rona-client-home-prepaint')
            }));
            assert(preserved.owners===1&&preserved.lastGood,'last-known-good owner was not preserved');
            assert(preserved.degraded==='stale-preserved'&&preserved.prepaint==='released','stale-preserved state contract missing');
            console.log('CLIENT_HOME_ERROR_DEGRADED_STATE=PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
