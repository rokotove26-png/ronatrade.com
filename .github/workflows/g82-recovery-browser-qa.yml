name: G8.2 historical portal payload scan

on:
  push:
    branches:
      - staging/admin-canonical-visual-20260816
    paths:
      - '.github/workflows/g82-recovery-browser-qa.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all refs
        run: git fetch --all --tags --force --prune
      - name: List historical portal payload paths and hash markers
        shell: bash
        run: |
          set -euo pipefail
          echo '@@ALL_HISTORICAL_PORTAL_SRC_PATHS@@'
          git log --all --name-only --pretty=format: -- portal-src | sed '/^$/d' | sort -u
          echo '@@ALL_HISTORICAL_WORKFLOW_PATHS@@'
          git log --all --name-only --pretty=format: -- .github/workflows | sed '/^$/d' | sort -u
          echo '@@COMMITS_MENTIONING_FROZEN_SHAS@@'
          for q in \
            9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea \
            961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31 \
            4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c \
            9f0022d1651ddcf14fe2c6c66a4151b9074804f237c7b347793fd6cd20f505cc; do
            echo "TARGET $q"
            git log --all -S"$q" --date=iso-strict --pretty='format:COMMIT %H %ad %s' --name-status | head -160 || true
          done
          echo '@@HISTORICAL_ENCODED_PAYLOAD_CANDIDATES@@'
          git rev-list --objects --all | grep -Ei '(portal-src|admin|client|agent).*(b64|gz|br|zip|html|part)' | head -1000 || true
