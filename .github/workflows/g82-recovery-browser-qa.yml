name: G8.2 canonical asset provenance scan

on:
  push:
    branches:
      - staging/admin-canonical-visual-20260816
    paths:
      - '.github/workflows/g82-recovery-browser-qa.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all refs
        run: git fetch --all --tags --force --prune
      - name: Find exact canonical visual asset blobs
        shell: bash
        run: |
          set -euo pipefail
          BG='9f0022d1651ddcf14fe2c6c66a4151b9074804f237c7b347793fd6cd20f505cc'
          LOGO='755f13d3ba5c7b08a2538b72d3bcb8e0a6d5bb9b24ffde57cda7eca27762ac65'
          echo "@@TARGETS@@ BG=$BG LOGO=$LOGO"
          git rev-list --objects --all | awk '{print $1}' | sort -u > /tmp/oids
          while read -r oid; do
            [ "$(git cat-file -t "$oid" 2>/dev/null || true)" = blob ] || continue
            size=$(git cat-file -s "$oid")
            [ "$size" -le 8000000 ] || continue
            h=$(git cat-file blob "$oid" | sha256sum | awk '{print $1}')
            if [ "$h" = "$BG" ] || [ "$h" = "$LOGO" ]; then
              echo "MATCH sha256=$h oid=$oid size=$size"
              git rev-list --objects --all | awk -v o="$oid" '$1==o{print "PATH " $0}' | head -50
              echo '@@COMMITS_CONTAINING_BLOB@@'
              for c in $(git rev-list --all --objects | awk -v o="$oid" '$1==o{print $1}' | head -1); do :; done
              git log --all --find-object="$oid" --date=iso-strict --pretty='format:COMMIT %H %ad %s' --name-status | head -120 || true
            fi
          done < /tmp/oids
          echo '@@CURRENT_RASTER_AND_VECTOR_ASSETS@@'
          find assets -type f \( -iname '*.png' -o -iname '*.svg' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print | sort | head -500
