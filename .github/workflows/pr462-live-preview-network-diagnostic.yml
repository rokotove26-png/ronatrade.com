name: PR462 deployed preview network diagnostic

on:
  push:
    branches: [feat/admin-payments-final-owner-screen-passport-v1]
    paths:
      - '.github/workflows/pr462-live-preview-network-diagnostic.yml'
  workflow_dispatch:

permissions:
  checks: read
  contents: read

jobs:
  deployed-preview-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      RONA_ADMIN_SESSION_SECRET: ${{ secrets.RONA_ADMIN_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve exact immutable Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));const head=process.env.HEAD_SHA,repo=process.env.GITHUB_REPOSITORY;
          const headers={accept:'application/vnd.github+json',authorization:`Bearer ${process.env.GH_TOKEN}`,'x-github-api-version':'2022-11-28'};let check;
          for(let i=0;i<120;i++){const r=await fetch(`https://api.github.com/repos/${repo}/commits/${head}/check-runs?per_page=100`,{headers});if(!r.ok)throw new Error(`CHECK_RUNS_HTTP_${r.status}`);const j=await r.json();check=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages'&&x.head_sha===head&&x.status==='completed'&&x.conclusion==='success');if(check)break;await sleep(5000)}
          if(!check)throw new Error('CLOUDFLARE_PREVIEW_TIMEOUT');const m=String(check.output?.summary||'').match(/https:\/\/[0-9a-f]{8}\.rona-trade-public\.pages\.dev/i);if(!m)throw new Error('IMMUTABLE_PREVIEW_URL_MISSING');await appendFile(process.env.GITHUB_ENV,`TARGET_ORIGIN=${m[0].toLowerCase()}\n`);console.log(`IMMUTABLE_PREVIEW=${m[0].toLowerCase()}`);
          NODE
      - name: Capture unauthenticated live route behavior and exact auth blocker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr462-live-network
          : > artifacts/pr462-live-network/network-proof.txt
          for spec in \
            'SESSION_ME|/portal/api/session/me' \
            'AI_SYNC|/portal/owner-api?path=/admin/ai-sync' \
            'PAYMENT_SCHEDULE|/portal/payment-schedule-current' \
            'PAYMENT_PASSPORT_004|/portal/payment-passport-current?dealId=DEAL-2026-004'; do
            label="${spec%%|*}"; path="${spec#*|}"; body="artifacts/pr462-live-network/${label}.body"; headers="artifacts/pr462-live-network/${label}.headers";
            status=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$TARGET_ORIGIN$path")
            code=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(j.code||j.state||''))}catch{}" "$body")
            printf '%s URL=%s STATUS=%s CODE=%s\n' "$label" "$TARGET_ORIGIN$path" "$status" "$code" | tee -a artifacts/pr462-live-network/network-proof.txt
          done
          if [ -z "${RONA_ADMIN_SESSION_SECRET:-}" ]; then
            echo 'AUTHENTICATED_PREVIEW_QA_BLOCKER=RONA_ADMIN_SESSION_SECRET_MISSING_IN_GITHUB_ACTIONS' | tee -a artifacts/pr462-live-network/network-proof.txt
          else
            echo 'AUTHENTICATED_PREVIEW_QA_SECRET_PRESENT=PASS' | tee -a artifacts/pr462-live-network/network-proof.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pr462-live-preview-network-diagnostic-${{ github.run_id }}
          path: artifacts/pr462-live-network/
          retention-days: 14
