name: RONA Public Market News Ingest (DB-native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: DB-native collector status
        shell: bash
        run: |
          echo "Public market source collection is executed in production by Supabase pg_cron job rona-public-market-news-db-ingest-v1."
          echo "The former GitHub placeholder schedule is disabled to prevent false PUBLIC_SOURCE_COLLECTOR_NOT_CONFIGURED alerts."
