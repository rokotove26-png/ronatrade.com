name: rail-current-owner-qa

on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/client-rail-current-ui.js'
      - 'functions/portal/rail-current-v81-maplibre-ui.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'supabase/functions/rona-portal-api/client.ts'
      - 'supabase/functions/rona-portal-api/index.ts'
      - 'scripts/attach-client-rail-production-v1.mjs'
      - 'scripts/emit-client-runtime-cache-policy.mjs'
      - 'governance/client-rail-admin-mirror-owner-approval-20260918.json'
      - '.github/workflows/rail-v5-owner-qa.yml'
  push:
    branches: [release/public-go-live-v1.1]
    paths:
      - 'functions/portal/client-rail-current-ui.js'
      - 'functions/portal/rail-current-v81-maplibre-ui.js'
      - 'functions/portal/admin-main-ui-current.js'
      - 'supabase/functions/rona-portal-api/client.ts'
      - 'supabase/functions/rona-portal-api/index.ts'
      - 'scripts/attach-client-rail-production-v1.mjs'
      - 'scripts/emit-client-runtime-cache-policy.mjs'
      - 'governance/client-rail-admin-mirror-owner-approval-20260918.json'
      - '.github/workflows/rail-v5-owner-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Admin Rail owner and Client parity projection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const client=fs.readFileSync('functions/portal/client-rail-current-ui.js','utf8');
          const admin=fs.readFileSync('functions/portal/rail-current-v81-maplibre-ui.js','utf8');
          const attach=fs.readFileSync('scripts/attach-client-rail-production-v1.mjs','utf8');
          const server=fs.readFileSync('supabase/functions/rona-portal-api/client.ts','utf8');
          const index=fs.readFileSync('supabase/functions/rona-portal-api/index.ts','utf8');
          const cache=fs.readFileSync('scripts/emit-client-runtime-cache-policy.mjs','utf8');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          for(const token of [
            "window.__RONA_CLIENT_RAIL_CURRENT_CONTEXT__='20260903-client-contract-v1'",
            'RONA_CLIENT_CONTEXT','clientRailCurrentContext','CLIENT_CONTRACT_CONTEXT_REQUIRED','clientRailContextQuery',
            "'?clientId='","'&contractId='","'/portal/api/v1/client/rail'+query",
            'CLIENT_CONTEXT_CHANGED_DURING_RAIL_LOAD','AUTHORIZED_CLIENT_RAIL_READ_MODEL',
            'CLIENT_RAIL_READ_MODEL_UNAVAILABLE','ADMIN_CURRENT_V81_CANONICAL'
          ])assert(client.includes(token),`Client Rail parity contract missing ${token}`);
          for(const pattern of [/\bRONA-C\d{3,}\b/u,/\bDEAL-2026-\d{3,}\b/u,/UNIVERSAL\s+SOLYARIS/iu,/FARGONA/iu])assert(!pattern.test(client),`hardcoded Client Rail business entity ${pattern}`);

          for(const token of [
            'CLIENT_RAIL_CURRENT_ONLY=PASS',
            "visual_canon:'ADMIN_CURRENT_V81_CANONICAL'",
            "visual_contract:'ADMIN_CURRENT_ONLINE_RAIL_FULL_VISUAL_PARITY_CLIENT_SCOPE_V1'",
            "visual_source_mode:'ADMIN_OPERATIONAL_BODY_ADAPTER_ONLY'",
            "operational_body_canon:'/portal/rail-current-v81-maplibre-ui'",
            "client_data_source:'/portal/api/v1/client/rail'",
            "legacy_client_visual_owner:false","separate_movizor_visual_gate:false"
          ])assert(attach.includes(token),`Rail attach ownership contract missing ${token}`);
          assert(!attach.includes('client-rail-canonical-hero-v1.js'),'Client-only Rail visual owner still attached');

          for(const token of [
            'export async function clientRailReadModel',
            'client_user_has_contract_access','client_user_has_deal_access',
            'rail_xlsx_dislocation_current_position_v1','rail_deal_route_assignments_v1','rail_deal_route_progress_v1',
            'RONA_CLIENT_RAIL_DEAL_MAP_READ_MODEL_V1','AUTHORIZED_CLIENT_DEALS_PLUS_TRUSTED_RAIL_EVIDENCE_V1'
          ])assert(server.includes(token),`Client Rail server scope missing ${token}`);
          assert(index.includes('route==="/v1/client/rail"')&&index.includes('clientRailReadModel'),'Client Rail endpoint is not wired to authorized read model');

          for(const token of ["window.__RONA_RAIL_CURRENT_V81__='20260825-raster-first-v8.2'",'/portal/map-assets/osm/','mountRealRailMap','Интерактивная ЖД-карта','PRESERVE_LAST_GOOD_ON_DEGRADED_READ_MODEL'])assert(admin.includes(token),`Admin Rail operational body missing ${token}`);
          assert(cache.includes('/portal/client-rail-current-ui'),'Client Rail cache route missing');
          assert(!cache.includes('/assets/portal-runtime/client-rail-production-v1.js')&&!cache.includes('/assets/portal-runtime/client-rail-movizor-gate-v1.js'),'retired Client Rail cache owner remains');
          console.log('ONLINE_RAIL_CURRENT_OWNER_STATIC=PASS admin=V8_2 client=ADMIN_PARITY_V2 scope=AUTHORIZED_CLIENT_READ_MODEL');
          NODE

          npm run build

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { onRequest as clientRail } from './functions/portal/client-rail-current-ui.js';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const integrity=JSON.parse(fs.readFileSync('dist/canonical-visual-integrity.json','utf8'));
          const bridge=integrity?.client_runtime?.rail_client_admin_canonical;
          assert(bridge?.id==='rona-client-rail-admin-canonical-v1'&&bridge?.marker==='20260919-admin-parity-v2','Client Rail parity integrity record missing');
          assert(bridge.visual_canon==='ADMIN_CURRENT_V81_CANONICAL','Client Rail is not using Admin visual canon');
          assert(bridge.visual_contract==='ADMIN_CURRENT_ONLINE_RAIL_FULL_VISUAL_PARITY_CLIENT_SCOPE_V1','Client Rail visual parity contract changed');
          assert(bridge.visual_source_mode==='ADMIN_OPERATIONAL_BODY_ADAPTER_ONLY','Client Rail source mode changed');
          assert(bridge.operational_body_canon==='/portal/rail-current-v81-maplibre-ui','Client Rail Admin operational body changed');
          assert(bridge.client_data_source==='/portal/api/v1/client/rail'&&bridge.provider_state_source===null&&bridge.authoritative_refresh_ms===30000&&bridge.auto_refresh===true,'Client Rail server-source metadata missing');
          assert(bridge.legacy_client_visual_owner===false&&bridge.separate_movizor_visual_gate===false&&bridge.business_data_changed===false&&bridge.hardcoded_business_entities===false,'Client Rail isolation metadata invalid');

          const response=await clientRail({});
          assert(response.status===200,'Client Rail adapter endpoint '+response.status);
          const src=await response.text();
          for(const token of ["window.__RONA_CLIENT_RAIL_CURRENT_CONTEXT__='20260903-client-contract-v1'",'RONA_CLIENT_CONTEXT','CLIENT_CONTRACT_CONTEXT_REQUIRED','/portal/api/v1/client/rail','AUTHORIZED_CLIENT_RAIL_READ_MODEL','CLIENT_RAIL_ADMIN_PARITY_V1'])assert(src.includes(token),`built Client Rail marker missing ${token}`);
          for(const forbidden of ['/portal/owner-api','/admin/bootstrap',"location.pathname==='/portal/admin'",'rona-rail-ws','rona-movizor-blocker','client-rail-canonical-hero-v1.js'])assert(!src.includes(forbidden),`retired/divergent built Client Rail output remains ${forbidden}`);
          assert(response.headers.get('x-rona-client-rail-visual-canon')==='/portal/rail-current-v81-maplibre-ui','Admin operational-body header changed');
          assert(response.headers.get('x-rona-client-rail-data')==='authorized-read-model-v1','Client Rail authorized data header missing');
          console.log('ONLINE_RAIL_CURRENT_OWNER_BUILD=PASS admin=V8_2 client=ADMIN_PARITY_V2');
          NODE
      - name: Publish status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          desc='Online Rail current owner QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Online Rail current owner QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/rail-v5-owner\",\"description\":\"$desc\"}" >/dev/null
