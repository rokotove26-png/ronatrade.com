name: rail-current-owner-qa
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - portal-src/current/admin.html
      - assets/portal-admin-shell-fast-v1.js
      - functions/portal/admin.js
      - functions/portal/rail-current-v5-ui.js
      - functions/portal/rail-current-v6-ui.js
      - functions/portal/rail-current-v6-single-title-ui.js
      - functions/portal/rail-current-v7-real-map-ui.js
      - functions/portal/rail-current-v81-maplibre-ui.js
      - functions/portal/map-assets/**
      - .github/workflows/rail-v5-owner-qa.yml
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rail v8.2 raster-first map contract
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/admin.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check functions/portal/rail-current-v5-ui.js
          node --check functions/portal/rail-current-v6-ui.js
          node --check functions/portal/rail-current-v6-single-title-ui.js
          node --check functions/portal/rail-current-v7-real-map-ui.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          node --check 'functions/portal/map-assets/[[path]].js'
          grep -q 'id="page-monitoring"' portal-src/current/admin.html
          grep -q 'rail-current-v81-maplibre-ui' assets/portal-admin-shell-fast-v1.js
          grep -q '/portal/map-assets/osm/' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q '20260825-raster-first-v8.2' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'mountRealRailMap' functions/portal/rail-current-v7-real-map-ui.js
          grep -q 'rona-rail-v7-map-viewport' functions/portal/rail-current-v7-real-map-ui.js
          grep -q 'tile.openstreetmap.org' 'functions/portal/map-assets/[[path]].js'
          ! grep -q 'stopImmediatePropagation' functions/portal/rail-current-v5-ui.js
          grep -q 'rona:admin-pagechange' functions/portal/rail-current-v5-ui.js
          ! grep -q 'MutationObserver' functions/portal/rail-current-v5-ui.js
          grep -q 'rona-rail-v6-select' functions/portal/rail-current-v6-ui.js
          grep -q 'Номера вагонов' functions/portal/rail-current-v6-ui.js
          grep -q 'rona-rail-v4-hero{display:none' functions/portal/rail-current-v6-single-title-ui.js
          node --input-type=module <<'NODE'
          import { onRequest as rail } from './functions/portal/rail-current-v81-maplibre-ui.js';
          import { onRequest as assets } from './functions/portal/map-assets/[[path]].js';
          const response=await rail({});
          if(response.status!==200)throw new Error('rail-v8.2 endpoint '+response.status+' '+await response.text());
          const src=await response.text();
          const must=[
            "window.__RONA_RAIL_CURRENT_V81__='20260825-raster-first-v8.2'",
            '/portal/map-assets/osm/',
            'mountRealRailMap',
            'rona-rail-v7-map-viewport',
            'rona-rail-v7-controls',
            'Интерактивная ЖД-карта',
            "version:'v8.2'",
            'rona:admin-pagechange',
            'dedupeOnlineRail(host)'
          ];
          for(const marker of must)if(!src.includes(marker))throw new Error('missing runtime marker: '+marker);
          if(src.includes('stopImmediatePropagation'))throw new Error('Rail still competes with the canonical Admin router');
          if(src.includes("filters.append(filterBtn('Все ГУ-12'"))throw new Error('legacy GU button row remains');
          if(src.includes('c.innerHTML=mapSvg()'))throw new Error('fake SVG map is still mounted by active map panel');
          if(src.includes('https://tile.openstreetmap.org/'))throw new Error('browser still depends directly on OSM tile host');
          if(src.includes('new gl.Map(')||src.includes('tiles.openfreemap.org/styles/dark')||src.includes('/portal/map-assets/maplibre-gl.js'))throw new Error('MapLibre/OpenFreeMap remains in primary Rail runtime');
          if(src.includes('new MutationObserver')||src.includes('MutationObserver('))throw new Error('MutationObserver forbidden');
          if(response.headers.get('x-rona-rail-ui')!=='current-v8.2-raster-first')throw new Error('wrong rail header');
          const notFound=await assets({request:new Request('https://ronaoil.com/portal/map-assets/not-allowed')});
          if(notFound.status!==404)throw new Error('map-assets allowlist is not fail-closed');
          const badTile=await assets({request:new Request('https://ronaoil.com/portal/map-assets/osm/20/0/0.png')});
          if(badTile.status!==404)throw new Error('invalid OSM tile path is not fail-closed');
          console.log('RAIL_V82_GENERATED_RUNTIME=PASS',src.length);
          NODE
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; desc='Rail v8.2 raster-first map QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Rail v8.2 raster-first map QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/rail-v5-owner\",\"description\":\"$desc\"}" >/dev/null