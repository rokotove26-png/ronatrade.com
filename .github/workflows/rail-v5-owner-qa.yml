name: rail-current-owner-qa
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - package.json
      - portal-src/current/admin.html
      - assets/portal-admin-shell-fast-v1.js
      - assets/portal-runtime/client-rail-production-v1.js
      - scripts/attach-client-rail-production-v1.mjs
      - scripts/emit-client-runtime-cache-policy.mjs
      - functions/portal/_middleware.js
      - functions/portal/admin.js
      - functions/portal/rail-current-v5-ui.js
      - functions/portal/rail-current-v6-ui.js
      - functions/portal/rail-current-v6-single-title-ui.js
      - functions/portal/rail-current-v7-real-map-ui.js
      - functions/portal/rail-current-v81-maplibre-ui.js
      - functions/portal/map-assets/**
      - .github/workflows/rail-v5-owner-qa.yml
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Client Online Rail workspace and production map
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/admin.js
          node --check functions/portal/_middleware.js
          node --check assets/portal-admin-shell-fast-v1.js
          node --check assets/portal-runtime/client-rail-production-v1.js
          node --check scripts/attach-client-rail-production-v1.mjs
          node --check scripts/emit-client-runtime-cache-policy.mjs
          node --check functions/portal/rail-current-v5-ui.js
          node --check functions/portal/rail-current-v6-ui.js
          node --check functions/portal/rail-current-v6-single-title-ui.js
          node --check functions/portal/rail-current-v7-real-map-ui.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          node --check 'functions/portal/map-assets/[[path]].js'
          grep -q 'id="page-monitoring"' portal-src/current/admin.html
          grep -q 'rail-current-v81-maplibre-ui' assets/portal-admin-shell-fast-v1.js
          grep -q "__RONA_CLIENT_RAIL_PRODUCTION__='20260830-client-workspace-v3'" assets/portal-runtime/client-rail-production-v1.js
          grep -q "SHIPMENTS_API='/portal/api/v1/client/shipments'" assets/portal-runtime/client-rail-production-v1.js
          grep -q 'DATA_REFRESH_MS=30000' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'setInterval(scanTiles,5000)' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'setInterval(refresh,DATA_REFRESH_MS)' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'AUTHORITATIVE_SERVER_CLIENT_SHIPMENTS' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'external_positioning_used:false' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'TARIFF_MATRIX_TITLES' assets/portal-runtime/client-rail-production-v1.js
          grep -q "ronaClientRailTariffMatrix='REMOVED'" assets/portal-runtime/client-rail-production-v1.js
          grep -q 'rona-client-rail-workspace-v3' assets/portal-runtime/client-rail-production-v1.js
          grep -q '/portal/map-assets/osm/' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'tile.openstreetmap.org' assets/portal-runtime/client-rail-production-v1.js
          ! grep -qi 'MOVIZOR' assets/portal-runtime/client-rail-production-v1.js
          ! grep -q '/portal/api/v1/client/rail' assets/portal-runtime/client-rail-production-v1.js
          ! grep -q 'PROVIDER_GATE_API' assets/portal-runtime/client-rail-production-v1.js
          ! grep -q 'MutationObserver' assets/portal-runtime/client-rail-production-v1.js
          grep -q 'CLIENT_RAIL_PRODUCTION_BRIDGE=PASS' scripts/attach-client-rail-production-v1.mjs
          grep -q 'client-rail-production-v1.js?v=20260830-client-workspace-v3' scripts/attach-client-rail-production-v1.mjs
          grep -q "external_positioning:'NOT_USED'" scripts/attach-client-rail-production-v1.mjs
          grep -q "client_tariff_matrix:'REMOVED_BY_CURRENT_RUNTIME'" scripts/attach-client-rail-production-v1.mjs
          grep -q 'attach-client-rail-production-v1.mjs' package.json
          grep -q '/assets/portal-runtime/client-rail-production-v1.js' scripts/emit-client-runtime-cache-policy.mjs
          grep -q 'tile.openstreetmap.org' functions/portal/_middleware.js
          grep -q 'allowClientRailTileCsp(headers)' functions/portal/_middleware.js
          grep -q 'tile.openstreetmap.org' 'functions/portal/map-assets/[[path]].js'
          ! grep -q 'MutationObserver' functions/portal/rail-current-v5-ui.js
          grep -q 'rona-rail-v6-select' functions/portal/rail-current-v6-ui.js
          grep -q 'Номера вагонов' functions/portal/rail-current-v6-ui.js
          grep -q 'rona-rail-v4-hero{display:none' functions/portal/rail-current-v6-single-title-ui.js
          npm run build
          grep -q 'id="rona-client-rail-production-v1"' dist/portal/client.html
          grep -q '/assets/portal-runtime/client-rail-production-v1.js?v=20260830-client-workspace-v3' dist/portal/client.html
          grep -q '/assets/portal-runtime/client-rail-production-v1.js' dist/_headers
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { onRequest as rail } from './functions/portal/rail-current-v81-maplibre-ui.js';
          import { onRequest as assets } from './functions/portal/map-assets/[[path]].js';
          const integrity=JSON.parse(fs.readFileSync('dist/canonical-visual-integrity.json','utf8'));
          const bridge=integrity?.client_runtime?.rail_map_recovery;
          if(!bridge||bridge.id!=='rona-client-rail-production-v1'||bridge.recovery!=='DIRECT_PROXY_BIDIRECTIONAL_FALLBACK')throw new Error('Client Rail integrity record missing');
          if(bridge.source_contract!=='AUTHORITATIVE_SERVER_CLIENT_SHIPMENTS'||bridge.external_positioning!=='NOT_USED'||bridge.external_provider_request!==false)throw new Error('Client Rail external positioning boundary is wrong');
          if(bridge.authoritative_refresh_ms!==30000||bridge.movement_data_fail_closed!==true||bridge.client_tariff_matrix!=='REMOVED_BY_CURRENT_RUNTIME')throw new Error('Client Rail workspace contract missing');
          const runtime=fs.readFileSync('dist/assets/portal-runtime/client-rail-production-v1.js','utf8');
          if(/MOVIZOR|\/portal\/api\/v1\/client\/rail|PROVIDER_GATE_API/i.test(runtime))throw new Error('Client Rail still depends on external positioning');
          for(const marker of ['TARIFF_MATRIX_TITLES','rona-client-rail-workspace-v3','AUTHORITATIVE_SERVER_CLIENT_SHIPMENTS','external_positioning_used:false'])if(!runtime.includes(marker))throw new Error('missing Client Rail marker: '+marker);
          const response=await rail({});
          if(response.status!==200)throw new Error('rail-v8.2 endpoint '+response.status+' '+await response.text());
          const src=await response.text();
          for(const marker of [
            "window.__RONA_RAIL_CURRENT_V81__='20260825-raster-first-v8.2'",
            '/portal/map-assets/osm/',
            'mountRealRailMap',
            'rona-rail-v7-map-viewport',
            'rona-rail-v7-controls',
            'Интерактивная ЖД-карта',
            "version:'v8.2'",
            'waitAdminReady',
            'dedupeOnlineRail(host)'
          ])if(!src.includes(marker))throw new Error('missing current Rail marker: '+marker);
          if(src.includes("filters.append(filterBtn('Все ГУ-12'"))throw new Error('legacy GU button row remains');
          if(src.includes('c.innerHTML=mapSvg()'))throw new Error('fake SVG map is still mounted by active map panel');
          if(src.includes('new gl.Map(')||src.includes('tiles.openfreemap.org/styles/dark')||src.includes('/portal/map-assets/maplibre-gl.js'))throw new Error('MapLibre/OpenFreeMap remains in primary Rail runtime');
          if(src.includes('new MutationObserver')||src.includes('MutationObserver('))throw new Error('MutationObserver forbidden');
          if(response.headers.get('x-rona-rail-ui')!=='current-v8.2-raster-first')throw new Error('wrong rail header');
          const notFound=await assets({request:new Request('https://ronaoil.com/portal/map-assets/not-allowed')});
          if(notFound.status!==404)throw new Error('map-assets allowlist is not fail-closed');
          const badTile=await assets({request:new Request('https://ronaoil.com/portal/map-assets/osm/20/0/0.png')});
          if(badTile.status!==404)throw new Error('invalid OSM tile path is not fail-closed');
          console.log('CLIENT_ONLINE_RAIL_WORKSPACE_BUILD=PASS');
          NODE
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; desc='Client Online Rail workspace QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Client Online Rail workspace QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/rail-v5-owner\",\"description\":\"$desc\"}" >/dev/null
