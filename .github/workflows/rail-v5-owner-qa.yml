name: rail-current-owner-qa
on:
  pull_request:
    branches: [release/public-go-live-v1.1]
    paths:
      - functions/portal/admin.js
      - functions/portal/rail-current-v5-ui.js
      - functions/portal/rail-current-v6-ui.js
      - functions/portal/rail-current-v6-single-title-ui.js
      - functions/portal/rail-current-v7-real-map-ui.js
      - functions/portal/rail-current-v81-maplibre-ui.js
      - .github/workflows/rail-v5-owner-qa.yml
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rail v8.1 MapLibre/OpenFreeMap visual contract
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/portal/admin.js
          node --check functions/portal/rail-current-v5-ui.js
          node --check functions/portal/rail-current-v6-ui.js
          node --check functions/portal/rail-current-v6-single-title-ui.js
          node --check functions/portal/rail-current-v7-real-map-ui.js
          node --check functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'rail-current-v81-maplibre-ui' functions/portal/admin.js
          grep -q 'current-v8.1-maplibre-openfreemap' functions/portal/admin.js
          grep -q 'maplibre-gl@5.16.0' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'tiles.openfreemap.org/styles/dark' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'rona-v81-rail' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'source-layer.*transportation' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'rona-v81-wagons' functions/portal/rail-current-v81-maplibre-ui.js
          grep -q 'stopImmediatePropagation' functions/portal/rail-current-v5-ui.js
          ! grep -q 'MutationObserver' functions/portal/rail-current-v5-ui.js
          grep -q 'rona-rail-v6-select' functions/portal/rail-current-v6-ui.js
          grep -q 'Номера вагонов' functions/portal/rail-current-v6-ui.js
          grep -q 'rona-rail-v4-hero{display:none' functions/portal/rail-current-v6-single-title-ui.js
          node --input-type=module <<'NODE'
          import { onRequest } from './functions/portal/rail-current-v81-maplibre-ui.js';
          const response=await onRequest({});
          if(response.status!==200)throw new Error('rail-v8.1 endpoint '+response.status+' '+await response.text());
          const src=await response.text();
          const must=[
            "window.__RONA_RAIL_CURRENT_V81__='20260824-1338-v8.1'",
            'maplibre-gl@5.16.0/dist/maplibre-gl.js',
            'tiles.openfreemap.org/styles/dark',
            'rona-v81-rail-glow',
            'rona-v81-rail',
            "'source-layer':'transportation'",
            'rona-v81-wagon-halo',
            'rona-v81-wagons',
            'Интерактивная ЖД-карта',
            'OpenFreeMap · OpenMapTiles · OpenStreetMap',
            "version:'v8.1'",
            'stopImmediatePropagation',
            'dedupeOnlineRail(host)'
          ];
          for(const marker of must)if(!src.includes(marker))throw new Error('missing runtime marker: '+marker);
          if(src.includes("filters.append(filterBtn('Все ГУ-12'"))throw new Error('legacy GU button row remains');
          if(src.includes('c.innerHTML=mapSvg()'))throw new Error('fake SVG map is still mounted by active map panel');
          if(src.includes('new MutationObserver')||src.includes('MutationObserver('))throw new Error('MutationObserver forbidden');
          if(response.headers.get('x-rona-rail-ui')!=='current-v8.1-maplibre-openfreemap')throw new Error('wrong rail header');
          console.log('RAIL_V81_GENERATED_RUNTIME=PASS',src.length);
          NODE
          curl -fsS --retry 3 --retry-delay 2 https://tiles.openfreemap.org/styles/dark -o /tmp/openfreemap-dark.json
          grep -q '"sources"' /tmp/openfreemap-dark.json
          grep -q 'openmaptiles' /tmp/openfreemap-dark.json
          curl -fsS --retry 3 --retry-delay 2 https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js -o /tmp/maplibre.js
          test -s /tmp/maplibre.js
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; desc='Rail v8.1 MapLibre/OpenFreeMap QA failed'
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Rail v8.1 MapLibre/OpenFreeMap QA passed'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"rona/rail-v5-owner\",\"description\":\"$desc\"}" >/dev/null
