name: client-nav-source-patch

on:
  push:
    branches:
      - release/public-go-live-v1.1
    paths:
      - .github/workflows/client-nav-source-patch.yml

permissions:
  contents: write

jobs:
  patch-canonical-client-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/public-go-live-v1.1
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch canonical Client source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile, rm } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { brotliCompressSync, brotliDecompressSync, constants } from 'node:zlib';

          const OLD_SHA='ef5800aed51146136cdf4e90ad1c3a874d1d08be2b46c63af9ea1b94eef565fb';
          const OLD_BYTES=487355;
          const dir='portal-src/current/client';
          const chunks=Array.from({length:10},(_,i)=>`payload.${String(i).padStart(2,'0')}`);
          const sha=b=>createHash('sha256').update(b).digest('hex');

          const encoded=(await Promise.all(chunks.map(n=>readFile(`${dir}/${n}`,'utf8')))).join('');
          let bytes=brotliDecompressSync(Buffer.from(encoded,'base64'));
          if(bytes.length!==OLD_BYTES) throw new Error(`Unexpected Client bytes: ${bytes.length}`);
          if(sha(bytes)!==OLD_SHA) throw new Error(`Unexpected Client SHA: ${sha(bytes)}`);
          let text=bytes.toString('utf8');

          const navButton='<button data-page="documents" id="navDocuments" type="button"><span aria-hidden="true" class="nav-icon">▧</span><span class="nav-label">ДС и Инвойсы</span><span class="badge" hidden="" id="docsBadge">0</span></button>';
          const navCount=text.split(navButton).length-1;
          if(navCount!==1) throw new Error(`Expected one obsolete nav button, found ${navCount}`);
          text=text.replace(navButton,'');

          const pageStart='<section class="page" id="page-documents">';
          const paymentsStart='<section class="page" id="page-payments">';
          const s=text.indexOf(pageStart);
          const e=text.indexOf(paymentsStart,s);
          if(s<0||e<=s) throw new Error('Standalone documents page sentinels not found');
          if(text.indexOf(pageStart,s+1)!==-1) throw new Error('Multiple standalone documents pages found');
          const removedPage=text.slice(s,e);
          if(!removedPage.includes('<h1>ДС и Инвойсы</h1>')) throw new Error('Unexpected documents page content');
          text=text.slice(0,s)+text.slice(e);

          if(text.includes('id="navDocuments"')) throw new Error('navDocuments still present');
          if(text.includes('id="page-documents"')) throw new Error('page-documents still present');
          if(!text.includes('data-page="deals"')) throw new Error('Deals nav missing after patch');
          if(!text.includes('id="page-deals"')) throw new Error('Deals page missing after patch');
          if(!text.includes('id="page-payments"')) throw new Error('Payments page missing after patch');

          bytes=Buffer.from(text,'utf8');
          const newSha=sha(bytes);
          const newBytes=bytes.length;
          const compressed=brotliCompressSync(bytes,{params:{[constants.BROTLI_PARAM_QUALITY]:11}});
          const nextEncoded=compressed.toString('base64');
          if(nextEncoded.length>100000) throw new Error(`Encoded Client exceeds 10 chunks: ${nextEncoded.length}`);
          const chunkSize=10000;
          for(let i=0;i<10;i++){
            const part=nextEncoded.slice(i*chunkSize,(i+1)*chunkSize);
            if(!part) throw new Error(`Empty payload chunk ${i}`);
            await writeFile(`${dir}/${chunks[i]}`,part,'utf8');
          }
          if(chunks.map((_,i)=>nextEncoded.slice(i*chunkSize,(i+1)*chunkSize)).join('')!==nextEncoded) throw new Error('Chunk split mismatch');

          const manifestPath=`${dir}/manifest.json`;
          const manifest=JSON.parse(await readFile(manifestPath,'utf8'));
          manifest.sha256=newSha;
          manifest.decoded_bytes=newBytes;
          manifest.visual_transform='NONE';
          manifest.legacy_runtime=false;
          manifest.standalone_documents_section=false;
          manifest.deal_documents_workpoint='deals';
          await writeFile(manifestPath,JSON.stringify(manifest,null,2)+'\n','utf8');

          const buildPath='scripts/build-pages-direct-canonical.mjs';
          let build=await readFile(buildPath,'utf8');
          if(!build.includes(`sha256: '${OLD_SHA}'`)) throw new Error('Old Client SHA not found in build script');
          if(!build.includes(`bytes: ${OLD_BYTES}`)) throw new Error('Old Client bytes not found in build script');
          build=build.replace(`sha256: '${OLD_SHA}'`,`sha256: '${newSha}'`).replace(`bytes: ${OLD_BYTES}`,`bytes: ${newBytes}`);
          const emittedNeedle="requireExact('Emitted current client',emittedClient,CLIENT_CURRENT.sha256);";
          if(!build.includes(emittedNeedle)) throw new Error('Client emitted verification anchor missing');
          build=build.replace(emittedNeedle,`${emittedNeedle}\nconst emittedClientText=emittedClient.toString('utf8');\nfor(const marker of ['id="navDocuments"','id="page-documents"']) if(emittedClientText.includes(marker)) throw new Error(\`DEPLOYED_CLIENT_OBSOLETE_DOCUMENTS_UI_PRESENT: \${marker}\`);\nfor(const marker of ['data-page="deals"','id="page-deals"','id="page-payments"']) if(!emittedClientText.includes(marker)) throw new Error(\`DEPLOYED_CLIENT_REQUIRED_UI_MISSING: \${marker}\`);`);
          await writeFile(buildPath,build,'utf8');

          const qaPath='.github/workflows/client-current-canonical-build-qa.yml';
          let qa=await readFile(qaPath,'utf8');
          if(!qa.includes(OLD_SHA)||!qa.includes(String(OLD_BYTES))) throw new Error('Old Client QA expectations missing');
          qa=qa.replaceAll(OLD_SHA,newSha).replaceAll(String(OLD_BYTES),String(newBytes));
          const hashCheck=`          printf '%s  %s\\n' "${newSha}" "dist/portal/client.html" | sha256sum -c -`;
          if(!qa.includes(hashCheck)) throw new Error('Updated hash check anchor missing');
          qa=qa.replace(hashCheck,`${hashCheck}\n          ! grep -Fq 'id="navDocuments"' dist/portal/client.html\n          ! grep -Fq 'id="page-documents"' dist/portal/client.html\n          grep -Fq 'data-page="deals"' dist/portal/client.html\n          grep -Fq 'id="page-deals"' dist/portal/client.html`);
          await writeFile(qaPath,qa,'utf8');

          const middlewarePath='functions/portal/_middleware.js';
          let middleware=await readFile(middlewarePath,'utf8');
          const guardLine=middleware.split('\n').find(line=>line.startsWith('const CLIENT_OBSOLETE_DS_INVOICE_GUARD = '));
          if(!guardLine) throw new Error('Obsolete runtime guard definition not found');
          middleware=middleware.replace(guardLine+'\n','');
          middleware=middleware.replace('${CLIENT_CANONICAL_PREPAINT}${CLIENT_OBSOLETE_DS_INVOICE_GUARD}','${CLIENT_CANONICAL_PREPAINT}');
          middleware=middleware.replace('role-v3-contract-authoritative-deal-v5-canonical-compact-v2-no-standalone-ds-invoices-v2-price-bounded','role-v3-contract-authoritative-deal-v5-canonical-compact-v2-source-no-standalone-documents-price-bounded');
          const oldFallback=`  if(source.includes('rona-client-obsolete-ds-invoice-guard-v2'))return new Response(source,{status:response.status,statusText:response.statusText,headers});\n  const runtime=source.includes('rona-client-deal-documents-v5-loader')?CLIENT_OBSOLETE_DS_INVOICE_GUARD+CLIENT_DEAL_CANONICAL_VISUAL_RUNTIME:CLIENT_ADMIN_SYNC_RUNTIME;\n  const html=source.replace('</head>',runtime+'</head>');`;
          const newFallback=`  if(source.includes('rona-client-deal-documents-v5-loader'))return new Response(source,{status:response.status,statusText:response.statusText,headers});\n  const html=source.replace('</head>',CLIENT_ADMIN_SYNC_RUNTIME+'</head>');`;
          if(!middleware.includes(oldFallback)) throw new Error('Obsolete middleware fallback block not found');
          middleware=middleware.replace(oldFallback,newFallback);
          if(middleware.includes('CLIENT_OBSOLETE_DS_INVOICE_GUARD')||middleware.includes('rona-client-obsolete-ds-invoice-guard')) throw new Error('Obsolete runtime guard still referenced');
          await writeFile(middlewarePath,middleware,'utf8');

          await rm('.github/workflows/client-nav-source-inspect.yml',{force:true});
          await rm('.github/workflows/client-nav-source-patch.yml',{force:true});

          console.log(`CLIENT_SOURCE_PATCHED SHA=${newSha} BYTES=${newBytes} REMOVED_PAGE_BYTES=${Buffer.byteLength(removedPage,'utf8')}`);
          NODE

          node --check functions/portal/_middleware.js
          npm run build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal-src/current/client scripts/build-pages-direct-canonical.mjs .github/workflows/client-current-canonical-build-qa.yml functions/portal/_middleware.js .github/workflows/client-nav-source-inspect.yml .github/workflows/client-nav-source-patch.yml
          git diff --cached --check
          git commit -m 'fix(client): remove standalone documents section from canonical source'
          git push origin HEAD:release/public-go-live-v1.1
