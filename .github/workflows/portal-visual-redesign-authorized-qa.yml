name: Portal visual redesign authorized QA

on:
  push:
    branches:
      - 'hotfix/admin-interactivity-visual-redesign-*'

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  visual-authorized-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify visual source and canonical locks
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Admin_Portal_v3_4_13_BOOT_ERROR_LATCH_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '9694331f724efcd811207cfa433fea554a8ba6ca30b40a8299c1ef15fe4ce4ea'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Agent_Portal_v0_4_3_EDITOR_SECURITY_STATUS_TYPOGRAPHY_FINAL_CANDIDATE_20260812.html' | awk '{print $1}')" = '4fc9de4e561c4e55cbba9507b5eb1122f77d1efa990bef2fb6a957b2b135484c'
          test "$(sha256sum 'portal-src/canonical/RONA_Trade_Client_Portal_v1_5_14_SIGNED_CONTRACT_AUTHORITY_FINAL_FIX_CANDIDATE_20260812.html' | awk '{print $1}')" = '961a834f6c29c9479531b8363cb6cdb230acfd4ca1817eba17702fa1b1a21b31'
          test "$(sha256sum 'portal-src/canonical/canonical_logo.svg' | awk '{print $1}')" = '755f13d3ba5c7b08a2538b72d3bcb8e0a6d5bb9b24ffde57cda7eca27762ac65'
          node --check functions/portal/owner-acceptance-ui.js
          for f in functions/portal/owner-ui-chunks/*.js; do node --check "$f"; done
          node --input-type=module <<'NODE'
          import c0 from './functions/portal/owner-ui-chunks/chunk0.js';
          import c1 from './functions/portal/owner-ui-chunks/chunk1.js';
          import c2 from './functions/portal/owner-ui-chunks/chunk2.js';
          import c3 from './functions/portal/owner-ui-chunks/chunk3.js';
          import c4 from './functions/portal/owner-ui-chunks/chunk4.js';
          import c5 from './functions/portal/owner-ui-chunks/chunk5.js';
          import c6 from './functions/portal/owner-ui-chunks/chunk6.js';
          import c7 from './functions/portal/owner-ui-chunks/chunk7.js';
          import c8 from './functions/portal/owner-ui-chunks/chunk8.js';
          import {writeFileSync} from 'node:fs';
          writeFileSync('/tmp/owner-ui-runtime.js',[c0,c1,c2,c3,c4,c5,c6,c7,c8].join(''));
          NODE
          node --check /tmp/owner-ui-runtime.js
          grep -q 'rona-visual-v2' /tmp/owner-ui-runtime.js
          grep -q 'Клиенты и агенты' /tmp/owner-ui-runtime.js
          grep -q 'Назначение агента' /tmp/owner-ui-runtime.js
          grep -q 'Рабочее пространство клиента' /tmp/owner-ui-runtime.js
          grep -q 'Рабочее пространство агента' /tmp/owner-ui-runtime.js
          echo 'VISUAL_SOURCE_GATE=PASS'

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; else exit 1; fi

      - name: Resolve Cloudflare preview
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let i=0;i<180;i++){
              const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-VISUAL-AUTH-QA'}});
              if(r.ok){
                const j=await r.json();
                const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');
                if(cf?.status==='completed'){
                  if(cf.conclusion!=='success')throw new Error('Cloudflare Pages '+cf.conclusion);
                  await sleep(4000);
                  const text=[cf.output?.summary,cf.output?.text,cf.details_url].filter(Boolean).join(' ');
                  const urls=[...text.matchAll(/https:\/\/[a-z0-9.-]+\.pages\.dev/ig)].map(x=>x[0]);
                  const origin=urls.find(x=>!/rona-trade-public\.pages\.dev$/i.test(x))||urls[0];
                  if(!origin)throw new Error('Cloudflare preview URL not found');
                  fs.appendFileSync(process.env.GITHUB_OUTPUT,`origin=${origin}\n`);
                  return;
                }
              }
              await sleep(3000);
            }
            throw new Error('Cloudflare preview timeout');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Full visual browser QA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const origin=process.env.TARGET_ORIGIN,repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,ref=process.env.GITHUB_REF,runId=process.env.GITHUB_RUN_ID,attempt=process.env.GITHUB_RUN_ATTEMPT||'1',gh=process.env.GH_TOKEN;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          fs.mkdirSync('/tmp/visual-qa',{recursive:true});
          async function broker(){let last={};for(let i=0;i<8;i++){const r=await fetch('https://sxawrwzeobaqwwmlkzws.supabase.co/functions/v1/rona-ci-admin-session-broker',{method:'POST',headers:{authorization:`Bearer ${gh}`,'x-github-repository':repo,'x-github-sha':sha,'x-github-ref':ref,'x-github-run-id':runId}});const j=await r.json().catch(()=>({}));last={status:r.status,code:j.code};if(r.ok&&j.ok&&j.session?.access_token&&j.session?.refresh_token)return j.session;await sleep(1500*(i+1))}throw new Error('controlled session '+JSON.stringify(last))}
          async function waitFlag(page,name,tries=450){for(let i=0;i<tries;i++){if(await page.evaluate(n=>window[n]===true,name))return;await page.waitForTimeout(100)}throw new Error(name+' timeout '+String(await page.evaluate(()=>window.__RONA_OWNER_ADMIN_ERROR__||window.__RONA_OWNER_CLIENT_ERROR__||window.__RONA_OWNER_AGENT_ERROR__||'')))}
          async function adminPost(ctx,path,data){const r=await ctx.request.post(origin+path,{headers:{origin,referer:origin+'/portal/admin','content-type':'application/json'},data});const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}assert(r.ok()&&j?.ok===true,path+' '+r.status()+' '+text.slice(0,300));return j}
          async function cookieContext(browser,session,viewport){const hostname=new URL(origin).hostname,ctx=await browser.newContext({viewport,javaScriptEnabled:true});await ctx.addCookies([{name:'rona_portal_at',value:session.access_token,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'},{name:'rona_portal_rt',value:session.refresh_token,domain:hostname,path:'/portal',secure:true,httpOnly:true,sameSite:'Lax'}]);return ctx}
          async function visual(page,kind){await waitFlag(page,'__RONA_OWNER_ACCEPTANCE_UI_READY__');await waitFlag(page,'__RONA_VISUAL_V2__');assert(await page.evaluate(()=>document.documentElement.classList.contains('rona-visual-v2')),kind+' root class');assert(await page.locator('#ronaVisualV2Style').count()===1,kind+' style');assert(await page.locator('.rona-visual-hero').count()>=1,kind+' hero')}
          (async()=>{
            const session=await broker();
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const ctx=await cookieContext(browser,session,{width:1920,height:1080});
            const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));page.on('console',m=>{if(m.type()==='error'&&!/cloudflareinsights/i.test(m.text()))errors.push('console:'+m.text())});
            let qaUserId=null,clientCtx=null;
            try{
              await page.goto(origin+'/portal/admin?_visual='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname==='/portal/admin','Admin route');await waitFlag(page,'__RONA_OWNER_ADMIN_READY__');await visual(page,'Admin');
              for(const id of ['home','prices','applications','deals','documents','payments','accounting','monitoring','messages','analytics','market-news']){await page.locator(`#nav button[data-page="${id}"]`).click();await page.waitForTimeout(120);assert(await page.locator(`#page-${id} .rona-visual-hero`).count()>=1,'hero '+id)}
              await page.locator('#nav button[data-page="access"]').click();await page.waitForTimeout(160);assert((await page.locator('#nav button[data-page="access"]').innerText()).includes('Клиенты и агенты'),'access label');assert(await page.locator('#page-access>.rona-visual-hero').count()===1,'access hero');assert(await page.getByText('Назначение агента',{exact:true}).count()>=1,'agent assignment label');
              await page.locator('#nav button[data-page="claims"]').click();await page.waitForTimeout(160);assert(await page.locator('#page-claims>.rona-visual-hero').count()===1,'claims hero');await page.screenshot({path:'/tmp/visual-qa/admin-desktop.png',fullPage:true});

              const mobileCtx=await cookieContext(browser,session,{width:390,height:844}),mobile=await mobileCtx.newPage();await mobile.goto(origin+'/portal/admin?_mobile='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await waitFlag(mobile,'__RONA_OWNER_ADMIN_READY__');await visual(mobile,'Admin mobile');const mobOverflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);assert(mobOverflow<=4,'mobile overflow '+mobOverflow);await mobile.screenshot({path:'/tmp/visual-qa/admin-mobile.png',fullPage:true});await mobileCtx.close();

              const qaEmail=`qa-visual-client-${runId}-${attempt}@example.invalid`,qaPassword=`Qa!${runId}${attempt}Visual9#`;const created=await adminPost(ctx,'/portal/admin-authority/access/users',{role:'Клиент',name:'QA VISUAL CLIENT',login:qaEmail,email:qaEmail,initialPassword:qaPassword,bindingRole:'Уполномоченный представитель',contractIds:['RONA-C002-CTR-2026-001'],openWithoutContract:false});qaUserId=created.userId||created.data?.userId||null;assert(qaUserId,'QA Client id');
              clientCtx=await browser.newContext({viewport:{width:1920,height:1080},javaScriptEnabled:true});const client=await clientCtx.newPage(),clientErrors=[];client.on('pageerror',e=>clientErrors.push(String(e.message||e)));client.on('console',m=>{if(m.type()==='error'&&!/cloudflareinsights/i.test(m.text()))clientErrors.push('console:'+m.text())});await client.goto(origin+'/portal/login?next=%2Fportal%2Fclient',{waitUntil:'domcontentloaded',timeout:30000});await client.locator('input[name="email"]').fill(qaEmail);await client.locator('input[name="password"]').fill(qaPassword);await client.locator('button[type="submit"]').click();await client.waitForURL(u=>new URL(u).origin===origin&&new URL(u).pathname==='/portal/client',{timeout:15000});await waitFlag(client,'__RONA_OWNER_CLIENT_READY__');await visual(client,'Client');assert(await client.getByText('Рабочее пространство клиента',{exact:true}).count()===1,'Client title');assert(await client.getByText('Договоры',{exact:true}).count()>=1,'Client contracts');await client.screenshot({path:'/tmp/visual-qa/client-desktop.png',fullPage:true});assert(clientErrors.length===0,'Client errors '+JSON.stringify(clientErrors.slice(0,5)));await clientCtx.close();clientCtx=null;

              await page.goto(origin+'/portal/agent?_visual='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});assert(new URL(page.url()).pathname==='/portal/agent','Agent route');await waitFlag(page,'__RONA_OWNER_AGENT_READY__');await visual(page,'Agent');assert(await page.getByText('Рабочее пространство агента',{exact:true}).count()===1,'Agent title');assert(await page.getByText('Скачать PDF прайс-лист',{exact:true}).count()>=1,'Agent PDF');await page.screenshot({path:'/tmp/visual-qa/agent-desktop.png',fullPage:true});assert(errors.length===0,'Browser errors '+JSON.stringify(errors.slice(0,8)));console.log(JSON.stringify({ok:true,origin,admin:true,client:true,agent:true,mobile:true}));
            }finally{if(clientCtx)await clientCtx.close().catch(()=>{});if(qaUserId)await adminPost(ctx,`/portal/admin-authority/access/users/${qaUserId}/block`,{}).catch(()=>{});await ctx.close().catch(()=>{});await browser.close().catch(()=>{})}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-visual-authorized-${{ github.run_id }}
          path: /tmp/visual-qa
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish visual result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORIGIN: ${{ steps.target.outputs.origin }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,token=process.env.GH_TOKEN,state=process.env.JOB_STATUS==='success'?'success':'failure';
          const target=state==='success'?process.env.TARGET_ORIGIN+'/portal/admin':`https://github.com/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28','user-agent':'RONA-VISUAL-AUTH-QA'},body:JSON.stringify({state,context:'portal-visual-authorized-qa',description:state==='success'?'Admin Client Agent visual QA PASS':'Visual QA FAIL',target_url:target})}).then(async r=>{if(!r.ok)throw new Error(await r.text());console.log('VISUAL_AUTH_STATUS='+state)}).catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
