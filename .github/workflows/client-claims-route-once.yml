name: Client claims route once

on:
  push:
    branches:
      - fix/client-context-universal-modules-v1

permissions:
  contents: write

jobs:
  claims-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire client claims route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/rona-portal-api/index.ts')
          s=p.read_text()
          import_marker='import { clientBootstrap, clientShipments } from "./client.ts";'
          import_line='import { clientClaims } from "./client-claims.ts";'
          if import_line not in s:
              if s.count(import_marker)!=1:
                  raise SystemExit(f'expected one client import marker, got {s.count(import_marker)}')
              s=s.replace(import_marker,import_marker+'\n'+import_line,1)
          route_marker='if(["/v1/client/deals","/v1/client/documents","/v1/client/payments"].includes(route)&&req.method==="GET")'
          claims_route='if(route==="/v1/client/claims"&&req.method==="GET"){if(!c.roles.includes("CLIENT"))return send(origin,403,{ok:false,code:"ROLE_MISMATCH"});const clientId=url.searchParams.get("clientId"),contractId=url.searchParams.get("contractId");if(!clientId||!contractId)return send(origin,400,{ok:false,code:"CLIENT_CONTRACT_CONTEXT_REQUIRED"});const claims=await clientClaims(c,clientId,contractId);return claims===null?send(origin,404,{ok:false,code:"CONTEXT_NOT_FOUND"}):send(origin,200,{ok:true,claims})}'
          if claims_route not in s:
              if s.count(route_marker)!=1:
                  raise SystemExit(f'expected one client module route marker, got {s.count(route_marker)}')
              s=s.replace(route_marker,claims_route+route_marker,1)
          p.write_text(s)
          PY
      - name: Run claims and context regression checks
        run: |
          node scripts/qa-client-claims-context-scope-v1.mjs
          node scripts/qa-client-backend-context-scope-v1.mjs
          node tests/client-context-universal-modules-v1.test.mjs
      - name: Commit claims route and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/client-claims-route-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/rona-portal-api/index.ts .github/workflows/client-claims-route-once.yml
          git commit -m 'feat(client): expose context-scoped claims route'
          git push origin HEAD:${GITHUB_REF_NAME}
