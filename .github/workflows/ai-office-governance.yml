name: AI Office Governance QA

on:
  pull_request:
    paths:
      - 'supabase/migrations/*ai_office_governance*'
      - 'supabase/migrations/*ai_office_exception_reconciliation*'
      - 'supabase/migrations/*admin_private_rls*'
      - 'tests/ai-office-governance/**'
      - '.github/workflows/ai-office-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AI Office governance, exception and Admin RLS tests
        run: node --test tests/ai-office-governance/*.test.mjs
