name: Issue430 owner retest navigation race once
on:
  push:
    branches: [corrective/issue430-resource-authority-company-race-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrective/issue430-resource-authority-company-race-v1
          fetch-depth: 0
      - name: Harden QA projection read across transient navigation only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          qa=Path('scripts/qa-client-owner-retest-authoritative-company-metrics-v5.mjs')
          s=qa.read_text()
          anchor="function replaceTextOnce(from,to,label){\n  const first=source.indexOf(from),last=source.lastIndexOf(from);\n  if(first<0||first!==last)throw new Error(`${label}: expected exactly one source match`);\n  source=source.replace(from,to);\n}\n"
          lines=[
            '',
            'replaceRegexOnce(',
            r'  /^async function ensureProjection\(page,e\)\{.*\}$/m,',
            '  "async function ensureProjection(page,e,timeout=9000){const end=Date.now()+timeout;let last={ok:false,reason:\'PROJECTION_NOT_READY\'};while(Date.now()<end){const apiReady=await wait(page,()=>!!window.RONA_CLIENT_CONTEXT?.whenCurrentProjection&&!!window.RONA_CLIENT_CONTEXT?.getCurrentContext,null,1000);if(!apiReady){await page.waitForTimeout(80).catch(()=>{});continue}try{const snap=await page.evaluate(async e=>{const out={ok:false,client_id:e.client_id,contract_id:e.contract_id};try{const current=window.RONA_CLIENT_CONTEXT.getCurrentContext?.();out.selected=current?{client_id:String(current.client_id||\'\'),contract_id:String(current.contract_id||\'\')}:null;if(!current||current.client_id!==e.client_id||current.contract_id!==e.contract_id){out.reason=\'SELECTED_CONTEXT_MISMATCH\';return out}const data=await window.RONA_CLIENT_CONTEXT.whenCurrentProjection(\'owner-retest-adapter-readiness\');const projection=window.RONA_CLIENT_CONTEXT.getCurrentProjection?.()||data||null;out.projection=projection?{projection_contract:String(projection.projection_contract||\'\'),client_id:String(projection.contract?.client_id||projection.client_id||\'\'),contract_id:String(projection.contract?.contract_id||projection.contract_id||\'\'),deals:Array.isArray(projection.deals)?projection.deals.length:null,applications:Array.isArray(projection.applications)?projection.applications.length:null}:null;out.ok=!!projection&&out.projection.client_id===e.client_id&&out.projection.contract_id===e.contract_id;if(!out.ok)out.reason=\'PROJECTION_SCOPE_MISMATCH\';return out}catch(error){out.reason=\'WHEN_CURRENT_PROJECTION_ERROR\';out.error=String(error?.stack||error);const current=window.RONA_CLIENT_CONTEXT?.getCurrentContext?.();out.current=current?{client_id:String(current.client_id||\'\'),contract_id:String(current.contract_id||\'\')}:null;return out}},e);last=snap;if(snap.ok)return snap}catch(error){const message=String(error?.message||error);if(!/Execution context was destroyed|Cannot find context with specified id|frame was detached|most likely because of a navigation/i.test(message))throw error;last={ok:false,reason:\'TRANSIENT_NAVIGATION\',error:message};await page.waitForLoadState(\'domcontentloaded\',{timeout:1000}).catch(()=>{})}await page.waitForTimeout(100).catch(()=>{})}return last}",',
            "  'SYSTEM_ADMIN_SCOPE_TRANSIENT_NAVIGATION_RETRY'",
            ');',
            ''
          ]
          insertion='\n'.join(lines)
          if s.count(anchor)!=1: raise SystemExit(f'anchor count={s.count(anchor)}')
          s=s.replace(anchor,anchor+insertion)
          qa.write_text(s)
          blob=subprocess.check_output(['git','hash-object',str(qa)],text=True).strip()
          g=Path('governance/client-multiclient-parity-issue430-owner-approval-20260906.json')
          data=json.loads(g.read_text())
          data['pr431_direct_fix']['exact_post_blobs']['scripts/qa-client-owner-retest-authoritative-company-metrics-v5.mjs']['authorized_post_blob_sha']=blob
          g.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('QA_BLOB='+blob)
          PY
          node --check scripts/qa-client-owner-retest-authoritative-company-metrics-v5.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/qa-client-owner-retest-authoritative-company-metrics-v5.mjs governance/client-multiclient-parity-issue430-owner-approval-20260906.json
          git commit -m 'test(client): tolerate transient navigation in owner projection probe'
          git push origin HEAD:corrective/issue430-resource-authority-company-race-v1
