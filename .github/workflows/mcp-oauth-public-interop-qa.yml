name: MCP OAuth Public Interop QA

on:
  push:
    branches:
      - release/public-go-live-v1.1
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  public-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for this commit in Cloudflare production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA,gh=process.env.GH_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let i=0;i<180;i++){
            const r=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs?per_page=100`,{headers:{authorization:`Bearer ${gh}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'RONA-OAUTH-INTEROP'}});
            if(r.ok){const j=await r.json();const cf=(j.check_runs||[]).find(x=>x.name==='Cloudflare Pages');if(cf?.status==='completed'){if(cf.conclusion!=='success')throw new Error('Cloudflare deployment '+cf.conclusion);console.log('RONA_OAUTH_PRODUCTION_SHA='+sha);await sleep(5000);return}}
            await sleep(3000);
          }throw new Error('Cloudflare deployment timeout')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Verify RFC discovery, no-auth challenge, and CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ronaoil.com'
          ORIGIN='https://chatgpt.com'
          retryable() { case "$1" in 500|502|503|504) return 0;; *) return 1;; esac; }
          get200() {
            local url="$1" out="$2" code='000'
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o "$out" -w '%{http_code}' "$url" || printf '000')
              [ "$code" = '200' ] && break
              retryable "$code" || break
              sleep "$attempt"
            done
            test "$code" = '200'
          }
          post401() {
            local url="$1" headers="$2" body="$3" code='000'
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' -X POST "$url" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || printf '000')
              [ "$code" = '401' ] && break
              retryable "$code" || break
              sleep "$attempt"
            done
            test "$code" = '401'
          }
          options204() {
            local target="$1" headers="$2" code='000'
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS "$target" -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,mcp-protocol-version' || printf '000')
              [ "$code" = '204' ] && break
              retryable "$code" || break
              sleep "$attempt"
            done
            test "$code" = '204'
          }
          segments=(operations finance legal market-analyst rail-logistics system-admin)
          for segment in "${segments[@]}"; do
            echo "RONA_OAUTH_INTEROP_SEGMENT=$segment"
            prm="$BASE/.well-known/oauth-protected-resource/$segment/mcp"
            asm="$BASE/.well-known/oauth-authorization-server/$segment"
            resource="$BASE/$segment/mcp"
            issuer="$BASE/$segment"

            get200 "$prm" /tmp/prm.json
            jq -e --arg resource "$resource" --arg issuer "$issuer" '
              .resource == $resource and
              .authorization_servers[0] == $issuer and
              (.scopes_supported | index("mcp:read")) != null and
              (.scopes_supported | index("mcp:coordinate")) == null and
              (.scopes_supported | index("offline_access")) != null and
              (.bearer_methods_supported | index("header")) != null
            ' /tmp/prm.json >/dev/null

            get200 "$asm" /tmp/asm.json
            jq -e --arg issuer "$issuer" '
              .issuer == $issuer and
              .authorization_endpoint == ($issuer + "/authorize") and
              .token_endpoint == ($issuer + "/token") and
              .registration_endpoint == ($issuer + "/register") and
              .revocation_endpoint == ($issuer + "/revoke") and
              (.grant_types_supported | index("authorization_code")) != null and
              (.grant_types_supported | index("refresh_token")) != null and
              (.token_endpoint_auth_methods_supported | index("none")) != null and
              (.code_challenge_methods_supported | index("S256")) != null and
              (.scopes_supported | index("mcp:read")) != null and
              (.scopes_supported | index("mcp:coordinate")) == null and
              (.scopes_supported | index("offline_access")) != null
            ' /tmp/asm.json >/dev/null

            post401 "$resource" /tmp/mcp.headers /tmp/mcp.body
            challenge=$(tr -d '\r' < /tmp/mcp.headers | awk 'BEGIN{IGNORECASE=1} /^www-authenticate:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}')
            echo "RONA_WWW_AUTHENTICATE=$challenge"
            test -n "$challenge"
            printf '%s\n' "$challenge" | grep -Eqi '^Bearer([[:space:]]|$)'
            printf '%s\n' "$challenge" | grep -Fqi "resource_metadata=\"$prm\""
            scope_value=$(printf '%s\n' "$challenge" | sed -n 's/.*scope="\([^"]*\)".*/\1/p')
            test "$scope_value" = 'mcp:read'

            for target in "$resource" "$BASE/$segment/register" "$prm" "$asm"; do
              options204 "$target" /tmp/options.headers
              grep -Fqi "access-control-allow-origin: $ORIGIN" /tmp/options.headers
              grep -Eqi 'access-control-allow-methods: GET(, POST)?, OPTIONS' /tmp/options.headers
              grep -Fqi 'access-control-allow-headers:' /tmp/options.headers
            done
          done

      - name: Verify invalid redirect remains rejected
        shell: bash
        run: |
          set -euo pipefail
          code='000'
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/dcr-invalid.json -w '%{http_code}' -X POST 'https://ronaoil.com/system-admin/register' -H 'Origin: https://chatgpt.com' -H 'Content-Type: application/json' --data '{"client_name":"RONA public interop invalid redirect QA","redirect_uris":["https://evil.example/callback"],"token_endpoint_auth_method":"none","grant_types":["authorization_code"],"response_types":["code"]}' || printf '000')
            [ "$code" = '400' ] && break
            case "$code" in 500|502|503|504) sleep "$attempt";; *) break;; esac
          done
          test "$code" = '400'
          jq -e '.error == "invalid_redirect_uri"' /tmp/dcr-invalid.json >/dev/null

      - name: Verify route-specific opaque browser origin policy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ronaoil.com'
          UUID='11111111-1111-4111-8111-111111111111'
          retry_post() {
            local expected="$1" out="$2" url="$3" origin="$4" ctype="$5" data="$6" code='000'
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$url" -H "Origin: $origin" -H "Content-Type: $ctype" --data "$data" || printf '000')
              [ "$code" = "$expected" ] && break
              case "$code" in 500|502|503|504) sleep "$attempt";; *) break;; esac
            done
            test "$code" = "$expected"
          }
          segments=(operations finance legal market-analyst rail-logistics system-admin)

          for segment in "${segments[@]}"; do
            retry_post 403 /tmp/null-mcp.json "$BASE/$segment/mcp" null application/json '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
            jq -e '.error == "ORIGIN_DENIED"' /tmp/null-mcp.json >/dev/null

            for path in token register revoke; do
              retry_post 403 /tmp/null-other.json "$BASE/$segment/$path" null application/x-www-form-urlencoded 'x=1'
              jq -e '.error == "ORIGIN_DENIED"' /tmp/null-other.json >/dev/null
            done
          done

          retry_post 403 /tmp/evil-authorize.json "$BASE/system-admin/authorize" https://evil.example application/x-www-form-urlencoded "request_id=$UUID&email=invalid%40example.invalid&password=not-a-real-credential&confirm=yes"
          jq -e '.error == "ORIGIN_DENIED"' /tmp/evil-authorize.json >/dev/null

          code='000'
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -D /tmp/null-authorize.headers -o /tmp/null-authorize.json -w '%{http_code}' -X POST "$BASE/system-admin/authorize" -H 'Origin: null' -H 'Sec-Fetch-Site: cross-site' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "request_id=$UUID" --data-urlencode 'email=invalid@example.invalid' --data-urlencode 'password=not-a-real-credential' --data-urlencode 'confirm=yes' || printf '000')
            [ "$code" = '400' ] && break
            case "$code" in 500|502|503|504) sleep "$attempt";; *) break;; esac
          done
          test "$code" = '400'
          jq -e '.error == "invalid_request"' /tmp/null-authorize.json >/dev/null

          code='000'
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/null-role.json -w '%{http_code}' -X POST "$BASE/system-admin/authorize" -H 'Origin: null' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "request_id=$UUID" --data-urlencode 'email=invalid@example.invalid' --data-urlencode 'password=not-a-real-credential' --data-urlencode 'confirm=yes' --data-urlencode 'role=OWNER_ADMIN' || printf '000')
            [ "$code" = '400' ] && break
            case "$code" in 500|502|503|504) sleep "$attempt";; *) break;; esac
          done
          test "$code" = '400'
          jq -e '.error == "INVALID_AUTHORIZE_FORM"' /tmp/null-role.json >/dev/null

          code='000'
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/null-redirect.json -w '%{http_code}' -X POST "$BASE/system-admin/authorize" -H 'Origin: null' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "request_id=$UUID" --data-urlencode 'email=invalid@example.invalid' --data-urlencode 'password=not-a-real-credential' --data-urlencode 'confirm=yes' --data-urlencode 'redirect_uri=https://evil.example/callback' || printf '000')
            [ "$code" = '400' ] && break
            case "$code" in 500|502|503|504) sleep "$attempt";; *) break;; esac
          done
          test "$code" = '400'
          jq -e '.error == "INVALID_AUTHORIZE_FORM"' /tmp/null-redirect.json >/dev/null

      - name: Publish public interop commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state='failure'
          description='MCP OAuth public interop QA failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='MCP OAuth public interop QA passed'
          fi
          target_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          payload=$(printf '{"state":"%s","context":"rona/mcp-oauth-public-interop","description":"%s","target_url":"%s"}' "$state" "$description" "$target_url")
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
