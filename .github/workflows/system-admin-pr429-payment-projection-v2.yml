name: SYSTEM_ADMIN PR429 final PRE POST discriminator v5

on:
  push:
    branches: [hotfix/client-load-feedback-loop-v1]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix/client-load-feedback-loop-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix real-browser typography adapter and prove canonical build
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-client-owner-retest-real-browser-v4.mjs')
          s=p.read_text()
          replacements=[
            ('}}, {selector,mark})}', '}}, {selector,mark:OWNER_TYPO_MARK})}', 'OWNER_TYPO_MARK_ARGUMENT'),
            ("proof={marker:document.documentElement?.dataset?.ronaClientOwnerTypography,nav:navTypography", "proof={marker:navTypography.html_marker,nav:navTypography", 'OWNER_TYPO_NODE_DOCUMENT_REFERENCE'),
          ]
          for old,new,label in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'{label}_TARGET_COUNT={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          print('OWNER_TYPO_ADAPTER_REFERENCE_FIXES=PASS')
          PY
          npm run build
          git diff -- scripts/qa-client-owner-retest-real-browser-v4.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install chromium

      - name: Build exact production baseline and PRE checkpoint
        shell: bash
        run: |
          set -euo pipefail
          base_root=/tmp/rona-owner-retest-base-v5
          before_root=/tmp/rona-owner-retest-before-v5
          rm -rf "$base_root" "$before_root"
          git worktree add --detach "$base_root" 4e07ad9f2591c6135e6de651bdaa06bb80a82e78
          git worktree add --detach "$before_root" d2a4bd75400cfb5f1f095ee997def21b936bceb2
          (cd "$base_root" && npm run build)
          (cd "$before_root" && npm run build)
          {
            echo "OWNER_BASE_ROOT=$base_root"
            echo "OWNER_BEFORE_ROOT=$before_root"
          } >> "$GITHUB_ENV"

      - name: PRE must be representative RED on all three Owner defects
        shell: bash
        run: |
          set -uo pipefail
          log="$GITHUB_WORKSPACE/owner-retest-before.log"
          cd "$OWNER_BEFORE_ROOT"
          set +e
          RONA_OWNER_BASE_ROOT="$OWNER_BASE_ROOT" RONA_OWNER_RETEST_LABEL='PRE_D2A4BD7' node "$GITHUB_WORKSPACE/scripts/qa-client-owner-retest-real-browser-v4.mjs" >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          test "$rc" -ne 0
          grep -F 'RONA_OWNER_CONTEXT_FIRST_PROJECTION' "$log"
          grep -F 'ASSERTION_FAILED PASSPORT_SOURCE_TO_PROJECTION' "$log"
          grep -F 'ASSERTION_FAILED CURRENT_COMPANY_CARD_AND_COUNTERS' "$log"
          grep -F 'ASSERTION_FAILED CLIENT_TYPOGRAPHY_REAL_UI_110' "$log"
          grep -F 'OWNER_RETEST_REGRESSION_RESULT=FAIL' "$log"
          ! grep -F 'RAW_PROJECTION_TIMEOUT' "$log"
          ! grep -F 'OWNER_CONTEXT_ADAPTER_READINESS' "$log"
          ! grep -F 'ReferenceError:' "$log"
          echo 'OWNER_RETEST_PRE_REPRESENTATIVE_RED=PASS'

      - name: POST canonical candidate must be GREEN on same real DOM assertions
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/owner-retest-candidate.log"
          RONA_OWNER_BASE_ROOT="$OWNER_BASE_ROOT" RONA_OWNER_RETEST_LABEL="POST_$(git rev-parse HEAD)" node scripts/qa-client-owner-retest-real-browser-v4.mjs | tee "$log"
          grep -F 'PASSPORT_SOURCE_TO_PROJECTION_PROOF' "$log"
          grep -F 'MY_COMPANIES_SEMANTIC_SOURCE_PROOF' "$log"
          grep -F 'REAL_TYPOGRAPHY_PROOF' "$log"
          grep -F 'OWNER_RETEST_ASSERTION_SET=PASS' "$log"
          grep -F 'OWNER_RETEST_REGRESSION_RESULT=PASS' "$log"
          echo "SYSTEM_ADMIN_PRE_RED_POST_GREEN=PASS head=$(git rev-parse HEAD)"

      - name: Commit only verified harness adapter correction
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/qa-client-owner-retest-real-browser-v4.mjs
          test "$(git diff --cached --name-only)" = 'scripts/qa-client-owner-retest-real-browser-v4.mjs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(client): fix computed typography real-browser adapter'
          git push origin HEAD:hotfix/client-load-feedback-loop-v1
          echo "VERIFIED_HARNESS_HEAD=$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-admin-pr429-final-pre-post-${{ github.run_id }}
          path: owner-retest-*.log
          if-no-files-found: warn
