name: SYSTEM_ADMIN PR429 canonical three-defect remediation v3

on:
  push:
    branches: [hotfix/client-load-feedback-loop-v1]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix/client-load-feedback-loop-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize canonical source and prove branch build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/system-admin-pr429-materialize-v3.py
          npm run build
          git status --short
          git add \
            supabase/functions/rona-portal-api/index.ts \
            assets/portal-runtime/client-deals-authoritative-v1.js \
            assets/portal-runtime/client-home-current-only-v1.js \
            assets/portal-runtime/client-home-command-center-v2.js \
            assets/portal-runtime/client-contract-download-v3.js \
            scripts/qa-client-owner-retest-real-browser-v4.mjs \
            scripts/apply-owner-client-company-alias-slot-v2.mjs \
            scripts/apply-owner-client-company-first-paint-v1.mjs \
            scripts/apply-system-admin-owner-remediation-v1.mjs \
            scripts/build-pages-direct-canonical.mjs \
            scripts/qa-client-portal-visual-freeze.mjs \
            governance/client-owner-visual-delta-pr429-approval-20260906.json
          echo 'CANONICAL_SOURCE_DELTA:'
          git diff --cached --name-only
          test -n "$(git diff --cached --name-only)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(client): canonicalize passport KPI and computed typography'
          post_sha=$(git rev-parse HEAD)
          git push origin HEAD:hotfix/client-load-feedback-loop-v1
          echo "POST_SHA=$post_sha" >> "$GITHUB_ENV"
          echo "SYSTEM_ADMIN_CANONICAL_SOURCE_COMMIT=$post_sha"

      - name: Install real browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install chromium

      - name: Build production baseline and exact PRE checkpoint
        shell: bash
        run: |
          set -euo pipefail
          base_root=/tmp/rona-owner-retest-base-v3
          before_root=/tmp/rona-owner-retest-before-v3
          rm -rf "$base_root" "$before_root"
          git worktree add --detach "$base_root" 4e07ad9f2591c6135e6de651bdaa06bb80a82e78
          git worktree add --detach "$before_root" d2a4bd75400cfb5f1f095ee997def21b936bceb2
          (cd "$base_root" && npm run build)
          (cd "$before_root" && npm run build)
          {
            echo "OWNER_BASE_ROOT=$base_root"
            echo "OWNER_BEFORE_ROOT=$before_root"
          } >> "$GITHUB_ENV"

      - name: Prove PRE d2a4bd7 is representative RED on exactly the Owner defects
        shell: bash
        run: |
          set -uo pipefail
          log="$GITHUB_WORKSPACE/owner-retest-before.log"
          cd "$OWNER_BEFORE_ROOT"
          set +e
          RONA_OWNER_BASE_ROOT="$OWNER_BASE_ROOT" RONA_OWNER_RETEST_LABEL='PRE_D2A4BD7' node "$GITHUB_WORKSPACE/scripts/qa-client-owner-retest-real-browser-v4.mjs" >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          test "$rc" -ne 0
          grep -F 'RONA_OWNER_CONTEXT_FIRST_PROJECTION' "$log"
          grep -F 'ASSERTION_FAILED PASSPORT_SOURCE_TO_PROJECTION' "$log"
          grep -F 'ASSERTION_FAILED CURRENT_COMPANY_CARD_AND_COUNTERS' "$log"
          grep -F 'ASSERTION_FAILED CLIENT_TYPOGRAPHY_REAL_UI_110' "$log"
          grep -F 'OWNER_RETEST_REGRESSION_RESULT=FAIL' "$log"
          ! grep -F 'RAW_PROJECTION_TIMEOUT' "$log"
          ! grep -F 'OWNER_CONTEXT_ADAPTER_READINESS' "$log"
          echo 'OWNER_RETEST_PRE_REPRESENTATIVE_RED=PASS'

      - name: Prove committed POST candidate is GREEN on the same real DOM contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$POST_SHA"
          log="$GITHUB_WORKSPACE/owner-retest-candidate.log"
          RONA_OWNER_BASE_ROOT="$OWNER_BASE_ROOT" RONA_OWNER_RETEST_LABEL="POST_${POST_SHA}" node scripts/qa-client-owner-retest-real-browser-v4.mjs | tee "$log"
          grep -F 'PASSPORT_SOURCE_TO_PROJECTION_PROOF' "$log"
          grep -F 'MY_COMPANIES_SEMANTIC_SOURCE_PROOF' "$log"
          grep -F 'REAL_TYPOGRAPHY_PROOF' "$log"
          grep -F 'OWNER_RETEST_ASSERTION_SET=PASS' "$log"
          grep -F 'OWNER_RETEST_REGRESSION_RESULT=PASS' "$log"
          echo "SYSTEM_ADMIN_PRE_RED_POST_GREEN=PASS head=$POST_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-admin-pr429-pre-post-${{ github.run_id }}
          path: owner-retest-*.log
          if-no-files-found: warn
