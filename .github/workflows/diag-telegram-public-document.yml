name: Diagnose Telegram public document download

on:
  push:
    branches:
      - diag/telegram-public-document-download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'

      - name: Inspect public Telegram and TGStat PDF surfaces
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }
          filenames = [
              'قیمت_صادراتی_فراورده_نفتی_ویژه_نیمه_اول_شهریور_ماه_1405.pdf',
              'قیمت_فراورده_نفتی_نیمه_اول_شهریور.pdf',
          ]
          targets = [
              'https://t.me/Samantahlil/105304?embed=1&mode=tme',
              'https://tgstat.ru/channel/%40Samantahlil',
              'https://tgstat.com/channel/%40Samantahlil',
          ]

          def meta(resp):
              return {
                  'status': resp.status_code,
                  'url': resp.url,
                  'content_type': resp.headers.get('content-type'),
                  'content_length': resp.headers.get('content-length'),
                  'content_disposition': resp.headers.get('content-disposition'),
              }

          for target in targets:
              try:
                  r = session.get(target, headers=headers, timeout=30, allow_redirects=True)
                  raw = html.unescape(r.text)
                  print(json.dumps({'event':'PAGE','target':target,**meta(r),'bytes':len(r.content)}, ensure_ascii=False))
                  for filename in filenames:
                      idx = raw.find(filename)
                      print(json.dumps({'event':'FILENAME_FOUND','target':target,'filename':filename,'found':idx>=0}, ensure_ascii=False))
                      if idx >= 0:
                          print(json.dumps({'event':'FILENAME_CONTEXT','target':target,'filename':filename,'context':raw[max(0,idx-3500):idx+len(filename)+3500]}, ensure_ascii=False))
                  urls=[]
                  for m in re.finditer(r'https?://[^\"\'<>\\\s]+', raw):
                      u=m.group(0).rstrip(');,')
                      low=u.lower()
                      if '.pdf' in low or 'tgcnt' in low or '/file/' in low:
                          if u not in urls: urls.append(u)
                  print(json.dumps({'event':'CANDIDATE_COUNT','target':target,'count':len(urls)}, ensure_ascii=False))
                  for u in urls[:100]:
                      try:
                          h=session.get(u, headers={**headers,'Referer':target,'Range':'bytes=0-31'}, timeout=30, allow_redirects=True, stream=True)
                          prefix=next(h.iter_content(chunk_size=32),b'')[:32]
                          print(json.dumps({'event':'CANDIDATE','target':target,'url':u,**meta(h),'prefix_hex':prefix.hex()}, ensure_ascii=False))
                          h.close()
                      except Exception as e:
                          print(json.dumps({'event':'CANDIDATE_ERROR','target':target,'url':u,'error':type(e).__name__,'detail':str(e)[:180]}, ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({'event':'PAGE_ERROR','target':target,'error':type(e).__name__,'detail':str(e)[:220]}, ensure_ascii=False))
          PY
