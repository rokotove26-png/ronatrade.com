name: Diagnose Telegram PDF reader V2

on:
  push:
    branches:
      - diag/telegram-public-document-download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe public RSSHub Telegram media bridges
        shell: bash
        run: |
          python - <<'PY'
          import json
          import requests

          targets = [
              'https://rsshub.jamesflare.com/telegram/media/Samantahlil/105304',
              'https://rsshub-container.folo.is/telegram/media/Samantahlil/105304',
              'https://rsshub.pseudoyu.com/telegram/media/Samantahlil/105304',
              'https://rsshub.isrss.com/telegram/media/Samantahlil/105304',
          ]
          headers = {'User-Agent': 'RONA-Trade-Market-Ingest/1.0', 'Range': 'bytes=0-63'}
          for url in targets:
              try:
                  r = requests.get(url, headers=headers, timeout=45, allow_redirects=True, stream=True)
                  prefix = next(r.iter_content(chunk_size=64), b'')[:64]
                  print(json.dumps({
                      'url': url,
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'content_length': r.headers.get('content-length'),
                      'content_range': r.headers.get('content-range'),
                      'content_disposition': r.headers.get('content-disposition'),
                      'prefix_hex': prefix.hex(),
                      'is_pdf_magic': prefix.startswith(b'%PDF-'),
                  }, ensure_ascii=False))
                  r.close()
              except Exception as e:
                  print(json.dumps({'url': url, 'error': type(e).__name__, 'detail': str(e)[:220]}, ensure_ascii=False))
          PY
