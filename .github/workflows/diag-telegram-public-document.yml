name: Diagnose Telegram PDF reader V3

on:
  push:
    branches:
      - diag/telegram-public-document-download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V3 candidate
        uses: actions/checkout@v4
        with:
          ref: fix/telegram-rsshub-pdf-fallback
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'beautifulsoup4>=4.12,<5' \
            'lxml>=5,<7' \
            'pypdf>=5,<7' \
            'pdfplumber>=0.11,<0.12' \
            'requests>=2.32,<3'

      - name: Validate V3 against live Samantahlil PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/telegram_public_market_ingest.py \
            scripts/telegram_public_market_ingest_resilient.py \
            scripts/telegram_public_pdf_ingest_v2.py \
            scripts/telegram_public_pdf_ingest_v3.py
          python - <<'PY'
          import hashlib
          import pathlib
          import sys
          import tempfile
          import requests
          from pypdf import PdfReader

          sys.path.insert(0, 'scripts')
          import telegram_public_pdf_ingest_v3 as v3
          import telegram_public_pdf_ingest_v2 as v2

          url = v3._rsshub_urls('Samantahlil', 105304)[0]
          assert v3.allowed_media_url_v3(url)
          r = requests.get(url, timeout=90)
          r.raise_for_status()
          data = r.content
          assert data.startswith(b'%PDF-')
          assert len(data) == 1464687, len(data)
          with tempfile.TemporaryDirectory() as tmp:
              path = pathlib.Path(tmp) / 'samantahlil-105304.pdf'
              path.write_bytes(data)
              assert v2.strict_infer_mime(path, r.headers.get('content-type'), path.name) == 'application/pdf'
              reader = PdfReader(str(path))
              assert len(reader.pages) > 0
              text = ''.join((page.extract_text() or '') for page in reader.pages[:3])
              print('TELEGRAM_PDF_READER_V3_LIVE_PASS', len(data), len(reader.pages), hashlib.sha256(data).hexdigest(), len(text))
          PY
