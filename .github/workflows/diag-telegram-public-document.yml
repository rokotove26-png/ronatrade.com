name: Diagnose Telegram PDF reader V2

on:
  push:
    branches:
      - diag/telegram-public-document-download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V2 candidate
        uses: actions/checkout@v4
        with:
          ref: fix/telegram-pdf-reader-v2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'beautifulsoup4>=4.12,<5' \
            'lxml>=5,<7' \
            'pypdf>=5,<7' \
            'pdfplumber>=0.11,<0.12' \
            'requests>=2.32,<3'

      - name: Compile and self-test V2
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/telegram_public_market_ingest.py \
            scripts/telegram_public_market_ingest_resilient.py \
            scripts/telegram_public_pdf_ingest_v2.py
          python - <<'PY'
          import pathlib
          import sys
          import tempfile
          import requests

          sys.path.insert(0, 'scripts')
          import telegram_public_pdf_ingest_v2 as v2

          with tempfile.TemporaryDirectory() as tmp:
              html = pathlib.Path(tmp) / 'fake.pdf'
              html.write_bytes(b'<!DOCTYPE html><html></html>')
              assert v2.strict_infer_mime(html, 'application/pdf', 'fake.pdf') is None

              pdf = pathlib.Path(tmp) / 'real.bin'
              pdf.write_bytes(b'%PDF-1.7\n%test\n')
              assert v2.strict_infer_mime(pdf, 'text/html', 'real.bin') == 'application/pdf'

          assert v2.allowed_media_url_v2('https://static25.tgcnt.ru/posts/_0/aa/file.pdf')
          fake = {
              'link': 't.me/Samantahlil/105304',
              'date': 1787691395,
              'text': 'test',
              'media': {
                  'media_type': 'mediaDocument',
                  'mime_type': 'application/pdf',
                  'file_size': 1468006,
                  'file_name': 'report.pdf',
                  'file_url': 'https://static.tgcnt.ru/posts/_0/aa/report.pdf',
              },
          }
          parsed = v2._tgstat_item_to_message(requests.Session(), 'Samantahlil', fake)
          assert parsed and parsed['message_id'] == 105304
          assert parsed['_binary_provenance'] == v2.TGSTAT_PROVENANCE
          print('TELEGRAM_PDF_READER_V2_SELFTEST_PASS')
          PY
