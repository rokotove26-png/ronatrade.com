name: Temporary Pages config auth probe 20260826

on:
  push:
    branches:
      - 'probe/cf-pages-config-download-20260826'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public preview probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://probe-cf-pages-config-downlo.rona-trade-public.pages.dev/__cf_pages_config_probe.json'
          tmp=$(mktemp)
          status=$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' "$url")
          echo "HTTP_STATUS=$status"
          echo -n 'PROBE='; cat "$tmp"; echo
          test "$status" = '200'
