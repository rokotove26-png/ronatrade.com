<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONA Trade — Кабинет агента</title><style>
:root{--bg:#05090d;--panel:rgba(8,15,22,.82);--line:rgba(171,220,239,.22);--line2:rgba(171,220,239,.36);--text:#f3f7f9;--muted:#a9bac4;--red:#e0424b;--green:#70d0a1;--amber:#e2b564;--blue:#78b8e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% -5%,#122a36 0,transparent 28%),radial-gradient(circle at 5% 100%,#1a1719 0,transparent 34%),var(--bg);color:var(--text);font:15px Inter,Segoe UI,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:290px minmax(0,1fr)}aside{padding:22px 14px;background:rgba(4,10,15,.9);border-right:1px solid var(--line)}.brand{font-size:21px;font-weight:950;letter-spacing:.05em;margin:3px 10px 22px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;font:inherit;font-weight:800;cursor:pointer}.nav button:hover,.nav button[aria-current=true]{color:var(--text);background:rgba(224,66,75,.12);border-color:rgba(224,66,75,.26)}main{padding:26px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.top h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-weight:800}.green{color:var(--green);border-color:rgba(112,208,161,.35)}.amber{color:var(--amber);border-color:rgba(226,181,100,.35)}.red{color:#ff8b91;border-color:rgba(224,66,75,.4)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.card,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(12,22,30,.78),rgba(7,13,19,.82));border-radius:15px}.card{padding:16px}.card span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.card strong{display:block;font-size:25px;margin-top:8px}.panel-head{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-body{padding:16px}.row{display:grid;grid-template-columns:minmax(160px,1.3fr) repeat(3,minmax(110px,.8fr));gap:10px;padding:11px 0;border-bottom:1px solid rgba(171,220,239,.12)}.row:last-child{border-bottom:0}.row span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:13px;border:1px solid rgba(226,181,100,.34);background:rgba(226,181,100,.08);border-radius:11px}.notice.red{background:rgba(224,66,75,.09)}.btn{border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);padding:9px 12px;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}@media(max-width:900px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><div class="app"><aside><div class="brand">RONA TRADE<small>Кабинет агента · v0.4.3 UAT adapter</small></div><nav class="nav" id="nav"><button data-v="home" aria-current="true">Главная</button><button data-v="clients">Мои клиенты</button><button data-v="prices">Прайс-лист</button><button data-v="deals">Сделки</button><button data-v="economics">Экономика</button><button data-v="settlements">Вознаграждения</button><button data-v="documents">Документы</button><button data-v="messages">Сообщения</button></nav></aside><main><header class="top"><div><h1 id="title">Главная</h1><div class="muted" id="identity">Ожидание серверного контекста…</div></div><div><span class="pill amber" id="access">Доступ: проверка</span><button class="btn" id="logout" type="button" style="margin-left:8px">Выйти</button></div></header><section id="content"><div class="notice">Данные кабинета поступают только из server-authorized Agent bootstrap.</div></section></main></div><script>
(()=>{'use strict';let ctx=null,DATA={};let view='home';const arr=v=>Array.isArray(v)?v:[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const titles={home:'Главная',clients:'Мои клиенты',prices:'Прайс-лист',deals:'Сделки',economics:'Экономика',settlements:'Вознаграждения',documents:'Документы',messages:'Сообщения'};function rows(a,cols){if(!a.length)return '<div class="empty">Сервер не передал разрешённых объектов.</div>';return a.map(x=>`<div class="row">${cols.map(c=>`<div><span>${esc(c[0])}</span><strong>${esc(x?.[c[1]]??'—')}</strong></div>`).join('')}</div>`).join('')}function failClosed(reason){ctx=null;DATA={};document.getElementById('identity').textContent='Серверный доступ не подтверждён';const a=document.getElementById('access');a.className='pill red';a.textContent='Доступ: заблокирован';document.getElementById('content').innerHTML=`<div class="notice red">${esc(reason||'Доступ агента не активирован.')}</div>`;return false}function validate(d){if(!d||typeof d!=='object')return'Bootstrap отсутствует.';if(!String(d.userId||''))return'Отсутствует ИД пользователя.';if(!/^AGP-\d{4}-\d{3,}$/.test(String(d.agentPersonId||'')))return'Некорректный ИД агента.';if(!d.legalEntity||typeof d.legalEntity!=='object')return'Юридическое лицо агента не подтверждено.';return''}function render(){if(!ctx)return;document.getElementById('title').textContent=titles[view]||'Кабинет агента';document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===view)));const clients=arr(DATA.clients),deals=arr(DATA.deals),docs=arr(DATA.documents),sett=arr(DATA.settlements),econ=arr(DATA.economics),msgs=arr(DATA.messages);let h='';if(view==='home')h=`<div class="grid"><div class="card"><span>Клиенты</span><strong>${clients.length}</strong></div><div class="card"><span>Сделки</span><strong>${deals.length}</strong></div><div class="card"><span>Документы</span><strong>${docs.length}</strong></div><div class="card"><span>Вознаграждения</span><strong>${sett.length}</strong></div></div><div class="panel"><div class="panel-head"><strong>Серверный профиль</strong><span class="pill green">Подтверждён</span></div><div class="panel-body">${rows([{agentPersonId:ctx.agentPersonId,legalEntityId:DATA.legalEntity?.id,displayAlias:DATA.displayAlias}], [['Агент','displayAlias'],['ИД агента','agentPersonId'],['Юр. лицо','legalEntityId']])}</div></div>`;else if(view==='clients')h=`<div class="panel"><div class="panel-head"><strong>Закреплённые клиенты</strong></div><div class="panel-body">${rows(clients,[['Client ID','clientId'],['Компания','name'],['Contract ID','contractId']])}</div></div>`;else if(view==='deals')h=`<div class="panel"><div class="panel-head"><strong>Разрешённые сделки</strong></div><div class="panel-body">${rows(deals,[['Deal ID','dealId'],['Client ID','clientId'],['Статус','status']])}</div></div>`;else if(view==='documents')h=`<div class="panel"><div class="panel-head"><strong>Документы</strong></div><div class="panel-body">${rows(docs,[['Document ID','documentId'],['Deal ID','dealId'],['Тип','type']])}</div></div>`;else if(view==='settlements')h=`<div class="panel"><div class="panel-head"><strong>Вознаграждения</strong></div><div class="panel-body">${rows(sett,[['Deal ID','dealId'],['Статус','status'],['Сумма','amount']])}</div></div>`;else if(view==='economics')h=`<div class="panel"><div class="panel-head"><strong>Экономика</strong></div><div class="panel-body">${rows(econ,[['Deal ID','dealId'],['Статус','status'],['Показатель','value']])}</div></div>`;else if(view==='messages')h=`<div class="panel"><div class="panel-head"><strong>Сообщения</strong></div><div class="panel-body">${rows(msgs,[['Deal ID','dealId'],['Тема','subject'],['Сообщение','text']])}</div></div>`;else h='<div class="panel"><div class="panel-body"><div class="empty">Показываются только серверно опубликованные позиции для текущего агента.</div></div></div>';document.getElementById('content').innerHTML=h}function boot(input){const e=validate(input);if(e)return failClosed(e);ctx={userId:String(input.userId),agentPersonId:String(input.agentPersonId)};DATA=input;document.getElementById('identity').textContent=`${String(input.displayAlias||'Агент')} · ${ctx.agentPersonId}`;const a=document.getElementById('access');a.className='pill green';a.textContent='Доступ: подтверждён';render();return true}window.RONA_AGENT_PORTAL={version:'0.4.3-uat-adapter',boot,failClosed,getAgentId:()=>ctx?.agentPersonId||null,getUserId:()=>ctx?.userId||null};document.getElementById('nav').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;view=b.dataset.v;render()};document.getElementById('logout').onclick=async()=>{try{await fetch('/portal/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}location.replace('/portal/login')};failClosed('Ожидание подтверждённого серверного контекста.');})();
</script></body></html>
