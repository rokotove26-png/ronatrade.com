<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONA Trade — Личный кабинет клиента</title><style>
:root{--bg:#05090d;--panel:rgba(8,15,22,.82);--line:rgba(171,220,239,.22);--line2:rgba(171,220,239,.36);--text:#f3f7f9;--muted:#a9bac4;--red:#e0424b;--green:#70d0a1;--amber:#e2b564;--blue:#78b8e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% -5%,#122a36 0,transparent 28%),radial-gradient(circle at 5% 100%,#1a1719 0,transparent 34%),var(--bg);color:var(--text);font:15px Inter,Segoe UI,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:305px minmax(0,1fr)}aside{padding:22px 14px;background:rgba(4,10,15,.9);border-right:1px solid var(--line)}.brand{font-size:21px;font-weight:950;letter-spacing:.05em;margin:3px 10px 22px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:left;font:inherit;font-weight:800;cursor:pointer}.nav button:hover,.nav button[aria-current=true]{color:var(--text);background:rgba(120,184,231,.1);border-color:rgba(120,184,231,.2)}main{padding:25px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:17px}.top h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}select,.btn{border:1px solid var(--line2);background:#09121a;color:var(--text);padding:9px 11px;border-radius:9px;font:inherit}.btn{font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}.card,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(12,22,30,.78),rgba(7,13,19,.82));border-radius:15px}.card{padding:16px}.card span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.card strong{display:block;font-size:25px;margin-top:8px}.panel-head{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-body{padding:16px}.row{display:grid;grid-template-columns:minmax(160px,1.3fr) repeat(2,minmax(110px,.8fr));gap:10px;padding:11px 0;border-bottom:1px solid rgba(171,220,239,.12)}.row:last-child{border-bottom:0}.row span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:13px;border:1px solid rgba(226,181,100,.34);background:rgba(226,181,100,.08);border-radius:11px}.notice.red{border-color:rgba(224,66,75,.4);background:rgba(224,66,75,.09);color:#ffd6d8}.notice.green{border-color:rgba(112,208,161,.35);background:rgba(112,208,161,.08);color:#dbf6e8}@media(max-width:900px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}main{padding:16px}.top{display:block}}
</style></head><body><div class="app"><aside><div class="brand">RONA TRADE<small>Личный кабинет клиента · server-authorized UAT shell</small></div><nav class="nav" id="nav"><button data-v="home" aria-current="true">Главная</button><button data-v="companies">Мои компании</button><button data-v="applications">Заявки</button><button data-v="deals">Сделки</button><button data-v="documents">ДС и Инвойсы</button><button data-v="payments">Платежи</button><button data-v="logistics">Логистика</button><button data-v="closing">Закрывающие документы</button><button data-v="archive">Архив</button><button data-v="claims">Претензии</button><button data-v="messages">Сообщения</button><button data-v="prices">Прайс-лист</button><button data-v="analytics">Аналитика</button><button data-v="news">Новости топливного рынка СНГ</button></nav></aside><main><header class="top"><div><h1 id="title">Главная</h1><div class="muted" id="identity">Проверка серверного доступа…</div></div><div><select id="context" disabled><option>Контекст не выбран</option></select><button class="btn" id="logout" type="button">Выйти</button></div></header><section id="notice" class="notice">В HTML отсутствуют клиентские бизнес-снимки. Контекст загружается только после server-side authorization.</section><section id="content"></section></main></div><script>
(()=>{'use strict';let B=null,C=null,view='home';const arr=v=>Array.isArray(v)?v:[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const titles={home:'Главная',companies:'Мои компании',applications:'Заявки',deals:'Сделки',documents:'ДС и Инвойсы',payments:'Платежи',logistics:'Логистика',closing:'Закрывающие документы',archive:'Архив',claims:'Претензии',messages:'Сообщения',prices:'Прайс-лист',analytics:'Аналитика',news:'Новости топливного рынка СНГ'};function rows(a,cols){if(!a.length)return '<div class="empty">Нет опубликованных данных.</div>';return a.map(x=>`<div class="row">${cols.map(c=>`<div><span>${esc(c[0])}</span><strong>${esc(x?.[c[1]]??'—')}</strong></div>`).join('')}</div>`).join('')}function fail(m){B=null;C=null;const n=document.getElementById('notice');n.className='notice red';n.textContent=m||'Клиентский доступ не подтверждён.';document.getElementById('context').disabled=true;document.getElementById('content').innerHTML=''}function ok(m){const n=document.getElementById('notice');n.className='notice green';n.textContent=m}function render(){document.getElementById('title').textContent=titles[view]||'Личный кабинет';document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===view)));const c=C||{};let h='';if(view==='home')h=`<div class="grid"><div class="card"><span>Разрешённые контракты</span><strong>${arr(B?.contexts).length}</strong></div><div class="card"><span>Сделки</span><strong>${arr(c.deals).length}</strong></div><div class="card"><span>Документы</span><strong>${arr(c.documents).length}</strong></div></div>`;else if(view==='companies')h=`<div class="panel"><div class="panel-head"><strong>Мои компании / контракты</strong></div><div class="panel-body">${rows(arr(B?.contexts),[['Компания','legal_name'],['Client ID','client_id'],['Contract ID','contract_id']])}</div></div>`;else if(view==='applications')h=`<div class="panel"><div class="panel-head"><strong>Заявки</strong></div><div class="panel-body">${rows(arr(c.applications),[['Application ID','application_id'],['Статус','status'],['Обновлено','updated_at']])}</div></div>`;else if(view==='deals')h=`<div class="panel"><div class="panel-head"><strong>Сделки</strong></div><div class="panel-body">${rows(arr(c.deals),[['Deal ID','deal_id'],['Статус','status'],['Этап','stage']])}</div></div>`;else if(view==='documents'||view==='closing')h=`<div class="panel"><div class="panel-head"><strong>Документы</strong></div><div class="panel-body">${rows(arr(c.documents),[['Document ID','document_id'],['Тип','document_type'],['Статус','lifecycle_state']])}</div></div>`;else if(view==='payments')h=`<div class="panel"><div class="panel-head"><strong>Платежи</strong></div><div class="panel-body">${rows(arr(c.payments),[['Payment ID','payment_id'],['Статус','finance_status'],['Закрытие','accounting_closure_status']])}</div></div>`;else if(view==='logistics')h=`<div class="panel"><div class="panel-head"><strong>Логистика</strong></div><div class="panel-body">${rows(arr(c.shipments),[['Shipment ID','shipment_id'],['Статус','status'],['Обновлено','updated_at']])}</div></div>`;else h='<div class="panel"><div class="panel-body"><div class="empty">Раздел отображает только серверно разрешённый / опубликованный слой выбранного Client ID / Contract ID.</div></div></div>';document.getElementById('content').innerHTML=h}async function get(path){const r=await fetch('/portal/api'+path,{credentials:'same-origin',headers:{accept:'application/json'}});if(r.status===401){location.replace('/portal/login?next=%2Fportal%2Fclient.html');throw new Error('SESSION')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.code||'CLIENT_ACCESS_DENIED');return j}async function select(v){const x=arr(B?.contexts).find(z=>`${z.client_id}|${z.contract_id}`===v);if(!x)return fail('Контекст клиента не подтверждён.');try{const q=new URLSearchParams({clientId:String(x.client_id),contractId:String(x.contract_id)});const j=await get('/v1/client/context?'+q);C=j.data||null;if(!C)return fail('Сервер не вернул разрешённый контекст.');ok('Доступ подтверждён. Данные ограничены выбранной компанией и контрактом.');render()}catch(e){if(e.message!=='SESSION')fail('Доступ к выбранному контексту запрещён сервером.')}}async function boot(){try{const me=await get('/session/me');const roles=arr(me?.user?.roles).map(String);if(!roles.includes('CLIENT'))return fail('Роль CLIENT не подтверждена сервером.');document.getElementById('identity').textContent=`${me?.user?.display_name||'Клиент'} · CLIENT`;const j=await get('/v1/client/bootstrap');B=j.data||null;const cs=arr(B?.contexts),s=document.getElementById('context');s.innerHTML='';if(!cs.length){s.innerHTML='<option>Нет активного клиентского доступа</option>';return fail('Активная привязка Client ID / Contract ID отсутствует. Доступ закрыт fail-closed.')}for(const x of cs){const o=document.createElement('option');o.value=`${x.client_id}|${x.contract_id}`;o.textContent=`${x.legal_name||x.client_id} · ${x.current_external_contract_number||x.contract_id}`;s.appendChild(o)}s.disabled=false;s.onchange=()=>select(s.value);await select(s.value)}catch(e){if(e.message!=='SESSION')fail('Не удалось подтвердить клиентскую сессию.')}}document.getElementById('nav').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;view=b.dataset.v;render()};document.getElementById('logout').onclick=async()=>{try{await fetch('/portal/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}location.replace('/portal/login')};boot();})();
</script></body></html>
