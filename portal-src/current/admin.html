    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--shell-bg);color:var(--shell-text);font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;background-image:linear-gradient(rgba(3,8,13,.67),rgba(3,8,13,.67)),url('/assets/portal-canonical/background.png');background-position:center;background-size:cover;background-attachment:fixed}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr)}.sidebar{grid-row:1/3;padding:15px 12px 20px;border-right:1px solid var(--shell-line);background:linear-gradient(180deg,rgba(4,11,19,.98),rgba(6,15,25,.94));backdrop-filter:blur(18px);overflow:auto}.brand{height:82px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.brand img{width:136px;height:68px;object-fit:contain}.nav-group{margin:17px 10px 8px;color:#7c91a3;font-size:10.5px;line-height:1.2;font-weight:800;letter-spacing:.13em;text-transform:uppercase}#nav{display:flex;flex-direction:column;gap:4px;border:0;background:transparent;box-shadow:none;backdrop-filter:none;padding:0 0 12px}#nav button{width:100%;min-height:43px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#c0cdd7;text-align:left;cursor:pointer;font-size:13.5px;line-height:1.2;font-weight:650;transition:background .14s ease,border-color .14s ease,color .14s ease}#nav button:hover{background:rgba(89,215,255,.075);border-color:rgba(89,215,255,.08);color:#fff}#nav button.active,#nav button[aria-current="page"]{background:linear-gradient(135deg,rgba(89,215,255,.16),rgba(77,109,190,.16));border-color:rgba(89,215,255,.22);box-shadow:inset 3px 0 0 rgba(89,215,255,.68);color:#fff}.nav-icon{width:18px;min-width:18px;text-align:center;color:#93b0c4;font-size:15px}.topbar{grid-column:2;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--shell-line);background:rgba(4,11,19,.91);backdrop-filter:blur(18px);position:sticky;top:0;z-index:100}.search{flex:1;min-width:0;height:40px;border:1px solid rgba(145,190,214,.19);border-radius:11px;background:rgba(5,12,20,.78);color:#eaf2f7;padding:0 14px;outline:none;font-size:13px}.search:focus{border-color:rgba(89,215,255,.44);box-shadow:0 0 0 3px rgba(89,215,255,.07)}.role-pill,.logout{height:36px;border:1px solid rgba(145,190,214,.2);border-radius:999px;background:rgba(8,17,28,.8);color:#eaf2f7;padding:0 13px;font-size:12px;font-weight:750;white-space:nowrap}.logout{cursor:pointer}.logout:hover{border-color:rgba(89,215,255,.4)}main{grid-column:2;min-width:0;overflow:auto}.page{display:none;min-height:calc(100vh - 64px)}.page.active{display:block}.current-loading{width:min(100%,1480px);margin:0 auto;padding:28px}.current-loading-card{padding:22px;border:1px solid var(--shell-line);border-radius:18px;background:var(--shell-panel);box-shadow:0 18px 50px rgba(0,0,0,.22)}.current-loading-title{font-size:18px;font-weight:800}.current-loading-sub{margin-top:7px;color:var(--shell-muted);font-size:13px}.current-only-hidden-page{display:none!important}.current-access-entry{display:flex;align-items:center;justify-content:space-between;gap:24px}.current-primary-action{min-height:42px;padding:0 18px;border:1px solid rgba(89,215,255,.4);border-radius:11px;background:linear-gradient(135deg,rgba(45,154,205,.92),rgba(36,111,169,.92));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(22,121,173,.22);white-space:nowrap}.current-primary-action:hover{border-color:rgba(114,226,255,.75);filter:brightness(1.07)}.current-primary-action:disabled{opacity:.65;cursor:wait}

<script>
window.__RONA_ADMIN_BOOT_STATE__={ready:true,currentOnly:true};
window.__RONA_ADMIN_CURRENT_SHELL__='current-only-v2';
window.__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2';
window.__RONA_CLIENTS_AGENTS_V4__='retired-by-current-only-v2';
(()=>{'use strict';
  const nav=document.getElementById('nav'),main=document.getElementById('current-admin-main');
  if(!nav||!main)return;
  const buttons=()=>Array.from(nav.querySelectorAll('button[data-page]'));
  const valid=()=>new Set(buttons().map(b=>String(b.dataset.page||'')));
  let selected='home',applying=false,pending=false;
  try{const saved=sessionStorage.getItem('rona.admin.currentPage');if(saved&&valid().has(saved))selected=saved}catch(_){ }
  function correct(page){const b=nav.querySelector('button[data-page="'+CSS.escape(page)+'"]'),p=document.getElementById('page-'+page);return !!(b&&p&&b.classList.contains('active')&&b.getAttribute('aria-current')==='page'&&p.classList.contains('active')&&buttons().every(x=>x===b?!0:!x.classList.contains('active'))&&Array.from(main.querySelectorAll('.page')).every(x=>x===p?!0:!x.classList.contains('active')))}
  function emit(page,source){window.dispatchEvent(new CustomEvent('rona:admin-pagechange',{detail:{page,source:source||'router'}}))}
  function apply(page,source,notify=true){if(!valid().has(page))return false;const target=document.getElementById('page-'+page);if(!target)return false;applying=true;for(const b of buttons()){const on=String(b.dataset.page||'')===page;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}for(const p of Array.from(main.querySelectorAll('.page'))){p.classList.toggle('active',p===target)}document.documentElement.dataset.ronaAdminPage=page;document.documentElement.dataset.ronaAdminNavigationOwner='current-only-router-v2';try{sessionStorage.setItem('rona.admin.currentPage',page)}catch(_){ }applying=false;if(notify)emit(page,source);return true}
  function guard(){pending=false;if(!applying&&!correct(selected))apply(selected,'guard',false)}
  function scheduleGuard(){if(pending||applying)return;pending=true;queueMicrotask(guard)}
  nav.addEventListener('click',ev=>{const b=ev.target&&ev.target.closest&&ev.target.closest('button[data-page]');if(!b||!nav.contains(b))return;selected=String(b.dataset.page||'home');apply(selected,'user');setTimeout(scheduleGuard,0);setTimeout(scheduleGuard,80);setTimeout(scheduleGuard,300);setTimeout(scheduleGuard,900)},true);
  const observer=new MutationObserver(scheduleGuard);observer.observe(nav,{subtree:true,attributes:true,attributeFilter:['class','aria-current']});observer.observe(main,{subtree:true,attributes:true,attributeFilter:['class']});
  window.__RONA_ADMIN_NAVIGATE__=page=>{page=String(page||'');if(!valid().has(page))return false;selected=page;return apply(page,'api')};
  document.addEventListener('click',ev=>{const b=ev.target&&ev.target.closest&&ev.target.closest('[data-action="create-access"]');if(!b)return;const real=document.querySelector('[data-rona-create-access="primary"]');if(real&&real!==b){real.click();return}b.disabled=true;const old=b.textContent;b.textContent='Загрузка…';const deadline=Date.now()+5000;(function wait(){const target=document.querySelector('[data-rona-create-access="primary"]');if(target&&target!==b){b.disabled=false;b.textContent=old;target.click();return}if(Date.now()<deadline){setTimeout(wait,100);return}b.disabled=false;b.textContent=old;window.dispatchEvent(new CustomEvent('rona:admin-module-retry',{detail:{module:'clients-agents-current'}}))})()},true);
  apply(selected,'boot');
})();
</script>
