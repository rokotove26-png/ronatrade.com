und:rgba(30,11,16,.72)}.rona-module-error button{margin-top:12px;min-height:38px;padding:0 14px;border:1px solid rgba(89,215,255,.35);border-radius:10px;background:rgba(27,83,121,.6);color:#fff;cursor:pointer}

<script>
window.__RONA_ADMIN_BOOT_STATE__={ready:true,currentOnly:true};
window.__RONA_ADMIN_CURRENT_SHELL__='current-only-v2';
window.__RONA_ADMIN_CURRENT_ROUTER__='current-only-router-v2';
(()=>{'use strict';
  const nav=document.getElementById('nav'),main=document.getElementById('current-admin-main');
  if(!nav||!main)return;
  const buttons=()=>Array.from(nav.querySelectorAll('button[data-page]'));
  const pages=()=>Array.from(main.querySelectorAll(':scope > .page[id^="page-"]'));
  const valid=()=>new Set(buttons().map(b=>String(b.dataset.page||'')));
  let selected='home',applying=false,pending=false;
  try{const saved=sessionStorage.getItem('rona.admin.currentPage');if(saved&&valid().has(saved))selected=saved}catch(_){ }
  function targetButton(page){return nav.querySelector('button[data-page="'+CSS.escape(page)+'"]')}
  function targetPage(page){return document.getElementById('page-'+page)}
  function correct(page){const b=targetButton(page),p=targetPage(page);return !!(b&&p&&b.classList.contains('active')&&b.getAttribute('aria-current')==='page'&&p.classList.contains('active')&&buttons().every(x=>x===b||!x.classList.contains('active'))&&pages().every(x=>x===p||!x.classList.contains('active')))}
  function emit(page,source){window.dispatchEvent(new CustomEvent('rona:admin-pagechange',{detail:{page,source:source||'router'}}))}
  function apply(page,source,notify=true){if(!valid().has(page))return false;const p=targetPage(page),b=targetButton(page);if(!p||!b)return false;applying=true;for(const x of buttons()){const on=x===b;x.classList.toggle('active',on);if(on)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')}for(const x of pages())x.classList.toggle('active',x===p);document.documentElement.dataset.ronaAdminPage=page;document.documentElement.dataset.ronaAdminNavigationOwner='current-only-router-v2';try{sessionStorage.setItem('rona.admin.currentPage',page)}catch(_){ }applying=false;if(notify)emit(page,source);return true}
  function guard(){pending=false;if(!applying&&!correct(selected))apply(selected,'guard',false)}
  function scheduleGuard(){if(pending||applying)return;pending=true;queueMicrotask(guard)}
  nav.addEventListener('click',ev=>{const b=ev.target?.closest?.('button[data-page]');if(!b||!nav.contains(b))return;selected=String(b.dataset.page||'home');apply(selected,'user');queueMicrotask(scheduleGuard)},true);
  const observer=new MutationObserver(scheduleGuard);observer.observe(nav,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-current','data-page']});observer.observe(main,{subtree:true,childList:true,attributes:true,attributeFilter:['class','id']});
  window.__RONA_ADMIN_NAVIGATE__=page=>{page=String(page||'');if(!valid().has(page))return false;selected=page;return apply(page,'api')};
  window.__RONA_ADMIN_SELECTED_PAGE__=()=>selected;
  document.addEventListener('click',ev=>{const b=ev.target?.closest?.('[data-action="create-access"]');if(!b)return;const real=document.querySelector('[data-rona-create-access="primary"]');if(real&&real!==b){real.click();return}window.dispatchEvent(new CustomEvent('rona:admin-module-retry',{detail:{module:'clients-agents-current',page:'access'}}))},true);
  apply(selected,'boot');
})();
