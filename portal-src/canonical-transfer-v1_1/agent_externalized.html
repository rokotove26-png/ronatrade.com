<script id="rona-agent-secure-core-v043">
let DATA={agent:null,clients:{},deals:{},timeline:{},pricePublication:{publicationId:null,publicationStatus:'NOT_PUBLISHED',publishedAt:null,validUntil:null,items:[]},economics:[],settlements:[],documents:[],messages:[]};
let ctx=null;
const state={page:'home',selectedDeal:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x:[];
const text=x=>String(x??'').trim();
const enumKey=x=>text(x).toUpperCase().replace(/[\s-]+/g,'_');
const SEMANTIC_CLASS={positive:'green',pending:'amber',critical:'red'};
const INTERNAL_TOKEN_RE=/(?:\b(?:AGENT[_ -]?VIEW|AGENT[_ -]?DISTRIBUTION|CLIENT[_ -]?PORTAL|NOT[_ -]?PUBLISHED|PUBLISHED|TO[_ -]?VERIFY|FINAL|HOLD|PAYMENT[_ -]?HOLD|LEGAL[_ -]?HARMONIZATION|MISSING[_ -]?ADDENDUM|AUTHORITY|PAYLOAD|SERVER[_ -]?SCOPE|RECOVERY[_ -]?UI|FAIL[_ -]?CLOSED|AGENT[_ -]?SCOPE)\b|\b(?:Agent|User|Client|Contract|Settlement)\s+ID\b)/i;
function safePublicText(value,fallback='Требуется подтверждение RONA Trade.'){const v=text(value);if(!v)return fallback;return INTERNAL_TOKEN_RE.test(v)?fallback:v}
function safeDateValue(value){const v=text(value);if(!v)return '';if(/^\d{4}-\d{2}-\d{2}(?:[T\s]\d{2}:\d{2}(?::\d{2})?(?:\.\d+)?(?:Z|[+-]\d{2}:?\d{2})?)?$/.test(v))return v;if(/^\d{2}\.\d{2}\.\d{4}(?:\s+\d{2}:\d{2}(?::\d{2})?)?$/.test(v))return v;return ''}
function displayDate(value){const v=safeDateValue(value);if(!v)return '';const m=/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/.exec(v);return m?`${m[3]}.${m[2]}.${m[1]}${m[4]?` ${m[4]}:${m[5]}`:''}`:v}
function dataActuality(){const v=displayDate(ctx?.dataUpdatedAt||ctx?.updatedAt||ctx?.asOf);return v?`Данные актуальны на ${v}`:'Данные предоставлены RONA Trade'}
function semanticClass(semantic){return SEMANTIC_CLASS[semantic]||SEMANTIC_CLASS.pending}
function statusBadge(label,semantic='pending'){return `<span class="status ${semanticClass(semantic)}">${esc(label)}</span>`}
function neutralAccessLabel(label){return `<span class="access-label">${esc(label)}</span>`}

function mapStatus(raw,map){const k=enumKey(raw);return map[k]||{label:'Требует уточнения',semantic:'pending'}}
function displayPublicationStatus(raw){return mapStatus(raw,{PUBLISHED:{label:'Опубликовано',semantic:'positive'},NOT_PUBLISHED:{label:'Не опубликовано',semantic:'pending'},PENDING:{label:'Ожидает публикации',semantic:'pending'},HOLD:{label:'На проверке',semantic:'pending'},TO_VERIFY:{label:'Требует уточнения',semantic:'pending'},REJECTED:{label:'Отклонено',semantic:'critical'},BLOCKED:{label:'Заблокировано',semantic:'critical'},ERROR:{label:'Ошибка',semantic:'critical'}})}
function displaySettlementStatus(raw,paymentFactConfirmed=false){const k=enumKey(raw);if(k==='PAID')return paymentFactConfirmed===true?{label:'Оплачено',semantic:'positive'}:{label:'Оплата требует подтверждения',semantic:'pending'};return mapStatus(raw,{PROJECTED:{label:'Прогноз',semantic:'pending'},CURRENT_ESTIMATE:{label:'Текущая оценка',semantic:'pending'},FINAL:{label:'Итоговый расчёт',semantic:'pending'},FINAL_READY:{label:'Итоговый расчёт подготовлен',semantic:'pending'},FINAL_AWAITING:{label:'Ожидает итогового расчёта',semantic:'pending'},AGENT_REVIEW:{label:'На рассмотрении агента',semantic:'pending'},AGENT_ACCEPTED:{label:'Принято агентом',semantic:'pending'},ACCEPTED:{label:'Принято агентом',semantic:'pending'},CLARIFICATION:{label:'Требуется уточнение',semantic:'pending'},DISPUTED:{label:'Есть разногласия',semantic:'critical'},INTERNAL_RESOLUTION:{label:'Внутреннее урегулирование',semantic:'pending'},INVOICE_RECEIVED:{label:'Счёт получен',semantic:'pending'},ACCEPTED_FOR_PAYMENT:{label:'Принято к оплате',semantic:'pending'},PAYMENT_HOLD:{label:'Оплата приостановлена',semantic:'pending'},HOLD:{label:'На проверке',semantic:'pending'},TO_VERIFY:{label:'Требует уточнения',semantic:'pending'},CANCELLED:{label:'Отменено',semantic:'critical'},REJECTED:{label:'Отклонено',semantic:'critical'},BLOCKED:{label:'Заблокировано',semantic:'critical'},ERROR:{label:'Ошибка',semantic:'critical'}})}

function displayDocumentStatus(raw){return mapStatus(raw,{SIGNED:{label:'Подписан',semantic:'positive'},REGISTERED:{label:'Зарегистрирован',semantic:'positive'},APPROVED:{label:'Подтверждён',semantic:'positive'},PUBLISHED:{label:'Опубликован',semantic:'positive'},DRAFT:{label:'В подготовке',semantic:'pending'},PENDING:{label:'На проверке',semantic:'pending'},HOLD:{label:'На проверке',semantic:'pending'},TO_VERIFY:{label:'Требует уточнения',semantic:'pending'},REJECTED:{label:'Отклонён',semantic:'critical'},BLOCKED:{label:'Заблокирован',semantic:'critical'},ERROR:{label:'Ошибка',semantic:'critical'}})}
function displayAccessMode(raw){const k=enumKey(raw);if(k==='AGENT_DISTRIBUTION')return 'Разрешено к распространению';if(k==='AGENT_VIEW')return 'Только просмотр';return 'Доступ не подтверждён'}
function displayTermsStatus(raw){return mapStatus(raw,{CONFIRMED:{label:'Условия подтверждены',semantic:'positive'},SIGNED:{label:'Условия оформлены',semantic:'positive'},MISSING_ADDENDUM:{label:'Требуется дополнительное соглашение',semantic:'critical'},LEGAL_HARMONIZATION:{label:'Юридическое согласование',semantic:'pending'},HOLD:{label:'На проверке',semantic:'pending'},TO_VERIFY:{label:'Требует уточнения',semantic:'pending'},REJECTED:{label:'Отклонено',semantic:'critical'}})}
function displayResource(raw){const k=enumKey(raw);if(['CONFIRMED','APPROVED','AVAILABLE'].includes(k))return 'Подтверждён';if(['NOT_CONFIRMED','UNCONFIRMED','HOLD','TO_VERIFY','PENDING'].includes(k))return 'Не подтверждён';if(['REJECTED','BLOCKED','ERROR'].includes(k))return 'Заблокирован';const v=text(raw);return v&&!/^[A-Z0-9_ -]+$/.test(v)?v:'Требует уточнения'}
function displayPayment(raw){const k=enumKey(raw);if(k==='PAID')return 'Оплачено';if(['CONFIRMED','RECEIVED'].includes(k))return 'Подтверждено';if(['PENDING','HOLD','TO_VERIFY','NOT_PAID','UNPAID'].includes(k))return 'Не подтверждено';if(['REJECTED','BLOCKED','ERROR'].includes(k))return 'Заблокировано';const v=text(raw);return v&&!/^[A-Z0-9_ -]+$/.test(v)?v:'Требует уточнения'}
function displayDocumentType(raw){const k=enumKey(raw);const m={CONTRACT:'Договор',ADDENDUM:'Дополнительное соглашение',INVOICE:'Инвойс',ACT:'Акт',STATEMENT:'Выписка',REPORT:'Отчёт',AGREEMENT:'Соглашение',APPLICATION:'Заявка',CLAIM:'Претензия',OTHER:'Документ'};return m[k]||(!/^[A-Z0-9_ -]+$/.test(text(raw))?text(raw):'Документ')}

function timelineHtml(id){return `<div class="timeline">${arr(DATA.timeline[id]).map((s,i)=>{const labelRaw=Array.isArray(s)?s[0]:(s?.label||s?.name||s?.title||`Этап ${i+1}`);const raw=Array.isArray(s)?s[1]:(s?.status||s?.state||'');const label=displayLifecycleLabel(labelRaw);return `<div class="step ${timelineClass(raw)}"><div class="n">${i+1}</div><strong>${esc(label)}</strong></div>`}).join('')}</div>`}

function dealCard(d){const st=displayDealStatus(d.status);const terms=displayTermsStatus(d.termsStatus);return `<div class="card deal-card"><div class="deal-top"><div><div class="eyebrow">${esc(d.application||d.applicationId||'')}</div><h3><button class="linkbtn" onclick="openDeal('${esc(d.id)}')">${esc(d.id)}</button> · ${esc(clientName(d.client))}</h3><div class="small">${esc(d.product||'')}</div></div>${statusBadge(st.label,st.semantic)}</div><div class="deal-meta"><div class="fact"><span>Объём</span><strong>${esc(d.qty||'—')}</strong></div><div class="fact"><span>Цена / базис</span><strong>${esc(d.price||'—')} · ${esc(d.basis||'—')}</strong></div><div class="fact"><span>Агентская модель</span><strong>${esc(modelLabel(d))}</strong></div></div>${timelineHtml(d.id)}<div class="notice ${terms.semantic==='critical'?'red-note':terms.semantic==='positive'?'green-note':''}"><b>Агентские условия:</b> ${esc(terms.label)}. ${esc(safePublicText(d.termsPublicNote||d.termsNote,'Дополнительные сведения не опубликованы.'))}</div></div>`}

function renderClients(){const cs=scopedClients();$('#page-clients').innerHTML=`<div class="page-head"><div><h1>Мои клиенты</h1><p class="sub">Показываются только компании, закреплённые за текущим агентом сервером.</p></div><div class="asof">ИД агента: ${esc(ctx?.agentPersonId||'—')}</div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>ИД клиента</th><th>Компания</th><th>ИД договора</th><th>Сделки</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${esc(c.id||c.clientId)}</b></td><td>${esc(c.name)}</td><td>${esc(c.contract||c.contractId||'—')}</td><td>${arr(c.deals).map(x=>esc(x)).join('<br>')||'—'}</td></tr>`).join('')}</tbody></table></div>${cs.length?'':'<div class="empty"><strong>Закреплённых клиентов нет</strong></div>'}</div>`}
function visiblePriceItems(){const pub=DATA.pricePublication||{items:[]};if(enumKey(pub.publicationStatus)!=='PUBLISHED')return [];return arr(pub.items).filter(x=>enumKey(x.status)==='PUBLISHED'&&['AGENT_VIEW','AGENT_DISTRIBUTION'].includes(enumKey(x.audience)))}

function validate(input){
 if(!input||typeof input!=='object')return 'Серверный контекст отсутствует.';

 for(const c of clients){const e=scopeError(c,'карточке клиента',null);if(e)return e}
 const deals=arr(input.deals),dealIds=new Set(),dealClient=new Map();
 for(const d of deals){const did=text(d.dealId||d.id),cid=text(d.clientId||d.client);if(!did||dealIds.has(did))return 'Некорректный список разрешённых ИД сделок.';if(d.agentPersonId&&text(d.agentPersonId)!==agentId)return 'Нарушена серверная изоляция в сделках.';if(!cid||!ids.has(cid))return 'Сделка относится к незакреплённому клиенту.';dealIds.add(did);dealClient.set(did,cid)}
 for(const c of clients){const cid=text(c.clientId||c.id);for(const did0 of arr(c.deals)){const did=text(did0);if(!dealIds.has(did)||dealClient.get(did)!==cid)return 'Карточка клиента содержит неразрешённую сделку.'}}
 for(const bucket of ['applications','economics','settlements','documents','messages'])for(const item of arr(input[bucket])){const e=scopeError(item,bucketLabel(bucket),dealIds);if(e)return e;if(bucket==='economics')for(const row of arr(item.rows)){const er=scopeError(row,'строках экономики',dealIds);if(er)return er}}

 if(pub){const e=scopeError(pub,'публикации цен',dealIds);if(e)return e;for(const p of arr(pub.items)){const ep=scopeError(p,'ценах',dealIds);if(ep)return ep}}
 for(const p of arr(input.prices)){const ep=scopeError(p,'ценах',dealIds);if(ep)return ep}
 if(input.timeline&&typeof input.timeline==='object')for(const [did,steps] of Object.entries(input.timeline)){if(!dealIds.has(text(did)))return 'Жизненный цикл относится к неразрешённой сделке.';for(const step of arr(steps)){if(step&&typeof step==='object'&&!Array.isArray(step)){const et=scopeError(step,'этапах сделки',dealIds);if(et)return et}}}
 return ''
}

<script id="rona-unified-ux-v042-js">
(function(){
  if(window.__RONA_UNIFIED_UX__) return; window.__RONA_UNIFIED_UX__=true;
  const qs=(s,r=document)=>r.querySelector(s), qsa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const navHistory=[];let suppressRecord=false;
  function activePage(){return qs('.page.active')?.id?.replace(/^page-/,'')||'home'}
  function home(){suppressRecord=true;try{const b=qs('[data-page="home"]');if(b){b.click();return}if(typeof window.showPage==='function')window.showPage('home')}finally{setTimeout(()=>suppressRecord=false,0)}}
  function goBack(){const current=activePage();while(navHistory.length&&navHistory[navHistory.length-1]===current)navHistory.pop();const prev=navHistory.pop();if(prev){suppressRecord=true;try{const b=qsa('[data-page]').find(x=>x.dataset.page===prev);if(b){b.click();return}if(typeof window.showPage==='function')return window.showPage(prev)}finally{setTimeout(()=>suppressRecord=false,0)}}home()}
  function record(from,to){if(suppressRecord)return;if(from&&to&&from!==to){if(!navHistory.length||navHistory[navHistory.length-1]!==from)navHistory.push(from);if(navHistory.length>30)navHistory.shift()}}
  function wrapNavigation(){if(typeof window.showPage==='function'&&!window.showPage.__ronaWrapped){const old=window.showPage;const f=function(page,...rest){const from=activePage(),out=old.call(this,page,...rest);record(from,page);setTimeout(refresh,0);return out};f.__ronaWrapped=true;window.showPage=f}}
  function collapsePage(page,collapse){qsa('.panel,.card',page).forEach(p=>{const h=qs(':scope > .panel-head, :scope > .card-head',p);if(!h)return;p.classList.toggle('rona-collapsed',collapse);const b=qs('.rona-collapse-btn',h);if(b){b.setAttribute('aria-expanded',String(!collapse));if(b.lastChild)b.lastChild.textContent=collapse?' Развернуть':' Свернуть'}})}
  function installBackbars(){qsa('.page').forEach(page=>{let bar=qs(':scope > .rona-ux-backbar',page);if(!bar){bar=document.createElement('div');bar.className='rona-ux-backbar';bar.innerHTML='<div class="rona-ux-back-left"><button type="button" class="rona-ux-navbtn rona-go-back">← Назад</button><button type="button" class="rona-ux-navbtn rona-go-home">⌂ На главную</button><span class="rona-ux-back-label"></span></div><div class="rona-ux-back-right"><button type="button" class="rona-collapse-all" data-mode="collapse">Свернуть разделы</button><button type="button" class="rona-collapse-all" data-mode="expand">Развернуть разделы</button></div>';page.insertBefore(bar,page.firstChild);qs('.rona-go-back',bar).onclick=goBack;qs('.rona-go-home',bar).onclick=home;qs('[data-mode="collapse"]',bar).onclick=()=>collapsePage(page,true);qs('[data-mode="expand"]',bar).onclick=()=>collapsePage(page,false)}const name=page.id==='page-home'?'Главная':(qs('.page-head h1,.title-row h1,h1',page)?.textContent||page.id.replace(/^page-/,'')).trim();const label=qs('.rona-ux-back-label',bar);if(label)label.textContent=name;bar.hidden=page.id==='page-home'})}
  function installCollapsibles(){qsa('.panel,.card').forEach(p=>{const h=qs(':scope > .panel-head, :scope > .card-head',p);if(!h||qs(':scope > .rona-collapse-btn',h))return;const b=document.createElement('button');b.type='button';b.className='rona-collapse-btn';b.setAttribute('aria-expanded','true');b.innerHTML='<span class="rona-collapse-chevron">▾</span>Свернуть';b.onclick=e=>{e.stopPropagation();const c=p.classList.toggle('rona-collapsed');b.setAttribute('aria-expanded',String(!c));b.lastChild.textContent=c?' Развернуть':' Свернуть'};h.appendChild(b)})}
  function refresh(){installBackbars();installCollapsibles()}
  wrapNavigation();refresh();window.RONA_REFRESH_UX=refresh;
  document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-page-link]');if(b){const from=activePage(),to=b.dataset.page||b.dataset.pageLink;record(from,to);setTimeout(refresh,0)}},true);
})();
</script>
